<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Surat dari Razan 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .status{font-size:11.5px;color:var(--muted);text-align:center;min-height:1.2em;margin:-.3rem 0 .7rem}
  .status.err{color:#b4554a}
  .status button{border:none;background:none;color:var(--rose);font-weight:600;text-decoration:underline;cursor:pointer;font-size:11.5px}
  .hero{position:relative;display:block;width:100%;border:none;cursor:pointer;text-align:center;border-radius:24px;padding:1.3rem 1rem 1.2rem;background:linear-gradient(150deg,#fff 0%,#fdeee8 55%,#f6d6cc 100%);border:1px solid rgba(193,122,111,.22);box-shadow:0 12px 30px rgba(193,122,111,.18);margin-bottom:.9rem;font-family:inherit;color:inherit}
  .hero .env{font-size:3.4rem;line-height:1;display:block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
  .hero .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:.5rem}
  .hero h2{font-size:clamp(1.1rem,5.5vw,1.3rem);font-weight:700;color:var(--deep);line-height:1.25;margin:.15rem 0 .2rem}
  .hero p{font-size:12px;color:var(--muted)}
  .hero .go{display:inline-block;margin-top:.7rem;padding:.6rem 1.15rem;border-radius:50px;background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;font-size:13px;font-weight:700;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.05)}}
  .list{display:flex;flex-direction:column;gap:.5rem}
  .it{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:#fff;border:1px solid rgba(193,122,111,.14);border-radius:16px;padding:.7rem .8rem;cursor:pointer;font-family:inherit;color:inherit}
  .it .e{flex:0 0 42px;height:42px;border-radius:12px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:1.35rem}
  .it .tx{flex:1;min-width:0}
  .it b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .dot{flex:0 0 9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px rgba(193,122,111,.18)}
  .it.lock{cursor:default;background:rgba(255,255,255,.55);border-style:dashed}
  .it.lock .e{filter:grayscale(.5);opacity:.75}
  .kalau{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
  .kl{position:relative;border:none;border-radius:16px;padding:.85rem .7rem .8rem;text-align:left;cursor:pointer;font-family:inherit;color:var(--deep);background:linear-gradient(160deg,#fffaf3,#f7e6d6);box-shadow:0 4px 12px rgba(193,122,111,.1);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
  .kl .e{font-size:1.5rem}
  .kl span{font-size:12px;font-weight:600;line-height:1.35}
  .kl small{font-size:10px;color:var(--muted);font-weight:400}
  .kl.read{opacity:.8}
  /* surat */
  .ltr-ov{position:fixed;inset:0;z-index:50;background:rgba(45,31,26,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1rem}
  .ltr-ov.show{display:flex}
  .ltr{position:relative;width:100%;max-width:390px;max-height:90vh;overflow-y:auto;background:#fffdf8;border-radius:20px;padding:2.1rem 1.2rem 1rem;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:gPop .45s cubic-bezier(.3,1.4,.5,1)}
  .seal{position:relative;margin:-.9rem auto .7rem;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7b9ad,#c17a6f 55%,#7a3f35);display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2}
  .ltr .meta{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .ltr h2{text-align:center;font-size:1.05rem;font-weight:700;color:var(--deep);margin:.2rem 0 .7rem;line-height:1.3}
  .paper{font-family:'Caveat',cursive;font-size:1.42rem;line-height:31px;color:#7a3f35;white-space:pre-wrap;word-wrap:break-word;min-height:93px;background-image:repeating-linear-gradient(transparent 0 30px,rgba(193,122,111,.13) 30px 31px);padding-bottom:4px}
  .paper .sig{display:block;text-align:right;margin-top:.3rem}
  .cur{display:inline-block;width:2px;height:1.05em;background:#7a3f35;vertical-align:-3px;animation:bl .7s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  .skip{display:block;margin:.3rem auto 0;border:none;background:none;font-size:11px;color:var(--muted);cursor:pointer}
  .after{display:none;margin-top:.9rem}
  .after.show{display:block;animation:gPop .35s ease}
  .reacts{display:flex;justify-content:space-between;gap:.25rem}
  .reacts button{flex:1;min-width:0;aspect-ratio:1;max-width:48px;border-radius:50%;border:1.5px solid var(--blush);background:#fff;font-size:1.25rem;cursor:pointer;padding:0}
  .reacts button.on{background:var(--rose);border-color:var(--rose);transform:scale(1.12)}
  .rep{margin-top:.6rem}
  .sent{font-size:12px;background:var(--warm);border-radius:12px;padding:.6rem .75rem;color:var(--deep);margin-top:.6rem;line-height:1.55;white-space:pre-wrap}
  .x{display:block;width:100%;margin-top:.4rem;padding:.6rem;border:none;background:none;font-size:12.5px;color:var(--muted);cursor:pointer}
  /* admin */
  .adm-link{display:block;margin:1.6rem auto 0;border:none;background:none;font-size:11.5px;color:var(--muted);cursor:pointer;text-decoration:underline}
  .adm-bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:linear-gradient(135deg,#eaf1fb,#fff);border:1px solid #c9daf2;border-radius:16px;padding:.65rem .8rem;margin-bottom:.8rem;font-size:12px;color:var(--rz)}
  .adm-bar button{border:none;background:#fff;border:1px solid #c9daf2;color:var(--rz);border-radius:50px;padding:.35rem .75rem;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .seg{display:flex;background:var(--warm);border-radius:50px;padding:3px}
  .seg button{flex:1;border:none;background:none;border-radius:50px;padding:.55rem .3rem;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .seg button.on{background:#fff;color:var(--deep);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .emo{display:flex;gap:.3rem;flex-wrap:wrap}
  .emo button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--blush);background:#fff;font-size:1.1rem;cursor:pointer;padding:0}
  .emo button.on{border-color:var(--rose);background:#fdeee8}
  .ta.big{min-height:180px;line-height:1.6}
  .cnt{font-size:10.5px;color:var(--muted);text-align:right;margin-top:.2rem}
  .ad-it{background:#fff;border:1px solid rgba(193,122,111,.14);border-radius:16px;padding:.75rem .8rem}
  .ad-it .r1{display:flex;gap:.6rem;align-items:center}
  .ad-it .r1 .e{font-size:1.3rem}
  .ad-it .r1 .tx{flex:1;min-width:0}
  .ad-it b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ad-it small{display:block;font-size:10.5px;color:var(--muted)}
  .ad-it .acts{display:flex;gap:.3rem}
  .ad-it .acts button{border:1px solid var(--blush);background:#fff;border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:13px;padding:0}
  .ad-it .rx{margin-top:.5rem;font-size:11.5px;background:var(--warm);border-radius:10px;padding:.5rem .65rem;line-height:1.5;color:var(--deep);white-space:pre-wrap}
  .tag{display:inline-block;font-size:10px;padding:.1rem .45rem;border-radius:20px;background:#eef6ec;color:#4d7a45;font-weight:600;margin-right:.25rem}
  .tag.w{background:#fdf3e1;color:#a8782a}
  .tag.p{background:#eef2fb;color:var(--rz)}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span></span></div>
  <div class="head"><span class="ico">📬</span><p class="lbl">Kotak surat</p><h1 class="title">Surat dari <span>Razan</span></h1><p class="sub" id="sub">Surat-surat kecil yang Razan tulis buat kamu — ada yang kebuka di hari tertentu, ada yang boleh dibuka kapan aja kamu butuh 🤍</p></div>
  <p class="status" id="status"></p>
  <div id="adm"></div>
  <div id="main"></div>
  <button class="adm-link" id="adm-link" onclick="askPin()">✍️ Aku Razan — mau nulis surat</button>
</div>

<div class="ltr-ov" id="ltr-ov"><div class="ltr" id="ltr"></div></div>

<div class="ov" id="pin-ov"><div class="sheet"><div class="drag"></div>
  <h3 style="font-size:15px;font-weight:700;text-align:center">✍️ Mode Razan</h3>
  <p style="font-size:12px;color:var(--muted);text-align:center;margin:.3rem 0 .8rem">Masukin PIN (sama kayak Kapsul Waktu)</p>
  <input class="inp" id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" style="text-align:center;letter-spacing:.3em">
  <div class="row"><button class="btn ghost" onclick="closeOv('pin-ov')">Batal</button><button class="btn" onclick="tryPin()">Masuk</button></div>
</div></div>

<div class="ov" id="ed-ov"><div class="sheet"><div class="drag"></div>
  <h3 style="font-size:15px;font-weight:700;text-align:center" id="ed-h">✍️ Tulis surat</h3>
  <label class="lab">Jenis surat</label>
  <div class="seg" id="ed-kind"><button data-k="tgl">📅 Tanggal tertentu</button><button data-k="kalau">🫧 Buka kalau…</button></div>
  <div id="ed-tgl"><label class="lab">Kebuka tanggal</label><input class="inp" type="date" id="ed-date">

    <label class="lab">Judul <span style="font-weight:400;color:var(--muted)">(boleh kosong)</span></label><input class="inp" id="ed-title" maxlength="80" placeholder="mis. Semangat ujiannya sayang!">
    <div class="chips" id="ed-occ" style="margin-top:.45rem"></div></div>

    <input class="inp" id="ed-kt" maxlength="60" placeholder="…atau tulis sendiri" style="margin-top:.45rem"></div>

  <textarea class="ta big" id="ed-text" maxlength="4000" placeholder="Dara sayang, …"></textarea><p class="cnt" id="ed-cnt"></p>

<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

// ── SETELAN ── (URL dari surat-razan.gs)
const SURAT_URL = 'https://script.google.com/macros/s/AKfycbz14RB_aXdOTeLU23ffbclpi4IaPSW_35L5asbdd9x6Lnuw92XmiyEIWju8xy4nL973/exec';
const SURAT_KEY = 'razara-surat';

const DEFAULTS = [

/* ── data ── */
const getQ = () => lsGet(K_QUEUE, []) || [];
function items() {

  for (const q of getQ()) if (q.op === 'save') { const o = m.get(q.item.id); if (!o || (q.item.updated || 0) >= (o.updated || 0)) m.set(q.item.id, Object.assign({}, o || {}, q.item, { pending: true })); }

  if (!isAdmin()) { const have = new Set(all.filter(x => x.kind === 'kalau').map(x => (x.title || '').toLowerCase())); all = all.concat(DEFAULTS.filter(d => !have.has(d.title.toLowerCase())).map(d => Object.assign({}, d))); }
  for (const it of all) { const l = loc[it.id]; if (l) { if (!it.readAt) it.readAt = l.readAt; if (l.reaction != null) it.reaction = l.reaction; if (l.reply != null) it.reply = l.reply; } }

}
function api(method, body) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open(method, SURAT_URL + (method === 'GET' ? `?action=list&key=${encodeURIComponent(SURAT_KEY)}${isAdmin() ? '&pin=' + encodeURIComponent(pin) : ''}&t=${Date.now()}` : ''), true);
    x.timeout = 20000;
    if (method === 'POST') x.setRequestHeader('Content-Type', 'text/plain');
    x.onload = () => { try { const r = JSON.parse(x.responseText); r.ok ? res(r) : rej(Object.assign(new Error(r.error || 'gagal'), { code: r.error })); } catch (e) { rej(e); } };
    x.onerror = x.ontimeout = () => rej(new Error('jaringan'));

  });
}
async function load() {

  loading = true; renderStatus();

  catch (e) { online = false; }
  loading = false; render();
}
function enqueue(op) {

  if (op) q.push(op);

}
let flushing = false;
async function flush() {
  if (flushing || !SURAT_URL) return;
  flushing = true; let sent = 0;
  try {
    while (getQ().length) {
      const op = getQ()[0], stamp = JSON.stringify(op);
      try {
        if (op.op === 'save') await api('POST', { action: 'save', pin, item: op.item });
        else await api('POST', { action: 'react', id: op.id, readAt: op.readAt, reaction: op.reaction, reply: op.reply });
      } catch (e) {
        if (['data', 'locked', 'pin'].includes(e.code)) { if (e.code === 'pin') toast('⚠️ PIN ditolak server'); lsSet(K_QUEUE, getQ().slice(1)); continue; }
        online = false; break;
      }
      lsSet(K_QUEUE, getQ().filter(x => JSON.stringify(x) !== stamp));
      if (op.op === 'save') { const k = server.findIndex(x => x.id === op.item.id); const v = Object.assign({}, server[k] || {}, op.item); if (k >= 0) server[k] = v; else server.push(v); lsSet(K_CACHE, server.filter(x => !x.deleted)); }
      sent++;

  closeOv('ed-ov'); render(); toast(item.kind === 'tgl' && item.date > todayS() ? `🔒 Surat dijadwalin buat ${dLabel(item.date)}` : '💌 Surat kesimpen — Dara udah bisa baca'); vib(20);
}
function delL(id) {
  const it = items().find(x => x.id === id); if (!it || !confirm(`Hapus surat “${letterTitle(it)}”?`)) return;
  const item = Object.assign({}, it, { deleted: true, updated: Date.now() }); delete item.pending;
  if (!SURAT_URL) { server = server.filter(x => x.id !== id); lsSet(K_CACHE, server); } else enqueue({ op: 'save', item });
  render(); toast('🗑 Dihapus');
}

render(); load(); flush();
const _b = location.search.match(/[?&]buka=([\w-]+)/); if (_b) setTimeout(() => openL(_b[1]), 300);

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
