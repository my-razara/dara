<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Resep Kita — Razan & Dara 🥘</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .bd-st.err{color:#b4554a}
  .srch{display:flex;gap:.5rem;margin-bottom:.6rem}
  .srch .inp{flex:1}
  .cats{margin-bottom:.8rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .rc{background:#fff;border-radius:18px;padding:.8rem .75rem;border:1px solid rgba(193,122,111,.13);box-shadow:0 4px 14px rgba(193,122,111,.07);cursor:pointer;position:relative;min-width:0}
  .rc .e{font-size:2rem;display:block;line-height:1.2}
  .rc b{display:block;font-size:13px;font-weight:600;line-height:1.3;margin:.25rem 0;word-break:break-word}
  .rc small{display:block;font-size:10.5px;color:var(--muted)}
  .rc .by{position:absolute;top:.55rem;right:.6rem;font-size:9.5px;font-weight:600;padding:.08rem .45rem;border-radius:20px;color:#fff}
  .by.Razan{background:var(--rz)}.by.Dara{background:var(--dr)}.by.Berdua{background:var(--gold)}
  .rc .fav{position:absolute;bottom:.5rem;right:.6rem;font-size:12px}
  .det .e{font-size:3rem;text-align:center;display:block}
  .det h2{text-align:center;font-size:1.3rem;font-weight:700;line-height:1.25}
  .det .meta{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .9rem}
  .det .meta span{font-size:11px;background:#fff;border-radius:20px;padding:.2rem .6rem;color:var(--deep);border:1px solid rgba(193,122,111,.15)}
  .det h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:1rem 0 .45rem}
  .ing label{display:flex;gap:.55rem;align-items:flex-start;font-size:13px;padding:.35rem 0;border-bottom:1px dashed rgba(193,122,111,.15);cursor:pointer}
  .ing input{margin-top:.2rem;accent-color:var(--rose);width:16px;height:16px;flex-shrink:0}
  .ing label.ok{color:var(--muted);text-decoration:line-through}
  .stp{counter-reset:s}
  .stp p{position:relative;padding:.3rem 0 .55rem 2rem;font-size:13px;line-height:1.55}
  .stp p::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.3rem;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--warm);color:var(--deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .note{background:#fffaf0;border-left:3px solid var(--gold);border-radius:10px;padding:.6rem .8rem;font-size:12.5px;line-height:1.55;font-family:'Caveat',cursive;font-size:1.15rem}
  .log{font-size:11.5px;color:var(--muted);text-align:center;margin-top:.8rem;line-height:1.6}
  /* mode masak */
  #cook{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#fff7ef,#fde6dc);display:none;flex-direction:column;padding:calc(1rem + env(safe-area-inset-top)) 1.1rem calc(1rem + env(safe-area-inset-bottom))}
  #cook.show{display:flex}
  #cook .ctop{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  #ck-n{min-width:0;overflow:hidden;text-overflow:ellipsis}
  #cook .prog{height:6px;border-radius:3px;background:rgba(193,122,111,.15);margin:.8rem 0;overflow:hidden}
  #cook .prog i{display:block;height:100%;background:var(--rose);transition:width .3s}
  #cook .cn{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center}
  #cook .ct{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.15rem,5.5vw,1.45rem);line-height:1.5;font-weight:500;padding:0 .3rem;overflow-y:auto}
  #cook .tm{text-align:center;margin-bottom:.8rem}
  #cook .tm b{display:block;font-size:2.4rem;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums}
  #cook .tm b.ring{animation:ring .5s infinite}
  @keyframes ring{50%{color:#e0453a;transform:scale(1.08)}}
  .tmb{font-size:12.5px;padding:.5rem 1rem;border-radius:50px;border:1.5px solid var(--rose);background:#fff;color:var(--rose);font-weight:600;cursor:pointer}
  .lines{font-size:11px;color:var(--muted);margin-top:.25rem}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who-btn"></button></div>
  <div class="head"><span class="ico">🥘</span><p class="lbl">Dapur berdua</p><h1 class="title">Resep <span>Kita</span></h1><p class="sub">Kumpulan resep andalan kalian — masakan yang pernah dicoba bareng, menu rumah, sampai resep rahasia. Kesimpen berdua 🍳</p></div>
  <p class="bd-st" id="bd-st"></p>
  <div id="v-list">
    <div class="srch"><input class="inp" id="q" placeholder="🔍 Cari resep / bahan…"></div>
    <div class="chips cats" id="cats"></div>
    <button class="btn" onclick="openEd()" style="margin-bottom:.9rem">＋ Tulis resep baru</button>
    <div class="grid" id="grid"></div>
    <div id="starter"></div>
  </div>
  <div id="v-det" style="display:none" class="det"></div>
</div>
<div class="ov" id="ed-ov"><div class="sheet">
  <div class="drag"></div><h3 style="text-align:center;font-size:15px;margin-bottom:.3rem" id="ed-h">Resep baru</h3>
  <label class="lab">Nama masakan</label><input class="inp" id="ed-t" maxlength="60" placeholder="Contoh: Nasi goreng ala Razan">
  <label class="lab">Ikon</label><div class="chips" id="ed-e"></div>
  <label class="lab">Kategori</label><div class="chips" id="ed-k"></div>
  <div class="row"><div><label class="lab">⏱ Waktu (menit)</label><input class="inp" id="ed-w" type="number" min="1" max="600" placeholder="30"></div><div><label class="lab">🍽 Porsi</label><input class="inp" id="ed-p" type="number" min="1" max="50" placeholder="2"></div></div>
  <label class="lab">Resep punya siapa</label><div class="chips" id="ed-by"></div>
  <label class="lab">🧺 Bahan <span style="font-weight:400;color:var(--muted)">(satu baris satu bahan)</span></label><textarea class="ta" id="ed-b" rows="5" placeholder="2 butir telur&#10;1 piring nasi&#10;2 siung bawang putih"></textarea>
  <label class="lab">👩‍🍳 Langkah <span style="font-weight:400;color:var(--muted)">(satu baris satu langkah)</span></label><textarea class="ta" id="ed-s" rows="6" placeholder="Tumis bawang sampai harum&#10;Masukkan telur, orak-arik&#10;Masak 5 menit sambil diaduk"></textarea>
  <p class="lines">💡 Tulis "… 10 menit" di langkah → nanti muncul tombol timer otomatis</p>
  <label class="lab">📝 Catatan / cerita</label><textarea class="ta" id="ed-n" rows="2" placeholder="Pertama kali masak ini pas…"></textarea>
  <div class="row"><button class="btn ghost" onclick="closeOv('ed-ov')">Batal</button><button class="btn" onclick="saveEd()">Simpan</button></div>
</div></div>
<div id="cook">
  <div class="ctop"><button class="pill" onclick="closeCook()">✕ Selesai</button><span class="pill" id="ck-n" style="cursor:default"></span></div>
  <div class="prog"><i id="ck-p"></i></div>
  <p class="cn" id="ck-c"></p>
  <div class="ct" id="ck-t"></div>
  <div class="tm" id="ck-tm"></div>
  <div class="row" style="margin-top:0"><button class="btn ghost" id="ck-prev" onclick="cookGo(-1)">← Sebelumnya</button><button class="btn" id="ck-next" onclick="cookGo(1)">Lanjut →</button></div>
</div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, enabled: false };
const SLOT = '2000-01-01';
const EMO = ['🍳', '🍜', '🍝', '🍛', '🍲', '🥗', '🍔', '🌮', '🍕', '🍗', '🐟', '🍤', '🥟', '🍰', '🍪', '🧁', '🍮', '🥞', '🍹', '🧋', '☕', '🍌', '🥭', '🌶️'];
const CAT = [['makan', '🍛 Makanan berat'], ['cemil', '🍪 Cemilan'], ['manis', '🍰 Manis'], ['minum', '🧋 Minuman'], ['sarapan', '🥞 Sarapan']];
const STARTER = [
  { t: 'Indomie Telur Keju Tengah Malem', e: '🍜', k: 'makan', w: 10, p: 1, b: ['1 bungkus mie goreng', '1 butir telur', '1 lembar keju slice', 'Cabe rawit (opsional)'], s: ['Rebus air sampai mendidih', 'Masukkan mie, masak 3 menit', 'Tiriskan, campur sama bumbu', 'Ceplok telur setengah matang di atasnya', 'Taruh keju di atas mie yang masih panas, tunggu 1 menit sampai leleh'], n: 'Paling enak dimakan berdua sambil nonton 🤭' },
  { t: 'Pisang Goreng Krispi', e: '🍌', k: 'cemil', w: 20, p: 2, b: ['4 buah pisang kepok', '5 sdm tepung terigu', '2 sdm tepung beras', '1 sdm gula', 'Sejumput garam', 'Air secukupnya', 'Minyak buat goreng'], s: ['Campur tepung, gula, garam, kasih air dikit-dikit sampai kental', 'Belah pisang jadi 2 atau penyet tipis', 'Celup pisang ke adonan', 'Goreng di minyak panas 5 menit sampai kuning keemasan', 'Angkat & tiriskan'], n: '' },
  { t: 'Es Kopi Susu Gula Aren', e: '🧋', k: 'minum', w: 5, p: 1, b: ['2 sdt kopi bubuk / 1 shot espresso', '50 ml air panas', '150 ml susu cair dingin', '2 sdm gula aren cair', 'Es batu'], s: ['Seduh kopi pakai air panas, diamkan 2 menit lalu saring', 'Masukkan gula aren ke gelas', 'Tambah es batu & susu', 'Tuang kopi pelan-pelan dari atas biar berlapis'], n: '' }
];
if (lsGet('resep-me', null) == null) lsSet('resep-me', BD.me());
let me = whoBtn('resep-me', () => { me = lsGet('resep-me', 'Dara'); BD.setMe(me); });
BD.setMe(me);
let cat = '', q = '', cur = null, ed = null, cook = null, tmr = null;
const uid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function mine(w) { return ((lsGet('resep-' + w, {}) || {})[SLOT] || {}).items || []; }
function all() { return mine('Razan').map(x => Object.assign({ owner: 'Razan' }, x)).concat(mine('Dara').map(x => Object.assign({ owner: 'Dara' }, x))); }
function strip(x) { const o = Object.assign({}, x); delete o.owner; return o; }
function save(x) { const own = x.owner || me, arr = mine(own).filter(y => y.id !== x.id); arr.push(strip(x)); BD.put('resep', own, SLOT, { items: arr }); }
function remove(x) { const arr = mine(x.owner).filter(y => y.id !== x.id); BD.put('resep', x.owner, SLOT, arr.length ? { items: arr } : null); }
const find = id => all().find(x => x.id === id);
function bdStatus() { const el = $('bd-st'), t = BD.status(); el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function closeOv(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));
$('q').addEventListener('input', () => { q = $('q').value.trim().toLowerCase(); renderList(); });
function renderList() {
  bdStatus();
  $('cats').innerHTML = [['', '✨ Semua']].concat(CAT, [['fav', '⭐ Favorit']]).map(([k, n]) => `<button class="${cat === k ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.k; renderList(); });
  let L = all();
  if (cat === 'fav') L = L.filter(x => x.fav); else if (cat) L = L.filter(x => x.k === cat);
  if (q) L = L.filter(x => (x.t + ' ' + (x.b || []).join(' ')).toLowerCase().includes(q));
  L.sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (b.at || 0) - (a.at || 0));
  $('grid').innerHTML = L.map(x => `<div class="rc" data-id="${x.id}"><span class="by ${x.by || x.owner}">${x.by || x.owner}</span><span class="e">${esc(x.e || '🍳')}</span><b>${esc(x.t)}</b><small>${x.w ? '⏱ ' + x.w + ' mnt' : ''}${x.w && x.p ? ' · ' : ''}${x.p ? '🍽 ' + x.p + ' porsi' : ''}</small><small>${x.cooked ? '👩‍🍳 dimasak ' + x.cooked + 'x' : 'belum pernah dimasak'}</small>${x.fav ? '<span class="fav">⭐</span>' : ''}</div>`).join('');
  $('grid').querySelectorAll('.rc').forEach(c => c.onclick = () => openDet(c.dataset.id));
  const none = !all().length;
  $('starter').innerHTML = none ? `<p class="empty">Buku resepnya masih kosong 📖<br>Tulis resep pertama kalian, atau mulai dari contoh:</p><button class="btn ghost" onclick="addStarter()">➕ Tambahin 3 resep contoh</button>` : (!L.length ? '<p class="empty">Ga ketemu resep yang cocok 🤔</p>' : '');
}
function addStarter() { const arr = mine(me); STARTER.forEach(s => arr.push(Object.assign({ id: uid(), by: 'Berdua', at: Date.now() }, s))); BD.put('resep', me, SLOT, { items: arr }); renderList(); toast('📖 3 resep contoh ditambah — edit sesukanya ya'); }
function timeIn(s) { const m = /(\d+)\s*(menit|mnt|min|detik|dtk|jam)/i.exec(s); if (!m) return 0; const n = +m[1], u = m[2].toLowerCase(); return u.startsWith('j') ? n * 3600 : u.startsWith('d') ? n : n * 60; }
function openDet(id) {
  const x = find(id); if (!x) return; cur = id;
  const ck = lsGet('resep-ck-' + id, []);
  $('v-list').style.display = 'none'; $('v-det').style.display = '';
  $('v-det').innerHTML = `<button class="pill" onclick="back()" style="margin-bottom:.6rem">← Semua resep</button>
    <span class="e">${esc(x.e || '🍳')}</span><h2>${esc(x.t)}</h2>
    <div class="meta"><span>${(CAT.find(c => c[0] === x.k) || ['', '🍽 Lainnya'])[1]}</span>${x.w ? `<span>⏱ ${x.w} menit</span>` : ''}${x.p ? `<span>🍽 ${x.p} porsi</span>` : ''}<span>✍️ ${esc(x.by || x.owner)}</span></div>
    <button class="btn" onclick="startCook()">👩‍🍳 Mulai masak (mode langkah)</button>
    <div class="row"><button class="btn ghost" onclick="toggleFav()">${x.fav ? '⭐ Favorit' : '☆ Jadiin favorit'}</button><button class="btn ghost" onclick="shareR()">💬 Kirim</button></div>
    ${x.b && x.b.length ? `<h3>🧺 Bahan</h3><div class="ing">${x.b.map((b, i) => `<label class="${ck.includes(i) ? 'ok' : ''}"><input type="checkbox" data-i="${i}" ${ck.includes(i) ? 'checked' : ''}>${esc(b)}</label>`).join('')}</div>` : ''}
    ${x.s && x.s.length ? `<h3>👩‍🍳 Langkah</h3><div class="stp">${x.s.map(s => `<p>${esc(s)}</p>`).join('')}</div>` : ''}
    ${x.n ? `<h3>📝 Catatan</h3><div class="note">${esc(x.n)}</div>` : ''}
    <p class="log">${x.cooked ? `Udah dimasak <b>${x.cooked}x</b> · terakhir ${fmtD(new Date(x.last))}` : 'Belum pernah dimasak — kapan nih? 😋'}</p>
    <div class="row"><button class="btn ghost" onclick="openEd('${x.id}')">✏️ Edit</button><button class="btn ghost" onclick="delR()">🗑 Hapus</button></div>`;
  $('v-det').querySelectorAll('.ing input').forEach(c => c.onchange = () => { const s = new Set(lsGet('resep-ck-' + id, [])); c.checked ? s.add(+c.dataset.i) : s.delete(+c.dataset.i); lsSet('resep-ck-' + id, [...s]); c.parentNode.classList.toggle('ok', c.checked); });
  window.scrollTo(0, 0);
}
function back() { cur = null; $('v-det').style.display = 'none'; $('v-list').style.display = ''; renderList(); }
function toggleFav() { const x = find(cur); x.fav = !x.fav; save(x); openDet(cur); }
function delR() { const x = find(cur); if (!confirm(`Hapus resep "${x.t}"?`)) return; remove(x); back(); toast('🗑 Resep dihapus'); }
function shareR() { const x = find(cur); const t = `🥘 *${x.t}*\n${x.w ? '⏱ ' + x.w + ' menit · ' : ''}${x.p ? x.p + ' porsi' : ''}\n\n🧺 Bahan:\n${(x.b || []).map(b => '• ' + b).join('\n')}\n\n👩‍🍳 Langkah:\n${(x.s || []).map((s, i) => (i + 1) + '. ' + s).join('\n')}${x.n ? '\n\n📝 ' + x.n : ''}`; window.open(waLink(otherOf(me), t), '_blank'); }
function chips(id, list, val, set) { $(id).innerHTML = list.map(([k, n]) => `<button class="${val === k ? 'on' : ''}" data-k="${k}">${n}</button>`).join(''); $(id).querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.k); chips(id, list, b.dataset.k, set); }); }
function openEd(id) {
  const x = id ? find(id) : null;
  ed = x ? Object.assign({}, x) : { id: uid(), e: '🍳', k: 'makan', by: me, owner: me };
  $('ed-h').textContent = x ? 'Edit resep' : 'Resep baru';
  $('ed-t').value = ed.t || ''; $('ed-w').value = ed.w || ''; $('ed-p').value = ed.p || ''; $('ed-b').value = (ed.b || []).join('\n'); $('ed-s').value = (ed.s || []).join('\n'); $('ed-n').value = ed.n || '';
  chips('ed-e', EMO.map(e => [e, e]), ed.e, v => ed.e = v);
  chips('ed-k', CAT, ed.k, v => ed.k = v);
  chips('ed-by', [['Razan', '💙 Razan'], ['Dara', '💗 Dara'], ['Berdua', '💛 Berdua']], ed.by || me, v => ed.by = v);
  $('ed-ov').classList.add('show');
}
function saveEd() {
  const t = $('ed-t').value.trim(); if (!t) { toast('Nama masakannya diisi dulu ya'); return; }
  const lines = id => $(id).value.split('\n').map(s => s.trim().replace(/^[-•*\d.)\s]+(?=\S)/, '')).filter(Boolean);
  Object.assign(ed, { t, w: +$('ed-w').value || 0, p: +$('ed-p').value || 0, b: lines('ed-b'), s: lines('ed-s'), n: $('ed-n').value.trim(), at: ed.at || Date.now() });
  save(ed); closeOv('ed-ov'); vib(15); toast(`🥘 Kesimpen${BD.enabled ? ` · ${otherOf(me)} bisa liat` : ''}`);
  cur ? openDet(ed.id) : renderList();
}
// ── mode masak ──
function startCook() { const x = find(cur); if (!x.s || !x.s.length) { toast('Resep ini belum ada langkahnya'); return; } cook = { x, i: 0 }; $('cook').classList.add('show'); document.documentElement.style.overflow = 'hidden'; try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => cook && (cook.lock = l)).catch(() => {}); } catch (e) {} paintCook(); }
function paintCook() {
  const { x, i } = cook, s = x.s[i], n = x.s.length;
  $('ck-n').textContent = x.e + ' ' + x.t; $('ck-p').style.width = ((i + 1) / n * 100) + '%';
  $('ck-c').textContent = `Langkah ${i + 1} dari ${n}`; $('ck-t').textContent = s;
  stopT(); const sec = timeIn(s);
  $('ck-tm').innerHTML = sec ? `<button class="tmb" onclick="runT(${sec})">⏱ Pasang timer ${fmtT(sec)}</button>` : '';
  $('ck-prev').disabled = i === 0; $('ck-next').textContent = i === n - 1 ? '✅ Selesai masak!' : 'Lanjut →';
}
const fmtT = s => s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function runT(sec) { stopT(); const end = Date.now() + sec * 1000; const tick = () => { const l = Math.max(0, Math.round((end - Date.now()) / 1000)); $('ck-tm').innerHTML = `<b class="${l ? '' : 'ring'}">${fmtT(l)}</b><button class="tmb" onclick="stopT();paintCook()">${l ? '✕ Batal timer' : '🔕 Oke, matiin'}</button>`; if (!l) { stopT(true); vib([300, 150, 300, 150, 300]); try { window.SFX && SFX.play('win'); } catch (e) {} } }; tick(); tmr = setInterval(tick, 500); }
function stopT(keep) { clearInterval(tmr); tmr = null; }
function cookGo(d) {
  const n = cook.x.s.length;
  if (d > 0 && cook.i === n - 1) { const x = find(cook.x.id); x.cooked = (x.cooked || 0) + 1; x.last = Date.now(); save(x); closeCook(); openDet(x.id); confetti(60); toast(`🎉 Mantap! Udah dimasak ${x.cooked}x`); lsSet('resep-ck-' + x.id, []); return; }
  cook.i = Math.max(0, Math.min(n - 1, cook.i + d)); vib(8); paintCook();
}
function closeCook() { stopT(); try { cook && cook.lock && cook.lock.release(); } catch (e) {} cook = null; $('cook').classList.remove('show'); document.documentElement.style.overflow = ''; }
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if (ev.apps.includes('resep')) { if (cur && $('v-det').style.display !== 'none' && find(cur)) openDet(cur); else if (!cook) renderList(); } });
renderList();

</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
