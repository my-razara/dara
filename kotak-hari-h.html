<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kotak Menuju Hari-H — Razan & Dara 📦</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .5rem}
  .rg{background:#fff;border-radius:22px;padding:.85rem;border:1px solid rgba(193,122,111,.13);margin-bottom:.8rem;box-shadow:0 6px 18px rgba(193,122,111,.08)}
  .rg .h{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
  .rg .h .e{font-size:2rem;line-height:1}.rg .h span.m{flex:1;min-width:0}.rg .h b{display:block;font-size:14px;overflow-wrap:anywhere}.rg .h small{display:block;font-size:11.5px;color:var(--muted)}
  .rg .h .hh{font:800 15px Poppins,sans-serif;color:var(--rose);white-space:nowrap}
  .bx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .b{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px solid #f0dcd4;background:#faf3ee;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-width:0;font-family:inherit;color:var(--ink);padding:0}
  .b .n{font:700 12px Poppins,sans-serif}.b small{font-size:8.5px;color:var(--muted);line-height:1}
  .b.lock{opacity:.55;cursor:default}
  .b.ready{background:linear-gradient(135deg,#ffd9e3,#f7b6c8);border-color:#e891a6;animation:khW 1.6s ease-in-out infinite}
  @keyframes khW{0%,100%{transform:none}50%{transform:scale(1.07) rotate(-2deg)}}
  .b.open{background:#fff;border-color:#e6d8cf}.b.open .n{font-size:1.15rem}
  .b.empty{border-style:dashed}
  .b.hari{border-width:2.5px}
  .note2{font-size:11.5px;color:var(--muted);text-align:center;margin-top:.55rem;line-height:1.5}
  .warn{font-size:11.5px;color:#9a5a20;background:#fff7e8;border-radius:12px;padding:.45rem .6rem;margin-top:.55rem}
  .row2{display:flex;gap:.4rem;margin-top:.6rem}.row2 button{flex:1;border:1.5px solid var(--blush);background:#fff;border-radius:50px;padding:.5rem;font:600 12px Poppins,sans-serif;color:var(--deep);cursor:pointer}
  .new{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;border:none;border-radius:22px;padding:.95rem;font:700 14px Poppins,sans-serif;color:#fff;background:linear-gradient(135deg,#e891a6,#c25a78);box-shadow:0 8px 22px rgba(194,90,120,.28);cursor:pointer;margin:.2rem 0 .8rem}
  .ed .it{background:#fff;border-radius:16px;padding:.65rem;border:1px solid rgba(193,122,111,.13);margin-bottom:.5rem}
  .ed .it .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:.35rem}
  .ed .it .t b{color:var(--deep);font-size:12.5px}
  .ed .it .r{display:flex;gap:.4rem}.ed .it .r .inp{padding:.55rem .6rem;font-size:13px}
  .ed .it .ta{min-height:58px;font-size:13px;margin-top:.35rem}
  .ed .it.done{opacity:.6}
  .rv{text-align:center}
  .rv .lid{font-size:4.5rem;display:block;animation:khO .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes khO{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
  .rv .ms{font-family:'Caveat',cursive;font-size:1.45rem;line-height:1.3;color:var(--deep);margin:.6rem 0;overflow-wrap:anywhere;white-space:pre-wrap}
  .rv .gf{display:inline-block;background:#fff3d6;border:1.5px dashed #e8b860;border-radius:14px;padding:.45rem .8rem;font-size:12.5px;color:#7a5410;margin-bottom:.4rem;overflow-wrap:anywhere}
  .rv small{display:block;font-size:11px;color:var(--muted);margin-bottom:.7rem}
  @media (max-width:340px){.bx{gap:3px}.b small{font-size:7.5px}}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill" id="back">← Menu utama</a><span class="pill" id="me-pill"></span></div>
  <div id="v-home">
    <div class="head" style="margin:.6rem 0 .7rem"><span class="ico">📦</span><p class="lbl">Satu kotak tiap hari</p><h1 class="title">Kotak Menuju <span>Hari-H</span></h1><p class="sub">Siapin kotak kejutan yang kebuka satu per hari sampai hari spesial — ultah, anniv, atau ketemuan 🎁</p></div>
    <p class="bd-st" id="bd-st"></p>
    <div id="forme"></div>
    <button class="new" id="new">📦 Siapin kotak buat <span id="ot-n"></span></button>
    <div id="mine"></div>
  </div>
  <div id="v-ed" style="display:none"></div>
</div>

<div class="ov" id="n-ov"><div class="sheet">
  <div class="drag"></div>
  <h3 style="text-align:center;font-size:15px;margin-bottom:.4rem">📦 Rangkaian kotak baru</h3>
  <label class="lab">Menuju apa?</label>
  <div class="row" style="margin-top:0"><input class="inp" id="n-e" maxlength="4" value="🎂" style="flex:0 0 64px;text-align:center"><input class="inp" id="n-t" maxlength="40" placeholder="Misal: Ultah Dara"></div>
  <label class="lab">Tanggal hari-H</label>
  <input class="inp" id="n-d" type="date">
  <label class="lab">Jumlah kotak (1 kotak per hari, yang terakhir pas hari-H)</label>
  <div class="chips" id="n-n"></div>
  <button class="btn" style="margin-top:.9rem" id="n-go">Lanjut isi kotaknya →</button>
  <button class="btn ghost" style="margin-top:.5rem" onclick="$('n-ov').classList.remove('show')">Batal</button>
</div></div>

<div class="ov center" id="r-ov"><div class="sheet rv" id="rv"></div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), status: () => '', on() {}, enabled: false };
const ME = (window.Who && Who.me()) || BD.me(), OT = otherOf(ME), WHO = ['Razan', 'Dara'];
$('me-pill').textContent = `🙋 ${ME}`; $('me-pill').className = 'pill ' + ME; $('ot-n').textContent = OT;
const D0 = '2000-01-01', TD = () => ymd(new Date());
const sets = w => ((((lsGet('kotakh-' + w, {}) || {})[D0]) || {}).list || []).filter(x => x && !x.del);
const opened = w => (((lsGet('kotakhb-' + w, {}) || {})[D0]) || {}).o || {};
const addD = (d, n) => { const x = parseYMD(d); x.setDate(x.getDate() + n); return ymd(x); };
const boxDate = (s, i) => addD(s.hari, -(s.n - 1 - i));
const daysTo = d => Math.round((parseYMD(d) - parseYMD(TD())) / 864e5);
const fmtS = d => { const x = parseYMD(d); return `${x.getDate()} ${BLN[x.getMonth()]}`; };
const notify = o => { try { window.Push && Push.notify(o); } catch (e) {} };
function saveMine(list) { BD.put('kotakh', ME, D0, { list: list.slice(-12), at: Date.now() }); }
const hh = s => { const n = daysTo(s.hari); return n > 0 ? `H-${n}` : n === 0 ? 'Hari-H 🎉' : 'udah lewat'; };
// ── tampilan utama ──
function boxesH(s, who) {
  const op = opened(s.to)[s.id] || {}, forMe = s.to === ME;
  return `<div class="bx">${[...Array(s.n)].map((_, i) => { const d = boxDate(s, i), b = (s.b || [])[i] || {}, isOpen = !!op[i], can = d <= TD(), last = i === s.n - 1;
    const cls = isOpen ? 'open' : can ? (forMe ? 'ready' : '') : 'lock';
    const inner = isOpen ? `<span class="n">${esc(b.e || '🎁')}</span>` : `<span class="n">${can && forMe ? '🎁' : can ? i + 1 : '🔒'}</span>`;
    return `<button class="b ${cls}${last ? ' hari' : ''}${!forMe && !(b.m) ? ' empty' : ''}" data-s="${esc(s.id)}" data-o="${esc(s.by)}" data-i="${i}">${inner}<small>${last ? 'H' : fmtS(d)}</small></button>`; }).join('')}</div>`;
}
function render() {
  const fm = sets(OT).filter(s => s.to === ME && daysTo(s.hari) >= -7).sort((a, b) => a.hari < b.hari ? -1 : 1);
  $('forme').innerHTML = fm.length ? `<p class="sec">🎁 Kotak buat kamu</p>` + fm.map(s => { const op = opened(ME)[s.id] || {}, ready = [...Array(s.n)].filter((_, i) => boxDate(s, i) <= TD() && !op[i]).length;
    return `<div class="rg"><div class="h"><span class="e">${esc(s.e)}</span><span class="m"><b>${esc(s.t)}</b><small>dari ${esc(s.by)} · ${fmtS(s.hari)}</small></span><span class="hh">${hh(s)}</span></div>${boxesH(s)}<p class="note2">${ready ? `🎁 ${ready} kotak bisa dibuka sekarang — tap yang goyang-goyang` : daysTo(boxDate(s, 0)) > 0 ? `Kotak pertama kebuka ${fmtS(boxDate(s, 0))} 🤫` : 'Kotak berikutnya kebuka besok 🤫'}</p></div>`; }).join('') : '';
  const mine = sets(ME).filter(s => daysTo(s.hari) >= -7).sort((a, b) => a.hari < b.hari ? -1 : 1);
  $('mine').innerHTML = mine.length ? `<p class="sec">📤 Bikinanmu</p>` + mine.map(s => { const op = opened(s.to)[s.id] || {}, nOp = Object.keys(op).length, empty = (s.b || []).slice(0, s.n).filter(b => !b || !b.m).length + Math.max(0, s.n - (s.b || []).length);
    const nextEmpty = [...Array(s.n)].map((_, i) => i).find(i => !((s.b || [])[i] || {}).m && boxDate(s, i) >= TD());
    return `<div class="rg"><div class="h"><span class="e">${esc(s.e)}</span><span class="m"><b>${esc(s.t)}</b><small>buat ${esc(s.to)} · ${fmtS(s.hari)} · ${nOp}/${s.n} udah dibuka</small></span><span class="hh">${hh(s)}</span></div>${boxesH(s)}
      ${empty ? `<div class="warn">✏️ ${empty} kotak masih kosong${nextEmpty != null ? ` — yang paling deket kebuka ${fmtS(boxDate(s, nextEmpty))}` : ''}</div>` : ''}
      <div class="row2"><button data-edit="${esc(s.id)}">✏️ Isi / ubah kotak</button><button data-del="${esc(s.id)}">🗑️ Hapus</button></div></div>`; }).join('') : (fm.length ? '' : '<p class="empty">Belum ada kotak — siapin buat hari spesial berikutnya yuk 📦</p>');
  try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {}
}
// ── bikin rangkaian ──
let nN = 7;
function paintN() { $('n-n').innerHTML = [3, 5, 7, 10, 14].map(n => `<button type="button" class="${n === nN ? 'on' : ''}" data-n="${n}">${n} kotak</button>`).join(''); }
$('n-n').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (b) { nN = +b.dataset.n; paintN(); } });
$('new').onclick = () => { $('n-t').value = ''; $('n-e').value = '🎂'; $('n-d').value = addD(TD(), 7); $('n-d').min = TD(); nN = 7; paintN(); $('n-ov').classList.add('show'); };
$('n-go').onclick = () => {
  const t = $('n-t').value.trim(), d = $('n-d').value; if (!t) { $('n-t').focus(); return toast('Tulis dulu menuju apa 🎁'); }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < TD()) return toast('Pilih tanggal hari-H yang belum lewat');
  const n = Math.min(nN, daysTo(d) + 1);
  const s = { id: 'k' + Date.now().toString(36), e: $('n-e').value.trim().slice(0, 4) || '🎁', t: t.slice(0, 40), hari: d, n, to: OT, by: ME, b: [], at: Date.now() };
  const L = sets(ME).concat(s); saveMine(L); $('n-ov').classList.remove('show'); vib(15);
  if (n < nN) toast(`Hari-H-nya ${daysTo(d)} hari lagi, jadi kotaknya ${n} aja ya`, 3200);
  edit(s.id);
};
// ── isi kotak ──
let edId = null;
function edit(id) {
  const s = sets(ME).find(x => x.id === id); if (!s) return; edId = id;
  const op = opened(s.to)[s.id] || {};
  $('v-home').style.display = 'none'; $('v-ed').style.display = ''; $('back').textContent = '← Kotak'; scrollTo(0, 0);
  $('v-ed').innerHTML = `<div class="head" style="margin:.5rem 0 .6rem"><span class="ico">${esc(s.e)}</span><p class="lbl">Isi kotak buat ${esc(s.to)}</p><h1 class="title" style="font-size:1.4rem">${esc(s.t)}</h1><p class="sub">Hari-H ${fmtS(s.hari)} · tiap kotak kebuka di tanggalnya. Isinya bebas: pesan, kenangan, tebak-tebakan, voucher kecil 🤍</p></div>
    <div class="ed">${[...Array(s.n)].map((_, i) => { const b = (s.b || [])[i] || {}, d = boxDate(s, i), last = i === s.n - 1;
      return `<div class="it${op[i] ? ' done' : ''}"><div class="t"><b>Kotak ${i + 1}${last ? ' · Hari-H 🎉' : ''}</b><span>${op[i] ? '✓ udah dibuka' : `kebuka ${HARI[parseYMD(d).getDay()].slice(0, 3)}, ${fmtS(d)}`}</span></div>
        <div class="r"><input class="inp" data-f="e" data-i="${i}" maxlength="4" placeholder="🎁" value="${esc(b.e || '')}" style="flex:0 0 58px;text-align:center" ${op[i] ? 'disabled' : ''}><input class="inp" data-f="g" data-i="${i}" maxlength="60" placeholder="Hadiah kecil (opsional) — misal: voucher es krim" value="${esc(b.g || '')}" ${op[i] ? 'disabled' : ''}></div>
        <textarea class="ta" data-f="m" data-i="${i}" maxlength="400" placeholder="${last ? 'Pesan buat hari-H…' : 'Pesan buat hari ini…'}" ${op[i] ? 'disabled' : ''}>${esc(b.m || '')}</textarea></div>`; }).join('')}</div>
    <button class="btn" id="ed-save">💾 Simpan kotak</button>`;
  $('ed-save').onclick = saveEd;
}
function saveEd() {
  const L = sets(ME), s = L.find(x => x.id === edId); if (!s) return;
  const b = [...Array(s.n)].map((_, i) => { const g = f => (document.querySelector(`[data-f="${f}"][data-i="${i}"]`) || {}).value || ''; return { e: g('e').trim().slice(0, 4), m: g('m').trim().slice(0, 400), g: g('g').trim().slice(0, 60) }; });
  const first = !(s.b || []).some(x => x && x.m);
  s.b = b; s.at = Date.now(); saveMine(L); vib([20, 30, 20]); confetti(30);
  const filled = b.filter(x => x.m).length;
  toast(`💾 Kesimpen · ${filled}/${s.n} kotak udah diisi`, 2800);
  if (first && filled) notify({ title: `📦 ${ME} nyiapin ${s.n} kotak kecil buat kamu`, body: `${s.e} Menuju ${s.t} — kotak pertama kebuka ${fmtS(boxDate(s, 0))} 🤫`, url: 'kotak-hari-h.html', tag: 'jadwal-kotak' });
  home();
}
function home() { edId = null; $('v-ed').style.display = 'none'; $('v-home').style.display = ''; $('back').textContent = '← Menu utama'; render(); }
$('back').addEventListener('click', e => { if (edId) { e.preventDefault(); home(); } });
// ── buka kotak ──
function reveal(s, i) {
  const b = (s.b || [])[i] || {}, last = i === s.n - 1;
  const O = Object.assign({}, opened(ME)), cur = Object.assign({}, O[s.id] || {}); if (!cur[i]) { cur[i] = Date.now(); O[s.id] = cur; BD.put('kotakhb', ME, D0, { o: O, at: Date.now() });
    notify({ title: `📦 ${ME} buka kotak ke-${i + 1}${last ? ' (hari-H!)' : ''}`, body: `${s.e} ${s.t}${b.m ? ' — “' + b.m.slice(0, 80) + '”' : ''}`, url: 'kotak-hari-h.html', tag: 'jadwal-kotak-b' }); }
  $('rv').innerHTML = `<span class="lid">${esc(b.e || (last ? '🎉' : '🎁'))}</span><b style="font-size:13px;color:var(--muted)">Kotak ${i + 1} dari ${s.n}${last ? ' · Hari-H!' : ''}</b><div class="ms">${b.m ? esc(b.m) : `${esc(s.by)} lupa ngisi kotak ini 😆 tagih yuk!`}</div>${b.g ? `<div class="gf">🎁 ${esc(b.g)}</div>` : ''}<small>dari ${esc(s.by)} · ${esc(s.e)} ${esc(s.t)}</small><button class="btn" onclick="$('r-ov').classList.remove('show')">🤍 Makasih</button>`;
  $('r-ov').classList.add('show'); confetti(last ? 120 : 50); vib([30, 40, 30]); render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('.b[data-s]');
  if (b) { const s = sets(b.dataset.o).find(x => x.id === b.dataset.s), i = +b.dataset.i; if (!s) return; const d = boxDate(s, i);
    if (s.to !== ME) { const x = (s.b || [])[i] || {}; return toast(x.m ? `Kotak ${i + 1}: kebuka ${fmtS(d)}${(opened(s.to)[s.id] || {})[i] ? ' · ✓ udah dibuka' : ''}` : `Kotak ${i + 1} masih kosong — isi lewat ✏️`); }
    if (d > TD()) return toast(`🔒 Kotak ini kebuka ${fmtS(d)} — sabar ya 🤭`);
    reveal(s, i); return; }
  const ed = e.target.closest('[data-edit]'); if (ed) { edit(ed.dataset.edit); return; }
  const dl = e.target.closest('[data-del]'); if (dl) { if (!confirm('Hapus rangkaian kotak ini?')) return; saveMine(sets(ME).filter(x => x.id !== dl.dataset.del)); toast('🗑️ Dihapus'); render(); }
});
$('n-ov').addEventListener('click', e => { if (e.target === $('n-ov')) $('n-ov').classList.remove('show'); });
BD.on(ev => { try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {} if (!edId && ev.apps && (ev.apps.includes('kotakh') || ev.apps.includes('kotakhb'))) render(); });
render();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
