<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}

  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}

  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}

  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}

  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}

  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}

  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}

  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .lock{text-align:center;padding:2.2rem 1rem}.lock b{display:block;font-size:15px;margin:.6rem 0 .3rem}.lock p{font-size:12.5px;color:var(--muted);line-height:1.6}
  .rec{text-align:center;padding:1.2rem 1rem 1rem}
  .rec .tm{font:700 2.4rem/1 'Poppins',sans-serif;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .rec .st{font-size:12px;color:var(--muted);margin:.35rem 0 .8rem;min-height:1.2em}
  .lv{height:6px;border-radius:6px;background:#f3e7ea;overflow:hidden;margin:0 auto .9rem;max-width:240px}
  .lv i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a39a,#c17a6f);border-radius:6px;transition:width .08s}
  .rbtn{width:86px;height:86px;border-radius:50%;border:none;background:linear-gradient(140deg,#ef6d7f,#c4415a);color:#fff;font:700 13px 'Poppins',sans-serif;box-shadow:0 10px 26px rgba(196,65,90,.35);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:.15rem}
  .rbtn b{width:22px;height:22px;border-radius:50%;background:#fff;display:block}
  .rbtn.on{background:linear-gradient(140deg,#5b4572,#3a2d50);box-shadow:0 10px 26px rgba(58,45,80,.35)}
  .rbtn.on b{border-radius:5px;width:20px;height:20px}
  .rec.live .tm{color:#c4415a}
  .rec.live .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e0485f;margin-right:.35rem;animation:nkB 1.2s infinite}
  @keyframes nkB{50%{opacity:.25}}
  .warn{font-size:11.5px;line-height:1.55;color:#8a5a18;background:#fff6e3;border:1px solid #f3dcae;border-radius:14px;padding:.6rem .75rem;margin-top:.9rem;text-align:left}
  .tabs{display:flex;gap:.35rem;margin:.3rem 0 .8rem}
  .tabs button{flex:1;min-width:0;padding:.6rem .3rem;border-radius:14px;border:1.5px solid var(--blush);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs button.on{background:var(--rose);border-color:var(--rose);color:#fff}
  .tabs button{position:relative;overflow:visible}
  .tabs button i{position:absolute;top:-7px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e0485f;color:#fff;font:700 10px/18px 'Poppins',sans-serif;font-style:normal;padding:0 4px;box-shadow:0 0 0 2px var(--cream)}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1.2rem .5rem;line-height:1.6}
  .tk{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid #f3e7ea}
  .tk:last-child{border-bottom:none}
  .tk input{width:20px;height:20px;accent-color:#3fa77c;margin-top:.1rem;flex:none}
  .tk .b{flex:1;min-width:0}
  .tk .b p{font-size:13.5px;line-height:1.45;word-break:break-word}
  .tk.done .b p{text-decoration:line-through;color:var(--muted)}
  .tk .b small{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.25rem;font-size:10.5px;color:var(--muted)}
  .chip{display:inline-block;padding:.1rem .5rem;border-radius:50px;background:#f6eef2;font-size:10.5px;font-weight:600;white-space:nowrap}
  .chip.L{background:#e3eefb;color:#3d6aa3}.chip.P{background:#fde4ea;color:#b4456a}.chip.D{background:#efe7fa;color:#6d5296}.chip.X{background:#eee;color:#777}
  .due{border:none;background:#fff4dd;color:#8a5a18;border-radius:50px;padding:.1rem .5rem;font:600 10.5px 'Poppins',sans-serif;cursor:pointer}
  .due.late{background:#fde1e1;color:#b23b3b}.due.today{background:#ffe7c2;color:#a35a00}.due.none{background:#f1ecee;color:#9a8a90}
  .it{display:flex;gap:.7rem;align-items:center;padding:.7rem 0;border-bottom:1px solid #f3e7ea;cursor:pointer}
  .it:last-child{border-bottom:none}
  .it .ic{width:40px;height:40px;border-radius:12px;background:#f6eef2;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .it .m{flex:1;min-width:0}.it .m b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .m small{font-size:11px;color:var(--muted)}
  .it .go{color:var(--muted);font-size:18px}
  .pr{font-size:11px;color:#a35a00;font-weight:600}.pr.err{color:#b23b3b}
  .ask textarea{min-height:70px}
  .ans{font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-top:.7rem;background:#fffaf7;border-radius:14px;padding:.75rem .85rem;border:1px solid #f3e1e6}
  .dt h2{font-size:17px;font-weight:700;line-height:1.3;margin:.2rem 0}
  .dt .when{font-size:11.5px;color:var(--muted)}
  .dt h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:1rem 0 .4rem;font-weight:600}
  .dt ul{margin-left:1.1rem;font-size:13px;line-height:1.55}
  .dt .rs{font-size:13.5px;line-height:1.6}
  .spk{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .5rem}
  .spk button{border:1.5px solid transparent;cursor:pointer}
  .ln{display:flex;gap:.5rem;padding:.45rem 0;border-bottom:1px dashed #f0e2e6;cursor:pointer}
  .ln:last-child{border-bottom:none}
  .ln .tt{font-size:10.5px;color:var(--muted);flex:none;width:40px;padding-top:.15rem;font-variant-numeric:tabular-nums}
  .ln .tx{flex:1;min-width:0;font-size:13px;line-height:1.5;word-break:break-word}
  .ln .tx .chip{margin-right:.3rem}
  .ln.play{background:#fff6e3;border-radius:10px}
  .pl{position:sticky;bottom:0;display:flex;gap:.5rem;align-items:center;background:var(--cream);padding:.5rem 0 0;margin-top:.4rem}
  .pl audio{flex:1;min-width:0;height:36px}
  .mini{font-size:11px;color:var(--muted);text-align:center;margin-top:.5rem;line-height:1.5}
  .x2{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}.x2 button{flex:1;min-width:120px}
  .opt{display:flex;flex-direction:column;gap:.4rem;margin:.7rem 0}
  .opt button{padding:.7rem;border-radius:14px;border:1.5px solid var(--blush);background:#fff;font:600 13px 'Poppins',sans-serif;color:var(--ink);cursor:pointer;text-align:left}

</style>

<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span></span></div>
  <div class="head">
    <span class="ico">📝</span>
    <p class="lbl">Khusus Dara</p>
    <h1 class="title">Notulen <span>Kerja</span></h1>
    <p class="sub">Rekam arahan atasan atau rapat. Nanti jadi transkrip, ringkasan, sama daftar tugas yang diingetin pas mau deadline.</p>
  </div>
  <div id="main"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

/* ═════ 📝 NOTULEN KERJA ═════
   Rekam → MP3 16 kHz (dipotong tiap 10 menit) → tiap potong dikirim ke server (Gemini) buat ditranskrip →
   abis selesai dibikinin ringkasan + tugas. Semua catatan cuma disimpen di HP ini (ga sinkron ke HP Razan).
   Rekaman asli disimpen di HP ini 7 hari buat diputer ulang, abis itu dihapus otomatis. */
const SEG = +(new URLSearchParams(location.search).get('seg')) || 600, MAXS = 7200, KEEP = 7 * 864e5, KD = 'nk-data';
const LBL0 = { L: 'Atasan cowo', P: 'Atasan cewe', D: 'Dara', X: 'Orang lain' };
const me = () => lsGet('berdua-me', '');
const all = () => lsGet(KD, []) || [];
const save = L => { L.sort((a, b) => b.at - a.at); if (!lsSet(KD, L)) toast('⚠️ Memori HP penuh — hapus catatan lama ya'); };
const get1 = id => all().find(n => n.id === id);
const upd = (id, f) => { const L = all(), n = L.find(x => x.id === id); if (!n) return null; f(n); save(L); return n; };
const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); };
const lblOf = (n, s) => (n.lab && n.lab[s]) || LBL0[s] || s;
const fmtTgl = ts => { const d = new Date(ts); return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} · ${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const tdyS = () => ymd(new Date());
const dueCls = d => !d ? 'none' : d < tdyS() ? 'late' : d === tdyS() ? 'today' : '';
const dueTxt = d => { if (!d) return '+ deadline'; const x = parseYMD(d), diff = Math.round((x - today0()) / 864e5); return diff === 0 ? 'hari ini' : diff === 1 ? 'besok' : diff === -1 ? 'kemarin' : diff < 0 ? `telat ${-diff} hari` : `${x.getDate()} ${BLN[x.getMonth()]}`; };

// ── 💾 rekaman asli di HP (IndexedDB) ──
let _db = null;
function db() { return _db || (_db = new Promise((res, rej) => { const r = indexedDB.open('nk-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); }
async function aPut(k, v) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function aGet(k) { const d = await db(); return new Promise(res => { const r = d.transaction('a').objectStore('a').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
async function aDel(k) { try { const d = await db(); d.transaction('a', 'readwrite').objectStore('a').delete(k); } catch (e) {} }
async function bersih() {   // rekaman lewat 7 hari → dihapus (catatan & transkripnya tetep ada)
  const L = all(); let ch = false;
  for (const n of L) if (!n.gone && Date.now() - n.at > KEEP && n.st === 'ok') { for (const s of n.seg || []) await aDel(s.k); n.gone = 1; ch = true; }
  if (ch) save(L);
}

// ── 🌐 server ──
function srv(body, ms = 150000) {
  return new Promise((res, rej) => {
    const B = window.Berdua; if (!B || !B.url) return rej(new Error('offline'));
    const x = new XMLHttpRequest(); x.open('POST', B.url, true); x.timeout = ms; x.setRequestHeader('Content-Type', 'text/plain');
    x.onload = () => { try { res(JSON.parse(x.responseText)); } catch (e) { rej(new Error('format')); } }; x.onerror = x.ontimeout = () => rej(new Error('jaringan'));
    x.send(JSON.stringify(Object.assign({ key: B.key, who: 'Dara', action: 'notulen' }, body)));
  });
}
const errTxt = e => ({ nokey: 'AI belum diaktifin (GEMINI_KEY)', limit: 'jatah AI notulen hari ini abis', sibuk: 'AI lagi rame', keysalah: 'kunci AI salah', jaringan: 'internet putus', offline: 'lagi offline', 'khusus-dara': 'server belum di-update' })[e] || 'gagal diproses';
const b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.readAsDataURL(blob); });

// ── ⏰ kirim daftar tugas yang ada deadline-nya ke server buat pengingat H-1 & hari-H ──
let remT = 0;
function syncRem() {
  clearTimeout(remT); remT = setTimeout(() => {

// ── 🧠 proses: potong-potong → transkrip → ringkasan ──
let busy = false;
async function prosesSemua() {
  if (busy || !navigator.onLine) return; busy = true;
  try {
    for (const n0 of all().filter(n => n.st === 'proc' || n.st === 'err').reverse()) {
      if (REC && REC.id === n0.id) continue;
      await proses(n0.id);
    }
  } finally { busy = false; }
}
async function proses(id) {
  let n = get1(id); if (!n) return;
  upd(id, x => { x.st = 'proc'; x.msg = ''; }); paint();
  try {
    for (let i = 0; i < n.seg.length; i++) {
      n = get1(id); const s = n.seg[i]; if (s.done) continue;
      upd(id, x => { x.msg = n.seg.length > 1 ? `Nyalin bagian ${i + 1}/${n.seg.length}…` : 'Nyalin omongan…'; }); paint();
      const blob = await aGet(s.k); if (!blob) throw new Error('rekaman ilang');
      const prev = (n.lines || []).slice(-6).map(l => `${l.s}: ${l.x}`).join(' | ');
      const r = await srv({ op: 'tr', audio: await b64(blob), mime: 'audio/mp3', hint: prev });
      if (!r.ok) throw new Error(r.error || 'gagal');
      const real = p => { let c = null; (s.cuts || []).forEach(q => { if (q.e <= p) c = q; }); return s.off + (c ? c.r + (p - c.e) : p); };
      upd(id, x => { x.lines = (x.lines || []).concat(r.l.map(l => ({ t: Math.round(real(l.t)), s: l.s, x: l.x, k: i, p: l.t }))); x.seg[i].done = 1; });
    }
    n = get1(id);
    if (!(n.lines || []).length) { upd(id, x => { x.st = 'ok'; x.judul = x.judul || 'Rekaman tanpa omongan'; x.ringkasan = 'Ga ada omongan yang kedengeran di rekaman ini.'; x.tugas = []; }); paint(); return; }
    upd(id, x => { x.msg = 'Bikin ringkasan & tugas…'; }); paint();
    const tx = n.lines.map(l => `[${mmss(l.t)}] ${l.s}: ${l.x}`).join('\n'), d = new Date(n.at);
    const r = await srv({ op: 'sum', tx, when: `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()} (${ymd(d)})` });
    if (!r.ok) throw new Error(r.error || 'gagal');
    upd(id, x => { x.st = 'ok'; x.msg = ''; x.judul = r.judul; x.ringkasan = r.ringkasan; x.poin = r.poin; x.keputusan = r.keputusan; x.tugas = r.tugas.map((t, k) => ({ id: x.id + 't' + k, x: t.x, dari: t.dari, due: t.due, jam: t.jam, done: false })); });
    vib([20, 40, 20]); toast('✓ Notulen siap');
    try { new Notification('📝 Notulen siap', { body: get1(id).judul, icon: 'icons/icon-192.png' }); } catch (e) {}
    syncRem();
  } catch (e) {
    upd(id, x => { x.st = 'err'; x.msg = errTxt(e.message); });
  }
  paint();
}

// ── 🎙️ ngerekam (MP3 langsung, biar enteng & bisa dibaca AI) ──
let REC = null, wake = null;
async function mulai() {
  if (REC) return;

  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { toast('🎙️ Izin mikrofon ditolak. Buka setelan situs → izinin Mikrofon'); return; }

  let ctx; try { ctx = new AC({ sampleRate: 16000 }); } catch (e) { ctx = new AC(); }
  const rate = ctx.sampleRate, src = ctx.createMediaStreamSource(stream), pr = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain(); mute.gain.value = 0;
  const id = 'n' + Date.now().toString(36);
  REC = { id, stream, ctx, src, pr, mute, rate, enc: new lamejs.Mp3Encoder(1, rate, 32), buf: [], pend: [], enc0: 0, quiet: 0, skip: false, cuts: [], lastSave: 0, segStart: 0, samp: 0, t0: Date.now(), seg: [], lvl: 0, gap: 0, lastT: performance.now() };
  const L = all(); L.push({ id, at: Date.now(), st: 'rec', seg: [], lines: [], dur: 0 }); save(L);
  pr.onaudioprocess = ev => {
    const R = REC; if (!R) return;
    const f = ev.inputBuffer.getChannelData(0), n = f.length, i16 = new Int16Array(n); let pk = 0;
    for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, f[i])); i16[i] = v < 0 ? v * 0x8000 : v * 0x7fff; const a = v < 0 ? -v : v; if (a > pk) pk = a; }
    R.lvl = pk; R.samp += n;
    // 🤫 hening > 2 detik ga ikut dikirim ke AI (lebih irit) — waktunya tetep dicatet biar jam di transkrip bener
    R.quiet = pk < 0.015 ? R.quiet + n / R.rate : 0;
    if (R.quiet > 2) { R.skip = true; return; }
    if (R.skip) { R.skip = false; R.cuts.push({ e: R.enc0 / R.rate, r: (R.samp - n) / R.rate - R.segStart }); }
    R.enc0 += n;
    for (let i = 0; i < n; i += 1152) { const o = R.enc.encodeBuffer(i16.subarray(i, i + 1152)); if (o.length) R.buf.push(new Int8Array(o)); }
    const now = performance.now(); if (now - R.lastT > 3000 + n / R.rate * 1000) R.gap++; R.lastT = now;
    if (R.samp / R.rate - R.segStart >= SEG) potong(false);
    else if (R.samp / R.rate - R.lastSave >= 45) simpenSementara();
    if (R.samp / R.rate >= MAXS) berhenti('⏱️ Udah 2 jam — rekamannya disimpen otomatis');
  };

  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}

}
function simpenSementara() {   // tiap 45 detik potongan yang lagi jalan disimpen dulu → kalau app ketutup, paling ilang <1 menit
  const R = REC; R.lastSave = R.samp / R.rate;
  const k = R.id + '-' + R.seg.length, off = R.segStart, blob = new Blob(R.buf, { type: 'audio/mpeg' }), dur = R.samp / R.rate, cuts = R.cuts.slice();

}
function potong(akhir) {   // tutup 1 potongan (10 menit) → simpen di HP → antre diproses
  const R = REC; const o = R.enc.flush(); if (o.length) R.buf.push(new Int8Array(o));
  const off = R.segStart, len = R.samp / R.rate - off, blob = new Blob(R.buf, { type: 'audio/mpeg' }), k = R.id + '-' + R.seg.length;
  const cuts = R.cuts; R.buf = []; R.cuts = []; R.enc0 = 0; R.segStart = R.samp / R.rate; R.enc = new lamejs.Mp3Encoder(1, R.rate, 32);

  const segs = R.seg.slice(), dur = R.samp / R.rate;
  R.pend.push(aPut(k, blob).then(() => upd(R.id, x => { x.seg = segs; x.cur = null; x.dur = dur; })).catch(() => toast('⚠️ Gagal nyimpen rekaman di HP')));
}
async function berhenti(msg) {

  potong(true);
  try { R.pr.disconnect(); R.src.disconnect(); R.mute.disconnect(); } catch (e) {}
  R.stream.getTracks().forEach(t => t.stop()); try { await R.ctx.close(); } catch (e) {}

  REC = null; vib([20, 30, 20]);

  if (msg) toast(msg);

}
async function putar(n, i) {
  if (n.gone || !AU) return;

  try { AU.currentTime = Math.max(0, (l.p != null ? l.p : l.t - s.off) - 0.5); await AU.play(); } catch (e) {}
  document.querySelectorAll('.ln.play').forEach(x => x.classList.remove('play')); const r = document.querySelector(`[data-ln="${i}"]`); r && r.classList.add('play');
}

// rekaman yang kepotong (app ketutup pas ngerekam) → potongan yang udah kesimpen tetep diproses
(function pulih() {

  L.forEach(n => { if (n.st === 'rec') { n.seg = n.seg || []; if (n.cur && !n.seg.some(s => s.k === n.cur.k)) n.seg.push(n.cur); n.cur = null; n.st = n.seg.length ? 'proc' : 'err'; n.gap = (n.gap || 0) + 1; if (!n.seg.length) n.msg = 'rekaman kepotong sebelum kesimpen'; ch = true; } });

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
