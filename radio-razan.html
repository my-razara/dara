<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Radio Razan 📻</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--cream);font-family:'Poppins',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(232,196,176,.35) 0%,transparent 65%),
    radial-gradient(ellipse 50% 60% at 80% 80%,rgba(193,122,111,.18) 0%,transparent 65%);
    pointer-events:none;z-index:0}
  .page{max-width:460px;margin:0 auto;padding:0 1.25rem 5rem;position:relative;z-index:1}

  /* ── HEADER ── */
  .header{text-align:center;padding:2.5rem 0 1.75rem}
  .header-icon{font-size:2.75rem;display:block;margin-bottom:.85rem;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .header-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.3rem}
  .header-title{font-size:clamp(1.5rem,5vw,2rem);font-weight:700;color:var(--ink);margin-bottom:.25rem}
  .header-title span{color:var(--rose)}
  .header-sub{font-size:12px;color:var(--muted);line-height:1.7;max-width:280px;margin:0 auto}

  /* ── RADIO PLAYER ── */
  .radio-player{
    background:#fff;
    border:1px solid rgba(193,122,111,.15);
    border-radius:24px;
    padding:1.5rem 1.5rem 1.25rem;
    margin-bottom:1.25rem;
    box-shadow:0 8px 40px rgba(193,122,111,.12);
    position:relative;overflow:hidden;
  }
  .radio-player::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at top,rgba(232,196,176,.15),transparent 60%);
    pointer-events:none;
  }

  /* On air badge */
  .on-air{
    display:none;
    align-items:center;gap:.4rem;
    background:rgba(193,122,111,.1);border:1px solid rgba(193,122,111,.2);
    border-radius:50px;padding:.25rem .8rem;
    font-size:10px;font-weight:700;color:var(--rose);
    letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:1rem;width:fit-content;
  }
  .on-air.visible{display:flex}
  .on-air-dot{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  /* Now playing */
  .now-playing{
    display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;
    min-height:56px;
  }
  .ep-icon{
    width:52px;height:52px;border-radius:16px;
    background:rgba(193,122,111,.08);border:1px solid rgba(193,122,111,.12);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;flex-shrink:0;
    transition:all .3s;
  }
  .ep-info{flex:1}
  .ep-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
  .ep-title{font-size:14px;font-weight:700;color:var(--ink);display:block}
  .ep-status{font-size:11px;color:var(--muted);display:block;margin-top:.1rem}

  /* Waveform */
  .waveform{
    display:flex;align-items:center;justify-content:center;
    gap:3px;height:36px;margin-bottom:1.25rem;
  }
  .wave-bar{
    width:3px;border-radius:2px;background:var(--blush);
    transition:background .3s;
  }
  .waveform.playing .wave-bar{background:var(--rose);animation:wave var(--dur) ease-in-out infinite alternate}
  @keyframes wave{from{height:4px}to{height:var(--h)}}

  /* Progress bar */
  .progress-wrap{margin-bottom:1.1rem}
  .progress-bar{height:4px;background:var(--blush);border-radius:2px;overflow:hidden;margin-bottom:.3rem}
  .progress-fill{height:100%;background:linear-gradient(to right,var(--blush),var(--rose));border-radius:2px;width:0%;transition:width .5s linear}
  .progress-times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}

  /* Controls */
  .controls{display:flex;align-items:center;justify-content:center;gap:1rem}
  .ctrl-btn{
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:var(--warm);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;transition:all .15s;
  }
  .ctrl-btn:active{transform:scale(.9)}
  .play-btn{
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:var(--rose);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;
    box-shadow:0 4px 18px rgba(193,122,111,.4);
    transition:all .15s;
  }
  .play-btn:active{background:var(--deep);transform:scale(.93)}

  /* ── MESSAGE AREA ── */
  .message-area{
    background:#fff;border:1px solid rgba(193,122,111,.12);
    border-radius:20px;padding:1.4rem 1.5rem;
    margin-bottom:1.25rem;
    box-shadow:0 4px 20px rgba(193,122,111,.08);
    min-height:120px;
    position:relative;overflow:hidden;
    display:none;
  }
  .message-area.visible{display:block}
  .message-area::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at top,rgba(232,196,176,.12),transparent 60%);pointer-events:none}

  .msg-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.75rem}
  .msg-text{
    font-size:13.5px;color:var(--ink);line-height:1.85;
    font-weight:300;position:relative;z-index:1;
  }
  .msg-text .char{opacity:0;transition:opacity .04s}
  .msg-text .char.visible{opacity:1}

  .msg-cursor{
    display:inline-block;width:2px;height:1em;
    background:var(--rose);margin-left:2px;vertical-align:text-bottom;
    animation:cursor-blink .7s ease-in-out infinite;
  }
  @keyframes cursor-blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── EPISODE LIST ── */
  .ep-list-title{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);margin-bottom:.75rem;
    display:flex;align-items:center;gap:.5rem;
  }
  .ep-list-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--blush),transparent)}

  .ep-list{display:flex;flex-direction:column;gap:.5rem}
  .ep-item{
    background:#fff;border:1.5px solid var(--blush);
    border-radius:16px;padding:.85rem 1rem;
    display:flex;align-items:center;gap:.85rem;
    cursor:pointer;transition:all .15s;
    position:relative;overflow:hidden;
  }
  .ep-item:active{transform:scale(.97);background:var(--warm)}
  .ep-item.active{border-color:var(--rose);background:rgba(193,122,111,.05)}
  .ep-item.played::after{
    content:'✓';position:absolute;top:.5rem;right:.75rem;
    font-size:10px;color:var(--sage);font-weight:700;
  }
  .ep-item-icon{
    width:40px;height:40px;border-radius:12px;
    background:rgba(193,122,111,.08);
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;flex-shrink:0;transition:background .2s;
  }
  .ep-item.active .ep-item-icon{background:rgba(193,122,111,.15)}
  .ep-item-info{flex:1}
  .ep-item-title{font-size:12px;font-weight:600;color:var(--ink);display:block}
  .ep-item-sub{font-size:10px;color:var(--muted);display:block;margin-top:.1rem}
  .ep-item-dur{font-size:10px;color:var(--muted);flex-shrink:0}

  /* Confetti */
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <span class="header-icon">📻</span>
    <span class="header-label">Khusus untuk kamu</span>
    <h1 class="header-title">Radio <span>Razan</span></h1>
    <p class="header-sub">Pilih siaran sesuai perasaanmu sekarang — Razan selalu ada di sini buat kamu 🤍</p>
  </div>

  <!-- Radio Player -->
  <div class="radio-player">
    <div class="on-air" id="on-air">
      <div class="on-air-dot"></div>
      <span>Sedang Mengudara</span>
    </div>

    <div class="now-playing">
      <div class="ep-icon" id="player-icon">📻</div>
      <div class="ep-info">
        <span class="ep-label">Sekarang Diputar</span>
        <span class="ep-title" id="player-title">Pilih siaran dulu ya</span>
        <span class="ep-status" id="player-status">Belum ada yang dipilih</span>
      </div>
    </div>

    <!-- Waveform -->
    <div class="waveform" id="waveform"></div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-times">
        <span id="time-cur">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" onclick="prevEp()" title="Sebelumnya">⏮</button>
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextEp()" title="Berikutnya">⏭</button>
    </div>
  </div>

  <!-- Message Area -->
  <div class="message-area" id="message-area">
    <span class="msg-label" id="msg-label">Pesan dari Razan</span>
    <p class="msg-text" id="msg-text"></p>
  </div>

  <!-- Episode List -->
  <p class="ep-list-title">Semua Siaran</p>
  <div class="ep-list" id="ep-list"></div>

</div>

<script>
const EPISODES = [
  {
    id:0, icon:'🌅', title:'Siaran Pagi', sub:'Buat mulai hari',
    dur:'0:42',
    text:'Hei sayang, selamat pagi. Aku tau pagi itu berat — apalagi kalau belum mau bangun dan dunia rasanya masih terlalu berisik. Tapi aku mau kamu tau, dari jauh aku selalu doain kamu duluan sebelum aku mulai hari aku. Semoga hari ini baik sama kamu ya. Kalau engga — aku ada kok.'
  },
  {
    id:1, icon:'🌙', title:'Siaran Malam', sub:'Sebelum tidur',
    dur:'0:38',
    text:'Sayang, udah mau tidur? Aku harap hari ini ga terlalu capek buat kamu. Apapun yang terjadi tadi — yang bikin kamu seneng, yang bikin kamu cape, yang bikin kamu diem sendiri — aku pengen kamu tau itu semua penting buat aku. Tidur yang nyenyak ya. Besok ada aku lagi.'
  },
  {
    id:2, icon:'😔', title:'Siaran Kangen', sub:'Kalau lagi kangen',
    dur:'0:40',
    text:'Aku tau kamu lagi kangen. Aku juga. Jarak itu nyebelin emang — tapi aku lebih nyebelin kalau kamu udah di depan aku tapi aku malah ga bilang betapa aku seneng kamu ada. Jadi sekarang aku bilang: aku kangen kamu juga, sayang. Ga usah ditahan-tahan.'
  },
  {
    id:3, icon:'💢', title:'Siaran Ngambek', sub:'Kalau lagi ngambek',
    dur:'0:45',
    text:'Oke, kamu lagi ngambek. Dan aku rasa itu wajar — mungkin aku salah, mungkin aku kurang peka, mungkin aku nyebelin. Aku ga mau bela diri dulu. Yang aku mau bilang cuma satu: aku sayang kamu, bahkan pas kamu lagi manyun kayak gini. Kalau kamu udah mau ngomong, aku di sini. Ga kemana-mana.'
  },
  {
    id:4, icon:'🌧️', title:'Siaran Galau', sub:'Buat hari yang berat',
    dur:'0:44',
    text:'Hari ini berat ya? Aku ga bisa bilang semuanya bakal baik-baik aja — karena aku ga tau. Tapi yang aku tau, kamu udah lewatin banyak hari yang berat sebelumnya dan kamu masih di sini. Kamu kuat, sayang — bahkan di hari yang kamu ngerasa paling lemah sekalipun. Dan kalau kamu butuh yang dengerin, aku ada.'
  },
  {
    id:5, icon:'🎉', title:'Siaran Bahagia', sub:'Buat rayain hal kecil',
    dur:'0:36',
    text:'Hei, kamu lagi happy kan? Aku seneng. Serius. Ngeliat kamu seneng itu hal yang paling aku suka — mau itu karena hal besar atau hal kecil yang orang lain mungkin anggep sepele. Rayain terus ya sayang. Kamu layak buat hari-hari yang baik.'
  },
];

let currentEp = null;
let isPlaying = false;
let typeInterval = null;
let progressInterval = null;
let typedChars = 0;
let totalChars = 0;
let progressSec = 0;
let totalSec = 0;
let played = new Set();

// Build waveform
function buildWave(){
  const wf=document.getElementById('waveform');
  wf.innerHTML='';
  const heights=[8,14,22,18,30,24,16,28,20,14,26,32,18,22,12,28,24,16,30,20,14,26,18,22,10];
  heights.forEach((h,i)=>{
    const bar=document.createElement('div');
    bar.className='wave-bar';
    bar.style.cssText=`height:${h}px;--h:${h}px;--dur:${0.4+Math.random()*0.6}s;animation-delay:${i*0.05}s`;
    wf.appendChild(bar);
  });
}
buildWave();

// Build episode list
function buildList(){
  const list=document.getElementById('ep-list');
  list.innerHTML='';
  EPISODES.forEach(ep=>{
    const el=document.createElement('div');
    el.className='ep-item'+(played.has(ep.id)?' played':'');
    el.id=`ep-item-${ep.id}`;
    el.innerHTML=`
      <div class="ep-item-icon">${ep.icon}</div>
      <div class="ep-item-info">
        <span class="ep-item-title">${ep.title}</span>
        <span class="ep-item-sub">${ep.sub}</span>
      </div>
      <span class="ep-item-dur">${ep.dur}</span>
    `;
    el.addEventListener('click',()=>selectEp(ep.id));
    list.appendChild(el);
  });
}
buildList();

function selectEp(id){
  if(isPlaying) stopPlay();
  currentEp=id;
  const ep=EPISODES[id];

  // Update player
  document.getElementById('player-icon').textContent=ep.icon;
  document.getElementById('player-title').textContent=ep.title;
  document.getElementById('player-status').textContent=ep.sub;
  document.getElementById('time-total').textContent=ep.dur;

  // Parse total seconds
  const parts=ep.dur.split(':');
  totalSec=parseInt(parts[0])*60+parseInt(parts[1]);
  progressSec=0;
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('time-cur').textContent='0:00';

  // Update list active
  document.querySelectorAll('.ep-item').forEach(el=>el.classList.remove('active'));
  const item=document.getElementById(`ep-item-${id}`);
  if(item){item.classList.add('active');item.scrollIntoView({behavior:'smooth',block:'nearest'});}

  // Show message area but empty
  const msgArea=document.getElementById('message-area');
  msgArea.classList.add('visible');
  document.getElementById('msg-label').textContent=`📻 ${ep.title} — dari Razan`;
  document.getElementById('msg-text').innerHTML='';

  // Auto play
  startPlay();
}

function startPlay(){
  if(currentEp===null) return;
  const ep=EPISODES[currentEp];
  isPlaying=true;

  document.getElementById('play-btn').textContent='⏸';
  document.getElementById('on-air').classList.add('visible');
  document.getElementById('waveform').classList.add('playing');
  document.getElementById('player-status').textContent='Sedang mengudara...';

  played.add(currentEp);
  buildList();
  document.getElementById(`ep-item-${currentEp}`).classList.add('active');

  // Typewriter effect
  const text=ep.text;
  const msgEl=document.getElementById('msg-text');
  msgEl.innerHTML='';
  typedChars=0;
  totalChars=text.length;

  // Create char spans
  text.split('').forEach(ch=>{
    const span=document.createElement('span');
    span.className='char';
    span.textContent=ch;
    msgEl.appendChild(span);
  });

  // Add cursor
  const cursor=document.createElement('span');
  cursor.className='msg-cursor';
  cursor.id='msg-cursor';
  msgEl.appendChild(cursor);

  const charDelay=totalSec>0?(totalSec*1000/totalChars):50;

  typeInterval=setInterval(()=>{
    if(typedChars<totalChars){
      msgEl.children[typedChars].classList.add('visible');
      typedChars++;
    } else {
      clearInterval(typeInterval);
      const cur=document.getElementById('msg-cursor');
      if(cur) setTimeout(()=>cur.remove(),1500);
    }
  },Math.max(20,charDelay));

  // Progress
  progressSec=0;
  progressInterval=setInterval(()=>{
    progressSec++;
    const pct=Math.min(progressSec/totalSec*100,100);
    document.getElementById('progress-fill').style.width=pct+'%';
    const m=Math.floor(progressSec/60);
    const s=progressSec%60;
    document.getElementById('time-cur').textContent=`${m}:${s.toString().padStart(2,'0')}`;
    if(progressSec>=totalSec){
      clearInterval(progressInterval);
      onEpEnd();
    }
  },1000);
}

function stopPlay(){
  isPlaying=false;
  clearInterval(typeInterval);
  clearInterval(progressInterval);
  document.getElementById('play-btn').textContent='▶';
  document.getElementById('on-air').classList.remove('visible');
  document.getElementById('waveform').classList.remove('playing');
  document.getElementById('player-status').textContent=EPISODES[currentEp]?.sub||'';
  const cur=document.getElementById('msg-cursor');
  if(cur) cur.remove();
}

function togglePlay(){
  if(currentEp===null){
    // Pick first unplayed or first
    const first=EPISODES.find(e=>!played.has(e.id))||EPISODES[0];
    selectEp(first.id);return;
  }
  if(isPlaying) stopPlay();
  else startPlay();
}

function onEpEnd(){
  isPlaying=false;
  document.getElementById('play-btn').textContent='▶';
  document.getElementById('on-air').classList.remove('visible');
  document.getElementById('waveform').classList.remove('playing');
  document.getElementById('player-status').textContent='Selesai diputar ✓';
  const cur=document.getElementById('msg-cursor');
  if(cur) cur.remove();

  // Check all played
  if(played.size===EPISODES.length) confetti();
}

function prevEp(){
  if(currentEp===null||currentEp===0) return;
  selectEp(currentEp-1);
}

function nextEp(){
  if(currentEp===null||currentEp===EPISODES.length-1) return;
  selectEp(currentEp+1);
}

function confetti(){
  const colors=['#c17a6f','#e8c4b0','#c9a96e','#b5c4b1','#faf6f0'];
  for(let i=0;i<60;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
  },i*25);
}
</script>
</body>
</html>
