<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rapor Razan — dinilai oleh Dara 📝</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--dr:#d9776b;--paper:#fffdf6;--line:#d8cfc0}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(126,179,245,.16),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(232,196,176,.4),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .screen{display:none}.screen.on{display:block;animation:fi .35s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .hero{text-align:center;margin:1.2rem 0 1rem}
  .hero .ico{font-size:3rem;display:block}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;line-height:1.15;margin:.2rem 0 .3rem}
  .title span{color:var(--rz)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:320px;margin:0 auto}

  .subj{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:18px;padding:.85rem .9rem .8rem;margin-bottom:.6rem;box-shadow:0 3px 14px rgba(193,122,111,.06)}
  .s-top{display:flex;align-items:center;gap:.6rem}
  .s-ic{font-size:1.4rem;width:36px;text-align:center;flex-shrink:0}
  .s-nm{flex:1;min-width:0}
  .s-nm b{display:block;font-size:13.5px;font-weight:600}
  .s-nm small{font-size:10.5px;color:var(--muted);line-height:1.4;display:block}
  .s-val{text-align:right;flex-shrink:0;min-width:52px}
  .s-val b{font-size:1.25rem;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums}
  .s-val .gr{display:block;font-size:10.5px;font-weight:700;color:var(--rose)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--rose) var(--p,50%),rgba(193,122,111,.15) var(--p,50%));outline:none;margin:.65rem 0 .1rem}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--rose);box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--rose);cursor:pointer}
  .delta{font-size:10px;font-weight:600;margin-left:.2rem}
  .delta.up{color:#5f8f5a}.delta.dn{color:#b34a3e}
  .note-in{width:100%;margin-top:.35rem;font-size:12px;padding:.5rem .7rem;border-radius:10px;border:1px dashed var(--blush);background:var(--cream);outline:none;color:var(--ink)}
  .note-in:focus{border-style:solid;border-color:var(--rose);background:#fff}

  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:18px;padding:.9rem;margin:.9rem 0 .6rem}
  .card label{display:block;font-size:12px;font-weight:600;color:var(--deep);margin-bottom:.35rem}
  .ta{width:100%;font-size:13px;padding:.65rem .8rem;border-radius:12px;border:1.5px solid var(--blush);background:var(--cream);outline:none;resize:none;color:var(--ink)}
  .ta:focus{border-color:var(--rose);background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chips button{font-size:12px;padding:.4rem .75rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff}
  .btn{display:block;width:100%;padding:.95rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6f97cf,#3f6ea9);cursor:pointer;margin-top:.8rem;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(63,110,169,.25)}
  .btn.rose{background:linear-gradient(135deg,#d48c80,#a8584c);box-shadow:0 6px 18px rgba(168,88,76,.25)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .row{display:flex;gap:.5rem}.row>*{flex:1}

  /* kertas rapor */
  .paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.3rem 1rem 1.1rem;box-shadow:0 10px 30px rgba(90,60,40,.12);position:relative;margin-top:1rem;background-image:linear-gradient(90deg,transparent 22px,rgba(193,122,111,.18) 22px,rgba(193,122,111,.18) 23px,transparent 23px)}
  .p-head{text-align:center;border-bottom:2px double var(--line);padding-bottom:.7rem;margin-bottom:.7rem}
  .p-head .sch{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .p-head h2{font-size:1.15rem;font-weight:700;letter-spacing:.06em;color:var(--deep);margin:.15rem 0}
  .p-meta{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;font-size:11px;color:var(--ink);margin-bottom:.7rem}
  .p-meta span:nth-child(odd){color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:.3rem .25rem}
  td{border-bottom:1px dashed var(--line);padding:.42rem .25rem;vertical-align:top}
  td.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;width:40px}
  td.g{text-align:center;font-weight:700;color:var(--rose);width:30px}
  td .cm{display:block;font-family:'Caveat',cursive;font-size:15px;color:var(--rz);line-height:1.1;margin-top:.1rem}
  .p-sum{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem;padding:.55rem .6rem;background:var(--warm);border-radius:8px;font-size:12px}
  .p-sum b{font-size:1.2rem;color:var(--deep)}
  .p-notes{margin-top:.8rem;font-size:11px;color:var(--muted)}
  .p-notes p{font-family:'Caveat',cursive;font-size:17px;color:var(--ink);line-height:1.25;margin:.15rem 0 .5rem;overflow-wrap:anywhere}
  .p-result{text-align:center;margin:.6rem 0 .2rem;font-size:13px;font-weight:700;letter-spacing:.06em;color:#5f8f5a}
  .p-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:.9rem;font-size:9.5px;color:var(--muted);text-align:center}
  .p-sign div{flex:1}
  .p-sign .nm{font-family:'Caveat',cursive;font-size:22px;color:var(--dr);display:block;border-bottom:1px solid var(--muted);margin:0 .6rem .2rem}
  .stamp{position:absolute;right:14px;top:96px;width:74px;height:74px;border-radius:50%;border:3px double var(--rose);color:var(--rose);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;letter-spacing:.06em;transform:rotate(-14deg);opacity:.8;line-height:1.25;text-align:center}
  .stamp b{font-size:1.15rem}

  .hist{margin-top:1.4rem}
  .h-it{display:flex;align-items:center;gap:.7rem;background:rgba(255,255,255,.7);border:1px solid rgba(193,122,111,.13);border-radius:14px;padding:.6rem .8rem;margin-bottom:.45rem;cursor:pointer}
  .h-it b{font-size:1.1rem;color:var(--deep);width:44px;text-align:center}
  .h-it span{flex:1;font-size:12px;color:var(--muted);line-height:1.4}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  .row .btn{white-space:nowrap;padding-left:.3rem;padding-right:.3rem}
  @media (max-width:350px){.row .btn{font-size:12.5px}.wrap{padding-left:.7rem;padding-right:.7rem}.paper{padding:1.1rem .7rem .9rem}.stamp{width:62px;height:62px;right:8px}table{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span></span></div>

  <div class="screen on" id="s-form">
    <div class="hero">
      <span class="ico">📝</span>
      <p class="lbl" id="sem-lbl"></p>
      <h1 class="title">Rapor <span>Razan</span></h1>
      <p class="sub">Kamu wali kelasnya. Kasih nilai jujur buat tiap "mata pelajaran" — boleh pedes 😤</p>
    </div>
    <div id="subjects"></div>
    <div class="card">
      <label>Sikap / kelakuan</label>
      <div class="chips" id="sikap"></div>
    </div>
    <div class="card">
      <label for="wali">Catatan wali kelas <span style="font-weight:400;color:var(--muted)">(pesan buat Razan)</span></label>
      <textarea class="ta" id="wali" rows="3" maxlength="400" placeholder="Contoh: Pertahankan gombalnya, tapi bales chat jangan lama-lama ya 😤"></textarea>
    </div>
    <button class="btn" onclick="finish()">Terbitkan rapor 📜</button>
    <div class="hist" id="hist"></div>
  </div>

  <div class="screen" id="s-paper">
    <div id="paper"></div>
    <div class="row" style="margin-top:.4rem"><button class="btn ghost" onclick="savePng()">⬇️ Simpan</button><a class="btn rose" id="wa" target="_blank" rel="noopener">💬 Kirim ke Razan</a></div>
    <button class="btn ghost" onclick="show('s-form')" style="margin-top:.5rem">✏️ Bikin rapor baru</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WA_RAZAN = '6285692740607';
const SUBJ = [
  { k: 'peka', ic: '🧠', n: 'Kepekaan', d: 'Ngerti tanpa harus dikasih kode' },
  { k: 'kabar', ic: '📱', n: 'Ngabarin & bales chat', d: 'Cepet, ga cuma "wkwk" doang' },
  { k: 'dengar', ic: '👂', n: 'Dengerin cerita', d: 'Fokus, ga sambil main HP' },
  { k: 'romantis', ic: '🌹', n: 'Romantis', d: 'Kejutan, perhatian kecil, surat' },
  { k: 'lucu', ic: '😂', n: 'Humor', d: 'Bikin ketawa (bukan garing)' },
  { k: 'sabar', ic: '🧘', n: 'Kesabaran', d: 'Pas kamu lagi ngambek / PMS' },
  { k: 'janji', ic: '🤞', n: 'Nepatin janji', d: 'Yang diomongin, dilakuin' },
  { k: 'gombal', ic: '🤭', n: 'Gombal', d: 'Bikin salting' },
  { k: 'manja', ic: '🫂', n: 'Manjain kamu', d: 'Peluk, puk-puk, nemenin' },
  { k: 'ganteng', ic: '😎', n: 'Kegantengan', d: 'Ya… dinilai aja 😆' },
];
const SIKAP = ['😇 Sangat baik', '🙂 Baik', '😏 Cukup (suka iseng)', '😤 Perlu dibina'];
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let toastT; function toast(m) { const t = $('toast'); t.innerHTML = m; t.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = '0', 2600); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); if (id === 's-form') renderForm(); }

function grade(v) { return v >= 90 ? 'A' : v >= 80 ? 'A-' : v >= 75 ? 'B+' : v >= 70 ? 'B' : v >= 60 ? 'C' : v >= 50 ? 'D' : 'E'; }
function semester(d = new Date()) { const y = d.getFullYear(), m = d.getMonth(); return m >= 6 ? `Semester Ganjil ${y}/${y + 1}` : `Semester Genap ${y - 1}/${y}`; }
const COMMENTS = {
  A: ['Luar biasa, pertahankan!', 'Juara kelas 🏆', 'Nilai sempurna, bikin bangga'],
  'A-': ['Hampir sempurna 👏', 'Mantap, dikit lagi'],
  'B+': ['Bagus, tingkatkan lagi', 'Udah oke kok'],
  B: ['Cukup baik', 'Masih bisa lebih'],
  C: ['Perlu belajar lagi 📚', 'Remedial dikit ya'],
  D: ['Wajib les privat sama Dara 😤'],
  E: ['Dipanggil ke ruang BK 😤'],
};

let draft = null;
function renderForm() {
  $('sem-lbl').textContent = semester();
  const hist = lsGet('rapor-hist', []), prev = hist[0];
  draft = lsGet('rapor-draft', null) || { s: Object.fromEntries(SUBJ.map(x => [x.k, prev ? prev.s[x.k] : 80])), c: {}, sikap: 1, wali: '' };
  $('subjects').innerHTML = SUBJ.map(x => `<div class="subj"><div class="s-top"><span class="s-ic">${x.ic}</span><div class="s-nm"><b>${x.n}</b><small>${x.d}</small></div><div class="s-val"><b id="v-${x.k}"></b><span class="gr" id="g-${x.k}"></span></div></div>
    <input type="range" min="0" max="100" step="1" id="r-${x.k}" value="${draft.s[x.k]}" aria-label="${x.n}">
    <input class="note-in" id="c-${x.k}" maxlength="60" placeholder="komentar (opsional)" value="${esc(draft.c[x.k] || '')}"></div>`).join('');
  SUBJ.forEach(x => {
    const r = $('r-' + x.k), c = $('c-' + x.k);
    const upd = () => {
      const v = +r.value; draft.s[x.k] = v; r.style.setProperty('--p', v + '%');
      const d = prev ? v - prev.s[x.k] : 0;
      $('v-' + x.k).innerHTML = `${v}${d ? `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : ''}`;
      $('g-' + x.k).textContent = grade(v); saveDraft();
    };
    r.addEventListener('input', () => { upd(); if (+r.value % 10 === 0) vib(4); }); upd();
    c.addEventListener('input', () => { draft.c[x.k] = c.value; saveDraft(); });
  });
  const paint = () => { $('sikap').innerHTML = SIKAP.map((t, i) => `<button class="${i === draft.sikap ? 'on' : ''}" data-i="${i}">${t}</button>`).join(''); $('sikap').querySelectorAll('button').forEach(b => b.onclick = () => { draft.sikap = +b.dataset.i; saveDraft(); paint(); }); };
  paint();
  $('wali').value = draft.wali || '';
  $('wali').oninput = () => { draft.wali = $('wali').value; saveDraft(); };
  $('hist').innerHTML = hist.length ? `<p class="lbl" style="text-align:center;margin-bottom:.5rem">📚 Rapor sebelumnya</p>` + hist.map((h, i) => `<div class="h-it" data-i="${i}"><b>${h.avg}</b><span>${esc(h.sem)}<br>${new Date(h.at).getDate()} ${BULAN[new Date(h.at).getMonth()]} ${new Date(h.at).getFullYear()} · rata-rata ${grade(h.avg)}</span>›</div>`).join('') : '';
  $('hist').querySelectorAll('.h-it').forEach(el => el.onclick = () => { showPaper(lsGet('rapor-hist', [])[+el.dataset.i], lsGet('rapor-hist', [])[+el.dataset.i + 1]); });
}
function saveDraft() { lsSet('rapor-draft', draft); }
function finish() {
  const r = { at: Date.now(), sem: semester(), s: Object.assign({}, draft.s), c: Object.fromEntries(Object.entries(draft.c).filter(([, v]) => v && v.trim()).map(([k, v]) => [k, v.trim()])), sikap: draft.sikap, wali: (draft.wali || '').trim() };
  r.avg = Math.round(SUBJ.reduce((a, x) => a + r.s[x.k], 0) / SUBJ.length);
  const hist = lsGet('rapor-hist', []); const prev = hist[0];
  hist.unshift(r); lsSet('rapor-hist', hist.slice(0, 20));
  try { localStorage.removeItem('rapor-draft'); } catch (e) {}
  showPaper(r, prev); vib([20, 40, 80]); confetti();
}
function rank(avg) { return avg >= 90 ? 'Peringkat 1 dari 1 🏆' : avg >= 75 ? 'Peringkat 1 dari 1 (tapi bisa lebih 😏)' : 'Peringkat 1 dari 1 (karena cuma satu 😤)'; }
function result(avg) { return avg >= 60 ? '✅ NAIK KELAS — tetap jadi pacar Dara' : '⚠️ NAIK KELAS DENGAN CATATAN — tetap jadi pacar Dara 😤'; }
let current = null;
function showPaper(r, prev) {
  current = r; show('s-paper');
  const d = new Date(r.at);
  const best = SUBJ.slice().sort((a, b) => r.s[b.k] - r.s[a.k])[0], worst = SUBJ.slice().sort((a, b) => r.s[a.k] - r.s[b.k])[0];
  $('paper').innerHTML = `<div class="paper">
    <div class="p-head"><p class="sch">SMA Cinta Razara · Kelas Pacaran</p><h2>LAPORAN HASIL BELAJAR</h2><p class="sch">${esc(r.sem)}</p></div>
    <div class="p-meta"><span>Nama</span><span><b>Razan</b></span><span>Wali kelas</span><span>Dara</span><span>Tanggal</span><span>${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}</span></div>
    <div class="stamp"><b>${grade(r.avg)}</b>DINILAI<br>DARA</div>
    <table><thead><tr><th>Mata pelajaran</th><th style="text-align:center">Nilai</th><th style="text-align:center">Pred</th></tr></thead><tbody>
      ${SUBJ.map(x => { const v = r.s[x.k], cm = r.c[x.k] || COMMENTS[grade(v)][(x.k.length + v) % COMMENTS[grade(v)].length]; const dl = prev ? v - prev.s[x.k] : 0; return `<tr><td>${x.ic} ${x.n}<span class="cm">${esc(cm)}</span></td><td class="n">${v}${dl ? `<br><span class="delta ${dl > 0 ? 'up' : 'dn'}">${dl > 0 ? '▲' : '▼'}${Math.abs(dl)}</span>` : ''}</td><td class="g">${grade(v)}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="p-sum"><span>Rata-rata<br><small style="color:var(--muted)">${rank(r.avg)}</small></span><b>${r.avg}</b></div>
    <div class="p-notes">Sikap: <b style="color:var(--ink)">${SIKAP[r.sikap]}</b><br>
      Paling jago: ${best.ic} ${best.n} · Perlu les: ${worst.ic} ${worst.n}
      ${r.wali ? `<br><br>Catatan wali kelas:<p>“${esc(r.wali)}”</p>` : ''}</div>
    <p class="p-result">${result(r.avg)}</p>
    <div class="p-sign"><div><span class="nm">Dara</span>Wali kelas</div><div><span class="nm" style="color:var(--rz)">Razan</span>Murid (pasrah)</div></div>
  </div>`;
  const txt = `📜 RAPOR RAZAN — ${r.sem}\n` + SUBJ.map(x => `${x.ic} ${x.n}: ${r.s[x.k]} (${grade(r.s[x.k])})${r.c[x.k] ? ' — ' + r.c[x.k] : ''}`).join('\n') + `\n\nRata-rata: ${r.avg} · Sikap: ${SIKAP[r.sikap]}${r.wali ? `\nCatatan wali kelas: "${r.wali}"` : ''}\n${result(r.avg)}`;
  $('wa').href = `https://wa.me/${WA_RAZAN}?text=${encodeURIComponent(txt)}`;
}

async function savePng() {
  const r = current; if (!r) return;
  try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {}
  const W = 1080, rowH = 92, H = 520 + SUBJ.length * rowH + 520;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
  x.fillStyle = '#fffdf6'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#d8cfc0'; x.lineWidth = 3; x.strokeRect(24, 24, W - 48, H - 48);
  x.strokeStyle = 'rgba(193,122,111,.3)'; x.beginPath(); x.moveTo(78, 24); x.lineTo(78, H - 24); x.stroke();
  x.textAlign = 'center'; x.fillStyle = '#9a8070'; x.font = '500 24px Poppins'; x.fillText('SMA CINTA RAZARA · KELAS PACARAN', W / 2, 100);
  x.fillStyle = '#7a3f35'; x.font = '700 48px Poppins'; x.fillText('LAPORAN HASIL BELAJAR', W / 2, 162);
  x.fillStyle = '#9a8070'; x.font = '400 26px Poppins'; x.fillText(r.sem, W / 2, 204);

  x.textAlign = 'left'; x.font = '400 26px Poppins'; x.fillStyle = '#2d1f1a';
  x.fillText(`Nama: Razan     Wali kelas: Dara     ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`, 110, 270);

  x.fillStyle = '#c17a6f'; x.textAlign = 'center'; x.font = '800 54px Poppins'; x.fillText(grade(r.avg), 0, 12); x.font = '700 16px Poppins'; x.fillText('DINILAI DARA', 0, 42); x.restore();
  let y = 340;
  x.fillStyle = '#9a8070'; x.font = '600 22px Poppins'; x.fillText('MATA PELAJARAN', 110, y); x.textAlign = 'center'; x.fillText('NILAI', W - 260, y); x.fillText('PRED', W - 130, y); x.textAlign = 'left';
  y += 20; x.strokeStyle = '#d8cfc0'; x.beginPath(); x.moveTo(100, y); x.lineTo(W - 70, y); x.stroke();
  SUBJ.forEach(s => {
    const v = r.s[s.k], g = grade(v), cm = r.c[s.k] || COMMENTS[g][(s.k.length + v) % COMMENTS[g].length];
    y += 46; x.fillStyle = '#2d1f1a'; x.font = '500 30px Poppins'; x.textAlign = 'left'; x.fillText(`${s.ic}  ${s.n}`, 110, y);
    x.fillStyle = '#4a7fc1'; x.font = "700 30px Caveat, 'Segoe Script', cursive"; x.fillText(cm, 160, y + 36);
    x.textAlign = 'center'; x.fillStyle = '#2d1f1a'; x.font = '700 34px Poppins'; x.fillText(String(v), W - 260, y + 10);
    x.fillStyle = '#c17a6f'; x.fillText(g, W - 130, y + 10);
    y += 46; x.strokeStyle = 'rgba(216,207,192,.9)'; x.setLineDash([6, 6]); x.beginPath(); x.moveTo(100, y); x.lineTo(W - 70, y); x.stroke(); x.setLineDash([]);
  });
  y += 30; x.fillStyle = '#f5ede0'; x.fillRect(100, y, W - 170, 90);
  x.textAlign = 'left'; x.fillStyle = '#2d1f1a'; x.font = '600 30px Poppins'; x.fillText('Rata-rata', 130, y + 56);
  x.textAlign = 'right'; x.fillStyle = '#7a3f35'; x.font = '700 48px Poppins'; x.fillText(String(r.avg), W - 110, y + 62);
  y += 140; x.textAlign = 'left'; x.fillStyle = '#9a8070'; x.font = '400 26px Poppins'; x.fillText(`Sikap: ${SIKAP[r.sikap]}`, 110, y);
  if (r.wali) { y += 50; x.fillStyle = '#2d1f1a'; x.font = "700 36px Caveat, 'Segoe Script', cursive"; wrap(x, `“${r.wali}”`, 110, y, W - 200, 42).forEach((l, i) => x.fillText(l, 110, y + i * 42)); y += 42 * Math.min(4, wrap(x, `“${r.wali}”`, 0, 0, W - 200).length); }
  y += 50; x.textAlign = 'center'; x.fillStyle = '#5f8f5a'; x.font = '700 28px Poppins'; x.fillText(result(r.avg), W / 2, y);
  y += 90; x.fillStyle = '#d9776b'; x.font = "700 48px Caveat, 'Segoe Script', cursive"; x.fillText('Dara', W * .3, y); x.fillStyle = '#4a7fc1'; x.fillText('Razan', W * .7, y);
  x.fillStyle = '#9a8070'; x.font = '400 20px Poppins'; x.fillText('Wali kelas', W * .3, y + 36); x.fillText('Murid (pasrah)', W * .7, y + 36);
  // potong tinggi sesuai isi
  const out = document.createElement('canvas'); out.width = W; out.height = Math.min(H, y + 90); out.getContext('2d').drawImage(cv, 0, 0);

  out.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'rapor-razan.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Rapor Razan' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rapor-razan.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('⬇️ Rapor disimpan');
  }, 'image/png');
}
function wrap(ctx, text, _x, _y, maxW) { const w = text.split(' '), out = []; let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } if (l) out.push(l); return out.slice(0, 4); }
function confetti() {
  const colors = ['#4a7fc1', '#7eb3f5', '#c9a96e', '#f0a39a', '#fff'];
  for (let i = 0; i < 60; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
renderForm();

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
