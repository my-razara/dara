<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Perang Kapal — Razan vs Dara ⚓</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
    --rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a;
    --sea:#1f4e6e;--sea2:#2b6a8f;--sea3:#163a54;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font-family:'Poppins',sans-serif}
  html,body{min-height:100%}
  body{background:var(--cream);font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 60% 45% at 15% 10%,rgba(126,179,245,.2),transparent 65%),radial-gradient(ellipse 60% 45% at 85% 90%,rgba(240,163,154,.2),transparent 65%)}
  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .back-link,.top-btn{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  .mid{margin:auto 0;text-align:center;padding:1rem 0}

  /* ── PILIH ── */
  .p-ico{font-size:3rem;display:block;animation:rock 3s ease-in-out infinite}
  @keyframes rock{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-5px)}}
  .p-title{font-size:clamp(1.7rem,6.5vw,2.2rem);font-weight:700;line-height:1.1;margin-top:.5rem}
  .p-title span{color:var(--sea2)}
  .p-sub{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:310px;margin:.5rem auto 1rem}
  .big{width:100%;margin-top:1rem;padding:1rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--rz),var(--dr));box-shadow:0 6px 22px rgba(122,90,140,.3)}
  .big:active{transform:scale(.97)}
  .bot-panel{margin-top:1.3rem;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:20px;padding:1rem .9rem}
  .bot-panel h3{font-size:13px;font-weight:600;margin-bottom:.6rem}
  .pills{display:flex;gap:.4rem}
  .pills button{flex:1;border:1.5px solid var(--blush);background:#fff;border-radius:50px;padding:.55rem .3rem;font-size:12.5px;color:var(--muted);cursor:pointer}
  .pills button.on{background:var(--sea2);border-color:var(--sea2);color:#fff;font-weight:600}
  .bot-row{display:flex;gap:.5rem;margin-top:.7rem}
  .bot-row button{flex:1;padding:.8rem .4rem;border-radius:16px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff}
  .bot-row .r{background:linear-gradient(135deg,var(--rz2),var(--rz))}
  .bot-row .d{background:linear-gradient(135deg,var(--dr2),var(--dr))}
  .rec{font-size:11px;color:var(--muted);margin-top:.9rem}

  /* ── LAUT ── */
  .sea{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:linear-gradient(160deg,var(--sea2),var(--sea3));padding:6px;border-radius:16px;box-shadow:0 10px 30px rgba(22,58,84,.3);touch-action:manipulation;width:100%;aspect-ratio:1}
  .sq{position:relative;border-radius:5px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,4vw,18px);line-height:1;border:none;padding:0;color:#fff}
  .sea.target .sq{cursor:pointer}
  .sea.target .sq:not(.shot):active{background:rgba(255,255,255,.25)}
  .sea.locked .sq{cursor:default}
  .sq.ship{background:linear-gradient(160deg,#c9d3dd,#8d9aa8);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .sq.ship.Razan{background:linear-gradient(160deg,#a9cdfa,var(--rz))}
  .sq.ship.Dara{background:linear-gradient(160deg,#ffc6bf,var(--dr))}
  .sq.miss::after{content:'';width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.55)}
  .sq.hit{background:radial-gradient(circle,#ffcf7a,#e0573f 70%)}
  .sq.hit::after{content:'🔥'}
  .sq.sunk{background:linear-gradient(160deg,#5a4a5e,#3a2c3f)!important}
  .sq.sunk::after{content:'💥'}
  .sq.last{box-shadow:0 0 0 2px #fff,0 0 12px 2px rgba(255,255,255,.7);z-index:2}
  .sq.boom{animation:boom .45s ease}
  @keyframes boom{0%{transform:scale(1.5)}100%{transform:scale(1)}}
  .sq.splash{animation:splash .45s ease}
  @keyframes splash{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1);opacity:1}}

  /* ── ATUR KAPAL ── */
  .who-title{text-align:center;font-size:15px;font-weight:600;margin:.9rem 0 .2rem}
  .who-title.Razan{color:var(--rz)} .who-title.Dara{color:var(--dr)}
  .hint{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:.7rem;line-height:1.55}
  .fleet{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin:.7rem 0 .2rem}
  .fleet span{font-size:10.5px;background:#fff;border:1px solid rgba(31,78,110,.18);border-radius:50px;padding:.2rem .55rem;color:var(--sea);white-space:nowrap}
  .fleet span.dead{text-decoration:line-through;opacity:.45}
  .row2{display:flex;gap:.5rem;margin-top:.9rem}
  .row2 button{flex:1;padding:.85rem .4rem;border-radius:50px;font-size:13.5px;font-weight:600;cursor:pointer}
  .ghost{background:#fff;border:1.5px solid var(--blush);color:var(--muted)}
  .main{background:linear-gradient(135deg,var(--sea2),var(--sea));border:none;color:#fff}

  /* ── MAIN ── */
  .turnbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.8rem 0 .5rem}
  .tb-who{font-size:13px;font-weight:600}
  .tb-who.Razan{color:var(--rz)} .tb-who.Dara{color:var(--dr)}
  .tb-stat{font-size:11px;color:var(--muted)}
  .log{text-align:center;font-size:13px;font-weight:500;min-height:1.5em;margin-bottom:.5rem}
  .sea-lbl{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:.2rem 0 .35rem}
  .mine-wrap{display:flex;gap:.7rem;align-items:flex-start;margin-top:.9rem}
  .mine-wrap .sea{width:42%;flex-shrink:0;gap:2px;padding:4px;border-radius:10px}
  .mine-wrap .sq{font-size:8px;border-radius:3px}
  .mine-info{flex:1;min-width:0}
  .mine-info .fleet{justify-content:flex-start;margin-top:.3rem}
  .mine-info p{font-size:11px;color:var(--muted);line-height:1.5}

  /* ── GANTIAN (mode berdua) ── */
  .pass{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:linear-gradient(160deg,var(--sea2),var(--sea3));color:#fff}
  .pass.show{display:flex}
  .pass .ico{font-size:3.2rem;animation:rock 2.5s ease-in-out infinite}
  .pass h2{font-size:1.4rem;margin:.6rem 0 .3rem}
  .pass p{font-size:13px;opacity:.85;line-height:1.7;max-width:280px}
  .pass button{margin-top:1.4rem;padding:.95rem 2rem;border-radius:50px;border:none;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
  .pass button.Razan{background:linear-gradient(135deg,var(--rz2),var(--rz))}
  .pass button.Dara{background:linear-gradient(135deg,var(--dr2),var(--dr))}

  /* ── HASIL ── */
  .ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(22,30,45,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--cream);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));text-align:center;animation:su .35s cubic-bezier(.34,1.3,.64,1)}
  @keyframes su{from{transform:translateY(100%)}to{transform:none}}
  .s-ico{font-size:2.8rem;display:block}
  .s-title{font-size:1.25rem;font-weight:700;margin:.35rem 0 .2rem}
  .s-title.Razan{color:var(--rz)} .s-title.Dara{color:var(--dr)}
  .s-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
  .s-box{margin:.9rem 0 .2rem;background:#fff;border:1px dashed var(--blush);border-radius:16px;padding:.8rem .9rem;font-size:13px;line-height:1.6}
  .s-box small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
  .s-btn{width:100%;margin-top:.9rem;padding:.9rem;border-radius:50px;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--sea2),var(--sea))}
  .s-ghost{width:100%;margin-top:.5rem;padding:.8rem;border-radius:50px;border:1.5px solid var(--blush);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  @media (max-width:360px){ .wrap{padding-left:.75rem;padding-right:.75rem} .sea{gap:2px;padding:5px} .mine-wrap .sea{width:44%} }
  @media (max-height:700px){ #s-game .target-wrap{max-width:270px;align-self:center;width:100%} }
  @media (prefers-reduced-motion:reduce){ .p-ico,.pass .ico{animation:none} }
</style>
<script src="sync.js"></script>
<script src="online.js"></script>
<script src="sfx.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html" class="back-link">← Menu utama</a>
    <button class="top-btn" id="menu-btn" style="display:none" onclick="quit()">☰ Menu game</button>
  </div>

  <!-- PILIH -->
  <div class="screen on" id="s-pick">
    <div class="mid">
      <span class="p-ico">⚓</span>
      <h1 class="p-title">Perang <span>Kapal</span></h1>
      <p class="p-sub">Sembunyiin 5 kapal di laut, terus tebak-tebakan di mana kapal lawan. Yang duluan nenggelamin semua kapal lawan menang! 🚢💥</p>
      <button class="big" onclick="startDuo()">👫 Main berdua (gantian 1 HP)</button>
      <div class="bot-panel">
        <h3>🤖 Atau main sendiri lawan komputer</h3>
        <div class="pills" id="p-level"><button data-v="0">😊 Santai</button><button data-v="1">🙂 Sedang</button><button data-v="2">😈 Jago</button></div>
        <div class="bot-row"><button class="r" onclick="startBot('Razan')">🙋‍♂️ Aku Razan</button><button class="d" onclick="startBot('Dara')">🙋‍♀️ Aku Dara</button></div>
      </div>
      <p class="rec" id="rec"></p>
    </div>
  </div>

  <!-- ATUR KAPAL -->
  <div class="screen" id="s-place">
    <p class="who-title" id="pl-title">Atur kapal</p>
    <p class="hint">Posisi kapal diacak. Ga suka? Tap <b>🔀 Acak lagi</b> sampai pas — terus <b>Siap!</b></p>
    <div class="sea locked" id="pl-sea"></div>
    <div class="fleet" id="pl-fleet"></div>
    <div class="row2" id="pl-btns"><button class="ghost" onclick="reroll()">🔀 Acak lagi</button><button class="main" onclick="ready()">Siap! ⚓</button></div>
    <p class="hint" id="pl-wait" style="display:none;margin-top:.8rem"></p>
  </div>

  <!-- MAIN -->
  <div class="screen" id="s-game">
    <div class="turnbar"><span class="tb-who" id="tb-who"></span><span class="tb-stat" id="tb-stat"></span></div>
    <p class="ol-st" id="ol-st"></p>
    <p class="log" id="log"></p>
    <div class="target-wrap">
      <div class="sea-lbl"><span id="tg-lbl">Laut lawan</span><span id="tg-left"></span></div>
      <div class="sea target" id="tg-sea"></div>
      <div class="fleet" id="tg-fleet"></div>
    </div>
    <div class="mine-wrap">
      <div class="sea locked" id="my-sea"></div>
      <div class="mine-info"><div class="sea-lbl" style="margin:0"><span id="my-lbl">Laut kamu</span></div><p id="my-txt"></p><div class="fleet" id="my-fleet"></div></div>
    </div>
  </div>
</div>

<!-- GANTIAN -->
<div class="pass" id="pass">
  <span class="ico">🙈</span>
  <h2 id="pass-title"></h2>
  <p id="pass-txt"></p>
  <button id="pass-btn" onclick="passGo()"></button>
</div>

<!-- HASIL -->
<div class="ov" id="res-ov">
  <div class="sheet" role="dialog" aria-modal="true">
    <span class="s-ico" id="s-ico">🏆</span>
    <p class="s-title" id="s-title"></p>
    <p class="s-sub" id="s-sub"></p>
    <div class="s-box" id="s-box"></div>
    <button class="s-btn" onclick="closeRes();again()">Main lagi 🔁</button>
    <button class="s-ghost" onclick="closeRes();toMenu()">Ke menu game</button>
  </div>
</div>

<script>
const N = 8;
const FLEET = [
  { name: 'Kapal Rindu', len: 4, ico: '🛳️' },
  { name: 'Kapal Sayang', len: 3, ico: '🚢' },
  { name: 'Kapal Cemburu', len: 3, ico: '⛴️' },
  { name: 'Perahu Gombal', len: 2, ico: '⛵' },
  { name: 'Sekoci Ngambek', len: 2, ico: '🚣' },
];
const LEVELS = ['Santai', 'Sedang', 'Jago'];
const DEMANDS = [
  'Yang kalah kasih 1 pujian tulus ke yang menang 🥰',
  'Yang kalah traktir jajan pas ketemu nanti 🍜',
  'Yang kalah kirim foto selfie paling jelek sekarang 🤳😆',
  'Yang kalah kirim voice note nyanyi 1 lagu pendek 🎤',
  'Yang kalah pilihin film buat ditonton bareng 🎬',
  'Yang kalah kasih peluk paling lama pas ketemu 🫂',
  'Yang kalah harus nurut satu permintaan kecil 😏',
];
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const other = p => p === 'Razan' ? 'Dara' : 'Razan';

let level = lsGet('bs-level', 1);
let MODE = 'duo', BOT = null, HUMAN = null;
let S = {};                    // S[p] = { ships:[{...,cells:[], hit:Set}], board:Int8Array(64) (-1 kosong / index kapal), recv:Int8Array(64) (0 belum,1 meleset,2 kena) }
let REPLAY = false, fleetSent = false;
let turn = 'Razan', over = false, busy = false, placing = [], placeIdx = 0, lastShot = { Razan: -1, Dara: -1 }, shotsCount = { Razan: 0, Dara: 0 };

/* ── pilih ── */
function paintPick() {
  document.querySelectorAll('#p-level button').forEach(b => b.classList.toggle('on', +b.dataset.v === level));
  const r = lsGet('bs-record', { Razan: 0, Dara: 0, beat: [0, 0, 0] });
  $('rec').innerHTML = `Rekor: <b style="color:var(--rz)">Razan ${r.Razan}</b> · <b style="color:var(--dr)">Dara ${r.Dara}</b>${r.beat.some(Boolean) ? ` · ngalahin komputer ${r.beat.map((n, i) => `${LEVELS[i]} ${n}x`).join(', ')}` : ''}`;
}
document.querySelectorAll('#p-level button').forEach(b => b.onclick = () => { level = +b.dataset.v; lsSet('bs-level', level); paintPick(); });
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); $('menu-btn').style.display = id === 's-pick' ? 'none' : ''; window.scrollTo(0, 0); }
function toMenu() { if (MODE === 'online' && window.Online) Online.leave(true); MODE = 'duo'; over = true; busy = false; $('pass').classList.remove('show'); show('s-pick'); paintPick(); }
function quit() { if (!over && !confirm(MODE === 'online' ? `Keluar dari game online? ${other(HUMAN)} bakal dikabarin.` : 'Udahan mainnya?')) return; if (MODE === 'online' && window.Online) Online.leave(); toMenu(); }

/* ── atur kapal ── */
function randomFleet() {
  for (let tries = 0; tries < 500; tries++) {
    const board = new Int8Array(N * N).fill(-1), ships = [];
    let ok = true;
    for (let s = 0; s < FLEET.length && ok; s++) {
      const len = FLEET[s].len; let placed = false;
      for (let k = 0; k < 200 && !placed; k++) {
        const hor = Math.random() < .5, r = Math.floor(Math.random() * (hor ? N : N - len + 1)), c = Math.floor(Math.random() * (hor ? N - len + 1 : N));
        const cells = Array.from({ length: len }, (_, i) => hor ? r * N + c + i : (r + i) * N + c);
        // kapal ga boleh nempel (biar lebih adil & seru)
        if (cells.some(i => board[i] !== -1 || neigh8(i).some(j => board[j] !== -1))) continue;
        cells.forEach(i => board[i] = s);
        ships.push(Object.assign({}, FLEET[s], { cells, hit: new Set() }));
        placed = true;
      }
      if (!placed) ok = false;
    }
    if (ok) return { board, ships, recv: new Int8Array(N * N) };
  }
}
function neigh8(i) { const r = Math.floor(i / N), c = i % N, out = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc); } return out; }
function startDuo() { MODE = 'duo'; BOT = null; HUMAN = null; S = {}; placing = ['Razan', 'Dara']; placeIdx = 0; beginPlace(); }
function startBot(me) { MODE = 'bot'; HUMAN = me; BOT = other(me); S = {}; S[BOT] = randomFleet(); placing = [me]; placeIdx = 0; beginPlace(); }
function again() { if (MODE === 'online') { Online.invite(); return; } MODE === 'bot' ? startBot(HUMAN) : startDuo(); }
function beginPlace() {
  const p = placing[placeIdx];
  S[p] = randomFleet();
  if (MODE === 'duo' && placeIdx > 0) { passScreen(p, `Sekarang giliran ${p} ngumpetin kapal. ${other(p)}, jangan ngintip ya!`, `Aku ${p}, atur kapal →`, () => paintPlace()); return; }
  paintPlace();
}
function paintPlace() {
  const p = placing[placeIdx];
  show('s-place');
  $('pl-title').className = 'who-title ' + p;
  $('pl-title').textContent = MODE !== 'duo' ? '⚓ Atur kapal kamu' : `⚓ Kapal ${p}`;
  $('pl-btns').style.display = ''; $('pl-wait').style.display = 'none';
  renderSea($('pl-sea'), p, { showShips: true });
  $('pl-fleet').innerHTML = FLEET.map(f => `<span>${f.ico} ${f.name} · ${f.len}</span>`).join('');
}
function reroll() { S[placing[placeIdx]] = randomFleet(); paintPlace(); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
function ready() {
  if (MODE === 'online') {
    if (fleetSent) return;
    fleetSent = true; Online.move({ t: 'f', w: HUMAN, s: S[HUMAN].ships.map(x => x.cells) }, { retry: true });
    if (S[other(HUMAN)]) startOnline(); else { $('pl-btns').style.display = 'none'; $('pl-wait').style.display = ''; $('pl-wait').innerHTML = `⏳ Kapal kamu udah siap! Nunggu <b>${other(HUMAN)}</b> selesai ngatur kapal…`; Online.waiting(true); }
    return;
  }
  placeIdx++;
  if (placeIdx < placing.length) { beginPlace(); return; }
  over = false; busy = false; shotsCount = { Razan: 0, Dara: 0 }; lastShot = { Razan: -1, Dara: -1 };
  turn = MODE === 'bot' ? HUMAN : (Math.random() < .5 ? 'Razan' : 'Dara');
  if (MODE === 'duo') passScreen(turn, `${turn} jalan duluan! ${other(turn)}, kasih HP-nya ke ${turn} ya 🙈`, `Aku ${turn}, mulai 🎯`, () => { show('s-game'); renderGame(); });
  else { show('s-game'); renderGame(); }
}

/* ── layar gantian ── */
let passCb = null;
function passScreen(p, txt, btn, cb) {
  $('pass-title').textContent = `Giliran ${p} 🎯`;
  $('pass-txt').textContent = txt;
  $('pass-btn').textContent = btn; $('pass-btn').className = p;
  passCb = cb; $('pass').classList.add('show');
}
function passGo() { $('pass').classList.remove('show'); const cb = passCb; passCb = null; if (cb) cb(); }

/* ── gambar laut ── */
function renderSea(el, owner, opt) {
  const st = S[owner];
  el.innerHTML = '';
  for (let i = 0; i < N * N; i++) {
    const b = document.createElement(opt.target ? 'button' : 'div');
    b.className = 'sq';
    const si = st.board[i], v = st.recv[i];
    const sunk = si >= 0 && isSunk(st.ships[si]);
    if (opt.showShips && si >= 0) b.classList.add('ship', owner);
    if (v === 1) b.classList.add('miss', 'shot');
    if (v === 2) b.classList.add(sunk ? 'sunk' : 'hit', 'shot');
    if (opt.target && sunk) b.classList.add('ship', owner);
    if (opt.last === i) b.classList.add('last', v === 2 ? 'boom' : 'splash');
    if (opt.target) { b.setAttribute('aria-label', `Baris ${Math.floor(i / N) + 1} kolom ${i % N + 1}`); b.onclick = () => fire(i); }

  }
}
const isSunk = s => s.hit.size === s.len;
function fleetHTML(owner) { return S[owner].ships.map(s => `<span class="${isSunk(s) ? 'dead' : ''}">${s.ico} ${s.name}</span>`).join(''); }
function shooterNow() { return turn; }
function renderGame(lastIdx) {
  const me = MODE !== 'duo' ? HUMAN : turn, op = other(me);
  const myTurn = MODE === 'duo' || turn === HUMAN;
  $('tb-who').className = 'tb-who ' + turn;
  $('tb-who').textContent = over ? '🏁 Selesai' : MODE === 'online' ? (turn === HUMAN ? '🎯 Giliran kamu nembak' : `⏳ Nunggu ${turn} nembak…`) : MODE === 'bot' ? (turn === HUMAN ? '🎯 Giliran kamu nembak' : '🤖 Komputer lagi bidik…') : `🎯 Giliran ${turn}`;
  $('tb-stat').textContent = `${shotsCount[me]} tembakan`;
  $('tg-lbl').textContent = MODE === 'bot' ? '🌊 Laut komputer' : `🌊 Laut ${op}`;
  const left = S[op].ships.filter(s => !isSunk(s)).length;
  $('tg-left').textContent = `${left} kapal sisa`;
  const tg = $('tg-sea');
  tg.className = 'sea target' + (!myTurn || over || busy ? ' locked' : '');
  renderSea(tg, op, { target: true, last: lastIdx != null ? lastIdx : lastShot[me] });
  $('tg-fleet').innerHTML = fleetHTML(op);
  renderSea($('my-sea'), me, { showShips: true, last: lastShot[op] });
  $('my-lbl').textContent = MODE === 'bot' ? 'Laut kamu' : `Laut ${me}`;
  const lost = S[me].ships.filter(isSunk).length;
  $('my-txt').textContent = lost ? `${lost} kapal udah tenggelam 😢` : 'Semua kapal masih aman ⚓';
  $('my-fleet').innerHTML = fleetHTML(me);
}

/* ── nembak ── */
function fire(i) {
  if (over || busy) return;
  if (MODE !== 'duo' && turn !== HUMAN) return;
  const op = other(turn);
  if (S[op].recv[i]) return;
  if (MODE === 'online') Online.move({ t: 's', w: HUMAN, i });
  shoot(turn, i);
}
function shoot(shooter, i) {
  const op = other(shooter), st = S[op];
  const si = st.board[i];
  st.recv[i] = si >= 0 ? 2 : 1;
  if (!REPLAY) window.SFX && SFX.play(si >= 0 ? 'boom' : 'splash');
  lastShot[shooter] = i; shotsCount[shooter]++;
  let msg;
  const who = MODE === 'bot' && shooter === BOT ? '🤖 Komputer' : MODE !== 'duo' && shooter === HUMAN ? 'Kamu' : shooter;
  if (si >= 0) {
    const ship = st.ships[si]; ship.hit.add(i);
    msg = isSunk(ship) ? `💥 ${who} nenggelamin ${ship.name}!` : `🔥 ${who} kena!`;
    if (!REPLAY) try { navigator.vibrate && navigator.vibrate(isSunk(ship) ? [40, 40, 80] : 30); } catch (e) {}
  } else { msg = `💧 ${who} meleset`; if (!REPLAY) try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
  $('log').textContent = msg;
  const won = st.ships.every(isSunk);
  if (won) { over = true; if (REPLAY) { winnerReplay = shooter; return; } renderGame(i); if (MODE === 'online') Online.waiting(false); setTimeout(() => finish(shooter), 900); return; }
  // gantian
  turn = op;
  if (MODE === 'online') { if (REPLAY) return; busy = false; renderGame(shooter === HUMAN ? i : undefined); Online.waiting(turn !== HUMAN); if (turn === HUMAN) vib0([20, 30, 20]); return; }
  if (MODE === 'bot') {
    busy = true; renderGame(shooter === HUMAN ? i : undefined);
    if (turn === BOT) setTimeout(botTurn, 650 + Math.random() * 350);
    else busy = false, renderGame();
  } else {
    busy = true;
    // tunjukin hasil tembakan dulu, baru layar gantian
    renderGameShooterView(shooter, i);
    setTimeout(() => { if (over) return; busy = false; passScreen(turn, `${shooter} udah nembak. Kasih HP-nya ke ${turn} — jangan ngintip laut kamu sendiri ya 🙈`, `Aku ${turn}, lanjut 🎯`, () => renderGame()); }, 1300);
  }
}
function renderGameShooterView(shooter, i) {
  // sebentar tampilin dari sudut pandang penembak (turn udah pindah)
  const t = turn; turn = shooter; const b = busy; busy = true;
  renderGame(i); turn = t; busy = b;
  $('tb-who').textContent = `🎯 ${shooter} · lihat hasilnya…`;
}
function botTurn() {
  if (over || MODE !== 'bot') return;
  const i = botPick();
  busy = false;
  shoot(BOT, i);
  if (!over) { busy = false; renderGame(); }
}

/* ── KOMPUTER ── */
function botPick() {
  const st = S[HUMAN], recv = st.recv;
  const untried = []; for (let i = 0; i < N * N; i++) if (!recv[i]) untried.push(i);
  // kotak "kena" yang kapalnya belum tenggelam (info yang emang keliatan)
  const openHits = []; for (let i = 0; i < N * N; i++) if (recv[i] === 2 && !isSunk(st.ships[st.board[i]])) openHits.push(i);
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  if (level === 0) {
    if (openHits.length && Math.random() < .45) { const nb = openHits.flatMap(neigh4).filter(j => !recv[j]); if (nb.length) return rnd(nb); }
    return rnd(untried);
  }
  if (level === 1) {
    if (openHits.length) {
      const line = lineTargets(openHits, recv); if (line.length) return rnd(line);
      const nb = openHits.flatMap(neigh4).filter(j => !recv[j]); if (nb.length) return rnd(nb);
    }
    const par = untried.filter(i => (Math.floor(i / N) + i % N) % 2 === 0);
    return rnd(par.length ? par : untried);
  }
  // Jago: peta peluang (semua kemungkinan posisi kapal yang masih hidup)
  const heat = new Float64Array(N * N);
  const blocked = i => recv[i] === 1 || (recv[i] === 2 && isSunk(st.ships[st.board[i]]));
  const alive = st.ships.filter(s => !isSunk(s)).map(s => s.len);
  const hitSet = new Set(openHits);
  for (const len of alive) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const hor of [true, false]) {
    if (hor ? c + len > N : r + len > N) continue;
    const cells = Array.from({ length: len }, (_, k) => hor ? r * N + c + k : (r + k) * N + c);
    if (cells.some(blocked)) continue;
    // kapal yang tenggelam ga nempel kapal lain → tetangga kapal tenggelam juga mustahil
    if (cells.some(i => neigh8(i).some(j => recv[j] === 2 && isSunk(st.ships[st.board[j]])))) continue;
    const covered = cells.filter(i => hitSet.has(i)).length;
    const w = openHits.length ? (covered ? Math.pow(40, covered) : 0) : 1;
    if (!w) continue;
    cells.forEach(i => { if (!recv[i]) heat[i] += w; });
  }
  let best = -1, pick = [];
  for (const i of untried) { if (heat[i] > best) { best = heat[i]; pick = [i]; } else if (heat[i] === best) pick.push(i); }
  return rnd(pick.length ? pick : untried);
}
function neigh4(i) { const r = Math.floor(i / N), c = i % N, o = []; if (r) o.push(i - N); if (r < N - 1) o.push(i + N); if (c) o.push(i - 1); if (c < N - 1) o.push(i + 1); return o; }
function lineTargets(hits, recv) {
  const out = [];
  for (const h of hits) for (const [d, ok] of [[1, x => x % N !== N - 1], [-1, x => x % N !== 0], [N, x => x < N * (N - 1)], [-N, x => x >= N]]) {
    if (!ok(h) || !hits.includes(h + d)) continue;
    // ada 2 kena sejajar → terusin ke dua ujungnya
    let a = h; while (hits.includes(a + d) && ok(a)) a += d;
    if (ok(a) && !recv[a + d]) out.push(a + d);
    let b = h; const back = -d, okb = d === 1 ? x => x % N !== 0 : d === -1 ? x => x % N !== N - 1 : d === N ? x => x >= N : x => x < N * (N - 1);
    while (hits.includes(b + back) && okb(b)) b += back;
    if (okb(b) && !recv[b + back]) out.push(b + back);
  }
  return [...new Set(out)].filter(i => i >= 0 && i < N * N);
}

/* ── selesai ── */
function finish(winner) {
  over = true; busy = false;
  const rec = lsGet('bs-record', { Razan: 0, Dara: 0, beat: [0, 0, 0] });
  const humanWon = MODE !== 'duo' && winner === HUMAN;
  if (MODE !== 'duo' && !humanWon) setTimeout(() => window.SFX && SFX.play('lose'), 400);
  if (MODE !== 'bot') rec[winner]++; else if (humanWon) rec.beat[level]++;
  lsSet('bs-record', rec);
  const shots = shotsCount[winner];
  $('s-ico').textContent = MODE === 'bot' ? (humanWon ? '🏆' : '🤖') : MODE === 'online' && !humanWon ? '🥲' : '🏆';
  const t = $('s-title'); t.className = 's-title ' + (MODE === 'bot' && !humanWon ? '' : winner);
  t.textContent = MODE === 'bot' ? (humanWon ? 'Kamu menang! ⚓' : 'Komputer menang…') : MODE === 'online' && humanWon ? 'Kamu menang! ⚓' : `${winner} menang! ⚓`;
  $('s-sub').textContent = `Semua kapal lawan tenggelam dalam ${shots} tembakan (akurasi ${Math.round(FLEET.reduce((a, f) => a + f.len, 0) / shots * 100)}%)`;
  const box = $('s-box');
  if (MODE === 'bot') box.innerHTML = `<small>${humanWon ? 'Keren!' : 'Semangat!'}</small>${humanWon ? (level < 2 ? `Coba level ${LEVELS[level + 1]} yuk 😏` : 'Komputer level Jago pun kalah. Juara! 🧠✨') : 'Komputernya cuma lagi hoki 😤 Balas dendam yuk!'}`;
  else box.innerHTML = `<small>Tantangan buat ${other(winner)}</small>${DEMANDS[Math.floor(Math.random() * DEMANDS.length)]}`;
  // tunjukin semua kapal di akhir
  if (MODE !== 'duo') { renderSea($('tg-sea'), other(HUMAN), { showShips: true, target: false }); $('tg-sea').className = 'sea locked'; }
  $('res-ov').classList.add('show');

}
function closeRes() { $('res-ov').classList.remove('show'); }
function confetti(w) {
  const colors = w === 'Razan' ? ['#4a7fc1', '#7eb3f5', '#c9a96e', '#fff'] : ['#d9776b', '#f0a39a', '#c9a96e', '#fff'];
  for (let i = 0; i < 70; i++) setTimeout(() => {
    const el = document.createElement('div'); el.className = 'cp';
    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 4200);
  }, i * 20);
}
paintPick();

/* ── main online (beda HP) ── */
let winnerReplay = null;
function vib0(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function fleetFrom(cells) {
  const board = new Int8Array(N * N).fill(-1);
  const ships = FLEET.map((f, k) => { (cells[k] || []).forEach(i => board[i] = k); return Object.assign({}, f, { cells: cells[k] || [], hit: new Set() }); });
  return { board, ships, recv: new Int8Array(N * N) };
}
function startOnline() {
  over = false; busy = false; $('pass').classList.remove('show');
  show('s-game'); renderGame();
  $('log').textContent = turn === HUMAN ? '🎲 Kamu jalan duluan! Tembak laut lawan 🎯' : `🎲 ${turn} jalan duluan — tunggu ya`;
  Online.waiting(turn !== HUMAN);
}
if (window.Online) Online.setup({
  g: 'perang-kapal', panelAfter: '#s-pick .big', statusEl: 'ol-st',
  makeCfg: () => ({ first: Math.random() < .5 ? 'Razan' : 'Dara' }),
  onStart(room, me) {
    closeRes(); $('pass').classList.remove('show');
    MODE = 'online'; HUMAN = me; BOT = null; S = {}; over = false; busy = false; winnerReplay = null;
    shotsCount = { Razan: 0, Dara: 0 }; lastShot = { Razan: -1, Dara: -1 };
    turn = room.cfg && room.cfg.first || 'Razan';
    REPLAY = true;
    try {
      for (const mv of room.moves) {
        if (mv.t === 'f' && !S[mv.w]) S[mv.w] = fleetFrom(mv.s);
        else if (mv.t === 's' && S.Razan && S.Dara && !over && mv.w === turn && !S[other(mv.w)].recv[mv.i]) shoot(mv.w, mv.i);
      }
    } finally { REPLAY = false; }
    fleetSent = !!S[HUMAN];
    if (!S[HUMAN]) { placing = [HUMAN]; placeIdx = 0; S[HUMAN] = randomFleet(); paintPlace(); Online.waiting(false); return; }
    if (!S[other(HUMAN)]) { paintPlace(); $('pl-btns').style.display = 'none'; $('pl-wait').style.display = ''; $('pl-wait').innerHTML = `⏳ Nunggu <b>${other(HUMAN)}</b> selesai ngatur kapal…`; Online.waiting(true); return; }
    startOnline();
    if (winnerReplay) { over = true; renderGame(); finish(winnerReplay); }
  },
  async onMove(mv) {
    if (MODE !== 'online') return;
    if (mv.t === 'f') {
      if (mv.w === HUMAN || S[mv.w] && fleetSent) return;
      S[mv.w] = fleetFrom(mv.s);
      if (fleetSent) { vib0([30, 30, 30]); startOnline(); }
      return;
    }
    if (mv.t === 's') {
      if (mv.w === HUMAN || over || mv.w !== turn || !S.Razan || !S.Dara) return;

</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
