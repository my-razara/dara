otes','Razan yang beli/siapin cemilan','Bisa online atau bioskop','Tidak ada batas waktu penggunaan'], memo:'Film apapun — pilihan Dara final', cat:'Hiburan' },\n  { id:'makan', emoji:'🍽️', title:'Bebas Pilih Tempat Makan', value:'SATU (1) KALI MAKAN', payto:'Dara Syifa Aulia', amount:'1x Dinner/Makan Siang',\n    desc:'Dara boleh milih tempat makan apapun — dari warteg sampai restoran fancy, Razan yang bayar dan ga boleh komplain soal harga.',\n    terms:['Pilihan tempat 100% milik Dara','Razan yang bayar — no complain','Berlaku untuk makan siang atau malam','Bisa kapanpun Dara mau'], memo:'Pilihan Dara adalah hukum', cat:'Kuliner' },\n  { id:'marah', emoji:'🕊️', title:'Bebas dari Omelan', value:'SATU (1) KALI BEBAS MARAH', payto:'Dara Syifa Aulia', amount:'1x Immunity Card',\n    desc:'Apapun yang Razan lakuin hari itu — ga boleh dimarahin, ga boleh disambat, ga boleh di-silent treatment. Berlaku seharian penuh.',\n    terms:['Berlaku seharian — dari bangun sampai tidur','Dara ga boleh ngambek atau marah hari itu','Razan tetap minta maaf kalau salah','Tidak berlaku untuk hal yang menyakiti serius'], memo:'Satu hari bebas dari omelan sayang', cat:'Privilege' },\n  { id:'jalan', emoji:'🚗', title:'Date Surprise', value:'SATU (1) DATE DADAKAN', payto:'Dara Syifa Aulia', amount:'1x Full Day Date',\n    desc:'Cairkan kapanpun, Razan akan atur date spesial hari itu — dari tempat, transport, sampai makan. Semua kejutan.',\n    terms:['Razan yang atur semua — Dara tinggal siap-siap','Kasih tau H-1 biar Razan bisa persiapan','Tempat surprise — Dara ga boleh tanya','Dara hanya perlu cantik dan happy 🤍'], memo:'Tinggal bilang, Razan yang urus', cat:'Petualangan' },\n  { id:'pijat', emoji:'💆', title:'Pijat Kepala Gratis', value:'SATU (1) SESI PIJAT', payto:'Dara Syifa Aulia', amount:'30 Menit Pijat Kepala',\n    desc:'30 menit pijat kepala, punggung, atau bahu — kapanpun Dara capek atau stres. Razan yang mijit, ga ada biaya apapun.',\n    terms:['Minimal 30 menit — kalau Dara mau lebih, oke','Razan ga boleh complain atau buru-buru','Bisa disambi nonton atau dengerin musik','Tidak ada masa kadaluarsa'], memo:'Tangan Razan selalu ada buat Dara', cat:'Self-care' },\n  { id:'masak', emoji:'🍳', title:'Razan Masak Buat Dara', value:'SATU (1) KALI MASAK', payto:'Dara Syifa Aulia', amount:'1x Homemade Meal',\n    desc:'Razan masak makanan spesial buat Dara — dari belanja sampai menyajikan. Dara tinggal duduk dan makan.',\n    terms:['Dara boleh request menu apapun','Razan yang belanja dan masak','Dara ga perlu bantu beres-beres','Kalau gagal, Razan yang pesan delivery 😅'], memo:'Dengan cinta dari dapur Razan', cat:'Kuliner' },\n  { id:'menang', emoji:'🏆', title:'Dara Selalu Menang', value:'SATU (1) KALI DARA BENAR', payto:'Dara Syifa Aulia', amount:'1x Kartu Kemenangan',\n    desc:'Apapun yang lagi diperdebatkan hari itu — Dara yang menang. Razan mengakui Dara benar tanpa tapi, tanpa syarat.',\n    terms:['Berlaku untuk 1 perdebatan/pertengkaran','Razan wajib bilang \"iya, kamu bener\"','Tidak boleh dikomplain setelahnya','Tidak berlaku untuk hal yang membahayakan'], memo:'Karena Dara selalu punya point', cat:'Privilege' },\n  { id:'bebas', emoji:'🌸', title:'Me Time Tanpa Diganggu', value:'SATU (1) HARI ME TIME', payto:'Dara Syifa Aulia', amount:'1x Hari Bebas Total',\n    desc:'Sehari penuh — Dara bebas lakuin apapun yang dia mau, Razan ga akan ganggu, ga akan tanya-tanya, ga akan minta waktu.',\n    terms:['Berlaku seharian — Razan tidak akan chat dulu','Dara bebas pergi kemana pun','Razan akan tunggu kabar dari Dara','Tetap aman dan kasih tau kalau ada apa-apa'], memo:'Waktu untuk dirimu sendiri 🌸', cat:'Self-care' },\n  { id:'keputusan', emoji:'👑', title:'Dara Pegang Keputusan', value:'SATU (1) HARI FULL KONTROL', payto:'Dara Syifa Aulia', amount:'1x Kartu Keputusan',\n    desc:'Semua keputusan hari itu — mau ngapain, mau kemana, mau makan apa — ada di tangan Dara. Razan nurut 100%.',\n    terms:['Keputusan Dara final dan tidak bisa di-veto','Razan akan ikut kemanapun','Berlaku dari pagi sampai malam','Razan janji tidak akan ngeluh'], memo:'Hari ini, Dara adalah bosnya', cat:'Privilege' },\n  { id:'foto', emoji:'📸', title:'Sesi Foto Bareng', value:'SATU (1) SESI FOTO', payto:'Dara Syifa Aulia', amount:'1x Photo Session',\n    desc:'Satu sesi foto bareng di tempat yang Dara mau — Razan akan bawa tripod, atur lighting, dan pastikan hasilnya bagus.',\n    terms:['Lokasi pilihan Dara','Razan yang atur setup foto','Minimal 1 jam sesi foto','Semua foto jadi milik Dara'], memo:'Kenangan yang Dara mau abadikan', cat:'Kenangan' },\n  { id:'nulis', emoji:'💌', title:'Surat Cinta Khusus', value:'SATU (1) SURAT CINTA', payto:'Dara Syifa Aulia', amount:'1x Handwritten Letter',\n    desc:'Razan akan nulis surat tangan — dengan perasaan, tentang apa yang Razan rasain saat itu. Bukan copy-paste, bukan ketik — tangan.',\n    terms:['Razan nulis dengan tangan sendiri','Isi surat jujur dan dari hati','Dara boleh minta tema/topik tertentu','Dikirim langsung atau via post kalau mau nostalgic'], memo:'Kata-kata yang tidak bisa diketik', cat:'Kenangan' },\n  { id:'pelukan', emoji:'🤗', title:'Pelukan Kapanpun', value:'SATU (1) PELUKAN EKSTRA PANJANG', payto:'Dara Syifa Aulia', amount:'1x Hug On Demand',\n    desc:'Cairkan kapanpun Dara butuh — Razan akan berhenti dari apapun yang lagi dikerjain dan memeluk Dara selama yang Dara butuhkan.',\n    terms:['Bisa dicairkan kapanpun — tengah malam sekalipun','Razan berhenti apapun aktivitasnya','Durasi pelukan sesuai kebutuhan Dara','Tidak ada penolakan, tidak ada syarat'], memo:'Karena kamu selalu butuh pelukan 🤍', cat:'Cinta' },\n  { id:'kosong', blank:true, emoji:'✍️', title:'Cek Kosong', value:'NILAI DITULIS DARA SENDIRI', payto:'Dara Syifa Aulia', amount:'Isi sesuka hati',\n    desc:'Cek spesial yang belum ada isinya — Dara tulis sendiri mau apa. Razan udah tanda tangan duluan, jadi wajib ditepati 😌',\n    terms:['Isinya bebas, ditulis Dara sendiri','Wajar & bisa diwujudkan ya 😆','Razan udah tanda tangan — nggak bisa ditolak','Cuma ada 1 lembar, pakai dengan bijak'], memo:'Tanda tangan duluan, isinya belakangan', cat:'Spesial' },\n];\n\n// ═════════ STATE ═════════\n// used[id] = { at, status:'wait'|'done', when, note, doneAt, custom:{title,desc} }\nconst KEY = 'buku-cek-v2', OLD = 'buku-cek-used';\nlet S = { used: {} };\ntry {\n  const d = JSON.parse(localStorage.getItem(KEY) || 'null');\n  if (d) S = d;\n  else { const old = JSON.parse(localStorage.getItem(OLD) || '[]'); old.forEach(id => S.used[id] = { at: null, status: 'done' }); } // cek lama dianggap udah ditepati\n} catch {}\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }\nlet tab = 'left', currentId = null, busy = false, justCashed = null;\nconst $ = id => document.getElementById(id);\nconst byId = id => CHECKS.find(c => c.id === id);\nfunction esc(s) { return String(s || '').replace(/[&<>\"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;' }[c])); }\nfunction fmtD(t) { return t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }\nfunction titleOf(c) { const u = S.used[c.id]; return c.blank && u && u.custom ? u.custom.title : c.title; }\nfunction descOf(c) { const u = S.used[c.id]; return c.blank && u && u.custom ? u.custom.desc : c.desc; }\nfunction counts() { const left = CHECKS.filter(c => !S.used[c.id]).length, wait = Object.values(S.used).filter(u => u.status === 'wait').length, done = Object.values(S.used).filter(u => u.status === 'done').length; return { left, wait, done }; }\nfunction toast(m) { document.querySelectorAll('.toast').forEach(e => e.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\n\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); if (id === 's-intro') renderIntro(); }\nfunction renderIntro() { const c = counts(); $('ii-left').textContent = c.left; $('ii-wait').textContent = c.wait; $('ii-done').textContent = c.done; }\nfunction openBook() { const c = counts(); if (!c.left && tab === 'left') tab = c.wait ? 'wait' : 'all'; showScreen('s-book'); renderBook(); }\n\n// ═════════ BUKU ═════════\nfunction renderBook() {\n  const c = counts();\n  $('bh-count').textContent = `${c.left}/${CHECKS.length} tersisa`;\n  const TABS = [['left', '📒 Tersisa', c.left], ['wait', '⏳ Nunggu', c.wait], ['done', '✅ Ditepati', c.done], ['all', 'Semua', CHECKS.length]];\n  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button class=\"tab ${tab === k ? 'on' : ''}\" onclick=\"tab='${k}';renderBook()\">${l} <b>${n}<\/b><\/button>`).join('');\n  const list = CHECKS.map((ch, i) => ({ ch, i })).filter(({ ch }) => { const u = S.used[ch.id]; return tab === 'all' || (tab === 'left' && !u) || (u && u.status === tab); });\n  const body = $('book-body');\n  if (!list.length) {\n    const msg = { left: 'Semua cek udah dicairkan! 🥹<br>Buku ini habis — tapi sayangnya Razan nggak ada habisnya.', wait: 'Nggak ada cek yang lagi nunggu ditepati.<br>Razan <b>on time<\/b> semua nih 😎', done: 'Belum ada cek yang ditepati.<br>Cairkan satu dulu yuk 💸' }[tab];\n    body.innerHTML = `<div class=\"empty\">${msg}<\/div>${tab === 'left' ? refillHTML() : ''}`;\n    return;\n  }\n  body.innerHTML = list.map(({ ch, i }) => checkHTML(ch, i)).join('') + (tab === 'all' && !c.left ? refillHTML() : '');\n  body.querySelectorAll('.check-item').forEach(el => el.onclick = () => openDetail(el.dataset.id));\n  body.scrollTop = 0;\n}\nfunction refillHTML() {\n  if (counts().left) return '';\n  const msg = encodeURIComponent('Sayaaang 📒 Buku Cek Cinta aku udah habis semua nih... boleh minta buku cek baru ga? 🥺🤍');\n  return `<div class=\"refill\"><p>📒 Semua lembar udah terpakai.<br>Minta Razan bikinin buku cek edisi baru?<\/p><a class=\"btn btn-wa\" href=\"https://wa.me/${WA_NUMBER}?text=${msg}\" target=\"_blank\">📲 Minta Buku Cek Baru<\/a><\/div>`;\n}\nfunction checkHTML(ch, idx) {\n  const u = S.used[ch.id];\n  const stamp = u ? `<div class=\"used-stamp ${u.status}\">${u.status === 'done' ? '✓ DITEPATI' : '⏳ DICAIRKAN'}<small>${u.status === 'done' ? fmtD(u.doneAt || u.at) : fmtD(u.at)}<\/small><\/div>` : '';\n  return `<div class=\"check-item ${u ? 'used' : ''} ${ch.blank ? 'blank' : ''}\" data-id=\"${ch.id}\">\n    <div class=\"check-paper\">\n      <div class=\"check-stub\"><span class=\"stub-num\">CEK #${String(idx + 1).padStart(2, '0')}<\/span><\/div>\n      <div class=\"check-body\">\n        <div class=\"check-bank\"><span class=\"bank-name\">🏦 Bank Cinta Razan<\/span><span class=\"bank-date\">${u && u.at ? 'Cair ' + fmtD(u.at) : 'Berlaku selamanya'}<\/span><\/div>\n        <div class=\"check-payto\"><span class=\"payto-label\">Bayarkan kepada:<\/span><span class=\"payto-name\">${ch.payto}<\/span><\/div>\n        <div class=\"check-amount-row\"><span class=\"amount-text\">${ch.blank && u && u.custom ? esc(u.custom.title) : ch.amount}<\/span><span class=\"amount-box\">${ch.emoji}<\/span><\/div>\n        <div class=\"check-desc\">${esc(descOf(ch))}<\/div>\n        <div class=\"check-footer\"><span class=\"check-memo\">${ch.memo}<\/span><div><span class=\"check-sig\">Razan<\/span><span class=\"check-sig-label\">Tanda Tangan<\/span><\/div><\/div>\n      <\/div>\n      <div class=\"check-micr\">⑆ 0607 ⑆ 1718 ⑆ ${String(idx + 1).padStart(4, '0')} ⑇<\/div>\n      ${stamp}\n    <\/div><div class=\"check-tear\"><\/div><\/div>`;\n}\n\n// ═════════ DETAIL ═════════\nfunction openDetail(id) {\n  const ch = byId(id); if (!ch) return; currentId = id;\n  const u = S.used[id];\n  let status = '', btns = '';\n  if (!u) btns = `<div class=\"ds-row\"><button class=\"btn btn-p\" onclick=\"openCairkan()\">Cairkan Sekarang 💸<\/button><button class=\"btn btn-o\" onclick=\"closeOv('detail-overlay')\">Simpan Dulu<\/button><\/div>`;\n  else if (u.status === 'wait') {\n    status = `<div class=\"ds-status wait\">⏳ <b>Dicairkan ${fmtD(u.at)}<\/b> — lagi nunggu Razan menepati.${u.when ? `<br>🗓️ Kapan: <b>${esc(u.when)}<\/b>` : ''}${u.note ? `<br>📝 ${esc(u.note)}` : ''}<\/div>`;\n    btns = `<a class=\"btn btn-wa\" href=\"${waLink(ch, u, justCashed !== id)}\" target=\"_blank\">${justCashed === id ? '📲 Kabarin Razan sekarang!' : '📲 Tagih ke Razan'}<\/a>\n      <button class=\"btn btn-ok\" onclick=\"markDone()\">✓ Udah Ditepati Razan<\/button>\n      <button class=\"btn-link\" onclick=\"undoCash()\">↩️ Batalin (salah pencet)<\/button>`;\n  } else {\n    status = `<div class=\"ds-status done\">✅ <b>Ditepati ${fmtD(u.doneAt || u.at)}<\/b> — Razan udah menepati janjinya 🤍${u.when ? `<br>🗓️ ${esc(u.when)}` : ''}<\/div>`;\n    btns = `<button class=\"btn btn-o\" onclick=\"closeOv('detail-overlay')\">Tutup<\/button>`;\n  }\n  $('detail-sheet').innerHTML = `<div class=\"ds-drag\"><\/div>\n    <div class=\"ds-check-preview\"><span class=\"ds-emoji\">${ch.emoji}<\/span><p class=\"ds-title\">${esc(titleOf(ch))}<\/p><p class=\"ds-value\">${ch.value}<\/p><p class=\"ds-desc\">${esc(descOf(ch))}<\/p><\/div>\n    ${status}\n    <div class=\"ds-terms\"><span class=\"ds-terms-title\">📋 Syarat & Ketentuan<\/span>${ch.terms.map(t => `<div class=\"ds-term\"><span>✦<\/span><span>${t}<\/span><\/div>`).join('')}<\/div>\n    <div class=\"ds-btns\">${btns}<\/div>`;\n  $('detail-overlay').classList.add('show');\n}\nfunction closeOv(id) { $(id).classList.remove('show'); }\n\n// ═════════ CAIRKAN ═════════\nfunction openCairkan() {\n  const ch = byId(currentId); if (!ch || S.used[ch.id]) return;\n  const blank = ch.blank ? `<label class=\"field-lbl\">✍️ Kamu mau apa?<\/label><input class=\"field\" id=\"cf-title\" maxlength=\"40\" placeholder=\"misal: Sarapan di tempat favorit\">\n    <label class=\"field-lbl\">Ceritain dikit<\/label><textarea class=\"field\" id=\"cf-desc\" rows=\"2\" maxlength=\"120\" placeholder=\"misal: kamu yang jemput jam 7 pagi, aku yang pilih menu 😌\"><\/textarea>` : '';\n  $('confirm-sheet').innerHTML = `<span class=\"cf-icon\">${ch.emoji}<\/span>\n    <h2 class=\"cf-title\">Cairkan \"${esc(ch.title)}\"?<\/h2>\n    <p class=\"cf-sub\">Sekali dicairkan, lembar ini dipakai. Razan bakal dikabarin lewat WA 🤍<\/p>\n    ${blank}\n    <label class=\"field-lbl\">🗓️ Kapan mau dicairkan? (opsional)<\/label>\n    <input class=\"field\" id=\"cf-when\" maxlength=\"40\" placeholder=\"misal: Sabtu ini / hari ini juga!\">\n    <div class=\"quick-when\"><button onclick=\"$('cf-when').value='Hari ini juga! 🔥'\">Hari ini<\/button><button onclick=\"$('cf-when').value='Weekend ini'\">Weekend ini<\/button><button onclick=\"$('cf-when').value='Kapan kamu sempet aja'\">Kapan sempet<\/button><\/div>\n    <label class=\"field-lbl\">📝 Catatan buat Razan (opsional)<\/label>\n    <textarea class=\"field\" id=\"cf-note\" rows=\"2\" maxlength=\"120\" placeholder=\"misal: filmnya aku yang pilih ya 😆\"><\/textarea>\n    <div class=\"ds-row\"><button class=\"btn btn-p\" onclick=\"confirmCairkan()\">Ya, Cairkan! 💸<\/button><button class=\"btn btn-o\" onclick=\"closeOv('confirm-overlay')\">Batal<\/button><\/div>`;\n  $('confirm-overlay').classList.add('show');\n}\nfunction confirmCairkan() {\n  if (busy) return;\n  const ch = byId(currentId); if (!ch || S.used[ch.id]) return;   // anti dobel pencet\n  let custom = null;\n  if (ch.blank) {\n    const t = $('cf-title').value.trim();\n    if (!t) { $('cf-title').focus(); toast('Tulis dulu mau apa ✍️'); return; }\n    custom = { title: t, desc: $('cf-desc').value.trim() || 'Ditulis sendiri sama Dara — wajib ditepati 😌' };\n  }\n  busy = true;\n  const u = { at: Date.now(), status: 'wait', when: $('cf-when').value.trim(), note: $('cf-note').value.trim(), custom };\n  S.used[ch.id] = u; save();\n  closeOv('confirm-overlay'); closeOv('detail-overlay');\n  $('sf-text').textContent = `\"${titleOf(ch)}\" dicairkan! 💸`;\n  $('success-flash').classList.add('show'); vib([100, 50, 200]); confetti(60);\n  setTimeout(() => {\n    $('success-flash').classList.remove('show'); busy = false;\n    tab = 'wait'; renderBook(); justCashed = ch.id; openDetail(ch.id); justCashed = null;   // tombol WA di-tap sendiri (popup otomatis sering diblok HP)\n  }, 1700);\n}\nfunction waLink(ch, u, reminder) {\n  let msg = reminder ? `Sayaaang 🔔 Mau ngingetin nih — cek aku yang ini belum dicairin loh:\\n\\n` : `Sayaaang!! 💸 Aku baru nyairin cek dari Buku Cek Cinta:\\n\\n`;\n  msg += `${ch.emoji} *${titleOf(ch)}*\\n${descOf(ch)}`;\n  if (u.when) msg += `\\n\\n🗓️ Kapan: ${u.when}`;\n  if (u.note) msg += `\\n📝 ${u.note}`;\n  msg += `\\n\\nDicairkan: ${fmtD(u.at)}\\nTanda tangan kamu udah ada di cek ini, jadi wajib ditepati ya 😌🤍`;\n  return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);\n}\nfunction markDone() {\n  const u = S.used[currentId]; if (!u) return;\n  u.status = 'done'; u.doneAt = Date.now(); save();\n  closeOv('detail-overlay'); toast('✅ Janji ditepati! Makasih udah ngingetin 🤍'); confetti(40); vib([40, 20, 80]);\n  renderBook();\n}\nfunction undoCash() {\n  if (!confirm('Batalin pencairan cek ini? Lembarnya bakal balik lagi ke buku.')) return;\n  delete S.used[currentId]; save(); closeOv('detail-overlay'); toast('↩️ Cek dikembalikan ke buku'); renderBook();\n}\n\nfunction confetti(n) {\n  const colors = ['#c17a6f', '#c9a96e', '#e8c4b0', '#b5c4b1', '#fff'];\n  for (let i = 0; i < n; i++) setTimeout(() => {\n    const el = document.createElement('div'); el.className = 'cp';\n    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;\n    document.body.appendChild(el); setTimeout(() =>
