<style>
  :root{--cream:#faf6f0;--rose:#c17a6f;--deep:#7a3f35;--muted:#9a8070;--blush:#e8c4b0}

const PAGES = ["<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Ramalan Cinta Harian — Razan & Dara 🔮<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--night:#2a2140;--night2:#463463;--lav:#cdb8f0}\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  button{font-family:'Poppins',sans-serif}\n  html,body{background:var(--night)}\n  body{font-family:'Poppins',sans-serif;font-weight:300;color:#f4ecff;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 80% 50% at 50% 0%,#4a3870,transparent 70%),linear-gradient(#2a2140,#1c1630)}\n  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}\n  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}\n  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}\n  .hand{font-family:'Caveat',cursive}\n  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}\n  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}\n  .pill{font-size:12px;color:#d9ccf2;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(205,184,240,.25);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}\n  .head{text-align:center;margin:1.2rem 0 .4rem}\n  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}\n  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .2rem}\n  .title span{color:var(--lav)}\n  .date{font-size:12px;color:#b8a8d8}\n\n  .orb-wrap{display:flex;flex-direction:column;align-items:center;margin:1.4rem 0 .6rem}\n  .orb{width:min(210px,58vw);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(205,184,240,.55) 22%,rgba(122,90,190,.55) 55%,rgba(42,33,64,.9) 80%);box-shadow:0 0 60px rgba(205,184,240,.45),inset 0 -12px 30px rgba(0,0,0,.35);animation:float 4s ease-in-out infinite;overflow:hidden}\n  .orb::before{content:'';position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,200,230,.35),transparent 30%,rgba(160,200,255,.3),transparent 60%);animation:swirl 6s linear infinite;mix-blend-mode:screen}\n  .orb.shake{animation:sh .09s linear infinite}\n  .orb.shake::before{animation-duration:.8s}\n  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n  @keyframes swirl{to{transform:rotate(360deg)}}\n  @keyframes sh{0%{transform:translate(2px,0)}25%{transform:translate(0,2px)}50%{transform:translate(-2px,0)}75%{transform:translate(0,-2px)}}\n  .orb .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;z-index:1}\n  .stand{width:min(150px,42vw);height:22px;margin-top:-6px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#c9a96e,#7a5a2e);box-shadow:0 8px 20px rgba(0,0,0,.4)}\n  .hint{font-size:12.5px;color:#b8a8d8;margin-top:.9rem;text-align:center}\n\n  .read{display:none}\n  .read.show{display:block;animation:fi .6s ease}\n  @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  .card{background:rgba(255,255,255,.07);border:1px solid rgba(205,184,240,.2);border-radius:20px;padding:1rem;margin-bottom:.7rem;backdrop-filter:blur(4px)}\n  .card h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.35rem}\n  .main-txt{font-family:'Caveat',cursive;font-size:1.55rem;line-height:1.25;color:#fff}\n  .energy{display:flex;align-items:center;gap:.8rem}\n  .energy b{font-size:2rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}\n  .energy .bar{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}\n  .energy .bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#9f86d8,#f0a39a);width:0;transition:width 1.4s cubic-bezier(.3,1,.4,1)}\n  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.7rem}\n  .grid .card{margin:0;padding:.8rem .8rem}\n  .grid p{font-size:14px;font-weight:600;color:#fff;line-height:1.35}\n  .grid small{font-size:10.5px;color:#b8a8d8;display:block;margin-top:.15rem;line-height:1.4}\n  .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:.35rem;border:1.5px solid rgba(255,255,255,.6)}\n  .mission{display:flex;gap:.7rem;align-items:flex-start}\n  .mission .ck{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--lav);background:transparent;color:#fff;font-size:14px;cursor:pointer}\n  .mission.done .ck{background:#9f86d8;border-color:#9f86d8}\n  .mission p{font-size:13.5px;line-height:1.55;color:#fff}\n  .mission.done p{text-decoration:line-through;opacity:.6}\n  .warn{font-size:12.5px;line-height:1.6;color:#f4ecff}\n  .match{text-align:center}\n  .match .pp{display:flex;align-items:center;justify-content:center;gap:.6rem;font-size:13px;font-weight:600}\n  .match .pp .r{color:#9cc3f7}.match .pp .d{color:#f7b3aa}\n  .match b{display:block;font-size:2.6rem;font-weight:700;color:#fff;line-height:1.1;margin-top:.2rem}\n  .match small{font-size:11.5px;color:#b8a8d8}\n  .btn{display:block;width:100%;padding:.95rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#2a2140;background:linear-gradient(135deg,#e9dcff,#cdb8f0);cursor:pointer;margin-top:.4rem;text-align:center;text-decoration:none}\n  .streak{text-align:center;font-size:11.5px;color:#b8a8d8;margin-top:.9rem}\n  .tmr{text-align:center;font-size:11.5px;color:#8f80b0;margin-top:.3rem}\n  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.grid{gap:.45rem}.main-txt{font-size:1.4rem}}\n  @media (prefers-reduced-motion:reduce){.orb,.orb::before,.stars i{animation:none}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n<div class=\"stars\" id=\"stars\"><\/div>\n<div class=\"wrap\">\n  <div class=\"top\"><a href=\"index.html\" class=\"pill\">← Menu utama<\/a><span><\/span><\/div>\n  <div class=\"head\">\n    <p class=\"lbl\">Ramalan Cinta Harian<\/p>\n    <h1 class=\"title\">Bintang <span>Razara<\/span> 🔮<\/h1>\n    <p class=\"date\" id=\"date\"><\/p>\n  <\/div>\n  <div class=\"orb-wrap\" id=\"orb-wrap\">\n    <button class=\"orb\" id=\"orb\" aria-label=\"Lihat ramalan hari ini\"><span class=\"q\">✨<\/span><\/button>\n    <div class=\"stand\"><\/div>\n    <p class=\"hint\" id=\"hint\">Tap bola kristalnya buat liat ramalan kalian hari ini<\/p>\n  <\/div>\n  <div class=\"read\" id=\"read\"><\/div>\n<\/div>\n\n<\script>\nconst WA = { Razan: '6285692740607', Dara: '6287703706518' };\nconst READINGS = [\n  'Hari ini semesta lagi baik sama kalian. Satu chat kecil bisa bikin hari dia jauh lebih cerah.',\n  'Ada energi kangen yang kuat banget hari ini. Jangan ditahan — bilang aja.',\n  'Bintang bilang: hari yang cocok buat ngobrol panjang tanpa buru-buru.',\n  'Hati-hati salah paham kecil. Kalau ragu, tanya baik-baik — jangan nebak.',\n  'Hari ini cocok buat bikin rencana kencan. Tulis di Bucket List!',\n  'Ada kejutan kecil yang nunggu. Bisa dari kata-kata, bisa dari perhatian kecil.',\n  'Energi kalian hari ini lagi sinkron banget. Jangan kaget kalau mikirin hal yang sama.',\n  'Hari yang pas buat saling muji. Satu pujian tulus = mood naik seharian.',\n  'Bulan lagi bilang: istirahat yang cukup, biar besok bisa sayang-sayangan dengan semangat.',\n  'Hari ini salah satu dari kalian butuh didengerin. Siapin telinga, bukan solusi.',\n  'Kosmos lagi pro romantis. Kirim satu foto lama yang bikin senyum.',\n  'Ada rindu yang numpuk. Cara ngeredainnya: telpon 10 menit aja.',\n  'Hari yang cocok buat ketawa bareng. Kirim meme paling receh yang kamu punya.',\n  'Bintang kalian lagi deket banget hari ini — secara harfiah dan perasaan.',\n  'Bagus buat ngingetin hal kecil: udah makan? udah minum? udah istirahat?',\n  'Ada energi sabar yang lagi diuji. Lulus = dapet pelukan bonus.',\n  'Hari ini cocok buat jujur soal perasaan. Yang manis juga, yang bikin sebel juga.',\n  'Semesta nyaranin: kurangin scroll, perbanyak chat sama dia.',\n  'Hari yang pas buat nostalgia. Inget-inget lagi gimana awal kalian kenal.',\n  'Bintang jatuh malam ini (katanya). Siapin satu harapan berdua.',\n  'Hari ini kalian lagi kompak. Main game bareng, peluang menang tinggi!',\n  'Hati-hati: kemungkinan besar ada yang pengen dimanja. Penuhi tanpa syarat.',\n  'Ramalan hari ini simpel: kalian cocok. Udah, itu aja. 🤍',\n  'Ada kabar baik yang bakal kalian bagi berdua. Sabar ya.',\n  'Hari yang cocok buat bilang \"makasih udah ada\". Jarang diucapin, besar artinya.',\n  'Planet lagi rapi. Saatnya beresin satu hal yang selama ini ditunda bareng.',\n  'Hari ini energi cemburunya agak tinggi. Kasih kabar lebih sering ya biar adem.',\n  'Bintang ngasih bocoran: dia lagi mikirin kamu. Iya, sekarang.',\n];\nconst WEATHER = [['☀️', 'Cerah banget'], ['🌤️', 'Cerah berawan manja'], ['🌈', 'Pelangi abis hujan'], ['🌙', 'Tenang & adem'], ['🌸', 'Berbunga-bunga'], ['⛅', 'Agak mendung, butuh pelukan'], ['🔥', 'Panas (rindu)'], ['🌬️', 'Sejuk kayak pelukannya']];\nconst COLORS = [['Pink salem', '#f0a39a'], ['Biru langit', '#7eb3f5'], ['Krem', '#f5ede0'], ['Lavender', '#cdb8f0'], ['Hijau sage', '#b5c4b1'], ['Emas', '#c9a96e'], ['Merah bata', '#c17a6f'], ['Putih', '#ffffff'], ['Hitam elegan', '#2d1f1a'], ['Kuning mentega', '#f5dc8c']];\nconst FOODS = ['Mie ayam 🍜', 'Martabak manis 🥞', 'Es krim 🍦', 'Seblak 🌶️', 'Bakso 🍲', 'Sate ayam 🍢', 'Boba 🧋', 'Nasi goreng 🍳', 'Donat 🍩', 'Croissant 🥐', 'Sushi 🍣', 'Pisang goreng 🍌', 'Kopi susu ☕', 'Cokelat 🍫', 'Dimsum 🥟', 'Indomie telor 🍜'];\nconst MISSIONS = [\n  'Kirim satu foto selfie random sekarang juga 🤳', 'Bilang \"aku sayang kamu\" dengan cara yang belum pernah dipakai', 'Telponan minimal 10 menit',\n  'Kirim lagu yang lagi kamu suka', 'Ceritain satu hal kecil yang bikin kamu seneng hari ini', 'Tanyain \"hari ini capek ga?\" dan dengerin jawabannya',\n  'Kirim voice note bilang selamat tidur', 'Puji satu hal dari dia yang jarang kamu sebut', 'Tulis satu impian baru di Bucket List',\n  'Kirim emoji favorit kamu 10x berturut-turut', 'Ingetin dia minum air putih 💧', 'Kirim foto makanan kamu hari ini',\n  'Bilang satu hal yang kamu syukuri dari hubungan ini', 'Main satu game bareng di menu utama', 'Kirim stiker paling lucu yang kamu punya',\n  'Rencanain satu hal yang mau dilakuin pas ketemu', 'Video call sambil ngelakuin kegiatan masing-masing', 'Kirim satu kenangan foto lama',\n];\nconst WARNS = [\n  ['Kemungkinan dia jawab \"terserah\" pas ditanya mau makan apa', 80, 99], ['Peluang salting kalau dipuji tiba-tiba', 85, 100],\n  ['Kemungkinan ngambek gara-gara hal sepele (tapi lucu)', 20, 60], ['Peluang kangen sebelum jam 9 malam', 88, 100],\n  ['Kemungkinan chat dibales \"wkwk\" doang', 10, 45], ['Peluang ketawa bareng hari ini', 90, 100], ['Kemungkinan nanya \"lagi apa?\" lebih dari 3x', 60, 95],\n  ['Risiko ketiduran pas lagi telponan', 30, 75], ['Peluang ngirim meme yang sama tanpa janjian', 15, 40],\n];\nconst $ = id => document.getElementById(id);\nfunction lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\nconst pad = n => String(n).padStart(2, '0');\nconst ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\n\n// angka acak yang tetap buat tanggal yang sama (Razan & Dara dapet ramalan yang sama)\nfunction seeded(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }\nfunction reading(ds) {\n  const r = seeded('razara-' + ds), pick = a => a[Math.floor(r() * a.length)];\n  const w = pick(WARNS);\n  return {\n    text: pick(READINGS), energy: 62 + Math.floor(r() * 39), weather: pick(WEATHER), color: pick(COLORS), food: pick(FOODS),\n    num: 1 + Math.floor(r() * 99), mission: pick(MISSIONS), warn: [w[0], w[1] + Math.floor(r() * (w[2] - w[1] + 1))], match: 96 + Math.floor(r() * 5),\n    hour: `${pad(7 + Math.floor(r() * 15))}.${pick(['00', '11', '17', '18', '30', '45'])}`,\n  };\n}\n\nfunction init() {\n  const st = $('stars'); for (let i = 0; i < 60; i++) { const s = document.createElement('i'); s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3}s;opacity:${Math.random()}`; st.appendChild(s); }\n  const d = new Date(); $('date').textContent = `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;\n  const seen = lsGet('ramalan-seen', {});\n  if (seen[ymd(d)]) { show(false); }\n  $('orb').onclick = reveal;\n}\nlet revealing = false;\nfunction reveal() {\n  if (revealing) return; const ds = ymd(new Date());\n  if (lsGet('ramalan-seen', {})[ds]) { $('read').scrollIntoView({ behavior: 'smooth' }); return; }\n  revealing = true; $('orb').classList.add('shake'); $('hint').textContent = 'Lagi baca bintang…'; vib([10, 30, 10, 30, 10, 30, 60]);\n  setTimeout(() => { $('orb').classList.remove('shake'); revealing = false; const seen = lsGet('ramalan-seen', {}); seen[ds] = Date.now(); const ks = Object.keys(seen).sort(); while (ks.length > 120) delete seen[ks.shift()]; lsSet('ramalan-seen', seen); show(true); }, 1600);\n}\nfunction streak() { const seen = lsGet('ramalan-seen', {}); const d = new Date(); let n = 0; while (seen[ymd(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }\nfunction show(anim) {\n  const ds = ymd(new Date()), R = reading(ds);\n  const done = lsGet('ramalan-misi', {})[ds];\n  $('orb').querySelector('.q').textContent = R.weather[0];\n  $('hint').textContent = 'Ramalan hari ini udah kebuka ✨';\n  const share = `🔮 Ramalan cinta kita hari ini (${ds}):\\n\"${R.text}\"\\n\\n⚡ Energi cinta: ${R.energy}%\\n${R.weather[0]} Cuaca hati: ${R.weather[1]}\\n🎨 Warna: ${R.color[0]} · 🍽️ Makanan: ${R.food}\\n🎯 Misi: ${R.mission}\\n💞 Kecocokan: ${R.match}%`;\n  const me = lsGet('ramalan-me', 'Dara'), to = me === 'Razan' ? 'Dara' : 'Razan';\n  $('read').innerHTML = `\n    <div class=\"card\"><h3>✨ Kata bintang hari ini<\/h3><p class=\"main-txt\">${R.text}<\/p><\/div>\n    <div class=\"card\"><h3>⚡ Energi cinta<\/h3><div class=\"energy\"><b id=\"en\">0%<\/b><div class=\"bar\"><i id=\"en-bar\"><\/i><\/div><\/div><\/div>\n    <div class=\"grid\">\n      <div class=\"card\"><h3>Cuaca hati<\/h3><p>${R.weather[0]} ${R.weather[1]}<\/p><\/div>\n      <div class=\"card\"><h3>Warna hoki<\/h3><p><span class=\"sw\" style=\"background:${R.color[1]}\"><\/span>${R.color[0]}<\/p><small>Pake ini, auto makin cakep<\/small><\/div>\n      <div class=\"card\"><h3>Makanan hoki<\/h3><p>${R.food}<\/p><small>Lebih enak kalau berdua<\/small><\/div>\n      <div class=\"card\"><h3>Jam keramat<\/h3><p>🕰️ ${R.hour}<\/p><small>Waktu terbaik buat bilang kan lu', 'kedua — sekarang', 'ketiga — ke depan'][picks.length]}` : 'Kartunya udah kebuka ✨';\n}\nfunction roman(n) { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }\nfunction pick(i) {\n  if (picks.length >= 3 || picks.includes(i)) return;\n  picks.push(i); vib(15); render();\n  if (picks.length === 3) setTimeout(reveal, 400);\n}\nfunction reveal() {\n  [0, 1, 2].forEach(k => setTimeout(() => { $('f' + k).classList.add('flip'); vib(20); }, k * 700));\n  setTimeout(() => {\n    const cs = picks.map(p => DECK[order[p]]);\n    $('read').innerHTML = cs.map((c, k) => `<div class=\"card\"><h3>${POS[k][0]} · ${c[0]} ${c[1]}<\/h3><p>${POS[k][1]} <b>${c[2]}<\/b>.<\/p><\/div>`).join('') +\n      `<div class=\"card\"><h3>✨ Pesan kartu buat kalian<\/h3><p>Dari ${cs[0][1]} ke ${cs[2][1]} — perjalanan kalian lagi menuju arah yang baik. Jaga yang udah ada, rayain yang kecil-kecil, dan jangan lupa bilang sayang hari ini 🤍<\/p><\/div>\n      <a class=\"btn\" style=\"background:#25a35a;color:#fff\" target=\"_blank\" rel=\"noopener\" href=\"${waLink(lsGet('tarot-me', 'Dara') === 'Razan' ? 'Dara' : 'Razan', `🃏 Tarot cinta kita hari ini:\\n${cs.map((c, k) => `${POS[k][0]}: ${c[0]} ${c[1]}`).join('\\n')}\\n\\nKatanya ke depan ada ${cs[2][2]} 🥹`)}\">💬 Kirim hasilnya<\/a>\n      <button class=\"btn ghost\" style=\"margin-top:.5rem\" onclick=\"again()\">🔁 Kocok ulang<\/button>`;\n    $('read').classList.add('show'); $('read').scrollIntoView({ behavior: 'smooth', block: 'start' }); confetti(30, ['#f6e3b8', '#cdb8f0', '#fff']);\n    lsSet('tarot-n', lsGet('tarot-n', 0) + 1);\n  }, 2400);\n}\nfunction again() { picks = []; shuffle(); $('read').classList.remove('show'); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }\nshuffle(); render();\n\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(func
