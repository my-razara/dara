<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Chat — Razan & Dara 💬</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script><script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  html,body{height:100%;overflow:hidden}
  body{min-height:0}
  body::before{display:none}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:#f3ede6;z-index:1}
  .hd{display:flex;align-items:center;gap:.6rem;padding:calc(.55rem + env(safe-area-inset-top)) .7rem .55rem;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);position:relative;z-index:3}
  .bk{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--deep);font-size:18px;flex-shrink:0}
  .hd .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.45rem;background:var(--warm);flex-shrink:0;position:relative}
  .hd .av i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2ea05a;border:2px solid #fff;display:none}
  .hd .av.on i{display:block}
  .hd .nm{flex:1;min-width:0}.hd .nm b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
  .hd .nm small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd .nm small.typ{color:#2ea05a;font-weight:500}
  .hb{border:none;background:none;font-size:20px;color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;flex-shrink:0}
  .tabs{display:flex;gap:.3rem;padding:.4rem .6rem;background:#fff;border-bottom:1px solid rgba(193,122,111,.12);z-index:2}
  .tabs button{flex:1;border:none;background:var(--cream);border-radius:50px;padding:.5rem;font-size:12.5px;color:var(--muted);cursor:pointer;position:relative;font-weight:500}
  .tabs button.on{background:var(--rose);color:#fff;font-weight:600}
  .tabs button i{position:absolute;top:-3px;right:10px;min-width:17px;height:17px;border-radius:9px;background:#e0475b;color:#fff;font:700 9.5px/17px 'Poppins',sans-serif;font-style:normal;padding:0 4px;display:none}
  .tabs button i.on{display:block}
  .list{flex:1;overflow-y:auto;padding:.7rem .7rem .4rem;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background-image:radial-gradient(rgba(193,122,111,.07) 1.2px,transparent 1.2px);background-size:18px 18px}
  .day{text-align:center;margin:.7rem 0 .45rem}.day span{font-size:10.5px;background:rgba(255,255,255,.85);color:var(--muted);padding:.22rem .7rem;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .m{display:flex;margin:.12rem 0;position:relative;touch-action:pan-y}
  .m.me{justify-content:flex-end}
  .b{max-width:78%;padding:.42rem .65rem .3rem;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:14px;line-height:1.42;color:var(--ink);font-weight:400;word-wrap:break-word;overflow-wrap:anywhere;position:relative;transition:transform .15s}
  .m.me .b{background:#ffe1d6;border-bottom-right-radius:5px}
  .m:not(.me) .b{border-bottom-left-radius:5px}
  html[data-user="Razan"] .m.me .b{background:#dcebff}
  .b .tx{white-space:pre-wrap}
  .b a{color:#2a6fb5;word-break:break-all}
  .b .meta{display:flex;justify-content:flex-end;align-items:center;gap:.2rem;font-size:10px;color:var(--muted);margin-top:.1rem;float:right;margin-left:.6rem;position:relative;top:.25rem}
  .b .tick{font-size:11px;letter-spacing:-.25em;margin-right:.2em}.b .tick.read{color:#2a8be0}
  .b .err{color:#e0475b;font-weight:600}
  .b img.ph{display:block;max-width:100%;width:240px;max-height:320px;object-fit:cover;border-radius:12px;margin:.05rem -.3rem .3rem;cursor:zoom-in;background:#eee}
  .b .up{position:absolute;inset:.4rem;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:rgba(0,0,0,.35);border-radius:12px}
  .b .rq{border-left:3px solid var(--rose);background:rgba(0,0,0,.04);border-radius:8px;padding:.25rem .5rem;margin-bottom:.3rem;font-size:12px;color:var(--muted);cursor:pointer}
  .b .rq b{display:block;font-size:11.5px;font-weight:600;color:var(--deep)}
  .b .rq.R b{color:var(--rz)}.b .rq.D b{color:var(--dr)}
  .b.del{font-style:italic;color:var(--muted);background:rgba(255,255,255,.7)!important}
  .m.stik .b{background:none!important;box-shadow:none;font-size:3.4rem;line-height:1.1;padding:0 .2rem}
  .m.stik .b .meta{float:none;justify-content:flex-end;top:0;background:rgba(255,255,255,.8);border-radius:8px;padding:0 .3rem;font-size:9.5px;white-space:nowrap;margin:0}
  .m.stik .b .tx{display:block}
  .m.flash .b{animation:fl 1s}@keyframes fl{30%{box-shadow:0 0 0 4px rgba(193,122,111,.45)}}
  .m .sw{position:absolute;left:-26px;top:50%;transform:translateY(-50%);opacity:0;font-size:16px}
  .ai .b{background:#fff}.ai .lab{font-size:10px;font-weight:600;color:#8a6bc4;margin-bottom:.1rem}
  .ai .b strong{font-weight:600}
  .ai .b ul{margin:.2rem 0 .2rem 1.1rem}
  .dots{display:inline-flex;gap:3px;padding:.35rem .1rem}.dots i{width:7px;height:7px;border-radius:50%;background:#b9aba0;animation:dd 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dd{30%{transform:translateY(-4px);opacity:.5}}
  .note{text-align:center;font-size:11.5px;color:var(--muted);margin:.6rem auto;max-width:300px;line-height:1.55;background:rgba(255,255,255,.75);padding:.5rem .8rem;border-radius:14px}
  .note button{border:none;background:var(--rose);color:#fff;border-radius:50px;padding:.35rem .8rem;font-size:11.5px;margin-top:.4rem;cursor:pointer}
  .sug{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.4rem 0 .6rem}
  .sug button{border:1.5px solid var(--blush);background:#fff;border-radius:50px;padding:.42rem .75rem;font-size:12px;color:var(--deep);cursor:pointer}
  .hi{text-align:center;margin:1.4rem auto .6rem;max-width:300px}.hi .e{font-size:2.6rem}.hi b{display:block;font-size:15px;margin:.3rem 0 .2rem;color:var(--ink)}.hi p{font-size:12px;color:var(--muted);line-height:1.55}
  .rep-bar{display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;background:#fff;border-top:1px solid rgba(193,122,111,.12)}
  .rep-bar>div{flex:1;min-width:0;border-left:3px solid var(--rose);padding-left:.5rem}
  .rep-bar b{display:block;font-size:11.5px;color:var(--deep)}.rep-bar span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rep-bar button{border:none;background:none;font-size:15px;color:var(--muted);cursor:pointer;width:30px;height:30px}
  .stk{display:grid;grid-template-columns:repeat(6,1fr);gap:.2rem;padding:.5rem;background:#fff;border-top:1px solid rgba(193,122,111,.12);max-height:34vh;overflow-y:auto}
  .stk button{border:none;background:none;font-size:1.9rem;padding:.3rem 0;cursor:pointer;border-radius:12px}
  .stk button:active{background:var(--warm)}
  .cmp{display:flex;align-items:flex-end;gap:.35rem;padding:.45rem .5rem calc(.45rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid rgba(193,122,111,.12)}
  .cmp .ic{border:none;background:none;font-size:1.3rem;width:38px;height:42px;cursor:pointer;flex-shrink:0;border-radius:50%}
  .cmp textarea{flex:1;min-width:0;resize:none;border:1.5px solid rgba(193,122,111,.22);border-radius:22px;padding:.62rem .9rem;font:400 16px/1.35 'Poppins',sans-serif;outline:none;max-height:120px;background:var(--cream);color:var(--ink)}
  .cmp textarea:focus{border-color:var(--rose)}
  .cmp .send{border:none;width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;font-size:1.15rem;cursor:pointer;flex-shrink:0}
  .cmp .send:disabled{opacity:.4}
  [hidden]{display:none!important}
  .sfx-btn,.sfx-tip{display:none!important}
  .m.stik .b .meta{display:inline-flex}
  .viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
  .viewer.show{display:flex}.viewer img{max-width:100%;max-height:100%;object-fit:contain}
  .viewer button{position:absolute;top:calc(.8rem + env(safe-area-inset-top));right:.8rem;border:none;background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer}
  .viewer a{position:absolute;bottom:calc(1rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;background:rgba(255,255,255,.18);padding:.45rem .9rem;border-radius:50px;text-decoration:none}
  .menu{position:fixed;inset:0;z-index:70;background:rgba(45,31,26,.35);display:none;align-items:flex-end;justify-content:center}
  .menu.show{display:flex}
  .menu .mc{background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:.5rem .5rem calc(.6rem + env(safe-area-inset-bottom));animation:gUp .22s ease}
  .menu .emo{display:flex;justify-content:space-around;padding:.4rem 0 .5rem;border-bottom:1px solid rgba(193,122,111,.12);margin-bottom:.3rem}
  .menu .emo button{border:none;background:var(--cream);width:42px;height:42px;border-radius:50%;font-size:1.3rem;cursor:pointer}
  .menu .it{display:block;width:100%;text-align:left;border:none;background:none;padding:.8rem 1rem;font-size:14px;color:var(--ink);cursor:pointer;border-radius:12px}
  .menu .it:active{background:var(--cream)}.menu .it.red{color:#d0443a}
  .rx{display:inline-flex;gap:.1rem;background:#fff;border-radius:20px;padding:.05rem .35rem;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12);position:absolute;bottom:-.75rem;right:.4rem}
  .m:not(.me) .rx{right:auto;left:.4rem}
  .m.hasrx{margin-bottom:.85rem}
  .newbtn{position:absolute;right:.9rem;bottom:5.2rem;z-index:4;border:none;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18);border-radius:50px;padding:.4rem .75rem;font-size:12px;color:var(--deep);cursor:pointer;display:none}
  .newbtn.show{display:block}
  .off{background:#fff3cd;color:#8a6d1a;font-size:11.5px;text-align:center;padding:.3rem}

</style>
</head>
<body>

<div class="app" id="app">
  <header class="hd">
    <a class="bk" href="index.html" aria-label="Menu utama">←</a>
    <span class="av" id="h-av"><span id="h-e">👧</span><i></i></span>
    <div class="nm"><b id="h-n">Dara</b><small id="h-s">…</small></div>
    <button class="hb" id="h-more" aria-label="Lainnya">⋯</button>
  </header>
  <div class="tabs"><button data-t="p" class="on" id="tb-p">💬 <span id="tp-n">Dara</span><i id="tp-b"></i></button><button data-t="ai" id="tb-ai">🤖 Asisten AI</button></div>
  <div class="off" id="off" hidden>⚠️ Lagi ga nyambung — pesan dikirim begitu internet balik</div>
  <main class="list" id="L-p"></main>
  <main class="list" id="L-ai" hidden></main>
  <button class="newbtn" id="newbtn">⬇ Pesan baru</button>
  <div class="rep-bar" id="rep" hidden><div><b id="rep-w"></b><span id="rep-t"></span></div><button id="rep-x" aria-label="Batal bales">✕</button></div>
  <div class="stk" id="stk" hidden></div>
  <form class="cmp" id="cmp" autocomplete="off">
    <button type="button" class="ic" id="b-stk" aria-label="Stiker">😊</button>

    <button class="send" id="b-send" aria-label="Kirim">➤</button>
  </form>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="viewer" id="viewer"><img id="v-img" alt=""><button id="v-x" aria-label="Tutup">✕</button><a id="v-dl" target="_blank" rel="noopener">Buka ukuran asli ↗</a></div>
<div class="menu" id="menu"><div class="mc" id="menu-c"></div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    <button class="it" data-a="rep">↩️ Bales</button>${m.t && !m.s ? '<button class="it" data-a="copy">📋 Salin teks</button>' : ''}${mine && recent ? '<button class="it red" data-a="del">🗑 Hapus buat berdua</button>' : ''}<button class="it" data-a="x">Batal</button>`;
  $('menu').classList.add('show');
  $('menu-c').onclick = async e => {
    const r = e.target.closest('[data-rx]'), a = e.target.closest('[data-a]'); if (!r && !a) return;
    $('menu').classList.remove('show');
    if (r) { vib(10); const tmp = { n: -Date.now(), k: 'rx', w: ME, x: m.n, t: r.dataset.rx, at: Date.now() }; C.msgs.push(tmp); renderP(); try { const res = await POST({ action: 'chat', op: 'send', id: uid(), t: r.dataset.rx, rx: m.n }); C.msgs = C.msgs.filter(x => x !== tmp); if (res && res.ok) { merge([res.ev]); save(); } } catch (er) { C.msgs = C.msgs.filter(x => x !== tmp); toast('Gagal ngirim reaksi'); } renderP(); return; }
    if (a.dataset.a === 'rep') setRep({ n: m.n, w: m.w, t: snip(m) });
    else if (a.dataset.a === 'copy') { try { await navigator.clipboard.writeText(m.t); toast('Teks disalin 📋'); } catch (er) { toast('Ga bisa nyalin di HP ini'); } }
    else if (a.dataset.a === 'del') { if (!confirm('Hapus pesan ini buat kalian berdua?')) return; try { const res = await POST({ action: 'chat', op: 'del', x: m.n }); if (res && res.ok) { merge([res.ev]); save(); renderP(); } else toast('Gagal hapus'); } catch (er) { toast('Gagal hapus, cek internet'); } }
  };
}
$('menu').onclick = e => { if (e.target.id === 'menu') $('menu').classList.remove('show'); };

// ── 🤖 ASISTEN AI ──
const SUG = [`Ide kencan murah buat minggu ini 💡`, `Bikinin ucapan manis buat ${OT} 💌`, `Game apa yang seru dimainin malem ini? 🎮`, `Ide hadiah kecil buat ${OT} 🎁`, `Bikinin pantun gombal 😆`, `Aku lagi capek, temenin ngobrol bentar 🥺`];
let aiBusy = false;
function md(s) { let h = esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|\n)[*-] (.+)/g, '$1• $2'); return h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function renderAI(scroll) {
  const el = $('L-ai'); let h = `<div class="hi"><div class="e">🤖</div><b>Asisten Razara</b><p>AI temen ngobrol kalian. Bisa bantu ide kencan, ucapan, hadiah, atau sekadar nemenin ngobrol. Dia <b>bukan ${OT}</b> & ga bisa nyampein pesan ke ${OT}.</p></div>`;
  if (!AI.length) h += `<div class="sug">${SUG.map(s => `<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  let lastD = '';
  AI.forEach((m, i) => { const d = dayLbl(m.at); if (d !== lastD) { h += `<div class="day"><span>${d}</span></div>`; lastD = d; }
    if (m.r === 'sys') { h += `<div class="note">${m.t}${m.retry ? `<br><button data-retry="${i}">Coba lagi</button>` : ''}</div>`; return; }
    h += m.r === 'user' ? `<div class="m me"><div class="b"><span class="tx">${linkify(m.t)}</span><span class="meta">${hm(m.at)}</span></div></div>` : `<div class="m ai"><div class="b"><div class="lab">🤖 Asisten AI</div><span class="tx">${md(m.t)}</span><span class="meta">${hm(m.at)}</span></div></div>`; });
  if (aiBusy) h += `<div class="m ai"><div class="b"><div class="lab">🤖 Asisten AI</div><span class="dots"><i></i><i></i><i></i></span></div></div>`;
  if (AI.length) h += `<p class="note" style="font-size:10.5px">AI bisa salah. Obrolan ini dikirim ke Google Gemini — jangan ketik password, PIN, atau rahasia ya.</p>`;
  el.innerHTML = h; if (scroll !== false) el.scrollTop = el.scrollHeight;
}
$('L-ai').addEventListener('click', e => { const q = e.target.closest('[data-q]'); if (q) return aiSend(q.dataset.q); const r = e.target.closest('[data-retry]'); if (r) { AI.splice(+r.dataset.retry, 1); lsSet('ai-h-' + ME, AI); aiAsk(); } });
function aiSend(t) { t = String(t || '').trim(); if (!t || aiBusy) return; AI.push({ r: 'user', t, at: Date.now() }); lsSet('ai-h-' + ME, AI.slice(-80)); aiAsk(); }
async function aiAsk() {
  aiBusy = true; renderAI();
  const msgs = AI.filter(m => m.r !== 'sys').slice(-16).map(m => ({ r: m.r === 'model' ? 'model' : 'user', t: m.t }));
  let r = null; try { r = await POST({ action: 'ai', msgs }, 60000); } catch (e) { r = { ok: false, error: 'jaringan' }; }
  aiBusy = false;
  if (r && r.ok && r.t) { AI.push({ r: 'model', t: r.t, at: Date.now() }); try { window.SFX && SFX.play('pop'); } catch (e) {} }
  else {
    const E = { nokey: `AI-nya belum disetel 🔧 ${ME === 'Razan' ? 'Masukin <b>GEMINI_KEY</b> di Apps Script dulu ya (liat panduan dari Claude).' : 'Bilang ke Razan buat nyalain AI-nya ya 😆'}`, limit: `Jatah ngobrol sama AI hari ini udah habis (${r && r.max || ''} pesan) 😴 Besok lanjut lagi ya!`, sibuk: 'Server AI Google-nya lagi rame banget 😵 Tunggu semenit terus coba lagi ya.', kuota: 'AI-nya lagi kecapean (jatah gratis dari Google lagi penuh) 😵 Coba lagi beberapa menit lagi.', keysalah: 'Kunci GEMINI_KEY-nya kayaknya salah 🔑 Cek lagi di Apps Script.', action: 'Server belum diupdate buat chat & AI. Tempel kode Apps Script terbaru & deploy versi baru ya.', jaringan: 'Ga nyambung ke internet 📶' };
    AI.push({ r: 'sys', t: E[r && r.error] || 'AI-nya lagi error 😢 ' + esc(r && (r.detail || r.error) || ''), at: Date.now(), retry: !(r && /nokey|limit|action/.test(r.error)) });
  }
  lsSet('ai-h-' + ME, AI.slice(-80)); renderAI();
}

// ── tab & menu atas ──
function setTab(t) {
  tab = t; lsSet('chat-tab', t);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('L-p').hidden = t !== 'p'; $('L-ai').hidden = t !== 'ai'; $('b-img').style.display = t === 'ai' ? 'none' : ''; setRep(null);
  $('inp').placeholder = t === 'ai' ? 'Tanya apa aja ke AI…' : 'Tulis pesan…';
  header(); badge();
  if (t === 'ai') renderAI(); else { renderP('bottom', true); markRead(); }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
$('h-more').onclick = () => {
  $('menu-c').innerHTML = tab === 'ai' ? `<button class="it red" data-a="clr">🧹 Hapus obrolan sama AI</button><button class="it" data-a="x">Batal</button>`
    : `<button class="it" data-a="top">⬆ Ke pesan paling atas</button><button class="it" data-a="notif">🔔 Nyalain notif chat</button><button class="it" data-a="x">Batal</button>`;
  $('menu').classList.add('show');
  $('menu-c').onclick = e => { const a = e.target.closest('[data-a]'); if (!a) return; $('menu').classList.remove('show');
    if (a.dataset.a === 'clr') { if (confirm('Hapus semua obrolan sama AI di HP ini?')) { AI.length = 0; lsSet('ai-h-' + ME, []); renderAI(); } }
    else if (a.dataset.a === 'top') $('L-p').scrollTop = 0;
    else if (a.dataset.a === 'notif') { try { window.Push && Push.register ? Push.register(true).then(() => toast('🔔 Notif nyala')).catch(() => toast('Notif ga bisa dinyalain di HP ini')) : toast('Notif belum siap'); } catch (er) {} } };
};

// ── mulai ──
if (!URL_) { $('L-p').innerHTML = '<div class="note">Chat butuh koneksi ke server Berdua (sync.js) 😢</div>'; }
setTab(tab); renderP('bottom', true);
if (URL_) { poll(true); flushQ(); }
setInterval(() => { if (!document.hidden) { header(); if (tab === 'p') renderP(); } }, 30000);

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
