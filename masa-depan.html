</style>
</head>

<script>

const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');

const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

let __toastT;

async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }

function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }

// siapa yang lagi pakai HP ini (Razan / Dara)

  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, enabled: false };
// tiap "teropong" (1/5/10 tahun) disimpan di slot tanggal sendiri
const YRS = [[1, '2001-01-01', 'Setahun lagi'], [5, '2005-01-01', 'Lima tahun lagi'], [10, '2010-01-01', 'Sepuluh tahun lagi']];
const Q = [
  { k: 'tinggal', t: '🏡 Kita tinggal di mana?', o: [['🏙️', 'Kota besar'], ['🌾', 'Kota kecil yang adem'], ['🏖️', 'Deket pantai'], ['✈️', 'Luar negeri']] },
  { k: 'rumah', t: '🛋 Rumahnya kayak gimana?', o: [['🏢', 'Apartemen estetik'], ['🏠', 'Rumah mungil tapi hangat'], ['🌳', 'Rumah ada kebunnya'], ['🔑', 'Masih ngontrak, gapapa']] },
  { k: 'pagi', t: '☀️ Pagi hari biasanya…', o: [['☕', 'Ngopi berdua dulu'], ['🏃', 'Olahraga bareng'], ['😴', 'Rebutan bangun terakhir'], ['🍳', 'Satu masak, satu nyiapin']] },
  { k: 'peliharaan', t: '🐾 Ada peliharaan?', o: [['🐈', 'Kucing'], ['🐕', 'Anjing'], ['🐠', 'Ikan / kura-kura'], ['🙅', 'Kita aja cukup']] },
  { k: 'libur', t: '🗺 Liburan impian berikutnya', o: [['🗼', 'Eropa'], ['🗻', 'Jepang / Korea'], ['🏝️', 'Bali / Lombok lagi'], ['🏕️', 'Camping di gunung']] },
  { k: 'weekend', t: '🛍 Weekend kita diisi…', o: [['🎬', 'Maraton film'], ['🍜', 'Kulineran'], ['🧺', 'Piknik / jalan-jalan'], ['🛏️', 'Rebahan seharian']] },
  { k: 'kerja', t: '💼 Kerjaan masing-masing', o: [['🚀', 'Udah sukses di karier'], ['🏪', 'Punya usaha sendiri'], ['📚', 'Lagi lanjut sekolah'], ['🌱', 'Masih berproses, santai']] },
  { k: 'hobi', t: '🎨 Hobi baru yang kita tekuni bareng', o: [['🎸', 'Musik'], ['🪴', 'Berkebun'], ['📷', 'Fotografi'], ['🍰', 'Baking / masak']] },
  { k: 'berantem', t: '🫣 Kalau berantem, siapa yang minta maaf duluan?', o: [['💙', 'Razan'], ['💗', 'Dara'], ['🤝', 'Barengan'], ['🍕', 'Yang laper duluan']] },
  { k: 'satu', t: '💭 Satu hal yang pasti masih sama', free: true, ph: 'Contoh: kamu masih suka nyolong kentang gorengku' }
];
if (lsGet('md-me', null) == null) lsSet('md-me', BD.me());
let me = whoBtn('md-me', () => { me = lsGet('md-me', 'Dara'); BD.setMe(me); view = null; render(); });
BD.setMe(me);
let yi = lsGet('md-y', 1), view = null; // null = otomatis
const slot = () => YRS[yi][1];
const ansOf = w => ((lsGet('md-' + w, {}) || {})[slot()] || null);
const draft = () => lsGet('md-draft-' + me + '-' + slot(), {});
function done(a) { return a && a.done; }
function bdStatus() { const el = $('bd-st'), t = BD.status(); el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function render() {
  bdStatus(); lsSet('md-y', yi);
  $('yrs').innerHTML = YRS.map(([n, , l], i) => `<button class="${i === yi ? 'on' : ''}" data-i="${i}"><b>+${n} th</b>${l}</button>`).join('');
  $('yrs').querySelectorAll('button').forEach(b => b.onclick = () => { yi = +b.dataset.i; view = null; render(); });
  const mine = ansOf(me), o = otherOf(me), theirs = ansOf(o);
  const stt = w => { const a = ansOf(w); return done(a) ? `✅ udah neropong<br><small>${fmtD(new Date(a.at))}</small>` : '⏳ belum'; };
  $('st').innerHTML = `<div class="R"><b>💙 Razan</b>${stt('Razan')}</div><div class="D"><b>💗 Dara</b>${stt('Dara')}</div>`;
  const v = view || (!done(mine) ? 'form' : done(theirs) ? 'cmp' : 'wait');
  if (v === 'form') form(); else if (v === 'cmp') compare(); else wait();
}
function form() {
  const d = Object.assign({}, (ansOf(me) || {}).a || {}, draft()), n = Q.filter(q => d[q.k]).length;
  $('main').innerHTML = `<div class="prog"><i style="width:${n / Q.length * 100}%"></i></div>

    ${done(ansOf(me)) ? '<button class="btn ghost" style="margin-top:.5rem" onclick="view=null;render()">Batal ubah</button>' : ''}`;
  const save = (k, v) => { const x = draft(); if (v === '' || v == null) delete x[k]; else x[k] = v; lsSet('md-draft-' + me + '-' + slot(), x); };
  $('main').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { save(b.dataset.k, b.dataset.v); vib(8); const y = window.scrollY; form(); window.scrollTo(0, y); });

function wait() {

  $('main').innerHTML = `<div class="lock">🔭<b>Teropongmu udah dikunci</b><small>Nunggu ${o} neropong juga. Begitu ${o} selesai, jawaban kalian kebuka barengan — biar ga saling nyontek 😏</small></div>
    <a class="btn wa" target="_blank" rel="noopener" href="${waLink(o, `🔭 Aku udah ngisi Teropong Masa Depan (${YRS[yi][2].toLowerCase()}). Giliran kamu! Jawabanku kebuka kalau kamu udah ngisi juga 😏\n${location.href.split('#')[0].split('?')[0]}`)}">💬 Colek ${o} buat ngisi</a>
    <button class="btn ghost" style="margin-top:.5rem" onclick="view='form';render()">✏️ Ubah jawabanku</button>`;
}
function compare() {
  const A = ansOf('Razan').a, B = ansOf('Dara').a; let same = 0, tot = 0;
  const rows = Q.map(q => { const x = A[q.k] || '–', y = B[q.k] || '–', s = !q.free && x === y; if (!q.free) { tot++; if (s) same++; }
    const e = v => (q.o || []).find(o => o[1] === v); const show = (v, n) => `${e(v) ? e(v)[0] + ' ' : ''}${esc(v)}${n ? `<em>${esc(n)}</em>` : ''}`;
    return `<div class="cmp ${s ? 'same' : ''}"><h4>${q.t}${s ? '<i>✨ sehati</i>' : ''}</h4><div class="two"><div class="a R"><small>Razan</small>${show(x, A[q.k + '_n'])}</div><div class="a D"><small>Dara</small>${show(y, B[q.k + '_n'])}</div></div></div>`; }).join('');
  const pct = Math.round(same / tot * 100), msg = pct >= 80 ? 'Mimpinya udah satu frekuensi banget 🌠' : pct >= 50 ? 'Banyak yang sama, sisanya bisa dirembukin bareng 🤝' : 'Beda-beda — berarti seru, banyak yang bisa diobrolin! 💬';
  $('main').innerHTML = `<div class="score"><small>Kalian sehati soal ${YRS[yi][2].toLowerCase()}</small><b>${pct}%</b><small>${same} dari ${tot} jawaban sama · ${msg}</small></div>${rows}
    <button class="btn ghost" style="margin-top:.4rem" onclick="view='form';render()">✏️ Ubah jawabanku</button>
    <p class="empty">Coba juga teropong tahun yang lain di atas 🔭<br>Tips: buka lagi tahun depan — liat mana yang beneran kejadian!</p>`;
  if (!lsGet('md-seen-' + slot(), 0)) { lsSet('md-seen-' + slot(), 1); setTimeout(() => confetti(70, ['#6a5a9e', '#c9b6ea', '#c9a96e', '#fff', '#f0a39a']), 300); }
}
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if (ev.apps.includes('md') && view !== 'form') render(); });
render();

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
