<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Heart Catch — Dari Razan 💝</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif;touch-action:none}
  html,body{height:100%;overflow:hidden}

  .screen{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto}
  .screen.active{display:flex}

  /* ── INTRO ── */
  #s-intro{
    background:radial-gradient(ellipse at top,#2d0a1e,#0d0208);
    padding:1.5rem;
  }
  .intro-stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

  .intro-icon{font-size:4rem;display:block;margin-bottom:1rem;animation:float 3s ease-in-out infinite;position:relative;z-index:1}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .intro-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.35rem;position:relative;z-index:1}
  .intro-title{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;color:#fff;margin-bottom:.35rem;position:relative;z-index:1}
  .intro-title span{color:#ff8fab}
  .intro-sub{font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.75;max-width:300px;margin:.5rem auto 1.75rem;position:relative;z-index:1}

  .intro-info{
    display:flex;gap:.5rem;margin-bottom:1.75rem;width:100%;max-width:360px;
    position:relative;z-index:1;
  }
  .ii-card{
    flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:.75rem .5rem;text-align:center;
  }
  .ii-icon{font-size:1.3rem;display:block;margin-bottom:.25rem}
  .ii-label{font-size:10px;color:rgba(255,255,255,.5);display:block}
  .ii-val{font-size:12px;font-weight:600;color:#fff;display:block}

  .hs-badge{
    background:rgba(255,143,171,.12);border:1px solid rgba(255,143,171,.25);
    border-radius:50px;padding:.3rem 1rem;
    font-size:12px;color:#ff8fab;font-weight:600;
    margin-bottom:1.5rem;display:inline-block;position:relative;z-index:1;
  }

  .start-btn{
    width:100%;max-width:360px;padding:1rem;border-radius:50px;border:none;cursor:pointer;
    font-size:15px;font-weight:700;
    background:linear-gradient(135deg,#c17a6f,#e91e8c);color:#fff;
    box-shadow:0 4px 24px rgba(233,30,140,.35);transition:all .2s;
    position:relative;z-index:1;
  }
  .start-btn:active{transform:scale(.97)}

  /* ── GAME ── */
  #s-game{padding:0;background:#0d0208}
  #game-canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;
    background:rgba(10,2,8,.7);backdrop-filter:blur(8px);
    padding:.5rem 1.25rem;display:flex;justify-content:space-between;align-items:center}
  .hud-score{font-size:1.2rem;font-weight:700;color:#fff}
  .hud-score span{color:#ff8fab}
  .hud-lives{display:flex;gap:.25rem}
  .hud-hs{font-size:11px;color:rgba(255,255,255,.4)}

  /* Message toast */
  #msg-toast{
    position:fixed;top:72px;left:50%;transform:translateX(-50%);
    z-index:30;pointer-events:none;
    background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
    border:1px solid rgba(255,143,171,.3);
    border-radius:50px;padding:.4rem 1.1rem;
    font-size:12.5px;font-weight:500;color:#fff;
    white-space:nowrap;display:none;
    max-width:85vw;overflow:hidden;text-overflow:ellipsis;
  }
  #msg-toast.show{display:block;animation:toastin .3s ease}
  @keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* Gold heart notification */
  #gold-notif{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:35;pointer-events:none;text-align:center;display:none;
  }
  #gold-notif.show{display:block;animation:goldpop .5s cubic-bezier(.34,1.5,.64,1)}
  @keyframes goldpop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .gn-emoji{font-size:3rem;display:block}
  .gn-text{font-size:14px;font-weight:700;color:var(--gold);background:rgba(0,0,0,.6);border-radius:50px;padding:.3rem 1rem;margin-top:.35rem;display:inline-block}

  /* ── GAME OVER ── */
  #s-gameover{
    background:radial-gradient(ellipse at top,#2d0a1e,#0d0208);
    padding:1.25rem;overflow-y:auto;
  }
  .go-icon{font-size:3.5rem;display:block;margin-bottom:.75rem;animation:float 3s ease-in-out infinite}
  .go-title{font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:.25rem}
  .go-sub{font-size:12.5px;color:rgba(255,255,255,.5);margin-bottom:1.25rem}

  .go-stats{
    display:flex;gap:.5rem;margin-bottom:1.25rem;width:100%;max-width:360px;
  }
  .gos-card{
    flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:.75rem .5rem;text-align:center;
  }
  .gos-num{font-size:1.6rem;font-weight:700;color:#ff8fab;display:block;line-height:1}
  .gos-label{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;display:block;margin-top:.2rem}

  /* Messages collected */
  .msgs-title{
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);
    display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;width:100%;max-width:360px;
  }
  .msgs-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(201,169,110,.3),transparent)}

  .msgs-list{
    display:flex;flex-direction:column;gap:.4rem;
    width:100%;max-width:360px;margin-bottom:1.25rem;
    max-height:220px;overflow-y:auto;
  }
  .msg-card{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:.65rem .9rem;
    font-size:12px;color:rgba(255,255,255,.8);line-height:1.55;
    text-align:left;display:flex;gap:.5rem;align-items:flex-start;
  }
  .msg-card-icon{flex-shrink:0;font-size:.9rem}
  .msg-card.gold{border-color:rgba(201,169,110,.3);background:rgba(201,169,110,.08)}
  .msg-card.locked{opacity:.4;filter:blur(1px)}

  .go-btns{display:flex;gap:.6rem;width:100%;max-width:360px}
  .go-btn{flex:1;padding:.85rem;border-radius:50px;border:none;cursor:pointer;font-size:13.5px;font-weight:700;transition:all .15s}
  .go-btn-p{background:linear-gradient(135deg,#c17a6f,#e91e8c);color:#fff;box-shadow:0 4px 14px rgba(233,30,140,.3)}
  .go-btn-p:active{transform:scale(.97)}
  .go-btn-o{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15)}

  /* Confetti */
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- INTRO -->
<div id="s-intro" class="screen active">
  <div class="intro-stars" id="intro-stars"></div>
  <span class="intro-icon">💝</span>
  <span class="intro-label">Khusus untuk Dara</span>
  <h1 class="intro-title">Heart <span>Catch</span></h1>
  <p class="intro-sub">Tangkap hati yang jatuh dari Razan — tiap hati berisi pesan khusus buat kamu 🤍</p>

  <div class="intro-info">
    <div class="ii-card"><span class="ii-icon">❤️</span><span class="ii-label">Hati biasa</span><span class="ii-val">+1 poin</span></div>
    <div class="ii-card"><span class="ii-icon">💛</span><span class="ii-label">Hati emas</span><span class="ii-val">Pesan spesial</span></div>
    <div class="ii-card"><span class="ii-icon">💔</span><span class="ii-label">Kelewat</span><span class="ii-val">−1 nyawa</span></div>
  </div>

  <div class="hs-badge" id="hs-badge">🏆 High Score: 0</div>

  <button class="start-btn" onclick="startGame()">Mulai! 💝</button>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div id="hud">
    <div>
      <div class="hud-score">❤️ <span id="score-display">0</span></div>
      <div class="hud-hs">Best: <span id="hs-display">0</span></div>
    </div>
    <div class="hud-lives" id="lives-display"></div>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="msg-toast"></div>
  <div id="gold-notif"><span class="gn-emoji">💛</span><p class="gn-text">Pesan Spesial!</p></div>
</div>

<!-- GAME OVER -->
<div id="s-gameover" class="screen">
  <span class="go-icon">💝</span>
  <p class="go-title" id="go-title">Game Over!</p>
  <p class="go-sub" id="go-sub">...</p>

  <div class="go-stats">
    <div class="gos-card"><span class="gos-num" id="go-score">0</span><span class="gos-label">Skor</span></div>
    <div class="gos-card"><span class="gos-num" id="go-best">0</span><span class="gos-label">Best</span></div>
    <div class="gos-card"><span class="gos-num" id="go-msgs">0</span><span class="gos-label">Pesan</span></div>
  </div>

  <p class="msgs-title">Pesan yang terkumpul</p>
  <div class="msgs-list" id="msgs-list"></div>

  <div class="go-btns">
    <button class="go-btn go-btn-p" onclick="startGame()">Main Lagi 🔄</button>
    <button class="go-btn go-btn-o" onclick="showScreen('s-intro')">Menu</button>
  </div>
</div>

<script>
// ── MESSAGES ──
const MSGS_TIER1 = [ // 0-10 hati
  {text:"Kamu cantik", icon:"🌸"},
  {text:"Aku kangen", icon:"🥺"},
  {text:"Aku mikirin kamu", icon:"💭"},
  {text:"Kamu lucu banget", icon:"😊"},
  {text:"Senyum kamu 🥰", icon:"🥰"},
  {text:"Hei, aku kangen", icon:"💌"},
  {text:"Kamu bikin aku senyum", icon:"😄"},
  {text:"Aku suka suara kamu", icon:"🎵"},
  {text:"Kamu cantik banget hari ini", icon:"✨"},
  {text:"Aku pengen peluk kamu", icon:"🤗"},
];

const MSGS_TIER2 = [ // 11-25 hati
  {text:"Aku bangga sama kamu", icon:"🌟"},
  {text:"Makasih udah sabar sama aku", icon:"🙏"},
  {text:"Aku ngerasa tenang sama kamu", icon:"🕊️"},
  {text:"Kamu lebih kuat dari Aku", icon:"💪"},
  {text:"Makasih udah ada", icon:"🤍"},
  {text:"Kamu itu rare", icon:"💎"},
  {text:"Kamu selalu terbuka ke kamu", icon:"📱"},
  {text:"Kamu bikin aku jadi lebih baik", icon:"🪞"},
  {text:"Aku ga mau hari-hari tanpa kamu", icon:"🌙"},
  {text:"Kamu orang favorit aku", icon:"💬"},
];

const MSGS_TIER3 = [ // 26+ hati
  {text:"Aku milih kamu selalu", icon:"💗"},
  {text:"Kamu rumah aku", icon:"🏠"},
  {text:"Aku sayang kamu", icon:"💞"},
  {text:"Kamu hal yang aku yakinin", icon:"🔮"},
  {text:"Kamu yang terbaik bagi aku", icon:"🫶"},
  {text:"Aku mau terus ada buat kamu", icon:"⚓"},
  {text:"Tiap hari sama kamu itu hadiah", icon:"🎁"},
  {text:"Aku cinta kamu, Dara", icon:"❤️"},
];

const GOLD_MSGS = [
  {text:"Kamu bukan kebetulan — kamu pilihan aku", icon:"💛"},
  {text:"Kamu selalu bikin aku ngerasa cukup", icon:"💛"},
  {text:"Aku seneng banget kamu ada", icon:"💛"},
];

// ── STORAGE ──
function getHS(){return parseInt(localStorage.getItem('hc-hs')||'0')}
function setHS(s){localStorage.setItem('hc-hs',s)}

// ── GAME STATE ──
let canvas, ctx, W, H, dpr;
let score=0, lives=3, raf=null;
let hearts=[], particles=[];
let basketX=0, basketW=0;
let gameRunning=false;
let frameCount=0;
let collectedMsgs=[];
let goldMsgIdx=0;
let lastMsgToastTimeout=null;
let isDragging=false;
let touchLastX=0;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── STARS ──
function buildStars(){
  const el=document.getElementById('intro-stars');
  el.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    el.appendChild(s);
  }
  document.getElementById('hs-badge').textContent=`🏆 High Score: ${getHS()}`;
}
buildStars();

// ── START ──
function startGame(){
  score=0; lives=3; frameCount=0;
  hearts=[]; particles=[]; collectedMsgs=[];
  goldMsgIdx=0; gameRunning=true;
  showScreen('s-game');
  initCanvas();
  basketX=W/2-basketW/2;
  updateHUD();
  setupInput();
  cancelAnimationFrame(raf);
  loop();
}

function initCanvas(){
  canvas=document.getElementById('game-canvas');
  ctx=canvas.getContext('2d');
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  basketW=Math.min(W*0.28,110);
  basketX=W/2-basketW/2;
}

// ── INPUT ──
function setupInput(){
  canvas.addEventListener('touchstart',e=>{
    isDragging=true;
    touchLastX=e.touches[0].clientX;
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(!isDragging)return;
    const dx=e.touches[0].clientX-touchLastX;
    touchLastX=e.touches[0].clientX;
    basketX=Math.max(0,Math.min(W-basketW,basketX+dx));
  },{passive:true});
  canvas.addEventListener('touchend',()=>isDragging=false,{passive:true});
  canvas.addEventListener('mousemove',e=>{
    basketX=Math.max(0,Math.min(W-basketW,e.clientX-basketW/2));
  });
}

// ── LOOP ──
function loop(){
  if(!gameRunning)return;
  frameCount++;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

function getSpeed(){
  const base=2.5;
  const bonus=Math.floor(score/10)*0.3;
  return Math.min(base+bonus, 7);
}

function getSpawnRate(){
  // Lower = more frequent
  const base=80;
  const reduction=Math.floor(score/15)*5;
  return Math.max(35,base-reduction);
}

function update(){
  // Spawn hearts
  if(frameCount%getSpawnRate()===0){
    const isGold=score>0&&score%20===0&&hearts.every(h=>!h.gold);
    hearts.push({
      x:Math.random()*(W-40)+20,
      y:-30,
      r:isGold?22:Math.random()*8+14,
      spd:getSpeed()*(0.7+Math.random()*0.6),
      gold:isGold,
      wobble:Math.random()*Math.PI*2,
      wobbleSpd:0.05+Math.random()*0.03,
      msg:getMsg(score,isGold),
    });
  }

  const hudH=56;
  const basketY=H-60;
  const basketH=28;

  hearts.forEach((h,i)=>{
    h.y+=h.spd;
    h.wobble+=h.wobbleSpd;
    h.x+=Math.sin(h.wobble)*0.6;

    // Catch check
    if(h.y+h.r>=basketY&&h.y-h.r<=basketY+basketH&&h.x>=basketX-h.r&&h.x<=basketX+basketW+h.r){
      // Caught!
      spawnParticles(h.x,basketY,h.gold?'#c9a96e':'#ff8fab',h.gold?12:6);
      score++;
      if(h.gold){
        collectedMsgs.unshift({...h.msg,gold:true});
        showGoldNotif(h.msg.text);
      } else {
        collectedMsgs.push(h.msg);
        showMsgToast(h.msg.icon+' '+h.msg.text);
      }
      hearts.splice(i,1);
      updateHUD();
      return;
    }

    // Missed
    if(h.y-h.r>H){
      lives--;
      hearts.splice(i,1);
      spawnParticles(h.x,H-20,'#555',3);
      updateHUD();
      if(lives<=0){gameOver();return;}
    }
  });

  // Update particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=0.025;p.r*=0.95});
  particles=particles.filter(p=>p.life>0);
}

function getMsg(sc, gold){
  if(gold) return GOLD_MSGS[goldMsgIdx++%GOLD_MSGS.length];
  if(sc<=10) return MSGS_TIER1[Math.floor(Math.random()*MSGS_TIER1.length)];
  if(sc<=25) return MSGS_TIER2[Math.floor(Math.random()*MSGS_TIER2.length)];
  return MSGS_TIER3[Math.floor(Math.random()*MSGS_TIER3.length)];
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,r:Math.random()*4+2,
      vx:(Math.random()-0.5)*5,
      vy:-(Math.random()*5+2),
      color,life:1,
    });
  }
}

// ── DRAW ──
function draw(){
  ctx.clearRect(0,0,W,H);

  // BG
  const bg=ctx.createRadialGradient(W/2,0,0,W/2,H/2,Math.max(W,H));
  bg.addColorStop(0,'#2d0a1e');bg.addColorStop(1,'#050102');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<40;i++){
    const sx=((i*137.5)%W);
    const sy=((i*97.3)%((H*0.7)));
    const ss=((i*0.7)%1.5)+0.5;
    const alpha=(Math.sin(frameCount*0.02+i)*0.3+0.7)*0.6;
    ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Hearts
  hearts.forEach(h=>drawHeart(h));

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Basket
  drawBasket();
}

function drawHeart(h){
  const x=h.x, y=h.y, r=h.r;
  ctx.save();
  ctx.translate(x,y);
  const scale=1+Math.sin(h.wobble*2)*0.04;
  ctx.scale(scale,scale);

  if(h.gold){
    // Gold glow
    ctx.shadowColor='#c9a96e';ctx.shadowBlur=20;
  } else {
    ctx.shadowColor='#ff6b8a';ctx.shadowBlur=12;
  }

  ctx.fillStyle=h.gold?'#c9a96e':'#ff6b8a';
  heartPath(ctx,r);
  ctx.fill();
  ctx.shadowBlur=0;

  // Shine
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.ellipse(-r*0.3,-r*0.4,r*0.25,r*0.15,-0.5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function heartPath(ctx,r){
  ctx.beginPath();
  ctx.moveTo(0,r*0.3);
  ctx.bezierCurveTo(r*1.1,-r*0.3, r*1.1,-r*1.1, 0,-r*0.6);
  ctx.bezierCurveTo(-r*1.1,-r*1.1, -r*1.1,-r*0.3, 0,r*0.3);
  ctx.closePath();
}

function drawBasket(){
  const bx=basketX, by=H-72, bw=basketW, bh=32;

  // Glow
  ctx.shadowColor='#ff6b8a';ctx.shadowBlur=20;

  // Body
  const grad=ctx.createLinearGradient(bx,by,bx,by+bh);
  grad.addColorStop(0,'#c17a6f');grad.addColorStop(1,'#7a3f35');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.fill();
  ctx.shadowBlur=0;

  // Top rim
  ctx.strokeStyle='rgba(255,143,171,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.stroke();

  // Heart on basket
  ctx.save();ctx.translate(bx+bw/2,by+bh/2);
  ctx.fillStyle='rgba(255,255,255,.3)';
  heartPath(ctx,8);ctx.fill();
  ctx.restore();
}

// ── HUD ──
function updateHUD(){
  document.getElementById('score-display').textContent=score;
  document.getElementById('hs-display').textContent=Math.max(score,getHS());
  const lEl=document.getElementById('lives-display');
  lEl.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.style.cssText=`font-size:1.2rem;opacity:${i<lives?1:.2}`;
    s.textContent='❤️';lEl.appendChild(s);
  }
}

// ── MESSAGE TOAST ──
function showMsgToast(msg){
  clearTimeout(lastMsgToastTimeout);
  const el=document.getElementById('msg-toast');
  el.textContent=msg;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  lastMsgToastTimeout=setTimeout(()=>el.classList.remove('show'),2200);
}

function showGoldNotif(msg){
  const el=document.getElementById('gold-notif');
  el.querySelector('.gn-text').textContent=msg;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
  confetti(40);
}

// ── GAME OVER ──
function gameOver(){
  gameRunning=false;
  cancelAnimationFrame(raf);

  const hs=Math.max(score,getHS());
  setHS(hs);
  document.getElementById('hs-badge').textContent=`🏆 High Score: ${hs}`;

  const isNewHS=score>=getHS();
  document.getElementById('go-title').textContent=isNewHS&&score>0?'New High Score! 🏆':'Game Over!';
  document.getElementById('go-sub').textContent=
    score===0?'Belum ada yang kecantap — coba lagi sayang! 😄':
    score<10?`${score} hati kecantap — bisa lebih banyak lagi nih!`:
    score<25?`${score} hati! Kamu udah dapet banyak pesan 🤍`:
    `${score} hati!! Kamu keren banget 💝`;

  document.getElementById('go-score').textContent=score;
  document.getElementById('go-best').textContent=hs;
  document.getElementById('go-msgs').textContent=collectedMsgs.length;

  // Build message list
  const list=document.getElementById('msgs-list');
  list.innerHTML='';
  if(collectedMsgs.length===0){
    list.innerHTML='<p style="font-size:12px;color:rgba(255,255,255,.3);text-align:center;padding:1rem">Belum ada pesan terkumpul — tangkap lebih banyak hati! 💝</p>';
  } else {
    // Show unique messages only
    const seen=new Set();
    collectedMsgs.forEach(m=>{
      if(seen.has(m.text))return;seen.add(m.text);
      const el=document.createElement('div');
      el.className='msg-card'+(m.gold?' gold':'');
      el.innerHTML=`<span class="msg-card-icon">${m.icon}</span><span>${m.text}</span>`;
      list.appendChild(el);
    });
  }

  showScreen('s-gameover');
  if(score>0)confetti(50);
}

function confetti(n=50){
  const colors=['#ff6b8a','#ffb3c6','#c9a96e','#fff','#ff8fab'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
  },i*20);
}

window.addEventListener('resize',()=>{
  if(document.getElementById('s-game').classList.contains('active'))initCanvas();
});
</script>
