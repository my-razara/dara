<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kamus Kita — Razan & Dara 📖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .bd-st.err{color:#b4554a}
  .wotd{background:linear-gradient(135deg,#fffaf0,#f8ecd9);border:1px solid rgba(201,169,110,.35);border-radius:22px;padding:1rem 1.1rem;margin-bottom:.9rem;position:relative;overflow:hidden}
  .wotd::after{content:'📖';position:absolute;right:-.3rem;bottom:-.6rem;font-size:4.2rem;opacity:.12}
  .wotd small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .wotd b{display:block;font-family:Georgia,'Times New Roman',serif;font-size:1.6rem;color:var(--deep);margin:.15rem 0 0}
  .wotd i{font-size:11.5px;color:var(--muted)}
  .wotd p{font-size:13px;line-height:1.55;margin-top:.35rem}
  .srch{margin-bottom:.6rem}
  .az{display:flex;flex-wrap:wrap;gap:.2rem;justify-content:center;margin:.2rem 0 .9rem}
  .az button{width:26px;height:26px;border-radius:8px;border:none;background:#fff;color:var(--deep);font-size:11.5px;font-weight:600;cursor:pointer}
  .az button:disabled{opacity:.25;cursor:default}
  .az button.on{background:var(--deep);color:#fff}
  .lt{font-family:Georgia,serif;font-size:1.3rem;color:var(--gold);margin:1rem 0 .3rem;border-bottom:1px solid rgba(201,169,110,.3);padding-bottom:.15rem}
  .en{background:#fff;border-radius:16px;padding:.8rem .9rem;margin-bottom:.5rem;border:1px solid rgba(193,122,111,.12);cursor:pointer}
  .en .w{font-family:Georgia,serif;font-size:1.15rem;font-weight:700;color:var(--deep)}
  .en .ps{font-size:11px;color:var(--muted);font-style:italic;margin-left:.3rem}
  .en .df{font-size:12.5px;line-height:1.5;margin-top:.2rem}
  .en .ft{display:flex;justify-content:space-between;align-items:center;margin-top:.35rem;font-size:10.5px;color:var(--muted)}
  .tag{font-size:9.5px;font-weight:700;padding:.06rem .45rem;border-radius:20px;color:#fff}
  .tag.Razan{background:var(--rz)}.tag.Dara{background:var(--dr)}
  .det{text-align:left}
  .det .w{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:var(--deep);line-height:1.1}
  .det .ps{font-size:12px;color:var(--muted);font-style:italic}
  .det h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:.9rem 0 .25rem}
  .det p{font-size:13.5px;line-height:1.6}
  .det .ex{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--deep);border-left:3px solid var(--blush);padding-left:.7rem}
  .det .meta{font-size:11px;color:var(--muted);margin-top:1rem}
  .cnt{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:.6rem}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who-btn"></button></div>
  <div class="head"><span class="ico">📖</span><p class="lbl">Bahasa rahasia</p><h1 class="title">Kamus <span>Kita</span></h1><p class="sub">Kata-kata yang cuma kalian berdua yang ngerti — panggilan sayang, singkatan aneh, bahasa planet sendiri. Dibukuin biar ga lupa asal-usulnya 🤭</p></div>
  <p class="bd-st" id="bd-st"></p>
  <div id="main"></div>
</div>
<div class="ov" id="ed-ov"><div class="sheet">
  <div class="drag"></div><h3 style="text-align:center;font-size:15px;margin-bottom:.3rem" id="ed-h">Kata baru</h3>
  <label class="lab">📝 Kata / istilah</label><input class="inp" id="ed-w" maxlength="30" placeholder="Contoh: bebeb, gemoy, otw (padahal baru mandi)">
  <label class="lab">Jenis kata</label><div class="chips" id="ed-p"></div>
  <label class="lab">💡 Artinya</label><textarea class="ta" id="ed-d" rows="2" maxlength="200" placeholder="Arti dalam bahasa kita…"></textarea>
  <label class="lab">💬 Contoh kalimat</label><input class="inp" id="ed-x" maxlength="120" placeholder="&quot;Aku udah otw nih&quot; (masih di kasur)">
  <label class="lab">📜 Asal-usul</label><textarea class="ta" id="ed-o" rows="2" maxlength="240" placeholder="Pertama kali muncul pas…"></textarea>
  <div class="row"><button class="btn ghost" onclick="closeOv('ed-ov')">Batal</button><button class="btn" onclick="saveEd()">Simpan</button></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

// ── penyimpanan per-item: tiap item 1 baris di database (server nolak data > 3000 huruf per baris) ──
// tanggal baris = tanggal "palsu" mulai 1901-01-01 (cuma buat nomor urut), isinya item itu sendiri.
// format lama (semua item numpuk di 1 baris '2000-01-01') tetep kebaca & otomatis dipindah.
const LEGACY_D = '2000-01-01', ROW0 = Date.UTC(1901, 0, 1);
const rowDate = i => new Date(ROW0 + i * 864e5).toISOString().slice(0, 10);
function itemRows(app, w, lk) {
  const m = lsGet(app + '-' + w, {}) || {}, out = [];
  Object.entries(m).forEach(([d, v]) => {
    if (!v) return;
    if (d === LEGACY_D && v[lk || 'items']) v[lk || 'items'].forEach(x => out.push(Object.assign({}, x, { owner: w, _d: null })));
    else if (v.id && d < '1990-01-01') out.push(Object.assign({}, v, { owner: w, _d: d }));
  });
  return out;
}
function legacyDrop(app, w, id, lk) {
  const s = (lsGet(app + '-' + w, {}) || {})[LEGACY_D]; if (!s || !s[lk || 'items']) return;
  const arr = s[lk || 'items'].filter(y => y.id !== id); if (arr.length === s[lk || 'items'].length) return;
  BD.put(app, w, LEGACY_D, arr.length ? { [lk || 'items']: arr } : null);
}
function itemPut(app, x, lk) {
  const o = Object.assign({}, x); delete o.owner; delete o._d;
  if (JSON.stringify(o).length > 2900) return false;
  let d = x._d;
  if (!d) {
    // kalau item ini udah punya baris (misal diedit dari data lama), pakai baris itu
    const m = lsGet(app + '-' + x.owner, {}) || {}, hit = Object.entries(m).find(([k, v]) => v && v.id === x.id && k < '1990-01-01');
    if (hit) d = hit[0]; else { let i = 0; while (m[rowDate(i)]) i++; d = rowDate(i); }
  }
  x._d = d; BD.put(app, x.owner, d, o); legacyDrop(app, x.owner, x.id, lk); return true;
}
function itemDel(app, x, lk) { if (x._d) BD.put(app, x.owner, x._d, null); legacyDrop(app, x.owner, x.id, lk); }
function itemMigrate(app, w, lk) { itemRows(app, w, lk).filter(x => !x._d).forEach(x => itemPut(app, x, lk)); }

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, enabled: false };
const SLOT = '2000-01-01';
const POS = [['panggilan', 'panggilan'], ['kerja', 'kata kerja'], ['sifat', 'kata sifat'], ['singkatan', 'singkatan'], ['ungkapan', 'ungkapan'], ['benda', 'kata benda']];
if (lsGet('kamus-me', null) == null) lsSet('kamus-me', BD.me());
let me = whoBtn('kamus-me', () => { me = lsGet('kamus-me', 'Dara'); BD.setMe(me); render(); });
BD.setMe(me);
let q = '', letter = '', cur = null, ed = null;
const uid = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const all = () => itemRows('kamus', 'Razan').concat(itemRows('kamus', 'Dara'));
function save(x) { return itemPut('kamus', x); }
function remove(x) { itemDel('kamus', x); }
const find = id => all().find(x => x.id === id);
const L1 = w => { const c = (w || '').trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
const posName = k => (POS.find(p => p[0] === k) || ['', ''])[1];
function bdStatus() { const el = $('bd-st'), t = BD.status(); el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function closeOv(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));
function render() { bdStatus(); cur ? detail() : list(); }
function list() {
  const A = all().sort((a, b) => a.w.localeCompare(b.w, 'id'));
  let L = A; if (q) L = L.filter(x => (x.w + ' ' + x.d + ' ' + (x.x || '')).toLowerCase().includes(q)); if (letter) L = L.filter(x => L1(x.w) === letter);
  const day = Math.floor(today0() / 864e5), wd = A.length ? A[day % A.length] : null, have = new Set(A.map(x => L1(x.w)));
  const groups = {}; L.forEach(x => (groups[L1(x.w)] = groups[L1(x.w)] || []).push(x));
  $('main').innerHTML = `${wd ? `<div class="wotd" onclick="openDet('${wd.id}')" style="cursor:pointer"><small>Kata hari ini</small><b>${esc(wd.w)}</b><i>${esc(posName(wd.p))}</i><p>${esc(wd.d)}</p></div>` : ''}
    <input class="inp srch" id="q" placeholder="🔍 Cari kata atau arti…" value="${esc(q)}">
    <div class="az">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').map(c => `<button class="${letter === c ? 'on' : ''}" ${have.has(c) ? '' : 'disabled'} data-c="${c}">${c}</button>`).join('')}</div>
    <button class="btn" onclick="openEd()" style="margin-bottom:.6rem">＋ Tambah kata baru</button>
    <p class="cnt">${A.length} kata · Razan nyumbang ${A.filter(x => x.owner === 'Razan').length} · Dara nyumbang ${A.filter(x => x.owner === 'Dara').length}</p>
    ${Object.keys(groups).sort().map(k => `<div class="lt">${k}</div>${groups[k].map(x => `<div class="en" data-id="${x.id}"><span class="w">${esc(x.w)}</span><span class="ps">${esc(posName(x.p))}</span><div class="df">${esc(x.d)}</div><div class="ft"><span>${x.x ? '💬 ada contoh' : ''}${x.o ? (x.x ? ' · ' : '') + '📜 ada asal-usul' : ''}</span><span class="tag ${x.owner}">${x.owner}</span></div></div>`).join('')}`).join('') || `<p class="empty">${A.length ? 'Ga ketemu kata itu 🤔' : 'Kamusnya masih kosong 📖<br>Kata apa yang cuma kalian berdua yang ngerti? Tulis yang pertama!'}</p>`}`;
  const qi = $('q'); qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; list(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  $('main').querySelectorAll('.az button').forEach(b => b.onclick = () => { letter = letter === b.dataset.c ? '' : b.dataset.c; list(); });
  $('main').querySelectorAll('.en').forEach(e => e.onclick = () => openDet(e.dataset.id));
}
function openDet(id) { cur = id; render(); window.scrollTo(0, 0); }
function detail() {
  const x = find(cur); if (!x) { cur = null; return list(); }
  $('main').innerHTML = `<button class="pill" onclick="cur=null;render()" style="margin-bottom:.8rem">← Semua kata</button>
    <div class="card det"><div class="w">${esc(x.w)}</div><div class="ps">${esc(posName(x.p))}</div>
    <h4>Arti</h4><p>${esc(x.d)}</p>
    ${x.x ? `<h4>Contoh</h4><p class="ex">${esc(x.x)}</p>` : ''}
    ${x.o ? `<h4>Asal-usul</h4><p>${esc(x.o)}</p>` : ''}
    <p class="meta">Dicatat ${esc(x.owner)} · ${fmtD(new Date(x.at))}${x.ed && x.ed !== x.owner ? ` · diedit ${esc(x.ed)}` : ''}</p></div>
    <button class="btn" onclick="shareImg()">📸 Jadiin kartu & kirim</button>
    <div class="row"><button class="btn ghost" onclick="openEd('${x.id}')">✏️ Edit</button><button class="btn ghost" onclick="delK()">🗑 Hapus</button></div>`;
}
function delK() { const x = find(cur); if (!confirm(`Hapus kata "${x.w}"?`)) return; remove(x); cur = null; render(); toast('🗑 Dihapus dari kamus'); }
function openEd(id) {
  const x = id ? find(id) : null; ed = x ? Object.assign({}, x) : { id: uid(), owner: me, p: 'panggilan' };
  $('ed-h').textContent = x ? 'Edit kata' : 'Kata baru';
  $('ed-w').value = ed.w || ''; $('ed-d').value = ed.d || ''; $('ed-x').value = ed.x || ''; $('ed-o').value = ed.o || '';
  const paint = () => { $('ed-p').innerHTML = POS.map(([k, n]) => `<button class="${ed.p === k ? 'on' : ''}" data-k="${k}">${n}</button>`).join(''); $('ed-p').querySelectorAll('button').forEach(b => b.onclick = () => { ed.p = b.dataset.k; paint(); }); };
  paint(); $('ed-ov').classList.add('show');
}
function saveEd() {
  const w = $('ed-w').value.trim(), d = $('ed-d').value.trim(); if (!w || !d) { toast('Kata & artinya diisi dulu ya'); return; }
  if (!find(ed.id) && all().some(x => x.w.toLowerCase() === w.toLowerCase())) { if (!confirm(`"${w}" udah ada di kamus. Tetep tambahin?`)) return; }
  Object.assign(ed, { w, d, x: $('ed-x').value.trim(), o: $('ed-o').value.trim(), at: ed.at || Date.now() }); if (find(ed.id)) ed.ed = me;
  save(ed); closeOv('ed-ov'); vib(15); toast(`📖 Masuk kamus${BD.enabled ? ` · ${otherOf(me)} bisa liat` : ''}`); render();
}
async function shareImg() {
  const x = find(cur); await fontsReady(); const c = document.createElement('canvas'); c.width = 1080; c.height = 1080; const g = c.getContext('2d');
  g.fillStyle = '#fbf3e4'; g.fillRect(0, 0, 1080, 1080); g.strokeStyle = '#c9a96e'; g.lineWidth = 4; g.strokeRect(50, 50, 980, 980); g.lineWidth = 1.5; g.strokeRect(66, 66, 948, 948);
  g.fillStyle = '#c9a96e'; g.font = '600 26px Poppins'; g.textAlign = 'left'; g.fillText('K A M U S   K I T A', 120, 160);
  g.fillStyle = '#7a3f35'; g.font = '700 96px Georgia, serif'; const wl = wrapText(g, x.w, 840); wl.slice(0, 2).forEach((l, i) => g.fillText(l, 120, 280 + i * 100));
  let y = 280 + (Math.min(wl.length, 2) - 1) * 100 + 60;
  g.fillStyle = '#9a8070'; g.font = 'italic 34px Georgia, serif'; g.fillText(posName(x.p), 120, y); y += 70;
  g.fillStyle = '#2d1f1a'; g.font = '400 40px Poppins'; wrapText(g, x.d, 840).slice(0, 5).forEach(l => { g.fillText(l, 120, y); y += 56; });
  if (x.x) { y += 30; g.fillStyle = '#c17a6f'; g.fillRect(120, y - 34, 5, 50); g.fillStyle = '#7a3f35'; g.font = '700 50px Caveat'; wrapText(g, x.x, 800).slice(0, 2).forEach(l => { g.fillText(l, 145, y); y += 56; }); }
  g.fillStyle = '#9a8070'; g.font = '400 26px Poppins'; g.fillText(`Razan & Dara · dicatat ${x.owner}`, 120, 980);
  await shareCanvas(c, 'kamus-' + x.w.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png', x.w);
}
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if (ev.apps.includes('kamus') && !$('ed-ov').classList.contains('show') && document.activeElement.id !== 'q') render(); });
itemMigrate('kamus', me); render();

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
