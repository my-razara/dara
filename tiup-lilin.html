<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tiup Lilin — Razan & Dara 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input{font-family:'Poppins',sans-serif}
  html,body{background:#2b1d24}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:#fbeee6;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 70% 55% at 50% 55%,rgba(255,190,120,var(--glow,.28)),transparent 70%),linear-gradient(#2b1d24,#1d1318);transition:background .4s}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:#e9d3c8;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,220,200,.2);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .head{text-align:center;margin-top:1rem}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-family:'Caveat',cursive;font-size:clamp(2rem,9vw,2.5rem);color:#fff;line-height:1.1;margin-top:.15rem}
  .sub{font-size:12.5px;color:#d9bfb3;line-height:1.6;margin-top:.2rem;min-height:1.6em}

  .cake-wrap{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:300px;padding-bottom:.6rem}
  .cake{position:relative;width:min(270px,76vw)}
  .candles{position:absolute;left:8%;right:8%;bottom:calc(100% - 22px);display:flex;justify-content:space-evenly;align-items:flex-end;z-index:2}
  .cd{position:relative;width:12px;height:64px;border-radius:4px 4px 2px 2px;background:repeating-linear-gradient(135deg,#fff 0 6px,#f0a39a 6px 12px);box-shadow:inset -2px 0 0 rgba(0,0,0,.08);cursor:pointer}
  .cd:nth-child(even){height:56px;background:repeating-linear-gradient(135deg,#fff 0 6px,#9cc3f7 6px 12px)}
  .cd::before{content:'';position:absolute;left:50%;top:-7px;width:2px;height:8px;background:#3a2a20;transform:translateX(-50%)}
  .fl{position:absolute;left:50%;bottom:calc(100% + 4px);width:16px;height:28px;margin-left:-8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff 0 18%,#ffe27a 30%,#ff9a3c 65%,rgba(255,80,40,0) 72%);transform-origin:50% 100%;animation:fk .18s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px rgba(255,180,80,.9));transition:opacity .3s,transform .3s}
  .fl::after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(rgba(255,200,120,.25),transparent 70%);pointer-events:none}
  @keyframes fk{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.06) rotate(2deg)}}
  .cd.out .fl{opacity:0;transform:scale(.2,.4);animation:none}
  .smoke{position:absolute;left:50%;bottom:calc(100% + 8px);width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(220,220,220,.55);opacity:0;pointer-events:none}
  .cd.out .smoke{animation:sm 1.8s ease-out forwards}
  @keyframes sm{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(10px,-70px) scale(5)}}
  .tier{position:relative;margin:0 auto;border-radius:14px 14px 8px 8px}
  .t1{width:70%;height:70px;background:linear-gradient(#ffe9ef,#f7c9d4);box-shadow:inset 0 -6px 0 rgba(0,0,0,.05)}
  .t2{width:100%;height:92px;margin-top:-4px;background:linear-gradient(#fff5e8,#f3dcc0);box-shadow:inset 0 -8px 0 rgba(0,0,0,.05)}
  .t1::before,.t2::before{content:'';position:absolute;left:-2px;right:-2px;top:-4px;height:22px;border-radius:14px 14px 50% 50%/14px 14px 12px 12px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.04)}
  .t2::before{background:#f9e2ea}
  .t2 .txt{position:absolute;left:0;right:0;top:40px;text-align:center;font-family:'Caveat',cursive;font-size:1.5rem;color:var(--rose)}
  .t1 .dots,.t2 .dots{position:absolute;left:10%;right:10%;bottom:14px;display:flex;justify-content:space-between}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--rose);opacity:.7}
  .dots i:nth-child(even){background:#9cc3f7}
  .plate{width:118%;margin-left:-9%;height:16px;border-radius:50%;background:linear-gradient(#f1e6dc,#c9b7a8);margin-top:-6px;box-shadow:0 10px 20px rgba(0,0,0,.4)}

  .panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,220,200,.18);border-radius:20px;padding:.9rem;margin-top:.8rem}
  .panel label{display:block;font-size:11.5px;font-weight:600;color:#f3d8cb;margin-bottom:.35rem}
  .inp{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid rgba(255,220,200,.25);background:rgba(0,0,0,.2);outline:none;color:#fff}
  .inp::placeholder{color:#b9a097}
  .cnt{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem;font-size:12px;color:#d9bfb3}
  .cnt div{display:flex;align-items:center;gap:.4rem}
  .cnt button{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,220,200,.3);background:transparent;color:#fff;font-size:16px;cursor:pointer}
  .cnt b{min-width:22px;text-align:center;color:#fff;font-size:15px}
  .meter{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:.7rem}
  .meter i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ffe27a,#ff9a3c);transition:width .08s}
  .btn{display:block;width:100%;padding:.95rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#2b1d24;background:linear-gradient(135deg,#ffe9b0,#f3c27a);cursor:pointer;margin-top:.7rem;text-align:center;text-decoration:none;box-shadow:0 6px 20px rgba(243,194,122,.3)}
  .btn.ghost{background:transparent;color:#f3d8cb;border:1.5px solid rgba(255,220,200,.3);box-shadow:none}
  .hold{touch-action:none;user-select:none;-webkit-user-select:none}
  .done{display:none;text-align:center;margin-top:.8rem}
  .done.show{display:block;animation:fi .5s ease}
  @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .done h2{font-family:'Caveat',cursive;font-size:2rem;color:#fff}
  .done p{font-size:12.5px;color:#d9bfb3;line-height:1.6}
  .wishes{margin-top:1rem;font-size:11.5px;color:#b9a097;text-align:center}
  .wishes button{background:none;border:none;color:#f3c27a;text-decoration:underline;font-size:11.5px;cursor:pointer}
  .wl{display:none;margin-top:.6rem;text-align:left}
  .wl.show{display:block}
  .wl div{background:rgba(255,255,255,.06);border-radius:12px;padding:.5rem .7rem;margin-bottom:.35rem;font-size:12px;color:#f3d8cb}
  .wl small{display:block;color:#b9a097;font-size:10px}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-height:640px){.cake-wrap{min-height:250px}.t2{height:78px}.t1{height:58px}}
</style>
<script src="sfx.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span></span></div>
  <div class="head">
    <p class="lbl" id="lbl">Tiup lilin</p>
    <h1 class="title" id="title">Bikin harapan dulu ya ✨</h1>
    <p class="sub" id="sub">Pejamin mata, bikin harapan, terus tiup lilinnya ke arah HP 🌬️</p>
  </div>
  <div class="cake-wrap">
    <div class="cake">
      <div class="candles" id="candles"></div>
      <div class="tier t1"><div class="dots"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="tier t2"><span class="txt" id="cake-txt">Razan ♡ Dara</span><div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="plate"></div>
    </div>
  </div>

  <div id="setup" class="panel">
    <label for="wish">Harapan kamu <span style="font-weight:400;color:#b9a097">(rahasia, cuma kesimpen di HP ini)</span></label>
    <input class="inp" id="wish" maxlength="140" placeholder="Aku harap…">
    <div class="cnt"><span>Jumlah lilin</span><div><button onclick="setN(-1)" aria-label="kurangi">−</button><b id="n">5</b><button onclick="setN(1)" aria-label="tambah">＋</button></div></div>
    <button class="btn" id="start" onclick="startBlow()">🌬️ Siap tiup!</button>
  </div>

  <div id="blow" class="panel" style="display:none">
    <p style="font-size:12.5px;color:#f3d8cb;text-align:center" id="b-hint">Tiup ke arah mic HP…</p>
    <div class="meter"><i id="lvl"></i></div>
    <button class="btn ghost hold" id="hold">🫧 Ga bisa pake mic? Tahan di sini buat niup</button>
  </div>

  <div class="done" id="done">
    <h2>🎉 Yeay, semua lilin padam!</h2>
    <p id="done-p">Harapannya udah terkirim ke semesta 🤍</p>
    <button class="btn" onclick="relight()">🕯️ Nyalain lagi</button>
  </div>
  <p class="wishes" id="wishes"></p>
  <div class="wl" id="wl"></div>
</div>

<script>
const ULTAH_DARA = { m: 8, d: 18 };
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

let N = lsGet('lilin-n', 5), life = [], blowing = false, stream = null, ac = null, an = null, raf = 0, holdOn = false;
const now = new Date(), isBday = now.getMonth() + 1 === ULTAH_DARA.m && now.getDate() === ULTAH_DARA.d;
if (isBday) { $('lbl').textContent = '🎂 ' + now.getDate() + ' Agustus'; $('title').textContent = 'Selamat ulang tahun, Dara!'; $('cake-txt').textContent = 'HBD Dara ♡'; }

function setN(d) { N = Math.max(1, Math.min(9, N + d)); lsSet('lilin-n', N); $('n').textContent = N; build(); }
function build() {
  life = Array(N).fill(1);
  $('candles').innerHTML = life.map((_, i) => `<div class="cd" data-i="${i}"><span class="fl"></span><span class="smoke"></span></div>`).join('');
  $('candles').querySelectorAll('.cd').forEach(c => c.onclick = () => { if (blowing) hit(+c.dataset.i, 1); });
  glow();
}
function glow() { const lit = life.filter(x => x > 0).length; document.body.style.setProperty('--glow', (.06 + .22 * lit / Math.max(1, N)).toFixed(2)); }

async function startBlow() {
  blowing = true; $('setup').style.display = 'none'; $('blow').style.display = ''; $('sub').textContent = 'Tiup yang kenceng! 🌬️'; if (!isBday) $('title').textContent = 'Tiuuup! 🌬️';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const C = window.AudioContext || window.webkitAudioContext; ac = new C();
    const src = ac.createMediaStreamSource(stream); an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    $('b-hint').textContent = 'Mic nyala 🎤 Tiup ke arah bawah HP…';
    listen();
  } catch (e) {
    $('b-hint').textContent = 'Mic ga bisa dipake — tahan tombol di bawah buat niup 🫧';
  }
}
// tiupan = suara keras & "berisik" di frekuensi rendah-menengah
function listen() {
  if (!blowing || !an) return;
  const buf = new Float32Array(an.fftSize); an.getFloatTimeDomainData(buf);
  let s = 0; for (const v of buf) s += v * v; const rms = Math.sqrt(s / buf.length);
  const lvl = Math.min(1, rms * 9);
  $('lvl').style.width = (lvl * 100) + '%';
  if (lvl > .32) blowAt((lvl - .25) * .09);
  raf = requestAnimationFrame(listen);
}
function blowAt(power) {
  // lilin yang paling deket ke tengah kena duluan, plus semuanya goyang
  document.querySelectorAll('.cd .fl').forEach(f => { f.style.transform = `skewX(${(Math.random() - .5) * 30 * Math.min(1, power * 20)}deg) scale(${1 - Math.min(.4, power * 6)})`; });
  const order = life.map((v, i) => [i, Math.abs(i - (N - 1) / 2) + Math.random() * 1.5]).filter(([i]) => life[i] > 0).sort((a, b) => a[1] - b[1]);
  order.slice(0, 2).forEach(([i]) => hit(i, power));
}
function hit(i, amt) {
  if (life[i] <= 0) return;
  life[i] -= amt;
  if (life[i] <= 0) { const c = $('candles').children[i]; c.classList.add('out'); const f = c.querySelector('.fl'); f.style.transform = ''; vib(25); glow(); puff(); if (life.every(x => x <= 0)) finish(); }
}
// tombol cadangan: tahan buat niup
const hold = $('hold');
hold.addEventListener('pointerdown', e => { e.preventDefault(); holdOn = true; const loop = () => { if (!holdOn || !blowing) return; blowAt(.03); $('lvl').style.width = (60 + Math.random() * 30) + '%'; setTimeout(loop, 60); }; loop(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => hold.addEventListener(ev, () => { holdOn = false; $('lvl').style.width = '0'; document.querySelectorAll('.cd .fl').forEach(f => f.style.transform = ''); }));
function puff() { try { const a = ac || new (window.AudioContext || window.webkitAudioContext)(); ac = a; const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * .25, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * .25; n.buffer = b; const g = a.createGain(); g.gain.value = .5; n.connect(g); g.connect(a.destination); n.start(); } catch (e) {} }
function chime() {
  try {
    const a = ac || new (window.AudioContext || window.webkitAudioContext)(); ac = a;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * .12; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.2); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.3); });
  } catch (e) {}
}
function finish() {
  blowing = false; cancelAnimationFrame(raf);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('blow').style.display = 'none'; $('done').classList.add('show'); if (!isBday) $('title').textContent = 'Harapan terkirim ✨';
  $('sub').textContent = isBday ? 'Selamat ulang tahun, sayang. Semoga semua harapanmu kejadian 🤍' : 'Semoga harapannya kejadian ✨';
  const w = $('wish').value.trim();
  if (w) { const l = lsGet('lilin-wishes', []); l.unshift({ w, at: Date.now() }); lsSet('lilin-wishes', l.slice(0, 50)); }
  const n = lsGet('lilin-count', 0) + 1; lsSet('lilin-count', n);
  $('done-p').textContent = w ? 'Harapannya udah terkirim ke semesta. Jangan dikasih tau siapa-siapa ya 🤫' : 'Harapan diem-diem juga tetep keitung kok 🤍';
  vib([40, 60, 40, 60, 160]); chime(); confetti(); paintWishes();
}
function relight() { if (!isBday) $('title').textContent = 'Bikin harapan dulu ya ✨'; $('done').classList.remove('show'); $('setup').style.display = ''; $('wish').value = ''; $('sub').textContent = 'Pejamin mata, bikin harapan, terus tiup lilinnya ke arah HP 🌬️'; build(); }
function paintWishes() {
  const l = lsGet('lilin-wishes', []), n = lsGet('lilin-count', 0);
  $('wishes').innerHTML = n ? `🕯️ Udah tiup lilin ${n}x${l.length ? ` · <button onclick="document.getElementById('wl').classList.toggle('show')">liat ${l.length} harapan</button>` : ''}` : '';
  $('wl').innerHTML = l.map(x => { const d = new Date(x.at); return `<div>${esc(x.w)}<small>${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}</small></div>`; }).join('');
}
function confetti() {
  const colors = ['#ffe27a', '#f0a39a', '#9cc3f7', '#fff', '#c9a96e'];
  for (let i = 0; i < 90; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 16);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; an = null; if (blowing) $('b-hint').textContent = 'Mic mati pas aplikasinya ditinggal — tahan tombol di bawah buat niup 🫧'; } });
$('n').textContent = N; build(); paintWishes();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
</body>
</html>
