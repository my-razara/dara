<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tombol Kangen — Razan & Dara 🫂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--rz:#4a7fc1;--dr:#d9776b}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream);overscroll-behavior:none}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 50% at 50% 45%,rgba(240,163,154,var(--glow,.18)),transparent 70%);transition:background .2s}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin-top:1rem}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem}
  .title span{color:var(--rose)}
  .modes{display:flex;gap:.35rem;justify-content:center;margin:.8rem 0 0;flex-wrap:wrap}
  .modes button{font-size:12.5px;padding:.45rem .8rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer}
  .modes button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:330px}
  .ring{position:relative;width:min(240px,66vw);aspect-ratio:1}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:rgba(193,122,111,.14);stroke-width:6}
  .ring .fg{fill:none;stroke:url(#g);stroke-width:6;stroke-linecap:round}
  .heart{position:absolute;inset:12%;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ffd3cc,#e98d82 55%,#c1665a);box-shadow:0 14px 40px rgba(193,102,90,.35),inset 0 -6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;touch-action:none;transition:transform .1s}
  .heart .e{font-size:clamp(3.2rem,16vw,4.4rem);line-height:1;transition:transform .1s}
  .heart small{font-size:11px;font-weight:600;letter-spacing:.06em;margin-top:.35rem;opacity:.95}
  .heart.hold{animation:shake .12s linear infinite}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--s)*1px),0)}50%{transform:translate(0,calc(var(--s)*1px))}75%{transform:translate(calc(var(--s)*-1px),0)}100%{transform:translate(0,0)}}
  .pct{font-size:2rem;font-weight:700;color:var(--deep);margin-top:1rem;font-variant-numeric:tabular-nums;min-height:2.4rem}
  .lvl{font-size:13px;color:var(--muted);min-height:1.4em;text-align:center}
  .fl{position:fixed;pointer-events:none;z-index:5;font-size:22px;animation:up 1.8s ease-out forwards}
  @keyframes up{to{transform:translate(var(--dx),-55vh) scale(.6);opacity:0}}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.6rem}
  .stats div{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:16px;padding:.6rem .3rem;text-align:center}
  .stats b{display:block;font-size:1.3rem;color:var(--deep);font-weight:700}
  .stats small{font-size:10px;color:var(--muted)}
  .meter{margin-top:.8rem;background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:16px;padding:.75rem .9rem}
  .meter p{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
  .meter p b{color:var(--deep);font-weight:600}
  .week{display:flex;gap:4px;align-items:flex-end;height:54px;margin-top:.5rem}
  .week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
  .week i{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--dr),#f0a39a);min-height:3px}
  .week span{font-size:9px;color:var(--muted)}

  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1.2rem}
  .ov.show{display:flex}
  .pop{width:100%;max-width:340px;background:var(--cream);border-radius:24px;padding:1.5rem 1.3rem 1.1rem;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .pop .e{font-size:3.4rem;display:block}
  .pop .t{font-size:1.6rem;color:var(--deep);line-height:1.2;margin:.3rem 0}
  .pop .s{font-size:12.5px;color:var(--muted);line-height:1.6}
  .wa{display:block;margin-top:1rem;padding:.95rem;border-radius:50px;background:#25a35a;color:#fff;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 6px 18px rgba(37,163,90,.3)}
  .close{background:none;border:none;color:var(--muted);font-size:12.5px;margin-top:.7rem;cursor:pointer;text-decoration:underline}
  @media (max-height:640px){.stage{min-height:280px}.ring{width:min(200px,58vw)}.pct{margin-top:.6rem}}
</style>
<script src="sfx.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who" onclick="toggleWho()"></button></div>
  <div class="head">
    <p class="lbl">Tombol Kangen</p>
    <h1 class="title">Kangen <span id="to-name">Razan</span>?</h1>
    <div class="modes" id="modes"></div>
  </div>
  <div class="stage">
    <div class="ring">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a39a"/><stop offset="1" stop-color="#7a3f35"/></linearGradient></defs><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" id="arc" cx="50" cy="50" r="46" stroke-dasharray="289" stroke-dashoffset="289"/></svg>
      <button class="heart" id="heart" aria-label="Tahan buat ngirim"><span class="e" id="h-e">🫂</span><small id="h-t">TAHAN</small></button>
    </div>
    <p class="pct" id="pct"></p>
    <p class="lvl" id="lvl">Tahan tombolnya — makin lama, makin erat</p>
  </div>
  <div class="stats"><div><b id="st-today">0</b><small>hari ini</small></div><div><b id="st-total">0</b><small>total</small></div><div><b id="st-best">0%</b><small>paling erat</small></div></div>
  <div class="meter"><p><span>📈 Kangen 7 hari terakhir</span><b id="st-week"></b></p><div class="week" id="week"></div></div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closePop()"><div class="pop" id="pop"></div></div>

<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const MODES = {
  peluk: { e: '🫂', n: 'Peluk', verb: 'pelukan', fl: ['🫂', '🤍', '💗'] },
  cium: { e: '😘', n: 'Cium', verb: 'ciuman', fl: ['💋', '😘', '💕'] },
  tangan: { e: '🤝', n: 'Genggam', verb: 'genggaman tangan', fl: ['🤝', '✨', '🤍'] },
  puk: { e: '🥺', n: 'Puk-puk', verb: 'puk-puk', fl: ['🫶', '🥺', '💗'] },
};
const LEVELS = [
  [0, 'Tipis-tipis', 'kangen dikit'], [20, 'Lumayan', 'kangen lumayan'], [40, 'Erat', 'kangen beneran'], [60, 'Erat banget', 'kangen parah'],
  [80, 'Ga mau lepas', 'kangen banget banget'], [100, 'MAKSIMAL 🔥', 'kangen sampai mau meledak'],
];
const FULL_MS = 5000;
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

let me = lsGet('kangen-me', 'Dara'), mode = lsGet('kangen-mode', 'peluk');
const other = () => me === 'Razan' ? 'Dara' : 'Razan';
function toggleWho() { me = other(); lsSet('kangen-me', me); paint(); }
function paint() {
  $('who').textContent = `🙋 ${me} ▾`; $('who').className = 'pill ' + me;
  $('to-name').textContent = other();
  $('modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button data-k="${k}" class="${k === mode ? 'on' : ''}">${m.e} ${m.n}</button>`).join('');
  $('modes').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.k; lsSet('kangen-mode', mode); paint(); });
  $('h-e').textContent = MODES[mode].e;
  stats();
}
function stats() {
  const log = lsGet('kangen-log', {}), t = ymd(new Date());
  const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
  $('st-today').textContent = sum(log[t]);
  $('st-total').textContent = Object.values(log).reduce((a, d) => a + sum(d), 0);
  $('st-best').textContent = lsGet('kangen-best', 0) + '%';
  const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push([ymd(d), d]); }
  const vals = days.map(([k]) => sum(log[k])), mx = Math.max(1, ...vals);
  $('week').innerHTML = days.map(([k, d], i) => `<div><i style="height:${Math.max(4, vals[i] / mx * 100)}%"></i><span>${['M', 'S', 'S', 'R', 'K', 'J', 'S'][d.getDay()]}</span></div>`).join('');
  $('st-week').textContent = `${vals.reduce((a, b) => a + b, 0)}x`;
}
function lvlOf(p) { let l = LEVELS[0]; for (const x of LEVELS) if (p >= x[0]) l = x; return l; }

/* ── tahan ── */
let holding = false, t0 = 0, raf = 0, pct = 0, lastBuzz = 0, lastFl = 0;
const heart = $('heart');
heart.addEventListener('pointerdown', e => { e.preventDefault(); if (holding) return; holding = true; t0 = performance.now(); try { heart.setPointerCapture(e.pointerId); } catch (x) {} heart.classList.add('hold'); $('h-t').textContent = 'TERUS…'; loop(); });
['pointerup', 'pointercancel'].forEach(ev => heart.addEventListener(ev, release));
heart.addEventListener('contextmenu', e => e.preventDefault());
function loop() {
  if (!holding) return;
  const now = performance.now();
  pct = Math.min(100, Math.round((now - t0) / FULL_MS * 100));
  $('arc').style.strokeDashoffset = 289 * (1 - pct / 100);
  $('pct').textContent = pct + '%';
  const l = lvlOf(pct); $('lvl').textContent = `${MODES[mode].e} ${l[1]}`;
  const s = 1 + pct / 220; $('h-e').style.transform = `scale(${s})`;
  heart.style.setProperty('--s', (pct / 40).toFixed(1));
  document.body.style.setProperty('--glow', (.18 + pct / 250).toFixed(2));
  const gap = 260 - pct * 2;
  if (now - lastBuzz > gap) { lastBuzz = now; vib(Math.min(40, 8 + pct / 4)); }
  if (now - lastFl > 220 - pct) { lastFl = now; floaty(); }
  raf = requestAnimationFrame(loop);
}
function floaty() {
  const r = heart.getBoundingClientRect(), el = document.createElement('div'), f = MODES[mode].fl;
  el.className = 'fl'; el.textContent = f[Math.floor(Math.random() * f.length)];
  el.style.left = (r.left + r.width / 2 - 11 + (Math.random() - .5) * r.width * .6) + 'px'; el.style.top = (r.top + r.height * .3) + 'px';
  el.style.setProperty('--dx', (Math.random() - .5) * 160 + 'px');
  document.body.appendChild(el); setTimeout(() => el.remove(), 1900);
}
function release() {
  if (!holding) return; holding = false; cancelAnimationFrame(raf);
  heart.classList.remove('hold'); $('h-t').textContent = 'TAHAN'; $('h-e').style.transform = '';
  const p = pct; pct = 0;
  setTimeout(() => { $('arc').style.transition = 'stroke-dashoffset .5s'; $('arc').style.strokeDashoffset = 289; document.body.style.setProperty('--glow', .18); setTimeout(() => $('arc').style.transition = '', 520); }, 50);
  if (p < 8) { $('pct').textContent = ''; $('lvl').textContent = 'Kurang lama 😆 Tahan lebih lama ya'; vib(15); return; }
  send(p);
}
function send(p) {
  const m = MODES[mode], l = lvlOf(p), t = ymd(new Date());
  const log = lsGet('kangen-log', {}); log[t] = log[t] || {}; log[t][mode] = (log[t][mode] || 0) + 1;
  // simpen 60 hari terakhir aja
  const keys = Object.keys(log).sort(); while (keys.length > 60) delete log[keys.shift()];
  lsSet('kangen-log', log);
  const best = lsGet('kangen-best', 0); const nb = p > best; if (nb) lsSet('kangen-best', p);
  stats();
  const msg = `${m.e} ${me} ngirim ${m.verb} virtual ${p}% erat!\nLevel: ${l[1]} — ${l[2]} sama kamu 🥺\n(dari Tombol Kangen)`;
  $('pop').innerHTML = `<span class="e">${m.e}</span><p class="t hand">${m.verb[0].toUpperCase() + m.verb.slice(1)} ${p}% erat!</p>
    <p class="s">${l[1]} — ${l[2]}.${nb ? '<br>🏆 Rekor baru paling erat!' : ''}<br>Hari ini udah ${Object.values(log[t]).reduce((a, b) => a + b, 0)}x kangen.</p>
    <a class="wa" href="https://wa.me/${WA[other()]}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" onclick="setTimeout(closePop,400)">💬 Kirim ke ${other()}</a>
    <button class="close" onclick="closePop()">Simpen aja dulu</button>`;
  $('ov').classList.add('show');
  vib(p >= 100 ? [60, 40, 60, 40, 200] : [30, 40, 60]);
  if (p >= 100) for (let i = 0; i < 24; i++) setTimeout(floaty, i * 40);
  $('pct').textContent = ''; $('lvl').textContent = 'Tahan tombolnya — makin lama, makin erat';
}
function closePop() { $('ov').classList.remove('show'); }
paint();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
</body>
</html>
