    `<div class="kr"><span class="sp"></span>${[...KR[1]].map(k => `<button data-k="${k}" class="${st[k] != null ? 's' + st[k] : ''}">${k}</button>`).join('')}<span class="sp"></span></div>` +
    `<div class="kr"><button class="w" data-k="enter">Enter</button>${[...KR[2]].map(k => `<button data-k="${k}" class="${st[k] != null ? 's' + st[k] : ''}">${k}</button>`).join('')}<button class="w" data-k="del" aria-label="Hapus">⌫</button></div>`;
}
function shake() { const el = $('board').querySelector(`[data-r="${me0().g.length}"]`); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } vib([30, 30, 30]); }
function key(k) {
  const r = me0(); if (r.done || busy) return;
  if (k === 'del') { cur = cur.slice(0, -1); confirmW = ''; paintBoard(); return; }
  if (k === 'enter') return submit();
  if (/^[a-z]$/.test(k) && cur.length < 5) { cur += k; vib(5); paintBoard(); }
}
function submit() {
  const r = me0();
  if (cur.length < 5) { shake(); toast('Kurang hurufnya — harus 5 😉'); return; }
  if (!WSET.has(cur) && confirmW !== cur) { confirmW = cur; shake(); toast(`“${cur.toUpperCase()}” ga ada di kamus Razara — tekan Enter lagi kalau yakin`, 3200); return; }
  confirmW = '';
  const g = r.g.concat(cur), ok = cur === ANS, done = ok || g.length >= 6;
  const nr = { g, done: done ? 1 : 0, ok: ok ? 1 : 0, t0: r.t0 || Date.now(), t1: done ? Date.now() : 0 };
  save(nr); cur = ''; busy = true;
  paintBoard(g.length - 1); paintKb();
  setTimeout(() => {
    busy = false;
    if (done) {
      if (ok) { confetti(60); vib([30, 40, 30, 40, 80]); } else vib(60);
      const o = rowOf(OT, TD);
      const body = o && o.done ? verdictTxt() : 'Giliran kamu — bisa lebih cepet ga? 😏';
      try { window.Push && Push.notify({ title: `🟩 ${ME} selesai Tebak Kata (${ok ? g.length : 'X'}/6)`, body, url: 'tebak-kata-harian.html', tag: 'ajak-kata' }); } catch (e) {}
    }
    render();
  }, 5 * 120 + 380);
}
// ── hasil ──
const nOf = r => r && r.done ? (r.ok ? r.g.length : 7) : null;   // 7 = gagal
function winnerOf(d) { const a = rowOf('Razan', d), b = rowOf('Dara', d), x = nOf(a), y = nOf(b); if (x == null || y == null) return null; if (x === y) return 'seri'; return x < y ? 'Razan' : 'Dara'; }
function verdictTxt() { const w = winnerOf(TD); return w === 'seri' ? 'Seri hari ini 🤝' : w ? `${w} menang hari ini 🏆` : ''; }
function paintRes() {
  const r = me0(), o = rowOf(OT, TD);
  if (!r.done) { $('res').innerHTML = ''; return; }
  const n = r.ok ? r.g.length : 'X';
  let h = `<div class="res" data-noskor><h3>${r.ok ? ['', '🤯 Langsung ketebak!', '🔥 Jago banget!', '🎉 Mantap!', '😊 Ketebak!', '😅 Hampir aja!', '😮‍💨 Fiuh, ketebak!'][r.g.length] : '😢 Belum ketebak'}</h3>`;
  h += `<p>Jawabannya</p><span class="ans">${ANS}</span><div class="grid">${gridOf(r.g, ANS)}</div><p>${n}/6</p>`;
  const share = `🟩 Tebak Kata Razara ${new Date().getDate()} ${BLN[new Date().getMonth()]} — ${n}/6\n${gridOf(r.g, ANS)}`;
  h += `<div class="row"><a class="btn wa" href="${waLink(OT, share)}" target="_blank" rel="noopener">💬 Pamer ke ${OT}</a></div>`;
  h += `<div class="ot">`;
  if (!o || !o.g || !o.g.length) h += `<b>${OT} belum main hari ini</b><small>Kalau dia main, hasilnya muncul di sini</small><button data-colek="1">👉 Colek ${OT}</button>`;
  else if (!o.done) h += `<b>${OT} lagi main (${o.g.length}/6)</b><small>Tunggu dia selesai buat liat siapa yang menang 👀</small>`;
  else { const w = winnerOf(TD); h += `<b>${OT}: ${o.ok ? o.g.length : 'X'}/6</b><div class="grid">${gridOf(o.g, ANS)}</div><div class="win">${w === 'seri' ? '🤝 Seri hari ini!' : w === ME ? '🏆 Kamu menang hari ini!' : `🏆 ${OT} menang hari ini!`}</div>`; }
  h += `</div><p class="nx" id="nx"></p></div>`;
  $('res').innerHTML = h; tick();
  // 🏆 catet ke Liga: cuma HP pemenangnya yang nyatet, sekali per hari
  const w = winnerOf(TD); if (w === ME) { const S = lsGet('katah-sk', {}) || {}; if (!S[TD]) { S[TD] = 1; lsSet('katah-sk', S); try { window.Skor && Skor.add('tebak-kata-harian', ME); } catch (e) {} } }
}
function tick() { const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n, s = Math.floor(t / 1000); const el = $('nx'); if (el) el.textContent = `⏳ Kata baru dalam ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; }
setInterval(() => { tick(); if (ymd(new Date()) !== TD && !document.hidden) location.reload(); }, 1000);
function paintVs() {
  $('vs').innerHTML = WHO.map(w => { const r = rowOf(w, TD), mine = w === ME; let t = 'belum main';
    if (r && r.done) t = mine || me0().done ? `selesai ${r.ok ? r.g.length : 'X'}/6` : 'udah selesai 🤫'; else if (r && r.g && r.g.length) t = `lagi main · ${r.g.length}/6`;
    return `<div style="--c:${COL[w]}"><b>${mine ? 'Kamu' : w}</b><br>${t}</div>`; }).join('');
}
function paintStats() {
  const S = {}; WHO.forEach(w => { const R = rows(w), ds = Object.keys(R).filter(d => /^\d{4}-/.test(d) && R[d] && R[d].done).sort(); const dist = [0, 0, 0, 0, 0, 0]; let ok = 0; ds.forEach(d => { if (R[d].ok) { ok++; dist[R[d].g.length - 1]++; } }); let st = 0; const x = new Date(); if (!(R[ymd(x)] && R[ymd(x)].ok)) x.setDate(x.getDate() - 1); while (R[ymd(x)] && R[ymd(x)].ok) { st++; x.setDate(x.getDate() - 1); } S[w] = { n: ds.length, ok, dist, st }; });
  const days = new Set(); WHO.forEach(w => Object.keys(rows(w)).forEach(d => { if (/^\d{4}-/.test(d)) days.add(d); }));
  const won = { Razan: 0, Dara: 0, seri: 0 }; days.forEach(d => { const w = winnerOf(d); if (w) won[w]++; });
  const m = S[ME], mx = Math.max(1, ...m.dist);
  let h = `<p class="sec">📊 Statistik kamu</p><div class="st4"><div><b>${m.n}</b><small>main</small></div><div><b>${m.n ? Math.round(m.ok / m.n * 100) : 0}%</b><small>ketebak</small></div><div><b>🔥 ${m.st}</b><small>streak</small></div><div><b>${won[ME]}</b><small>menang lawan ${OT}</small></div></div>`;
  h += `<div class="dist">${m.dist.map((c, i) => `<div><span style="width:12px">${i + 1}</span><i class="${me0().done && me0().ok && me0().g.length === i + 1 ? 'me' : ''}" style="width:${Math.max(8, c / mx * 100)}%">${c}</i></div>`).join('')}</div>`;
  h += `<p class="sec">⚔️ Razan vs Dara</p><div class="st4" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><b style="color:var(--rz)">${won.Razan}</b><small>Razan menang</small></div><div><b>${won.seri}</b><small>seri</small></div><div><b style="color:var(--dr)">${won.Dara}</b><small>Dara menang</small></div></div>`;
  const past = [...days].filter(d => d < TD).sort().reverse().slice(0, 7);
  if (past.length) h += `<p class="sec">🕰️ Hari-hari sebelumnya</p><div class="hist">${past.map(d => { const a = rowOf(ME, d), b = rowOf(OT, d), w = winnerOf(d), dt = parseYMD(d); const f = r => r && r.done ? (r.ok ? r.g.length : 'X') + '/6' : '–'; return `<div><span><span class="w">${ansOf(d)}</span><br><small>${dt.getDate()} ${BLN[dt.getMonth()]} · kamu ${f(a)} · ${OT} ${f(b)}</small></span><small>${w === 'seri' ? '🤝' : w ? (w === ME ? '🏆 kamu' : '🏆 ' + w) : ''}</small></div>`; }).join('')}</div>`;
  $('stats').innerHTML = h;
}
function render() { paintVs(); paintBoard(); paintKb(); paintRes(); paintStats(); try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {} }
$('kb').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); });
document.addEventListener('keydown', e => { if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key.toLowerCase(); if (k === 'enter') { e.preventDefault(); key('enter'); } else if (k === 'backspace') key('del'); else if (/^[a-z]$/.test(k)) key(k); });
document.addEventListener('click', e => { if (e.target.closest('[data-colek]')) { const k = 'katah-colek-' + TD, n = lsGet(k, 0); if (n >= 2) return toast('Udah dicolek — sabar ya 😆'); lsSet(k, n + 1); try { window.Push && Push.notify({ title: `🟩 ${ME} udah selesai Tebak Kata hari ini`, body: `${ME} udah selesai hari ini — kamu bisa lebih cepet ga? 🟩`, url: 'tebak-kata-harian.html', tag: 'ajak-kata-c' }); } catch (x) {} vib(15); toast(`👉 ${OT} udah dicolek`); } });
BD.on(ev => { if (!ev.apps || !ev.apps.length || ev.apps.includes('katah')) { if (!busy) { paintVs(); paintRes(); paintStats(); } } });
try { BD.fast && BD.fast(30e3); } catch (e) {}
render();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
