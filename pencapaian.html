<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pencapaian Kita — Razan & Dara 🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 40% at 50% 10%,rgba(201,169,110,.3),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(232,196,176,.4),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .hero{text-align:center;margin:1rem 0 .8rem}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .2rem}
  .title span{color:var(--gold)}
  .lvl{background:linear-gradient(135deg,#fffaf0,#f6e3b8);border:1px solid #e9d3a6;border-radius:22px;padding:1rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 8px 24px rgba(167,131,74,.15)}
  .lvl .ic{font-size:2.6rem;width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(167,131,74,.25);flex-shrink:0}
  .lvl .b{flex:1;min-width:0}
  .lvl small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a7834a;font-weight:600}
  .lvl h2{font-size:1.15rem;font-weight:700;color:var(--deep);line-height:1.2}
  .lvl .bar{height:9px;border-radius:9px;background:rgba(167,131,74,.18);overflow:hidden;margin:.45rem 0 .25rem}
  .lvl .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#d6b77c,#a7834a);transition:width 1s}
  .lvl p{font-size:11px;color:var(--muted)}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:1.3rem 0 .5rem}
  .almost{display:flex;flex-direction:column;gap:.45rem}
  .al{display:flex;align-items:center;gap:.7rem;background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:14px;padding:.6rem .8rem;text-decoration:none;color:inherit}
  .al .e{font-size:1.4rem;width:30px;text-align:center}
  .al .b{flex:1;min-width:0}
  .al b{font-size:12.5px;font-weight:600;display:block}
  .al small{font-size:10.5px;color:var(--muted)}
  .al .pb{height:5px;border-radius:5px;background:rgba(193,122,111,.15);margin-top:.3rem;overflow:hidden}
  .al .pb i{display:block;height:100%;background:var(--rose);border-radius:5px}
  .tabs{display:flex;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.15);border-radius:50px;padding:3px;margin:1.2rem 0 .7rem}
  .tabs button{flex:1;border:none;background:none;border-radius:50px;padding:.5rem .3rem;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--deep);color:#fff;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
  .bd{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:18px;padding:.8rem .7rem .7rem;text-align:center;text-decoration:none;color:inherit;position:relative;display:flex;flex-direction:column;align-items:center}
  .bd .medal{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#fff7e0,#f0d699 60%,#c9a96e);box-shadow:0 4px 10px rgba(167,131,74,.3),inset 0 0 0 3px rgba(255,255,255,.6);margin-bottom:.4rem}
  .bd.lock .medal{background:#efe8e0;box-shadow:inset 0 0 0 2px #e3d8cc;filter:grayscale(1);opacity:.55}
  .bd b{font-size:12px;font-weight:600;line-height:1.3}
  .bd small{font-size:10px;color:var(--muted);line-height:1.4;margin-top:.15rem}
  .bd .pb{width:100%;height:5px;border-radius:5px;background:rgba(193,122,111,.13);margin-top:.45rem;overflow:hidden}
  .bd .pb i{display:block;height:100%;background:var(--rose);border-radius:5px}
  .bd .pn{font-size:9.5px;color:var(--muted);margin-top:.2rem}
  .bd .new{position:absolute;top:6px;right:6px;font-size:8.5px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--rose);padding:1px 6px;border-radius:10px}
  .bd.got{border-color:#e9d3a6}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1.2rem}
  .ov.show{display:flex}
  .pop{width:100%;max-width:330px;background:var(--cream);border-radius:24px;padding:1.5rem 1.2rem 1.1rem;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .pop .medal{width:86px;height:86px;margin:0 auto .6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.7rem;background:radial-gradient(circle at 35% 30%,#fff7e0,#f0d699 60%,#c9a96e);box-shadow:0 6px 16px rgba(167,131,74,.4),inset 0 0 0 4px rgba(255,255,255,.6);animation:shine 1.6s ease-in-out infinite alternate}
  @keyframes shine{from{filter:brightness(1)}to{filter:brightness(1.15)}}
  .pop small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .pop h3{font-size:1.2rem;font-weight:700;margin:.2rem 0}
  .pop p{font-size:12.5px;color:var(--muted);line-height:1.6}
  .pop button{margin-top:1rem;width:100%;padding:.85rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d6b77c,#a7834a);cursor:pointer}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.grid{gap:.45rem}.bd{padding:.7rem .5rem .6rem}}
</style>
<script src="sfx.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span></span></div>
  <div class="hero"><p class="lbl">Razan & Dara</p><h1 class="title">Pencapaian <span>Kita</span> 🏆</h1></div>
  <div class="lvl" id="lvl"></div>
  <div id="almost-wrap"><p class="sec">🔥 Dikit lagi kebuka</p><div class="almost" id="almost"></div></div>
  <div class="tabs" id="tabs"><button data-v="all" class="on">Semua</button><button data-v="got">Udah dapet</button><button data-v="lock">Belum</button></div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)nextPop()"><div class="pop" id="pop"></div></div>

<script>
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function g(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const len = v => Array.isArray(v) ? v.length : v && typeof v === 'object' ? Object.keys(v).length : 0;
const daysTogether = () => { const [y, m, d] = JADIAN.split('-').map(Number), n = new Date(); return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(y, m - 1, d)) / 864e5); };
function bucket() { const m = new Map(); (g('bl-cache', []) || []).forEach(x => x && m.set(x.id, x)); (g('bl-queue', []) || []).forEach(x => x && m.set(x.id, x)); return [...m.values()].filter(x => !x.deleted); }
const sumObj = o => Object.values(o || {}).reduce((a, d) => a + (typeof d === 'number' ? d : Object.values(d || {}).reduce((x, y) => x + (+y || 0), 0)), 0);

// [id, emoji, nama, keterangan, link, () => [sekarang, target]]
const BADGES = [
  ['d100', '💯', '100 Hari', 'Bareng 100 hari', 'index.html', () => [daysTogether(), 100]],
  ['d365', '💍', 'Satu Tahun', 'Bareng 365 hari', 'index.html', () => [daysTogether(), 365]],
  ['d500', '🏆', '500 Hari', 'Bareng 500 hari', 'index.html', () => [daysTogether(), 500]],
  ['d1000', '👑', '1000 Hari', 'Bareng 1000 hari', 'index.html', () => [daysTogether(), 1000]],
  ['jar', '🫙', 'Pembuka Toples', 'Buka semua 34 gulungan Memory Jar', 'jar-of-reasons.html', () => [len((g('memory-jar-dara', {}) || {}).drawn), 34]],
  ['star', '🌠', 'Penangkap Bintang', 'Tangkep 25 bintang jatuh', 'bintang-jatuh.html', () => [len(g('bintang-jatuh', [])), 25]],
  ['dip', '📦', 'Pembongkar Kotak', 'Buka 32 kotak Lucky Dip', 'lucky-dip.html', () => [(g('ld_opened', []) || []).filter(Boolean).length, 32]],
  ['cloud', '☁️', 'Pengumpul Harapan', 'Buka 20 awan Cloud Wishes', 'cloud-wishes.html', () => [len(g('cloud-wishes-opened', [])), 20]],
  ['ow', '💌', 'Pembaca Surat', 'Buka 8 surat Open When', 'open-when.html', () => [len(g('openwhen-log', {})), 8]],
  ['pol', '📸', 'Kolektor Momen', 'Liat 12 polaroid', 'polaroid-wall.html', () => [len(g('polaroid-seen', [])), 12]],
  ['radio', '📻', 'Pendengar Setia', 'Dengerin 6 siaran Radio Razan', 'radio-razan.html', () => [len(g('radio-razan-played', [])), 6]],
  ['hk', '👀', 'Peka Detail', 'Jawab 30 Hal Kecil', 'hal-kecil.html', () => [len(g('halkecil-react', {})), 30]],
  ['bunga', '🌸', 'Tukang Kebun', 'Mekarin 6 bunga', 'taman-bunga.html', () => [Object.values(g('taman-bunga-dara', {}) || {}).filter(f => f && f.stage >= 3).length, 6]],
  ['quest', '⚔️', 'Petualang Cinta', 'Kerjain daily quest di 7 hari berbeda', 'love-quest.html', () => [Object.values((g('lq-v2', {}) || {}).daily || {}).filter(a => a && a.length).length, 7]],
  ['tiket', '🎟️', 'Tiket Pertama', 'Tukar satu Tiket Baikan', 'kupon-maaf.html', () => [len(g('usedVouchers-dara', [])), 1]],
  ['damai', '🕊️', 'Juru Damai', 'Tanda tangan Perjanjian Damai', 'kupon-maaf.html', () => [len(g('baikan-damai', [])), 1]],
  ['maafin', '🥺', 'Hati Seluas Samudra', 'Pencet "Iya" di Maafin aku ga?', 'kupon-maaf.html', () => [+g('baikan-maafin', 0) || 0, 1]],
  ['qa', '💬', 'Rajin Jawab', 'Jawab 7 Pertanyaan Sehari', 'pertanyaan-harian.html', () => [((g('qa-cache', {}) || {}).days || []).filter(d => d && d.mine).length, 7]],
  ['qa30', '🗣️', 'Ga Ada Rahasia', 'Jawab 30 Pertanyaan Sehari', 'pertanyaan-harian.html', () => [((g('qa-cache', {}) || {}).days || []).filter(d => d && d.mine).length, 30]],
  ['kapsul', '⏳', 'Penjaga Waktu', 'Punya satu Kapsul Waktu', 'kapsul-waktu.html', () => [len(g('kapsul-cache', [])), 1]],
  ['bl10', '🪣', 'Pemimpi', 'Punya 10 impian di Bucket List', 'bucket-list.html', () => [bucket().length, 10]],
  ['bl1', '✅', 'Pewujud Mimpi', 'Centang 1 impian Bucket List', 'bucket-list.html', () => [bucket().filter(x => x.done).length, 1]],
  ['bl5', '🌟', 'Mimpi Jadi Nyata', 'Centang 5 impian Bucket List', 'bucket-list.html', () => [bucket().filter(x => x.done).length, 5]],
  ['hitung', '⏰', 'Sabar Nunggu', 'Buka 7 kotak Hitung Mundur', 'hitung-ketemu.html', () => [len(g('hk-opened', {})), 7]],
  ['kangen', '🫂', 'Tukang Kangen', 'Kirim 50 kangen', 'tombol-kangen.html', () => [sumObj(g('kangen-log', {})), 50]],
  ['peluk', '🔥', 'Peluk Maksimal', 'Tahan Tombol Kangen sampai 100%', 'tombol-kangen.html', () => [+g('kangen-best', 0) || 0, 100]],
  ['ramal', '🔮', 'Percaya Bintang', 'Buka Ramalan Cinta 7 hari', 'ramalan-cinta.html', () => [len(g('ramalan-seen', {})), 7]],
  ['gosok', '🪙', 'Tangan Hoki', 'Gosok 7 kartu', 'gosok-hadiah.html', () => [Object.values(g('gosok-hist', {}) || {}).filter(x => x && x.s).length, 7]],
  ['jackpot', '💰', 'JACKPOT!', 'Dapet jackpot di Gosok Berhadiah', 'gosok-hadiah.html', () => [Object.values(g('gosok-hist', {}) || {}).filter(x => x && x.s && x.i >= 21).length, 1]],
  ['musik', '🎶', 'Penikmat Musik', 'Dengerin Kotak Musik sampai habis', 'kotak-musik.html', () => [+g('musik-plays', 0) || 0, 1]],
  ['rapor', '📝', 'Wali Kelas', 'Terbitin Rapor Razan', 'rapor-razan.html', () => [len(g('rapor-hist', [])), 1]],
  ['kode', '🕵️', 'Agen Rahasia', 'Pecahin 3 Kode Rahasia', 'kode-rahasia.html', () => [+g('kode-read', 0) || 0, 3]],
  ['kartu', '💌', 'Tukang Pos Cinta', 'Kirim 3 Kartu Ucapan', 'kartu-ucapan.html', () => [len(g('kartu-sent', [])), 3]],
  ['lampion', '🏮', 'Langit Penuh Harapan', 'Lepas 10 lampion', 'lampion-harapan.html', () => [len(g('lampion', [])), 10]],
  ['lilin', '🎂', 'Tukang Tiup', 'Tiup lilin sampai padam', 'tiup-lilin.html', () => [+g('lilin-count', 0) || 0, 1]],
  ['tl', '🗺️', 'Pencatat Sejarah', 'Tambahin 3 momen di Timeline', 'timeline-kita.html', () => [len(g('tl-custom', [])), 3]],
  ['pb', '📷', 'Fotogenik', 'Bikin 3 foto di Photobooth', 'photobooth.html', () => [+g('pb-count', 0) || 0, 3]],
  ['c4', '🔵', 'Otak Encer', 'Kalahin komputer Jago di Empat Sejajar', 'empat-sejajar.html', () => [((g('c4-record', {}) || {}).beat || [])[2] || 0, 1]],
  ['bs', '⚓', 'Laksamana', 'Menang Perang Kapal lawan komputer', 'perang-kapal.html', () => [((g('bs-record', {}) || {}).beat || []).reduce((a, b) => a + (+b || 0), 0), 1]],
  ['dam', '♛', 'Raja Dam', 'Kalahin komputer Jago di Dam', 'dam.html', () => [((g('dam-record', {}) || {}).beat || [])[2] || 0, 1]],
  ['pz', '🧩', 'Puzzle Master', 'Selesaiin puzzle 4×4', 'puzzle-foto.html', () => [(g('pz-best', {}) || {})['4'] || (g('pz-best', {}) || {})['5'] ? 1 : 0, 1]],
  ['tk', '🧠', 'Ingetan Gajah', 'Dapet 70+ poin di Tebak Kenangan', 'tebak-kenangan.html', () => [Math.max(0, ...Object.values(g('tk-best', {}) || {}).map(Number).filter(n => !isNaN(n))), 70]],
];
const LEVELS = [[0, '🌱', 'Pasangan Baru'], [5, '🌷', 'Pasangan Manis'], [12, '💞', 'Pasangan Kompak'], [20, '🌟', 'Couple Goals'], [30, '🏆', 'Pasangan Legendaris'], [40, '💫', 'Soulmate Sejati']];

function calc() { return BADGES.map(([id, e, n, d, link, f]) => { let c = 0, t = 1; try { [c, t] = f(); } catch (x) {} c = Math.max(0, +c || 0); return { id, e, n, d, link, c: Math.min(c, t), t, got: c >= t }; }); }
let tab = 'all', queue = [];
function render() {
  const all = calc(), got = all.filter(b => b.got), seen = g('ach-seen', null);
  // pertama kali buka: semua yang udah kebuka dianggap "udah diliat" tapi tetep dirayain sekali
  const seenSet = new Set(seen || []);
  const fresh = got.filter(b => !seenSet.has(b.id));
  let L = LEVELS[0], nx = null; LEVELS.forEach((l, i) => { if (got.length >= l[0]) { L = l; nx = LEVELS[i + 1] || null; } });
  const prog = nx ? (got.length - L[0]) / (nx[0] - L[0]) : 1;
  $('lvl').innerHTML = `<span class="ic">${L[1]}</span><div class="b"><small>Level pasangan</small><h2>${L[2]}</h2><div class="bar"><i style="width:${Math.round(prog * 100)}%"></i></div><p>${got.length} dari ${all.length} lencana${nx ? ` · ${nx[0] - got.length} lagi ke ${nx[2]} ${nx[1]}` : ' · level tertinggi! 💫'}</p></div>`;
  const almost = all.filter(b => !b.got && b.c > 0).sort((a, b) => b.c / b.t - a.c / a.t).slice(0, 3);
  $('almost-wrap').style.display = almost.length ? '' : 'none';
  $('almost').innerHTML = almost.map(b => `<a class="al" href="${b.link}"><span class="e">${b.e}</span><div class="b"><b>${b.n}</b><small>${b.d} · ${b.c}/${b.t}</small><div class="pb"><i style="width:${b.c / b.t * 100}%"></i></div></div>›</a>`).join('');
  document.querySelectorAll('#tabs button').forEach(x => { x.classList.toggle('on', x.dataset.v === tab); if (x.dataset.v === 'got') x.textContent = `Udah dapet (${got.length})`; if (x.dataset.v === 'lock') x.textContent = `Belum (${all.length - got.length})`; });
  const list = all.filter(b => tab === 'all' || (tab === 'got' ? b.got : !b.got)).sort((a, b) => (b.got - a.got) || (b.c / b.t - a.c / a.t));
  $('grid').innerHTML = list.map(b => `<a class="bd ${b.got ? 'got' : 'lock'}" href="${b.link}">${b.got && !seenSet.has(b.id) ? '<span class="new">BARU</span>' : ''}<span class="medal">${b.e}</span><b>${b.n}</b><small>${b.d}</small>${b.got ? '' : `<div class="pb"><i style="width:${b.c / b.t * 100}%"></i></div><span class="pn">${b.c}/${b.t}</span>`}</a>`).join('');
  if (fresh.length) { queue = fresh.slice(0, 5); lsSet('ach-seen', got.map(b => b.id)); if (seen === null && fresh.length > 3) queue = [{ id: 'all', e: L[1], n: `${fresh.length} lencana langsung kebuka!`, d: 'Ternyata kalian udah ngelakuin banyak hal bareng 🥹' }]; nextPop(); }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.v; render(); });
function nextPop() {
  if (!queue.length) { $('ov').classList.remove('show'); return; }
  const b = queue.shift();
  $('pop').innerHTML = `<div class="medal">${b.e}</div><small>Lencana baru kebuka!</small><h3>${b.n}</h3><p>${b.d}</p><button onclick="nextPop()">${queue.length ? 'Lanjut ✨' : 'Yeay! 🎉'}</button>`;
  $('ov').classList.add('show'); confetti(); try { navigator.vibrate && navigator.vibrate([30, 40, 80]); } catch (e) {}
}
function confetti() {
  const colors = ['#c9a96e', '#f0d699', '#c17a6f', '#fff', '#b5c4b1'];
  for (let i = 0; i < 60; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 16);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
render();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
