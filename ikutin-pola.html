<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Ikutin Pola — Razan & Dara 🚦</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .scr{display:none}.scr.on{display:block}
  .pk{text-align:center;padding-top:.6rem}
  .pk .ico{font-size:3.4rem;display:block;line-height:1.1;animation:gkB 2.6s ease-in-out infinite}
  @keyframes gkB{50%{transform:translateY(-6px) rotate(-4deg)}}
  .panel{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:.9rem;margin-top:.8rem;text-align:left}
  .panel h3{font-size:12.5px;font-weight:600;margin-bottom:.5rem;color:var(--deep)}
  .bot-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
  .bot-row button{padding:.75rem .3rem;border-radius:50px;border:none;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
  .bot-row .r{background:linear-gradient(135deg,#7eb3f5,#4a7fc1)}.bot-row .d{background:linear-gradient(135deg,#f0a39a,#d9776b)}
  .rec{font-size:11.5px;color:var(--muted);text-align:center;margin-top:.9rem;line-height:1.7}
  .how{margin-top:.8rem;text-align:left;background:rgba(255,255,255,.7);border-radius:16px;padding:.7rem .9rem;font-size:12px;color:var(--muted)}
  .how summary{cursor:pointer;font-weight:600;color:var(--deep)}
  .how ul{margin:.5rem 0 0 1rem;line-height:1.6}
  .sb{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.2rem 0 .6rem}
  .sb .p{flex:1;min-width:0;display:flex;align-items:center;gap:.45rem;padding:.5rem .7rem;border-radius:16px;background:#fff;border:2px solid transparent;transition:.2s}
  .sb .p.R{justify-content:flex-start}.sb .p.D{justify-content:flex-end;text-align:right}
  .sb .p b{font-size:1.3rem;font-weight:700}
  .sb .p small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb .p.R b{color:var(--rz)}.sb .p.D b{color:var(--dr)}
  .sb .p.R.now{border-color:var(--rz);box-shadow:0 4px 14px rgba(74,127,193,.2)}
  .sb .p.D.now{border-color:var(--dr);box-shadow:0 4px 14px rgba(217,119,107,.2)}
  .msg{text-align:center;font-size:12.5px;color:var(--muted);min-height:1.4em;margin-bottom:.5rem}
  .res{text-align:center}
  .res .e{font-size:3.4rem;display:block}
  .res h2{font-size:1.4rem;font-weight:700;margin:.3rem 0}
  .res h2.Razan{color:var(--rz)}.res h2.Dara{color:var(--dr)}
  .res p{font-size:12.5px;color:var(--muted)}
  .res .box{background:var(--warm);border-radius:16px;padding:.75rem .9rem;margin:.8rem 0 .2rem;font-size:13px;line-height:1.55}
  .res .box small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.2rem}

  .pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(84vw,330px);aspect-ratio:1;margin:.6rem auto;position:relative;touch-action:manipulation}
  .pad{border:none;border-radius:28px;cursor:pointer;opacity:.55;transition:opacity .12s,transform .12s,box-shadow .12s;font-size:2rem;display:flex;align-items:center;justify-content:center}
  .pad:nth-child(1){background:#f27c8f;border-top-left-radius:50%}.pad:nth-child(2){background:#7eb3f5;border-top-right-radius:50%}
  .pad:nth-child(3){background:#f3c95a;border-bottom-left-radius:50%}.pad:nth-child(4){background:#8fd19e;border-bottom-right-radius:50%}
  .pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 30px rgba(255,255,255,.8),inset 0 0 20px rgba(255,255,255,.6)}
  .pads.lock .pad{pointer-events:none}
  .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .mid b{font-size:1.8rem;color:var(--deep);line-height:1}.mid small{font-size:10px;color:var(--muted)}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="menu-btn" style="display:none" onclick="quit()">☰ Menu game</button></div>
  <div class="scr on" id="s-pick"><div class="pk">
    <span class="ico">🚦</span><h1 class="title">Ikutin <span>Pola</span></h1>
    <p class="sub">Liat & dengerin urutan warnanya, terus ulangin persis sama. Tiap ronde nambah satu — sampai mana ingatan kamu? 🧠</p>
    <button class="btn" style="margin-top:.8rem" onclick="start('duo')">👫 Sambung pola berdua</button>
    <p class="rec" style="margin-top:.4rem">Gantian: ulangin pola, terus tambahin 1 warna buat pasangan. Yang salah duluan kalah!</p>
    <div class="panel"><h3>🙋 Main sendiri (komputer yang bikin pola)</h3><div class="bot-row"><button class="r" onclick="start('Razan')">Razan</button><button class="d" onclick="start('Dara')">Dara</button></div></div>
    <p class="rec" id="rec"></p>
  </div></div>
  <div class="scr" id="s-game">
    <div class="sb" id="sbx"><div class="p R" id="pR"><b>💙</b><small>Razan</small></div><div class="p D" id="pD"><small>Dara</small><b>💗</b></div></div>
    <p class="msg" id="msg"></p>
    <div class="pads lock" id="pads"><button class="pad" data-i="0"></button><button class="pad" data-i="1"></button><button class="pad" data-i="2"></button><button class="pad" data-i="3"></button><div class="mid"><b id="len">0</b><small>langkah</small></div></div>
  </div>
</div>

<div class="ov center" id="res-ov"><div class="sheet res">
  <span class="e" id="r-e">🏆</span><h2 id="r-t"></h2><p id="r-s"></p><div class="box" id="r-b"></div>
  <button class="btn" style="margin-top:.7rem" onclick="closeRes();again()">Main lagi 🔁</button>
  <button class="btn ghost" style="margin-top:.45rem" onclick="closeRes();toMenu()">Ke menu game</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const DEMANDS = ['Yang kalah kasih 1 pujian tulus ke yang menang 🥰', 'Yang kalah traktir jajan pas ketemu nanti 🍜', 'Yang kalah kirim foto selfie paling jelek sekarang 🤳😆',
  'Yang kalah kirim voice note nyanyi 1 lagu pendek 🎤', 'Yang kalah pilihin film buat ditonton bareng 🎬', 'Yang kalah kasih peluk paling lama pas ketemu 🫂',
  'Yang kalah harus nurut satu permintaan kecil 😏', 'Yang kalah pijitin pundak yang menang 5 menit 💆'];
const BOT_WIN = ['Komputernya lagi hoki aja 😤 Balas dendam yuk!', 'Nyaris! Coba sekali lagi 💪', 'Komputer: "hehe." 😆'];
function scr(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); const m = $('menu-btn'); if (m) m.style.display = id === 's-pick' ? 'none' : ''; }
function closeRes() { $('res-ov').classList.remove('show'); }
function confettiW(w) { confetti(80, w === 'Razan' ? ['#4a7fc1', '#7eb3f5', '#c9a96e', '#fff'] : ['#d9776b', '#f0a39a', '#c9a96e', '#fff']); }
// w = 'Razan' / 'Dara' / null (seri). bot = nama pihak komputer (atau null)
function showRes(w, sub, bot, level) {
  const humanWon = bot && w && w !== bot, botWon = bot && w === bot;
  $('r-e').textContent = !w ? '🤝' : botWon ? '🤖' : '🏆';
  $('r-t').className = w && !botWon ? w : '';
  $('r-t').textContent = !w ? 'Seri!' : botWon ? 'Komputer menang…' : bot ? 'Kamu menang! 🎉' : `${w} menang! 🎉`;
  $('r-s').textContent = sub || '';
  $('r-b').innerHTML = !w ? '<small>Seri berarti…</small>Dua-duanya saling kasih pujian 🥰'
    : bot ? `<small>${humanWon ? 'Keren!' : 'Semangat!'}</small>${humanWon ? (level < 2 ? 'Coba level yang lebih susah yuk 😏' : 'Komputer level paling susah pun kalah. Juara! 👑') : BOT_WIN[Math.floor(Math.random() * BOT_WIN.length)]}`
    : `<small>Tantangan buat ${w === 'Razan' ? 'Dara' : 'Razan'}</small>${DEMANDS[Math.floor(Math.random() * DEMANDS.length)]}`;
  setTimeout(() => { $('res-ov').classList.add('show'); if (w && !botWon) confettiW(w); try { window.SFX && SFX.play(botWon ? 'lose' : 'win'); } catch (e) {} }, 450);
}
function record(key, w, bot, level) {
  const r = lsGet(key, { Razan: 0, Dara: 0, seri: 0, beat: [0, 0, 0] });
  if (!bot) { if (w) r[w]++; else r.seri++; } else if (w && w !== bot) r.beat[level]++;
  lsSet(key, r); return r;
}
function recHTML(r) { return `Rekor berdua: <b style="color:var(--rz)">Razan ${r.Razan}</b> · <b style="color:var(--dr)">Dara ${r.Dara}</b>${r.seri ? ` · seri ${r.seri}` : ''}${r.beat.some(Boolean) ? `<br>Ngalahin komputer: ${['Santai', 'Sedang', 'Jago'].map((n, i) => `${n} ${r.beat[i]}x`).join(' · ')}` : ''}`; }

const FREQ = [329.6, 392, 261.6, 523.3];
let mode = null, seq = [], pos = 0, turn = 'Razan', phase = 'idle', over = true, AC = null, tmo = 0;
const recK = 'ip-rec';
function paintPick() { const r = lsGet(recK, { Razan: 0, Dara: 0, wR: 0, wD: 0 }); $('rec').innerHTML = `🧠 Rekor solo: <b style="color:var(--rz)">Razan ${r.Razan}</b> · <b style="color:var(--dr)">Dara ${r.Dara}</b>${r.wR + r.wD ? `<br>Menang sambung pola: Razan ${r.wR} · Dara ${r.wD}` : ''}`; }
function beep(i, ms) { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain(); o.type = 'triangle'; o.frequency.value = FREQ[i]; v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(.3, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000); o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + ms / 1000 + .05); } catch (e) {} }
const pads = () => document.querySelectorAll('.pad');
function lit(i, ms) { const p = pads()[i]; p.classList.add('lit'); beep(i, ms); setTimeout(() => p.classList.remove('lit'), ms * .85); }
function start(m) { mode = m; seq = []; over = false; turn = m === 'duo' ? (Math.random() < .5 ? 'Razan' : 'Dara') : m; $('sbx').style.display = m === 'duo' ? '' : 'none'; scr('s-game'); $('len').textContent = 0;
  if (m === 'duo') { phase = 'add'; lock(false); say(`${turn} mulai: tap 1 warna buat ngawalin pola 👆`); }
  else { setTimeout(() => { seq.push(r4()); playSeq(); }, 600); } }
function again() { start(mode); }
function quit() { if (!over && seq.length && !confirm('Udahan mainnya?')) return; toMenu(); }
function toMenu() { over = true; clearTimeout(tmo); scr('s-pick'); paintPick(); }
const r4 = () => Math.floor(Math.random() * 4);
function say(t) { $('msg').textContent = t; $('pR').classList.toggle('now', mode === 'duo' && turn === 'Razan'); $('pD').classList.toggle('now', mode === 'duo' && turn === 'Dara'); }
function lock(v) { $('pads').classList.toggle('lock', v); }
function playSeq() {
  phase = 'show'; lock(true); $('len').textContent = seq.length; say(mode === 'duo' ? `Perhatiin… (buat ${turn})` : 'Perhatiin polanya 👀');
  const sp = Math.max(260, 620 - seq.length * 22); let k = 0;
  const nx = () => { if (over) return; if (k < seq.length) { lit(seq[k++], sp * .8); tmo = setTimeout(nx, sp); } else { phase = 'rep'; pos = 0; lock(false); say(mode === 'duo' ? `${turn}, ulangin ${seq.length} warna 👆` : 'Giliran kamu — ulangin! 👆'); } };
  tmo = setTimeout(nx, 500);
}
document.querySelectorAll('.pad').forEach(p => p.addEventListener('pointerdown', e => { e.preventDefault(); tapPad(+p.dataset.i); }));
function tapPad(i) {
  if (over || phase === 'show' || phase === 'idle') return;
  lit(i, 260); vib(8);
  if (phase === 'add') { seq.push(i); $('len').textContent = seq.length; phase = 'idle'; lock(true); turn = turn === 'Razan' ? 'Dara' : 'Razan'; tmo = setTimeout(() => { say(`Sekarang ${turn} — HP-nya kasih ke ${turn} ya 📱`); tmo = setTimeout(playSeq, 1300); }, 500); return; }
  if (i !== seq[pos]) return fail(i);
  pos++;
  if (pos === seq.length) {
    lock(true); phase = 'idle';
    if (mode === 'duo') { say(`✅ Bener! ${turn}, tambahin 1 warna baru 👆`); phase = 'add'; lock(false); }
    else { say(`✅ Bener! ${seq.length} langkah`); try { window.SFX && SFX.play('coin'); } catch (e) {} seq.push(r4()); tmo = setTimeout(playSeq, 900); }
  }
}
function fail(i) {
  over = true; lock(true); phase = 'idle'; vib([80, 40, 80]); beep(0, 600); beep(2, 600);
  const pads0 = pads(); pads0[seq[pos]].classList.add('lit'); setTimeout(() => pads0[seq[pos]].classList.remove('lit'), 900);
  const r = lsGet(recK, { Razan: 0, Dara: 0, wR: 0, wD: 0 }), got = seq.length - 1;
  if (mode === 'duo') { const w = turn === 'Razan' ? 'Dara' : 'Razan'; r[w === 'Razan' ? 'wR' : 'wD']++; lsSet(recK, r); say(`❌ ${turn} salah di langkah ke-${pos + 1}!`); return showRes(w, `Polanya sampai ${seq.length} warna`, null, 0); }
  const best = got > r[mode]; if (best) { r[mode] = got; lsSet(recK, r); }
  say(`❌ Salah di langkah ke-${pos + 1}`);
  $('r-e').textContent = best ? '🏆' : '🧠'; $('r-t').className = mode; $('r-t').textContent = `${got} langkah`;
  $('r-s').textContent = best ? 'REKOR BARU! 🎉' : `Rekor kamu: ${r[mode]}`; $('r-b').innerHTML = `<small>Tantangan</small>Suruh ${mode === 'Razan' ? 'Dara' : 'Razan'} nyoba — bisa lebih dari ${got}? 😏`;
  setTimeout(() => { $('res-ov').classList.add('show'); try { window.SFX && SFX.play(best ? 'win' : 'lose'); } catch (e) {} if (best) confetti(50); }, 700);
}

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
