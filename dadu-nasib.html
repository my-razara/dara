<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dadu Nasib — Razan & Dara 🎲</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}
  html,body{min-height:100%;background:var(--cream);overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(232,196,176,.3),transparent 70%),radial-gradient(ellipse 50% 60% at 80% 80%,rgba(193,122,111,.15),transparent 70%);pointer-events:none;z-index:0}
  .page{max-width:480px;margin:0 auto;padding:0 1.25rem 4rem;position:relative;z-index:1}
  .screen{display:none}.screen.active{display:block}

  /* INTRO */
  #s-intro{text-align:center;padding:2.2rem 0 2rem}
  .intro-icon{font-size:4rem;display:block;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .intro-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.35rem}
  .intro-title{font-size:clamp(1.5rem,6vw,2rem);font-weight:700;color:var(--ink);margin-bottom:.35rem}
  .intro-title span{color:var(--rose)}
  .intro-sub{font-size:12.5px;color:var(--muted);line-height:1.75;max-width:300px;margin:.4rem auto 1.3rem}
  .filter-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:.6rem}
  .face-pills{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:1.3rem}
  .fp{display:flex;align-items:center;gap:.3rem;background:#fff;border:2px solid var(--blush);border-radius:50px;padding:.35rem .85rem;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
  .fp:active{transform:scale(.95)}
  .fp.sel{color:#fff;border-color:transparent}
  .fp-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  .fp.sel.f1{background:#c17a6f}.fp.sel.f2{background:#c9a96e}.fp.sel.f3{background:#b5c4b1;color:var(--ink)}.fp.sel.f4{background:#6a8ac0}.fp.sel.f5{background:#a050a0}.fp.sel.f6{background:#a01010}
  .fp.sel .fp-dot{background:rgba(255,255,255,.7)!important}
  .start-btn{width:100%;padding:.95rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--rose);color:#fff;box-shadow:0 4px 18px rgba(193,122,111,.4)}
  .start-btn:active{transform:scale(.97);background:var(--deep)}
  .ghost{width:100%;padding:.8rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-top:.55rem}

  /* GAME */
  #s-game{padding-top:1rem}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
  .ico-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;font-size:.95rem;position:relative}
  .ico-btn b{position:absolute;top:-4px;right:-4px;background:var(--rose);color:#fff;font-size:9px;border-radius:50px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .game-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .prog-row{display:flex;align-items:center;gap:.6rem;margin-bottom:1.3rem}
  .prog-txt{font-size:11px;color:var(--rose);font-weight:700;white-space:nowrap}
  .prog-wrap{flex:1;height:5px;background:var(--blush);border-radius:3px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(to right,var(--rose),var(--gold));border-radius:3px;transition:width .4s ease}

  .dice-scene{width:130px;height:130px;perspective:600px;margin:0 auto 1rem;cursor:pointer}
  .dice{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.75,.25,1)}
  .face{position:absolute;inset:0;background:#fff;border-radius:18px;border:2px solid var(--blush);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(45,31,26,.05);backface-visibility:hidden}
  .face:nth-child(1){transform:rotateY(0deg) translateZ(65px)}
  .face:nth-child(2){transform:rotateY(180deg) translateZ(65px)}
  .face:nth-child(3){transform:rotateY(90deg) translateZ(65px)}
  .face:nth-child(4){transform:rotateY(-90deg) translateZ(65px)}
  .face:nth-child(5){transform:rotateX(90deg) translateZ(65px)}
  .face:nth-child(6){transform:rotateX(-90deg) translateZ(65px)}
  .face:nth-child(6) .dot{background:#a01010}
  .dots{display:grid;padding:18px;width:100%;height:100%;gap:6px}
  .d1{place-items:center}
  .d2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .d2 .dot:nth-child(1){grid-column:2;grid-row:1;align-self:start;justify-self:end}
  .d2 .dot:nth-child(2){grid-column:1;grid-row:2;align-self:end;justify-self:start}
  .d3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
  .d3 .dot:nth-child(1){grid-column:3;grid-row:1}.d3 .dot:nth-child(2){grid-column:2;grid-row:2}.d3 .dot:nth-child(3){grid-column:1;grid-row:3}
  .d4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center}
  .d5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
  .d5 .dot:nth-child(1){grid-column:1;grid-row:1}.d5 .dot:nth-child(2){grid-column:3;grid-row:1}.d5 .dot:nth-child(3){grid-column:2;grid-row:2}.d5 .dot:nth-child(4){grid-column:1;grid-row:3}.d5 .dot:nth-child(5){grid-column:3;grid-row:3}
  .d6{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;place-items:center}
  .d2,.d3,.d5{place-items:center}
  .dot{width:17px;height:17px;border-radius:50%;background:var(--rose);box-shadow:0 2px 4px rgba(193,122,111,.3)}
  .dice-shadow{width:110px;height:16px;background:radial-gradient(ellipse,rgba(45,31,26,.12),transparent 70%);margin:0 auto;border-radius:50%}
  .roll-wrap{text-align:center;margin:1rem 0}
  .roll-hint{font-size:12px;color:var(--muted);margin-bottom:.7rem;animation:blink 2.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
  .roll-btn{padding:.9rem 3rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--rose);color:#fff;box-shadow:0 4px 18px rgba(193,122,111,.4)}
  .roll-btn:active{transform:scale(.96);background:var(--deep)}
  .roll-btn:disabled{opacity:.45;cursor:not-allowed}

  .result-card{display:none;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:20px;padding:1.3rem;box-shadow:0 4px 20px rgba(193,122,111,.1);animation:popin .5s cubic-bezier(.34,1.3,.64,1);position:relative;overflow:hidden;margin-bottom:.8rem}
  .result-card.show{display:block}
  .result-card.first{padding:.8rem 1rem;opacity:.85}
  .result-card.first .result-emoji{font-size:1.5rem}
  .result-card.first .result-text{font-size:12.5px}
  @keyframes popin{from{transform:scale(.85) translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .result-face{display:inline-flex;align-items:center;gap:.35rem;border-radius:50px;padding:.25rem .85rem;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.8rem}
  .f1{background:rgba(193,122,111,.12);color:var(--rose);border:1px solid rgba(193,122,111,.2)}
  .f2{background:rgba(201,169,110,.12);color:#8a6a20;border:1px solid rgba(201,169,110,.25)}
  .f3{background:rgba(181,196,177,.2);color:#3a6040;border:1px solid rgba(181,196,177,.4)}
  .f4{background:rgba(100,140,200,.1);color:#2a4a80;border:1px solid rgba(100,140,200,.2)}
  .f5{background:rgba(160,80,160,.1);color:#6a1a8a;border:1px solid rgba(160,80,160,.2)}
  .f6{background:rgba(180,60,60,.12);color:#8a1010;border:1px solid rgba(180,60,60,.2)}
  .result-emoji{font-size:2.4rem;display:block;text-align:center;margin-bottom:.45rem}
  .result-text{font-size:clamp(13px,3.8vw,15px);color:var(--ink);line-height:1.8;text-align:center;margin-bottom:.45rem}
  .result-note{font-size:11px;color:var(--muted);text-align:center;font-style:italic;line-height:1.5}
  .action-row{display:none;gap:.5rem;margin-bottom:1rem}
  .action-row.show{display:flex}
  .act{flex:1;padding:.75rem .4rem;border-radius:50px;cursor:pointer;font-size:12.5px;font-weight:600;border:1.5px solid var(--blush);background:#fff;color:var(--muted)}
  .act.p{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700}
  .act:disabled{opacity:.4}
  .act:active{transform:scale(.97)}

  .section-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:1.2rem 0 .55rem;display:flex;align-items:center;gap:.5rem}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--blush),transparent)}
  .today-item{background:#fff;border:1px solid rgba(193,122,111,.14);border-radius:14px;padding:.7rem .8rem;margin-bottom:.45rem;display:flex;gap:.6rem;align-items:flex-start}
  .today-item.done{opacity:.6}
  .today-item.done .ti-text{text-decoration:line-through}
  .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--blush);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:transparent;cursor:pointer;margin-top:.1rem}
  .today-item.done .chk{background:#4a9a6a;border-color:#4a9a6a;color:#fff}
  .ti-text{font-size:12.5px;color:var(--ink);line-height:1.55;flex:1}
  .ti-text small{display:block;font-size:10px;color:var(--muted);margin-bottom:.1rem}
  .ti-del{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:.1rem .2rem}
  .wa-btn{width:100%;padding:.75rem;border-radius:50px;border:none;background:#25D366;color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:.2rem}
  .empty{font-size:12px;color:var(--muted);text-align:center;padding:.8rem;line-height:1.6}
  .history-item{display:flex;gap:.55rem;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.5;padding:.35rem 0;border-bottom:1px solid rgba(193,122,111,.07)}
  .history-item:last-child{border:none}
  .h-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:50px;flex-shrink:0;background:rgba(193,122,111,.1);color:var(--rose)}

  /* SHEET (buku nasib) */
  .sheet-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
  .sheet-bg.show{display:flex}
  .sheet{background:var(--cream);border-radius:22px 22px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:up .28s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{font-size:15px;color:var(--ink);text-align:center;font-weight:700}
  .sheet .sub{font-size:11.5px;color:var(--muted);text-align:center;margin:.2rem 0 .8rem}
  .bk-cat{font-size:10.5px;font-weight:700;margin:.8rem 0 .4rem;padding:.2rem .7rem;border-radius:50px;display:inline-block}
  .bk-item{background:#fff;border:1px solid rgba(193,122,111,.12);border-radius:12px;padding:.6rem .75rem;margin-bottom:.35rem;font-size:12px;color:var(--ink);line-height:1.5;display:flex;gap:.5rem;cursor:pointer}
  .bk-item.used{opacity:.45}
  .bk-item:active{background:var(--warm)}

  .toast-el{position:fixed;top:1.1rem;left:50%;transform:translateX(-50%);background:#fff;border:1px solid rgba(193,122,111,.2);border-radius:50px;padding:.45rem 1.1rem;font-size:12px;font-weight:500;color:var(--ink);box-shadow:0 4px 16px rgba(193,122,111,.15);z-index:9999;white-space:nowrap;animation:toastpop .3s ease}
  @keyframes toastpop{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%)}}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="page">

<!-- INTRO -->
<div id="s-intro" class="screen active">
  <span class="intro-icon">🎲</span>
  <span class="intro-label">Game Berdua</span>
  <h1 class="intro-title">Dadu <span>Nasib</span></h1>
  <p class="intro-sub">Lempar dadu — tiap sisi punya kategori nasib yang berbeda. Apapun yang keluar, harus dilakuin hari ini. Ga ada yang bisa kabur 😄</p>
  <span class="filter-title">Pilih sisi yang aktif:</span>
  <div class="face-pills" id="face-pills"></div>
  <button class="start-btn" onclick="goGame()">Lempar Dadu! 🎲</button>
  <button class="ghost" onclick="openBook(false)">📖 Lihat Semua Nasib</button>
</div>

<!-- GAME -->
<div id="s-game" class="screen">
  <div class="top">
    <button class="ico-btn" onclick="showScreen('s-intro')">⚙️</button>
    <span class="game-label">Dadu Nasib 🎲</span>
    <button class="ico-btn" onclick="openBook(false)">📖</button>
  </div>
  <div class="prog-row">
    <span class="prog-txt" id="prog-txt">0/48</span>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span style="font-size:10px;color:var(--muted);white-space:nowrap">nasib keluar</span>
  </div>

  <div class="dice-scene" onclick="rollDice()">
    <div class="dice" id="dice">
      <div class="face"><div class="dots d1"><div class="dot"></div></div></div>
      <div class="face"><div class="dots d2"><div class="dot"></div><div class="dot"></div></div></div>
      <div class="face"><div class="dots d3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
      <div class="face"><div class="dots d4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
      <div class="face"><div class="dots d5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
      <div class="face"><div class="dots d6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
    </div>
  </div>
  <div class="dice-shadow"></div>
  <div class="roll-wrap">
    <p class="roll-hint" id="roll-hint">👆 Tap dadu atau tombol ini</p>
    <button class="roll-btn" id="roll-btn" onclick="rollDice()">🎲 Lempar Dadu!</button>
  </div>

  <div class="result-card first" id="first-card"></div>
  <div class="result-card" id="result-card"></div>
  <div class="action-row" id="action-row">
    <button class="act p" id="btn-take" onclick="takeFate()">📌 Jalanin Hari Ini</button>
    <button class="act" id="btn-swap" onclick="swapFate()">🙈 Tuker (1x)</button>
  </div>

  <p class="section-title">📋 Nasib Hari Ini</p>
  <div id="today-list"></div>

  <div id="history-wrap" style="display:none">
    <p class="section-title">Lemparan sebelumnya</p>
    <div id="history-list"></div>
  </div>
</div>
</div>

<!-- BUKU NASIB -->
<div class="sheet-bg" id="book" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="sheet"><h3 id="book-title">📖 Semua Nasib</h3><p class="sub" id="book-sub"></p><div id="book-list"></div></div>
</div>

<script>
const WA_NUMBER = '6285692740607';
// ── FATES — 8 per sisi = 48 (isi tetap) ──
const FATES = {
  1:{label:'Romantis 🌸',cls:'f1',items:[
    {emoji:'🌸',cat:'Romantis',text:'Hari ini Razan harus bilang ke Dara — langsung, bukan via chat — satu hal yang paling dia syukuri dari Dara.',note:'Harus face to face. Ga boleh dikirim via WA.'},
    {emoji:'💌',cat:'Romantis',text:'Hari ini kalian harus foto bareng — momen apapun, kualitas ga penting. Yang penting ada kenangan hari ini.',note:'Harus disimpan. Ga boleh langsung dihapus.'},
    {emoji:'🤍',cat:'Romantis',text:'Hari ini Razan harus kasih Dara satu gesture kecil yang ga diminta — bisa pijitin, ambilkan sesuatu, atau hal kecil lainnya.',note:'Harus tulus dan ga diminta duluan.'},
    {emoji:'🌹',cat:'Romantis',text:'Hari ini kalian harus duduk bareng minimal 15 menit tanpa main HP — ngobrol, diam bareng, atau apapun. Asal beneran bareng.',note:'HP boleh ada tapi ga boleh dipegang siapapun.'},
    {emoji:'💞',cat:'Romantis',text:'Hari ini Dara boleh minta satu hal ke Razan — apapun yang wajar — dan Razan harus iyain tanpa nego.',note:'Dara yang tentukan. Razan yang eksekusi. Sekarang.'},
    {emoji:'🫶',cat:'Romantis',text:'Hari ini Razan harus nulis pesan panjang ke Dara — minimal 5 kalimat, bukan yang biasa dia kirim.',note:'Isinya hal-hal yang jarang diucapin. Harus dikirim hari ini.'},
    {emoji:'🎀',cat:'Romantis',text:'Hari ini Dara harus ceritain ke Razan momen favoritnya bersama Razan — yang mungkin Razan ga sadar berkesan.',note:'Cerita lengkap dengan detail. Razan hanya dengerin dulu.'},
    {emoji:'🫂',cat:'Romantis',text:'Hari ini kalian harus pelukan beneran minimal 30 detik — bukan pelukan basa-basi. Timer harus dipasang.',note:'30 detik penuh. Siapa yang lepas duluan harus minta maaf 😄'},
  ]},
  2:{label:'Lucu 😂',cls:'f2',items:[
    {emoji:'😂',cat:'Lucu',text:'Hari ini siapapun yang duluan bilang nama pasangannya dengan nada nyanyi, yang satunya harus ikutin cara itu sampai tengah malam.',note:'Sekali mulai, ga bisa balik normal.'},
    {emoji:'🤡',cat:'Lucu',text:'Hari ini kalian harus foto paling jelek masing-masing dan kirim ke satu sama lain. Foto itu jadi foto kontak 24 jam.',note:'Ga boleh edit. Harus yang paling jelek.'},
    {emoji:'🎭',cat:'Lucu',text:'Hari ini tiap kali satu orang nanya sesuatu — yang ditanya harus jawab dengan nada sinetron lebay selama 5 menit.',note:'Lupa dan jawab normal → harus nyanyi satu lagu penuh.'},
    {emoji:'🃏',cat:'Lucu',text:'Hari ini kalian harus ciptain satu julukan baru buat satu sama lain yang dipake seharian penuh.',note:'Harus julukan baru. Bukan yang udah ada sebelumnya.'},
    {emoji:'🎪',cat:'Lucu',text:'Hari ini siapapun yang duluan ketawa setelah yang lain bilang sesuatu random — harus lakuin apa yang diminta.',note:'Boleh coba nakut-nakutin, ngelucu, apapun.'},
    {emoji:'🐸',cat:'Lucu',text:'Hari ini kalian harus kirim meme ke satu sama lain — tapi meme-nya harus tentang pasangannya sendiri. Dibuat sendiri.',note:'Minimal effort, maksimal lucu. Harus dikirim sebelum malam.'},
    {emoji:'🎤',cat:'Lucu',text:'Hari ini kalian berdua harus nyanyi satu lagu bareng — full dari awal sampai akhir. Boleh off-key, ga boleh malu-maluin diri sendiri.',note:'Harus direkam. Videonya disimpan 🎤'},
    {emoji:'🎲',cat:'Lucu',text:'Hari ini kalian harus main suit 5 ronde. Yang kalah harus lakuin satu hal receh yang dipilih yang menang.',note:'Langsung main sekarang. Ga ada nego soal hadiahnya.'},
  ]},
  3:{label:'Quality Time 🫂',cls:'f3',items:[
    {emoji:'🫂',cat:'Quality Time',text:'Hari ini kalian harus jalan ke suatu tempat bareng — ga harus jauh, bisa warung sebelah. Yang penting keluar berdua.',note:'Ga boleh diganti nonton di rumah.'},
    {emoji:'🍜',cat:'Quality Time',text:'Hari ini kalian harus makan bareng — duduk, makan, ngobrol. Bukan makan sambil main HP masing-masing.',note:'HP hadap bawah selama makan.'},
    {emoji:'🎵',cat:'Quality Time',text:'Hari ini kalian harus dengerin satu lagu bareng dari awal sampai akhir — tanpa skip, tanpa ngobrol selama lagunya.',note:'Setelah selesai, masing-masing bilang satu hal yang dirasain.'},
    {emoji:'🌙',cat:'Quality Time',text:'Hari ini sebelum tidur, kalian harus cerita ke satu sama lain — satu hal terbaik dan satu hal tersulit dari hari ini.',note:'Harus jujur. Bukan jawaban yang aman.'},
    {emoji:'☕',cat:'Quality Time',text:'Hari ini kalian duduk bareng tanpa agenda selama 20 menit — ga nonton, ga scroll HP. Cukup ngobrol apapun.',note:'Kehabisan bahan? Ceritain hal random dari minggu lalu.'},
    {emoji:'📸',cat:'Quality Time',text:'Hari ini kalian harus bikin album foto mini — minimal 5 foto dari hari ini, disusun dan diberi judul masing-masing.',note:'Bisa di HP atau dicetak. Yang penting ada kenangan hari ini.'},

    {emoji:'🎰',cat:'Wild Card 🔥',text:'JACKPOT! Hari ini Dara bebas minta apapun ke Razan — satu permintaan yang wajar — dan Razan harus lakuin tanpa debat.',note:'Dara punya 5 menit untuk memutuskan. Setelah itu Razan eksekusi.'},

    {emoji:'🎭',cat:'Wild Card 🔥',text:'ROLE SWAP! Hari ini Razan jadi "Dara" dan Dara jadi "Razan" — lakuin sesuatu yang biasanya dilakukan pasangannya.',note:'Masing-masing tentukan "sesuatu" itu apa untuk yang lain. Harus nyata.'},
    {emoji:'⚡',cat:'Wild Card 🔥',text:'MISI MENDADAK! Kalian punya 30 menit dari sekarang untuk pergi ke suatu tempat bareng — ga boleh direncanakan.',note:'Destinasi: tutup mata dan tunjuk peta, atau tanya orang pertama yang kalian temui.'},

    {emoji:'🃏',cat:'Wild Card 🔥',text:'KARTU MISTERIUS! Kalian berdua masing-masing nulis satu "misi rahasia" untuk satu sama lain — tukar dan lakuin hari ini.',note:'Misi harus ditulis sekarang sebelum lihat punya yang lain. Harus dilakuin hari ini.'},
    {emoji:'💫',cat:'Wild Card 🔥',text:'PILIH SENDIRI! Kalian bebas pilih satu nasib dari kategori manapun — tapi harus disepakati berdua dalam 2 menit.',note:'Tap tombol "📖 Pilih dari Buku Nasib" di bawah, lalu pilih satu. Timer 2 menit.',pickOwn:true},
    {emoji:'🌈',cat:'Wild Card 🔥',text:'HARI SPESIAL! Hari ini apapun yang diminta Dara dari Razan — asal wajar — harus dipenuhi. Tapi Dara juga harus lakuin satu hal manis balik.',note:'Keduanya harus. Bukan cuma satu arah.'},
  ]},
};
// rotasi kubus buat nampilin sisi n (1..6) ke depan
const FACE_ROT = { 1: [0, 0], 2: [0, 180], 3: [0, -90], 4: [0, 90], 5: [-90, 0], 6: [90, 0] };

// ── STATE ──
const $ = id => document.getElementById(id);
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
let S = { used: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }, history: [], active: [1, 2, 3, 4, 5, 6], today: { date: todayKey(), items: [], swapUsed: false }, doneTotal: 0 };
try {
  const d = JSON.parse(localStorage.getItem('dadu-v2') || 'null');
  if (d) S = { ...S, ...d };
  else { const u = localStorage.getItem('dadu_used'), h = localStorage.getItem('dadu_history'); if (u) S.used = JSON.parse(u); if (h) S.history = JSON.parse(h); } // data lama
} catch {}
if (S.today.date !== todayKey()) S.today = { date: todayKey(), items: [], swapUsed: false };   // ganti hari = daftar baru
function save() { try { localStorage.setItem('dadu-v2', JSON.stringify(S)); } catch {} }
let rolling = false, current = null, rotX = 0, rotY = 0, doubleLeft = 0, firstOfDouble = null;

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0, 0); }
function toast(m) { document.querySelectorAll('.toast-el').forEach(e => e.remove()); const el = document.createElement('div'); el.className = 'toast-el'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

// ── INTRO ──
const PILL_COL = { 1: '#c17a6f', 2: '#c9a96e', 3: '#b5c4b1', 4: '#6a8ac0', 5: '#a050a0', 6: '#a01010' };
function renderPills() {
  const NM = { 1: 'Romantis', 2: 'Lucu', 3: 'Quality Time', 4: 'Tantangan', 5: 'Absurd', 6: 'Wild Card 🔥' };
  $('face-pills').innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<div class="fp f${n} ${S.active.includes(n) ? 'sel' : ''}" onclick="toggleFace(${n})"><div class="fp-dot" style="background:${PILL_COL[n]}"></div>${NM[n]}</div>`).join('');
}
function toggleFace(n) {
  if (S.active.includes(n)) { if (S.active.length <= 1) return toast('Minimal 1 sisi aktif ya'); S.active = S.active.filter(x => x !== n); }
  else S.active.push(n);
  save(); renderPills();
}
function goGame() { showScreen('s-game'); updateProgress(); renderToday(); renderHistory(); }

// ── PROGRESS ──
const left = f => FATES[f].items.length - (S.used[f] || []).length;
function updateProgress() {
  const total = S.active.reduce((a, f) => a + FATES[f].items.length, 0), used = S.active.reduce((a, f) => a + (S.used[f] || []).length, 0);
  $('prog-fill').style.width = (total ? used / total * 100 : 0) + '%'; $('prog-txt').textContent = `${used}/${total}`;
}

// ── LEMPAR ──
function rollDice(fromDouble) {
  if (rolling) return;
  if (current && !fromDouble) { toast('Pilih dulu: jalanin atau tuker 😄'); $('action-row').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const eligible = S.active.filter(f => left(f) > 0);
  if (!eligible.length) return allDone();
  rolling = true; $('roll-btn').disabled = true; $('roll-hint').style.display = 'none';
  $('result-card').classList.remove('show'); $('action-row').classList.remove('show');
  if (!fromDouble) $('first-card').classList.remove('show');
  const face = eligible[Math.floor(Math.random() * eligible.length)];
  // selalu muter MAJU dari posisi sekarang (nggak loncat balik)
  const [tx, ty] = FACE_ROT[face], spinX = 2 + Math.floor(Math.random() * 2), spinY = 2 + Math.floor(Math.random() * 2);
  const nx = Math.ceil((rotX + 1) / 360) * 360 + spinX * 360 + tx, ny = Math.ceil((rotY + 1) / 360) * 360 + spinY * 360 + ty;
  rotX = nx; rotY = ny;
  $('dice').style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  vib([10, 40, 10, 40, 10]);
  setTimeout(() => { rolling = false; $('roll-btn').disabled = false; showResult(face); }, 1150);
}

function showResult(face) {
  const items = FATES[face].items, avail = items.map((_, i) => i).filter(i => !S.used[face].includes(i));
  const idx = avail[Math.floor(Math.random() * avail.length)], item = items[idx];
  S.used[face].push(idx);
  current = { face, idx, ...item };
  S.history.unshift({ face, emoji: item.emoji, text: item.text }); S.history = S.history.slice(0, 8);
  save(); updateProgress(); renderHistory();
  renderCard($('result-card'), current, avail.length - 1);
  $('result-card').classList.add('show');
  $('btn-swap').disabled = S.today.swapUsed || item.isDouble;
  $('btn-swap').textContent = S.today.swapUsed ? '🙈 Tuker habis' : '🙈 Tuker (1x)';
  $('btn-take').textContent = item.pickOwn ? '📖 Pilih dari Buku Nasib' : item.isDouble ? '🎲 Lempar Nasib Kedua' : '📌 Jalanin Hari Ini';
  $('action-row').classList.add('show');
  if (face === 6) confetti();
  vib(face === 6 ? [30, 20, 60] : 25);
  setTimeout(() => $('result-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
  if (item.isDouble) { firstOfDouble = current; setTimeout(() => { if (current === firstOfDouble) takeFate(); }, 2200); }
}
function renderCard(el, it, sisa) {
  el.innerHTML = `<span class="result-face ${FATES[it.face].cls}">Sisi ${it.face} · ${FATES[it.face].label}${sisa != null ? ` (sisa ${sisa})` : ''}</span>
    <span class="result-emoji">${it.emoji}</span><p class="result-text">${it.text}</p><p class="result-note">${it.note || ''}</p>`;
}

// ── JALANIN / TUKER ──
function takeFate() {
  if (!current) return;
  if (current.isDouble) {
    // nasib ganda: kartu pertama tetap kelihatan kecil di atas, lalu lempar lagi
    renderCard($('first-card'), current); $('first-card').insertAdjacentHTML('afterbegin', '<p style="font-size:10px;color:var(--rose);font-weight:700;text-align:center;margin-bottom:.3rem">🌟 NASIB GANDA — 2 nasib buat hari ini:</p>');
    $('first-card').classList.add('show'); current = null; doubleLeft = 2; toast('🎲 Nasib pertama...'); rollDice(true); return;
  }
  if (current.pickOwn) { current = null; $('action-row').classList.remove('show'); openBook(true); return; }
  addToday(current); current = null;
  $('action-row').classList.remove('show'); vib(20);
  if (doubleLeft > 0) { doubleLeft--; if (doubleLeft > 0) { toast('🎲 Nasib kedua...'); setTimeout(() => rollDice(true), 700); return; } $('first-card').classList.remove('show'); }
  toast('📌 Masuk ke Nasib Hari Ini!');
}
function swapFate() {
  if (!current || S.today.swapUsed || current.isDouble) return;
  S.used[current.face] = S.used[current.face].filter(i => i !== current.idx);  // balik ke dadu
  S.history.shift(); S.today.swapUsed = true; current = null; save(); updateProgress(); renderHistory();
  $('result-card').classList.remove('show'); $('action-row').classList.remove('show');
  toast('🙈 Ditukar! Lempar lagi...'); setTimeout(() => rollDice(doubleLeft > 0), 500);
}
function addToday(it) { S.today.items.push({ face: it.face, emoji: it.emoji, text: it.text, done: false }); save(); renderToday(); }

// ── NASIB HARI INI ──
function renderToday() {
  const L = S.today.items;
  $('today-list').innerHTML = L.length ? L.map((t, i) => `<div class="today-item ${t.done ? 'done' : ''}"><div class="chk" onclick="toggleDone(${i})">✓</div><div class="ti-text"><small>${t.emoji} ${FATES[t.face].label}</small>${t.text}</div><button class="ti-del" onclick="delToday(${i})">✕</button></div>`).join('')
    + `<button class="wa-btn" onclick="shareWA()">💬 Kirim nasib hari ini ke Razan</button><p class="empty">✅ ${L.filter(t => t.done).length}/${L.length} dijalanin hari ini · total ${S.doneTotal} nasib udah kalian jalanin 🤍</p>`
    : '<p class="empty">Belum ada. Lempar dadu, terus tap <b>📌 Jalanin Hari Ini</b>.<br>Daftar ini otomatis kosong lagi besok.</p>';
}
function toggleDone(i) { const t = S.today.items[i]; t.done = !t.done; S.doneTotal = Math.max(0, S.doneTotal + (t.done ? 1 : -1)); save(); renderToday(); if (t.done) { vib([20, 10, 40]); toast('✅ Nasib dijalanin!'); if (S.today.items.every(x => x.done)) confetti(); } }
function delToday(i) { const t = S.today.items[i]; if (t.done) S.doneTotal = Math.max(0, S.doneTotal - 1); S.today.items.splice(i, 1); save(); renderToday(); }
function shareWA() { const msg = '🎲 Nasib kita hari ini dari Dadu Nasib:\n\n' + S.today.items.map((t, i) => `${t.done ? '✅' : '⬜'} ${t.emoji} ${t.text}`).join('\n\n') + '\n\nNggak ada yang bisa kabur ya 😄🤍'; window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank'); }

function renderHistory() {
  $('history-wrap').style.display = S.history.length ? 'block' : 'none';
  $('history-list').innerHTML = S.history.slice(0, 6).map(h => `<div class="history-item"><span class="h-tag">${h.emoji} Sisi ${h.face}</span><span>${h.text.slice(0, 65)}${h.text.length > 65 ? '...' : ''}</span></div>`).join('');
}

// ── BUKU NASIB ──
function openBook(picking) {
  $('book-title').textContent = picking ? '💫 Pilih Sendiri' : '📖 Semua Nasib';
  $('book-sub').textContent = picking ? 'Sepakati berdua dalam 2 menit — tap satu nasib buat dijalanin hari ini' : 'Yang pudar = udah pernah keluar';
  $('book-list').innerHTML = [1, 2, 3, 4, 5, 6].map(f => `<span class="bk-cat ${FATES[f].cls}">${FATES[f].label}</span>` + FATES[f].items.map((it, i) => (picking && (it.isDouble || it.pickOwn)) ? '' :
    `<div class="bk-item ${S.used[f].includes(i) ? 'used' : ''}" ${picking ? `onclick="pickOwn(${f},${i})"` : ''}><span>${it.emoji}</span><span>${it.text}</span></div>`).join('')).join('');
  $('book').classList.add('show'); $('book').querySelector('.sheet').scrollTop = 0;
}
function pickOwn(f, i) { const it = FATES[f].items[i]; addToday({ face: f, ...it }); $('book').classList.remove('show'); toast('💫 Nasib pilihan kalian masuk daftar!'); confetti(); if (doubleLeft > 0) { doubleLeft--; if (doubleLeft > 0) setTimeout(() => rollDice(true), 700); else $('first-card').classList.remove('show'); } }

function allDone() {
  if (!confirm('Semua nasib dari sisi yang aktif udah keluar! 🎲\n\nReset dadu biar semua nasib bisa keluar lagi?')) return;
  S.used = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }; S.history = []; save(); updateProgress(); renderHistory(); toast('Reset! Semua nasib siap lagi 🎲'); confetti();
}
function confetti() {
  const colors = ['#c17a6f', '#e8c4b0', '#c9a96e', '#b5c4b1', '#faf6f0'];
  for (let i = 0; i < 70; i++) setTimeout(() => {
    const el = document.createElement('div'); el.className = 'cp';
    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);
  }, i * 22);
}
renderPills();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
