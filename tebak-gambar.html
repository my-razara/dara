<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Gambar & Tebak Online — Razan & Dara 🎨</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .bd-st.err{color:#b4554a}
  .scr{display:none}.scr.on{display:block}
  .big-card{display:block;width:100%;text-align:center;border:none;cursor:pointer;font-family:inherit;color:#fff;border-radius:24px;padding:1.2rem 1rem;background:linear-gradient(140deg,#8a6fc4,#4a3a8e);box-shadow:0 12px 28px rgba(74,58,142,.3);margin-bottom:.8rem}
  .big-card .e{font-size:2.8rem;display:block;line-height:1.1;animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px) rotate(-5deg)}}
  .big-card b{display:block;font-size:15px;margin:.4rem 0 .15rem}
  .big-card p{font-size:12px;opacity:.9}
  .big-card .go{display:inline-block;margin-top:.7rem;background:#fff;color:#4a3a8e;font-weight:700;font-size:13px;padding:.55rem 1.1rem;border-radius:50px}
  .big-card.wait{background:linear-gradient(140deg,#d9cfee,#a99bd0);color:#3d2f6e;cursor:default}
  .big-card.res{background:linear-gradient(140deg,#7ec49a,#2f7a4f)}
  .score{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.8rem}
  .score div{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:16px;padding:.6rem .3rem;text-align:center}
  .score b{display:block;font-size:1.25rem;color:var(--deep)}
  .score small{font-size:10px;color:var(--muted)}
  .hist{display:flex;flex-direction:column;gap:.4rem}
  .hist div{display:flex;align-items:center;gap:.6rem;background:#fff;border:1px solid rgba(193,122,111,.12);border-radius:14px;padding:.5rem .7rem;font-size:12px}
  .hist div b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist div small{color:var(--muted);white-space:nowrap}
  .by.Razan{color:var(--rz)}.by.Dara{color:var(--dr)}
  .words{display:flex;flex-direction:column;gap:.55rem}
  .wbtn{display:flex;align-items:center;gap:.8rem;width:100%;border:1.5px solid var(--blush);background:#fff;border-radius:18px;padding:.85rem 1rem;cursor:pointer;font-family:inherit;text-align:left}
  .wbtn b{flex:1;font-size:15px;color:var(--deep)}
  .wbtn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .wbtn .lv{font-size:12px;color:#e0a43a;white-space:nowrap}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
  .topbar .wd{font-size:13px;color:var(--muted)}
  .topbar .wd b{color:var(--deep);font-size:15px}
  .cv-wrap{position:relative;width:100%;max-width:min(420px,calc(100dvh - 300px));margin:0 auto;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(193,122,111,.15);border:1px solid rgba(193,122,111,.18);touch-action:none}
  .cv-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .tools{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-top:.6rem}
  .tools .c{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.12);cursor:pointer;padding:0}
  .tools .c.on{box-shadow:0 0 0 2.5px var(--deep)}
  .tools .b{min-width:34px;height:30px;border-radius:10px;border:1.5px solid var(--blush);background:#fff;cursor:pointer;font-size:12px;padding:0 .45rem}
  .tools .b.on{border-color:var(--deep);background:var(--warm)}
  .tools .b:disabled{opacity:.4}
  .slots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:.7rem 0 .5rem}
  .slots span{width:24px;height:30px;border-bottom:2.5px solid var(--deep);display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-size:16px;color:var(--deep);text-transform:uppercase}
  .slots span.sp{border:none;width:12px}
  .slots span.rev{color:#8a6fc4}
  .gin{display:flex;gap:.45rem}
  .gin .inp{flex:1;min-width:0;text-align:center;font-size:16px}
  .gin button{border:none;border-radius:14px;background:linear-gradient(135deg,#8a6fc4,#4a3a8e);color:#fff;font-weight:700;padding:0 1.1rem;cursor:pointer;font-size:14px}
  .shake{animation:sh .35s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tries{font-size:11.5px;color:var(--muted);text-align:center;margin-top:.4rem;min-height:1.2em}
  .sm-row{display:flex;gap:.4rem;justify-content:center;margin-top:.5rem}
  .sm-row button{font-size:12px;border:1.5px solid var(--blush);background:#fff;border-radius:50px;padding:.45rem .85rem;cursor:pointer;color:var(--deep)}
  .res-c{text-align:center;padding:1rem 0}
  .res-c .e{font-size:3.4rem}
  .res-c h2{font-size:1.3rem;color:var(--deep);margin:.3rem 0}
  .res-c p{font-size:13px;color:var(--muted);line-height:1.6}
  .sending{position:fixed;inset:0;z-index:60;background:rgba(45,31,26,.45);display:none;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;flex-direction:column;gap:.6rem}
  .sending.show{display:flex}
  .sending span{font-size:3rem;animation:fly 1.2s ease-in-out infinite}
  @keyframes fly{50%{transform:translate(12px,-12px) rotate(10deg)}}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill" id="back">← Menu utama</a><button class="pill" id="who-btn"></button></div>

  <div class="scr on" id="s-home">
    <div class="head"><span class="ico">🎨</span><p class="lbl">Main online · beda HP</p><h1 class="title">Gambar & <span>Tebak</span></h1><p class="sub">Gambar sesuatu, kirim ke pasangan, dia nebak dari HP-nya — kayak Draw Something versi kita 😆</p></div>
    <p class="bd-st" id="bd-st"></p>
    <div id="home-main"></div>
    <div class="score" id="score"></div>
    <p class="sec">🕰️ Riwayat</p>
    <div class="hist" id="hist"></div>
  </div>

  <div class="scr" id="s-pick">
    <div class="head"><span class="ico">🎲</span><h1 class="title">Mau gambar <span>apa?</span></h1><p class="sub">Makin susah, makin banyak bintang kalau ketebak ⭐</p></div>
    <div class="words" id="words"></div>
    <div class="sm-row"><button onclick="rollWords()">🔀 Acak lagi</button><button onclick="show('s-home')">Batal</button></div>
  </div>

  <div class="scr" id="s-draw">
    <div class="topbar"><span class="wd">Gambar: <b id="d-word"></b></span><span class="wd" id="d-lv"></span></div>
    <div class="cv-wrap" id="d-wrap"><canvas id="d-cv"></canvas></div>
    <div class="tools" id="d-tools"></div>
    <div class="row"><button class="btn ghost" onclick="cancelDraw()">Batal</button><button class="btn" onclick="sendDraw()">✈️ Kirim</button></div>
  </div>

  <div class="scr" id="s-guess">
    <div class="topbar"><span class="wd" id="g-from"></span><span class="wd" id="g-lv"></span></div>
    <div class="cv-wrap"><canvas id="g-cv"></canvas></div>
    <div class="slots" id="g-slots"></div>
    <div class="gin"><input class="inp" id="g-in" maxlength="40" placeholder="Tebakan kamu…" autocomplete="off"><button onclick="guess()">Tebak</button></div>
    <p class="tries" id="g-tries"></p>
    <div class="sm-row"><button onclick="replay()">🔁 Ulang gambar</button><button onclick="hintLetter()" id="g-hint">💡 Bantuin</button><button onclick="giveUp()">🏳️ Nyerah</button></div>
  </div>

  <div class="scr" id="s-res"><div class="res-c" id="res"></div></div>
</div>
<div class="sending" id="sending"><span>✈️</span>Ngirim gambar…</div>

<div class="toast" id="toast"></div>
<script>

const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {

  paint(); return lsGet(key, 'Dara');
}

    W('Bawah Laut','Dunia di dasar samudra',['laut']), W('Istana','Rumah raja & ratu',['kastil']), W('Taman Bermain','Tempat main anak-anak',['playground']),
    W('Perpustakaan','Gedung penuh buku',[]), W('Pulau','Daratan di tengah laut',['pulau terpencil']), W('Pasar Malam','Pasar yang buka pas gelap',['bianglala']),
    W('Rumah Sakit','Tempat orang dirawat',['rs']), W('Kolam Renang','Tempat berenang',[]), W('Kafe','Tempat ngopi',['cafe','coffee shop']),
  ],
  benda: [
    W('Payung','Pelindung dari hujan',[]), W('Gitar','Alat musik petik',[]), W('Kacamata','Dipakai di mata',[]), W('Jam Weker','Bunyi di pagi hari',['jam','alarm']),
    W('Lampu','Bikin terang',['bohlam']), W('Sepeda','Kendaraan dua roda dikayuh',[]), W('Kamera','Buat foto',[]), W('Balon','Ditiup, bisa terbang',[]),
    W('Kulkas','Lemari dingin',['lemari es']), W('Sikat Gigi','Dipakai pagi & malam',[]), W('Headphone','Dengerin musik di kepala',['headset']), W('Kunci','Buka pintu',[]),
  ],
  absurd: [
    W('Astronot Makan Bakso','Orang luar angkasa lagi slurp',[]), W('Kucing Jadi Presiden','Hewan berbulu mimpin negara',[]),
    W('Dinosaurus Main HP','Hewan purba lagi scrolling',[]), W('Naga Minum Kopi','Makhluk api butuh kafein',[]),
    W('Penyihir Naik Ojol','Orang bertongkat pakai helm',[]), W('Gurita DJ','8 tangan puter musik',[]),
    W('Gajah Balerina','Hewan besar lagi ballet',[]), W('Zombie Diet','Makhluk seram makan salad',[]),
    W('Duyung Naik Motor','Setengah ikan ngebut',[]), W('Beruang Yoga','Hewan besar lagi meditasi',[]),
  ],
};
BANK.campuran = Object.entries(BANK).flatMap(([k, a]) => a);

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, pull() {}, fast() {}, enabled: false };
const D0 = '2000-01-01';                    // satu "slot" tetap per orang
const CH = ['gbra', 'gbrb', 'gbrc', 'gbrd', 'gbre', 'gbrf', 'gbrg', 'gbrh'];
const COLORS = ['#2d1f1a', '#c17a6f', '#4a7cc7', '#4caf50', '#e57373', '#ffb74d', '#ba68c8', '#8d6e63', '#ffeb3b', '#90caf9'];
const BRUSH = [6, 14, 30];
const LV = { 1: ['hewan', 'makanan', 'benda'], 2: ['tempat', 'kita', 'romantis'], 3: ['absurd'] };
if (lsGet('gt-me', null) == null) lsSet('gt-me', BD.me());
let me = whoBtn('gt-me', () => { me = lsGet('gt-me', 'Dara'); BD.setMe(me); renderHome(); });
BD.setMe(me); BD.fast && BD.fast(15000);
const o = () => otherOf(me);
const row = (app, w) => (lsGet(app + '-' + w, {}) || {})[D0] || null;
function show(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

/* ── encode gambar: koordinat 0..999 → 2 huruf ── */
const AB = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const e2 = n => AB[(n >> 6) & 63] + AB[n & 63];
const d2 = s => (AB.indexOf(s[0]) << 6) | AB.indexOf(s[1]);
function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const [a, b] = [pts[0], pts[pts.length - 1]]; let mx = 0, ix = 0;
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < pts.length - 1; i++) { const d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / L; if (d > mx) { mx = d; ix = i; } }
  if (mx <= eps) return [a, b];
  return rdp(pts.slice(0, ix + 1), eps).slice(0, -1).concat(rdp(pts.slice(ix), eps));
}
function encode(strokes, eps) { return strokes.map(s => AB[s.c] + AB[s.w] + rdp(s.p, eps).map(([x, y]) => e2(x) + e2(y)).join('')).join('.'); }
function decode(str) { return str ? str.split('.').filter(Boolean).map(t => { const p = []; for (let i = 2; i + 3 < t.length + 0; i += 4) p.push([d2(t.slice(i, i + 2)), d2(t.slice(i + 2, i + 4))]); return { c: AB.indexOf(t[0]), w: AB.indexOf(t[1]), p }; }) : []; }

/* ── canvas ── */
function setupCv(cv) { const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); const x = cv.getContext('2d'); x.setTransform(cv.width / 1000, 0, 0, cv.height / 1000, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round'; x.fillStyle = '#fff'; x.fillRect(0, 0, 1000, 1000); return x; }
function drawStroke(x, s, upto) {
  const p = s.p, n = upto == null ? p.length : upto; if (!n) return;
  x.strokeStyle = s.c === 10 ? '#fff' : COLORS[s.c]; x.lineWidth = BRUSH[s.w] * (s.c === 10 ? 2 : 1);
  x.beginPath(); x.moveTo(p[0][0], p[0][1]);
  if (n === 1) x.lineTo(p[0][0] + .1, p[0][1] + .1);
  for (let i = 1; i < n; i++) x.lineTo(p[i][0], p[i][1]);
  x.stroke();
}

/* ── layar utama ── */
function bdStatus() { const el = $('bd-st'), t = BD.status ? BD.status() : ''; el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function chunksOk(m, w) { if (!m) return false; for (let i = 0; i < m.n; i++) { const c = row(CH[i], w); if (!c || c.id !== m.id) return false; } return true; }
function scores() { const a = row('gbrp', 'Razan') || {}, b = row('gbrp', 'Dara') || {}; return { Razan: a, Dara: b }; }
function renderHome() {
  bdStatus();
  const mine = row('gbrm', me), theirs = row('gbrm', o());
  let h = '';
  if (theirs && !theirs.res) {
    h += `<button class="big-card" onclick="startGuess()"><span class="e">🎨</span><b>${o()} ngirim gambar buat kamu tebak!</b><p>${'⭐'.repeat(theirs.lvl)} · dikirim ${ago(theirs.at)}</p><span class="go">🔍 Tebak sekarang</span></button>`;
  }
  const seenAt = mine && lsGet('gt-seen-' + (mine && mine.id), 0);
  if (mine && mine.res && (!seenAt || Date.now() - seenAt < 10 * 60e3)) {
    const r = mine.res;
    h += `<div class="big-card res" style="cursor:default"><span class="e">${r.ok ? '🎉' : '😅'}</span><b>${r.ok ? `${o()} berhasil nebak “${esc(mine.w)}”!` : `${o()} nyerah nebak “${esc(mine.w)}”`}</b><p>${r.ok ? `${r.tries}x coba${r.hint ? ` · pake ${r.hint} bantuan` : ''} · +${pts(mine.lvl, r.hint)} ⭐ buat kalian` : 'Gambarnya terlalu artistik kayaknya 😆'}</p></div>`;
    if (!seenAt) lsSet('gt-seen-' + mine.id, Date.now());
  }
  if (mine && !mine.res) h += `<div class="big-card wait"><span class="e">⏳</span><b>Nunggu ${o()} nebak gambar kamu</b><p>Kamu gambar “${esc(mine.w)}” · ${ago(mine.at)}</p></div><div class="sm-row" style="margin:-.3rem 0 .9rem"><button onclick="newDraw(true)">🔁 Gambar ulang (ganti yang ini)</button></div>`;
  else h += `<button class="btn" onclick="newDraw()" style="margin-bottom:.9rem">🎨 Gambar buat ${o()}</button>`;
  $('home-main').innerHTML = h;
  const S = scores(), tot = (S.Razan.pts || 0) + (S.Dara.pts || 0);
  const hist = (S.Razan.h || []).concat(S.Dara.h || []).sort((a, b) => b.at - a.at);
  let st = 0; for (const x of hist) { if (x.ok) st++; else break; }
  $('score').innerHTML = `<div><b>${tot}</b><small>⭐ skor berdua</small></div><div><b>${hist.filter(x => x.ok).length}/${hist.length}</b><small>ketebak</small></div><div><b>${st}🔥</b><small>beruntun</small></div>`;
  $('hist').innerHTML = hist.slice(0, 12).map(x => `<div><span>${x.ok ? '✅' : '❌'}</span><b>${esc(x.w)}</b><small><span class="by ${x.d}">${x.d}</span> gambar · ${'⭐'.repeat(x.lvl)}</small></div>`).join('') || '<p class="empty">Belum ada ronde. Mulai gambar yuk! 🖍️</p>';
}
function ago(ms) { const m = Math.round((Date.now() - ms) / 60e3); return m < 1 ? 'barusan' : m < 60 ? m + ' menit lalu' : m < 1440 ? Math.round(m / 60) + ' jam lalu' : Math.round(m / 1440) + ' hari lalu'; }
const pts = (lvl, hint) => Math.max(1, lvl * 2 - (hint || 0));

/* ── pilih kata ── */
function newDraw(redo) { if (redo && !confirm('Ganti gambar yang lagi ditunggu?')) return; rollWords(); show('s-pick'); }
let choices = [];
function rollWords() {
  const used = new Set(((scores()[me].h || []).concat(scores()[o()].h || [])).map(x => x.w));
  choices = [1, 2, 3].map(l => { const pool = LV[l].flatMap(k => BANK[k]).filter(x => !used.has(x.w)); const all = pool.length ? pool : LV[l].flatMap(k => BANK[k]); return Object.assign({ lvl: l }, all[Math.floor(Math.random() * all.length)]); });
  $('words').innerHTML = choices.map((c, i) => `<button class="wbtn" onclick="startDraw(${i})"><b>${esc(c.w)}<small>${esc(c.hint)}</small></b><span class="lv">${'⭐'.repeat(c.lvl)}<br><small>${['', 'Mudah', 'Sedang', 'Susah'][c.lvl]}</small></span></button>`).join('');
}

/* ── gambar ── */
let word = null, strokes = [], curS = null, col = 0, bw = 1, dx = null;
function startDraw(i) {
  word = choices[i]; strokes = []; col = 0; bw = 1;
  $('d-word').textContent = word.w; $('d-lv').textContent = '⭐'.repeat(word.lvl);
  show('s-draw'); requestAnimationFrame(() => { dx = setupCv($('d-cv')); paintTools(); });
}
function paintTools() {
  $('d-tools').innerHTML = COLORS.map((c, i) => `<button class="c ${col === i ? 'on' : ''}" style="background:${c}" data-c="${i}" aria-label="warna"></button>`).join('')
    + `<button class="b ${col === 10 ? 'on' : ''}" data-c="10">🧽</button>` + BRUSH.map((b, i) => `<button class="b ${bw === i ? 'on' : ''}" data-w="${i}">${['•', '●', '⬤'][i]}</button>`).join('')
    + `<button class="b" id="t-undo" ${strokes.length ? '' : 'disabled'}>↩️</button><button class="b" id="t-clr" ${strokes.length ? '' : 'disabled'}>🗑</button>`;
  $('d-tools').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { col = +b.dataset.c; paintTools(); });
  $('d-tools').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { bw = +b.dataset.w; paintTools(); });
  $('t-undo').onclick = () => { strokes.pop(); redraw(); paintTools(); };
  $('t-clr').onclick = () => { if (confirm('Hapus semua gambar?')) { strokes = []; redraw(); paintTools(); } };
}
function redraw() { dx = setupCv($('d-cv')); strokes.forEach(s => drawStroke(dx, s)); }
function ptOf(e) { const r = $('d-cv').getBoundingClientRect(); return [Math.max(0, Math.min(999, Math.round((e.clientX - r.left) / r.width * 1000))), Math.max(0, Math.min(999, Math.round((e.clientY - r.top) / r.height * 1000)))]; }
$('d-cv').addEventListener('pointerdown', e => { e.preventDefault(); try { $('d-cv').setPointerCapture(e.pointerId); } catch (x) {} curS = { c: col, w: bw, p: [ptOf(e)] }; drawStroke(dx, curS); });
$('d-cv').addEventListener('pointermove', e => { if (!curS) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; for (const ev of evs) { const p = ptOf(ev), l = curS.p[curS.p.length - 1]; if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) < 3) continue; curS.p.push(p); } dx.strokeStyle = curS.c === 10 ? '#fff' : COLORS[curS.c]; dx.lineWidth = BRUSH[curS.w] * (curS.c === 10 ? 2 : 1); const p = curS.p; if (p.length > 1) { dx.beginPath(); dx.moveTo(p[p.length - 2][0], p[p.length - 2][1]); dx.lineTo(p[p.length - 1][0], p[p.length - 1][1]); dx.stroke(); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('d-cv').addEventListener(t, () => { if (curS) { strokes.push(curS); curS = null; paintTools(); } }));
function cancelDraw() { if (strokes.length && !confirm('Buang gambarnya?')) return; show('s-home'); renderHome(); }
function sendDraw() {
  if (!strokes.length) { toast('Gambar dulu dong 🖍️'); return; }
  let eps = 1.5, s = encode(strokes, eps);
  while (s.length > CH.length * 2900 && eps < 40) { eps *= 1.7; s = encode(strokes, eps); }
  const id = 'g' + Date.now().toString(36), n = Math.ceil(s.length / 2900);
  $('sending').classList.add('show');
  for (let i = 0; i < n; i++) BD.put(CH[i], me, D0, { id, i, s: s.slice(i * 2900, (i + 1) * 2900) });
  BD.put('gbrm', me, D0, { id, w: word.w, alt: word.alt || [], hint: word.hint, lvl: word.lvl, n, at: Date.now(), res: null });
  vib([20, 40, 20]);
  setTimeout(() => { $('sending').classList.remove('show'); show('s-home'); renderHome(); toast(`✈️ Kekirim! ${o()} bakal dikabarin`); confetti(25); }, 1100);
}

/* ── nebak ── */
let G = null, gx = null, playT = null, tries = 0, hints = 0, revealed = new Set();
function startGuess() {
  const m = row('gbrm', o()); if (!m || m.res) { renderHome(); return; }
  if (!chunksOk(m, o())) { toast('⏳ Lagi ngambil gambarnya…'); BD.pull && BD.pull(true); setTimeout(() => chunksOk(m, o()) ? startGuess() : toast('Gambarnya belum nyampe penuh, coba lagi bentar ya'), 3500); return; }
  let s = ''; for (let i = 0; i < m.n; i++) s += row(CH[i], o()).s;
  G = { m, strokes: decode(s) }; tries = 0; hints = 0; revealed = new Set();
  $('g-from').innerHTML = `Dari <b class="by ${o()}">${o()}</b>`; $('g-lv').textContent = '⭐'.repeat(m.lvl);
  $('g-in').value = ''; $('g-tries').textContent = ''; slots();
  show('s-guess'); requestAnimationFrame(() => replay());
}
function slots() { $('g-slots').innerHTML = [...G.m.w].map((ch, i) => ch === ' ' ? '<span class="sp"></span>' : `<span class="${revealed.has(i) ? 'rev' : ''}">${revealed.has(i) ? esc(ch) : ''}</span>`).join(''); $('g-hint').disabled = hints >= 2; }
function replay() {
  cancelAnimationFrame(playT); gx = setupCv($('g-cv'));
  const S = G.strokes, total = S.reduce((a, s) => a + s.p.length, 0), per = Math.max(1, Math.ceil(total / 330));
  let si = 0, pi = 0;
  const step = () => {
    let k = per;
    while (k-- > 0 && si < S.length) { pi++; if (pi >= S[si].p.length) { drawStroke(gx, S[si]); si++; pi = 0; } }
    if (si < S.length) { gx.save(); drawStroke(gx, S[si], pi + 1); gx.restore(); playT = requestAnimationFrame(step); }
  };
  step();
}
function hintLetter() {
  if (hints >= 2) return;
  const idx = [...G.m.w].map((c, i) => i).filter(i => G.m.w[i] !== ' ' && !revealed.has(i));
  if (!idx.length) return;
  revealed.add(idx[Math.floor(Math.random() * idx.length)]); hints++; slots(); toast(hints === 1 ? `💡 Petunjuk: ${G.m.hint || ''}` : '💡 Satu huruf lagi kebuka');
}
function guess() {
  const v = norm($('g-in').value); if (!v) return;
  tries++;
  const ok = [G.m.w].concat(G.m.alt || []).some(a => norm(a) === v);
  if (ok) return finishGuess(true);
  $('g-in').classList.remove('shake'); void $('g-in').offsetWidth; $('g-in').classList.add('shake'); vib(30);
  $('g-tries').textContent = `❌ Bukan “${$('g-in').value.trim()}” — udah ${tries}x coba`; $('g-in').select();
}
$('g-in').addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
function giveUp() { if (!confirm('Nyerah? Jawabannya bakal dikasih tau')) return; finishGuess(false); }
function finishGuess(ok) {
  cancelAnimationFrame(playT);
  const m = G.m, res = { ok, tries, hint: hints, at: Date.now(), by: me };
  BD.put('gbrm', o(), D0, Object.assign({}, m, { res }));
  const P = Object.assign({ pts: 0, h: [] }, row('gbrp', me) || {});
  if (ok) P.pts = (P.pts || 0) + pts(m.lvl, hints);
  P.h = [{ w: m.w, lvl: m.lvl, ok, d: o(), at: Date.now() }].concat(P.h || []).slice(0, 25);
  BD.put('gbrp', me, D0, P);
  $('res').innerHTML = ok
    ? `<div class="e">🎉</div><h2>Bener! “${esc(m.w)}”</h2><p>${tries}x coba${hints ? ` · ${hints} bantuan` : ''} · <b>+${pts(m.lvl, hints)} ⭐</b> buat kalian berdua</p>`
    : `<div class="e">🙈</div><h2>Jawabannya: “${esc(m.w)}”</h2><p>${esc(m.hint || '')}<br>Gapapa, gantian kamu yang bikin ${o()} bingung 😆</p>`;
  $('res').innerHTML += `<button class="btn" style="margin-top:1rem" onclick="newDraw()">🎨 Giliran aku gambar</button><button class="btn ghost" style="margin-top:.5rem" onclick="show('s-home');renderHome()">Ke halaman awal</button>`;
  show('s-res'); if (ok) { confetti(70); vib([30, 40, 80]); } else vib(40);
  try { window.SFX && SFX.play(ok ? 'win' : 'lose'); } catch (e) {}
}

BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if ($('s-home').classList.contains('on') && ev.apps.some(a => /^gbr/.test(a))) renderHome(); });
renderHome();

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
