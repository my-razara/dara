const PAGES = ["<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<title>Gosok Berhadiah — dari Razan 🪙<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1}\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  button{font-family:'Poppins',sans-serif}\n  html,body{background:var(--cream)}\n  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}\n  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 50% 25%,rgba(201,169,110,.28),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 95%,rgba(232,196,176,.4),transparent 70%)}\n  .hand{font-family:'Caveat',cursive}\n  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}\n  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}\n  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}\n  .head{text-align:center;margin:1rem 0 .8rem}\n  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}\n  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .2rem}\n  .title span{color:var(--gold)}\n  .sub{font-size:12.5px;color:var(--muted);line-height:1.6}\n\n  .ticket{position:relative;width:100%;aspect-ratio:1.55;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#fffaf0,#f7ead6);border:2px solid #e2cfae;box-shadow:0 14px 34px rgba(122,90,50,.18)}\n  .ticket::before{content:'';position:absolute;inset:8px;border-radius:16px;border:1.5px dashed rgba(201,169,110,.6);pointer-events:none}\n  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem 1.4rem}\n  .prize .rar{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:2px 10px;border-radius:20px;margin-bottom:.4rem}\n  .rar.c{background:#efe6da;color:var(--muted)} .rar.r{background:#dbe7f7;color:#3f6ea9} .rar.e{background:#efdcf7;color:#7b4aa0} .rar.j{background:linear-gradient(90deg,#c9a96e,#e7c98b,#c9a96e);color:#fff}\n  .prize .e{font-size:clamp(2.2rem,11vw,3rem);line-height:1}\n  .prize .t{font-size:clamp(1.25rem,6vw,1.55rem);color:var(--deep);line-height:1.2;margin-top:.3rem}\n  .prize .d{font-size:11px;color:var(--muted);margin-top:.25rem;line-height:1.45}\n  canvas.scr{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .6s}\n  canvas.scr.gone{opacity:0;pointer-events:none}\n  .pct{text-align:center;font-size:11.5px;color:var(--muted);margin-top:.6rem;min-height:1.3em}\n  .after{display:none;margin-top:.7rem}\n  .after.show{display:block;animation:fi .4s ease}\n  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n  .btn{display:block;width:100%;padding:.9rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d6b77c,#a7834a);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(167,131,74,.3);margin-top:.5rem}\n  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.3)}\n  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}\n  .next{text-align:center;font-size:12px;color:var(--muted);margin-top:.7rem}\n\n  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.8rem 0 .3rem}\n  .stats{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}\n  .stats span{font-size:10.5px;padding:.25rem .65rem;border-radius:20px;background:#fff;border:1px solid rgba(193,122,111,.13);color:var(--muted)}\n  .coll{display:flex;flex-direction:column;gap:.5rem}\n  .ci{display:flex;align-items:center;gap:.7rem;background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:16px;padding:.65rem .8rem}\n  .ci .e{font-size:1.5rem;width:34px;text-align:center;flex-shrink:0}\n  .ci .b{flex:1;min-width:0}\n  .ci .b b{font-size:13px;font-weight:600;display:block;line-height:1.35}\n  .ci .b small{font-size:10.5px;color:var(--muted)}\n  .ci .cl{flex-shrink:0;font-size:11px;font-weight:600;padding:.35rem .7rem;border-radius:50px;border:1.5px solid #25a35a;color:#25a35a;background:#fff;text-decoration:none;white-space:nowrap}\n  .ci .cl.done{border-color:var(--blush);color:var(--muted)}\n  .empty{text-align:center;font-size:12px;color:var(--muted);padding:.8rem}\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.prize{padding:.8rem 1rem}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\"><a href=\"index.html\" class=\"pill\">← Menu utama<\/a><span class=\"pill\" id=\"streak\" style=\"cursor:default\"><\/span><\/div>\n  <div class=\"head\">\n    <p class=\"lbl\">Satu kartu tiap hari<\/p>\n    <h1 class=\"title\">Gosok <span>Berhadiah<\/span> 🪙<\/h1>\n    <p class=\"sub\" id=\"sub\">Gosok bagian emasnya pake jari — isinya bisa pesan, voucher, sampai jackpot!<\/p>\n  <\/div>\n  <div class=\"ticket\" id=\"ticket\"><div class=\"prize\" id=\"prize\"><\/div><canvas class=\"scr\" id=\"scr\"><\/canvas><\/div>\n  <p class=\"pct\" id=\"pct\"><\/p>\n  <div class=\"after\" id=\"after\"><\/div>\n\n  <p class=\"sec\">🎟️ Koleksi hadiah<\/p>\n  <div class=\"stats\" id=\"stats\"><\/div>\n  <div class=\"coll\" id=\"coll\"><\/div>\n<\/div>\n\n<\script>\nconst WA_RAZAN = '6285692740607';\n// r: c = biasa, r = langka, e = epik, j = jackpot · v: true = voucher yang bisa diklaim\nconst PRIZES = [\n  { r: 'c', e: '💌', t: 'Kamu cantik hari ini', d: 'Kayak kemarin. Kayak besok juga.' },\n  { r: 'c', e: '🌷', t: 'Semangat ya sayang!', d: 'Aku bangga sama kamu, beneran.' },\n  { r: 'c', e: '🫶', t: 'Peluk virtual +1', d: 'Ditukar jadi peluk beneran pas ketemu.' },\n  { r: 'c', e: '😘', t: 'Cium jauh 💨', d: 'Udah dikirim, tinggal ditangkap.' },\n  { r: 'c', e: '☀️', t: 'Kamu = alasan aku senyum', d: 'Hari ini juga, pasti.' },\n  { r: 'c', e: '🍀', t: 'Hoki hari ini: 100%', d: 'Karena kamu punya aku 😎' },\n  { r: 'c', e: '🧸', t: 'Boleh manja seharian', d: 'Aku bales chat paling cepet hari ini.' },\n  { r: 'c', e: '🌙', t: 'Tidur nyenyak ya', d: 'Mimpiin aku, kalau sempet.' },\n  { r: 'c', e: '💭', t: 'Aku lagi mikirin kamu', d: 'Iya, sekarang ini.' },\n  { r: 'c', e: '🐣', t: 'Kamu lucu', d: 'Itu aja. Faktanya emang gitu.' },\n  { r: 'r', e: '🍦', t: 'Voucher es krim', d: 'Ditraktir 1 es krim pilihan kamu.', v: true },\n  { r: 'r', e: '🎬', t: 'Voucher film', d: 'Kamu pilih filmnya, aku nonton tanpa protes.', v: true },\n  { r: 'r', e: '📞', t: 'Voucher telpon 30 menit', d: 'Kapan pun kamu mau, aku angkat.', v: true },\n  { r: 'r', e: '🎤', t: 'Voucher dinyanyiin', d: 'Aku nyanyi 1 lagu request kamu (lewat VN).', v: true },\n  { r: 'r', e: '🍜', t: 'Voucher jajan', d: 'Satu jajanan apa aja, ak  }\nfunction pickPrize() {\n  // tiap 7 hari beruntun, rarity minimal Langka\n  const bonus = (streak() + 1) % 7 === 0;\n  let roll = Math.random() * 100, rr = 'c';\n  for (const [k, [, w]] of Object.entries(RAR)) { if (roll < w) { rr = k; break; } roll -= w; }\n  if (bonus && rr === 'c') rr = 'r';\n  // hindari dapet yang sama kayak 5 kartu terakhir\n  const recent = Object.keys(hist).sort().slice(-5).map(k => hist[k].i);\n  let pool = PRIZES.map((p, i) => [p, i]).filter(([p, i]) => p.r === rr && !recent.includes(i));\n  if (!pool.length) pool = PRIZES.map((p, i) => [p, i]).filter(([p]) => p.r === rr);\n  return pool[Math.floor(Math.random() * pool.length)][1];\n}\n\nfunction render() {\n  const t = today();\n  if (!hist[t]) { hist[t] = { i: pickPrize(), s: false, c: false }; lsSet('gosok-hist', hist); }\n  const h = hist[t], P = PRIZES[h.i];\n  $('prize').innerHTML = `<span class=\"rar ${P.r}\">${RAR[P.r][0]}<\/span><span class=\"e\">${P.e}<\/span><p class=\"t hand\">${P.t}<\/p><p class=\"d\">${P.d}<\/p>`;\n  $('streak').textContent = `🔥 ${streak()} hari`;\n  if (h.s) { $('scr').classList.add('gone'); showAfter(false); } else { $('scr').classList.remove('gone'); $('after').classList.remove('show'); drawCover(); $('pct').textContent = 'Gosok bagian emasnya ✨'; }\n  renderColl();\n}\nfunction showAfter(fresh) {\n  const t = today(), h = hist[t], P = PRIZES[h.i];\n  $('pct').textContent = fresh ? '' : 'Kartu hari ini udah digosok';\n  const nextIn = (() => { const n = new Date(); const m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const ms = m - n; return `${Math.floor(ms / 36e5)} jam ${Math.floor(ms % 36e5 / 6e4)} menit`; })();\n  $('after').innerHTML = (P.v ? `<a class=\"btn wa\" target=\"_blank\" rel=\"noopener\" href=\"${claimUrl(t)}\" onclick=\"markClaim('${t}')\">${h.c ? '✓ Udah diklaim · kirim lagi' : '💬 Klaim ke Razan lewat WA'}<\/a>` : `<a class=\"btn ghost\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/${WA_RAZAN}?text=${encodeURI .height = H * dpr;\n  cx = cv.getContext('2d'); cx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  cx.globalCompositeOperation = 'source-over';\n  const g = cx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#d9bd84'); g.addColorStop(.45, '#f3e2b5'); g.addColorStop(.55, '#e3c88f'); g.addColorStop(1, '#b8945a');\n  cx.fillStyle = g; cx.fillRect(0, 0, W, H);\n  cx.globalAlpha = .18; cx.fillStyle = '#fff';\n  for (let y = 0; y < H; y += 26) for (let x = (y / 26 % 2) * 20; x < W; x += 40) { cx.font = '16px serif'; cx.fillText('♡', x, y + 18); }\n  cx.globalAlpha = 1; cx.fillStyle = 'rgba(122,90,50,.75)'; cx.textAlign = 'center'; cx.font = '700 clamp(16px,5vw,20px) Poppins, sans-serif'; cx.font = `700 ${Math.round(Math.min(22, W / 16))}px Poppins, sans-serif`;\n  cx.fillText('GOSOK DI SINI', W / 2, H / 2 - 4); cx.font = `500 ${Math.round(Math.min(14, W / 26))}px Poppins, sans-serif`; cx.fillText('🪙  hadiah dari Razan  🪙', W / 2, H / 2 + 20);\n  done = false;\n}\nfunction pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }\nfunction scratch(a, b) {\n  cx.globalCompositeOperation = 'destination-out'; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.lineWidth = Math.max(28, W / 9);\n  cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke();\n  cx.beginPath(); cx.arc(b[0], b[1], cx.lineWidth / 2, 0, 7); cx.fill();\n}\ncv.addEventListener('pointerdown', e => { if (done) return; e.preventDefault(); scratching = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} last = pos(e); scratch(last, last); });\ncv.addEventListener('pointermove', e => { if (!scratching || done) return; const p = pos(e); scratch(last, p); last = p; const n = performance.now(); if (n - checkT > 140) { checkT = n; vib(4); check(); } });\n['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { scratching = false; if (!done) check(); }));\nfunction check() {\n  const img = cx.getImageData(0, 0, cv.width, cv.height).data; gba(255,255,255,.08);color:rgba(255,255,255,.65);margin-top:.5rem}\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<\!-- INTRO -->\n<div id=\"s-intro\" class=\"screen active\">\n  <div class=\"inner\">\n    <span class=\"intro-icon\">🧸<\/span>\n    <span class=\"intro-label\">Dari Razan buat Dara<\/span>\n    <h1 class=\"intro-title\">Mesin <span>Capit<\/span><\/h1>\n    <p class=\"intro-sub\" id=\"intro-sub\">3 koin per hari — hadiah apapun yang kecapit, itu dari Razan buat kamu! 🎁<\/p>\n    <div class=\"coins\" id=\"intro-coins\"><\/div>\n\n    <div class=\"played-card\" id=\"played-card\" style=\"display:none\">\n      <span class=\"played-label\">Hadiah hari ini<\/span>\n      <span class=\"played-icon\" id=\"pl-icon\">🎁<\/span>\n      <span class=\"played-name\" id=\"pl-name\">-<\/span>\n      <p class=\"played-desc\" id=\"pl-desc\">-<\/p>\n      <div class=\"countdown\"><span class=\"cd-label\">Koin baru dalam<\/span><span class=\"cd-time\" id=\"cd-time\">00:00:00<\/span><\/div>\n      <a class=\"wa-btn\" id=\"pl-wa\" href=\"#\" target=\"_blank\" onclick=\"markClaimed()\">📲 Klaim ke Razan via WA!<\/a>\n    <\/div>\n\n    <button class=\"start-btn\" id=\"play-btn\" onclick=\"startGame()\">Capit Sekarang! 🧸<\/button>\n    <p class=\"tips\" id=\"tips\">💡 Tips: posisiin capit pas di <b>tengah<\/b> hadiah — makin pas, makin kuat nyengkeramnya<\/p>\n\n    <p class=\"section-lbl\" style=\"margin-top:1.2rem\">🗄️ Lemari Hadiah<\/p>\n    <div class=\"prizes-grid\" id=\"collection\"><\/div>\n  <\/div>\n<\/div>\n\n<\!-- GAME -->\n<div id=\"s-game\" class=\"screen\">\n  <div id=\"hud\">\n    <span class=\"hud-coins\" id=\"hud-coins\"><\/span>\n    <span class=\"hud-hint\" id=\"hud-hint\">Tahan ◀ ▶ lalu DROP!<\/span>\n    <span class=\"hud-label\" onclick=\"exitGame()\" style=\"cursor:pointer\">✕ Keluar<\/span>\n  <\/div>\n  <canvas id=\"game-canvas\"><\/canvas>\n  <div id=\"controls\">\n    <button class=\"dir-btn\" id=\"btn-left\">◀<\/button>\n    <button class=\"drop-btn\" id=\"btn-drop\">⬇️<span>DROP<\/span><\/button>\n    <button class=\"dir-btn\" id=\"btn-right\">▶<\/button>\n  <\/div>\n<\/div>\n\n<\!-- WIN -->\n<div id=\"win-overlay\">\n  <span class=\"win-icon\" id=\"win-icon\">🎁<\/span>\n  <span class=\"win-label\" id=\"win-label\">Hadiah hari ini!<\/span>\n  <p class=\"win-title\" id=\"win-title\">Selamat!<\/p>\n  <p class=\"win-prize-name\" id=\"win-prize-name\">-<\/p>\n  <div class=\"win-desc-card\" id=\"win-desc\">-<\/div>\n  <div class=\"countdown\" style=\"max-width:320px;width:100%\"><span class=\"cd-label\">Koin baru dalam<\/span><span class=\"cd-time\" id=\"wc-time\">00:00:00<\/span><\/div>\n  <a class=\"wa-btn\" id=\"win-wa-btn\" href=\"#\" target=\"_blank\" style=\"max-width:320px\" onclick=\"markClaimed();setTimeout(closeWin,500)\">📲 Klaim ke Razan via WA!<\/a>\n  <button class=\"win-btn\" onclick=\"closeWin()\">Nanti aja 🤍<\/button>\n<\/div>\n\n<\script>\n// ═════════ HADIAH ═════════\nconst WA_NUMBER = '6285692740607';\nconst MAX_TRIES = 3;\nconst PRIZES = [\n  {icon:\"\\uD83E\\uDD17\", name:\"Peluk\", desc:\"Aku kasih peluk sekarang, tahan sampai kamu yang minta lepas.\", color:\"#c17a6f\"},\n  {icon:\"\\uD83C\\uDF66\", name:\"Traktir Es Krim\", desc:\"Aku traktir es krim, kamu yang pilih rasanya. Bisa ditagih kapanpun.\", color:\"#f48fb1\"},\n  {icon:\"\\uD83C\\uDFAC\", name:\"Movie Night\", desc:\"Kamu pilih filmnya, aku nonton tanpa protes. Snack juga aku siapin.\", color:\"#7986cb\"},\n  {icon:\"\\uD83C\\uDF5C\", name:\"Makan Bareng\", desc:\"Makan bareng di tempat pilihan kamu, aku yang traktir.\", color:\"#ffb74d\"},\n  {icon:\"\\uD83C\\uDF81\", name:\"Surprise\", desc:\"Aku kasih surprise buat kamu dalam 3 hari ke depan. Kamu ga boleh nanya!\", color:\"#c9a96e\"},\n  {icon:\"\\uD83C\\uDF05\", name:\"Jalan Sore\", desc:\"Jalan sore bareng ke mana aja, kamu yang tentuin.\", color:\"#ff8a65\"},\n  {icon:\"\\uD83D\\uDC86\", name:\"Pijit Gratis\", desc:\"Aku pijitin pundak kamu minimal 10 menit. Kamu yang nilai.\", color:\"#b5c4b1\"},\n  {icon:\"\\uD83D\\uDED2\", name:\"Belanja Bareng\", desc:\"Aku temani kamu belanja ke mana aja, sepuasnya.\", color:\"#9575cd\"},\n];\nconst RARE = { icon:'🌟', name:'Kencan Rahasia', desc:'HADIAH LANGKA! Razan yang nyiapin kencan spesial dari A sampai Z — tempat, waktu, sampai kejutannya dirahasiain. Kamu tinggal dandan cantik 💫', color:'#ffd54f', rare:true };\nconst CONSOLATION = { icon:'🫂', name:'Peluk Penghibur', desc:'Koinnya habis tapi capitnya meleset terus? Tenang — hadiah hiburan tetap buat kamu: peluk penghibur + usap kepala sampai senyum lagi 🤍', color:'#e8c4b0', consolation:true };\n\n// ═════════ PENYIMPANAN ═════════\nconst DAY_KEY = 'mc-daily', COL_KEY = 'mc-koleksi';\nfunction todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }\nfunction getDay() {\n  try {\n    const d = JSON.parse(localStorage.getItem(DAY_KEY) || 'null');\n    if (d && d.date === todayKey()) { if (d.name && d.tries == null) d.tries = MAX_TRIES; return d; } // data versi lama tetap kebaca\n  } catch {}\n  return { date: todayKey(), tries: 0 };\n}\nfunction setDay(d) { try { localStorage.setItem(DAY_KEY, JSON.stringify(d)); } catch {} }\nfunction getCol() { try { return JSON.parse(localStorage.getItem(COL_KEY) || '{}'); } catch { return {}; } }\nfunction addCol(name) { const c = getCol(); c[name] = (c[name] || 0) + 1; try { localStorage.setItem(COL_KEY, JSON.stringify(c)); } catch {} }\nfunction msToReset() { const n = new Date(); return Math.max(0, new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n); }\nfunction fmtTime(ms) { const s = Math.floor(ms / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2, '0')).join(':'); }\nfunction waLink(p) { return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent('Hiii Sayangg!! Aku baru aja capit ' + p.icon + ' ' + p.name + ' dari Mesin Capit! ' + p.desc + ' Aku mau klaim yaaa 🤍'); }\n\nconst $ = id => document.getElementById(id);\nlet cdIv = null;\nfunction startCd() {\n  clearInterval(cdIv);\n  const tick = () => { const t = fmtTime(msToReset()); ['cd-time', 'wc-time'].forEach(id => { const e = $(id); if (e) e.textContent = t; }); if (msToReset() <= 0) { clearInterval(cdIv); location.reload(); } };\n  tick(); cdIv = setInterval(tick, 1000);\n}\nfunction coinsHTML(used) { return Array.from({ length: MAX_TRIES }, (_, i) => `<span class=\"${i < used ? 'used' : ''}\">🪙<\/span>`).join(''); }\n\nfunction checkDaily() {\n  const d = getDay();\n  const won = !!d.name;\n  $('played-card').style.display = won ? 'block' : 'none';\n  $('play-btn').style.display = won ? 'none' : 'block';\n  $('tips').style.display = won ? 'none' : '';\n  $('intro-coins').innerHTML = won ? '' : coinsHTML(d.tries);\n  $('intro-sub').textContent = won ? 'Hadiah hari ini udah kecapit — balik lagi besok buat koin baru! 🪙' : (d.tries ? `Sisa ${MAX_TRIES - d.tries} koin hari ini — semangat! 💪` : '3 koin per hari — hadiah apapun yang kecapit, itu dari Razan buat kamu! 🎁');\n  if (won) {\n    $('pl-icon').textContent = d.icon; $('pl-name').textContent = d.icon + ' ' + d.name; $('pl-desc').textContent = d.desc;\n    const wa = $('pl-wa'); wa.href = waLink(d);\n    wa.classList.toggle('done', !!d.claimed); wa.textContent = d.claimed ? '✓ Udah diklaim · kirim ulang' : '📲 Klaim ke Razan via WA!';\n    startCd();\n  }\n  // lemari hadiah\n  const col = getCol(), all = [...PRIZES, RARE, CONSOLATION];\n  $('collection').innerHTML = all.map(p => { const n = col[p.name] || 0;\n    return `<div class=\"pg-item ${n ? '' : 'locked'} ${p.rare ? 'rare' : ''}\">${n ? `<span class=\"pg-count\">${n}<\/span>` : ''}<span class=\"pg-icon\">${n || !p.rare ? p.icon : '❔'}<\/span><span class=\"pg-label\">${n || !p.rare ? p.name : '???'}<\/span><\/div>`; }).join('');\n}\nfunction markClaimed() { const d = getDay(); if (d.name) { d.claimed = true; setDay(d); } setTimeout(checkDaily, 300); }\n\n// ═════════ CANVAS & STATE ═════════\nlet canvas = $('game-canvas'), ctx = canvas.getContext('2d');\nlet W, H, DPR, mX, mY, mW, mH, floorY, topY;\nlet claw = null, prizes = [], held = null, moveDir = 0, raf = null, frame = 0, token = 0;\nconst CTRL_H = 96;\nfunction rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }\n\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }\nfunction layout() {\n  DPR = Math.min(window.devicePixelRatio || 1, 2.5);\n  W = window.innerWidth; H = window.innerHeight;\n  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);\n  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  mW = Math.min(W - 16, 380); mX = (W - mW) / 2; mY = 62; mH = H - CTRL_H - mY - 10;\n  topY = mY + 30; floorY = mY + mH * .9;\n}\n\nfunction buildPrizes() {\n  const list = [...PRIZES].sort(() => Math.random() - .5);\n  const withRare = Math.random() < .3;\n  const cols = 4, rows = 2, pw = mW / cols, ph = (mH * .5) / rows, sy = mY + mH * .42;\n  if (withRare) list[4 + Math.floor(Math.random() * 4)] = { ...RARE, small: true }; // hadiah langka ngambil 1 slot di baris belakang\n  prizes = list.map((p, i) => ({ ...p, rx: (i % cols + .5) / cols + (Math.random() - .5) * .03, row: Math.floor(i / cols), wb: Math.random() * 6.28, ws: p.rare ? .03 : .018 + Math.random() * .01, gone: false }));\n  placePrizes();\n}\nfunction placePrizes() {\n  const ph = (mH * .5) / 2, sy = mY + mH * .42, pw = mW / 4;\n  prizes.forEach(p => { p.r = Math.min(pw, ph) * (p.small ? .22 : .32); p.x = mX + p.rx * mW; p.y = sy + p.row * ph + ph / 2; });\n}\n\nfunction startGame() {\n  const d = getDay();\n  if (d.name || d.tries >= MAX_TRIES) { toast('Koin hari ini udah habis — balik besok ya 🪙'); return; }\n  showScreen('s-game');\n  requestAnimationFrame(() => {\n    layout(); buildPrizes(); resetClaw();\n    token++; const my = token; let last = performance.now();\n    const loop = now => { if (my !== token) return; const k = Math.min(2.5, (now - last) / 16.67); last = now; frame++; update(k); draw(); raf = requestAnimationFrame(loop); };\n    raf = requestAnimationFrame(loop);\n  });\n}\nfunction resetClaw() { claw = { x: mX + mW / 2, y: topY, state: 'idle', open: .45, grip: 0 }; held = null; setCtrl(true); updHud(); }\nfunction updHud() { const d = getDay(); $('hud-coins').innerHTML = coinsHTML(d.tries); }\nfunction exitGame() { token++; cancelAnimationFrame(raf); moveDir = 0; showScreen('s-intro'); checkDaily(); }\n\n// ═════════ KONTROL (pointer, anti nyangkut) ═════════\nfunction bindHold(id, dir) {\n  const el = $(id);\n  const on = e => { e.preventDefault(); if (el.disabled) return; moveDir = dir; el.classList.add('held'); try { el.setPointerCapture(e.pointerId); } catch {} };\n  const off = () => { if (moveDir === dir) moveDir = 0; el.classList.remove('held'); };\n  el.addEventListener('pointerdown', on);\n  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, off));\n  el.addEventListener('contextmenu', e => e.preventDefault());\n}\nbindHold('btn-left', -1); bindHold('btn-right', 1);\n$('btn-drop').addEventListener('click', drop);\ndocument.addEventListener('keydown', e => {\n  if (!$('s-game').classList.contains('active')) return;\n  if (e.key === 'ArrowLeft') moveDir = -1; if (e.key === 'ArrowRight') moveDir = 1; if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); drop(); }\n});\ndocument.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') moveDir = 0; });\nfunction setCtrl(on) { ['btn-left', 'btn-right', 'btn-drop'].forEach(id => $(id).disabled = !on); if (!on) moveDir = 0; }\n\nfunction drop() {\n  if (!claw || claw.state !== 'idle') return;\n  const d = getDay(); d.tries++; setDay(d); updHud();\n  claw.state = 'drop'; claw.open = .5; setCtrl(false);\n  $('hud-hint').textContent = 'Deg-degan... 😬';\n  try { navigator.vibrate && navigator.vibrate(20); } catch {}\n}\n\n// ═════════ LOGIKA CAPIT ═════════\nfunction update(k) {\n  prizes.forEach(p => p.wb += p.ws * k);\n  if (claw.state === 'idle' && moveDir) claw.x = Math.max(mX + 22, Math.min(mX + mW - 22, claw.x + moveDir * 3.4 * k));\n  if (claw.state === 'drop') {\n    claw.y += 4.2 * k;\n    const tipY = claw.y + 34;\n    for (const p of prizes) {\n      if (p.gone) continue;\n      const dx = claw.x - p.x;\n      if (Math.abs(dx) < p.r + 12 && tipY >= p.y - p.r * .3) {\n        // makin pas di tengah, makin kuat cengkeramannya\n        const grip = Math.max(0, 1 - Math.abs(dx) / (p.r * 1.15));\n        const chance = p.rare ? .15 + .6 * grip : .3 + .62 * grip;\n        claw.state = 'grab'; claw.t = 0;\n        if (Math.random() < chance) { held = p; p.gone = true; claw.grip = grip; }\n        else { held = null; p.nudge = dx > 0 ? -1 : 1; }\n        return;\n      }\n    }\n    if (tipY >= floorY) { claw.state = 'grab'; claw.t = 0; held = null; }\n  }\n  if (claw.state === 'grab') {\n    claw.t += k; claw.open = Math.max(.06, claw.open - .03 * k);\n    // hadiah yang gagal dicapit kegeser dikit\n    prizes.forEach(p => { if (p.nudge) { p.rx = Math.max(.08, Math.min(.92, p.rx + p.nudge * .006 * k)); p.x = mX + p.rx * mW; if (claw.t > 18) p.nudge = 0; } });\n    if (claw.t > 20) { claw.state = 'rise'; claw.slipAt = held && Math.random() < (1 - claw.grip) * .38 ? topY + (claw.y - topY) * (.35 + Math.random() * .4) : null; if (!held) toast(pick(['Yah meleset! 😅', 'Hampir! Geser dikit lagi 👀', 'Capitnya licin 🙈'])); }\n  }\n  if (claw.state === 'rise') {\n    claw.y -= 3.6 * k;\n    if (held && claw.slipAt && claw.y <= claw.slipAt) {\n      // hadiah lepas di tengah jalan 😭\n      held.gone = false; held.rx = Math.max(.08, Math.min(.92, (claw.x - mX) / mW + (Math.random() - .5) * .08)); held.x = mX + held.rx * mW;\n      held.fall = claw.y + 40; held = null; claw.open = .45;\n      toast('NOOO lepas! 😭 Cengkeramannya kurang pas'); try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch {}\n    }\n    if (claw.y <= topY) {\n      claw.y = topY;\n      if (held) { claw.state = 'done'; setTimeout(() => win(held), 450); }\n      else afterMiss();\n    }\n  }\n  prizes.forEach(p => { if (p.fall != null) { p.fall += 6 * k; if (p.fall >= p.y) p.fall = null; } });\n}\nfunction pick(a) { return a[Math.floor(Math.random() * a.length)]; }\n\nfunction afterMiss() {\n  const d = getDay();\n  if (d.tries >= MAX_TRIES) { claw.state = 'done'; setTimeout(() => win(CONSOLATION), 600); return; }\n  claw.state = 'idle'; claw.open = .45; setCtrl(true);\n  $('hud-hint').textContent = `Sisa ${MAX_TRIES - d.tries} koin — coba lagi! 💪`;\n}\n\n// ═════════ MENANG ═════════\nfunction win(p) {\n  token++; cancelAnimationFrame(raf);\n  const d = getDay(); Object.assign(d, { icon: p.icon, name: p.name, desc: p.desc, claimed: false }); setDay(d);\n  addCol(p.name);\n  $('win-icon').textContent = p.icon;\n  $('win-label').textContent = p.rare ? '🌟 HADIAH LANGKA! 🌟' : p.consolation ? 'Hadiah hiburan' : 'Hadiah hari ini!';\n  $('win-title').textContent = p.consolation ? 'Koinnya habis, tapi...' : `Dapat ${p.name}!`;\n  $('win-prize-name').textContent = p.icon + ' ' + p.name;\n  $('win-desc').textContent = p.desc + (p.consolation ? '' : d.tries === 1 ? ' (Sekali capit langsung dapet — jago! 🏆)' : '');\n  $('win-wa-btn').href = waLink(p);\n  $('win-overlay').classList.add('show');\n  startCd();\n  confetti(p.rare ? 140 : p.consolation ? 40 : 80);\n  try { navigator.vibrate && navigator.vibrate(p.rare ? [60, 30, 60, 30, 200] : [50, 30, 120]); } catch {}\n}\nfunction closeWin() { $('win-overlay').classList.remove('show'); showScreen('s-intro'); checkDaily(); }\n\n// ═════════ GAMBAR ═════════\nfunction draw() {\n  // [RINGAN] latar + bodi mesin (pakai glow) cuma digambar ulang kalau ukuran layar berubah\n  const bk = [W, H, DPR, mX, mY, mW, mH, floorY].join('|');\n  if (!BGL || BGL.k !== bk) {\n    const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);\n    const bg = g.createRadialGradient(W / 2, 0, 0, W / 2, H, Math.max(W, H)); bg.addColorStop(0, '#1a0a30'); bg.addColorStop(1, '#070212'); g.fillStyle = bg; g.fillRect(0, 0, W, H);\n    g.save(); g.shadowColor = 'rgba(233,30,140,.3)'; g.shadowBlur = 20; const r = 14;\n    g.beginPath(); g.moveTo(mX + r, mY); g.arcTo(mX + mW, mY, mX + mW, mY + mH, r); g.arcTo(mX + mW, mY + mH, mX, mY + mH, r); g.arcTo(mX, mY + mH, mX, mY, r); g.arcTo(mX, mY, mX + mW, mY, r); g.closePath();\n    g.fillStyle = 'rgba(255,255,255,.025)'; g.fill(); g.strokeStyle = 'rgba(233,30,140,.4)'; g.lineWidth = 2; g.stroke(); g.restore();\n    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(mX + 10, mY + 6, mW - 20, 4);\n    g.fillStyle = 'rgba(255,255,255,.04)'; g.fillRect(mX + 8, floorY, mW - 16, mY + mH - floorY - 8);\n    BGL = { k: bk, c };\n  }\n  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(BGL.c, 0, 0); ctx.restore();\n  // lampu\n  ['#ff8fab', '#c9a96e', '#b5c4b1', '#8ab4f8', '#ff8fab', '#c9a96e'].forEach((c, i) => {\n    const lx = mX + 20 + (mW - 40) / 5 * i, a = .3 + Math.sin(frame * .06 + i * .9) * .3;\n    ctx.beginPath(); ctx.arc(lx, mY - 10, 5, 0, Math.PI * 2); ctx.fillStyle = c; ctx.globalAlpha = a; ctx.fill(); ctx.globalAlpha = 1; m:1.25rem}\n    .top-sub{margin-bottom:1.25rem}\n  }\n  @media (prefers-reduced-motion:reduce){.star{animation:none}}\n\n  :root{--gold:#c9a96e}\n\n  /* Confetti */\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<\!-- Stars -->\n<\script>\nfor(let i=0;i<50;i++){\n  const s=document.createElement('div');s.className='star';\n  const sz=Math.random()*2+.5;\n  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;\n  document.body.appendChild(s);\n}\n<\/script>\n\n<a href=\"index.html\" class=\"back-link\">← Menu utama<\/a>\n\n<div class=\"wrap\">\n  <span class=\"top-label\">Dari Razan, buat kamu<\/span>\n  <h1 class=\"top-title\">Mystery <span>Box<\/span><\/h1>\n  <p class=\"top-sub\">Ada sesuatu di dalam kotak ini. Tapi dia keras kepala — perlu diklik berkali-kali sebelum mau buka 😏<\/p>\n\n  <div class=\"box-wrap\" id=\"box-wrap\" onclick=\"onBoxClick()\" role=\"button\" aria-label=\"Kotak misteri, tap buat buka\">\n    <div class=\"box-glow\"><\/div>\n    <div class=\"box\" id=\"box\">\n      <\!-- Lid -->\n      <div class=\"box-lid\" id=\"box-lid\"><\/div>\n      <div class=\"box-bow\" id=\"box-bow\">\n        <div class=\"bow-left\"><\/div>\n        <div class=\"bow-right\"><\/div>\n        <div class=\"bow-center\"><\/div>\n      <\/div>\n      <\!-- Body -->\n      <div class=\"box-body\">\n        <div class=\"box-ribbon-h\"><\/div>\n        <div class=\"box-crack\" id=\"box-crack\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"progress-dots\" id=\"progress-dots\"><\/div>\n  <div class=\"click-counter\" id=\"click-counter\">Klik kotak untuk mulai...<\/div>\n  <button class=\"tap-btn\" id=\"tap-btn\" onclick=\"onBoxClick()\">Buka! 🎁<\/button>\n  <button class=\"skip-link\" id=\"skip-link\" onclick=\"showReveal()\">Udah pernah kebuka — liat isinya langsung<\/button>\n<\/div>\n\n<\!-- Reveal -->\n<div id=\"reveal\">\n  <span class=\"reveal-icon\">🎁<\/span>\n  <span class=\"reveal-label\">Isi Mystery Box<\/span>\n  <p class=\"reveal-main\">\"Hadiahnya sebenarnya<br>bukan ini.<br><span>Hadiahnya kamu.\"<\/span><\/p>\n  <p class=\"reveal-sub\">— Dari Razan, yang bersyukur setiap hari punya kamu 🤍<\/p>\n  <button class=\"reveal-btn\" onclick=\"resetBox()\">Buka Lagi 🔄<\/button>\n  <div class=\"reveal-row\">\n    <a class=\"wa\" id=\"reveal-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">💬 Bales ke Razan<\/a>\n    <a href=\"index.html\">🏠 Menu utama<\/a>\n  <\/div>\n<\/div>\n\n<\script>\nconst MAX_CLICKS = 10;\nconst MESSAGES = [\n  'Coba lagi...',\n  'Masih terkunci nih 🔒',\n  'Hmm, belum mau buka',\n  'Diklik lagi dong...',\n  'Sabar ya... bentar lagi',\n  'Sedikit lagi! 👀',\n  'Hampir! Hampir!',\n  'Eh tunggu sebentar...',\n  'Okeee... siap-siap ya',\n  '...',\n];\n\nlet clicks = 0;\nlet isOpening = false;\nlet lastClick = 0;\nconst K_OPENED = 'mystery-box-opened';\nlet openedCount = 0;\ntry { openedCount = +localStorage.getItem(K_OPENED) || 0; } catch (e) {}\nif (openedCount > 0) document.getElementById('skip-link').classList.add('show');\ndocument.getElementById('reveal-wa').href = 'https://wa.me/6285692740607?text=' + encodeURIComponent('Razan, aku udah buka Mystery Box-nya 🎁\\n\\n');\n\n// Build progress dots\nfunction buildDots(){\n  const el=document.getElementById('progress-dots');\n  el.innerHTML='';\n  for(let i=0;i<MAX_CLICKS;i++){\n    const d=document.createElement('div');\n    d.className='dot'+(i<clicks?' filled':'');\n    d.id=`dot-${i}`;\n    el.appendChild(d);\n  }\n}\nbuildDots();\n\nfunction onBoxClick(){\n  const now=Date.now();\n  if(now-lastClick<250)return; // debounce\n  lastClick=now;\n  if(isOpening||clicks>=MAX_CLICKS)return;\n\n  clicks++;\n  buildDots();\n\n  const box=document.getElementById('box');\n  const counter=document.getElementById('click-counter');\n  const wrap=document.getElementById('box-wrap');\n\n  // Shake — makin lama makin heboh\n  box.style.setProperty('--amp', (1 + clicks / MAX_CLICKS * 1.4).toFixed(2));\n  document.getElementById('box-crack').style.opacity = clicks >= MAX_CLICKS - 3 ? ((clicks - (MAX_CLICKS - 4)) / 4).toFixed(2) : 0;\n  try { navigator.vibrate && navigator.vibrate(clicks >= MAX_CLICKS ? [40, 60, 80] : 12 + clicks * 4); } catch (e) {}\n  box.classList.remove('shake');\n  void box.offsetWidth;\n  box.classList.add('shake');\n  setTimeout(()=>box.classList.remove('shake'),300);\n\n  // Glow on\n  wrap.classList.add('active');\n\n  // Float question mark\n  spawnQmark();\n\n  // Update message\n  if(clicks<MAX_CLICKS){\n    counter.textContent=MESSAGES[clicks-1];\n    counter.classList.remove('hot');\n    void counter.offsetWidth;\n    counter.classList.add('hot');\n    setTimeout(()=>counter.classList.remove('hot'),300);\n  }\n\n  // Open!\n  if(clicks>=MAX_CLICKS){\n    isOpening=true;\n    counter.textContent='...';\n    document.getElementById('tap-btn').disabled=true;\n\n    setTimeout(()=>{\n      // Lid flies off\n      document.getElementById('box-lid').classList.add('open');\n      document.getElementById('box-bow').classList.add('open');\n\n      // Box pop\n      box.classList.remove('pop');\n      void box.offsetWidth;\n      box.classList.add('pop');\n\n      // Particles burst\n      for(let i=0;i<20;i++) setTimeout(()=>spawnQmark(true),i*60);\n\n      setTimeout(()=>{\n        confetti(100);\n        setTimeout(showReveal,400);\n      },500);\n    },300);\n  }\n}\n\nfunction spawnQmark(gold=false){\n  const wrap=document.getElementById('box-wrap');\n  const rect=wrap.getBoundingClientRect();\n  const el=document.createElement('div');\n  el.className='qmark';\n  el.textContent=gold?'✨':'?';\n  el.style.cssText=`\n    left:${rect.left+Math.random()*rect.width}px;\n    top:${rect.top+Math.random()*rect.height*0.5}px;\n    animation-duration:${.6+Math.random()*.8}s;\n    animation-delay:${Math.random()*.2}s;\n    font-size:${gold?'1.5rem':'1rem'};\n    color:${gold?'#c9a96e':'rgba(201,169,110,.6)'};\n  `;\n  document.body.appendChild(el);\n  setTimeout(()=>el.remove(),1200);\n}\n\nfunction showReveal(){\n  document.getElementById('reveal').classList.add('show');\n  openedCount++;\n  try { localStorage.setItem(K_OPENED, openedCount); } catch (e) {}\n  document.getElementById('skip-link').classList.add('show');\n}\ndocument.addEventListener('keydown', e => {\n  if ((e.key === ' ' || e.key === 'Enter') && !document.getElementById('reveal').classList.contains('show') && e.target === document.body) { e.preventDefault(); onBoxClick(); }\n});\n\nfunction resetBox(){\n  clicks=0;isOpening=false;\n  document.getElementById('reveal').classList.remove('show');\n  document.getElementById('box-lid').classList.remove('open');\n  document.getElementById('box-bow').classList.remove('open');\n  document.getElementById('box-wrap').classList.remove('active');\n  document.getElementById('click-counter').textContent='Klik kotak untuk mulai...';\n  document.getElementById('tap-btn').disabled=false;\n  const box=document.getElementById('box');\n  box.classList.remove('shake','pop');\n  box.style.removeProperty('--amp');\n  document.getElementById('box-crack').style.opacity = 0;\n  buildDots();\n}\n\nfunction confetti(n=60){\n  const colors=['#c9a96e','#fff','#f0d080','#ffb3c6','#b8d4f0'];\n  for(let i=0;i<n;i++) setTimeout(()=>{\n    const el=document.createElement('div');el.className='cp';\n    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;\n    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);\n  },i*20);\n}\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam game/hadiah gabungan: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>"];
const K = 'hub-hadiah';
let cur = null;
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function paint() {
  document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="${i === cur ? 'on' : ''}" data-i="${i}">${t[0]} ${t[1]}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i) {
  if (i === cur) return;
  cur = i; lsSet(K, i); paint();
  const f = document.getElementById('frame');
  f.querySelectorAll('iframe').forEach(x => x.remove());          // cuma 1 yang jalan, biar musiknya ga dobel
  document.getElementById('load').style.display = '';
  const fr = document.createElement('iframe');
  fr.srcdoc = PAGES[i]; fr.title = TABS[i][1];
  fr.onload = () => document.getElementById('load').style.display = 'none';
  f.appendChild(fr);
  try { history.replaceState(null, '', location.pathname + '?m=' + i); } catch (e) {}
}
const q = location.search.match(/[?&]m=(\d)/);
go(q ? Math.min(TABS.length - 1, +q[1]) : Math.min(TABS.length - 1, lsGet(K, 0)));
