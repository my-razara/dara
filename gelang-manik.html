<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Gelang Manik — Razan & Dara 📿</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .cvw{background:radial-gradient(circle at 50% 45%,#fff,#fbf0e8);border-radius:24px;box-shadow:0 8px 24px rgba(193,122,111,.14);margin:.6rem 0;touch-action:manipulation}
  #cv{display:block;width:100%;height:auto;cursor:pointer}
  .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem}
  .pal button{aspect-ratio:1;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;color:#7a3f35}
  .pal button.on{outline:2.5px solid var(--rose);outline-offset:1px;transform:scale(1.08)}
  .tabs{display:flex;gap:.3rem;margin-bottom:.6rem;background:var(--warm);border-radius:50px;padding:.25rem}
  .tabs button{flex:1;border:none;background:none;padding:.45rem .2rem;border-radius:50px;font-size:12px;color:var(--muted);cursor:pointer}
  .tabs button.on{background:#fff;color:var(--deep);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .wordrow{display:flex;gap:.4rem}
  .wordrow .inp{flex:1;text-transform:uppercase;letter-spacing:.15em}
  .wordrow button{flex-shrink:0;border:none;border-radius:14px;padding:0 .9rem;background:var(--rose);color:#fff;font-weight:600;cursor:pointer}
  .tl{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin:.3rem 0 .6rem}
  .tl button{font-size:12px;padding:.45rem .8rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--deep);cursor:pointer}
  .hint{text-align:center;font-size:11.5px;color:var(--muted)}
  .saved{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .saved div{background:#fff;border-radius:16px;padding:.3rem;cursor:pointer;border:1px solid rgba(193,122,111,.13);text-align:center;font-size:10px;color:var(--muted)}
  .saved img{width:100%;display:block}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who-btn"></button></div>
  <div class="head"><span class="ico">📿</span><p class="lbl">Kerajinan tangan</p><h1 class="title">Gelang <span>Manik</span></h1><p class="sub">Rangkai gelang manik-manik buat pasangan — pilih warna, tambahin huruf nama, simpan jadi gambar. Siapa tau nanti dibikin beneran 😉</p></div>
  <div class="cvw"><canvas id="cv" width="720" height="720"></canvas></div>
  <p class="hint" id="hint">Pilih manik di bawah, terus tap lingkaran gelangnya</p>
  <div class="tl"><button onclick="resize(-2)">➖ Manik</button><span class="pill" id="cnt" style="cursor:default"></span><button onclick="resize(2)">➕ Manik</button></div>
  <div class="card">
    <div class="tabs" id="tabs"><button data-t="w">🎨 Warna</button><button data-t="s">✨ Spesial</button><button data-t="h">🔤 Huruf</button></div>
    <div id="pane"></div>
  </div>
  <div class="tl"><button onclick="fillAll()">🪣 Isi semua</button><button onclick="pattern()">🌈 Pola acak</button><button onclick="undo()">↩️ Batal</button><button onclick="clearAll()">🧽 Kosongin</button></div>
  <label class="lab">🧵 Tali</label><div class="chips" id="tali" style="margin-bottom:.8rem"></div>
  <button class="btn" onclick="saveImg()">📸 Simpan / kirim gambar gelang</button>
  <button class="btn ghost" style="margin-top:.5rem" onclick="keep()">💾 Simpan ke koleksi</button>
  <div class="sec">Koleksi gelang</div>
  <div class="saved" id="saved"></div>
</div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

let me = whoBtn('gm-me', () => { me = lsGet('gm-me', 'Dara'); draw(); });
const COLS = ['#f4a7b0', '#e86a7a', '#f7c59f', '#f3d36b', '#a8d8a0', '#6fbf9a', '#9fd0f0', '#4a7fc1', '#c9b6ea', '#8c6bc4', '#ffffff', '#2d1f1a', '#c9a96e', '#e8c4b0', '#ff9e6d', '#7fd6d0'];
const SPC = [['pearl', '🫧', 'Mutiara'], ['heart', '💗', 'Hati'], ['star', '⭐', 'Bintang'], ['gold', '🟡', 'Emas'], ['flower', '🌸', 'Bunga'], ['moon', '🌙', 'Bulan'], ['clear', '🔮', 'Kristal'], ['evil', '🧿', 'Mata biru']];
const TALI = [['#e8d6c4', 'Krem'], ['#2d1f1a', 'Hitam'], ['#d9776b', 'Merah'], ['#c9a96e', 'Emas']];
const cv = $('cv'), g = cv.getContext('2d'), S = 720, CX = 360, CY = 360;
let st = lsGet('gm-cur', null) || { n: 22, b: [], tali: TALI[0][0] }, tab = 'w', sel = { t: 'c', c: COLS[0] }, hist = [], spin = 0;
function R() { return 240; }
function br() { return Math.min(30, Math.PI * R() / st.n * .92); }
function pos(i) { const a = -Math.PI / 2 + i / st.n * Math.PI * 2; return [CX + Math.cos(a) * R(), CY + Math.sin(a) * R()]; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255, f = v => Math.max(0, Math.min(255, Math.round(v + (k > 0 ? (255 - v) * k : v * k)))); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
function ball(x, y, r, c) { const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); gr.addColorStop(0, shade(c, .65)); gr.addColorStop(.55, c); gr.addColorStop(1, shade(c, -.35)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(x - r * .35, y - r * .4, r * .22, r * .14, -.6, 0, 7); g.fill(); }
function heartP(x, y, r) { g.beginPath(); g.moveTo(x, y + r * .8); g.bezierCurveTo(x - r * 1.3, y - r * .1, x - r * .6, y - r * 1.1, x, y - r * .35); g.bezierCurveTo(x + r * .6, y - r * 1.1, x + r * 1.3, y - r * .1, x, y + r * .8); g.fill(); }
function starP(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.fill(); }
function bead(b, x, y, r) {
  if (!b) { g.strokeStyle = 'rgba(193,122,111,.35)'; g.setLineDash([4, 5]); g.lineWidth = 2; g.beginPath(); g.arc(x, y, r * .8, 0, 7); g.stroke(); g.setLineDash([]); return; }
  if (b.t === 'c') return ball(x, y, r, b.c);
  if (b.t === 'l') { g.fillStyle = '#fffaf2'; g.strokeStyle = '#d8c7b6'; g.lineWidth = 2; g.beginPath(); g.roundRect ? g.roundRect(x - r, y - r * .85, r * 2, r * 1.7, r * .35) : g.rect(x - r, y - r * .85, r * 2, r * 1.7); g.fill(); g.stroke(); g.fillStyle = b.c || '#7a3f35'; g.font = `700 ${r * 1.15}px Poppins,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(b.ch, x, y + r * .05); return; }
  const k = b.k;
  if (k === 'pearl') { ball(x, y, r, '#f6efe6'); g.fillStyle = 'rgba(255,220,230,.25)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  else if (k === 'gold') ball(x, y, r * .8, '#d4ad55');
  else if (k === 'clear') { const gr = g.createRadialGradient(x - r * .3, y - r * .3, 1, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.7, 'rgba(200,220,255,.45)'); gr.addColorStop(1, 'rgba(150,170,220,.7)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = 'rgba(150,170,220,.8)'; g.lineWidth = 1.5; g.stroke(); }
  else if (k === 'evil') { ball(x, y, r, '#2b5fb8'); g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r * .55, 0, 7); g.fill(); g.fillStyle = '#7fc4f0'; g.beginPath(); g.arc(x, y, r * .38, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(x, y, r * .18, 0, 7); g.fill(); }
  else { g.fillStyle = { heart: '#e8546a', star: '#f3c33a', flower: '#f49ac1', moon: '#f0d27a' }[k]; g.save(); g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 4; g.shadowOffsetY = 2;
    if (k === 'heart') heartP(x, y, r); else if (k === 'star') starP(x, y, r * 1.05);
    else if (k === 'flower') { for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; g.beginPath(); g.arc(x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5, r * .48, 0, 7); g.fill(); } g.fillStyle = '#ffe07a'; g.beginPath(); g.arc(x, y, r * .3, 0, 7); g.fill(); }
    else if (k === 'moon') { g.beginPath(); g.arc(x, y, r * .9, 0, 7); g.fill(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(x + r * .45, y - r * .3, r * .75, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over'; }
    g.restore(); }
}
function draw(forExport) {
  g.clearRect(0, 0, S, S);
  if (forExport) { const bg = g.createRadialGradient(CX, CY, 50, CX, CY, 520); bg.addColorStop(0, '#fffaf4'); bg.addColorStop(1, '#f6e1d6'); g.fillStyle = bg; g.fillRect(0, 0, S, S); }
  g.strokeStyle = st.tali; g.lineWidth = 5; g.beginPath(); g.arc(CX, CY, R(), 0, 7); g.stroke();
  // simpul
  const r = br(), [kx, ky] = [CX, CY + R()];
  g.save(); g.strokeStyle = st.tali; g.lineWidth = 4; g.beginPath(); g.moveTo(kx - 8, ky + r + 4); g.quadraticCurveTo(kx - 22, ky + r + 40, kx - 12, ky + r + 58); g.moveTo(kx + 8, ky + r + 4); g.quadraticCurveTo(kx + 22, ky + r + 40, kx + 14, ky + r + 56); g.stroke(); g.restore();
  for (let i = 0; i < st.n; i++) { const [x, y] = pos(i + .5); bead(st.b[i], x, y, r); }
  const isL = i => { const b = st.b[(i + st.n) % st.n]; return b && b.t === 'l'; };
  let s0 = -1; for (let i = 0; i < st.n; i++) if (isL(i) && !isL(i - 1)) { s0 = i; break; }
  let word = ''; if (s0 >= 0) for (let k = 0; k < st.n; k++) { const i = (s0 + k) % st.n; if (isL(i)) word += st.b[i].ch; else if (word && !word.endsWith(' ')) word += ' '; }
  word = word.trim();
  g.fillStyle = '#9a8070'; g.font = '600 26px Poppins,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (forExport) { g.font = '700 46px Caveat,cursive'; g.fillStyle = '#7a3f35'; g.fillText(`buat ${otherOf(me)} 💗`, CX, CY - 14); g.font = '400 20px Poppins,sans-serif'; g.fillStyle = '#9a8070'; g.fillText(`dirangkai ${me} · ${fmtD(new Date())}`, CX, CY + 30); }
  else if (!st.b.some(Boolean)) { g.fillText('tap lingkaran 👆', CX, CY); }
  else { g.font = '700 40px Caveat,cursive'; g.fillStyle = '#c17a6f'; g.fillText(word || '📿', CX, CY); }
  $('cnt').textContent = `${st.b.filter(Boolean).length}/${st.n} manik`;
}
function persist() { lsSet('gm-cur', st); }
function push() { hist.push(JSON.stringify(st)); if (hist.length > 60) hist.shift(); }
function undo() { if (!hist.length) return; st = JSON.parse(hist.pop()); persist(); draw(); }
cv.addEventListener('click', e => {
  const rc = cv.getBoundingClientRect(), x = (e.clientX - rc.left) / rc.width * S, y = (e.clientY - rc.top) / rc.height * S, d = Math.hypot(x - CX, y - CY);

function resize(d) { const n = Math.max(12, Math.min(32, st.n + d)); if (n === st.n) return; push(); st.n = n; st.b = st.b.slice(0, n); persist(); draw(); }

  push(); const pk = () => COLS[Math.floor(Math.random() * COLS.length)], a = pk(), b = pk(), c = pk(), mode = Math.floor(Math.random() * 3), sp = SPC[Math.floor(Math.random() * SPC.length)][0];

function putWord() {

}
function paintPane() {
  $('tabs').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; paintPane(); }; });
  if (tab === 'w') { $('pane').innerHTML = `<div class="pal">${COLS.map(c => `<button style="background:${c}" class="${sel.t === 'c' && sel.c === c ? 'on' : ''}" data-c="${c}"></button>`).join('')}</div>`; $('pane').querySelectorAll('button').forEach(b => b.onclick = () => { sel = { t: 'c', c: b.dataset.c }; paintPane(); }); }
  else if (tab === 's') { $('pane').innerHTML = `<div class="pal">${SPC.map(([k, e, n]) => `<button title="${n}" style="background:#fff;font-size:17px" class="${sel.t === 's' && sel.k === k ? 'on' : ''}" data-k="${k}">${e}</button>`).join('')}</div>`; $('pane').querySelectorAll('button').forEach(b => b.onclick = () => { sel = { t: 's', k: b.dataset.k }; paintPane(); }); }
  else {
    const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    $('pane').innerHTML = `<div class="wordrow" style="margin-bottom:.6rem"><input class="inp" id="word" maxlength="12" placeholder="R ♥ D" value="${esc(lsGet('gm-word', otherOf(me).toUpperCase()))}"><button onclick="putWord()">Pasang</button></div><div class="pal">${L.map(ch => `<button style="background:#fffaf2;border-radius:9px" class="${sel.t === 'l' && sel.ch === ch ? 'on' : ''}" data-ch="${ch}">${ch}</button>`).join('')}</div>`;

function paintTali() { $('tali').innerHTML = TALI.map(([c, n]) => `<button class="${st.tali === c ? 'on' : ''}" data-c="${c}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:.3rem;vertical-align:-1px;border:1px solid rgba(0,0,0,.1)"></span>${n}</button>`).join(''); $('tali').querySelectorAll('button').forEach(b => b.onclick = () => { st.tali = b.dataset.c; persist(); paintTali(); draw(); }); }
async function saveImg() { if (!st.b.some(Boolean)) { toast('Pasang maniknya dulu ya 📿'); return; } await fontsReady(); draw(true); await shareCanvas(cv, 'gelang-buat-' + otherOf(me).toLowerCase() + '.png', 'Gelang manik'); draw(); }
function keep() {

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
