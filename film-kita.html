<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Film Kita — Razan & Dara 🎬</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  html,body{background:#120c0a;height:100%;overflow:hidden}
  body::before{display:none}
  body.playing .sfx-btn,body.playing .sfx-tip,body.playing .cfab,body.playing #lok-pill{display:none!important}
  .frame{position:fixed;inset:0;margin:0 auto;max-width:520px;overflow:hidden;background:#1b1412;user-select:none;-webkit-user-select:none}
  .safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,calc(100svh * .5625));aspect-ratio:9/16;pointer-events:none}
  @supports not (height:100svh){.safe{width:min(100%,calc(100vh * .5625))}}
  .scn{position:absolute;inset:0;opacity:0;animation:sIn .7s ease forwards}
  .scn.out{animation:sOut .6s ease forwards}
  @keyframes sIn{to{opacity:1}}@keyframes sOut{from{opacity:1}to{opacity:0}}
  .scn svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .paused *{animation-play-state:paused!important}
  /* teks & label */
  .ov2{position:absolute;pointer-events:none}
  .chip{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#7a3f35;font:600 11px Poppins,sans-serif;padding:.32rem .8rem;border-radius:50px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;animation:pop .6s .5s cubic-bezier(.3,1.5,.5,1) forwards}
  .chip.dark{background:rgba(0,0,0,.35);color:#fff}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
  .big{position:absolute;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-weight:700;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.35);opacity:0}
  .fade{animation:fIn 1s ease forwards}
  @keyframes fIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .subw{position:absolute;left:0;right:0;bottom:calc(5.5% + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 14px;z-index:5;pointer-events:none}
  .subw span{max-width:400px;background:rgba(20,12,10,.62);color:#fff;font:500 13.5px/1.5 Poppins,sans-serif;padding:.45rem .85rem;border-radius:14px;text-align:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .25s}
  .subw span.D{color:#ffd0dc}.subw span.R{color:#fff}
  .subw span:empty{opacity:0}
  .nocc .subw{display:none}
  .subw{transition:bottom .3s}.ctl-on .subw{bottom:calc(96px + env(safe-area-inset-bottom))}
  /* foto polaroid */
  .pol{position:absolute;background:#fff;padding:5px 5px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:3px;opacity:0;transform:rotate(var(--r,0deg)) translateY(-30px) scale(.8);animation:polIn .8s var(--d,.6s) cubic-bezier(.3,1.4,.5,1) forwards}
  .pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee;border-radius:1px}
  .pol b{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 13px Caveat,cursive;color:#7a3f35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  @keyframes polIn{to{opacity:1;transform:rotate(var(--r,0deg))}}
  /* bubble chat */
  .phone{position:absolute;width:47%;aspect-ratio:9/17;border-radius:18px;padding:8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;animation:phIn .8s var(--d,.3s) cubic-bezier(.3,1.3,.5,1) forwards}
  .phone .scr{background:#fff;border-radius:12px;height:100%;padding:18px 6px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;overflow:hidden;position:relative}
  .phone .scr::before{content:attr(data-n);position:absolute;top:0;left:0;right:0;font:600 9px Poppins,sans-serif;text-align:center;padding:4px;color:#7a6a60;border-bottom:1px solid #f0e6dd}
  @keyframes phIn{from{opacity:0;transform:rotate(var(--r)) translateY(30px)}to{opacity:1;transform:rotate(var(--r))}}
  .bb{display:none;font:400 9.5px/1.35 Poppins,sans-serif;padding:5px 7px;border-radius:10px;max-width:88%;opacity:0;transform:scale(.6);transform-origin:bottom left;flex-shrink:0}
  .bb.in{background:#f3ece6;color:#3a2a24;align-self:flex-start;border-bottom-left-radius:3px}
  .bb.me{background:#4a7fc1;color:#fff;align-self:flex-end;border-bottom-right-radius:3px;transform-origin:bottom right}
  .bb.dme{background:#e58fa6;color:#fff;align-self:flex-end;border-bottom-right-radius:3px;transform-origin:bottom right}
  .bb.go{display:block;animation:bbIn .45s var(--d,0s) cubic-bezier(.3,1.5,.5,1) forwards}
  @keyframes bbIn{to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:3px}.typing i{width:4px;height:4px;border-radius:50%;background:#fff;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{50%{transform:translateY(-3px);opacity:.5}}
  .say{position:absolute;background:#fff;color:#3a2a24;font:600 15px Poppins,sans-serif;padding:.5rem .9rem;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.15);opacity:0;transform:scale(.4);white-space:nowrap}
  .say.go{animation:sayIn .5s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes sayIn{to{opacity:1;transform:none}}
  /* angka hari */
  .count{position:absolute;left:0;right:0;top:22%;text-align:center;color:#a8584c;opacity:0;animation:fIn .8s .3s forwards}
  .count b{display:block;font:700 clamp(54px,19vw,84px)/1 Poppins,sans-serif;letter-spacing:-.02em}
  .count small{font:500 15px Poppins,sans-serif;color:#9a8070}
  .count i{display:block;font:normal 600 22px Caveat,cursive;color:#c9a96e;margin-top:.3rem}
  /* layar awal & akhir */
  .poster{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:radial-gradient(ellipse 80% 60% at 50% 35%,#4b2c3e,#1b1220 70%);gap:.25rem}
  .poster .lbl{color:#e7c98f;letter-spacing:.3em}
  .poster h1{font:700 clamp(52px,17vw,74px)/1 Caveat,cursive;color:#ffe2b8;text-shadow:0 4px 30px rgba(255,180,120,.35);margin:.2rem 0}
  .poster .ep{font:500 12.5px Poppins,sans-serif;color:#d9c4d0}
  .poster .play{margin:1.4rem 0 .8rem;width:86px;height:86px;border-radius:50%;border:none;background:linear-gradient(135deg,#f0a39a,#c17a6f);color:#fff;font-size:34px;box-shadow:0 0 0 10px rgba(240,163,154,.15),0 10px 30px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;padding-left:6px;animation:pulse 2.2s infinite}
  .poster .play:disabled{opacity:.5;animation:none}
  @keyframes pulse{50%{box-shadow:0 0 0 18px rgba(240,163,154,.06),0 10px 30px rgba(0,0,0,.35)}}
  .poster .note{font:400 11.5px/1.6 Poppins,sans-serif;color:#cdb8c4;max-width:290px}
  .poster .note a{color:#ffd0c4}
  .poster .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font:500 12px Poppins,sans-serif;color:#e6d3dc;text-decoration:none;background:rgba(255,255,255,.1);padding:.4rem .85rem;border-radius:50px}
  .poster .stars{position:absolute;inset:0;pointer-events:none}
  .poster .end-btns{display:flex;flex-direction:column;gap:.55rem;width:min(100%,280px);margin-top:1.2rem}
  .poster .end-btns a,.poster .end-btns button{display:block;padding:.8rem;border-radius:50px;font:600 13.5px Poppins,sans-serif;text-decoration:none;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
  .poster .end-btns .pri{background:linear-gradient(135deg,#f0a39a,#c17a6f);border:none}
  .hidden{display:none!important}
  /* kontrol */
  .ctl{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:30px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .3s;pointer-events:none}
  .ctl.show{opacity:1;pointer-events:auto}
  .ctl .bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .ctl .bar .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
  .ctl .bar .fl{position:absolute;left:0;height:4px;border-radius:2px;background:#f0a39a}
  .ctl .bar .mk{position:absolute;width:2px;height:8px;background:rgba(255,255,255,.5);top:7px}
  .ctl .row2{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
  .ctl .row2 button{background:none;border:none;color:#fff;font-size:20px;width:42px;height:40px;border-radius:50%;cursor:pointer;flex-shrink:0}
  .ctl .row2 button.cc{font:700 11px Poppins,sans-serif;width:auto;padding:0 8px;height:26px;border-radius:6px;border:1.5px solid #fff}
  .ctl .row2 button.cc.off{opacity:.45}
  .ctl .tm{font:500 11px Poppins,sans-serif;color:#eee;min-width:0;flex:1;text-align:center;white-space:nowrap}
  .xbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:13;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none}
  .xbtn.show{opacity:1;pointer-events:auto}
  .tapcue{position:absolute;inset:0;z-index:4}
  .bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:28px;display:none;align-items:center;justify-content:center;padding-left:5px;pointer-events:none}
  .paused-ui .bigplay{display:flex}
  /* ─── karakter (SVG) ─── */
  .ch{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-1.6px)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.3s infinite}
  .dr .eyes{animation-delay:1.3s}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
  .arm{transform-box:fill-box;transform-origin:50% 7%;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
  .lg{transform-box:fill-box;transform-origin:50% 0}
  .skirt{transform-box:fill-box;transform-origin:50% 0}
  .m-o,.sitl,.shk{display:none}
  .shock .m-o{display:block}.shock .m-s{display:none}.shock .shk{display:block}
  .shock{animation:jump .5s cubic-bezier(.3,1.6,.5,1) 2}
  @keyframes jump{40%{transform:translateY(-14px)}}
  .walk{animation:wbob .32s ease-in-out infinite alternate}
  @keyframes wbob{to{transform:translateY(-2.2px)}}
  .walk .lg.l{animation:legA .32s ease-in-out infinite alternate}.walk .lg.r{animation:legA .32s ease-in-out infinite alternate-reverse}
  @keyframes legA{from{transform:rotate(17deg)}to{transform:rotate(-17deg)}}
  .walk .arm.l{animation:armA .32s ease-in-out infinite alternate}.walk .arm.r{animation:armA .32s ease-in-out infinite alternate-reverse}
  @keyframes armA{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  .walk .skirt{animation:skw .32s ease-in-out infinite alternate}
  @keyframes skw{from{transform:skewX(4deg)}to{transform:skewX(-4deg)}}
  .sit .lg,.sit .skirt-l{display:none}.sit .sitl{display:block}
  .raise .arm.r{transform:rotate(-168deg)}
  .wave .arm.r{animation:wave .45s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-120deg)}}
  .holdR .arm.r{transform:rotate(-42deg)}
  .holdL .arm.l{transform:rotate(42deg)}
  .phoneR .arm.r{transform:rotate(-125deg)}
  .sweep .arm.r{animation:swp .7s ease-in-out infinite alternate}
  @keyframes swp{from{transform:rotate(-8deg)}to{transform:rotate(16deg)}}
  .cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.6s ease-in-out infinite alternate}
  @keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
  .cat .ce{transform-box:fill-box;transform-origin:center;animation:blink 3.7s infinite}
  /* gerakan masuk/keluar */
  .mv{animation:mv var(--t,3s) var(--d,0s) linear both}
  @keyframes mv{from{transform:translate(var(--x0,0px),var(--y0,0px))}to{transform:translate(var(--x1,0px),var(--y1,0px))}}
  .mve{animation:mv var(--t,3s) var(--d,0s) cubic-bezier(.25,.8,.35,1) both}
  .tw{animation:tw var(--t,2.4s) var(--d,0s) ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .float{animation:flt var(--t,3s) var(--d,0s) ease-in infinite;opacity:0}
  @keyframes flt{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x1,0px),-90px) scale(1.1)}}
  .appear{opacity:0;animation:apr .8s var(--d,0s) ease forwards}
  @keyframes apr{to{opacity:1}}
  .vanish{animation:van .8s var(--d,0s) ease forwards}
  @keyframes van{to{opacity:0}}
  .grow{transform-box:fill-box;transform-origin:center;animation:grw 1.4s var(--d,0s) cubic-bezier(.3,1.4,.5,1) both}
  @keyframes grw{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .beat{transform-box:fill-box;transform-origin:center;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  .swing{transform-box:fill-box;transform-origin:50% 0;animation:swg 1.2s ease-in-out infinite alternate}
  @keyframes swg{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  .sky-sore{animation:sore 5.5s 1s ease-in-out forwards}
  @keyframes sore{to{opacity:1}}
  [data-at].when:not(.go){animation-play-state:paused!important;visibility:hidden}
  .sit>ellipse:first-child{display:none}
  .dim.go{animation:dim .8s ease forwards}
  @keyframes dim{to{opacity:.3}}
  .spot{opacity:0}.spot.go{animation:apr 1s ease forwards}
  .hideat.go{animation:van .8s ease forwards}
  .when[data-at]:not(.go) *{animation-play-state:paused!important}
  .laugh .m-o{display:block}.laugh .m-s{display:none}.laugh{animation:lgh .3s ease-in-out infinite alternate}
  @keyframes lgh{to{transform:translateY(-2px) rotate(-2deg)}}
  .ride .arm.r{transform:rotate(-78deg)}.ride .arm.l{transform:rotate(-35deg)}.ride2 .arm.r{transform:rotate(-60deg)}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scrollx{animation:scx var(--t,4s) linear infinite}
  @keyframes scx{to{transform:translateX(-360px)}}
  .bump{animation:bmp .28s ease-in-out infinite alternate}
  @keyframes bmp{to{transform:translateY(-2px)}}
  @keyframes nony{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  .eps{display:flex;flex-direction:column;gap:.45rem;width:min(100%,290px);margin:1rem 0 0}
  .eps button{display:flex;align-items:center;gap:.6rem;text-align:left;padding:.55rem .75rem;border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-family:Poppins,sans-serif}
  .eps button.on{border-color:#f0a39a;background:rgba(240,163,154,.2)}
  .eps .n{font:700 11px Poppins,sans-serif;color:#e7c98f;flex-shrink:0;width:2.6rem}

  const pr = audio.play(); if (pr && pr.catch) pr.catch(() => { fake = { t: audio.currentTime || 0, at: performance.now() }; setPlaying(true); toast('🔇 Suaranya gagal dimuat — nonton pakai teks dulu ya. Coba buka lagi pas sinyal bagus', 4500); });
  setPlaying(true);
}
function pause() { if (fake) { fake.t = tNow(); } else audio.pause(); setPlaying(false); }
function seek(t) {
  t = Math.max(0, Math.min(dur() - .2, t)); if (fake) { fake.t = t; fake.at = performance.now(); } else audio.currentTime = t;
  cur = null; lastShown = ''; tick(); cancelAnimationFrame(raf); if (playing) raf = requestAnimationFrame(tick);
}
function showCtl(stay) { $('frame').classList.add('ctl-on'); $('ctl').classList.add('show'); $('xbtn').classList.add('show'); clearTimeout(ctlT); if (!stay) ctlT = setTimeout(() => { if (playing) { $('frame').classList.remove('ctl-on'); $('ctl').classList.remove('show'); $('xbtn').classList.remove('show'); } }, 2600); }
function finish() {
  playing = false; cancelAnimationFrame(raf); wake(false); document.body.classList.remove('playing');
  try { const n = lsGet('film-kita-' + EP, 0) + 1; lsSet('film-kita-' + EP, n); } catch (e) {}
  $('endlbl').textContent = `Episode ${EP} · selesai`; const nx = EPS[EP + 1]; $('e-next').classList.toggle('hidden', !nx); if (nx) $('e-next').textContent = `▶ Lanjut Episode ${EP + 1}`; $('e-wa').classList.toggle('pri', !nx);
  const other = otherOf(ME);
  $('e-wa').textContent = `💌 Bilang ke ${other}`;
  $('e-wa').href = waLink(other, ME === 'Dara' ? `Aku udah nonton Film Kita episode ${EP} 🎬🥹🤍` : `Film Kita episode ${EP} udah jadi, tonton ya 🎬🤍 my-razara.github.io/dara/film-kita.html?ep=${EP}`);
  $('endscr').classList.remove('hidden'); $('ctl').classList.remove('show'); $('xbtn').classList.remove('show'); $('subt').textContent = '';
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
}
audio.addEventListener('ended', finish);
$('play').onclick = () => {
  $('poster').classList.add('hidden'); $('endscr').classList.add('hidden');
  try { const f = $('frame'); f.requestFullscreen && f.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) {}
  if (!ready) return; seek(0); play();
};
$('e-again').onclick = () => { $('endscr').classList.add('hidden'); seek(0); play(); };
$('e-next').onclick = async () => { const n = EP + 1, had = !!BLOB[n]; $('endscr').classList.add('hidden'); if (!had) $('poster').classList.remove('hidden'); await selectEp(n); if (had) { seek(0); play(); } };
$('tap').onclick = () => { if (!$('poster').classList.contains('hidden') || !$('endscr').classList.contains('hidden')) return; if (playing) pause(); else play(); };
$('b-play').onclick = e => { e.stopPropagation(); playing ? pause() : play(); };
const scIdx = () => CUES.scenes.findIndex(s => s.id === sceneAt(tNow()).id);
$('b-prev').onclick = () => { const i = scIdx(), s = CUES.scenes[tNow() - CUES.scenes[i].a > 2 ? i : Math.max(0, i - 1)]; seek(s.a); showCtl(!playing); };
$('b-next').onclick = () => { const i = scIdx(); if (i < CUES.scenes.length - 1) seek(CUES.scenes[i + 1].a); showCtl(!playing); };
$('b-cc').onclick = () => { const off = !$('frame').classList.toggle('nocc'); $('b-cc').classList.toggle('off', !off); lsSet('film-cc', off); showCtl(!playing); };
if (lsGet('film-cc', true) === false) { $('frame').classList.add('nocc'); $('b-cc').classList.add('off'); }
$('xbtn').onclick = () => { pause(); try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} location.href = 'timeline-kita.html'; };
$('bar').onpointerdown = e => { const r = $('bar').getBoundingClientRect(); seek((e.clientX - r.left) / r.width * dur()); showCtl(!playing); };
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
$('pstars').innerHTML = Array.from({ length: 40 }, (_, i) => `<circle class="tw" style="--d:${(i * .23 % 3).toFixed(2)}s" cx="${(i * 37) % 100}" cy="${(i * 53) % 100}" r=".35" fill="#fff"/>`).join('');
// ═══ EPISODE ═══
const EPS = {
  1: { t: 'Awal Cerita', s: 'MPLS → jadian → kencan', cues: C1, scn: SCN1, audio: 'film-kita-1.mp3', hooks: { tz: (el, k) => el.querySelectorAll('.rz').forEach(r => r.classList.toggle('shock', k === 3)) } },
  2: { t: 'Sebelum Jadi Kita', s: 'dimsum → "masih abu-abu"', cues: C2, scn: SCN2, audio: 'film-kita-2.mp3', hooks: { risih: (el, k) => el.querySelectorAll('.rz').forEach(r => r.classList.toggle('shock', k === 1)) } }
};
let EP = 1; const BLOB = {};
function paintEps() {
  $('eps').innerHTML = Object.keys(EPS).map(Number).map(n => { const e = EPS[n], w = lsGet('film-kita-' + n, 0); return `<button data-ep="${n}" class="${n === EP ? 'on' : ''}"><span class="n">EP ${n}</span><span class="m"><b>${e.t}</b><small>${mmss(e.cues.dur)} · ${e.s}</small></span>${w ? '<span class="tg ok">✓</span>' : '<span class="tg">BARU</span>'}</button>`; }).join('');
  $('eptxt').textContent = 'Episode ' + EP; $('durtxt').textContent = mmss(dur());
}
async function selectEp(n, url) {
  if (!EPS[n]) return; EP = n; CUES = EPS[n].cues; cur = null; fake = null; ready = false; $('play').disabled = true;
  try { audio.pause(); } catch (e) {}
  $('mks').innerHTML = CUES.scenes.slice(1).map(s => `<span class="mk" style="left:${s.a / dur() * 100}%"></span>`).join('');
  paintEps(); if (url) try { history.replaceState(null, '', 'film-kita.html?ep=' + n); } catch (e) {}
  await loadAudio(n);
}
async function preload(n) { if (BLOB[n] || !EPS[n]) return; try { const r = await fetch(EPS[n].audio); if (r.ok) BLOB[n] = URL.createObjectURL(await r.blob()); } catch (e) {} }
$('eps').onclick = e => { const b = e.target.closest('[data-ep]'); if (b && +b.dataset.ep !== EP) selectEp(+b.dataset.ep, 1); };
// ambil audio sekali (biar bisa ditonton offline juga)
async function loadAudio(n) {
  const note = $('pnote'), src = EPS[n].audio;
  if (BLOB[n]) { audio.src = BLOB[n]; }
  else try {
    note.textContent = 'Nyiapin film… ⏳';
    const r = await fetch(src); if (!r.ok) throw 0;
    const tot = +r.headers.get('content-length') || 0, rd = r.body && r.body.getReader ? r.body.getReader() : null; let blob;
    if (rd && tot) { const parts = []; let got = 0; for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (EP === n) note.textContent = `Nyiapin film… ${Math.round(got / tot * 100)}%`; } blob = new Blob(parts, { type: 'audio/mpeg' }); }
    else blob = await r.blob();
    BLOB[n] = URL.createObjectURL(blob); if (EP === n) audio.src = BLOB[n];
  } catch (e) { if (EP === n) audio.src = src; }
  if (EP !== n) return;
  ready = true; $('play').disabled = false;
  note.innerHTML = (MEM && MEM.albums && MEM.albums.length ? '' : 'Biar foto asli kita ikut muncul, buka <a href="memories.html">📸 Kenangan Kita</a> sekali dulu ya.<br>') + '🔊 Nyalain suara HP · tap layar buat jeda';
}
document.body.classList.add('playing');
prepPics();
(() => { const q = +(new URLSearchParams(location.search).get('ep') || 0), ks = Object.keys(EPS).map(Number); const unw = ks.find(n => !lsGet('film-kita-' + n, 0)); selectEp(EPS[q] ? q : (unw || ks[ks.length - 1])); })();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
