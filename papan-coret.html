<!DOCTYPE html>
<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Papan Coret — Razan & Dara 🖊️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="hub.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .4rem}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-bottom:.45rem;font-size:11.5px;color:var(--muted)}
  .bar b{color:var(--ink);font-size:12.5px}
  .cvw{position:relative;width:min(100%,max(170px,calc((100svh - 370px) * .75)));aspect-ratio:3/4;margin:0 auto .55rem;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(122,63,53,.13);border:1px solid rgba(193,122,111,.18);background:#fffdf8}
  .cvw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .cvw .ro{position:absolute;top:.5rem;left:.5rem;font-size:11px;background:rgba(45,31,26,.65);color:#fff;padding:.2rem .6rem;border-radius:50px}
  .cvw .nw{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(45,31,26,.7);color:#fff;padding:.25rem .7rem;border-radius:50px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
  .cvw .nw.on{opacity:1}
  .tools{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:.45rem}
  .tools .c{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.12);cursor:pointer;padding:0;flex-shrink:0}
  .tools .c.on{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.1)}
  .tools .er{width:auto;border-radius:50px;background:#fff;font-size:12px;padding:0 .55rem;height:28px;border:1.5px solid var(--blush);color:var(--deep)}
  .tools .er.on{background:var(--deep);color:#fff;box-shadow:none}
  .sz{display:flex;gap:.35rem;justify-content:center;margin-bottom:.6rem}
  .sz button{width:40px;height:32px;border-radius:12px;border:1.5px solid var(--blush);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sz button i{display:block;border-radius:50%;background:var(--ink)}
  .sz button.on{border-color:var(--rose);background:#fff3ef}
  .sz .er{font-size:15px}.sz .er.on{background:var(--deep);border-color:var(--deep)}
  .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
  .acts button{border:1.5px solid var(--blush);background:#fff;border-radius:14px;padding:.55rem .2rem;font:600 11.5px Poppins,sans-serif;color:var(--deep);cursor:pointer;min-width:0}
  @media (max-height:780px){.head .ico,.head .sub{display:none}.head{margin:.2rem 0 .4rem!important}}
  .gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
  .gal button{border:1px solid rgba(193,122,111,.15);background:#fffdf8;border-radius:14px;padding:0;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:3/4;min-width:0}
  .gal canvas{width:100%;height:100%;display:block}
  .gal small{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(255,255,255,.85);color:var(--deep);padding:.15rem}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span class="pill" id="me-pill"></span></div>
  <div class="head" style="margin:.4rem 0 .5rem"><span class="ico">🖊️</span><h1 class="title">Papan <span>Coret</span></h1><p class="sub">Satu papan buat berdua — coretanmu langsung muncul di HP dia, coretan dia muncul di HP kamu ✨</p></div>
  <p class="bd-st" id="bd-st"></p>
  <div class="bar"><span id="who-st"></span><b id="day"></b></div>
  <div class="cvw" id="cvw"><canvas id="cv"></canvas><span class="ro" id="ro" style="display:none"></span><span class="nw" id="nw"></span></div>
  <div id="ctl">
    <div class="tools" id="cols"></div>
    <div class="sz" id="sz"></div>
    <div class="acts"><button id="clr">🗑️ Hapus coretanku</button><button id="save">💾 Simpan gambar</button></div>
  </div>
  <button class="btn ghost" id="today-btn" style="display:none;margin-top:.4rem">← Balik ke papan hari ini</button>
  <div id="gal-w"><p class="sec">🗂️ Papan hari-hari sebelumnya</p><div class="gal" id="gal"></div></div>
</div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), status: () => '', on() {}, enabled: false };
const ME = (window.Who && Who.me()) || BD.me(), OT = otherOf(ME), WHO = ['Razan', 'Dara'];
$('me-pill').textContent = `🙋 ${ME}`; $('me-pill').className = 'pill ' + ME;
const BG = '#fffdf8', PAL = ['#2d1f1a', '#e0475b', '#f08a5d', '#f2c14e', '#5aa66a', '#4a7fc1', '#9b6bd3', '#f2a7c3'], SIZES = [4, 10, 22];
const MAXC = 38000;   // batas data per orang per papan (biar ga kegedean)
const TD = () => ymd(new Date());
let day = TD(), col = lsGet('cr-col', 0), sz = lsGet('cr-sz', 1), eraser = false;
const strokes = (w, d) => (((lsGet('coret-' + w, {}) || {})[d] || {}).s) || [];
// titik → teks pendek (tiap koordinat 0–999 jadi 2 huruf base36)
const enc = pts => pts.map(v => Math.max(0, Math.min(1295, Math.round(v))).toString(36).padStart(2, '0')).join('');
const dec = s => { const o = []; for (let i = 0; i + 1 < s.length; i += 2) o.push(parseInt(s.substr(i, 2), 36)); return o; };
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function fit() { const r = cv.getBoundingClientRect(); DPR = Math.min(2.5, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); draw(); }
function paper(c, w, h) { c.fillStyle = BG; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(193,122,111,.13)'; const g = w / 18; for (let x = g / 2; x < w; x += g) for (let y = g / 2; y < h; y += g) { c.beginPath(); c.arc(x, y, Math.max(.6, w / 500), 0, 7); c.fill(); } }
function drawStroke(c, s, w, h) {
  const p = dec(s[3]); if (p.length < 2) return;
  c.strokeStyle = c.fillStyle = s[1] < 0 ? BG : (PAL[s[1]] || PAL[0]); c.lineWidth = s[2] * w / 1000; c.lineCap = c.lineJoin = 'round';
  const X = i => p[i] / 1000 * w, Y = i => p[i + 1] / 1000 * h;
  if (p.length === 2) { c.beginPath(); c.arc(X(0), Y(0), c.lineWidth / 2, 0, 7); c.fill(); return; }
  c.beginPath(); c.moveTo(X(0), Y(0));
  for (let i = 2; i + 3 < p.length; i += 2) { const mx = (X(i) + X(i + 2)) / 2, my = (Y(i) + Y(i + 2)) / 2; c.quadraticCurveTo(X(i), Y(i), mx, my); }
  c.lineTo(X(p.length - 2), Y(p.length - 2)); c.stroke();
}
const merged = d => WHO.flatMap(w => strokes(w, d).map(s => [s, w])).sort((a, b) => a[0][0] - b[0][0]);
function render(c, w, h, d) { paper(c, w, h); merged(d).forEach(([s]) => drawStroke(c, s, w, h)); }
function draw() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); render(ctx, W, H, day); if (cur) drawLive(); }
// ── gambar ──
let cur = null;
const norm = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1000, (e.clientY - r.top) / r.height * 1000]; };
function drawLive() { const s = [0, eraser ? -1 : col, SIZES[sz], enc(cur.p)]; drawStroke(ctx, s, W, H); }
cv.addEventListener('pointerdown', e => {
  if (day !== TD()) return toast('Ini papan hari kemarin — balik ke papan hari ini buat nyoret');
  if (cur) return; e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  cur = { id: e.pointerId, p: norm(e) };
  drawLive();
});
cv.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== cur.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  evs.forEach(ev => { const q = norm(ev), n = cur.p.length; if (Math.hypot(q[0] - cur.p[n - 2], q[1] - cur.p[n - 1]) >= 4) cur.p.push(q[0], q[1]); });
  draw();
});
function end(e) {
  if (!cur || (e && e.pointerId !== cur.id)) return;
  const p = cur.p; cur = null;
  const mine = strokes(ME, day).slice(), s = [Math.floor(Date.now() / 100) - 17e9, eraser ? -1 : col, SIZES[sz], enc(p.slice(0, 1200))];
  mine.push(s);
  if (JSON.stringify(mine).length > MAXC) { toast('Papan hari ini udah penuh coretanmu 😅 hapus sebagian dulu ya'); draw(); return; }
  BD.put('coret', ME, day, { s: mine, at: Date.now() });
  draw(); paintInfo(); ping();
}
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
// kabarin pasangan (paling sering 15 menit sekali)
function ping() { const t = lsGet('cr-ping', 0); if (Date.now() - t < 9e5) return; lsSet('cr-ping', Date.now()); try { window.Push && Push.notify({ title: `🖊️ ${ME} lagi nyoret di Papan Coret`, body: 'Liat terus bales coret yuk ✨', url: 'papan-coret.html', tag: 'ajak-coret' }); } catch (e) {} }
// ── alat ──
function paintTools() {
  $('cols').innerHTML = PAL.map((c, i) => `<button class="c${!eraser && i === col ? ' on' : ''}" style="background:${c}" data-c="${i}" aria-label="warna ${i + 1}"></button>`).join('') ;
  $('sz').innerHTML = SIZES.map((v, i) => `<button class="${!eraser && i === sz ? 'on' : ''}" data-s="${i}" aria-label="ukuran ${i + 1}"><i style="width:${4 + i * 6}px;height:${4 + i * 6}px"></i></button>`).join('') + `<button class="er${eraser ? ' on' : ''}" data-er="1" aria-label="Penghapus">🧽</button><button class="er" data-un="1" aria-label="Batal coret">↩</button>`;
}
$('cols').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; col = +b.dataset.c; eraser = false; lsSet('cr-col', col); vib(5); paintTools(); });
$('sz').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.un) return undo(); if (b.dataset.er) { eraser = !eraser; vib(5); paintTools(); return; } sz = +b.dataset.s; eraser = false; lsSet('cr-sz', sz); paintTools(); });
function undo() { const m = strokes(ME, TD()).slice(); if (!m.length) return toast('Belum ada coretanmu di papan ini'); m.pop(); BD.put('coret', ME, TD(), { s: m, at: Date.now() }); vib(8); draw(); paintInfo(); }
$('clr').onclick = () => { if (!strokes(ME, TD()).length) return toast('Belum ada coretanmu di papan ini'); if (!confirm('Hapus semua coretanmu di papan hari ini? Coretan ' + OT + ' tetep ada.')) return; BD.put('coret', ME, TD(), { s: [], at: Date.now() }); draw(); paintInfo(); toast('🧽 Coretanmu dihapus'); };
$('save').onclick = () => { const c = document.createElement('canvas'); c.width = 900; c.height = 1200; render(c.getContext('2d'), 900, 1200, day); const x = c.getContext('2d'); x.fillStyle = 'rgba(122,63,53,.55)'; x.font = '600 22px Poppins, sans-serif'; x.textAlign = 'right'; x.fillText(`Razan & Dara · ${fmtD(parseYMD(day))}`, 880, 1182); shareCanvas(c, `papan-coret-${day}.png`, 'Papan Coret'); };
// ── info, galeri ──
let lastOt = -1;
function paintInfo() {
  const n = w => strokes(w, day).filter(s => s[1] >= 0).length;
  $('who-st').innerHTML = `<span style="color:var(--rz)">Razan ${n('Razan')}</span> · <span style="color:var(--dr)">Dara ${n('Dara')}</span> coretan`;
  const d = parseYMD(day); $('day').textContent = day === TD() ? 'Hari ini' : `${HARI[d.getDay()]}, ${fmtD(d)}`;
  const past = day !== TD(); $('ctl').style.display = past ? 'none' : ''; $('today-btn').style.display = past ? '' : 'none';
  $('ro').style.display = past ? '' : 'none'; $('ro').textContent = '👀 cuma liat';
  try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {}
}
function paintGal() {
  const ds = new Set(); WHO.forEach(w => Object.keys(lsGet('coret-' + w, {}) || {}).forEach(d => { if (/^\d{4}-/.test(d) && d !== TD() && merged(d).length) ds.add(d); }));
  const L = [...ds].sort().reverse().slice(0, 12);
  $('gal-w').style.display = L.length ? '' : 'none';
  $('gal').innerHTML = L.map(d => { const x = parseYMD(d); return `<button data-d="${d}"><canvas width="150" height="200"></canvas><small>${x.getDate()} ${BLN[x.getMonth()]}</small></button>`; }).join('');
  $('gal').querySelectorAll('button').forEach(b => render(b.querySelector('canvas').getContext('2d'), 150, 200, b.dataset.d));
}
$('gal').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; day = b.dataset.d; paintInfo(); draw(); scrollTo({ top: 0, behavior: 'smooth' }); });
$('today-btn').onclick = () => { day = TD(); paintInfo(); draw(); };
function flash(t) { const n = $('nw'); n.textContent = t; n.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => n.classList.remove('on'), 2200); }
BD.on(ev => {
  if (ev.apps && ev.apps.length && !ev.apps.includes('coret')) return;
  const n = strokes(OT, TD()).length; if (lastOt >= 0 && n > lastOt && day === TD()) { flash(`✨ ${OT} nambahin coretan`); vib(10); } lastOt = n;
  if (!cur) { draw(); paintInfo(); paintGal(); }
});
lastOt = strokes(OT, TD()).length;
addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(fit, 150); });
try { BD.fast && BD.fast(15e3); } catch (e) {}
paintTools(); paintInfo(); fit(); paintGal();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
