<script>

const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));

  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }

const mm = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;

function togV() { voice = !voice; lsSet('st-voice', voice); $('vc').textContent = voice ? '🗣️ Suara: on' : '🔇 Suara: off'; if (!voice) try { speechSynthesis.cancel(); } catch (e) {} }

function beep(f) { try { const a = beep.ac = beep.ac || new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), v = a.createGain(); o.frequency.value = f || 660; v.gain.setValueAtTime(.15, a.currentTime); v.gain.exponentialRampToValueAtTime(.001, a.currentTime + .25); o.connect(v); v.connect(a.destination); o.start(); o.stop(a.currentTime + .26); } catch (e) {} }
function stats() { const h = lsGet('st-log', {}), days = Object.keys(h).sort(); let s = 0; const d = today0(); if (!h[ymd(d)]) d.setDate(d.getDate() - 1); while (h[ymd(d)]) { s++; d.setDate(d.getDate() - 1); } const min = Math.round(Object.values(h).reduce((a, v) => a + v, 0) / 60); return { s, n: days.length, min }; }
function home() {
  const t = stats();

let P = null, iv = null;
function play(i) { P = { r: R[i], i: 0, left: R[i].s[0][3], paused: false, done: 0 }; $('play').classList.add('show'); document.body.style.overflow = 'hidden'; show(true); clearInterval(iv); iv = setInterval(tickP, 1000); }
function show(announce) {
  const st = P.r.s[P.i], dur = st[3];
  $('pt').textContent = `${P.r.ic} ${P.r.n} · ${P.i + 1}/${P.r.s.length}`;
  $('dots').innerHTML = P.r.s.map((x, k) => `<i class="${k < P.i ? 'd' : k === P.i ? 'c' : ''}"></i>`).join('');
  $('pe').textContent = st[0]; $('pn').textContent = st[1]; $('pd').textContent = st[2]; $('ppair').style.display = st[4] ? '' : 'none';
  const nx = P.r.s[P.i + 1]; $('pw').textContent = nx ? `Selanjutnya: ${nx[0]} ${nx[1]}` : 'Gerakan terakhir 💪';
  $('ps').textContent = mm(P.left); $('arc').style.strokeDashoffset = 282.7 * (1 - P.left / dur);
  $('pb').textContent = P.paused ? '▶️ Lanjut' : '⏸ Jeda'; $('play').classList.toggle('paused', P.paused);
  if (announce) say(`${st[1]}. ${st[2]}`);
}
function tickP() {
  if (!P || P.paused) return;
  P.left--; P.done++;
  if (P.left <= 3 && P.left > 0) beep(520);
  if (P.left <= 0) { beep(880); vib([60, 40, 60]); if (P.i >= P.r.s.length - 1) return finish(); P.i++; P.left = P.r.s[P.i][3]; show(true); return; }
  const half = Math.floor(P.r.s[P.i][3] / 2); if (P.left === half && /ganti/i.test(P.r.s[P.i][2])) { beep(700); say('Ganti sisi'); }
  show(false);
}
function togP() { if (!P) return; P.paused = !P.paused; show(false); }
function next() { if (!P) return; if (P.i >= P.r.s.length - 1) return finish(); P.i++; P.left = P.r.s[P.i][3]; show(true); }
function prev() { if (!P) return; if (P.left < P.r.s[P.i][3] - 3 || P.i === 0) P.left = P.r.s[P.i][3]; else { P.i--; P.left = P.r.s[P.i][3]; } show(true); }
function log() { if (P && P.done >= 20) { const h = lsGet('st-log', {}), k = ymd(today0()); h[k] = (h[k] || 0) + P.done; lsSet('st-log', h); } }
function stop() { log(); clearInterval(iv); P = null; try { speechSynthesis.cancel(); } catch (e) {} $('play').classList.remove('show'); document.body.style.overflow = ''; home(); }
function finish() { const n = P.r.n; stop(); confetti(60); try { window.SFX && SFX.play('win'); } catch (e) {} say('Selesai! Hebat banget kalian'); toast(`🎉 ${n} selesai! Badan seger, hati senang`); }
document.addEventListener('visibilitychange', () => { if (document.hidden && P && !P.paused) { P.paused = true; show(false); } });
home();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
