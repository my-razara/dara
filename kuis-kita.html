azan jawab terpisah — seberapa mirip?<\/span><\/div>\n    <\/div>\n    <button class=\"btn pulse\" onclick=\"startFlow()\">Mulai Cermin Kita ✨<\/button>\n    <button class=\"btn-ghost\" id=\"last-btn\" style=\"display:none\" onclick=\"showLast()\">🖼️ Lihat cermin terakhir<\/button>\n  <\/div>\n<\/div>\n\n<\!-- HANDOVER (mode berdua) -->\n<div id=\"s-hand\" class=\"screen center\">\n  <div class=\"inner\">\n    <span class=\"mirror-emoji\" id=\"hand-ico\">🧑<\/span>\n    <h2 class=\"title\" style=\"font-size:1.35rem\" id=\"hand-title\">Giliran Razan<\/h2>\n    <p class=\"intro-q\" id=\"hand-sub\"><\/p>\n    <button class=\"btn\" id=\"hand-btn\" onclick=\"beginAnswering()\">Aku siap<\/button>\n  <\/div>\n<\/div>\n\n<\!-- QUESTIONS -->\n<div id=\"s-questions\" class=\"screen\">\n  <div class=\"q-header\">\n    <button class=\"q-back\" id=\"q-back\" onclick=\"prevQuestion()\">←<\/button>\n    <div class=\"q-bar\"><div class=\"q-fill\" id=\"q-fill\" style=\"width:0%\"><\/div><\/div>\n    <span class=\"q-step\" id=\"q-step\">1 / 7<\/span>\n  <\/div>\n  <span class=\"q-who d\" id=\"q-who\" style=\"display:none\"><\/span>\n  <div class=\"q-scroll\" id=\"q-scroll\"><div class=\"q-card\" id=\"q-card\"><\/div><\/div>\n  <div class=\"q-next\"><button class=\"btn\" id=\"q-next\" onclick=\"nextQuestion()\" disabled>Selanjutnya →<\/button><\/div>\n<\/div>\n\n<\!-- GENERATING -->\n<div id=\"s-gen\" class=\"screen center\">\n  <div class=\"inner\">\n    <span class=\"gen-mirror\">🪞<\/span>\n    <p class=\"gen-text\" id=\"gen-text\"><\/p>\n    <div class=\"gen-dots\"><div class=\"gen-dot\"><\/div><div class=\"gen-dot\"><\/div><div class=\"gen-dot\"><\/div><\/div>\n  <\/div>\n<\/div>\n\n<\!-- PORTRAIT -->\n<div id=\"s-portrait\" class=\"screen\">\n  <div class=\"p-top\"><span>🪞 Mirror of Us<\/span><button onclick=\"showScreen('s-intro')\">Kembali<\/button><\/div>\n  <div class=\"p-scroll\" id=\"p-scroll\"><\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<\script>\n// ═════════ PERTANYAAN ═════════\nconst QUESTIONS = [\n  { id:'color', cat:'Warna', q:'Kalau hubungan kita punya warna...', sub:'Pilih warna yang paling merepresentasikan perasaanmu tentang kita', cols:3, options:[\n    {emoji:'🔴',label:'Merah',sub:'Passion & intens',value:'red',tags:['Intens','Penuh Gairah']},\n    {emoji:'🩷',label:'Pink',sub:'Manis & lembut',value:'pink',tags:['Manis','Mellow']},\n    {emoji:'🟠',label:'Oranye',sub:'Hangat & ceria',value:'orange',tags:['Hangat','Energik']},\n    {emoji:'🟡',label:'Kuning',sub:'Cerah & bahagia',value:'yellow',tags:['Bahagia','Ceria']},\n    {emoji:'🔵',label:'Biru',sub:'Tenang & dalam',value:'blue',tags:['Tenang','Dalam']},\n    {emoji:'🟣',label:'Ungu',sub:'Misterius & dalam',value:'purple',tags:['Misterius','Koneksi Jiwa']},\n    {emoji:'🟢',label:'Hijau',sub:'Tumbuh & natural',value:'green',tags:['Tumbuh','Natural']},\n    {emoji:'⚫',label:'Hitam',sub:'Bold & kuat',value:'black',tags:['Bold','Powerful']},\n    {emoji:'🤍',label:'Putih',sub:'Murni & bersih',value:'white',tags:['Murni','Damai']},\n  ]},\n  { id:'weather', cat:'Cuaca', q:'Cuaca apa yang menggambarkan kita?', sub:'Bukan cuaca favorit — tapi yang paling mirip sama hubungan kita', cols:3, options:[\n    {emoji:'☀️',label:'Cerah',sub:'Selalu hangat',value:'sunny',tags:['Hangat','Konsisten']},\n    {emoji:'🌤️',label:'Berawan sedikit',sub:'Mostly baik-baik',value:'partlycloudy',tags:['Stabil','Ada Lika-liku']},\n    {emoji:'🌧️',label:'Hujan',sub:'Dalam & melankolis',value:'rainy',tags:['Melankolis','Dalam']},\n    {emoji:'⛈️',label:'Badai',sub:'Chaos tapi hidup',value:'stormy',tags:['Intens','Chaotic']},\n    {emoji:'🌈',label:'Setelah hujan',sub:'Indah setelah susah',value:'rainbow',tags:['Harapan','Kuat']},\n    {emoji:'❄️',label:'Dingin',sub:'Quiet & kontemplatif',value:'cold',tags:['Tenang','Intim']},\n    {emoji:'🌊',label:'Ombak',sub:'Naik turun tapi indah',value:'wave',tags:['Dinamis','Bebas']},\n    {emoji:'🌙',label:'Malam berbintang',sub:'Tenang & romantis',value:'night',tags:['Romantis','Damai']},\n    {emoji:'🌫️',label:'Berkabut',sub:'Misterius & intim',value:'foggy',tags:['Misterius','Dekat']},\n  ]},\n  { id:'place', cat:'Tempat', q:'Kalau kita punya tempat sendiri...', sub:'Di mana dunia kita berada?', cols:3, options:[\n    {emoji:'🏠',label:'Rumah kecil',sub:'Hangat & private',value:'home',tags:['Intim','Homey']},\n    {emoji:'🏝️',label:'Pulau terpencil',sub:'Hanya berdua',value:'island',tags:['Eksklusif','Romantis']},\n    {emoji:'🌲',label:'Hutan',sub:'Natural & tersembunyi',value:'forest',tags:['Natural','Misterius']},\n    {emoji:'🏔️',label:'Puncak gunung',sub:'Di atas segalanya',value:'mountain',tags:['Tinggi','Bebas']},\n    {emoji:'🌊',label:'Tepi laut',sub:'Tenang & luas',value:'beach',tags:['Bebas','Luas']},\n    {emoji:'🌌',label:'Luar angkasa',sub:'Tak terbatas',value:'space',tags:['Tak Terbatas','Epik']},\n    {emoji:'☕',label:'Cafe kecil',sub:'Nyaman & hangat',value:'cafe',tags:['Cozy','Nyaman']},\n    {emoji:'🌃',label:'Kota malam',sub:'Hidup & bersinar',value:'city',tags:['Hidup','Bersinar']},\n    {emoji:'🌸',label:'Taman bunga',sub:'Indah & tenang',value:'garden',tags:['Indah','Lembut']},\n  ]},\n  { id:'music', cat:'Musik', q:'Musik apa yang terasa seperti kita?', sub:'Genre atau suasana yang merepresentasikan hubungan kita', cols:2, options:[\n    {emoji:'🎸',label:'Indie / Alternative',sub:'Unik & ga mainstream',value:'indie',tags:['Unik','Autentik']},\n    {emoji:'🎹',label:'Piano / Klasik',sub:'Elegan & timeless',value:'classical',tags:['Elegan','Mendalam']},\n    {emoji:'🎵',label:'Pop / OPM',sub:'Catchy & manis',value:'pop',tags:['Manis','Fun']},\n    {emoji:'🎶',label:'Jazz / Lo-fi',sub:'Santai & cozy',value:'jazz',tags:['Santai','Cozy']},\n    {emoji:'🔥',label:'R&B / Soul',sub:'Dalam & penuh rasa',value:'rnb',tags:['Penuh Rasa','Intim']},\n    {emoji:'🌊',label:'Ambient / Instrumental',sub:'Mengalir & tenang',value:'ambient',tags:['Tenang','Mengalir']},\n  ]},\n  { id:'animal', cat:'Hewan', q:'Hewan apa yang melambangkan kita?', sub:'Kalau hubungan kita adalah seekor hewan...', cols:3, options:[\n    {emoji:'🦋',label:'Kupu-kupu',sub:'Indah & berubah',value:'butterfly',tags:['Bertumbuh','Indah']},\n    {emoji:'🐺',label:'Serigala',sub:'Loyal & kuat',value:'wolf',tags:['Loyal','Kuat']},\n    {emoji:'🦁',label:'Singa',sub:'Berani & protektif',value:'lion',tags:['Berani','Protektif']},\n    {emoji:'🐬',label:'Lumba-lumba',sub:'Ceria & bebas',value:'dolphin',tags:['Ceria','Bebas']},\n    {emoji:'🦅',label:'Elang',sub:'Tinggi & tajam',value:'eagle',tags:['Tajam','Bebas']},\n    {emoji:'🐢',label:'Kura-kura',sub:'Sabar & tahan lama',value:'turtle',tags:['Sabar','Abadi']},\n    {emoji:'🦊',label:'Rubah',sub:'Pintar & playful',value:'fox',tags:['Cerdas','Playful']},\n    {emoji:'🐧',label:'Penguin',sub:'Setia seumur hidup',value:'penguin',tags:['Setia','Manis']},\n    {emoji:'🐱',label:'Kucing',sub:'Manja & misterius',value:'cat',tags:['Manja','Intim']},\n  ]},\n  { id:'flower', cat:'Bunga', q:'Bunga apa yang paling cocok untuk kita?', sub:'Setiap bunga punya makna berbeda...', cols:3, options:[\n    {emoji:'🌹',label:'Mawar Merah',sub:'Cinta & gairah',value:'rose',tags:['Cinta Sejati','Passion']},\n    {emoji:'🌸',label:'Sakura',sub:'Indah & berharga',value:'sakura',tags:['Precious','Carpe Diem']},\n    {emoji:'🌻',label:'Bunga Matahari',sub:'Bahagia & setia',value:'sunflower',tags:['Setia','Optimis']},\n    {emoji:'💜',label:'Lavender',sub:'Tenang & healing',value:'lavender',tags:['Healing','Damai']},\n    {emoji:'🌼',label:'Daisy',sub:'Sederhana & tulus',value:'daisy',tags:['Tulus','Sederhana']},\n    {emoji:'🌺',label:'Hibiscus',sub:'Eksotis & berani',value:'hibiscus',tags:['Unik','Berani']},\n    {emoji:'🌷',label:'Tulip',sub:'Elegan & sempurna',value:'tulip',tags:['Elegan','Indah']},\n    {emoji:'🌿',label:'Tanaman Hijau',sub:'Tumbuh & bertahan',value:'plant',tags:['Bertumbuh','Kuat']},\n    {emoji:'🍀',label:'Semanggi',sub:'Beruntung & langka',value:'clover',tags:['Beruntung','Langka']},\n  ]},\n  { id:'vibe', cat:'Suasana', q:'Satu kata untuk suasana kita...', sub:'Kalau harus pilih satu — yang paling terasa', cols:3, options:[\n    {emoji:'🔥',label:'Passionate',sub:'Penuh api',value:'passionate',tags:['Intens','Berapi']},\n    {emoji:'🌙',label:'Dreamy',sub:'Seperti mimpi',value:'dreamy',tags:['Romantis','Magical']},\n    {emoji:'⚡',label:'Electric',sub:'Ada chemistry kuat',value:'electric',tags:['Chemistry','Spontan']},\n    {emoji:'🌊',label:'Deep',sub:'Sangat dalam',value:'deep',tags:['Dalam','Bermakna']},\n    {emoji:'☀️',label:'Warm',sub:'Selalu hangat',value:'warm',tags:['Nyaman','Hangat']},\n    {emoji:'🌀',label:'Chaotic',sub:'Ramai tapi seru',value:'chaotic',tags:['Seru','Tak Terduga']},\n    {emoji:'🕊️',label:'Peaceful',sub:'Tenang & damai',value:'peaceful',tags:['Damai','Stabil']},\n    {emoji:'✨',label:'Magical',sub:'Selalu bikin kagum',value:'magical',tags:['Ajaib','Unik']},\n    {emoji:'🫶',label:'Comforting',sub:'Rumah yang nyaman',value:'comforting',tags:['Rumah','Aman']},\n  ]},\n];\n\n// ═════════ TIPE HUBUNGAN (dipilih dari skor SEMUA jawaban, bukan yang pertama cocok) ═════════\nconst REL_TYPES = [\n  { key:'chaos', name:'The Comfortable Chaos', desc:'Hubungan kalian penuh kejutan dan keramaian — tapi di dalamnya ada kehangatan yang selalu bisa diandalkan. Kalian saling melengkapi dalam ketidaksempurnaan yang indah.',\n    w:{ 'vibe:chaotic':3, 'weather:stormy':2, 'weather:wave':1, 'color:orange':1, 'animal:fox':1, 'animal:dolphin':1, 'music:indie':1, 'place:city':1, 'flower:hibiscus':1 } },\n  { key:'quiet', name:'The Quiet Universe', desc:'Seperti dua bintang yang tenang di galaksi yang sama — kalian tidak perlu banyak kata untuk saling mengerti. Kedalaman hubungan kalian lebih terasa daripada terucap.',\n    w:{ 'vibe:deep':3, 'weather:night':2, 'weather:foggy':1, 'weather:cold':1, 'weather:rainy':1, 'color:blue':2, 'music:ambient':2, 'place:forest':1, 'animal:wolf':1 } },\n  { key:'dreamy', name:'The Dreamy Sanctuary', desc:'Hubungan kalian terasa seperti tempat berlindung — penuh imajinasi, keindahan, dan ketenangan. Bersama kalian, dunia terasa lebih ringan dan lebih indah.',\n    w:{ 'vibe:dreamy':3, 'weather:rainbow':2, 'color:pink':2, 'place:garden':1, 'place:island':1, 'flower:sakura':2, 'animal:butterfly':1 } },\n  { key:'electric', name:'The Electric Love', desc:'Ada chemistry yang ga bisa dijelaskan antara kalian — seperti percikan listrik yang selalu hidup. Kalian saling menarik satu sama lain dengan cara yang magical.',\n    w:{ 'vibe:electric':3, 'color:black':2, 'weather:stormy':1, 'place:city':2, 'music:indie':1, 'animal:eagle':1, 'color:red':1 } },\n  { key:'passion', name:'The Passionate Journey', desc:'Cinta kalian bukan yang kalem — tapi yang membara dan penuh warna. Setiap momen terasa hidup, setiap hari jadi petualangan baru bersama.',\n    w:{ 'vibe:passionate':3, 'color:red':2, 'flower:rose':2, 'music:rnb':2, 'animal:lion':1, 'place:mountain':1 } },\n  { key:'harbor', name:'The Peaceful Harbor', desc:'Di tengah dunia yang ramai, kalian adalah ketenangan satu sama lain. Hubungan kalian adalah pelabuhan — tempat pulang yang selalu hangat dan aman.',\n    w:{ 'vibe:peaceful':3, 'vibe:comforting':3, 'place:home':2, 'place:beach':1, 'color:white':2, 'color:green':1, 'flower:lavender':2, 'animal:turtle':1, 'animal:cat':1, 'music:jazz':1, 'weather:partlycloudy':1 } },\n  { key:'magic', name:'The Magical Chapter', desc:'Ada sesuatu yang tak biasa dalam hubungan kalian — semesta seperti selalu berpihak. Kebersamaan kalian terasa seperti cerita yang ditulis oleh bintang-bintang.',\n    w:{ 'vibe:magical':3, 'place:space':2, 'color:purple':2, 'flower:clover':2, 'music:classical':1, 'animal:butterfly':1 } },\n  { key:'warm', name:'The Warm Forever', desc:'Seperti sinar matahari yang tidak pernah pergi — hubungan kalian konsisten, hangat, dan tulus. Kalian adalah rumah satu sama lain.',\n    w:{ 'vibe:warm':3, 'weather:sunny':2, 'color:yellow':2, 'flower:sunflower':2, 'flower:daisy':1, 'flower:tulip':1, 'flower:plant':1, 'animal:penguin':2, 'place:cafe':1, 'music:pop':1 } },\n];\nfunction scoreTypes(list) { // list = array of answer sets\n  const sc = REL_TYPES.map(t => ({ t, s: 0 }));\n  list.forEach(ans => QUESTIONS.forEach(q => { const k = q.id + ':' + ans[q.id]; sc.forEach(x => x.s += x.t.w[k] || 0); }));\n  const vibe = list[0].vibe;\n  sc.sort((a, b) => b.s - a.s || ((b.t.w['vibe:' + vibe] || 0) - (a.t.w['vibe:' + vibe] || 0)));\n  return sc[0].t;\n}\n\nconst PALETTES = {\n  red:{bg:'linear-gradient(135deg,#4a0010,#c17a6f)',text:'#ffb5a7'}, pink:{bg:'linear-gradient(135deg,#3d0030,#c17a6f)',text:'#ffb5c8'},\n  orange:{bg:'linear-gradient(135deg,#3d1a00,#c9a96e)',text:'#ffd0a0'}, yellow:{bg:'linear-gradient(135deg,#2d2000,#c9a96e)',text:'#ffe680'},\n  blue:{bg:'linear-gradient(135deg,#001a3d,#0077b6)',text:'#90e0ef'}, purple:{bg:'linear-gradient(135deg,#1a0040,#7b2d8b)',text:'#d4a8ff'},\n  green:{bg:'linear-gradient(135deg,#002010,#2d6a4f)',text:'#95d5b2'}, black:{bg:'linear-gradient(135deg,#0a0a0a,#2d2d2d)',text:'#e0e0e0'},\n  white:{bg:'linear-gradient(135deg,#1a1a2e,#4a4a6a)',text:'#e8e8ff'},\n};\nconst POEMS = {\n  passionate:['Dalam api yang tak pernah padam,','kita berdua jadi nyala yang sama.','Bukan karena mudah —','tapi karena memang begini adanya.'],\n  dreamy:['Seperti mimpi yang tak mau berakhir,','kita hidup di antara bintang-bintang.','Di sini, waktu melambat —','dan semua terasa cukup.'],\n  electric:['Ada percikan yang tidak bisa dijelaskan','setiap kali matamu bertemu mataku.','Mungkin ini bukan kebetulan —','mungkin memang semesta yang mengatur.'],\n  deep:['Kita bukan cinta yang terlihat —','kita cinta yang dirasakan.','Di bawah permukaan yang tenang,','ada lautan yang tak bertepi.'],\n  warm:['Kamu adalah satu-satunya tempat','yang selalu terasa seperti rumah.','Tidak perlu kata yang indah —','kehadiranmu sudah cukup.'],\n  chaotic:['Kita berantakan dengan cara yang indah,','penuh kejutan yang tidak terduga.','Di tengah semua kekacauan itu —','aku selalu tahu kamu ada.'],\n  peaceful:['Bersamamu, dunia tidak terlalu berisik.','Bersamamu, aku bisa bernafas.','Kita bukan yang paling dramatis —','tapi kita yang paling nyata.'],\n  magical:['Ada sesuatu yang tidak bisa kujelaskan','tentang caramu membuatku percaya.','Mungkin ini sihir —','atau mungkin memang begini bentuk cinta.'],\n  comforting:['Kamu bukan pelarian —','kamu adalah tempat pulang.','Di pelukanmu, aku tidak perlu','menjadi siapapun selain diriku sendiri.'],\n};\n// baris penutup puisi dari bunga yang dipilih\nconst FLOWER_LINE = {\n  rose:'Seperti mawar — merah, berani, dan tetap merekah.', sakura:'Seperti sakura — setiap detik bersamamu terlalu berharga untuk dilewatkan.',\n  sunflower:'Seperti bunga matahari — aku selalu menghadap ke arahmu.', lavender:'Seperti lavender — kamu yang menenangkan hariku.',\n  daisy:'Seperti daisy — sederhana, tapi tulusnya nggak pernah pudar.', hibiscus:'Seperti hibiscus — kita berani jadi berbeda.',\n  tulip:'Seperti tulip — rapi, indah, dan pas di tempatnya.', plant:'Seperti tanaman hijau — kita terus tumbuh, pelan tapi pasti.',\n  clover:'Seperti semanggi — kamu keberuntungan yang langka.',\n};\n\n// ═════════ STATE ═════════\nconst $ = id => document.getElementById(id);\nconst STORE = 'mirror-of-us-last';\nlet mode = 'solo', who = 'd', answers = { d:{}, r:{} }, qi = 0;\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }\nfunction setMode(m) { mode = m; $('m-solo').classList.toggle('on', m === 'solo'); $('m-duo').classList.toggle('on', m === 'duo'); }\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\nfunction toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000); }\nfunction optOf(qid, val) { return QUESTIONS.find(q => q.id === qid).options.find(o => o.value === val); }\n\n// ═════════ ALUR ═════════\nfunction startFlow() {\n  answers = { d:{}, r:{} }; who = 'd';\n  if (mode === 'duo') handover('d'); else beginAnswering();\n}\nfunction handover(p) {\n  who = p;\n  $('hand-ico').textContent = p === 'd' ? '👧' : '🧑';\n  $('hand-title').textContent = p === 'd' ? 'Dara duluan ya 🌸' : 'Sekarang giliran Razan 🤍';\n  $('hand-sub').textContent = p === 'd' ? 'Jawab sesuai perasaanmu. Razan jangan ngintip! 🙈' : 'Dara udah selesai — kasih HP ke Razan. Jawabannya dirahasiain sampai akhir 🤫';\n  $('hand-btn').textContent = p === 'd' ? '👧 Aku siap' : '🧑 Razan siap';\n  showScreen('s-hand');\n}\nfunction beginAnswering() { qi = 0; showScreen('s-questions'); renderQ(); }\n\nfunction renderQ() {\n  const q = QUESTIONS[qi], cur = answers[who][q.id];\n  $('q-fill').style.width = (qi / QUESTIONS.length * 100) + '%';\n  $('q-step').textContent = `${qi + 1} / ${QUESTIONS.length}`;\n  $('q-back').disabled = qi === 0;\n  const w = $('q-who');\n  if (mode === 'duo') { w.style.display = ''; w.className = 'q-who ' + who; w.textContent = who === 'd' ? '👧 Jawaban Dara' : '🧑 Jawaban Razan'; } else w.style.display = 'none';\n  $('q-card').innerHTML = `<span class=\"q-eyebrow\">Pertanyaan ${qi + 1} dari ${QUESTIONS.length}<\/span><h2 class=\"q-question\">${q.q}<\/h2><p class=\"q-sub\">${q.sub}<\/p><div class=\"grid col${q.cols}\" id=\"grid\"><\/div>`;\n  const c = $('q-card'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';\n  const grid = $('grid');\n  q.options.forEach(o => {\n    const b = document.createElement('div');\n    b.className = 'opt' + (cur === o.value ? ' selected' : '');\n    b.innerHTML = `<span class=\"opt-emoji\">${o.emoji}<\/span><span class=\"opt-label\">${o.label}<\/span><span class=\"opt-sub\">${o.sub}<\/span>`;\n    b.onclick = () => { answers[who][q.id] = o.value; grid.querySelectorAll('.opt').forEach(x => x.classList.remove('selected')); b.classList.add('selected'); $('q-next').disabled = false; vib(20); };\n    grid.appendChild(b);\n  });\n  $('q-next').disabled = !cur;\n  $('q-next').textContent = qi === QUESTIONS.length - 1 ? (mode === 'duo' && who === 'd' ? 'Selesai → oper ke Razan' : 'Lihat Cermin ✨') : 'Selanjutnya →';\n  $('q-scroll').scrollTop = 0;\n}\nfunction prevQuestion() { if (qi > 0) { qi--; renderQ(); } }\nfunction nextQuestion() {\n  if (!answers[who][QUESTIONS[qi].id]) return;\n  qi++;\n  if (qi < QUESTIONS.length) { renderQ(); return; }\n  if (mode === 'duo' && who === 'd') { handover('r'); return; }\n  generate();\n}\n\nfunction generate() {\n  showScreen('s-gen');\n  const texts = mode === 'duo'\n    ? ['Cermin lagi membandingkan dua hati...', 'Mencari yang sama dan yang beda...', 'Menyusun warna dunia kalian...', 'Hampir selesai...']\n    : ['Cermin sedang membaca perasaanmu...', 'Menyusun warna-warna hubungan kalian...', 'Merajut kata-kata yang tepat...', 'Hampir selesai...'];\n  let ti = 0; $('gen-text').textContent = texts[0];\n  const iv = setInterval(() => { ti++; if (ti < texts.length) $('gen-text').textContent = texts[ti]; }, 700);\n  setTimeout(() => {\n    clearInterval(iv);\n    const data = { mode, d: { ...answers.d }, r: mode === 'duo' ? { ...answers.r } : null, at: Date.now() };\n    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {}\n    buildPortrait(data); confetti(60);\n  }, 2800);\n}\n\n// ═════════ PORTRAIT ═════════\nfunction buildPortrait(data) {\n  const A = data.d, B = data.r, duo = !!B;\n  const type = scoreTypes(duo ? [A, B] : [A]);\n  const o = k => optOf(k, A[k]);\n  const pal = PALETTES[A.color] || PALETTES.purple;\n  const tags = [...new Set([...QUESTIONS.flatMap(q => o(q.id).tags), ...(duo ? QUESTIONS.flatMap(q => optOf(q.id, B[q.id]).tags) : [])])];\n  const topTags = tags.slice(0, 6);\n  const poem = [...(POEMS[A.vibe] || POEMS.warm), FLOWER_LINE[A.flower] || ''];\n  const lc = s => s.toLowerCase();\n  const world = `Kalau hubungan kita adalah sebuah dunia, dia ada di <b>${o('p ostalgia jaman SD<\/p><h1 class=\"title\">Biodata <span>Binder<\/span> 📒<\/h1><p class=\"sub\">Isi biodata kayak dulu di kertas binder — terus bandingin punya Razan & Dara!<\/p><\/div>\n  <div class=\"tabs\" id=\"tabs\"><button data-t=\"Dara\">🙋‍♀️ Dara<\/button><button data-t=\"Razan\">🙋‍♂️ Razan<\/button><button data-t=\"cmp\">💞 Bandingin<\/button><\/div>\n  <div id=\"view\"><\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<\script>\nconst WA = { Razan: '6285692740607', Dara: '6287703706518' };\nconst JADIAN = '2025-05-10';\nconst $ = id => document.getElementById(id);\nfunction lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\nconst pad = n => String(n).padStart(2, '0');\nconst ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nfunction parseYMD(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }\nconst today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\nconst BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];\nconst fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;\nconst otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';\nconst waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)} ; $('cnt').textContent = `${Q.filter(([q]) => (x[q] || '').trim()).length}/${Q.length} keisi · otomatis kesimpen`; upWa(); }));\n  upWa();\n}\nfunction upWa() { const d = get(tab); const w = $('wa'); if (!w) return; w.href = waLink(otherOf(tab), `📒 BIODATA ${tab.toUpperCase()}\\n` + Q.filter(([k]) => (d[k] || '').trim()).map(([k, l]) => `${l}: ${d[k]}`).join('\\n')); }\nfunction renderCmp() {\n  const r = get('Razan'), d = get('Dara');\n  const both = Q.filter(([k]) => (r[k] || '').trim() && (d[k] || '').trim());\n  const same = both.filter(([k]) => r[k].trim().toLowerCase() === d[k].trim().toLowerCase());\n  $('view').innerHTML = (both.length ? `<div class=\"score\"><b>${same.length}<\/b><p>jawaban yang sama persis dari ${both.length} yang diisi berdua${same.length ? ' — jodoh 😌' : ''}<\/p><\/div>` : '<p class=\"empty\">Isi biodata Razan & Dara dulu (bisa di HP ini dua-duanya, gantian) — nanti dibandingin di sini 💞<\/p>') +\n    `<div class=\"cmp\">${Q.map(([k, l]) => { const a = (r[k] || '').trim(), b = (d[k] || '').trim(); if (!a && !b) return ''; return `<div class=\"cm ${a && b && a.toLowerCase() === b.toLowerCase() ? 'same' : ''}\"><small>${l}<\/small><div><p class=\"r\">${a ? esc(a) : '…'}<\/p><p class=\"d\">${b ? esc(b) : '…'}<\/p><\/div><\/div>`; }).join('')}<\/div>`;\n}\ndocument.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; lsSet('binder-tab', tab); render(); });\nasync function savePng() {\n  await fontsReady(); const d = get(tab), [pc, stk] = PAPERS[tab];\n  const W = 1080, LH = 64, H = 260 + Q.length * LH + 80, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');\n  x.fillStyle = pc; x.fillRect(0, 0, W, H);\n  x.strokeStyle = '#cfe0f3'; x.lineWidth = 2; for (let y = 200; y < H; y += LH) { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }\n  x.strokeStyle = '#f3b7b7'; x.lineWidth = 3; x.beginPath(); x.moveTo(110, 0); x.lineTo(110, H); x.stroke();\n  x.fillStyle = '#efe8de'; for (let y = 60; y < H; y += 130) { x.beginPath(); x.arc(52, y, 16, 0, 7); x.fill(); }\n  x.fillStyle = '#7a3f35'; x.font = \"700 84px Caveat, 'Segoe Script', cursive\"; x.fillText(`Biodata ${tab} ✍️`, 140, 150); x.font = '64px serif'; x.fillText(stk, W - 120, 120);\n  Q.forEach(([k, l], i) => { const y = 200 + (i + 1) * LH - 16; x.fillStyle = '#9a8070'; x.font = '400 24px Poppins, sans-serif'; x.fillText(l + ' :', 140, y); const lw = x.measureText(l + ' :').width; x.fillStyle = '#2f4f8a'; x.font = \"700 40px Caveat, 'Segoe Script', cursive\"; let v = d[k] || ''; while (x.measureText(v).width > W - 200 - lw && v.length > 3) v = v.slice(0, -2) + '…'; x.fillText(v, 155 + lw, y); });\n  shareCanvas(c, `biodata-${tab.toLowerCase()}.png`, 'Biodata Binder');\n}\nrender();\n\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf Default();window.top.location.href='index.html';}},true);}<\/script>\n<\script>/* link ke halaman lain dibuka di jendela utama */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.target||a.hasAttribute('download'))return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|tel:|#|javascript:|blob:|data:)/i.test(h))return;e.preventDefault();window.top.location.href=h;},true);}<\/script>\n<\/body>\n<\/html>\n",

:center;padding:1.2rem}\n  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}\n  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}\n  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}\n  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}\n  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}\n  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}\n  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}\n  .toast a{color:#ffd9c9}\n  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}\n\n  .screen{display:none}.screen.on{display:block;animation:fi .3s ease}\n  @keyframes fi{from{opacity:0}to{opacity:1}}\n  .prog{height:8px;border-radius:8px;background:rgba(193,122,111,.15);overflow:hidden;margin:.4rem 0 1rem}\n  .prog i{display:block;height:100%;background:var(--rose);border-radius:8px;transition:width .3s}\n  .qn{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.1em}\n  .qt{text-align:center;font-size:15px;font-weight:600;margin:.3rem 0 1rem;line-height:1.4}\n  .ch{display:block;width:100%;text-align:left;padding:1rem;border-radius:18px;border:1.5px solid var(--blush);background:#fff;font-size:13.5px;line-height:1.5;color:var(--ink);cursor:pointer;margin-bottom:.6rem}\n  .ch:active{background:var(--warm)}\n  .ch b{color:var(--rose)}\n  .res{display:flex;flex-direction:column;gap:.55rem}\n  .rl{display:flex;align-items:center;gap:.6rem}\n  .rl .e{font-size:1.3rem;width:30px;text-align:center}\n  .rl .b{flex:1}\n  .rl .b span{display:flex;justify-content:space-between;font-size:12px;margin-bottom:.2rem}\n  .rl .bar{height:9px;border-radius:9px;background:rgba(193,122,111,.13);overflow:hidden;position:relative}\n  .rl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width 1s}\n  .rl .bar i.r{background:var(--rz)}.rl .bar i.d{background:var(--dr);opacity:.85}\n  .top1{text-align:center;margin-bottom:.8rem}\n  .top1 .e{font-size:3rem;display:block}\n  .top1 h2{font-size:1.25rem;font-weight:700;color:var(--deep)}\n  .top1 p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:.3rem}\n  .tips{font-size:12.5px;line-height:1.7;color:var(--ink)}\n  .tips li{margin-left:1rem}\n  .legend{display:flex;gap:.8rem;justify-content:center;font-size:11px;margin-bottom:.6rem}\n  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.25rem;vertical-align:-1px}\n\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <div class=\"top\"><a href=\"index.html\" class=\"pill\">← Menu utama<\/a><button class=\"pill\" id=\"who-btn\"><\/button><\/div>\n  <div class=\"screen on\" id=\"s-home\">\n    <div class=\"head\"><span class=\"ico\">💞<\/span><p class=\"lbl\">Kuis Bahasa Cinta<\/p><h1 class=\"title\">Kamu ngerasa <span>disayang<\/span> lewat apa?<\/h1><p class=\"sub\">15 pilihan cepet. Ga ada jawaban salah — pilih yang paling “kamu banget”.<\/p><\/div>\n    <div class=\"card\" id=\"home-res\"><\/div>\n    <button class=\"btn\" onclick=\"start()\">Mulai kuis ✨<\/button>\n  <\/div>\n  <div class=\"screen\" id=\"s-quiz\">\n    <div class=\"prog\"><i id=\"pg\"><\/i><\/div>\n    <p class=\"qn\" id=\"qn\"><\/p><p class=\"qt\">Mana yang bikin kamu lebih ngerasa disayang?<\/p>\n    <button class=\"ch\" id=\"c0\"><\/button><button class=\"ch\" id=\"c1\"><\/button>\n  <\/div>\n  <div class=\"screen\" id=\"s-res\">\n    <div class=\"top1\" id=\"top1\"><\/div>\n    <div class=\"card\"><h3>Hasil lengkap<\/h3><div class=\"legend\" id=\"legend\"><\/div><div class=\"res\" id=\"res\"><\/div><\/div>\n    <div class=\"card\" id=\"tipcard\"><\/div>\n    <a class=\"btn wa\" id=\"share\" target=\"_blank\" rel=\"noopener\">💬 Kirim hasilku ke <span id=\"to\"><\/span><\/a>\n    <button class=\"btn ghost\" style=\"margin-top:.5rem\" onclick=\"show('s-home');paintHome()\">Selesai<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<\script>\nconst WA = { Razan: '6285692740607', Dara: '6287703706518' };\nconst JADIAN = '2025-05-10';\nconst $ = id => document.getElementById(id);\nfunction lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\nconst pad = n => String(n).padStart(2, '0');\nconst ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nfunction parseYMD(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }\nconst today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\nconst BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];\nconst fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;\nconst otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';\nconst waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;\nlet __toastT;\nfunction toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }\nfunction confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {\n  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);\n}\nasync function shareCanvas(cv, name, title) {\n  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));\n  if (!blob) return;\n  const file = new File([blob], name, { type: 'image/png' });\n  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  toast('⬇️ Gambar disimpan');\n}\nfunction wrapText(ctx, text, maxW) { const out = []; String(text).split('\\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }\nasync function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }\n// siapa yang lagi pakai HP ini (Razan / Dara)\nfunction whoBtn(key, onChange) {\n  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');\n  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };\n  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };\n  paint(); return lsGet(key, 'Dara');\n}\n\nconst LANG = {\n  K: ['💬', 'Kata-kata', 'Pujian, “aku sayang kamu”, chat panjang, dan semangat dari mulut dia.', ['Bilang “aku bangga sama kamu” dengan alasan yang jelas', 'Kirim chat manis tanpa alasan', 'Tulis surat / catatan kecil']],\n  W: ['⏰', 'Waktu bareng', 'Perhatian penuh — ngobrol tanpa HP, jalan berdua, telponan lama.', ['Telpon tanpa sambil ngapa-ngapain', 'Bikin jadwal kencan rutin', 'Dengerin ceritanya sampai selesai']],\n  H: ['🎁', 'Hadiah', 'Bukan soal mahal — tapi “dia inget aku” lewat barang kecil yang bermakna.', ['Beliin jajanan favoritnya tiba-tiba', 'Simpen barang kecil dari momen bareng', 'Kasih kejutan kecil di hari biasa']],\n  B: ['🤲', 'Bantuan', 'Ngerasa disayang waktu dia ngebantu & ngeringanin beban.', ['Tawarin bantu sebelum diminta', 'Inget & beresin hal kecil yang dia ga sempet', 'Jemput / anterin pas dia capek']],\n  S: ['🫂', 'Sentuhan', 'Peluk, gandengan, sandaran — kedekatan fisik bikin tenang.', ['Gandeng tangannya pas jalan', 'Peluk lama pas ketemu', 'Puk-puk pas dia lagi sedih']],\n};\n// 15 pasangan pilihan: [kode A, teks A, kode B, teks B]\nconst QS = [\n  ['K', 'Dia bilang “kamu cantik banget hari ini”', 'S', 'Dia meluk kamu tiba-tiba dari samping'],\n  ['W', 'Seharian
