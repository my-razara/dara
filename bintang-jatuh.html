<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Bintang Jatuh — Untuk Dara 🌠</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  html, body { height: 100%; overscroll-behavior: none; }
  #sky { touch-action: manipulation; }

  .top-btn {
    position: fixed; top: calc(.9rem + env(safe-area-inset-top)); z-index: 12;
    font-size: 11.5px; color: rgba(255,255,255,.7); text-decoration: none;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    padding: .38rem .8rem; border-radius: 50px; backdrop-filter: blur(4px); cursor: pointer;
  }
  .top-btn:active { background: rgba(255,255,255,.15); }
  .back-link { left: .9rem; }
  .coll-btn { white-space: nowrap; left: 50%; transform: translateX(-50%); top: auto; bottom: calc(1rem + env(safe-area-inset-bottom)); display: none; }
  .coll-btn.show { display: block; }

  body {
    background: #0a0515;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    cursor: default;
  }

  /* ── SKY CANVAS ── */
  #sky {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* ── HEADER ── */
  .sky-header {
    position: fixed; top: 0; left: 0; right: 0;
    text-align: center;
    padding: calc(3.3rem + env(safe-area-inset-top)) 1.25rem 1rem;
    z-index: 10; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,5,21,.85) 0%, transparent 100%);
  }
  .sky-label {
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    color: rgba(201,169,110,.7); display: block; margin-bottom: .3rem;
  }
  .sky-title {
    font-size: clamp(1.2rem,5vw,1.6rem);
    font-weight: 700; color: #fff;
    text-shadow: 0 0 20px rgba(180,150,255,.4);
  }
  .sky-title span { color: #c9a96e; }
  .sky-hint {
    font-size: 11px; color: rgba(255,255,255,.4);
    margin-top: .3rem;
    animation: blink 2.5s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.8} }

  /* ── COUNTER ── */
  .star-counter {
    position: fixed; top: calc(.9rem + env(safe-area-inset-top)); right: .9rem;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50px; padding: .3rem .85rem;
    font-size: 11px; color: rgba(255,255,255,.5);
    z-index: 10; backdrop-filter: blur(4px);
  }
  .star-counter span { color: #c9a96e; font-weight: 700; }

  /* ── MESSAGE CARD ── */
  #msg-card {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #msg-card.show {
    display: block;
    pointer-events: auto;
  }

  .msg-inner {
    max-width: 420px; margin: 0 auto;
    background: rgba(10,5,21,.92);
    border: 1px solid rgba(201,169,110,.25);
    border-radius: 20px 20px 16px 16px;
    padding: 1.3rem 1.35rem 1.15rem;
    max-height: calc(100dvh - 2rem); overflow-y: auto;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -4px 40px rgba(0,0,0,.4);
    animation: slideup .4s cubic-bezier(.34,1.3,.64,1);
  }
  @keyframes slideup { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }

  .msg-drag { width: 32px; height: 3px; background: rgba(255,255,255,.2); border-radius: 2px; margin: 0 auto .85rem; }
  .msg-star-icon { font-size: 1.75rem; display: block; text-align: center; margin-bottom: .5rem; animation: twinkle 1.5s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .msg-num { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #c9a96e; display: block; text-align: center; margin-bottom: .6rem; }
  .msg-text { font-size: clamp(13px,3.5vw,15px); color: #fff; line-height: 1.85; text-align: center; font-weight: 300; margin-bottom: .6rem; }
  .msg-sign { font-size: 11px; color: rgba(201,169,110,.7); display: block; text-align: center; margin-bottom: 1rem; }
  .msg-close {
    width: 100%; padding: .75rem; border-radius: 50px; border: 1px solid rgba(201,169,110,.3);
    background: rgba(201,169,110,.1); color: #c9a96e;
    font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .msg-close:active { background: rgba(201,169,110,.2); }
  .msg-row { display: flex; gap: .5rem; margin-top: .5rem; }
  .msg-row > * { flex: 1; text-align: center; text-decoration: none; padding: .6rem .4rem; border-radius: 50px; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.7); background: transparent; cursor: pointer; white-space: nowrap; }
  .msg-row > *:active { background: rgba(255,255,255,.08); }
  .msg-row .wa { border-color: rgba(37,211,102,.35); color: #7fe0a6; }

  /* ── KOLEKSI ── */
  #coll {
    display: none; position: fixed; inset: 0; z-index: 25; background: rgba(6,3,15,.88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    align-items: flex-end; justify-content: center;
  }
  #coll.show { display: flex; }
  .coll-sheet {
    width: 100%; max-width: 440px; max-height: 82dvh; overflow-y: auto;
    background: #120a24; border: 1px solid rgba(201,169,110,.2); border-bottom: none;
    border-radius: 22px 22px 0 0; padding: 1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));
    animation: slideup .35s ease;
  }
  .coll-title { text-align: center; color: #fff; font-size: 14px; font-weight: 600; margin-bottom: .2rem; }
  .coll-sub { text-align: center; color: rgba(255,255,255,.4); font-size: 11px; margin-bottom: 1rem; }
  .coll-item { display: flex; gap: .65rem; padding: .7rem .2rem; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; }
  .coll-item:last-of-type { border-bottom: none; }
  .ci-ic { font-size: 1.1rem; flex-shrink: 0; }
  .ci-n { font-size: 9px; letter-spacing: .15em; color: #c9a96e; text-transform: uppercase; display: block; }
  .ci-t { font-size: 12.5px; color: rgba(255,255,255,.85); line-height: 1.6; font-weight: 300; display: block; }
  .coll-close { width: 100%; margin-top: .9rem; }

  /* ── ALL DONE ── */
  #done-overlay {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(10,5,21,.9); backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 2rem;
  }
  #done-overlay.show { display: flex; }
  .done-emoji { font-size: 4rem; margin-bottom: 1rem; display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .done-title { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: .5rem; }
  .done-title span { color: #c9a96e; }
  .done-sub { font-size: 13px; color: rgba(255,255,255,.5); line-height: 1.75; max-width: 300px; margin: 0 auto 2rem; }
  .done-btn {
    padding: .9rem 2.5rem; border-radius: 50px; border: none; cursor: pointer;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg,#c17a6f,#c9a96e); color: #fff;
    box-shadow: 0 4px 20px rgba(193,122,111,.4);
  }
  .done-btn:active { opacity: .85; transform: scale(.97); }
  .done-link { margin-top: .9rem; background: none; border: none; color: rgba(255,255,255,.55); font-size: 12px; text-decoration: underline; cursor: pointer; }

  .sky-note {
    position: fixed; left: 50%; bottom: calc(4rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,.4); z-index: 6; pointer-events: none; text-align: center; white-space: nowrap;
    transition: opacity .4s;
  }

  @media (max-width: 360px) {
    .sky-title { font-size: 1.15rem; }
    .msg-row > * { font-size: 11px; }
  }

  /* ── TAP RIPPLE ── */
  .tap-ripple {
    position: fixed; border-radius: 50%;
    width: 60px; height: 60px;
    border: 1.5px solid rgba(255,255,255,.3);
    transform: translate(-50%,-50%) scale(0);
    animation: ripple .6s ease forwards;
    pointer-events: none; z-index: 5;
  }
  @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(0);opacity:.8} 100%{transform:translate(-50%,-50%) scale(2.5);opacity:0} }
</style>
<script src="sfx.js" defer></script>
</head>
<body>

<canvas id="sky" aria-label="Langit malam, tap buat manggil bintang"></canvas>
<a href="index.html" class="top-btn back-link">← Menu utama</a>

<div class="sky-header">
  <span class="sky-label">Khusus untuk Dara</span>
  <h1 class="sky-title">Bintang <span>Jatuh</span> 🌠</h1>
  <p class="sky-hint">✨ Tap langit untuk memanggil bintang</p>
</div>

<div class="star-counter" aria-live="polite">
  <span id="star-count">0</span> / 25 bintang
</div>

<!-- Message card -->
<div id="msg-card">
  <div class="msg-inner">
    <div class="msg-drag"></div>
    <span class="msg-star-icon" id="msg-icon">🌟</span>
    <span class="msg-num" id="msg-num">Bintang #1</span>
    <p class="msg-text" id="msg-text">...</p>
    <span class="msg-sign">— Razan 🤍</span>
    <button class="msg-close" id="msg-close" onclick="closeMsg()">Tutup & Cari Bintang Lagi ✨</button>
    <div class="msg-row">
      <a class="wa" id="msg-wa" href="#" target="_blank" rel="noopener">💬 Bales ke Razan</a>
    </div>
  </div>
</div>

<button class="top-btn coll-btn" id="coll-btn" onclick="openColl()">📜 Koleksi bintang</button>
<p class="sky-note" id="sky-note"></p>

<div id="coll" onclick="if(event.target===this)closeColl()">
  <div class="coll-sheet">
    <p class="coll-title">🌌 Rasi bintang kamu</p>
    <p class="coll-sub" id="coll-sub"></p>
    <div id="coll-list"></div>
    <button class="msg-close coll-close" onclick="closeColl()">Tutup</button>
  </div>
</div>

<!-- Done -->
<div id="done-overlay">
  <span class="done-emoji">🌌</span>
  <h2 class="done-title">Semua bintang <span>sudah jatuh</span></h2>
  <p class="done-sub">25 bintang, 25 pesan — semua sudah kamu tangkap. Makasih udah ada di langit aku, Dara. 🤍</p>
  <button class="done-btn" onclick="resetSky()">Hidupkan Lagi Langitnya 🌠</button>
  <button class="done-link" onclick="document.getElementById('done-overlay').classList.remove('show');openColl()">📜 Baca ulang semua bintang</button>
  <button class="done-link" style="margin-top:.3rem" onclick="document.getElementById('done-overlay').classList.remove('show')">Liat rasi bintangnya</button>
</div>

<script>
const MESSAGES = [
  { icon: "🌟", text: "Kamu itu hal yang aku syukuri setiap hari — bahkan di hari yang berat sekalipun." },
  { icon: "💫", text: "Ada banyak hal di dunia ini yang ga bisa aku kontrol. Tapi rasa sayang aku ke kamu, itu aku jaga." },
  { icon: "✨", text: "Kamu ga harus jadi sempurna. Kamu sudah lebih dari cukup — persis seperti kamu sekarang." },
  { icon: "🌠", text: "Hal yang aku suka dari kamu bukan satu hal besar — tapi ribuan hal kecil yang terus-terusan bikin aku pilih kamu." },
  { icon: "⭐", text: "Kalau langit malam ini punya bintang sebanyak hal yang aku suka dari kamu, langitnya ga akan pernah gelap." },
  { icon: "🌟", text: "Kamu adalah jenis orang yang bikin ruangan terasa lebih hangat cuma dengan hadir di sana." },
  { icon: "💫", text: "Aku ga tau banyak hal di dunia ini. Tapi aku tau aku mau kamu ada di setiap versi hidup aku." },
  { icon: "✨", text: "Waktu aku capek dan ngerasa ga cukup — aku inget ada kamu. Dan entah kenapa itu selalu cukup buat aku lanjut." },
  { icon: "🌠", text: "Matamu itu. Aku ga pernah bisa sepenuhnya jelasin kenapa — tapi selalu bikin aku ngerasa aman." },
  { icon: "⭐", text: "Kalau bisa milih ulang, aku tetap pilih kamu. Di semua kemungkinan yang ada, jawabannya tetap kamu." },
  { icon: "🌟", text: "Kamu yang pertama aku mau kabarin waktu sesuatu yang baik terjadi. Dan kamu yang pertama aku cari waktu sesuatu yang buruk terjadi." },
  { icon: "💫", text: "Ada sesuatu dari cara kamu ketawa yang bikin aku lupa semua hal yang lagi aku khawatirkan." },
  { icon: "✨", text: "Kamu punya ketenangan yang jarang aku temuin di tempat lain. Dan itu salah satu hal yang paling aku syukuri dari kamu." },
  { icon: "🌠", text: "Aku perhatiin banyak hal kecil dari kamu. Dan semakin aku perhatiin, semakin aku sadar — kamu luar biasa." },
  { icon: "⭐", text: "Semua hal yang aku lakuin punya rasa yang lebih ringan karena ada kamu. Bukan karena kamu yang bantu — tapi karena kamu ada." },
  { icon: "🌟", text: "Kamu adalah orang yang bikin aku percaya bahwa hal-hal baik memang ada dan memang bisa bertahan." },
  { icon: "💫", text: "Setiap momen sama kamu aku simpan baik-baik. Karena aku tau — momen itu ga akan datang dua kali." },
  { icon: "✨", text: "Kamu ga sadar betapa banyak yang kamu kasih ke aku — ketenangan, semangat, dan alasan untuk jadi lebih baik." },
  { icon: "🌠", text: "Aku selalu berharap kamu bisa lihat diri kamu dari sudut pandang aku. Karena yang aku lihat itu indah banget." },
  { icon: "⭐", text: "Di antara semua hal yang datang dan pergi — kamu yang aku mau tetap ada. Selamanya kalau bisa." },
  { icon: "🌟", text: "Cara kamu hadir itu beda. Ga banyak orang yang bisa bikin orang lain ngerasa se-dihargai itu." },
  { icon: "💫", text: "Kamu itu bukan Plan B. Kamu itu satu-satunya yang aku rencanakan." },
  { icon: "✨", text: "Makasih udah ada. Makasih udah mau. Makasih udah jadi kamu yang sekarang." },
  { icon: "🌠", text: "Langit malam ini cantik. Tapi ga lebih cantik dari kamu waktu kamu senyum beneran." },
  { icon: "⭐", text: "Dari sekian banyak hal yang aku harapin di hidup aku — kamu adalah salah satu yang sudah terjawab. 🤍" },
];

// ── STATE (kesimpen) ──
// caught = urutan bintang yang udah ketangkep: {i: index pesan, x, y (0..1 posisi di langit)}
const KEY = 'bintang-jatuh';
const WA = '6285692740607';
let caught = [];
try {
  const d = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(d)) caught = d.filter(c => c && MESSAGES[c.i] && isFinite(c.x) && isFinite(c.y));
} catch (e) {}
const seenIdx = new Set(caught.map(c => c.i));
let remaining = [...Array(MESSAGES.length).keys()].filter(i => !seenIdx.has(i)).sort(() => Math.random() - .5);
let revealed = caught.length;
let msgOpen = false;
let flying = false;        // [FIX] satu bintang lagi terbang → tap lain diabaikan (dulu pesan bisa kelewat)
let current = null;        // posisi di caught yang lagi dibuka
let currentFresh = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(caught)); } catch (e) {} }

// Canvas setup
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgCache = null;
}

// Static background stars
const bgStars = [];
function initBgStars() {
  bgStars.length = 0;
  for (let i = 0; i < 180; i++) {
    bgStars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.2 + .2,
      alpha: Math.random() * .6 + .2,
      twinkleSpeed: Math.random() * .02 + .005,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

const shooters = [];
const particles = [];
let frame = 0, lastT = 0, raf = 0;
let bgCache = null;

function drawStaticStars() {
  // langit + nebula digambar sekali ke kanvas cadangan (lebih hemat baterai)
  if (!bgCache) {
    bgCache = document.createElement('canvas');
    bgCache.width = canvas.width; bgCache.height = canvas.height;
    const b = bgCache.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const grad = b.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#04011a'); grad.addColorStop(.5, '#080220'); grad.addColorStop(1, '#0d0525');
    b.fillStyle = grad; b.fillRect(0, 0, W, H);
    const neb1 = b.createRadialGradient(W * .25, H * .3, 0, W * .25, H * .3, W * .35);
    neb1.addColorStop(0, 'rgba(80,40,120,.12)'); neb1.addColorStop(1, 'transparent');
    b.fillStyle = neb1; b.fillRect(0, 0, W, H);
    const neb2 = b.createRadialGradient(W * .75, H * .6, 0, W * .75, H * .6, W * .3);
    neb2.addColorStop(0, 'rgba(40,80,120,.1)'); neb2.addColorStop(1, 'transparent');
    b.fillStyle = neb2; b.fillRect(0, 0, W, H);
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0); ctx.restore();
}

function drawCaught(t) {
  if (!caught.length) return;
  // garis rasi bintang (urut ketangkep)
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(201,169,110,.16)';
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  caught.forEach((c, k) => { const x = c.x * W, y = c.y * H; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.setLineDash([]);
  caught.forEach((c, k) => {
    const x = c.x * W, y = c.y * H;
    const pulse = .75 + .25 * Math.sin(t / 700 + k);
    const hl = current === k && msgOpen;
    const R = (hl ? 16 : 11) * pulse;
    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(255,236,190,${hl ? 1 : .95})`);
    g.addColorStop(.35, `rgba(201,169,110,${hl ? .6 : .4})`);
    g.addColorStop(1, 'rgba(201,169,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
    // kilau 4 arah
    ctx.strokeStyle = `rgba(255,240,200,${.5 * pulse})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - R * .9, y); ctx.lineTo(x + R * .9, y); ctx.moveTo(x, y - R * .9); ctx.lineTo(x, y + R * .9); ctx.stroke();
  });
}

function animate(t) {
  raf = requestAnimationFrame(animate);
  const dt = lastT ? Math.min(3, (t - lastT) / 16.667) : 1;   // 1 = satu frame 60fps → kecepatan sama di semua layar
  lastT = t;
  frame += dt;

  drawStaticStars();

  bgStars.forEach(s => {
    const alpha = s.alpha + Math.sin(frame * s.twinkleSpeed + s.twinkleOffset) * .15;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, alpha))})`;
    ctx.fill();
  });

  drawCaught(t);

  // Shooting stars
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= s.decay * dt;
    s.trail.push({ x: s.x, y: s.y });
    if (s.trail.length > 22) s.trail.shift();

    if (s.life <= 0) {
      if (!s.burst) {
        s.burst = true;
        spawnBurst(s.x, s.y, s.color);
        if (s.onEnd) s.onEnd(s.x, s.y);
      }
      shooters.splice(i, 1);
      continue;
    }

    for (let j = 1; j < s.trail.length; j++) {
      const prog = j / s.trail.length;
      ctx.beginPath();
      ctx.moveTo(s.trail[j - 1].x, s.trail[j - 1].y);
      ctx.lineTo(s.trail[j].x, s.trail[j].y);
      ctx.strokeStyle = `rgba(${s.color},${prog * s.life * .9})`;
      ctx.lineWidth = prog * 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 6);
    grd.addColorStop(0, `rgba(${s.color},${s.life})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += .04 * dt;
    p.life -= .025 * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color},${p.life})`;
    ctx.fill();
  }
}

function spawnBurst(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const speed = Math.random() * 2.5 + .5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      r: Math.random() * 2 + 1,
      life: Math.random() * .5 + .5,
      color,
    });
  }
}

function launchShooter(fromX, fromY, onEnd) {
  const speed = Math.random() * 3 + 4;
  const startX = fromX + (Math.random() - .5) * 120;
  const startY = fromY - Math.random() * 200 - 100;
  const dx = fromX - startX;
  const dy = fromY - startY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const nx = dx / dist, ny = dy / dist;
  const colors = ['255,255,255', '255,240,180', '200,180,255', '180,220,255', '255,200,180'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  shooters.push({ x: startX, y: startY, vx: nx * speed, vy: ny * speed, life: 1, decay: .018, trail: [], color, burst: false, onEnd });
}

function ripple(x, y) {
  const r = document.createElement('div');
  r.className = 'tap-ripple';
  r.style.left = x + 'px'; r.style.top = y + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

// Tap handler
canvas.addEventListener('click', e => {
  if (msgOpen) return;
  const x = e.clientX, y = e.clientY;

  // tap bintang emas yang udah ketangkep → baca lagi pesannya
  let best = -1, bd = 26 * 26;
  caught.forEach((c, k) => { const d = (c.x * W - x) ** 2 + (c.y * H - y) ** 2; if (d < bd) { bd = d; best = k; } });
  if (best >= 0) { ripple(x, y); openCaught(best, false); return; }

  if (remaining.length === 0) {
    document.getElementById('done-overlay').classList.add('show');
    return;
  }
  if (flying) return;
  flying = true;
  ripple(x, y);
  try { navigator.vibrate && navigator.vibrate(10); } catch (_) {}

  const count = Math.floor(Math.random() * 2) + 1;
  for (let i = 0; i < count; i++) {
    const isLast = i === count - 1;
    launchShooter(x, y, isLast ? () => { flying = false; showMessage(x, y); } : null);
  }
  // jaga-jaga kalau tab ketutup pas bintang lagi terbang
  setTimeout(() => { if (flying) { flying = false; showMessage(x, y); } }, 2500);
});

function showMessage(x, y) {
  if (!remaining.length) return;
  const idx = remaining.pop();
  // posisi bintang emas: jangan ketutup header / kartu pesan
  const px = Math.min(.94, Math.max(.06, x / W));
  const py = Math.min(.86, Math.max(.2, y / H));
  caught.push({ i: idx, x: px, y: py });
  revealed = caught.length;
  save();
  try { navigator.vibrate && navigator.vibrate([15, 40, 25]); } catch (_) {}
  openCaught(caught.length - 1, true);
}

function openCaught(k, fresh) {
  const c = caught[k];
  if (!c) return;
  msgOpen = true;
  current = k; currentFresh = fresh;
  const msg = MESSAGES[c.i];
  document.getElementById('msg-icon').textContent = msg.icon;
  document.getElementById('msg-num').textContent = `Bintang #${k + 1}`;
  document.getElementById('msg-text').textContent = msg.text;
  document.getElementById('msg-close').textContent = fresh ? 'Tutup & Cari Bintang Lagi ✨' : 'Tutup ✨';
  document.getElementById('msg-wa').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(`Razan, aku nangkep bintang #${k + 1} 🌠\n\n"${msg.text}"\n\n`);
  const card = document.getElementById('msg-card');
  card.classList.remove('show'); void card.offsetWidth;
  card.classList.add('show');
  updateUI();
}

function closeMsg() {
  if (!msgOpen) return;
  document.getElementById('msg-card').classList.remove('show');
  msgOpen = false;
  const wasFresh = currentFresh;
  current = null; currentFresh = false;
  if (wasFresh && remaining.length === 0) {
    setTimeout(() => {
      document.getElementById('done-overlay').classList.add('show');
    }, 500);
  }
}

function updateUI() {
  document.getElementById('star-count').textContent = revealed;
  document.getElementById('coll-btn').classList.toggle('show', caught.length > 0);
  const note = document.getElementById('sky-note');
  note.textContent = caught.length && remaining.length ? '✨ Tap bintang emas buat baca lagi pesannya' : '';
}

function openColl() {
  const list = document.getElementById('coll-list');
  document.getElementById('coll-sub').textContent = `${caught.length} dari ${MESSAGES.length} bintang udah kamu tangkep`;
  list.innerHTML = caught.length ? caught.map((c, k) => {
    const m = MESSAGES[c.i];
    return `<button class="coll-item" onclick="closeColl();openCaught(${k},false)"><span class="ci-ic">${m.icon}</span><span><span class="ci-n">Bintang #${k + 1}</span><span class="ci-t"></span></span></button>`;
  }).join('') : '<p class="coll-sub">Belum ada. Tap langitnya dulu ✨</p>';
  // teks diisi lewat textContent biar aman
  list.querySelectorAll('.ci-t').forEach((el, k) => el.textContent = MESSAGES[caught[k].i].text);
  document.getElementById('coll').classList.add('show');
}
function closeColl() { document.getElementById('coll').classList.remove('show'); }

function resetSky() {
  if (!confirm('Hidupin lagi langitnya? Semua bintang emas bakal ilang dan 25 bintang bisa ditangkep dari awal lagi.')) return;
  caught = [];
  save();
  remaining = [...Array(MESSAGES.length).keys()].sort(() => Math.random() - .5);
  revealed = 0;
  document.getElementById('done-overlay').classList.remove('show');
  document.getElementById('msg-card').classList.remove('show');
  msgOpen = false; flying = false; current = null;
  updateUI();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMsg(); closeColl(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(raf);
  else { lastT = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(animate); }
});

// Init
window.addEventListener('resize', resize);
initBgStars();
resize();
updateUI();
raf = requestAnimationFrame(animate);
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
