<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cloud Wishes — Dari Razan ☁️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}
  html,body{height:100%;overflow:hidden}
  body{background:linear-gradient(180deg,#b8d4f0 0%,#daeafa 40%,#f0f7ff 100%)}

  /* Sky layers */
  #sky{position:fixed;inset:0;z-index:0;overflow:hidden}
  .sky-sun{
    position:absolute;top:10%;left:50%;transform:translateX(-50%);
    width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,#fff9c4,#ffe082);
    box-shadow:0 0 60px rgba(255,224,130,.6),0 0 120px rgba(255,224,130,.3);
    animation:sunpulse 4s ease-in-out infinite;
  }
  @keyframes sunpulse{0%,100%{box-shadow:0 0 60px rgba(255,224,130,.6),0 0 120px rgba(255,224,130,.3)}50%{box-shadow:0 0 80px rgba(255,224,130,.8),0 0 160px rgba(255,224,130,.4)}}

  .sky-ray{position:absolute;top:10%;left:50%;transform-origin:0 40px;width:200px;height:2px;background:linear-gradient(to right,rgba(255,235,150,.4),transparent);border-radius:1px}

  /* Ground */
  .ground{position:fixed;bottom:0;left:0;right:0;height:22%;background:linear-gradient(to bottom,#a8d5a2,#7ab87a);z-index:1}
  .ground::before{content:'';position:absolute;top:-20px;left:0;right:0;height:40px;background:radial-gradient(ellipse 55% 100% at 50% 100%,#a8d5a2,transparent)}

  /* Canvas for clouds */
  #canvas{position:fixed;inset:0;z-index:2;cursor:pointer}

  /* Wish popup */
  #wish-popup{
    position:fixed;inset:0;z-index:20;
    display:none;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #wish-popup.show{display:flex}
  .wish-bubble{
    background:rgba(255,255,255,.95);
    border-radius:24px;
    padding:1.5rem 1.75rem;
    max-width:300px;
    text-align:center;
    box-shadow:0 8px 40px rgba(100,150,200,.25);
    animation:bubblepop .4s cubic-bezier(.34,1.5,.64,1);
    pointer-events:all;
    position:relative;
  }
  @keyframes bubblepop{from{transform:scale(.4) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .wish-icon{font-size:2.5rem;display:block;margin-bottom:.6rem}
  .wish-num{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#90aec0;display:block;margin-bottom:.35rem}
  .wish-text{font-size:15px;font-weight:600;color:#2d4a6b;line-height:1.55;margin-bottom:1rem}
  .wish-close{
    padding:.6rem 1.75rem;border-radius:50px;border:none;cursor:pointer;
    font-size:13px;font-weight:600;
    background:linear-gradient(135deg,#7bb8e8,#5a9fd4);color:#fff;
    box-shadow:0 3px 12px rgba(90,159,212,.35);transition:all .15s;
  }
  .wish-close:active{transform:scale(.95)}

  /* Counter */
  #counter{
    position:fixed;top:calc(1.1rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:10;
    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border-radius:50px;padding:.35rem 1.1rem;
    font-size:12px;font-weight:600;color:#4a7a9b;
    box-shadow:0 2px 12px rgba(100,150,200,.15);
    white-space:nowrap;
  }

  /* Intro hint */
  #hint{
    position:fixed;bottom:28%;left:50%;transform:translateX(-50%);
    z-index:10;text-align:center;
    animation:hintfloat 3s ease-in-out infinite;
  }
  @keyframes hintfloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
  .hint-icon{font-size:1.6rem;display:block;margin-bottom:.25rem}
  .hint-text{font-size:12px;color:#5a8aaa;font-weight:500;background:rgba(255,255,255,.6);border-radius:50px;padding:.25rem .85rem}

  /* All done overlay */
  #done-overlay{
    position:fixed;inset:0;z-index:30;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(184,212,240,.92);backdrop-filter:blur(12px);
    padding:1.5rem;text-align:center;
  }
  #done-overlay.show{display:flex}
  .done-icon{font-size:4rem;display:block;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .done-title{font-size:1.4rem;font-weight:700;color:#2d4a6b;margin-bottom:.35rem}
  .done-sub{font-size:13px;color:#5a7a9b;line-height:1.75;max-width:280px;margin:.35rem auto 1.5rem}
  .done-wishes{
    display:flex;flex-direction:column;gap:.4rem;
    width:100%;max-width:360px;
    max-height:300px;overflow-y:auto;
    margin-bottom:1.25rem;
  }
  .dw-item{
    background:rgba(255,255,255,.8);border-radius:12px;
    padding:.6rem .9rem;font-size:12px;color:#2d4a6b;
    text-align:left;display:flex;align-items:center;gap:.5rem;
  }
  .dw-icon{flex-shrink:0;font-size:1rem}
  .done-btn{
    padding:.9rem 2.5rem;border-radius:50px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;
    background:linear-gradient(135deg,#7bb8e8,#5a9fd4);color:#fff;
    box-shadow:0 4px 18px rgba(90,159,212,.4);transition:all .2s;
  }
  .done-btn:active{transform:scale(.97)}

  /* ═════ [BARU] ═════ */
  #wish-popup.show{pointer-events:all;background:rgba(45,74,107,.18)}
  .wish-bubble{margin:0 1.25rem}
  .wish-btns{display:flex;flex-direction:column;gap:.45rem;align-items:center}
  .wish-amin{font-size:11.5px;color:#5a8aaa;text-decoration:none;border-bottom:1px dashed rgba(90,138,170,.5);padding-bottom:1px}
  .top-btn{position:fixed;top:calc(1.1rem + env(safe-area-inset-top));z-index:10;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:none;border-radius:50px;padding:.38rem .75rem;font-size:12px;font-weight:600;color:#4a7a9b;box-shadow:0 2px 12px rgba(100,150,200,.15);cursor:pointer;text-decoration:none}
  .top-btn.l{left:.75rem} .top-btn.r{right:.75rem}
  #counter{font-size:11.5px;padding:.35rem .9rem}
  .bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom));z-index:10;display:flex;gap:.5rem}
  .bb-btn{border:none;border-radius:50px;padding:.6rem 1.1rem;font-size:12.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.85);color:#4a7a9b;box-shadow:0 3px 12px rgba(80,140,80,.18);white-space:nowrap}
  .done-wishes{max-height:46vh}
  .done-actions{display:flex;flex-direction:column;gap:.5rem;align-items:center}
  .done-ghost{background:none;border:none;color:#4a7a9b;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:.3rem}
  .dw-item.locked{opacity:.55;font-style:italic}

  /* Confetti */
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
<script src="sfx.js" defer></script>
</head>
<body>

<div id="sky">
  <div class="sky-sun"></div>
  <!-- Sun rays -->
  <div class="sky-ray" style="transform:rotate(0deg)"></div>
  <div class="sky-ray" style="transform:rotate(30deg)"></div>
  <div class="sky-ray" style="transform:rotate(60deg)"></div>
  <div class="sky-ray" style="transform:rotate(90deg)"></div>
  <div class="sky-ray" style="transform:rotate(120deg)"></div>
  <div class="sky-ray" style="transform:rotate(150deg)"></div>
  <div class="sky-ray" style="transform:rotate(180deg)"></div>
  <div class="sky-ray" style="transform:rotate(210deg)"></div>
  <div class="sky-ray" style="transform:rotate(240deg)"></div>
  <div class="sky-ray" style="transform:rotate(270deg)"></div>
  <div class="sky-ray" style="transform:rotate(300deg)"></div>
  <div class="sky-ray" style="transform:rotate(330deg)"></div>
</div>

<div class="ground"></div>

<canvas id="canvas"></canvas>

<a class="top-btn l" href="index.html">←</a>
<div id="counter">☁️ <span id="counter-text">Tap awan untuk buka harapan</span></div>
<div class="bottom-bar"><button class="bb-btn" onclick="showCollection()">📜 Harapan yang udah kebuka</button></div>

<div id="hint">
  <span class="hint-icon">👆</span>
  <span class="hint-text">Tap awan!</span>
</div>

<!-- Wish popup -->
<div id="wish-popup">
  <div class="wish-bubble">
    <span class="wish-icon" id="wish-icon">✨</span>
    <span class="wish-num" id="wish-num">Harapan #1</span>
    <p class="wish-text" id="wish-text">...</p>
    <div class="wish-btns">
      <button class="wish-close" onclick="closeWish()">Makasih Razan 🤍</button>
      <a class="wish-amin" id="wish-amin" href="#" target="_blank" rel="noopener">💬 Bilang "aamiin" ke Razan</a>
    </div>
  </div>
</div>

<!-- All done -->
<div id="done-overlay">
  <span class="done-icon">☁️</span>
  <p class="done-title" id="done-title">Semua harapan terbuka! 🤍</p>
  <p class="done-sub" id="done-sub">Ini semua yang Razan harapkan buat kalian berdua — dari yang paling sederhana sampai yang paling dalam.</p>
  <div class="done-wishes" id="done-wishes"></div>
  <div class="done-actions" id="done-actions"></div>
</div>

<script>
const WISHES = [
  {icon:'🌟', text:'Aku pengen lihat kamu sukses'},
  {icon:'👴👵', text:'Aku pengen tua bareng kamu'},
  {icon:'📸', text:'Aku pengen bikin banyak kenangan'},
  {icon:'😂', text:'Aku pengen ketawa bareng kamu selamanya'},
  {icon:'🏠', text:'Aku pengen punya rumah yang penuh sama kamu'},
  {icon:'✈️', text:'Aku pengen jalan-jalan ke mana aja sama kamu'},
  {icon:'🌅', text:'Aku pengen bangun pagi dan kamu ada di sana'},
  {icon:'💪', text:'Aku pengen jadi orang yang kamu banggain'},
  {icon:'🎂', text:'Aku pengen rayain ulang tahun kamu selamanya'},
  {icon:'🤝', text:'Aku pengen kita tumbuh bareng'},
  {icon:'🍜', text:'Aku pengen makan bareng kamu tiap hari'},
  {icon:'💌', text:'Aku pengen kamu selalu ngerasa disayangi'},
  {icon:'🌸', text:'Aku pengen lihat kamu bahagia'},
  {icon:'🔒', text:'Aku pengen kamu selalu ngerasa aman sama aku'},
  {icon:'🌙', text:'Aku pengen ada di sisi kamu di malam yang berat'},
  {icon:'🎓', text:'Aku pengen support semua mimpi kamu'},
  {icon:'💑', text:'Aku pengen kita masih kayak gini bertahun-tahun lagi'},
  {icon:'🫶', text:'Aku pengen kamu tau betapa berharganya kamu'},
  {icon:'🌈', text:'Aku pengen hari-hari kamu selalu lebih baik'},
  {icon:'💍', text:'Aku pengen masa depan yang sama kamu'},
];

const WA='6285692740607';
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,dpr;
let clouds=[];
let raf=null;
let frame=0;
let popupOpen=false;
// [FIX] harapan yang udah kebuka disimpan (pakai urutan di daftar WISHES)
const SAVE='cloud-wishes-opened';
let openedIdx=[];
try{openedIdx=JSON.parse(localStorage.getItem(SAVE)||'[]').filter(n=>n>=0&&n<WISHES.length);}catch(e){}
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(openedIdx));}catch(e){}}

function sizeCanvas(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  const oW=W,oH=H;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);   // [FIX] dulu pakai scale() → tiap resize gambarnya makin besar
  return {oW,oH};
}
function init(){ sizeCanvas(); buildClouds(); updateCounter(); }

function buildClouds(){
  clouds=[];
  const order=WISHES.map((w,i)=>i).sort(()=>Math.random()-.5);
  const cols=4, rows=5;
  const startY=H*0.15, skyH=H*0.62;
  const base=Math.min(W/cols*0.6, 54);
  order.forEach((wi,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const x=(col+.5)*(W/cols)+(Math.random()-.5)*W*0.04;
    const y=startY+row*(skyH/rows)+(Math.random()-.5)*(skyH/rows)*0.2;
    const size=base*(.82+Math.random()*.25);
    clouds.push({id:wi,x,y,size,vx:(Math.random()-.5)*0.2,floatOffset:Math.random()*Math.PI*2,floatSpd:0.008+Math.random()*0.006,
      wish:WISHES[wi],opened:openedIdx.includes(wi),scale:1,scaleDir:0,opacity:1});
  });
}

function drawCloud(c){
  const x=c.x;
  const y=c.y+Math.sin(frame*c.floatSpd+c.floatOffset)*4;
  const s=c.size*c.scale;
  ctx.save();
  ctx.globalAlpha=c.opacity;
  if(c.opened){
    ctx.globalAlpha=c.opacity*0.35;
    drawCloudShape(x,y,s,'rgba(200,220,240,.6)');
    ctx.globalAlpha=c.opacity*.8;
    ctx.font=`${s*0.42}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.wish.icon.slice(0,2),x,y+2);
  } else {
    ctx.shadowColor='rgba(100,150,200,.2)';ctx.shadowBlur=12;
    drawCloudShape(x,y,s,'rgba(255,255,255,.92)');
    ctx.shadowBlur=0;
    const grad=ctx.createRadialGradient(x-s*.2,y-s*.2,0,x,y,s);
    grad.addColorStop(0,'rgba(255,255,255,.4)');
    grad.addColorStop(1,'rgba(200,230,255,.0)');
    ctx.fillStyle=grad;
    drawCloudShapePath(x,y,s);
    ctx.fill();
    ctx.fillStyle='rgba(90,159,212,.6)';
    ctx.font=`${s*0.28}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✨',x,y);
  }
  ctx.restore();
}
function drawCloudShape(x,y,s,color){ ctx.fillStyle=color; drawCloudShapePath(x,y,s); ctx.fill(); }
function drawCloudShapePath(x,y,s){
  // [FIX] tiap gelembung awan digambar terpisah (dulu ada "ekor" segitiga aneh di sisi kanan awan)
  ctx.beginPath();
  [[0,0,.5],[-.38,.1,.35],[.38,.1,.35],[-.18,-.22,.3],[.2,-.18,.28]].forEach(([dx,dy,r])=>{ ctx.moveTo(x+dx*s+r*s,y+dy*s); ctx.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2); });
}

let last=performance.now();
function loop(now){
  const k=Math.min(3,(now-last)/16.67)||1; last=now;   // [FIX] kecepatan sama di HP 60Hz & 120Hz
  ctx.clearRect(0,0,W,H);
  frame+=k;
  clouds.forEach(c=>{
    c.x+=c.vx*k;
    if(c.x<c.size*.9) c.vx=Math.abs(c.vx);
    if(c.x>W-c.size*.9) c.vx=-Math.abs(c.vx);
    if(c.scaleDir!==0){
      c.scale+=c.scaleDir*0.06*k;
      if(c.scale>=1.18){c.scaleDir=-1}
      if(c.scale<=1){c.scale=1;c.scaleDir=0}
    }
    drawCloud(c);
  });
  raf=requestAnimationFrame(loop);
}

function getTapCloud(tx,ty){
  let best=null,bd=1e9;
  for(const c of clouds){
    if(c.opened)continue;
    const cy=c.y+Math.sin(frame*c.floatSpd+c.floatOffset)*4;
    const dist=Math.hypot(tx-c.x,ty-cy);
    if(dist<c.size*.8&&dist<bd){best=c;bd=dist;}   // ambil awan yang paling deket jarinya
  }
  return best;
}

function onTap(e){
  if(popupOpen)return;   // [FIX] dulu awan di belakang popup masih bisa kepencet
  const rect=canvas.getBoundingClientRect();
  const tx=e.clientX-rect.left, ty=e.clientY-rect.top;
  const c=getTapCloud(tx,ty);
  if(!c)return;
  document.getElementById('hint').style.display='none';
  c.scaleDir=1; c.opened=true;
  if(!openedIdx.includes(c.id)){openedIdx.push(c.id);persist();}
  document.getElementById('wish-icon').textContent=c.wish.icon;
  document.getElementById('wish-num').textContent=`Harapan #${openedIdx.length} dari ${WISHES.length}`;
  document.getElementById('wish-text').textContent=c.wish.text;
  document.getElementById('wish-amin').href=`https://wa.me/${WA}?text=${encodeURIComponent(`☁️ "${c.wish.text}" — aamiin, aku juga pengen 🤍`)}`;
  document.getElementById('wish-popup').classList.add('show');
  popupOpen=true;
  updateCounter();
  spawnParticles(tx,ty);
  try{navigator.vibrate&&navigator.vibrate([15,30,20]);}catch(e){}
}

function closeWish(){
  document.getElementById('wish-popup').classList.remove('show');
  popupOpen=false;
  if(openedIdx.length>=WISHES.length) setTimeout(()=>showDone(true),400);
}

function updateCounter(){
  const n=openedIdx.length;
  document.getElementById('counter-text').textContent=n>=WISHES.length?'Semua terbuka! 🎉':n===0?'Tap awan untuk buka harapan':`${n}/${WISHES.length} harapan terbuka`;
  document.getElementById('hint').style.display=n?'none':'block';
}

// [BARU] koleksi harapan bisa dilihat kapan aja
function showDone(finished){
  const list=document.getElementById('done-wishes');
  const all=finished||openedIdx.length>=WISHES.length;
  document.getElementById('done-title').textContent=all?'Semua harapan terbuka! 🤍':`${openedIdx.length} dari ${WISHES.length} harapan terbuka ☁️`;
  document.getElementById('done-sub').textContent=all?'Ini semua yang Razan harapkan buat kalian berdua — dari yang paling sederhana sampai yang paling dalam.':openedIdx.length?'Yang belum kebuka masih ngumpet di awan — tap awan yang ada ✨ ya.':'Belum ada yang kebuka. Yuk tap awannya!';
  list.innerHTML='';
  openedIdx.forEach(i=>{ const w=WISHES[i]; const el=document.createElement('div'); el.className='dw-item'; el.innerHTML=`<span class="dw-icon">${w.icon}</span><span>${w.text}</span>`; list.appendChild(el); });
  for(let k=openedIdx.length;k<WISHES.length;k++){ const el=document.createElement('div'); el.className='dw-item locked'; el.innerHTML='<span class="dw-icon">☁️</span><span>Masih di awan…</span>'; list.appendChild(el); }
  document.getElementById('done-actions').innerHTML=all
    ?`<button class="done-btn" onclick="closeDone()">Tutup ☁️</button><button class="done-ghost" onclick="resetGame()">Main lagi dari awal</button>`
    :`<button class="done-btn" onclick="closeDone()">Lanjut buka awan ☁️</button>`;
  document.getElementById('done-overlay').classList.add('show');
  if(finished)confetti(80);
}
function showCollection(){ showDone(false); }
function closeDone(){ document.getElementById('done-overlay').classList.remove('show'); }

function resetGame(){
  if(!confirm('Mulai lagi dari awal? Semua awan bakal ketutup lagi.'))return;
  document.getElementById('done-overlay').classList.remove('show');
  openedIdx=[];persist();buildClouds();updateCounter();
}

function spawnParticles(x,y){
  const colors=['#fff','#b8d4f0','#7bb8e8','#ffe082','#ffb3c6'];
  for(let i=0;i<12;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${x}px;top:${y}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${.8+Math.random()*1.2}s;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2500);
  },i*25);
}
function confetti(n=50){
  const colors=['#7bb8e8','#b8d4f0','#ffe082','#ffb3c6','#fff'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
  },i*20);
}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();onTap(e);});
document.getElementById('wish-popup').addEventListener('click',e=>{if(e.target.id==='wish-popup')closeWish();});

init();
raf=requestAnimationFrame(loop);
// [FIX] dulu tiap layar berubah ukuran (misal address bar HP muncul/hilang) semua awan diacak ulang & progres hilang
window.addEventListener('resize',()=>{
  const {oW,oH}=sizeCanvas();
  if(oW&&oH) clouds.forEach(c=>{c.x*=W/oW;c.y*=H/oH;c.size*=Math.min(1.3,Math.max(.7,W/oW));});
});
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
</body>
</html>
