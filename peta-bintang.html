function altAz(ra, dec, lst) {
  const H = rad((lst - ra) * 15), d = rad(dec), f = rad(LAT);
  const alt = Math.asin(Math.sin(f) * Math.sin(d) + Math.cos(f) * Math.cos(d) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(f) - Math.tan(d) * Math.cos(f)) + Math.PI;
  return [deg(alt), az];
}
function draw(c, size, poster) {
  const x = c.getContext('2d'), R = size / 2 - (poster ? 10 : 6), cx = size / 2, cy = size / 2;
  x.clearRect(0, 0, size, size);
  const g = x.createRadialGradient(cx, cy, R * .1, cx, cy, R); g.addColorStop(0, '#202a66'); g.addColorStop(1, '#0b0f2c');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
  x.strokeStyle = 'rgba(246,227,184,.6)'; x.lineWidth = size / 300; x.stroke();
  // lingkaran ketinggian
  x.strokeStyle = 'rgba(200,205,255,.08)'; [30, 60].forEach(a => { x.beginPath(); x.arc(cx, cy, R * (90 - a) / 90, 0, 7); x.stroke(); });
  const lst = lstHours(whenDate()), pos = {};
  for (const [n, [ra, dec, mag]] of Object.entries(STARS)) { const [alt, az] = altAz(ra, dec, lst); if (alt < 0) continue; const r = R * (90 - alt) / 90; pos[n] = [cx - r * Math.sin(az), cy - r * Math.cos(az), mag, alt]; }
  // bintang latar (acak tapi tetap)
  let h = 7; const rnd = () => (h = (h * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * R; x.fillStyle = `rgba(255,255,255,${.15 + rnd() * .35})`; x.beginPath(); x.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, size / 900 * (.5 + rnd()), 0, 7); x.fill(); }
  if (st.lines) {
    x.strokeStyle = 'rgba(246,227,184,.38)'; x.lineWidth = size / 420;
    x.font = `500 ${size / 46}px Poppins, sans-serif`; x.fillStyle = 'rgba(246,227,184,.55)'; x.textAlign = 'center';
    LINES.forEach(([name, ...paths]) => {
      let sx = 0, sy = 0, n = 0;
      paths.forEach(p => { x.beginPath(); let started = false; p.forEach(s => { const q = pos[s]; if (!q) { started = false; return; } if (!started) { x.moveTo(q[0], q[1]); started = true; } else x.lineTo(q[0], q[1]); sx += q[0]; sy += q[1]; n++; }); x.stroke(); });
      if (n >= 3) x.fillText(name, sx / n, sy / n + size / 30);
    });
  }
  placed = [];
  for (const [n, [px, py, mag]] of Object.entries(pos)) {
    const s = Math.max(.9, (3.4 - mag) * size / 420);
    const gl = x.createRadialGradient(px, py, 0, px, py, s * 3.2); gl.addColorStop(0, 'rgba(255,255,255,.55)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gl; x.beginPath(); x.arc(px, py, s * 3.2, 0, 7); x.fill();
    x.fillStyle = mag < 0.6 ? '#fff6dc' : '#ffffff'; x.beginPath(); x.arc(px, py, s, 0, 7); x.fill();
    placed.push([n, px, py, mag]);
    if (mag < 1.3) { x.font = `500 ${size / 40}px Poppins, sans-serif`; x.fillStyle = 'rgba(230,232,255,.85)'; x.textAlign = 'left'; x.fillText(n, px + s + size / 120, py - s); }
  }
  // arah mata angin
  x.font = `600 ${size / 34}px Poppins, sans-serif`; x.fillStyle = '#f6e3b8'; x.textAlign = 'center'; x.textBaseline = 'middle';
  [['U', 0, -1], ['S', 0, 1], ['T', -1, 0], ['B', 1, 0]].forEach(([t, dx, dy]) => x.fillText(t, cx + dx * (R - size / 28), cy + dy * (R - size / 28)));
  x.textBaseline = 'alphabetic';
  return pos;
}
function sizeCanvas() { const r = cv.getBoundingClientRect(), dpr = Math.min(2.5, devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.width * dpr; }
function render() {
  sizeCanvas(); draw(cv, cv.width, false);
  const d = parseYMD(st.d) || parseYMD(JADIAN), hh = st.t % 24, nd = st.t >= 24;
  const shown = new Date(d); if (nd) shown.setDate(shown.getDate() + 1);
  $('cap-t').textContent = st.c || ' ';
  $('cap-s').textContent = `Jakarta · ${HARI[shown.getDay()]}, ${shown.getDate()} ${BULAN[shown.getMonth()]} ${shown.getFullYear()} · ${pad(Math.floor(hh))}.${pad(Math.round(hh % 1 * 60))} WIB`;
  $('t-lbl').textContent = `${pad(Math.floor(hh))}.${pad(Math.round(hh % 1 * 60))}${nd ? ' (dini hari)' : ''}`;
  $('presets').innerHTML = PRESETS.map((p, i) => `<button data-i="${i}" class="${(p[1] || ymd(today0())) === st.d && p[3] === st.c ? 'on' : ''}">${p[0]}</button>`).join('');
  $('presets').querySelectorAll('button').forEach(b => b.onclick = () => { const p = PRESETS[+b.dataset.i]; st.d = p[1] || ymd(today0()); st.t = p[2]; st.c = p[3]; sync(); });
  $('ln-btn').textContent = st.lines ? '✦ Tanpa garis' : '✦ Pakai garis';
  lsSet('bintang-peta', st);
}
function sync() { $('d').value = st.d; $('t').value = st.t; $('c').value = st.c; $('tip').textContent = ''; render(); }
$('d').addEventListener('change', () => { if (parseYMD($('d').value)) { st.d = $('d').value; render(); } });
$('t').addEventListener('input', () => { st.t = +$('t').value; render(); });
$('c').addEventListener('input', () => { st.c = $('c').value; render(); });
function toggleLines() { st.lines = !st.lines; render(); }
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), k = cv.width / r.width, px = (e.clientX - r.left) * k, py = (e.clientY - r.top) * k;
  let best = null, bd = 1e9; placed.forEach(p => { const d = Math.hypot(p[1] - px, p[2] - py); if (d < bd) { bd = d; best = p; } });
  if (best && bd < cv.width / 14) {
    const con = LINES.find(([, ...ps]) => ps.some(p => p.includes(best[0])));
    $('tip').innerHTML = `⭐ <b>${best[0]}</b>${con ? ` · rasi ${con[0]}` : ''}<br><span style="color:#aeb3dc">kecerahan ${best[3].toFixed(1)}${best[3] < 1 ? ' — salah satu bintang paling terang' : ''}</span>`;
    vib(8);
  }
});
async function savePoster() {
  await fontsReady();
  const W = 1080, H = 1500, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#0b0f2c'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(246,227,184,.55)'; x.lineWidth = 3; x.strokeRect(40, 40, W - 80, H - 80);
  const m = document.createElement('canvas'); m.width = m.height = 900; draw(m, 900, true); x.drawImage(m, 90, 110);
  const d = parseYMD(st.d) || parseYMD(JADIAN), hh = st.t % 24; const shown = new Date(d); if (st.t >= 24) shown.setDate(shown.getDate() + 1);
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = "700 92px Caveat, 'Segoe Script', cursive"; x.fillText(st.c || 'Langit kita', W / 2, 1150);
  x.fillStyle = '#f6e3b8'; x.font = '600 30px Poppins, sans-serif'; x.fillText('RAZAN  ♡  DARA', W / 2, 1225);
  x.fillStyle = '#aeb3dc'; x.font = '400 26px Poppins, sans-serif';
  x.fillText(`${HARI[shown.getDay()]}, ${shown.getDate()} ${BULAN[shown.getMonth()]} ${shown.getFullYear()} · ${pad(Math.floor(hh))}.${pad(Math.round(hh % 1 * 60))} WIB`, W / 2, 1290);
  x.fillText('Jakarta · 6°12′ LS  106°51′ BT', W / 2, 1335);
  shareCanvas(c, 'peta-bintang-kita.png', 'Peta Bintang Kita');
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(render, 150); });
sync();

</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
