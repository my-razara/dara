<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rencana Ketemu — Razan & Dara 📅</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .bd-st.err{color:#b4554a}
  .hero{position:relative;display:block;width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit;color:#fff;border-radius:24px;padding:1.1rem 1.1rem 1rem;background:linear-gradient(140deg,#d48c80,#7a3f35);box-shadow:0 12px 30px rgba(122,63,53,.28);margin-bottom:.9rem;overflow:hidden}
  .hero::after{content:'🤝';position:absolute;right:-6px;bottom:-14px;font-size:5.5rem;opacity:.16}
  .hero .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.85}
  .hero .n{font-size:clamp(2.2rem,12vw,2.8rem);font-weight:700;line-height:1.05;margin:.2rem 0}
  .hero .n small{font-size:.95rem;font-weight:500;opacity:.9;margin-left:.3rem}
  .hero b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
  .hero p{font-size:12px;opacity:.9;margin-top:.15rem}
  .hero.empty{background:linear-gradient(140deg,#e9c9bd,#c1857a);text-align:center}
  .list{display:flex;flex-direction:column;gap:.55rem}
  .pl{display:flex;gap:.75rem;align-items:stretch;width:100%;text-align:left;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:18px;padding:.7rem;cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 4px 14px rgba(193,122,111,.06)}
  .pl .dt{flex:0 0 54px;border-radius:14px;background:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .pl .dt b{font-size:1.35rem;color:var(--deep)}
  .pl .dt small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pl .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.1rem}
  .pl .tx b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .tx span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .tag{align-self:center;font-size:10.5px;font-weight:600;color:var(--rose);white-space:nowrap}
  .pl.past{opacity:.75}
  .pl.past .dt{background:#f1ece6}
  .by{font-size:9.5px;font-weight:600}.by.Razan{color:var(--rz)}.by.Dara{color:var(--dr)}
  .chips{margin-top:.1rem}
  .det h2{font-size:1.2rem;font-weight:700;color:var(--deep);line-height:1.3;text-align:center;margin:.1rem 0 .2rem}
  .det .meta{display:flex;flex-direction:column;gap:.35rem;margin:.7rem 0}
  .det .meta div{display:flex;gap:.55rem;align-items:flex-start;font-size:13px;line-height:1.45}
  .det .meta div span:first-child{flex:0 0 1.3rem;text-align:center}
  .det .meta a{color:var(--rose);font-weight:600}
  .det .note{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--deep);line-height:1.3;background:#fff8ec;border-radius:14px;padding:.55rem .8rem;margin-bottom:.6rem;white-space:pre-wrap}
  .todo h4{font-size:12px;font-weight:600;color:var(--deep);margin:.3rem 0 .4rem;display:flex;justify-content:space-between}
  .todo h4 small{font-weight:400;color:var(--muted)}
  .td{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:12px;background:#fff;border:1px solid rgba(193,122,111,.13);margin-bottom:.35rem;cursor:pointer}
  .td i{flex:0 0 20px;height:20px;border-radius:6px;border:2px solid var(--blush);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
  .td.on i{background:var(--rose);border-color:var(--rose)}
  .td span{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
  .td.on span{text-decoration:line-through;color:var(--muted)}
  .td button{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0 .2rem}
  .add{display:flex;gap:.4rem;margin-top:.3rem}
  .add .inp{flex:1;min-width:0;padding:.55rem .75rem;font-size:13px}
  .add button{border:none;border-radius:12px;background:var(--rose);color:#fff;font-weight:700;padding:0 .9rem;cursor:pointer}
  .acts{display:flex;gap:.45rem;margin-top:.8rem}.acts>*{flex:1;min-width:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .two>div{min-width:0}
  .emo{display:flex;gap:.3rem;flex-wrap:wrap}
  .emo button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--blush);background:#fff;font-size:1.1rem;cursor:pointer;padding:0}
  .emo button.on{border-color:var(--rose);background:#fdeee8}
  details.past-wrap summary{list-style:none;cursor:pointer;text-align:center;font-size:12px;color:var(--muted);margin:1.2rem 0 .6rem}
  details.past-wrap summary::-webkit-details-marker{display:none}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who-btn"></button></div>
  <div class="head"><span class="ico">📅</span><p class="lbl">Berdua</p><h1 class="title">Rencana <span>Ketemu</span></h1><p class="sub">Catat kapan & mau ngapain aja pas ketemu — bisa diisi berdua dari HP masing-masing 🤍</p></div>
  <p class="bd-st" id="bd-st"></p>
  <div id="hero"></div>
  <button class="btn" onclick="openEd()">＋ Bikin rencana</button>
  <p class="sec">📌 Yang akan datang</p>
  <div class="list" id="up"></div>
  <details class="past-wrap" id="past-wrap"><summary id="past-sum"></summary><div class="list" id="past"></div></details>
</div>

<div class="ov" id="det-ov" onclick="if(event.target===this)closeOv('det-ov')"><div class="sheet det" id="det"></div></div>

<div class="ov" id="ed-ov" onclick="if(event.target===this)closeOv('ed-ov')"><div class="sheet">
  <div class="drag"></div>
  <h3 style="font-size:15px;font-weight:700;text-align:center" id="ed-h">📅 Bikin rencana</h3>
  <label class="lab">Mau ngapain?</label>
  <div class="chips" id="ed-kind"></div>
  <input class="inp" id="ed-title" maxlength="60" placeholder="mis. Nonton film baru + makan ramen" style="margin-top:.45rem">
  <div class="two"><div><label class="lab">Tanggal</label><input class="inp" type="date" id="ed-date"></div><div><label class="lab">Jam <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><input class="inp" type="time" id="ed-time"></div></div>
  <label class="lab">Tempat <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><input class="inp" id="ed-place" maxlength="80" placeholder="mis. Grand Indonesia">
  <label class="lab">Catatan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><textarea class="ta" id="ed-note" rows="2" maxlength="300" placeholder="Jangan lupa bawa…"></textarea>
  <label class="lab">Stiker</label><div class="emo" id="ed-emo"></div>
  <div class="row"><button class="btn ghost" onclick="closeOv('ed-ov')">Batal</button><button class="btn" onclick="saveEd()">Simpan</button></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, enabled: false };
const KINDS = [['🎬', 'Nonton'], ['🍜', 'Makan'], ['☕', 'Nongkrong'], ['🚶', 'Jalan-jalan'], ['🏠', 'Main ke rumah'], ['🎉', 'Rayain sesuatu'], ['🛍️', 'Belanja'], ['📸', 'Foto-foto']];
const EMO = ['🤝', '🥰', '🎬', '🍜', '☕', '🌅', '🎉', '🎂', '🛍️', '📸', '🌧️', '✨'];
const IDEAS = { Nonton: ['Beli tiket online', 'Popcorn caramel 🍿', 'Pilih kursi tengah'], Makan: ['Cari tempat makan', 'Reservasi dulu', 'Foto makanannya 📸'], Nongkrong: ['Cari kafe baru', 'Main kartu / board game'], 'Jalan-jalan': ['Bawa air minum', 'Foto berdua 📸'], 'Main ke rumah': ['Bawa jajanan', 'Main game bareng 🎮'], 'Rayain sesuatu': ['Siapin kado 🎁', 'Kue / lilin 🎂', 'Tulis kartu ucapan'], Belanja: ['Bikin daftar belanja'], 'Foto-foto': ['Cas HP full', 'Cari spot bagus'] };
if (lsGet('ketemu-me', null) == null) lsSet('ketemu-me', BD.me());
let me = whoBtn('ketemu-me', () => { me = lsGet('ketemu-me', 'Dara'); BD.setMe(me); render(); });
BD.setMe(me);
const BLN3 = BLN;
const tdy = () => ymd(today0());
const daysTo = s => Math.round((parseYMD(s) - today0()) / 864e5);
const dLong = s => { const d = parseYMD(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const uid = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

function all() {
  const out = [];
  for (const w of ['Razan', 'Dara']) {
    const m = lsGet('ketemu-' + w, {}) || {};
    for (const [date, row] of Object.entries(m)) (row && row.items || []).forEach(it => out.push(Object.assign({}, it, { owner: w, date })));
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99').localeCompare(b.time || '99'));
}
function rowItems(owner, date) { return ((lsGet('ketemu-' + owner, {}) || {})[date] || {}).items || []; }
function putRow(owner, date, items) { BD.put('ketemu', owner, date, items.length ? { items } : null); }
function strip(it) { const x = Object.assign({}, it); delete x.owner; delete x.date; return x; }
function saveItem(it, oldDate) {
  if (oldDate && oldDate !== it.date) putRow(it.owner, oldDate, rowItems(it.owner, oldDate).filter(x => x.id !== it.id));
  const items = rowItems(it.owner, it.date).filter(x => x.id !== it.id); items.push(strip(it)); putRow(it.owner, it.date, items);
}
function delItem(it) { putRow(it.owner, it.date, rowItems(it.owner, it.date).filter(x => x.id !== it.id)); }

function bdStatus() { const el = $('bd-st'); const t = BD.status(); el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function render() {
  bdStatus();
  const A = all(), t = tdy(), up = A.filter(x => x.date >= t), past = A.filter(x => x.date < t).reverse();
  const n = up[0];
  if (n) {
    const d = daysTo(n.date), done = (n.todo || []).filter(x => x.d).length;
    $('hero').innerHTML = `<button class="hero" onclick="openDet('${n.id}')"><p class="k">Ketemu berikutnya</p><div class="n">${d === 0 ? 'Hari ini!' : d === 1 ? 'Besok!' : `${d}<small>hari lagi</small>`}</div><b>${esc(n.e || '🤝')} ${esc(n.t)}</b><p>${dLong(n.date)}${n.time ? ' · ' + esc(n.time) : ''}${n.place ? ' · 📍 ' + esc(n.place) : ''}${(n.todo || []).length ? ` · ✅ ${done}/${n.todo.length}` : ''}</p></button>`;
  } else $('hero').innerHTML = `<div class="hero empty"><p class="k">Belum ada rencana</p><b style="margin-top:.3rem">Kapan kita ketemu lagi? 🥺</b><p>Bikin rencananya, nanti hitung mundurnya muncul di sini & di menu utama</p></div>`;
  $('up').innerHTML = up.length ? up.map(cardHTML).join('') : '<p class="empty">Belum ada rencana ke depan.</p>';
  $('past-wrap').style.display = past.length ? '' : 'none';
  $('past-sum').textContent = `🕰️ Udah lewat (${past.length}) ▾`;
  $('past').innerHTML = past.map(x => cardHTML(x, true)).join('');
}
function cardHTML(x, isPast) {
  const d = parseYMD(x.date), dd = daysTo(x.date), todo = x.todo || [], done = todo.filter(t => t.d).length;
  return `<button class="pl ${isPast ? 'past' : ''}" onclick="openDet('${x.id}')"><span class="dt"><b>${d.getDate()}</b><small>${BLN3[d.getMonth()]}</small></span>
    <span class="tx"><b>${esc(x.e || '🤝')} ${esc(x.t)}</b><span>${HARI[d.getDay()]}${x.time ? ' · ' + esc(x.time) : ''}${x.place ? ' · 📍 ' + esc(x.place) : ''}</span><span>${todo.length ? `✅ ${done}/${todo.length} · ` : ''}<span class="by ${x.owner}">dibikin ${x.owner === me ? 'kamu' : x.owner}</span></span></span>
    <span class="tag">${isPast ? '' : dd === 0 ? 'Hari ini' : dd === 1 ? 'Besok' : dd + ' hr'}</span></button>`;
}

/* ── detail ── */
let cur = null;
function openDet(id) { cur = all().find(x => x.id === id); if (!cur) return; paintDet(); openOv('det-ov'); }
function paintDet() {
  const x = cur, todo = x.todo || [], past = x.date < tdy(), o = otherOf(me);
  const msg = `🤝 Rencana ketemu kita:\n${x.e || '🤝'} ${x.t}\n📅 ${dLong(x.date)}${x.time ? ' jam ' + x.time : ''}${x.place ? '\n📍 ' + x.place : ''}${todo.length ? '\n\nMau ngapain aja:\n' + todo.map(t => (t.d ? '✅ ' : '▫️ ') + t.x).join('\n') : ''}`;
  $('det').innerHTML = `<div class="drag"></div><div style="text-align:center;font-size:2.4rem">${esc(x.e || '🤝')}</div><h2>${esc(x.t)}</h2>
    <p style="text-align:center;font-size:11.5px;color:var(--muted)">${past ? 'Udah lewat' : daysTo(x.date) === 0 ? '🎉 Hari ini!' : daysTo(x.date) + ' hari lagi'} · <span class="by ${x.owner}">dibikin ${x.owner === me ? 'kamu' : x.owner}</span></p>
    <div class="meta"><div><span>📅</span><span>${dLong(x.date)}${x.time ? ' · jam ' + esc(x.time) : ''}</span></div>
      ${x.place ? `<div><span>📍</span><span>${esc(x.place)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.place)}" target="_blank" rel="noopener">Buka Maps</a></span></div>` : ''}</div>
    ${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}
    <div class="todo"><h4>✅ Mau ngapain aja <small>${todo.filter(t => t.d).length}/${todo.length}</small></h4>
      ${todo.map((t, i) => `<div class="td ${t.d ? 'on' : ''}" onclick="togTodo(${i})"><i>${t.d ? '✓' : ''}</i><span>${esc(t.x)} <span class="by ${t.by}">· ${t.by === me ? 'kamu' : t.by}</span></span><button onclick="event.stopPropagation();delTodo(${i})" aria-label="hapus">✕</button></div>`).join('') || '<p class="empty" style="padding:.3rem">Belum ada. Tambahin bareng-bareng yuk!</p>'}
      <div class="add"><input class="inp" id="td-new" maxlength="60" placeholder="Tambah: mis. foto photobox 📸"><button onclick="addTodo()">＋</button></div>
      ${(IDEAS[x.k] || []).filter(s => !todo.some(t => t.x === s)).length ? `<div class="chips" style="margin-top:.45rem">${IDEAS[x.k].filter(s => !todo.some(t => t.x === s)).map(s => `<button onclick="addTodo(${JSON.stringify(s).replace(/"/g, '&quot;')})">＋ ${esc(s)}</button>`).join('')}</div>` : ''}
    </div>
    ${past ? `<a class="btn ghost" href="rating-ketemu.html" style="margin-top:.8rem">🌟 Kasih rating ketemuan ini</a>` : ''}
    <a class="btn wa" style="margin-top:.6rem" target="_blank" rel="noopener" href="${waLink(o, msg)}">💬 Kirim rencananya ke ${o}</a>
    <div class="acts"><button class="btn ghost" onclick="closeOv('det-ov');openEd('${x.id}')">✏️ Ubah</button><button class="btn ghost" onclick="delPlan()">🗑 Hapus</button></div>`;
  const inp = $('td-new'); if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
}
function commitCur() { saveItem(cur); render(); paintDet(); }
function togTodo(i) { cur.todo[i].d = !cur.todo[i].d; vib(10); if (cur.todo.every(t => t.d) && cur.todo.length > 1) confetti(30); commitCur(); }
function delTodo(i) { cur.todo.splice(i, 1); commitCur(); }
function addTodo(txt) { const v = (txt || $('td-new').value || '').trim(); if (!v) return; cur.todo = (cur.todo || []).concat({ x: v, d: false, by: me }); commitCur(); setTimeout(() => { const i = $('td-new'); if (i && !txt) i.focus(); }, 50); }
function delPlan() { if (!confirm(`Hapus rencana “${cur.t}”?`)) return; delItem(cur); closeOv('det-ov'); render(); toast('🗑 Rencana dihapus'); }

/* ── bikin / ubah ── */
let ed = null, edOld = null;
function openEd(id) {
  const src = id ? all().find(x => x.id === id) : null;
  ed = src ? Object.assign({}, src) : { id: uid(), owner: me, date: '', time: '', place: '', note: '', t: '', k: '', e: '🤝', todo: [], at: Date.now() };
  edOld = src ? src.date : null;
  $('ed-h').textContent = src ? '✏️ Ubah rencana' : '📅 Bikin rencana';
  $('ed-title').value = ed.t; $('ed-date').value = ed.date; $('ed-time').value = ed.time || ''; $('ed-place').value = ed.place || ''; $('ed-note').value = ed.note || '';
  $('ed-date').min = src ? '' : tdy();
  paintEd(); openOv('ed-ov');
}
function paintEd() {
  $('ed-kind').innerHTML = KINDS.map(([e, k]) => `<button class="${ed.k === k ? 'on' : ''}" data-k="${k}" data-e="${e}">${e} ${k}</button>`).join('');
  $('ed-kind').querySelectorAll('button').forEach(b => b.onclick = () => { const was = ed.k; ed.k = b.dataset.k; ed.e = b.dataset.e; const ti = $('ed-title'); if (!ti.value.trim() || KINDS.some(k => k[1] === ti.value.trim())) ti.value = ed.k; paintEd(); });
  $('ed-emo').innerHTML = EMO.map(e => `<button class="${ed.e === e ? 'on' : ''}">${e}</button>`).join('');
  $('ed-emo').querySelectorAll('button').forEach(b => b.onclick = () => { ed.e = b.textContent; paintEd(); });
}
function saveEd() {
  const t = $('ed-title').value.trim(), d = $('ed-date').value;
  if (!t) { toast('Isi mau ngapain dulu 🙈'); $('ed-title').focus(); return; }
  if (!parseYMD(d)) { toast('Pilih tanggalnya dulu 📅'); return; }
  Object.assign(ed, { t, date: d, time: $('ed-time').value, place: $('ed-place').value.trim(), note: $('ed-note').value.trim() });
  saveItem(ed, edOld); closeOv('ed-ov'); render(); vib([10, 30, 10]);
  toast(edOld ? '✓ Rencana diubah' : `📅 Rencana kesimpen${BD.enabled ? ` · ${otherOf(me)} bisa liat juga` : ''}`);
  if (!edOld) { confetti(25); setTimeout(() => openDet(ed.id), 350); }
}
function openOv(id) { $(id).classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeOv(id) { $(id).classList.remove('show'); document.body.style.overflow = ''; }
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if (ev.apps.includes('ketemu')) { render(); if (cur && $('det-ov').classList.contains('show')) { const f = all().find(x => x.id === cur.id); if (f) { cur = f; paintDet(); } } } });
render();

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
