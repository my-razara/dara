<style>

<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

let me = whoBtn('pn-me', () => { me = lsGet('pn-me', 'Dara'); });
let oct = lsGet('pn-oct', 4), sty = lsGet('pn-sty', 'piano'), AC = null, recOn = false, recT0 = 0, recBuf = [], guide = null, timers = [];
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const SOL = { C: 'do', D: 're', E: 'mi', F: 'fa', G: 'sol', A: 'la', B: 'si' };
const STY = [['piano', '🎹 Piano'], ['musicbox', '🎐 Kotak musik'], ['flute', '🪈 Suling'], ['retro', '👾 8-bit']];
// 1.7 oktaf: C .. E (oktaf berikutnya)
function keysFor(o) { const out = []; for (let i = 0; i < 17; i++) { const n = NAMES[i % 12], oc = o + Math.floor(i / 12); out.push({ id: n + oc, n, black: n.includes('#'), midi: 12 * (oc + 1) + (i % 12) }); } return out; }
let KEYS = [];
const freq = m => 440 * Math.pow(2, (m - 69) / 12);
function ctx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; AC = new C(); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(midi, dur = .9) {
  const a = ctx(), t = a.currentTime, g = a.createGain(), out = a.createGain(); out.gain.value = .32; g.connect(out); out.connect(a.destination);
  const f = freq(midi), mk = (type, mul, vol) => { const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.value = f * mul; v.gain.value = vol; o.connect(v); v.connect(g); o.start(t); o.stop(t + dur + .6); };
  if (sty === 'piano') { mk('triangle', 1, .8); mk('sine', 2, .25); mk('sine', 3, .08); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + .008); g.gain.exponentialRampToValueAtTime(.25, t + .3); g.gain.exponentialRampToValueAtTime(.001, t + dur + .5); }
  else if (sty === 'musicbox') { mk('sine', 1, .7); mk('sine', 4, .2); mk('sine', 6.2, .07); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + .003); g.gain.exponentialRampToValueAtTime(.001, t + 1.4); }
  else if (sty === 'flute') { mk('sine', 1, .9); mk('sine', 2, .12); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .07); g.gain.setValueAtTime(.8, t + dur * .7); g.gain.exponentialRampToValueAtTime(.001, t + dur + .2); }
  else { mk('square', 1, .35); g.gain.setValueAtTime(.8, t); g.gain.setValueAtTime(.6, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + dur * .6); }
}
function build() {
  KEYS = keysFor(oct); const W = KEYS.filter(k => !k.black).length, pi = $('pi'); let h = '', wi = 0;
  KEYS.forEach(k => { if (!k.black) { h += `<div class="wk" data-m="${k.midi}" style="left:${wi / W * 100}%;width:${100 / W}%">${SOL[k.n]}<small>${k.n}${k.id.slice(-1)}</small></div>`; wi++; } else h += `<div class="bk" data-m="${k.midi}" style="left:${(wi - .32) / W * 100}%;width:${.64 / W * 100}%"></div>`; });
  pi.innerHTML = h; $('oct-b').textContent = oct === 4 ? '🎚 Nada rendah' : '🎚 Nada tinggi';
  $('sty').innerHTML = STY.map(([k, n]) => `<button class="${k === sty ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  $('sty').querySelectorAll('button').forEach(b => b.onclick = () => { sty = b.dataset.k; lsSet('pn-sty', sty); build(); tone(60 + 12 * (oct - 4) + 7, .5); });
  if (guide) markNext();
}
const keyEl = m => $('pi').querySelector(`[data-m="${m}"]`);
function flash(m) { const el = keyEl(m); if (!el) return; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 180); }
function hit(m) {
  tone(m); flash(m); vib(5);
  if (recOn) recBuf.push([m, Date.now() - recT0]);
  if (guide) { const want = guide.notes[guide.i]; if (want && want[0] + guide.sh === m) { guide.i++; if (guide.i >= guide.notes.length) { const t = guide.t; guide = null; markNext(); $('lyr').innerHTML = `🎉 Kamu berhasil mainin <i>${esc(t)}</i>!`; confetti(50); } else markNext(); } }
}
// sentuhan multi-jari + geser antar tuts
const act = new Map();
function keyAt(x, y) { const els = document.elementsFromPoint(x, y); const k = els.find(e => e.classList && (e.classList.contains('bk') || e.classList.contains('wk'))); return k ? +k.dataset.m : null; }
$('pi').addEventListener('pointerdown', e => { e.preventDefault(); try { $('pi').setPointerCapture(e.pointerId); } catch (x) {} const m = keyAt(e.clientX, e.clientY); act.set(e.pointerId, m); if (m != null) hit(m); });
$('pi').addEventListener('pointermove', e => { if (!act.has(e.pointerId)) return; const m = keyAt(e.clientX, e.clientY); if (m != null && m !== act.get(e.pointerId)) { act.set(e.pointerId, m); hit(m); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('pi').addEventListener(t, e => act.delete(e.pointerId)));
const KB = 'awsedftgyhujkolp;';
document.addEventListener('keydown', e => { if (e.repeat || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; const i = KB.indexOf(e.key.toLowerCase()); if (i >= 0 && KEYS[i]) hit(KEYS[i].midi); });
// lagu public domain — [midi (oktaf 4 basis), ketukan, suku kata]
const N = s => { const m = /^([A-G]#?)(\d)$/.exec(s); return 12 * (+m[2] + 1) + NAMES.indexOf(m[1]); };
const P = str => str.trim().split(/\s+/).map(tk => { const [n, b, l] = tk.split('/'); return [N(n), +b || 1, (l || '').replace(/_/g, ' ')]; });
// T = geser nada (semitone) biar muat di tuts; semua lagu versi FULL
const T = (str, k) => P(str).map(([m, b, l]) => [m + k, b, l]);
const SONGS = [
  { t: 'Twinkle Twinkle Little Star', e: '⭐', n: P(`C4/1/Twin C4/1/kle G4/1/twin G4/1/kle A4/1/lit A4/1/tle G4/2/star F4/1/how F4/1/I E4/1/won E4/1/der D4/1/what D4/1/you C4/2/are
    G4/1/Up G4/1/a F4/1/bove F4/1/the E4/1/world E4/1/so D4/2/high G4/1/like G4/1/a F4/1/dia F4/1/mond E4/1/in E4/1/the D4/2/sky
    C4/1/Twin C4/1/kle G4/1/twin G4/1/kle A4/1/lit A4/1/tle G4/2/star F4/1/how F4/1/I E4/1/won E4/1/der D4/1/what D4/1/you C4/2/are`) },
  { t: 'Happy Birthday to You', e: '🎂', n: P(`C4/.75/Hap C4/.25/py D4/1/birth C4/1/day F4/1/to E4/2/you C4/.75/Hap C4/.25/py D4/1/birth C4/1/day G4/1/to F4/2/you

// geser oktaf: ikut pilihan nada rendah/tinggi kalau muat, kalau ga muat main di nada aslinya
function fitSh(notes) { const sh = 12 * (oct - 4); let lo = 1e3, hi = 0; notes.forEach(([m]) => { lo = Math.min(lo, m); hi = Math.max(hi, m); }); return lo + sh >= 48 && hi + sh <= 76 ? sh : 0; }
// pas belajar: kalau nada berikutnya di luar tuts, papan pindah oktaf sendiri
function ensureKey(m) { if (keyEl(m)) return; const o = m < 60 ? 3 : 4; if (o !== oct) { oct = o; build(); } }
function renderSongs() {
  $('songs').innerHTML = SONGS.map((s, i) => `<div class="song"><span class="e">${s.e}</span><span class="tx"><b>${s.t}</b><small>${s.n.length} nada · lagu bebas hak cipta</small></span><button onclick="listen(SONGS[${i}].n,SONGS[${i}].t)">▶</button><button onclick="learn(${i})">🎓 Belajar</button></div>`).join('');
}
function stopAll() { timers.forEach(clearTimeout); timers = []; guide = null; markNext(); $('lyr').textContent = ''; }
function listen(notes, title, bpm = 110) {
  stopAll(); let t = 0; const beat = 60000 / bpm;
  const sh = fitSh(notes); notes.forEach(([m, b, l], i) => { timers.push(setTimeout(() => { const mm = m + sh; tone(mm, Math.min(b * beat / 1000, 1.2)); flash(mm); if (l) $('lyr').innerHTML = esc(l); }, t)); t += b * beat; });
  timers.push(setTimeout(() => { $('lyr').innerHTML = ''; }, t + 600)); $('lyr').innerHTML = '🎶 ' + esc(title);
}
function learn(i) { stopAll(); guide = { notes: SONGS[i].n, i: 0, t: SONGS[i].t, sh: fitSh(SONGS[i].n) }; markNext(); $('pi').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function markNext() {
  $('pi').querySelectorAll('.nx').forEach(e => e.classList.remove('nx'));
  if (!guide) return; const w = guide.notes[guide.i]; if (!w) return;
  ensureKey(w[0] + guide.sh); const el = keyEl(w[0] + guide.sh); if (el) el.classList.add('nx');
  $('lyr').innerHTML = `${esc(guide.t)} · <i>${guide.i + 1}/${guide.notes.length}</i>${w[2] ? ' — ' + esc(w[2]) : ''}`;
}
// rekam
function toggleRec() {
  if (!recOn) { recOn = true; recBuf = []; recT0 = Date.now(); $('rec-b').classList.add('on'); $('rec-b').textContent = '⏹ Stop rekam'; toast('⏺ Lagi ngerekam… mainin lagunya!'); return; }
  recOn = false; $('rec-b').classList.remove('on'); $('rec-b').textContent = '⏺ Rekam';
  if (recBuf.length < 3) { toast('Rekamannya kependekan 😅'); return; }
  $('save-s').textContent = `${recBuf.length} nada · ${((recBuf[recBuf.length - 1][1]) / 1000).toFixed(1)} detik`; $('save-n').value = ''; $('save-ov').classList.add('show');
}
function saveRec() {
  const t0 = recBuf[0][1], r = { id: Date.now(), t: $('save-n').value.trim() || 'Lagu tanpa judul', by: me, o: oct, s: sty, n: recBuf.slice(0, 400).map(([m, ms]) => [m - 12 * (oct - 4), Math.round((ms - t0) / 10)]) };
  const L = lsGet('pn-mine', []); L.unshift(r); lsSet('pn-mine', L.slice(0, 30)); $('save-ov').classList.remove('show'); renderMine(); toast('💾 Rekaman disimpan');
}
function playRec(r) {
  stopAll(); const prev = sty; if (r.s) sty = r.s;
  r.n.forEach(([m, cs]) => timers.push(setTimeout(() => { const mm = m + 12 * (oct - 4); tone(mm); flash(mm); }, cs * 10)));
  const end = r.n.length ? r.n[r.n.length - 1][1] * 10 : 0; timers.push(setTimeout(() => { sty = prev; $('lyr').textContent = ''; }, end + 900));
  $('lyr').innerHTML = `🎶 ${esc(r.t)} <small style="font-family:Poppins;font-size:11px;color:var(--muted)">— ${esc(r.by)}</small>`;
}
function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function dec(s) { try { return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; } }
function shareRec(i) { const r = lsGet('pn-mine', [])[i]; const url = location.href.split('#')[0].split('?')[0] + '#p=' + enc({ t: r.t, by: r.by, s: r.s, n: r.n }); window.open(waLink(otherOf(me), `🎹 Aku mainin lagu buat kamu: "${r.t}"\nDengerin di sini ya 🎶\n${url}`), '_blank'); }
function delRec(i) { const L = lsGet('pn-mine', []); if (!confirm(`Hapus "${L[i].t}"?`)) return; L.splice(i, 1); lsSet('pn-mine', L); renderMine(); }
function renderMine() {
  const L = lsGet('pn-mine', []);
  $('mine').innerHTML = L.length ? L.map((r, i) => `<div class="song"><span class="e">🎙</span><span class="tx"><b>${esc(r.t)}</b><small>${esc(r.by)} · ${r.n.length} nada · ${fmtD(new Date(r.id))}</small></span><button onclick="playRec(lsGet('pn-mine',[])[${i}])">▶</button><button onclick="shareRec(${i})">💬</button><button onclick="delRec(${i})">🗑</button></div>`).join('') : '<p class="empty">Belum ada rekaman. Tap ⏺ Rekam, mainin lagu, terus kirim ke pasangan 💌</p>';
}
function init() {
  build(); renderSongs(); renderMine();
  const m = /#p=([\w-]+)/.exec(location.hash), r = m && dec(m[1]);
  if (r && r.n) { window.__inbox = r; $('inbox').innerHTML = `<div class="inbox">🎁<b>Lagu dari ${esc(r.by || 'pasangan')}</b><small style="color:var(--muted);font-size:12px">"${esc(r.t)}" · ${r.n.length} nada</small><button class="btn" style="margin-top:.7rem" onclick="playRec(window.__inbox)">▶ Dengerin</button><button class="btn ghost" style="margin-top:.45rem" onclick="toggleRec()">🎙 Bales pakai lagu juga</button></div>`; }
}
init();

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
