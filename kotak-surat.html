adow:0 4px 12px rgba(193,122,111,.1);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}\n  .kl .e{font-size:1.5rem}\n  .kl span{font-size:12px;font-weight:600;line-height:1.35}\n  .kl small{font-size:10px;color:var(--muted);font-weight:400}\n  .kl.read{opacity:.8}\n  /* surat */\n  .ltr-ov{position:fixed;inset:0;z-index:50;background:rgba(45,31,26,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1rem}\n  .ltr-ov.show{display:flex}\n  .ltr{position:relative;width:100%;max-width:390px;max-height:calc(100vh - 6.5rem);max-height:calc(100dvh - 6.5rem);overflow-y:auto;background:#fffdf8;border-radius:20px;padding:2.1rem 1.2rem 1rem;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:gPop .45s cubic-bezier(.3,1.4,.5,1)}\n  .seal{position:relative;margin:-.9rem auto .7rem;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7b9ad,#c17a6f 55%,#7a3f35);display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2}\n  .ltr .meta{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}\n  .ltr h2{text-align:center;font-size:1.05rem;font-weight:700;color:var(--deep);margin:.2rem 0 .7rem;line-height:1.3}\n  .paper{font-family:'Caveat',cursive;font-size:1.42rem;line-height:31px;color:#7a3f35;white-space:pre-wrap;word-wrap:break-word;min-height:93px;background-image:repeating-linear-gradient(transparent 0 30px,rgba(193,122,111,.13) 30px 31px);padding-bottom:4px}\n  .paper .sig{display:block;text-align:right;margin-top:.3rem}\n  .cur{display:inline-block;width:2px;height:1.05em;background:#7a3f35;vertical-align:-3px;animation:bl .7s step-end infinite}\n  @keyframes bl{50%{opacity:0}}\n  .skip{display:block;margin:.3rem auto 0;border:none;background:none;font-size:11px;color:var(--muted);cursor:pointer}\n  .after{display:none;margi x;color:var(--muted);text-align:right;margin-top:.2rem}\n  .ad-it{background:#fff;border:1px solid rgba(193,122,111,.14);border-radius:16px;padding:.75rem .8rem}\n  .ad-it .r1{display:flex;gap:.6rem;align-items:center}\n  .ad-it .r1 .e{font-size:1.3rem}\n  .ad-it .r1 .tx{flex:1;min-width:0}\n  .ad-it b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .ad-it small{display:block;font-size:10.5px;color:var(--muted)}\n  .ad-it .acts{display:flex;gap:.3rem}\n  .ad-it .acts button{border:1px solid var(--blush);background:#fff;border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:13px;padding:0}\n  .ad-it .rx{margin-top:.5rem;font-size:11.5px;background:var(--warm);border-radius:10px;padding:.5rem .65rem;line-height:1.5;color:var(--deep);white-space:pre-wrap}\n  .tag{display:inline-block;font-size:10px;padding:.1rem .45rem;border-radius:20px;background:#eef6ec;color:#4d7a45;font-weight:600;margin-right:.25rem}\n  .tag.w{background:#fdf3e1;color:#a8782a}\n  .tag.p{background:#eef2fb;color:var(--rz)}\n\n<\/style>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <div class=\"top\"><a href=\"index.html\" class=\"pill\">← Menu utama<\/a><span><\/span><\/div>\n  <div class=\"head\"><span class=\"ico\">📬<\/span><p class=\"lbl\">Kotak surat<\/p><h1 class=\"title\">Surat dari <span>Razan<\/span><\/h1><p class=\"sub\" id=\"sub\">Surat-surat kecil yang Razan tulis buat kamu — ada yang kebuka di hari tertentu, ada yang boleh dibuka kapan aja kamu butuh 🤍<\/p><\/div>\n  <p class=\"status\" id=\"status\"><\/p>\n  <div id=\"adm\"><\/div>\n  <div id=\"main\"><\/div>\n  <button class=\"adm-link\" id=\"adm-link\" onclick=\"askPin()\">✍️ Aku Razan — mau nulis surat<\/button>\n<\/div>\n\n<div class=\"ltr-ov\" id=\"ltr-ov\"><div class=\"ltr\" id=\"ltr\"><\/div><\/div>\n\n<div class=\"ov\" id=\"pin-ov\"><div class=\"sheet\"><div class=\"drag\"><\/div>\n  <h3 style=\"font-size:15px;font-weight:700;text-align:center\">✍️ Mode Razan<\/h3>\n  <p style=\"font-size:12px;color:var(--muted);text-align:center;margin:.3rem 0 .8rem\">Masukin PIN (sama kayak Kapsul Waktu)<\/p>\n  <input class=\"inp\" id=\"pin\" type=\"password\" inputmode=\"numeric\" maxlength=\"8\" placeholder=\"PIN\" style=\"text-align:center;letter-spacing:.3em\">\n  <div class=\"row\"><button class=\"btn ghost\" onclick=\"closeOv('pin-ov')\">Batal<\/button><button class=\"btn\" onclick=\"tryPin()\">Masuk<\/button><\/div>\n<\/div><\/div>\n\n<div class=\"ov\" id=\"ed-ov\"><div class=\"sheet\"><div class=\"drag\"><\/div>\n  <h3 style=\"font-size:15px;font-weight:700;text-align:center\" id=\"ed-h\">✍️ Tulis surat<\/h3>\n  <label class=\"lab\">Jenis surat<\/label>\n  <div class=\"seg\" id=\"ed-kind\"><button data-k=\"tgl\">📅 Tanggal tertentu<\/button><button data-k=\"kalau\">🫧 Buka kalau…<\/button><\/div>\n  <div id=\"ed-tgl\"><label class=\"lab\">Kebuka tanggal<\/label><input class=\"inp\" type=\"date\" id=\"ed-date\">\n    <p style=\"font-size:10.5px;color:var(--muted);margin-top:.3rem\" id=\"ed-dnote\"><\/p>\n    <label class=\"lab\">Judul <span style=\"font-weight:400;color:var(--muted)\">(boleh kosong)<\/span><\/label><input class=\"inp\" id=\"ed-title\" maxlength=\"80\" placeholder=\"mis. Semangat ujiannya sayang!\">\n    <div class=\"chips\" id=\"ed-occ\" style=\"margin-top:.45rem\"><\/div><\/div>\n  <div id=\"ed-kalau\" style=\"display:none\"><label class=\"lab\">Buka kalau kamu…<\/label><div class=\"chips\" id=\"ed-pre\"><\/div>\n    <input class=\"inp\" id=\"ed-kt\" maxlength=\"60\" placeholder=\"…atau tulis sendiri\" style=\"margin-top:.45rem\"><\/div>\n  <label class=\"lab\">Stiker amplop<\/label><div class=\"emo\" id=\"ed-emo\"><\/div>\n  <label class=\"lab\" style=\"display:flex;justify-content:space-between;align-items:center\">Isi surat <button type=\"button\" onclick=\"fillTpl()\" style=\"border:none;background:none;color:var(--rose);font-size:11px;font-weight:600;cursor:pointer\">✨ Kasih contoh<\/button><\/label>\n  <textarea class=\"ta big\" id=\"ed-text\" maxlength=\"4000\" placeholder=\"Dara sayang, …\"><\/textarea><p class=\"cnt\" id=\"ed-cnt\"><\/p>\n  <div class=\"row\"><button class=\"btn ghost\" onclick=\"closeOv('ed-ov')\">Batal<\/button><button class=\"btn\" onclick=\"saveEd()\">💌 Simpan<\/button><\/div>\n<\/div><\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<\script>\nconst WA = { Razan: '6285692740607', Dara: '6287703706518' };\nconst JADIAN = '2025-05-10';\nconst $ = id => document.getElementById(id);\nfunction lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\nconst pad = n => String(n).padStart(2, '0');\nconst ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nfunction parseYMD(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }\nconst today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\nconst BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];\nconst fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;\nconst otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';\nconst waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;\nlet __toastT;\nfunction toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }\nfunction confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {\n  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);\n}\nasync function shareCanvas(cv, name, title) {\n  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));\n  if (!blob) return;\n  const file = new File([blob], name, { type: 'image/png' });\n  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  toast('⬇️ Gambar disimpan');\n}\nfunction wrapText(ctx, text, maxW) { const out = []; String(text).split('\\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }\nasync function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }\n// siapa yang lagi pakai HP ini (Razan   const m = new Map(server.map(x => [x.id, Object.assign({}, x)]));\n  for (const q of getQ()) if (q.op === 'save') { const o = m.get(q.item.id); if (!o || (q.item.updated || 0) >= (o.updated || 0)) m.set(q.item.id, Object.assign({}, o || {}, q.item, { pending: true })); }\n  const loc = lsGet(K_LOCAL, {});\n  let all = [...m.values()].filter(x => !x.deleted);\n  if (!isAdmin()) { const have = new Set(all.filter(x => x.kind === 'kalau').map(x => (x.title || '').toLowerCase())); all = all.concat(DEFAULTS.filter(d => !have.has(d.title.toLowerCase())).map(d => Object.assign({}, d))); }\n  for (const it of all) { const l = loc[it.id]; if (l) { if (!it.readAt) it.readAt = l.readAt; if (l.reaction != null) it.reaction = l.reaction; if (l.reply != null) it.reply = l.reply; } }\n  const t = todayS();\n  for (const it of all) if (!it.locked && it.kind !== 'kalau' && it.date > t && !isAdmin()) it.locked = true;\n  return all;\n}\nfunction api(method, body) {\n  return new Promise((res, rej) => {\n    const x = new XMLHttpRequest();\n    x.open(method, SURAT_URL + (method === 'GET' ? `?action=list&key=${encodeURIComponent(SURAT_KEY)}${isAdmin() ? '&pin=' + encodeURIComponent(pin) : ''}&t=${Date.now()}` : ''), true);\n    x.timeout = 20000;\n    if (method === 'POST') x.setRequestHeader('Content-Type', 'text/plain');\n    x.onload = () => { try { const r = JSON.parse(x.responseText); r.ok ? res(r) : rej(Object.assign(new Error(r.error || 'gagal'), { code: r.error })); } catch (e) { rej(e); } };\n    x.onerror = x.ontimeout = () => rej(new Error('jaringan'));\n    x.send(method === 'POST' ? JSON.stringify(Object.assign({ key: SURAT_KEY }, body)) : null);\n  });\n}\nasync function load() {\n  if (!SURAT_URL) { render(); return; }\n  loading = true; renderStatus();\n  try { const r = await api('GET'); server = r.items || []; lsSet(K_CACHE, server); lsSet('sr-fetched', Date.now()); online = true; }\n  catch (e) { online = false; }\n  loading = false; render();\n}\nfunction enqueue(op) {\n  let q = getQ();\n  if (op.op === 'save') q = q.filter(x => !(x.op === 'save' && x.item.id === op.item.id));\n  if (op.op === 'react') { const old = q.find(x => x.op === 'react' && x.id === op.id); if (old) { Object.assign(old, op); op = null; } }\n  if (op) q.push(op);\n  lsSet(K_QUEUE, q); flush();\n}\nlet flushing = false;\nasync function flush() {\n  if (flushing || !SURAT_URL) return;\n  flushing = true; let sent = 0;\n  try {\n    while (getQ().length) {\n      const op = getQ()[0], stamp = JSON.stringify(op);\n      try {\n        if (op.op === 'save') await api('POST', { action: 'save', pin, item: op.item });\n        else await api('POST', { action: 'react', id: op.id, readAt: op.readAt, reaction: op.reaction, reply: op.reply });\n      } catch (e) {\n        if (['data', 'locked', 'pin'].includes(e.code)) { if (e.code === 'pin') toast('⚠️ PIN ditolak server'); lsSet(K_QUEUE, getQ().slice(1)); continue; }\n        online = false; break;\n      }\n      lsSet(K_QUEUE, getQ().filter(x => JSON.stringify(x) !== stamp));\n      if (op.op === 'save') { const k = server.findIndex(x => x.id === op.item.id); const v = Object.assign({}, server[k] || {}, op.item); if (k >= 0) server[k] = v; else server.push(v); lsSet(K_CACHE, server.filter(x => !x.deleted)); }\n      sent++;\n    }\n  } finally { flushing = false; }\n  if (sent) { online = true; render(); } else renderStatus();\n}\nwindow.addEventListener('online', () => { flush(); load(); });\ndocument.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { flush(); load(); } });\n\n/* ── tampilan ── */\nfunction renderStatus() {\n  const st = $('status'), q = getQ().length; st.className = 'status';\n  if (!SURAT_URL) { st.textContent = isAdmin() ? '📱 Belum nyambung ke server — surat kesimpen di HP ini dulu' : ''; return; }\n  if (loading && !server.length) { st.textContent = '⏳ Ngecek kotak surat…'; return; }\n  if (!online && !loading) { st.className = 'status err'; st.innerHTML = `⚠️ Belum nyambung${q ? ` · ${q} perubahan nunggu dikirim` : ''}. <button onclick=\"load();flush()\">Coba lagi<\/button>`; return; }\n  st.textContent = q ? `⏳ Ngirim ${q} perubahan…` : '';\n}\nconst letterTitle = it => it.title || (it.kind === 'kalau' ? 'Surat buat kamu' : 'Surat buat ' + dLabel(it.date));\nfunction render() {\n  renderStatus();\n  $('adm-link').style.display = isAdmin() ? 'none' : '';\n  if (isAdmin()) { renderAdmin(); return; }\n  $('adm').innerHTML = '';\n  const all = items(), t = todayS();\n  const dated = all.filter(x => x.kind !== 'kalau');\n  const open = dated.filter(x => !x.locked).sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));\n  const unread = open.filter(x => !x.readAt);\n  const upcoming = dated.filter(x => x.locked).sort((a, b) => a.date.localeCompare(b.date));\n  const kalau = all.filter(x => x.kind === 'kalau');\n  let h = '';\n  if (unread.length) {\n    const f = unread[0], isToday = f.date === t;\n    h += `<button class=\"hero\" onclick=\"openL('${f.id}')\"><span class=\"env\">${esc(f.emoji || '💌')}<\/span><p class=\"k\">${isToday ? 'Surat hari ini' : 'Belum kamu buka'}<\/p><h2>${unread.length > 1 ? `Ada ${unread.length} surat baru dari Razan!` : 'Ada surat baru dari Razan!'}<\/h2><p>${esc(letterTitle(f))}<\/p><span class=\"go\">💌 Buka suratnya<\/span><\/button>`;\n  } else if (!open.length && !upcoming.length) {\n    h += `<div class=\"card empty\">📭 Belum ada surat bertanggal.<br>Razan lagi nulis kayaknya 🤭<br><br>Sementara itu, ada surat <b>“Buka kalau…”<\/b> di bawah yang boleh kamu buka kapan aja.<\/div>`;\n  } else if (!upcoming.length) h += `<div class=\"card empty\">✨ Semua surat udah kamu baca. Tunggu surat berikutnya ya!<\/div>`;\n  if (upcoming.length) {\n    h += `<p class=\"sec\">📅 Surat yang akan datang<\/p><div class=\"list\">${upcoming.slice(0, 6).map(x => { const n = daysTo(x.date); return `<div class=\"it lock\"><span class=\"e\">🔒<\/span><span class=\"tx\"><b>Sur "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Open When — Untuk Dara 🤍<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --cream: #faf6f0;\n    --warm: #f5ede0;\n    --blush: #e8c4b0;\n    --rose: #c17a6f;\n    --deep: #7a3f35;\n    --ink: #2d1f1a;\n    --gold: #c9a96e;\n    --muted: #9a8070;\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n\n  body {\n    background: var(--cream);\n    font-family: 'Poppins', sans-serif;\n    font-weight: 300;\n    min-height: 100vh;\n    overflow-x: hidden;\n  }\n\n  body::before {\n    content: '';\n    position: fixed; inset: 0;\n    background:\n      radial-gradient(ellipse 60% 50% at 15% 15%, rgba(232,196,176,0.35) 0%, transparent 65%),\n      radial-gradient(ellipse 50% 60% at 85% 85%, rgba(193,122,111,0.18) 0%, transparent 65%);\n    pointer-events: none; z-index: 0;\n  }\n\n  /* ── SCREENS ── */\n  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; align-items: center; justify-content: center; padding: 2rem 1.5rem; }\n  .screen.active { display: flex; }\n  #screen-main { flex-direction: column; padding: 0 1.5rem 6rem; }\n\n  /* ── INTRO ── */\n  .intro-wrap { max-width: 420px; width: 100%; text-align: center; }\n  .intro-icon { font-size: 4rem; display: block; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }\n  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }\n  .intro-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; display: block; }\n  .intro-title { font-size: clamp(2rem,6vw,2.8rem); font-weight: 600; color: var(--ink); line-height: 1.15; margin-bottom: 0.75rem; }\n  .intro (135deg, #d4e0f0, #b8cce0); }\n  .env-stress   { background: linear-gradient(135deg, #d4e8d4, #b8d4b8); }\n  .env-insecure { background: linear-gradient(135deg, #f0e4d0, #e4d0b8); }\n  .env-happy    { background: linear-gradient(135deg, #fce8d0, #f8d4b0); }\n  .env-lonely   { background: linear-gradient(135deg, #e0d4f0, #c8b8e0); }\n  .env-overthink{ background: linear-gradient(135deg, #e8e0d4, #d4c8b8); }\n\n  .env-top { display: flex; justify-content: space-between; align-items: flex-start; }\n  .env-icon { font-size: 2rem; }\n  .env-status { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(45,31,26,0.4); font-weight: 500; }\n  .env-condition { font-size: 1.1rem; font-weight: 600; color: var(--ink); line-height: 1.3; margin: 1rem 0 0.5rem; }\n  .env-preview { font-size: 12px; color: rgba(45,31,26,0.5); line-height: 1.5; font-style: italic; }\n  .env-open-hint { font-size: 11px; color: rgba(45,31,26,0.4); margin-top: 1rem; letter-spacing: 0.05em; }\n\n  /* ── MODAL ── */\n  #letter-overlay {\n    display: none; position: fixed; inset: 0; z-index: 999;\n    background: rgba(45,31,26,0.5); backdrop-filter: blur(6px);\n    align-items: center; justify-content: center;\n    padding: 1.5rem; overflow-y: auto;\n  }\n  #letter-overlay.active { display: flex; }\n\n  .letter-modal {\n    background: var(--cream); border-radius: 20px;\n    max-width: 500px; width: 100%;\n    box-shadow: 0 20px 60px rgba(45,31,26,0.2);\n    animation: letter-in 0.4s cubic-bezier(0.34,1.56,0.64,1);\n    position: relative; overflow: hidden; margin: auto;\n  }\n  @keyframes letter-in {\n    from{transform:scale(0.85) translateY(20px);opacity:0}\n    to{transform:scale(1) translateY(0);opacity:1}\n  }\n\n  .letter-header {\n    padding: 2rem 2rem 1.5rem;\n    border-bottom: 1px solid rgba(193,122,111,0.12); position: relative;\n  }\n  .letter-header-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }\n  .letter-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; display: block; }\n  .letter-condition { font-size: 1.3rem; font-weight: 600; color: var(--ink); line-height: 1.2; }\n  .letter-condition em { font-style: normal; color: var(--rose); }\n  .letter-close {\n    position: absolute; top: 1.5rem; right: 1.5rem;\n    background: none; border: none; cursor: pointer;\n    font-size: 1.3rem; color: var(--muted);\n    width: 32px; height: 32px; border-radius: 50%;\n    display: flex; align-items: center; justify-content: center;\n    transition: background 0.2s;\n  }\n  .letter-close:hover { background: var(--warm); }\n\n  .letter-body { padding: 2rem; }\n  .letter-salutation { font-size: 14px; font-weight: 500; color: var(--rose); margin-bottom: 1.25rem; display: block; }\n  .letter-text { font-size: 14px; color: var(--ink); line-height: 2; }\n  .letter-text p { margin-bottom: 1rem; }\n  .letter-text p:last-child { margin-bottom: 0; }\n  .letter-sign {\n    font-size: 14px; font-weight: 500; color: var(--rose);\n    margin-top: 1.5rem; display: block;\n    padding-top: 1rem; border-top: 1px solid rgba(193,122,111,0.15);\n  }\n\n  .letter-footer { padding: 1.25rem 2rem 2rem; text-align: center; }\n  .btn-close-letter {\n    padding: 0.85rem 2.5rem; border-radius: 50px; border: none; cursor: pointer;\n    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500;\n    background: var(--rose); color: #fff;\n    box-shadow: 0 4px 16px rgba(193,122,111,0.3); transition: all 0.2s;\n  }\n  .btn-close-letter:hover { background: var(--deep); transform: translateY(-1px); }\n\n  /* ── FOOTER ── */\n  .footer { text-align: center; margin-top: 4rem; font-size: 12px; color: var(--muted); line-height: 2; }\n  .footer span { color: var(--rose); }\n\n  .fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }\n  .fade-in.visible { opacity: 1; transform: none; }\n\n  /* ── BUTTON ── */\n  .btn { display: block; width: 100%; padding: 0.9rem; border-radius: 50px; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; transition: all 0.2s; text-align: center; }\n  .btn-primary { background: var(--rose); color: #fff; box-shadow: 0 4px 16px rgba(193,122,111,0.3); }\n  .btn-primary:hover { background: var(--deep); transform: translateY(-1px); }\n\n  /* ═════ [BARU] ═════ */\n  * { -webkit-tap-highlight-color: transparent; }\n  .home-link { position: absolute; top: calc(.8rem + env(safe-area-inset-top)); left: .8rem; z-index: 5; font-size: 12px; color: var(--muted); text-decoration: none; padding: .45rem .85rem; border-radius: 50px; background: rgba(255,255,255,.8); border: 1px solid rgba(193,122,111,.15); }\n  .hero { padding-top: calc(3.6rem + env(safe-area-inset-top)); }\n  .progress { margin: 1.1rem auto 0; font-size: 11.5px; color: var(--muted); }\n  .progress b { color: var(--rose); font-weight: 600; }\n  .dots { display: flex; gap: 5px; justify-content: center; margin-top: .5rem; }\n  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(193,122,111,.18); }\n  .dots i.on { background: var(--rose); }\n  .envelope:active { transform: scale(.98); }\n  .env-seal { position: absolute; right: 1.1rem; bottom: 1.1rem; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem;\n    background: radial-gradient(circle at 35% 30%, #d98b80, var(--rose) 60%, var(--deep)); box-shadow: 0 3px 8px rgba(122,63,53,.3); }\n  .envelope.read .env-seal { background: rgba(255,255,255,.55); box-shadow: none; }\n  .envelope.read .env-status { color: rgba(45,31,26,.55); }\n  .letter-actions { display: flex; flex-direction: column; gap: .55rem; align-items: center; }\n  .btn-reply { display: inline-block; padding: .8rem 1.6rem; border-radius: 50px; text-decoration: none; font-size: 13px; font-weight: 500; color: #fff; background: #25a35a; box-shadow: 0 4px 14px rgba(37,163,90,.28); }\n  .letter-meta { font-size: 10.5px; color: var(--muted); margin-top: .35rem; }\n  #letter-overlay { padding: calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom)); }\n  .letter-modal.opening .letter-body, .letter-modal.opening .letter-footer { animation: unfold .6s ease .15s both; }\n  @keyframes unfold { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n\n  @media (max-width: 480px) {\n    .envelopes { grid-template-columns: 1fr; }\n    .letter-body { padding: 1.5rem; }\n    .letter-header { padding: 1.5rem 1.5rem 1.25rem; }\n  }\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<a class=\"home-link\" href=\"index.html\">← Menu utama<\/a>\n\n<\!-- INTRO -->\n<div id=\"screen-intro\" class=\"screen active\">\n  <div class=\"intro-wrap\">\n    <span class=\"intro-icon\">💌<\/span>\n    <span class=\"intro-label\">Surat Khusus Untuk Dara<\/span>\n    <h1 class=\"intro-title\">Open <span>When...<\/span><\/h1>\n    <p class=\"intro-sub\">Di sini ada 8 surat yang ditulis khusus buat kamu. Buka sesuai perasaan kamu sekarang.<\/p>\n    <div class=\"intro-divider\"><\/div>\n    <button class=\"btn btn-primary\" onclick=\"startOpenWhen()\">Buka Suratnya →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- MAIN -->\n<div id=\"screen-main\" class=\"screen\">\n  <div class=\"page\">\n    <div class=\"hero fade-in\">\n      <span class=\"hero-label\">Surat Khusus Untuk Dara<\/span>\n      <h1 class=\"hero-title\">Open <span>When...<\/span><\/h1>\n      <p class=\"hero-sub\">Pilih amplop sesuai perasaan kamu sekarang. Setiap surat ditulis khusus untuk momen itu.<\/p>\n      <div class=\"hero-divider\"><\/div>\n      <p class=\"progress\" id=\"progress\"><\/p>\n      <div class=\"dots\" id=\"dots\"><\/div>\n    <\/div>\n\n    <div class=\"envelopes fade-in\">\n\n      <div class=\"envelope env-sad\" onclick=\"openLetter('sad')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🌧️<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi sedih<\/p>\n          <p class=\"env-preview\">\"Ada sesuatu yang mau aku bilang waktu kamu lagi di titik terendah...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-angry\" onclick=\"openLetter('angry')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🔥<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi marah sama aku<\/p>\n          <p class=\"env-preview\">\"Kalau kamu lagi marah sama aku, ini yang pengen aku sampaikan...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-miss\" onclick=\"openLetter('miss')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🌙<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi kangen aku<\/p>\n          <p class=\"env-preview\">\"Waktu jarak terasa berat dan kamu kangen, baca ini dulu...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-stress\" onclick=\"openLetter('stress')\">\n        <div class=\"env-top\"><span class=\"env-icon\">😮‍💨<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi stress<\/p>\n          <p class=\"env-preview\">\"Tarik napas dulu. Aku udah siapkan sesuatu buat kamu...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-insecure\" onclick=\"openLetter('insecure')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🪞<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi ngerasa kurang<\/p>\n          <p class=\"env-preview\">\"Waktu kamu mulai ngerasa tidak cukup baik, baca ini...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-happy\" onclick=\"openLetter('happy')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🌸<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi bahagia<\/p>\n          <p class=\"env-preview\">\"Waktu semuanya terasa baik — ini yang aku rasain juga...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-lonely\" onclick=\"openLetter('lonely')\">\n        <div class=\"env-top\"><span class=\"env-icon\">🌃<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi ngerasa sendirian<\/p>\n          <p class=\"env-preview\">\"Kamu tidak pernah benar-benar sendirian. Ini buktinya...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n      <div class=\"envelope env-overthink\" onclick=\"openLetter('overthink')\">\n        <div class=\"env-top\"><span class=\"env-icon\">💭<\/span><span class=\"env-status\">Buka sekarang<\/span><\/div>\n        <div>\n          <p class=\"env-condition\">...kamu lagi overthinking<\/p>\n          <p class=\"env-preview\">\"Stop sebentar. Aku tau pikiranmu lagi kemana-mana...\"<\/p>\n        <\/div>\n        <p class=\"env-open-hint\">✉ Tap untuk buka<\/p><span class=\"env-seal\">💌<\/span>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"footer fade-in\">\n      <p>Dibuat dengan <span>🤍<\/span> untuk Dara Syifa Aulia<\/p>\n      <p style=\"font-size:11px;margin-top:4px;\">dari Razan — yang selalu ada, bahkan di surat ini.<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- LETTER OVERLAY -->\n<div id=\"letter-overlay\" onclick=\"handleOverlayClick(event)\">\n  <div class=\"letter-modal\">\n    <div class=\"letter-header\">\n      <span class=\"letter-header-icon\" id=\"letter-icon\">💌<\/span>\n      <span class=\"letter-label\">Open When<\/span>\n      <h2 class=\"letter-condition\" id=\"letter-condition\">...<\/h2>\n      <button class=\"letter-close\" onclick=\"closeLetter()\">✕<\/button>\n    <\/div>\n    <div class=\"letter-body\">\n      <span class=\"letter-salutation\">Dara yang aku sayang,<\/span>\n      <div class=\"letter-text\" id=\"letter-text\"><\/div>\n      <span class=\"letter-sign\" id=\"letter-sign\">— Razan 🤍<\/span>\n    <\/div>\n    <div class=\"letter-footer\">\n      <div class=\"letter-actions\">\n        <a class=\"btn-reply\" id=\"btn-reply\" href=\"#\" target=\"_blank\" rel=\"noopener\">💬 Bales ke Razan<\/a>\n        <button class=\"btn-close-letter\" onclick=\"closeLetter()\">Tutup Surat 🤍<\/button>\n        <p class=\"letter-meta\" id=\"letter-meta\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\script>\nconst letters = {\n  sad: {\n    icon: '🌧️',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">sedih<\/span>',\n    text: `<p>Aku tau sekarang mungkin terasa berat. Dan aku ga bisa langsung datang dan bikin semuanya baik-baik aja — aku tau itu.<\/p>\n      <p>Tapi aku mau kamu tau satu hal: perasaan ini tidak akan selamanya di sini. Kesedihan itu nyata, tapi dia juga selalu pergi.<\/p>\n      <p>Kamu itu orang yang kuat, Dara — bukan karena kamu tidak pernah sedih, tapi karena kamu selalu bangkit setelahnya. Aku udah lihat itu.<\/p>\n      <p>Kalau sekarang kamu butuh nangis, nangis aja. Kalau butuh diam, diam aja. Kamu tidak harus terlihat baik-baik aja terus.<\/p>\n      <p>Dan kalau kamu mau cerita — aku di sini. Selalu.<\/p>`,\n    sign: '— Razan, yang selalu ada 🤍'\n  },\n  angry: {\n    icon: '🔥',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">marah sama aku<\/span>',\n    text: `<p>Kalau kamu lagi buka surat ini, berarti kamu lagi marah sama aku. Dan itu wajar.<\/p>\n      <p>Aku ga mau bilang \"jangan marah\" — karena perasaan kamu itu benar. Kalau aku salah, aku salah. Dan aku minta maaf.<\/p>\n      <p>Yang aku mau kamu ingat adalah: apapun yang terjadi, aku tidak marah balik. Aku mungkin melakukan hal yang salah, tapi niatku tidak pernah untuk menyakiti kamu.<\/p>\n      <p>Kamu boleh marah. Kamu boleh diam. Tapi jangan pergi terlalu jauh, ya — karena aku selalu mau kita selesaikan ini bersama, bukan saling menjauh.<\/p>\n      <p>Aku sayang kamu. Bahkan di momen ini.<\/p>`,\n    sign: '— Razan, yang tetap di sini 🤍'\n  },\n  miss: {\n    icon: '🌙',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">kangen aku<\/span>',\n    text: `<p>Hei. Aku juga kangen kamu.<\/p>\n      <p>Kamu tau tidak — setiap kali aku kangen kamu, aku selalu ingat hal-hal kecil. Cara kamu senyum. Cara kamu ngomel. Cara kamu ada, tanpa harus ngomong apapun.<\/p>\n      <p>Jarak itu berat, aku tau. Tapi aku mau kamu tau bahwa rasa kangen itu tanda bahwa kita punya sesuatu yang berharga. Tidak semua orang punya orang yang layak untuk dirindukan.<\/p>\n      <p>Kamu adalah orang yang selalu aku mau kabarin pertama kalau ada sesuatu. Dan itu tidak berubah, seberapa jauh pun jaraknya.<\/p>\n      <p>Sebentar lagi kita bisa ketemu. Sampai saat itu — surat ini ada buat kamu.<\/p>`,\n    sign: '— Razan, yang juga kangen kamu 🌙'\n  },\n  stress: {\n    icon: '😮‍💨',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">stress<\/span>',\n    text: `<p>Stop dulu.<\/p>\n      <p>Tarik napas. Pelan-pelan. Satu kali dulu.<\/p>\n      <p>Aku tau kamu lagi ngerasa semua hal menumpuk sekaligus. Aku tau rasanya kepala penuh dan badan lelah tapi pikiran tidak mau berhenti.<\/p>\n      <p>Tapi aku mau kamu ingat — kamu udah melewati banyak hal yang terasa berat sebelumnya. Dan kamu selalu berhasil. Selalu.<\/p>\n      <p>Istirahat itu bukan menyerah. Berhenti sebentar itu bukan kekalahan. Kamu boleh tidak produktif hari ini. Kamu boleh cuma rebahan dan nafas.<\/p>\n      <p>Dan kalau butuh seseorang untuk diajak bicara — aku ada. Selalu.<\/p>`,\n    sign: '— Razan, yang pengen kamu istirahat dulu 🤍'\n  },\n  insecure: {\n    icon: '🪞',\n    condition: '...kamu lagi ngerasa <span style=\"color:var(--rose)\">kurang<\/span>',\n    text: `<p>Aku mau jujur sama kamu tentang sesuatu.<\/p>\n      <p>Kamu itu cantik. Bukan cantik yang ramai dan mencolok — tapi cantik yang bikin orang diam sejenak dan ngerasa tenang. Kamu punya itu, Dara.<\/p>\n      <p>Kamu lucu, imut, hangat, dan penuh karisma. Bukan karena aku harus bilang itu — tapi karena aku lihat itu setiap kali aku sama kamu.<\/p>\n      <p>Dunia di luar sana memang keras. Standarnya tidak masuk akal. Tapi kamu tidak harus memenuhi standar siapapun selain standar kamu sendiri.<\/p>\n      <p>Di mata aku, kamu sudah lebih dari cukup. Sejak pertama, dan sampai sekarang.<\/p>`,\n    sign: '— Razan, yang selalu lihat yang terbaik dari kamu 🤍'\n  },\n  happy: {\n    icon: '🌸',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">bahagia<\/span>',\n    text: `<p>Hei, kamu lagi bahagia ya. Aku seneng banget dengernya.<\/p>\n      <p>Senyuman kamu itu — entah kenapa selalu bisa bikin hari aku jadi lebih baik juga, bahkan dari jauh. Itu salah satu hal yang aku syukuri.<\/p>\n      <p>Nikmatin momen ini sepenuhnya, ya. Jangan buru-buru khawatir tentang besok atau hari lain. Sekarang ini milik kamu, dan kamu berhak bahagia.<\/p>\n      <p>Dan aku mau kamu tau — kebahagiaan kamu itu penting buat aku. Bukan cuma karena aku sayang kamu, tapi karena kamu memang layak untuk itu.<\/p>\n      <p>Terus senyum, Dara. Wajah kamu paling bagus waktu senyum.<\/p>`,\n    sign: '— Razan, yang ikut bahagia 🌸'\n  },\n  lonely: {\n    icon: '🌃',\n    condition: '...kamu lagi ngerasa <span style=\"color:var(--rose)\">sendirian<\/span>',\n    text: `<p>Aku mau kamu baca ini pelan-pelan.<\/p>\n      <p>Kamu tidak sendirian. Aku tau itu mungkin terasa biasa — tapi aku serius.<\/p>\n      <p>Aku ada. Tidak selalu bisa hadir secara langsung, tidak selalu bisa langsung datang — tapi aku ada. Di sini. Selalu kepikiran kamu, bahkan di momen-momen yang kamu kira aku tidak tau.<\/p>\n      <p>Kamu adalah orang pertama yang aku mau kabarin kalau ada sesuatu. Itu bukan kebetulan. Itu karena kamu memang berarti.<\/p>\n      <p>Kalau malam ini terasa terlalu sepi — kirim pesan ke aku. Kita ngobrol. Tentang apapun. Aku ga kemana-mana.<\/p>`,\n    sign: '— Razan, yang tidak pernah pergi jauh 🌃'\n  },\n  overthink: {\n    icon: '💭',\n    condition: '...kamu lagi <span style=\"color:var(--rose)\">overthinking<\/span>',\n    text: `<p>Hei. Aku tau kepala kamu lagi penuh banget sekarang.<\/p>\n      <p>Kamu lagi mikirin banyak hal sekaligus kan? Hal-hal yang belum tentu terjadi. Kemungkinan-kemungkinan yang bikin cemas. Aku tau kamu.<\/p>\n      <p>Boleh aku minta sesuatu? Coba tanya ke diri sendiri satu pertanyaan ini: \"Apakah ini nyata sekarang, atau aku hanya mengkhawatirkan sesuatu yang belum terjadi?\"<\/p>\n      <p>Kebanyakan hal yang kita khawatirkan tidak pernah benar-benar terjadi. Dan yang terjadi pun — selalu ada jalan keluarnya.<\/p>\n      <p>Kamu tidak harus tau semua jawabannya sekarang. Kamu boleh tidak tau. Dan kamu boleh istirahat dari pikiran kamu sendiri.<\/p>\n      <p>Aku di sini kalau kamu mau cerita.<\/p>`,\n    sign: '— Razan, yang pengen kamu tenang 💭🤍'\n  }\n};\n\n// ── [BARU] catat surat yang udah dibuka (cuma di HP ini) ──\nconst WA = '6285692740607';\nconst KEYS = ['sad', 'angry', 'miss', 'stress', 'insecure', 'happy', 'lonely', 'overthink'];\nconst PLAIN = { sad: 'kamu lagi sedih', angry: 'kamu lagi marah sama aku', miss: 'kamu lagi kangen aku', stress: 'kamu lagi stress', insecure: 'kamu lagi ngerasa kurang', happy: 'kamu lagi bahagia', lonely: 'kamu lagi ngerasa sendirian', overthink: 'kamu lagi overthinking' };\nconst REPLY = {\n  sad: 'Hei, aku baru buka surat \"Open when kamu lagi sedih\" 🌧️ Lagi butuh kamu nih…',\n  angry: 'Aku baru buka surat \"Open when kamu lagi marah sama aku\" 🔥 Kita ngobrol ya nanti.',\n  miss: 'Aku baru buka surat \"Open when kamu lagi kangen aku\" 🌙 Kangen kamu…',\n  stress: 'Aku baru buka surat \"Open when kamu lagi stress\" 😮‍💨 Lagi capek banget nih.',\n  insecure: 'Aku baru buka surat \"Open when kamu lagi ngerasa kurang\" 🪞 Makasih ya udah nulis itu.',\n  happy: 'Aku baru buka surat \"Open when kamu lagi bahagia\" 🌸 Hari ini aku seneng banget!',\n  lonely: 'Aku baru buka surat \"Open when kamu lagi ngerasa sendirian\" 🌃 Temenin aku ngobrol yuk.',\n  overthink: 'Aku baru buka surat \"Open when kamu lagi overthinking\" 💭 Kepala aku lagi penuh nih.',\n};\nlet log = {};\ntry { log = JSON.parse(localStorage.getItem('openwhen-log') || '{}'); } catch (e) {}\nfunction saveLog() { try { localStorage.setItem('openwhen-log', JSON.stringify(log)); } catch (e) {} }\nfunction ago(ts) {\n  const d = Math.floor((Date.now() - ts) / 864e5);\n  if (d <= 0) return 'hari ini'; if (d === 1) return 'kemarin'; if (d < 30) return `${d} hari lalu`;\n  return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });\n}\nfunction renderStatus() {\n  const cards = document.querySelectorAll('.envelope');\n  cards.forEach((el, i) => {\n    const k = KEYS[i], L = log[k];\n    el.classList.toggle('read', !!L);\n    el.querySelector('.env-status').textContent = L ? `Dibuka ${L.count}x` : 'Buka sekarang';\n    el.querySelector('.env-seal').textContent = L ? '✓' : '💌';\n    el.querySelector('.env-open-hint').textContent = L ? `✉ Terakhir dibuka ${ago(L.last)}` : '✉ Tap untuk buka';\n  });\n  const n = KEYS.filter(k => log[k]).length;\n  document.getElementById('progress').innerHTML = n ? `<b>${n}<\/b> dari 8 surat udah pernah kamu buka 🤍` : 'Belum ada surat yang dibuka — pilih yang paling pas sama perasaanmu';\n  document.getElementById('dots').innerHTML = KEYS.map(k => `<i class=\"${log[k] ? 'on' : ''}\"><\/i>`).join('');\n}\n\nfunction startOpenWhen() {\n  try { sessionStorage.setItem('openwhen-intro', '1'); } catch (e) {}\n  document.getElementById('screen-intro').classList.remove('active');\n  document.getElementById('screen-main').classList.add('active');\n  setTimeout(() => {\n    document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));\n  }, 100);\n}\n\nfunction openLetter(key) {\n  const l = letters[key];\n  const prev = log[key];\n  log[key] = { count: (prev ? prev.count : 0) + 1, last: Date.now() }; saveLog();\n  document.getElementById('letter-meta').textContent = prev ? `Surat ini udah kamu buka ${log[key].count}x · sebelumnya ${ago(prev.last)}` : 'Pertama kali dibuka 💌';\n  document.getElementById('btn-reply').href = `https://wa.me/${WA}?text=${encodeURIComponent(REPLY[key])}`;\n  const m = document.querySelector('.letter-modal'); m.classList.remove('opening'); void m.offsetWidth; m.classList.add('opening');\n  document.getElementById('letter-overlay').scrollTop = 0;\n  try { navigator.vibrate && navigator.vibrate([15, 30, 15]); } catch (e) {}\n  document.getElementById('letter-icon').textContent = l.icon;\n  document.getElementById('letter-condition').innerHTML = l.condition;\n  document.getElementById('letter-text').innerHTML = l.text;\n  document.getElementById('letter-sign').textContent = l.sign;\n  document.getElementById('letter-overlay').classList.add('active');\n  document.body.style.overflow = 'hidden';\n}\n\nfunction closeLetter() {\n  document.getElementById('letter-overlay').classList.remove('active');\n  document.body.style.overflow = '';\n  renderStatus();\n}\n\nfunction handleOverlayClick(e) {\n  if (e.target === document.getElementById('letter-overlay')) closeLetter();\n}\n\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });\nrenderStatus();\n// udah lewat intro di sesi ini? langsung ke daftar surat\ntry { if (sessionStorage.getItem('openwhen-intro')) startOpenWhen(); } catch (e) {}\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam game/hadiah gabungan: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\script>/* link ke halaman lain dibuka di jendela utama */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.target||a.hasAttribute('download'))return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|tel:|#|javascript:|blob:|data:)/i.test(h))return;e.preventDefault();window.top.location.href=h;},true);}<\/script>\n<\/body>\n<\/html>"];
const K = 'hub-surat';
let cur = null;
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function paint() {
  document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="${i === cur ? 'on' : ''}" data-i="${i}">${t[0]} ${t[1]}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i) {
  if (i === cur) return;
  cur = i; lsSet(K, i); paint(); try { const t = document.querySelector('#tabs .on'); t && t.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {}
  const f = document.getElementById('frame');
  f.querySelectorAll('iframe').forEach(x => x.remove());          // cuma 1 yang jalan, biar musiknya ga dobel
  document.getElementById('load').style.display = '';
  const fr = document.createElement('iframe');
  fr.srcdoc = PAGES[i]; fr.title = TABS[i][1];
  fr.onload = () => {
    document.getElementById('load').style.display = 'none';
    // halaman yang aslinya dibikin pas satu layar penuh: kalau layar HP lebih pendek, biar tetep bisa discroll (ga kepotong)
    try {
      const d = fr.contentDocument, de = d.documentElement, bd = d.body, st = d.createElement('style');
      st.textContent = 'html,body{overflow-x:hidden} body{padding-bottom:calc(5rem + env(safe-area-inset-bottom))!important}';
      d.head.appendChild(st);
      const W = fr.contentWindow;
      const fit = () => {
        const H = W.innerHeight;
        if (de.scrollHeight > de.clientHeight + 4 && (W.getComputedStyle(bd).overflowY === 'hidden' || W.getComputedStyle(de).overflowY === 'hidden')) { de.style.overflowY = 'auto'; bd.style.overflowY = 'auto'; bd.style.height = 'auto'; bd.style.minHeight = '100%'; }
        // layar penuh (fixed/absolute) yang isinya lebih panjang dari layar HP → bikin bisa discroll
        bd.querySelectorAll('*').forEach(el => {
          if (el.__fit || el.tagName === 'CANVAS') return;
          const cs = W.getComputedStyle(el); if (cs.position !== 'fixed' && cs.position !== 'absolute') return;
          if (el.clientHeight < H * .6 || el.scrollHeight <= el.clientHeight + 4) return;
          if (cs.overflowY === 'auto' || cs.overflowY === 'scroll') return;
          el.__fit = 1; el.style.overflowY = 'auto'; el.style.webkitOverflowScrolling = 'touch';
        });
      };
      let ft = 0; const later = () => { clearTimeout(ft); ft = setTimeout(fit, 250); };
      fit(); setTimeout(fit, 600); W.addEventListener('resize', later);
      try { new W.MutationObserver(later).observe(bd, { attributes: true, attributeFilter: ['class'], subtree: true }); } catch (e) {}
    } catch (e) {}
  };
  f.appendChild(fr);
  try { const sp = new URLSearchParams(location.search); sp.set('m', i); history.replaceState(null, '', location.pathname + '?' + sp.toString() + location.hash); } catch (e) {}
}
const q = location.search.match(/[?&]m=(\d)/);
go(q ? Math.min(TABS.length - 1, +q[1]) : Math.min(TABS.length - 1, lsGet(K, 0)));
