<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Tebak Kenangan — Razan & Dara 📸</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
    --rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a;
    --ok:#5f9a62;--bad:#c4605a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:'Poppins',sans-serif}
  html,body{min-height:100%}
  body{background:var(--cream);font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 60% 45% at 20% 10%,rgba(232,196,176,.4),transparent 65%),radial-gradient(ellipse 55% 50% at 85% 90%,rgba(193,122,111,.16),transparent 65%)}
  .wrap{max-width:460px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1.15rem calc(2rem + env(safe-area-inset-bottom));position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .back-link,.top-btn{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}

  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  .center{margin:auto 0;text-align:center;padding:1rem 0}

  /* ── MENU ── */
  .m-ico{font-size:3.2rem;display:block;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  .m-label{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:.7rem 0 .25rem}
  .m-title{font-size:clamp(1.7rem,6.5vw,2.2rem);font-weight:700;line-height:1.1}
  .m-title span{color:var(--rose)}
  .m-sub{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:300px;margin:.5rem auto 1.3rem}
  .opt-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:1rem 0 .45rem;text-align:left}
  .seg{display:flex;gap:.4rem;background:#fff;border:1px solid rgba(193,122,111,.16);border-radius:16px;padding:.3rem}
  .seg button{flex:1;border:none;background:none;border-radius:12px;padding:.6rem .3rem;font-size:12px;color:var(--muted);cursor:pointer;line-height:1.35}
  .seg button b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
  .seg button.on{background:var(--rose);color:#fff}
  .seg button.on b{color:#fff}
  .best{font-size:11.5px;color:var(--muted);margin-top:1rem}
  .best b{color:var(--rose)}
  .go{width:100%;margin-top:1.2rem;padding:1rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--rose),var(--deep));box-shadow:0 6px 22px rgba(193,122,111,.35)}
  .go:active{transform:scale(.97)}
  .go:disabled{opacity:.5}
  .note{font-size:12.5px;color:var(--muted);line-height:1.75;background:rgba(255,255,255,.7);border:1px dashed var(--blush);border-radius:18px;padding:1.1rem;margin-top:1rem}
  .note a{color:var(--rose);font-weight:600}
  .pool-info{font-size:11px;color:var(--muted);margin-top:.7rem}

  /* ── MAIN ── */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.9rem 0 .7rem}
  .round{font-size:11px;color:var(--muted)}
  .round b{color:var(--ink);font-weight:600}
  .scores{display:flex;gap:.4rem}
  .sc{font-size:12px;font-weight:600;border-radius:50px;padding:.25rem .7rem;background:#fff;border:1px solid rgba(193,122,111,.15);white-space:nowrap}
  .sc.Razan{color:var(--rz)} .sc.Dara{color:#c4605a} .sc.solo{color:var(--rose)}
  .sc.turn{box-shadow:0 0 0 2px currentColor}
  .turn-banner{text-align:center;font-size:12.5px;font-weight:600;margin-bottom:.6rem;border-radius:50px;padding:.35rem .9rem;align-self:center}
  .turn-banner.Razan{background:rgba(74,127,193,.12);color:var(--rz)}
  .turn-banner.Dara{background:rgba(217,119,107,.14);color:#c4605a}
  .prog{height:4px;border-radius:2px;background:rgba(193,122,111,.14);overflow:hidden;margin-bottom:.9rem}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blush),var(--rose));transition:width .4s ease}

  .polaroid{background:#fff;padding:.6rem .6rem 2.4rem;border-radius:4px;box-shadow:0 12px 34px rgba(45,31,26,.18);transform:rotate(-1.5deg);position:relative;align-self:center;width:min(100%,330px)}
  .polaroid.flip{animation:snap .5s ease}
  @keyframes snap{0%{transform:rotate(-1.5deg) scale(.92);opacity:.3}100%{transform:rotate(-1.5deg) scale(1);opacity:1}}
  .ph{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,var(--warm),var(--blush));border-radius:2px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
  .ph img.ok{opacity:1}
  .ph .spin{position:absolute;font-size:1.6rem;animation:bob 1.2s ease-in-out infinite}
  .ph-cap{position:absolute;left:0;right:0;bottom:.55rem;text-align:center;font-family:'Caveat',cursive;font-size:1.45rem;color:var(--deep);min-height:1.6rem;line-height:1.2}
  .q{text-align:center;font-size:14px;font-weight:600;margin:1.1rem 0 .7rem}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
  .opt{border:1.5px solid var(--blush);background:#fff;border-radius:16px;padding:.85rem .5rem;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;line-height:1.35;transition:transform .12s}
  .opt:active{transform:scale(.96)}
  .opt.right{background:rgba(95,154,98,.14);border-color:var(--ok);color:#3f6f42}
  .opt.wrong{background:rgba(196,96,90,.12);border-color:var(--bad);color:var(--bad);animation:shake .35s}
  .opt.dim{opacity:.45}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .opt:disabled{cursor:default}
  .feedback{min-height:2.6rem;text-align:center;font-size:12.5px;color:var(--muted);margin-top:.7rem;line-height:1.5}
  .feedback b{color:var(--ink)}
  .next{width:100%;margin-top:.4rem;padding:.85rem;border-radius:50px;border:none;cursor:pointer;font-size:14px;font-weight:600;color:#fff;background:var(--rose);display:none}
  .next.on{display:block}

  /* ── HASIL ── */
  .r-ico{font-size:3.4rem;display:block}
  .r-title{font-size:1.5rem;font-weight:700;margin:.4rem 0 .2rem}
  .r-sub{font-size:12.5px;color:var(--muted);line-height:1.7}
  .r-score{display:flex;gap:.6rem;justify-content:center;margin:1.2rem 0}
  .r-box{background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:18px;padding:.9rem 1.1rem;min-width:110px}
  .r-box b{display:block;font-size:1.7rem;font-weight:700;line-height:1.1}
  .r-box small{font-size:11px;color:var(--muted)}
  .r-box.Razan b{color:var(--rz)} .r-box.Dara b{color:#c4605a} .r-box.solo b{color:var(--rose)}
  .r-box.win{box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(201,169,110,.3)}
  .recap{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin:.4rem 0 1rem}
  .recap div{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:var(--warm)}
  .recap img{width:100%;height:100%;object-fit:cover}
  .recap span{position:absolute;right:2px;bottom:1px;font-size:.75rem}
  .ghost{width:100%;margin-top:.55rem;padding:.85rem;border-radius:50px;border:1.5px solid var(--blush);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:none;display:block;text-align:center}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  @media (max-width:360px){
    .wrap{padding-left:.95rem;padding-right:.95rem}
    .opt{font-size:12px;padding:.75rem .4rem}
    .polaroid{width:min(100%,280px)}
    .seg button{font-size:11px}
  }
  @media (max-height:640px){ .polaroid{width:min(100%,250px)} .q{margin:.8rem 0 .55rem} }
  @media (prefers-reduced-motion:reduce){ .m-ico,.ph .spin{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html" class="back-link">← Menu utama</a>
    <button class="top-btn" id="quit-btn" style="display:none" onclick="quit()">✕ Udahan</button>
  </div>

  <!-- MENU -->
  <div class="screen on" id="s-menu">
    <div class="center">
      <span class="m-ico">📸</span>
      <span class="m-label">Seberapa inget kamu?</span>
      <h1 class="m-title">Tebak <span>Kenangan</span></h1>
      <p class="m-sub">Muncul satu foto dari Memories kita — tebak itu kapan. Kelihatannya gampang… 😏</p>
      <div id="menu-body"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="screen" id="s-game">
    <div class="hud"><span class="round">Ronde <b id="rd">1</b> / <span id="rd-total">10</span></span><div class="scores" id="scores"></div></div>
    <div class="prog"><i id="prog" style="width:0%"></i></div>
    <div class="turn-banner" id="turn" style="display:none"></div>
    <div class="polaroid" id="polaroid">
      <div class="ph" id="ph"><span class="spin">📷</span><img id="img" alt="Foto kenangan"></div>
      <div class="ph-cap" id="cap"></div>
    </div>
    <p class="q" id="q">Ini kapan ya?</p>
    <div class="opts" id="opts"></div>
    <p class="feedback" id="fb"></p>
    <button class="next" id="next" onclick="nextRound()">Lanjut →</button>
  </div>

  <!-- HASIL -->
  <div class="screen" id="s-end">
    <div class="center">
      <span class="r-ico" id="r-ico">🏆</span>
      <h2 class="r-title" id="r-title"></h2>
      <p class="r-sub" id="r-sub"></p>
      <div class="r-score" id="r-score"></div>
      <div class="recap" id="recap"></div>
      <button class="go" onclick="start()">Main lagi 🔁</button>
      <button class="ghost" onclick="show('s-menu');renderMenu()">Ganti pilihan</button>
      <a class="ghost" href="memories.html">📸 Buka Memories</a>
    </div>
  </div>
</div>

<script>
const MEM_API = 'https://script.google.com/macros/s/AKfycbxPd5lEfwBFVHE8j0kX4vBvC4JdYhXjVLeZA0-sAbqNa3sLyAOVo1k1HLBJe0aFq8Jw/exec';  // sama kayak memories.html
const ROUNDS = 10;
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const thumb = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}-rw`;
const thumbAlt = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let mode = lsGet('tk-mode', 'mudah');     // mudah = bulan & tahun, susah = tanggal persis
let players = lsGet('tk-players', 'solo'); // solo | duo
let albums = [];                          // [{name, date(Date), key, photos:[id]}]

/* ── data dari Memories (yang udah kesimpen di HP) ── */
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function readAlbums() {
  // daftar terbaru punya game ini (kalau ada), kalau nggak pakai yang disimpen halaman Memories — punya Memories nggak diubah
  const own = lsGet('tk-albums', null), D = lsGet('mem-idx', null);
  const list = Array.isArray(own) && own.length ? own : (D && Array.isArray(D.albums) ? D.albums : []);
  return list.map(a => {
    const d = parseYMD(a.date); if (!d) return null;
    let photos = (a.items || []).filter(x => x.type === 'image').map(x => x.id);
    if (!photos.length && a.cover && a.coverType !== 'video') photos = [a.cover];
    return photos.length ? { name: a.name, date: d, photos } : null;
  }).filter(Boolean);
}
async function refreshFromServer() {
  // kalau HP ini pernah login Memories, ambil daftar terbaru diam-diam
  const pw = (() => { try { return localStorage.getItem('mem-pw'); } catch (e) { return null; } })();
  if (!pw) return;
  try {
    const r = await fetch(`${MEM_API}?action=all&pw=${encodeURIComponent(pw)}`);
    const j = await r.json();
    if (j && j.ok && j.data && Array.isArray(j.data.albums)) {
      lsSet('tk-albums', j.data.albums.map(a => ({ name: a.name, date: a.date, cover: a.cover, coverType: a.coverType, items: (a.items || []).filter(x => x.type === 'image').map(x => ({ id: x.id, type: 'image' })) })));
      albums = readAlbums();
      if ($('s-menu').classList.contains('on')) renderMenu();
    }
  } catch (e) {}
}
const monthKey = d => d.getFullYear() * 12 + d.getMonth();
const labelOf = (d, m) => m === 'susah' ? `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}` : `${BULAN[d.getMonth()]} ${d.getFullYear()}`;
function canPlay(m) {
  if (m === 'susah') return albums.length >= 4;
  return new Set(albums.map(a => monthKey(a.date))).size >= 1 && albums.length >= 1;
}

/* ── menu ── */
function renderMenu() {
  albums = readAlbums();
  const box = $('menu-body');
  if (!albums.length) {
    box.innerHTML = `<div class="note">📸 Daftar foto Memories belum ada di HP ini.<br>Buka <a href="memories.html">Kenangan Kita</a> sekali terus login, abis itu balik ke sini ya 🤍</div>`;
    return;
  }
  const best = lsGet('tk-best', {});
  const photos = albums.reduce((s, a) => s + a.photos.length, 0);
  box.innerHTML = `
    <p class="opt-label">Tingkat kesulitan</p>
    <div class="seg" id="seg-mode">
      <button data-v="mudah" class="${mode === 'mudah' ? 'on' : ''}"><b>😊 Mudah</b>bulan & tahun</button>
      <button data-v="susah" class="${mode === 'susah' ? 'on' : ''}" ${albums.length < 4 ? 'disabled style="opacity:.4"' : ''}><b>🔥 Susah</b>tanggal persis</button>
    </div>
    <p class="opt-label">Yang main</p>
    <div class="seg" id="seg-pl">
      <button data-v="solo" class="${players === 'solo' ? 'on' : ''}"><b>🙋 Sendiri</b>kejar rekor</button>
      <button data-v="duo" class="${players === 'duo' ? 'on' : ''}"><b>👫 Berdua</b>siapa paling inget</button>
    </div>
    <p class="best">${best[mode] != null ? `🏆 Rekor ${mode === 'mudah' ? 'mudah' : 'susah'}: <b>${best[mode]}</b> / ${ROUNDS * 10} poin` : 'Belum ada rekor — yuk mulai!'}</p>
    <button class="go" onclick="start()">Mulai 📸</button>
    <p class="pool-info">${albums.length} album · ${photos} foto${albums.length < 4 ? ' · mode susah butuh minimal 4 album' : ''}</p>`;
  if (mode === 'susah' && albums.length < 4) mode = 'mudah';
  box.querySelectorAll('#seg-mode button').forEach(b => b.onclick = () => { if (b.disabled) return; mode = b.dataset.v; lsSet('tk-mode', mode); renderMenu(); });
  box.querySelectorAll('#seg-pl button').forEach(b => b.onclick = () => { players = b.dataset.v; lsSet('tk-players', players); renderMenu(); });
}

/* ── game ── */
let rounds = [], ri = 0, score = {}, turn = 'Dara', answered = false, history = [];
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); $('quit-btn').style.display = id === 's-game' ? '' : 'none'; window.scrollTo(0, 0); }
function makeOptions(album) {
  const right = labelOf(album.date, mode);
  const set = new Set([right]);
  // pengecoh: tanggal/bulan dari album lain dulu (lebih menjebak), baru bulan di sekitarnya
  shuffle(albums).forEach(a => { if (set.size < 4) set.add(labelOf(a.date, mode)); });
  let k = 1;
  while (set.size < 4 && k < 40) {
    const d = new Date(album.date); d.setMonth(d.getMonth() + (k % 2 ? Math.ceil(k / 2) : -Math.ceil(k / 2)) * (mode === 'susah' ? 1 : 1));
    if (mode === 'susah') d.setDate(Math.min(28, album.date.getDate() + (k % 3) - 1));
    set.add(labelOf(d, mode)); k++;
  }
  return { right, opts: shuffle([...set].slice(0, 4)) };
}
function start() {
  albums = readAlbums();
  if (!albums.length) { renderMenu(); return; }
  // pilih foto: usahain beda album tiap ronde, foto random di dalamnya
  const order = [];
  let bag = [];
  for (let i = 0; i < ROUNDS; i++) {
    if (!bag.length) bag = shuffle(albums);
    const a = bag.pop();
    order.push({ album: a, photo: a.photos[Math.floor(Math.random() * a.photos.length)] });
  }
  rounds = order.map(o => Object.assign(o, makeOptions(o.album)));
  ri = 0; history = [];
  score = players === 'duo' ? { Dara: 0, Razan: 0 } : { solo: 0 };
  turn = Math.random() < .5 ? 'Dara' : 'Razan';
  show('s-game');
  renderRound();
}
function renderScores() {
  $('scores').innerHTML = Object.keys(score).map(k => `<span class="sc ${k}${players === 'duo' && k === turn ? ' turn' : ''}">${k === 'solo' ? '⭐' : k === 'Dara' ? '🙋‍♀️' : '🙋‍♂️'} ${score[k]}</span>`).join('');
}
function renderRound() {
  const r = rounds[ri];
  answered = false;
  $('rd').textContent = ri + 1; $('rd-total').textContent = ROUNDS;
  $('prog').style.width = (ri / ROUNDS * 100) + '%';
  renderScores();
  const tb = $('turn');
  if (players === 'duo') { tb.style.display = ''; tb.className = 'turn-banner ' + turn; tb.textContent = `Giliran ${turn} 👉`; }
  else tb.style.display = 'none';
  $('q').textContent = mode === 'susah' ? 'Foto ini tanggal berapa?' : 'Foto ini bulan apa?';
  $('cap').textContent = '';
  $('fb').innerHTML = '';
  $('next').classList.remove('on');
  // foto
  const img = $('img'), ph = $('ph');
  img.classList.remove('ok'); ph.querySelector('.spin').style.display = '';
  img.onload = () => { img.classList.add('ok'); ph.querySelector('.spin').style.display = 'none'; };
  img.onerror = () => { if (!img.dataset.alt) { img.dataset.alt = 1; img.src = thumbAlt(r.photo, 800); } else { ph.querySelector('.spin').textContent = '🖼️'; } };
  delete img.dataset.alt;
  img.src = thumb(r.photo, 800);
  const p = $('polaroid'); p.classList.remove('flip'); void p.offsetWidth; p.classList.add('flip');
  // preload foto berikutnya
  if (rounds[ri + 1]) { const n = new Image(); n.src = thumb(rounds[ri + 1].photo, 800); }
  $('opts').innerHTML = r.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b));
}
function pick(btn) {
  if (answered) return;
  answered = true;
  const r = rounds[ri], ok = btn.textContent === r.right;
  const who = players === 'duo' ? turn : 'solo';
  const pts = ok ? 10 : 0;
  score[who] += pts;
  history.push({ photo: r.photo, ok, who });
  $('opts').querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === r.right) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('cap').textContent = r.album.name;
  try { navigator.vibrate && navigator.vibrate(ok ? 15 : [30, 40, 30]); } catch (e) {}
  const nice = ['Inget banget! 🥹', 'Bener! 💞', 'Tajem ingetannya ✨', 'Mantap! 🎯'];
  const oops = ['Yahh, meleset dikit 😆', 'Hampir! 🙈', 'Ehh kok lupa 😤', 'Bukan yang itu 😅'];
  $('fb').innerHTML = ok ? `<b>${nice[Math.floor(Math.random() * nice.length)]}</b> +10 poin` : `<b>${oops[Math.floor(Math.random() * oops.length)]}</b><br>Yang bener: ${r.right}`;
  renderScores();
  $('next').textContent = ri === ROUNDS - 1 ? 'Liat hasil 🏁' : players === 'duo' ? `Lanjut — giliran ${turn === 'Dara' ? 'Razan' : 'Dara'} →` : 'Lanjut →';
  $('next').classList.add('on');
  setTimeout(() => $('next').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
}
function nextRound() {
  if (!answered) return;
  if (players === 'duo') turn = turn === 'Dara' ? 'Razan' : 'Dara';
  ri++;
  if (ri >= ROUNDS) return finish();
  renderRound();
}
function finish() {
  $('prog').style.width = '100%';
  const best = lsGet('tk-best', {});
  let title, sub, ico;
  if (players === 'duo') {
    const d = score.Dara, r = score.Razan;
    ico = d === r ? '🤝' : '🏆';
    title = d === r ? 'Seri! Sama-sama inget 🥹' : `${d > r ? 'Dara' : 'Razan'} paling inget!`;
    sub = d === r ? 'Kenangan kita emang nempel di kepala kalian berdua' : `${d > r ? 'Dara' : 'Razan'} menang ${Math.max(d, r)} lawan ${Math.min(d, r)}`;
    $('r-score').innerHTML = ['Dara', 'Razan'].map(k => `<div class="r-box ${k}${score[k] > score[k === 'Dara' ? 'Razan' : 'Dara'] ? ' win' : ''}"><b>${score[k]}</b><small>${k === 'Dara' ? '🙋‍♀️' : '🙋‍♂️'} ${k}</small></div>`).join('');
  } else {
    const s = score.solo, n = s / 10;
    const rec = best[mode] == null || s > best[mode];
    if (rec) { best[mode] = s; lsSet('tk-best', best); }
    ico = n >= 9 ? '🏆' : n >= 6 ? '🥰' : n >= 3 ? '🙂' : '🙈';
    title = n >= 9 ? 'Ingetannya juara!' : n >= 6 ? 'Lumayan banget!' : n >= 3 ? 'Masih inget dikit-dikit 😆' : 'Waduh, lupa semua 😭';
    sub = `${n} dari ${ROUNDS} bener${rec ? ' · 🎉 rekor baru!' : ` · rekor ${best[mode]}`}`;
    $('r-score').innerHTML = `<div class="r-box solo win"><b>${s}</b><small>⭐ poin</small></div>`;
  }
  $('r-ico').textContent = ico; $('r-title').textContent = title; $('r-sub').textContent = sub;
  $('recap').innerHTML = history.map(h => `<div><img loading="lazy" src="${thumb(h.photo, 200)}" onerror="if(!this.dataset.a){this.dataset.a=1;this.src='${thumbAlt(h.photo, 200)}'}" alt=""><span>${h.ok ? '✅' : '❌'}</span></div>`).join('');
  show('s-end');
  if (players === 'solo' ? score.solo >= 70 : true) confetti();
}
function quit() { if (confirm('Udahan mainnya? Skor ronde ini ga disimpen.')) { show('s-menu'); renderMenu(); } }
function confetti() {
  const colors = ['#c17a6f', '#e8c4b0', '#c9a96e', '#b5c4b1', '#7eb3f5'];
  for (let i = 0; i < 60; i++) setTimeout(() => {
    const el = document.createElement('div'); el.className = 'cp';
    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 4200);
  }, i * 22);
}
document.addEventListener('keydown', e => {
  if (!$('s-game').classList.contains('on')) return;
  if (!answered && ['1', '2', '3', '4'].includes(e.key)) { const b = $('opts').children[+e.key - 1]; if (b) pick(b); }
  else if (answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextRound(); }
});

renderMenu();
refreshFromServer();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
