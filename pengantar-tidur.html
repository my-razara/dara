<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Pengantar Tidur — dari Razan 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  html,body{background:#12142a}
  body{color:#e7e6f7}
  body::before{background:radial-gradient(ellipse 70% 45% at 50% 20%,rgba(120,110,200,.25),transparent 70%)}
  .pill{color:#cfcde8;background:rgba(255,255,255,.08);border-color:rgba(210,205,255,.2)}
  .title span{color:#f3e2b5}
  .sub{color:#a9a6cb}
  .moon{width:120px;height:120px;margin:.6rem auto 1rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#efdca8 60%,#d9be7a);box-shadow:0 0 60px rgba(255,236,180,.35);position:relative;animation:breath 6s ease-in-out infinite}
  .moon.on{box-shadow:0 0 90px rgba(255,236,180,.55)}
  @keyframes breath{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}
  .moon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 30%,rgba(0,0,0,.06) 0 10%,transparent 11%),radial-gradient(circle at 40% 70%,rgba(0,0,0,.05) 0 7%,transparent 8%)}
  .snd{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
  .snd button{padding:.8rem .2rem .7rem;border-radius:16px;border:1.5px solid rgba(210,205,255,.2);background:rgba(255,255,255,.05);color:#d8d6f0;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:.2rem}
  .snd button span{font-size:1.5rem}
  .snd button.on{background:rgba(243,226,181,.16);border-color:#f3e2b5;color:#fff;font-weight:600}
  .card{background:rgba(255,255,255,.05);border-color:rgba(210,205,255,.16);box-shadow:none}
  .lab{color:#e3dcff}
  .chips button{background:transparent;border-color:rgba(210,205,255,.25);color:#cfcde8}
  .chips button.on{background:#f3e2b5;border-color:#f3e2b5;color:#20223f}
  input[type=range]{width:100%;accent-color:#f3e2b5}
  .play{width:76px;height:76px;margin:1rem auto .4rem;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:linear-gradient(135deg,#f3e2b5,#d6b77c);color:#20223f;font-size:1.8rem;cursor:pointer;box-shadow:0 8px 24px rgba(214,183,124,.35)}
  .left{text-align:center;font-size:12.5px;color:#cfcde8;min-height:1.4em}
  .note{font-family:'Caveat',cursive;font-size:1.5rem;line-height:1.3;color:#f3e2b5;text-align:center;margin:1rem 0 .4rem;min-height:2.6em;transition:opacity .8s}
  .btn{background:linear-gradient(135deg,#f3e2b5,#d6b77c);color:#20223f;box-shadow:none}
  .btn.ghost{background:transparent;color:#f3e2b5;border-color:rgba(243,226,181,.35)}
  .dim{position:fixed;inset:0;z-index:50;background:#05060f;display:none;flex-direction:column;align-items:center;justify-content:center;color:#6d6a92;font-size:12px;text-align:center;padding:2rem}
  .dim.show{display:flex}
  .dim .m{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b6650,#3d3a2e);margin-bottom:1rem;animation:breath 6s ease-in-out infinite}

</style>
<script src="sfx.js" defer></script>

<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" onclick="dim()">🌑 Gelapin layar</button></div>
  <div class="head" style="margin-bottom:.2rem"><p class="lbl">Pengantar Tidur</p><h1 class="title">Bobo <span>yang nyenyak</span> 🌙</h1><p class="sub">Pilih suara, atur timer, terus taruh HP-nya. Suaranya pelan-pelan ilang sendiri.</p></div>
  <div class="moon" id="moon"></div>
  <div class="snd" id="snd"></div>
  <button class="play" id="play" onclick="toggle()" aria-label="Putar">▶</button>
  <p class="left" id="left"></p>
  <p class="note" id="note"></p>
  <div class="card">
    <label class="lab">⏲️ Matiin otomatis</label><div class="chips" id="timer"></div>
    <label class="lab" for="vol">🔉 Volume</label><input type="range" id="vol" min="0" max="1" step=".01">
  </div>
  <a class="btn ghost" id="wa" target="_blank" rel="noopener">💬 Bilang “aku tidur dulu ya” ke Razan</a>
</div>
<div class="dim" id="dim" onclick="this.classList.remove('show')"><div class="m"></div>Tap di mana aja buat balik<br><span id="dim-left"></span></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const SOUNDS = { hujan: ['🌧️', 'Hujan'], ombak: ['🌊', 'Ombak'], kipas: ['🌀', 'Kipas'], api: ['🔥', 'Api unggun'], jangkrik: ['🦗', 'Malam desa'], hati: ['💓', 'Detak jantung'] };
const TIMERS = [[15, '15 mnt'], [30, '30 mnt'], [60, '1 jam'], [0, 'Terus']];
const NOTES = ['Tidur yang nyenyak ya, sayang. Besok aku masih sayang kamu, kayak hari ini.', 'Lepasin capeknya hari ini. Kamu udah hebat banget.', 'Kalau mimpiin aku, tolong mimpinya yang lucu ya 😆', 'Peluk dari jauh. Selimutnya ditarik, matanya dipejamin.', 'Ga usah mikirin besok dulu. Sekarang waktunya istirahat.', 'Aku di sini. Selalu. Tidur ya 🤍', 'Napas pelan-pelan… tarik… buang… kamu aman.'];
let st = Object.assign({ s: 'hujan', t: 30, v: .6 }, lsGet('tidur-set', {}));
let ac = null, master = null, nodes = [], playing = false, endAt = 0, tick = 0, noteI = 0;
function paint() {
  $('snd').innerHTML = Object.entries(SOUNDS).map(([k, [e, n]]) => `<button data-k="${k}" class="${k === st.s ? 'on' : ''}"><span>${e}</span>${n}</button>`).join('');
  $('snd').querySelectorAll('button').forEach(b => b.onclick = () => { st.s = b.dataset.k; save(); paint(); if (playing) { stopNodes(); startNodes(); } });
  $('timer').innerHTML = TIMERS.map(([m, n]) => `<button data-m="${m}" class="${m === st.t ? 'on' : ''}">${n}</button>`).join('');
  $('timer').querySelectorAll('button').forEach(b => b.onclick = () => { st.t = +b.dataset.m; save(); paint(); if (playing) endAt = st.t ? Date.now() + st.t * 6e4 : 0; });
  $('vol').value = st.v; $('play').textContent = playing ? '❚❚' : '▶'; $('moon').classList.toggle('on', playing);
  $('wa').href = waLink('Razan', '🌙 Aku tidur dulu ya. Selamat malam, sayang 🤍');
}
function save() { lsSet('tidur-set', st); }
$('vol').addEventListener('input', () => { st.v = +$('vol').value; save(); if (master) master.gain.setTargetAtTime(st.v, ac.currentTime, .1); });
function noiseBuf(type, sec = 4) {
  const len = ac.sampleRate * sec, b = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1;
      if (type === 'brown') { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
      else if (type === 'pink') { b0 = .99765 * b0 + w * .099; b1 = .963 * b1 + w * .2965; b2 = .57 * b2 + w * 1.0526; d[i] = (b0 + b1 + b2 + w * .1848) * .11; }
      else d[i] = w * .5; } }
  return b;
}
function src(buf) { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); nodes.push(s); return s; }
function filt(type, f, q = .7) { const x = ac.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
function gain(v) { const g = ac.createGain(); g.gain.value = v; return g; }
function lfo(target, rate, depth, base) { const o = ac.createOscillator(), g = gain(depth); o.frequency.value = rate; o.connect(g); g.connect(target); target.value = base; o.start(); nodes.push(o); }
let timers = [];
function startNodes() {
  const s = st.s;
  if (s === 'hujan') { const n = src(noiseBuf('pink')); const f = filt('lowpass', 2600); const g = gain(.9); n.connect(f); f.connect(g); g.connect(master); const h = src(noiseBuf('white', 2)); const hf = filt('highpass', 5000); const hg = gain(.06); h.connect(hf); hf.connect(hg); hg.connect(master); }
  if (s === 'ombak') { const n = src(noiseBuf('pink')); const f = filt('lowpass', 900); const g = gain(.5); n.connect(f); f.connect(g); g.connect(master); lfo(g.gain, .09, .45, .55); lfo(f.frequency, .09, 500, 900); }
  if (s === 'kipas') { const n = src(noiseBuf('brown')); const f = filt('lowpass', 500); const g = gain(.9); n.connect(f); f.connect(g); g.connect(master); const o = ac.createOscillator(); o.frequency.value = 58; const og = gain(.02); o.connect(og); og.connect(master); o.start(); nodes.push(o); }
  if (s === 'api') { const n = src(noiseBuf('brown')); const f = filt('lowpass', 700); const g = gain(.7); n.connect(f); f.connect(g); g.connect(master); const crack = () => { if (!playing || st.s !== 'api') return; const b = ac.createBuffer(1, ac.sampleRate * .03, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); const x = ac.createBufferSource(); x.buffer = b; const cg = gain(.15 + Math.random() * .35); const hp = filt('highpass', 1500); x.connect(hp); hp.connect(cg); cg.connect(master); x.start(); timers.push(setTimeout(crack, 80 + Math.random() * 600)); }; crack(); }
  if (s === 'jangkrik') { const n = src(noiseBuf('pink')); const f = filt('lowpass', 600); const g = gain(.25); n.connect(f); f.connect(g); g.connect(master); const chirp = () => { if (!playing || st.s !== 'jangkrik') return; const t = ac.currentTime; for (let k = 0; k < 3; k++) { const o = ac.createOscillator(), og = gain(0); o.frequency.value = 4400 + Math.random() * 300; o.connect(og); og.connect(master); const tt = t + k * .07; og.gain.setValueAtTime(0, tt); og.gain.linearRampToValueAtTime(.04, tt + .01); og.gain.linearRampToValueAtTime(0, tt + .05); o.start(tt); o.stop(tt + .06); } timers.push(setTimeout(chirp, 600 + Math.random() * 900)); }; chirp(); }
  if (s === 'hati') { const n = src(noiseBuf('brown')); const f = filt('lowpass', 300); const g = gain(.15); n.connect(f); f.connect(g); g.connect(master); const beat = () => { if (!playing || st.s !== 'hati') return; const t = ac.currentTime; [0, .28].forEach((d, k) => { const o = ac.createOscillator(), og = gain(0); o.frequency.value = 55; o.connect(og); og.connect(master); og.gain.setValueAtTime(0, t + d); og.gain.linearRampToValueAtTime(k ? .5 : .8, t + d + .02); og.gain.exponentialRampToValueAtTime(.001, t + d + .2); o.start(t + d); o.stop(t + d + .25); }); timers.push(setTimeout(beat, 1000)); }; beat(); }
}
function stopNodes() { nodes.forEach(n => { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }); nodes = []; timers.forEach(clearTimeout); timers = []; }
function toggle() {
  if (playing) { stop(); return; }
  try { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); } ac.resume(); } catch (e) { toast('HP ini belum bisa muter suara 😢'); return; }
  playing = true; master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(0, ac.currentTime); master.gain.linearRampToValueAtTime(st.v, ac.currentTime + 2);
  startNodes(); endAt = st.t ? Date.now() + st.t * 6e4 : 0; paint(); showNote(); loop(); vib(10);
  lsSet('tidur-n', lsGet('tidur-n', 0) + 1);
}
function stop(fade) {
  if (!playing) return; playing = false; clearTimeout(tick);
  const t = fade ? 8 : .6; master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + t);
  setTimeout(stopNodes, t * 1000 + 100); paint(); $('left').textContent = fade ? 'Selamat tidur 🌙' : '';
}
function loop() {
  if (!playing) return;
  if (endAt) { const ms = endAt - Date.now(); if (ms <= 0) { stop(true); return; } const m = Math.floor(ms / 6e4), s = Math.floor(ms % 6e4 / 1e3); $('left').textContent = `Mati otomatis ${m}:${pad(s)} lagi`; $('dim-left').textContent = $('left').textContent; }
  else $('left').textContent = 'Muter terus sampai kamu matiin';
  tick = setTimeout(loop, 1000);
}
function showNote() { const n = $('note'); n.style.opacity = 0; setTimeout(() => { n.textContent = NOTES[noteI++ % NOTES.length]; n.style.opacity = 1; }, 400); if (playing) setTimeout(() => playing && showNote(), 20000); }
function dim() { $('dim').classList.add('show'); }
noteI = Math.floor(Math.random() * NOTES.length); $('note').textContent = NOTES[noteI];
paint();

</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
