<style>

</style>

<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span class="pill" id="me-pill"></span></div>
  <div class="head" style="margin:.6rem 0 .7rem"><span class="ico">🎤</span><p class="lbl">Hmm-hmm-hmm 🎶</p><h1 class="title">Tebak <span>Senandung</span></h1><p class="sub">Senandungin (hum) satu lagu tanpa lirik, pasangan nebak judulnya. Makin cepet ketebak, makin gede poinnya!</p></div>

</div>

<div class="ov center" id="r-ov"><div class="sheet rec">

  </div>
  <button class="btn ghost" style="margin-top:.6rem" id="r-x">Batal</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), status: () => '', on() {}, enabled: false };
const SRV = BD.url || 'https://script.google.com/macros/s/AKfycbyCq294yq71M-BDzouyLttp2Kki0aumPAP0JzII0fvvnBakSQ5_eHkNTawXA01fQ3dC/exec', SKEY = BD.key || 'razara-berdua';
const ME = (window.Who && Who.me()) || BD.me(), OT = otherOf(ME), WHO = ['Razan', 'Dara'];
$('me-pill').textContent = `🙋 ${ME}`; $('me-pill').className = 'pill ' + ME;
const COL = { Razan: 'var(--rz)', Dara: 'var(--dr)' }, D0 = '2000-01-01', TRIES = 3;
const notify = o => { try { window.Push && Push.notify(o); } catch (e) {} };
function post(body, ms) { return new Promise((res, rej) => { const x = new XMLHttpRequest(); x.open('POST', SRV, true); x.timeout = ms || 60000; x.setRequestHeader('Content-Type', 'text/plain'); x.onload = () => { try { res(JSON.parse(x.responseText)); } catch (e) { rej(e); } }; x.onerror = x.ontimeout = () => rej(new Error('jaringan')); x.send(JSON.stringify(Object.assign({ key: SKEY, who: ME }, body))); }); }
const fmtS = d => { d = Math.max(0, Math.round(d || 0)); return Math.floor(d / 60) + ':' + pad(d % 60); };
const hm = t => { const d = new Date(t); return `${HARI[d.getDay()].slice(0, 3)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const pzs = w => ((((lsGet('senandung-' + w, {}) || {})[D0]) || {}).list) || [];
const ansRow = w => ((((lsGet('senandungj-' + w, {}) || {})[D0]) || {}).r) || {};
// ── cocokin jawaban (ga harus persis) ──
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/\b(feat|ft)\b.*$/, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) { const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
function match(g, a) { g = norm(g); a = norm(a); if (!g || !a) return false; if (g === a) return true; if (a.length >= 4 && g.includes(a)) return true; if (g.length >= Math.max(4, a.length * .6) && a.includes(g)) return true; return 1 - lev(g, a) / Math.max(g.length, a.length) >= .78; }
// ── putar ──
const AU = new Audio(); let auId = null, auUrl = null; const auCache = {};
function auPaint() { document.querySelectorAll('.pl[data-p]').forEach(el => { const on = el.dataset.p === auId, b = el.querySelector('button'), i = el.querySelector('.bar i'); b.textContent = on && auId && AU.__load ? '…' : on && !AU.paused ? '❚❚' : '▶'; i.style.width = on && AU.duration && isFinite(AU.duration) ? Math.min(100, AU.currentTime / AU.duration * 100) + '%' : '0%'; }); }
['timeupdate', 'play', 'pause', 'ended'].forEach(ev => AU.addEventListener(ev, auPaint));
async function play(p) {
  if (auId === p.id && AU.src && !AU.__load) { if (AU.paused) AU.play().catch(() => {}); else AU.pause(); return; }
  AU.pause(); auId = p.id; AU.__load = 1; auPaint();
  try {
    let d = auCache[p.vn]; if (!d) { const r = await post({ action: 'chat', op: 'vnget', id: p.vn }, 60000); if (!r || !r.ok || !r.data) throw new Error('x'); d = auCache[p.vn] = 'data:' + (r.mime || 'audio/webm') + ';base64,' + r.data; }
    if (auId !== p.id) return; const bl = await (await fetch(d)).blob(); if (auUrl) URL.revokeObjectURL(auUrl); auUrl = URL.createObjectURL(bl); AU.src = auUrl; AU.__load = 0; await AU.play().catch(() => {});
  } catch (e) { AU.__load = 0; auId = null; toast(navigator.onLine === false ? 'Lagi offline 📴' : 'Senandungnya gagal diputer 😢 coba lagi'); }
  auPaint();
}
// ── tampilan ──
const resOf = (guesser, p) => ansRow(guesser)[p.id] || null;
const solved = r => r && (r.ok || r.gu || (r.g || []).length >= TRIES);
function score(w) { const R = ansRow(w); let pts = 0, ok = 0; Object.values(R).forEach(r => { if (r && r.ok) { ok++; pts += r.pts || 0; } }); return { pts, ok }; }
function plH(p) { return `<div class="pl" data-p="${p.id}"><button data-play="${p.id}" data-w="${p.w}">▶</button><span class="bar"><i></i></span><small>${fmtS(p.dur)}</small></div>`; }
function render() {
  $('sc').innerHTML = WHO.map(w => { const s = score(w); return `<div style="--c:${COL[w]}"><b>${s.pts}</b><small>poin ${w === ME ? 'kamu' : w} · ${s.ok} ketebak</small></div>`; }).join('');
  const forMe = pzs(OT).map(p => Object.assign({ w: OT }, p)).filter(p => !solved(resOf(ME, p))).sort((a, b) => b.at - a.at);
  $('forme').innerHTML = forMe.length ? `<p class="sec">🎶 Tebakan buat kamu</p>` + forMe.map(p => { const r = resOf(ME, p) || { g: [] }, left = TRIES - (r.g || []).length;
    return `<div class="pz" style="--c:${COL[OT]}"><div class="h"><b>🎤 dari ${OT}</b><span>${hm(p.at)}</span></div>${plH(p)}
      <div class="gs" data-gs="${p.id}"><input class="inp" placeholder="Judul lagunya apa?" maxlength="60" data-in="${p.id}"><button data-guess="${p.id}">Tebak</button></div>
      ${r.h ? `<div class="hint">💡 ${p.a ? `Penyanyinya: <b>${esc(p.a)}</b>` : `Huruf depannya: <b>${esc(String(p.t).trim()[0] || '?').toUpperCase()}</b> · ${String(p.t).trim().split(/\s+/).length} kata`}</div>` : ''}
      <div class="ex">${r.h ? '' : `<button data-hint="${p.id}">💡 Petunjuk (−1)</button>`}<button data-give="${p.id}">🏳️ Nyerah</button><small>sisa ${left}× nebak${(r.g || []).length ? ` · tadi: ${esc(r.g[r.g.length - 1])}` : ''}</small></div></div>`; }).join('') : '';
  const mine = pzs(ME).map(p => Object.assign({ w: ME }, p)).sort((a, b) => b.at - a.at);
  const waiting = mine.filter(p => !solved(resOf(OT, p)));
  $('mine').innerHTML = waiting.length ? `<p class="sec">⏳ Senandungmu, nunggu ditebak</p>` + waiting.map(p => { const r = resOf(OT, p); return `<div class="pz" style="--c:${COL[ME]}"><div class="h"><b>“${esc(p.t)}”</b><span>${hm(p.at)}</span></div>${plH(p)}<div class="ex"><span class="tag wt">${r && (r.g || []).length ? `${OT} udah nebak ${(r.g || []).length}× 🤭` : `${OT} belum nebak`}</span></div></div>`; }).join('') : '';
  const H = WHO.flatMap(w => pzs(w).map(p => Object.assign({ w }, p))).filter(p => solved(resOf(otherOf(p.w), p))).sort((a, b) => (resOf(otherOf(b.w), b).at || 0) - (resOf(otherOf(a.w), a).at || 0)).slice(0, 15);
  $('hist').innerHTML = H.length ? `<p class="sec">🕰️ Udah ketebak</p>` + H.map(p => { const g = otherOf(p.w), r = resOf(g, p); return `<div class="pz" style="--c:${COL[p.w]}"><div class="h"><b>${p.w === ME ? 'Senandungmu' : `Dari ${p.w}`}</b><span>${hm(p.at)}</span></div>${plH(p)}<div class="ans">🎵 <b>${esc(p.t)}</b>${p.a ? ` — ${esc(p.a)}` : ''}</div><div class="ex">${r.ok ? `<span class="tag ok">✅ ${g === ME ? 'Kamu' : g} bener · +${r.pts} poin</span>` : `<span class="tag no">${r.gu ? '🏳️' : '❌'} ${g === ME ? 'Kamu' : g} ${r.gu ? 'nyerah' : 'ga ketebak'}</span>`}${(r.g || []).length ? `<small>tebakan: ${(r.g || []).map(esc).join(', ')}</small>` : ''}</div></div>`; }).join('') : (forMe.length || waiting.length ? '' : '<p class="empty">Belum ada senandung — rekam yang pertama yuk 🎤</p>');
  auPaint();
  try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {}
}
// ── nebak ──
function saveAns(pid, f) { const R = Object.assign({}, ansRow(ME)), cur = Object.assign({ g: [], h: 0, ok: 0, gu: 0, pts: 0 }, R[pid] || {}); f(cur); cur.at = Date.now(); R[pid] = cur; const ks = Object.keys(R).sort((a, b) => (R[b].at || 0) - (R[a].at || 0)).slice(0, 80), out = {}; ks.forEach(k => out[k] = R[k]); BD.put('senandungj', ME, D0, { r: out }); return cur; }
function guess(pid) {
  const p = pzs(OT).find(x => x.id === pid), inp = document.querySelector(`[data-in="${pid}"]`); if (!p || !inp) return;
  const g = inp.value.trim(); if (!g) { inp.focus(); return; }
  const ok = match(g, p.t);
  const r = saveAns(pid, c => { c.g = (c.g || []).concat(g.slice(0, 60)); if (ok) { c.ok = 1; c.pts = Math.max(1, 3 - (c.g.length - 1) - (c.h ? 1 : 0)); } });
  if (ok) {
    confetti(60); vib([30, 40, 30]); toast(`🎉 Bener! “${p.t}” · +${r.pts} poin`, 3200);
    try { window.Skor && Skor.add('tebak-senandung', ME); } catch (e) {}
    notify({ title: `✅ ${ME} bener nebak senandungmu!`, body: `“${p.t}” · +${r.pts} poin 🎶`, url: 'tebak-senandung.html', tag: 'ajak-senandung-j' });
  } else if (r.g.length >= TRIES) {
    vib(60); toast(`😢 Kesempatan abis — jawabannya “${p.t}”`, 3600);
    notify({ title: `😅 ${ME} ga ketebak senandungmu`, body: `Jawabannya “${p.t}” — tebakan dia: ${r.g.join(', ')}`.slice(0, 170), url: 'tebak-senandung.html', tag: 'ajak-senandung-j' });
  } else { const el = document.querySelector(`[data-gs="${pid}"]`); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } vib([20, 30, 20]); toast(`Belum bener 🤭 sisa ${TRIES - r.g.length}× lagi`); }
  render();
}
document.addEventListener('click', e => {
  const pb = e.target.closest('[data-play]'); if (pb) { const p = pzs(pb.dataset.w).find(x => x.id === pb.dataset.play); if (p) play(p); return; }
  const gb = e.target.closest('[data-guess]'); if (gb) { guess(gb.dataset.guess); return; }
  const hb = e.target.closest('[data-hint]'); if (hb) { saveAns(hb.dataset.hint, c => { c.h = 1; }); vib(8); render(); return; }
  const gv = e.target.closest('[data-give]'); if (gv) { const p = pzs(OT).find(x => x.id === gv.dataset.give); if (!p || !confirm('Nyerah? Jawabannya bakal dikasih tau 😆')) return; saveAns(p.id, c => { c.gu = 1; }); toast(`🏳️ Jawabannya: “${p.t}”`, 3600); notify({ title: `🏳️ ${ME} nyerah nebak senandungmu`, body: `Ternyata “${p.t}” susah ditebak 😆`, url: 'tebak-senandung.html', tag: 'ajak-senandung-j' }); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-in]')) { e.preventDefault(); guess(e.target.dataset.in); } });
// ── rekam ──
const RC = { mr: null, ch: [], t0: 0, tick: 0, st: null, blob: null, dur: 0, mime: '' };
const PA = new Audio(); let pUrl = null;
function recMime() { if (!window.MediaRecorder) return null; for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/aac']) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} } return ''; }
function openRec() { RC.blob = null; $('r-a').style.display = ''; $('r-b').style.display = 'none'; $('rt').textContent = '0:00'; $('mic').classList.remove('on'); $('mic').textContent = '🎤'; $('r-tip').textContent = 'Tap buat mulai rekam'; $('r-t').value = ''; $('r-ar').value = ''; $('r-ov').classList.add('show'); }
async function recStart() {
  const mt = recMime(); if (mt === null || !navigator.mediaDevices) return toast('HP ini belum bisa rekam suara di sini 😢');
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false } }); } catch (e) { return toast('Izinin mikrofon dulu ya 🎤'); }
  RC.st = st; RC.ch = [];
  try { RC.mr = mt ? new MediaRecorder(st, { mimeType: mt, audioBitsPerSecond: 40000 }) : new MediaRecorder(st); } catch (e) { RC.mr = new MediaRecorder(st); }
  RC.mr.ondataavailable = ev => { if (ev.data && ev.data.size) RC.ch.push(ev.data); };
  RC.mr.onstop = recDone; RC.mr.start(250); RC.t0 = Date.now();
  $('mic').classList.add('on'); $('mic').textContent = '⏹'; $('r-tip').textContent = 'Lagi rekam… tap ⏹ kalau udah'; vib(20);
  RC.tick = setInterval(() => { const s2 = (Date.now() - RC.t0) / 1000; $('rt').textContent = fmtS(s2); if (s2 >= 20) recStop(); }, 200);
}
function recStop() { if (!RC.mr) return; try { RC.mr.stop(); } catch (e) { recDone(); } }
function recKill() { clearInterval(RC.tick); try { RC.st && RC.st.getTracks().forEach(t => t.stop()); } catch (e) {} }
function recDone() {
  const dur = (Date.now() - RC.t0) / 1000, mime = (RC.mr && RC.mr.mimeType || 'audio/webm').split(';')[0];
  recKill(); const ch = RC.ch; RC.mr = null; $('mic').classList.remove('on'); $('mic').textContent = '🎤';
  if (!$('r-ov').classList.contains('show')) return;
  if (dur < 2 || !ch.length) { $('r-tip').textContent = 'Kependekan — minimal 2 detik ya 🎤'; return; }
  RC.blob = new Blob(ch, { type: mime }); RC.dur = Math.round(dur); RC.mime = mime;
  if (pUrl) URL.revokeObjectURL(pUrl); pUrl = URL.createObjectURL(RC.blob); PA.src = pUrl;
  $('pv-d').textContent = fmtS(RC.dur); $('pv-i').style.width = '0%'; $('pv-b').textContent = '▶';
  $('r-a').style.display = 'none'; $('r-b').style.display = ''; setTimeout(() => { try { $('r-t').focus(); } catch (e) {} }, 200);
}
['timeupdate', 'play', 'pause', 'ended'].forEach(ev => PA.addEventListener(ev, () => { $('pv-b').textContent = PA.paused ? '▶' : '❚❚'; $('pv-i').style.width = PA.duration && isFinite(PA.duration) ? Math.min(100, PA.currentTime / PA.duration * 100) + '%' : '0%'; }));
$('pv-b').onclick = () => { if (PA.paused) PA.play().catch(() => {}); else PA.pause(); };
$('mic').onclick = () => { if (RC.mr) recStop(); else recStart(); };
$('new').onclick = openRec;
$('r-re').onclick = () => { PA.pause(); openRec(); };
$('r-x').onclick = () => { PA.pause(); $('r-ov').classList.remove('show'); if (RC.mr) { try { RC.mr.onstop = null; RC.mr.stop(); } catch (e) {} RC.mr = null; recKill(); } };
$('r-go').onclick = async () => {
  const t = $('r-t').value.trim(); if (!t) { $('r-t').focus(); return toast('Tulis judul lagunya dulu (rahasia kok 🤫)'); }
  if (!RC.blob) return; const b = $('r-go'); if (b.disabled) return; b.disabled = true; b.textContent = 'Lagi ngirim…'; PA.pause();
  try {
    const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(RC.blob); });
    const r = await post({ action: 'chat', op: 'vn', data: String(data).split(',')[1], mime: RC.mime || 'audio/webm' }, 120000);
    if (!r || !r.ok || !r.vn) throw new Error('gagal');
    const L = pzs(ME).slice(); L.push({ id: 'h' + Date.now().toString(36), vn: r.vn, dur: RC.dur, t: t.slice(0, 60), a: $('r-ar').value.trim().slice(0, 40), at: Date.now() });
    BD.put('senandung', ME, D0, { list: L.slice(-40) });
    $('r-ov').classList.remove('show'); vib([20, 30, 20]); toast(`🎤 Kekirim! ${OT} tinggal nebak`, 3000);
    notify({ title: `🎤 ${ME} nyenandungin lagu buat kamu`, body: 'Dengerin terus tebak judulnya — makin cepet makin gede poinnya 🎶', url: 'tebak-senandung.html', tag: 'ajak-senandung' });
    render();
  } catch (e) { toast(navigator.onLine === false ? 'Lagi offline 📴 — coba lagi pas ada sinyal' : 'Gagal ngirim 😢 coba lagi', 3200); }
  b.disabled = false; b.textContent = '📤 Kirim';
};
BD.on(ev => { if (!ev.apps || !ev.apps.length || ev.apps.includes('senandung') || ev.apps.includes('senandungj')) { if (!document.activeElement || !document.activeElement.matches('[data-in]')) render(); } });
render();

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
