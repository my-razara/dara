<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Polaroid Wall — Razan & Dara 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --warm: #f5ede0;
    --blush: #e8c4b0;
    --rose: #c17a6f;
    --deep: #7a3f35;
    --ink: #2d1f1a;
    --gold: #c9a96e;
    --muted: #9a8070;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  .back-link {
    position: absolute; top: calc(.9rem + env(safe-area-inset-top)); left: 1rem; z-index: 5;
    font-size: 12px; color: rgba(255,255,255,.7); text-decoration: none;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    padding: .4rem .85rem; border-radius: 50px; backdrop-filter: blur(6px);
  }
  .back-link:active { background: rgba(255,255,255,.15); }

  body {
    background: #1a1008;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Wood wall texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 40px,
        rgba(255,255,255,.012) 40px,
        rgba(255,255,255,.012) 41px
      ),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 80px,
        rgba(0,0,0,.08) 80px,
        rgba(0,0,0,.08) 82px
      ),
      linear-gradient(160deg, #221408 0%, #1a1008 40%, #251508 100%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  .wall-header {
    text-align: center;
    padding: calc(3.4rem + env(safe-area-inset-top)) 1.25rem 1rem;
    position: relative; z-index: 1;
  }
  .wall-label {
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    color: rgba(201,169,110,.7); display: block; margin-bottom: .4rem;
  }
  .wall-title {
    font-size: clamp(1.3rem,5vw,1.8rem);
    font-weight: 700; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
  .wall-title span { color: var(--gold); }
  .wall-sub {
    font-size: 11px; color: rgba(255,255,255,.45);
    margin-top: .3rem;
  }
  .wall-tools { display: flex; justify-content: center; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }
  .wall-chip {
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: rgba(255,255,255,.75);
    border-radius: 50px; padding: .38rem .85rem; font-size: 11px; font-weight: 500; cursor: pointer;
  }
  .wall-chip:active { background: rgba(255,255,255,.14); }
  .wall-count { font-size: 11px; color: rgba(201,169,110,.8); }

  /* ── WALL GRID ── */
  .wall {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(.6rem, 2.5vw, 1.1rem);
    padding: 1rem clamp(.75rem, 3vw, 1.25rem) calc(4rem + env(safe-area-inset-bottom));
    row-gap: clamp(1rem, 4vw, 1.5rem);
    max-width: 520px; margin: 0 auto;
  }

  /* ── POLAROID ── */
  .polaroid-wrap {
    perspective: 900px;
    cursor: pointer;
    position: relative;          /* biar paku & tali nempel di polaroid masing-masing */
    border: none; background: none; padding: 0; display: block; width: 100%; text-align: inherit;
  }
  .polaroid-wrap.printing { animation: shake-print .9s cubic-bezier(.34,1.3,.64,1) both; }
  .polaroid-wrap.seen .pin { background: radial-gradient(circle at 35% 35%, #f3dfa8, var(--gold)); }

  .polaroid {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.4,0,.2,1);
    border-radius: 2px;
  }

  .polaroid.flipped { transform: rotateY(180deg); }

  /* Shake animation when first loaded */
  @keyframes shake-print {
    0%   { transform: translateY(-6px) scale(.95); opacity:.5; }
    30%  { transform: rotate(3deg) translateY(2px) scale(1.02); opacity:1; }
    55%  { transform: rotate(-2deg) translateY(-1px) scale(.99); }
    75%  { transform: rotate(1deg) scale(1.005); }
    90%  { transform: rotate(-.5deg); }
    100% { transform: none; }
  }

  /* Front & back */
  .pol-front, .pol-back {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 2px;
  }

  /* Make front position relative for sizing */
  .pol-front { position: relative; }

  .pol-back {
    transform: rotateY(180deg) rotate(var(--tilt));
    background: #faf6f0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(.5rem,2vw,.85rem);
    box-shadow: 0 6px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  }

  /* Polaroid photo frame */
  .pol-frame {
    background: #fff;
    padding: clamp(4px,1.5vw,7px) clamp(4px,1.5vw,7px) clamp(14px,5vw,22px);
    box-shadow: 0 6px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    transform: rotate(var(--tilt));
    transition: transform .25s ease, box-shadow .25s ease;
    position: relative;
  }

  .polaroid-wrap:active .pol-frame {
    transform: rotate(var(--tilt)) scale(.96);
  }

  .pol-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pol-photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.8rem,8vw,3rem);
    position: relative; overflow: hidden;
    border-radius: 1px;
  }

  /* Vintage photo overlay */
  .pol-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,240,200,.12) 0%, transparent 60%, rgba(180,120,80,.08) 100%);
    pointer-events: none;
  }

  .pol-caption {
    font-size: clamp(7px,2vw,9px);
    color: var(--muted); text-align: center;
    margin-top: clamp(3px,1vw,5px);
    font-weight: 500; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Push pin */
  .pin {
    position: absolute;
    top: -5px; left: 50%;
    transform: translateX(-50%);
    width: clamp(8px,2.5vw,12px); height: clamp(8px,2.5vw,12px);
    background: radial-gradient(circle at 35% 35%, #e8c4b0, var(--rose));
    border-radius: 50%;
    box-shadow: 0 2px 4px rgba(0,0,0,.35);
    z-index: 2;
  }
  .pin::after {
    content: '';
    position: absolute; bottom: -3px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 5px;
    background: rgba(0,0,0,.3);
    border-radius: 1px;
  }

  /* String from pin */
  .pol-string {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    width: 1px; height: clamp(10px,3.5vw,16px);
    background: linear-gradient(to bottom, rgba(255,255,255,.12), rgba(255,255,255,.05));
    z-index: 1;
  }

  /* Back content */
  .back-frame {
    background: #fff;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(.4rem,2vw,.75rem);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }

  .back-frame::before {
    content: '';
    position: absolute; inset: 4px;
    border: 1px solid rgba(193,122,111,.12);
    pointer-events: none;
  }

  .back-num {
    font-size: clamp(7px,1.8vw,9px); letter-spacing: .15em;
    text-transform: uppercase; color: var(--gold);
    display: block; margin-bottom: clamp(3px,1vw,6px);
  }
  .back-emoji { font-size: clamp(1rem,4vw,1.5rem); display: block; margin-bottom: clamp(3px,1vw,5px); }
  .back-story {
    font-size: clamp(8px,2.2vw,11px); color: var(--ink);
    line-height: 1.5; text-align: center;
    font-weight: 400; font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 400px) { .back-story { display: none; } .back-emoji { font-size: 1.4rem; } }
  .back-date {
    font-size: clamp(7px,1.8vw,9px); color: var(--muted);
    margin-top: clamp(4px,1.2vw,7px); display: block;
    letter-spacing: .05em;
  }

  /* ── MODAL (full story) ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(15,8,2,.75); backdrop-filter: blur(8px);
    align-items: flex-end; justify-content: center; padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
  }
  #modal-overlay.active { display: flex; }

  .modal-sheet {
    background: var(--cream);
    border-radius: 24px 24px 20px 20px;
    padding: 1.75rem 1.5rem 1.5rem;
    width: 100%; max-width: 440px;
    max-height: calc(100dvh - 2rem); overflow-y: auto;
    animation: slideup .4s cubic-bezier(.34,1.3,.64,1);
    position: relative; touch-action: pan-y;
  }
  .modal-photo { display: none; width: 100%; max-height: 42vh; object-fit: cover; border-radius: 4px; margin-bottom: 1rem; background: #fff; padding: 6px 6px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.18); transform: rotate(-1deg); }
  .modal-photo.show { display: block; }
  .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-top: .75rem; position: relative; z-index: 1; }
  .modal-nav button { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: .35rem .2rem; }
  .modal-nav span { font-size: 10px; color: var(--muted); }
  @keyframes slideup { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }

  .modal-sheet::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(ellipse at top, rgba(232,196,176,.18), transparent 60%);
    pointer-events: none;
  }

  .modal-drag { width: 36px; height: 4px; background: var(--blush); border-radius: 2px; margin: 0 auto 1.25rem; }
  .modal-emoji { font-size: 3rem; display: block; text-align: center; margin-bottom: .75rem; }
  .modal-num { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); display: block; text-align: center; margin-bottom: .35rem; }
  .modal-title { font-size: 1rem; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 1rem; }
  .modal-story {
    font-size: 14px; color: var(--ink); line-height: 1.85;
    font-weight: 300; margin-bottom: 1rem;
    position: relative; z-index: 1;
  }
  .modal-story em { color: var(--rose); font-style: normal; font-weight: 500; }
  .modal-date { font-size: 11px; color: var(--muted); font-style: italic; display: block; text-align: right; margin-bottom: 1.25rem; }
  .modal-close {
    width: 100%; padding: .85rem; border-radius: 50px; border: none; cursor: pointer;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
    background: var(--rose); color: #fff;
    box-shadow: 0 4px 14px rgba(193,122,111,.35);
    position: relative; z-index: 1;
  }
  .modal-close:active { background: var(--deep); }
  @media (max-width: 360px) { .modal-sheet { padding: 1.4rem 1.15rem 1.2rem; } .modal-story { font-size: 13.5px; } }
  @media (prefers-reduced-motion: reduce) { .polaroid-wrap.printing { animation: none; } .polaroid { transition: none; } }
</style>
</head>
<body>
<a href="index.html" class="back-link">← Menu utama</a>

<div class="wall-header">
  <span class="wall-label">Kenangan Kita</span>
  <h1 class="wall-title">Polaroid <span>Wall</span> 🤍</h1>
  <p class="wall-sub">Tap polaroid untuk lihat ceritanya</p>
  <div class="wall-tools">
    <span class="wall-count" id="wall-count">0/12 dilihat</span>
    <button class="wall-chip" id="flip-all" onclick="flipAll()">🔄 Balik semua</button>
    <button class="wall-chip" onclick="slideshow()">▶ Putar dari awal</button>
  </div>
</div>

<div class="wall" id="wall"></div>

<!-- Modal -->
<div id="modal-overlay" onclick="handleOverlay(event)">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <img class="modal-photo" id="m-photo" alt="">
    <span class="modal-emoji" id="m-emoji">📸</span>
    <span class="modal-num" id="m-num">Momen #1</span>
    <h3 class="modal-title" id="m-title">...</h3>
    <p class="modal-story" id="m-story">...</p>
    <span class="modal-date" id="m-date">...</span>
    <button class="modal-close" onclick="closeModal()">Tutup 🤍</button>
    <div class="modal-nav">
      <button id="m-prev" onclick="navModal(-1)">‹ Sebelumnya</button>
      <span id="m-pos"></span>
      <button id="m-next" onclick="navModal(1)">Berikutnya ›</button>
    </div>
  </div>
</div>

<script>
const MOMENTS = [
  {
    emoji: "🌿",
    bg: "linear-gradient(135deg,#c8d8b0,#a8c090)",
    caption: "Ragunan",
    num: 1,
    title: "Hari di Ragunan",
    story: "Kita jalan-jalan ke Ragunan dan ngeliat hewan-hewan bareng. Hal yang kelihatannya biasa aja — tapi ada sesuatu di hari itu yang bikin suasananya beda. Mungkin karena kamu ada di sana.",
    date: "Suatu hari yang bikin kenangan",
    tilt: "-3deg"
  },
  {
    emoji: "🏛️",
    bg: "linear-gradient(135deg,#d4c8a8,#bca888)",
    caption: "Museum",
    num: 2,
    title: "Museum Bareng",
    story: "Jalan ke museum bareng — tempat yang biasanya sepi jadi berasa lebih hidup waktu kamu ada. Banyak hal yang bisa dibahas, banyak yang bisa diliat, tapi yang paling diinget adalah ngobrolnya.",
    date: "Di antara banyak koleksi",
    tilt: "2deg"
  },
  {
    emoji: "🌆",
    bg: "linear-gradient(135deg,#c8b4a0,#a89080)",
    caption: "Kota Tua",
    num: 3,
    title: "Keliling Kota Tua",
    story: "Jakarta yang ramai terasa beda waktu kita jalan di Kota Tua. Gedung-gedung tua, jalanan yang penuh cerita, dan kamu di sana. Itu kombinasi yang susah dilupain.",
    date: "Di tengah Jakarta yang tua",
    tilt: "-2deg"
  },
  {
    emoji: "🏃",
    bg: "linear-gradient(135deg,#a8c0b0,#88a090)",
    caption: "Cijantung",
    num: 4,
    title: "Olahraga Bareng",
    story: "Olahraga bareng di Cijantung — hal yang butuh effort buat berdua. Dan kalau kita bisa lakuin itu bareng, itu artinya lebih dari sekedar jalan-jalan biasa.",
    date: "Pagi yang semangat",
    tilt: "3deg"
  },
  {
    emoji: "🌳",
    bg: "linear-gradient(135deg,#a8c898,#78a870)",
    caption: "Taman",
    num: 5,
    title: "Jalan-Jalan ke Taman",
    story: "Duduk di taman, angin sepoi-sepoi, suara daun, dan kamu di sebelah. Ga ada yang spesial dari tempatnya — tapi ada yang bikin betah lama-lama di sana. Mungkin karena yang nemenin.",
    date: "Di bawah pohon yang teduh",
    tilt: "-1deg"
  },
  {
    emoji: "🌙",
    bg: "linear-gradient(135deg,#2d2040,#1a1228)",
    caption: "Pesan Malam",
    num: 6,
    title: "Chat Tengah Malam",
    story: "Ada malam-malam dimana kita ngobrol sampai lupa waktu. Ga ada agenda, ga ada yang penting — cuma dua orang yang nyaman sama satu sama lain. Itu yang paling berasa.",
    date: "Waktu dunia lagi sepi",
    tilt: "2deg"
  },
  {
    emoji: "☕",
    bg: "linear-gradient(135deg,#c8a888,#a88868)",
    caption: "Kafe Bareng",
    num: 7,
    title: "Duduk di Kafe",
    story: "Duduk di kafe, pesan minuman, ngobrol tentang apapun. Kadang hal yang paling sederhana itu yang paling bikin rindu. Ini salah satunya.",
    date: "Di sudut kafe favorit",
    tilt: "-3deg"
  },
  {
    emoji: "🍜",
    bg: "linear-gradient(135deg,#d4a888,#b48868)",
    caption: "Makan Bareng",
    num: 8,
    title: "Makan di Tempat Favorit",
    story: "Jajan bareng — hal yang kayaknya kecil tapi selalu jadi bagian yang paling dinantiin dari ketemu. Entah itu makanan yang enak atau emang karena yang nemenin.",
    date: "Perut kenyang, hati tenang",
    tilt: "1deg"
  },
  {
    emoji: "💬",
    bg: "linear-gradient(135deg,#b0b8d0,#8898b0)",
    caption: "Deep Talk",
    num: 9,
    title: "Ngobrol yang Dalam",
    story: "Ada satu percakapan — entah kapan, entah dimana — yang bikin kita berdua jadi lebih terbuka satu sama lain. Habis itu, semuanya berasa beda.",
    date: "Waktu kata-kata mengalir sendiri",
    tilt: "-2deg"
  },
  {
    emoji: "🎬",
    bg: "linear-gradient(135deg,#282028,#181018)",
    caption: "Nonton Bareng",
    num: 10,
    title: "Nonton Bareng",
    story: "Nonton sesuatu bareng — film, series, apapun. Yang diinget bukan filmnya, tapi reaksi satu sama lain. Tertawa di part yang sama, atau satu orang takut dan yang lain ketawa.",
    date: "Di depan layar bareng kamu",
    tilt: "3deg"
  },
  {
    emoji: "🌸",
    bg: "linear-gradient(135deg,#e8c0c0,#c8a0a0)",
    caption: "Momen Kecil",
    num: 11,
    title: "Hal-Hal Kecil yang Diinget",
    story: "Bukan momen besar. Bukan hari yang spesial. Tapi ada hal-hal kecil — cara kamu ketawa, cara kamu cerita sesuatu, cara kamu ada — yang nyangkut dan ga pergi-pergi.",
    date: "Kapanpun, dimanapun",
    tilt: "-1deg"
  },
  {
    emoji: "🤍",
    bg: "linear-gradient(135deg,#f0e8e0,#d8c8b8)",
    caption: "Hari Ini",
    num: 12,
    title: "Sekarang",
    story: "Ga ada kenangan besar yang bisa diceritain. Tapi ada satu hal yang pasti: setiap hari bareng kamu itu layak jadi polaroid. Termasuk hari ini.",
    date: "Selalu · Selamanya",
    tilt: "2deg"
  },
];

let printedCount = 0;
let current = null;
const KEY = 'polaroid-seen';
const PHOTO_DIR = 'foto/polaroid/';           // taruh foto asli: foto/polaroid/1.jpg … 12.jpg
const PHOTO_EXT = ['jpg', 'jpeg', 'png', 'webp'];
const photos = {};                            // index → url foto asli (kalau ada)
let seen = new Set();
try { seen = new Set((JSON.parse(localStorage.getItem(KEY)) || []).filter(i => MOMENTS[i])); } catch (e) {}
function saveSeen() { try { localStorage.setItem(KEY, JSON.stringify([...seen])); } catch (e) {} }

function buildWall() {
  const wall = document.getElementById('wall');
  MOMENTS.forEach((m, i) => {
    const wrap = document.createElement('button');
    wrap.className = 'polaroid-wrap' + (seen.has(i) ? ' seen' : '');
    wrap.id = `wrap-${i}`;
    wrap.setAttribute('aria-label', `Momen ${m.num}: ${m.caption}`);

    wrap.innerHTML = `
      <div class="pol-string"></div>
      <div class="pin"></div>
      <div class="polaroid" id="pol-${i}" style="--tilt:${m.tilt}">
        <!-- FRONT -->
        <div class="pol-front">
          <div class="pol-frame" style="--tilt:${m.tilt}">
            <div class="pol-photo" id="photo-${i}" style="background:${m.bg}">
              ${m.emoji}
            </div>
            <p class="pol-caption">${m.caption}</p>
          </div>
        </div>
        <!-- BACK -->
        <div class="pol-back" style="--tilt:${m.tilt}">
          <div class="back-frame">
            <span class="back-num">Momen #${m.num}</span>
            <span class="back-emoji">${m.emoji}</span>
            <p class="back-story">${m.story.substring(0, 60)}...</p>
            <span class="back-date">${m.date}</span>
          </div>
        </div>
      </div>
    `;

    wrap.addEventListener('click', () => onTap(i, m));
    wall.appendChild(wrap);

    // Staggered print animation (di wrap, biar ga bentrok sama efek balik)
    setTimeout(() => shake(i), i * 80);
  });
  updateCount();
}

function shake(i) {
  const w = document.getElementById(`wrap-${i}`);
  if (!w) return;
  w.classList.remove('printing'); void w.offsetWidth;
  w.classList.add('printing');
  w.addEventListener('animationend', () => w.classList.remove('printing'), { once: true });
}

function onTap(i, m) {
  const pol = document.getElementById(`pol-${i}`);
  const wasFlipped = pol.classList.contains('flipped');
  if (!wasFlipped) pol.classList.add('flipped');
  markSeen(i);
  setTimeout(() => openModal(i), wasFlipped ? 120 : 650);
}

function markSeen(i) {
  if (seen.has(i)) return;
  seen.add(i); saveSeen();
  document.getElementById(`wrap-${i}`).classList.add('seen');
  updateCount();
}
function updateCount() {
  document.getElementById('wall-count').textContent = seen.size === MOMENTS.length ? '✨ 12/12 dilihat' : `${seen.size}/12 dilihat`;
  const anyFlipped = !!document.querySelector('.polaroid.flipped');
  document.getElementById('flip-all').textContent = anyFlipped ? '🔄 Balik ke foto' : '🔄 Balik semua';
}
function flipAll() {
  const anyFlipped = !!document.querySelector('.polaroid.flipped');
  MOMENTS.forEach((_, i) => {
    const p = document.getElementById(`pol-${i}`);
    setTimeout(() => p.classList.toggle('flipped', !anyFlipped), i * 60);
  });
  setTimeout(updateCount, MOMENTS.length * 60 + 20);
}
function slideshow() { openModal(0); markSeen(0); }

function openModal(i) {
  const m = MOMENTS[i];
  current = i;
  document.getElementById('m-emoji').textContent = m.emoji;
  document.getElementById('m-num').textContent = `Momen #${m.num}`;
  document.getElementById('m-title').textContent = m.title;
  document.getElementById('m-story').innerHTML = m.story.replace(/\b(kamu|kita|Razan|Dara)\b/g, '<em>$1</em>');
  document.getElementById('m-date').textContent = m.date;
  const ph = document.getElementById('m-photo');
  if (photos[i]) { ph.src = photos[i]; ph.alt = m.title; ph.classList.add('show'); document.getElementById('m-emoji').style.display = 'none'; }
  else { ph.classList.remove('show'); ph.removeAttribute('src'); document.getElementById('m-emoji').style.display = ''; }
  document.getElementById('m-pos').textContent = `${i + 1} / ${MOMENTS.length}`;
  document.getElementById('m-prev').disabled = i === 0;
  document.getElementById('m-next').disabled = i === MOMENTS.length - 1;
  document.getElementById('m-prev').style.opacity = i === 0 ? .3 : 1;
  document.getElementById('m-next').style.opacity = i === MOMENTS.length - 1 ? .3 : 1;
  const ov = document.getElementById('modal-overlay');
  if (!ov.classList.contains('active')) {
    ov.classList.add('active');
    document.body.style.overflow = 'hidden';
  } else {
    const s = ov.querySelector('.modal-sheet'); s.scrollTop = 0;
  }
  markSeen(i);
  document.getElementById(`pol-${i}`).classList.add('flipped');
  updateCount();
}

function navModal(d) {
  if (current === null) return;
  const j = current + d;
  if (j < 0 || j >= MOMENTS.length) return;
  openModal(j);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.body.style.overflow = '';
  if (current !== null) {
    const w = document.getElementById(`wrap-${current}`);
    if (w && w.scrollIntoView) w.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  current = null;
}

function handleOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('modal-overlay').classList.contains('active')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowRight') navModal(1);
  else if (e.key === 'ArrowLeft') navModal(-1);
});

// geser kiri/kanan di lembar cerita buat pindah momen
(function () {
  const sheet = document.querySelector('.modal-sheet');
  let x0 = null, y0 = 0;
  sheet.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) navModal(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

// Foto asli (opsional): kalau ada file foto/polaroid/<nomor>.jpg, emoji diganti foto
function probePhoto(i) {
  let k = 0;
  (function next() {
    if (k >= PHOTO_EXT.length) return;
    const src = `${PHOTO_DIR}${MOMENTS[i].num}.${PHOTO_EXT[k++]}`;
    const img = new Image();
    img.onload = () => {
      photos[i] = src;
      const box = document.getElementById(`photo-${i}`);
      if (box) { box.innerHTML = ''; const im = document.createElement('img'); im.src = src; im.alt = MOMENTS[i].caption; im.loading = 'lazy'; box.appendChild(im); }
      if (current === i) openModal(i);
    };
    img.onerror = next;
    img.src = src;
  })();
}

buildWall();
MOMENTS.forEach((_, i) => probePhoto(i));
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
