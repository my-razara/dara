<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mirror of Us 🪞</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--bg:#0a0a14;
    --blue:#7eb3f5;--pink:#f0a39a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif;touch-action:manipulation}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 40% 40%,rgba(193,122,111,.12),transparent 55%),radial-gradient(ellipse at 70% 70%,rgba(201,169,110,.08),transparent 55%);pointer-events:none}

  .screen{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;overflow:hidden}
  .screen.active{display:flex}
  .center{justify-content:center;overflow-y:auto;padding:1.5rem 1.25rem}
  .inner{width:100%;max-width:400px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* INTRO */
  .mirror-emoji{font-size:4rem;display:block;animation:float 4s ease-in-out infinite}
  .eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.35);display:block}
  .title{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;color:#fff;line-height:1.2}
  .title em{font-style:normal;color:var(--rose)}
  .intro-q{font-size:13.5px;color:rgba(255,255,255,.55);line-height:1.85;max-width:300px;font-style:italic}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%}
  .mode{padding:1rem .6rem;border-radius:18px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25rem}
  .mode:active{transform:scale(.96)}
  .mode.on{border-color:var(--rose);background:rgba(193,122,111,.14)}
  .mode-ico{font-size:1.8rem}
  .mode-name{font-size:13px;font-weight:700;color:#fff}
  .mode-sub{font-size:10.5px;color:rgba(255,255,255,.45);line-height:1.4}
  .btn{width:100%;padding:1rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--rose),var(--gold));color:#fff;box-shadow:0 6px 24px rgba(193,122,111,.35)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.3}
  .btn.pulse{animation:btnpulse 2.5s ease-in-out infinite}
  @keyframes btnpulse{0%,100%{box-shadow:0 6px 24px rgba(193,122,111,.35)}50%{box-shadow:0 6px 32px rgba(193,122,111,.6)}}
  .btn-ghost{width:100%;padding:.8rem;border-radius:50px;border:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:13px;font-weight:600;background:rgba(255,255,255,.05);color:rgba(255,255,255,.6)}

  /* QUESTIONS */
  .q-header{flex-shrink:0;padding:.75rem 1.1rem;width:100%;max-width:460px;display:flex;align-items:center;gap:.6rem}
  .q-back{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:.9rem;cursor:pointer;flex-shrink:0}
  .q-back:disabled{opacity:.25}
  .q-bar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .q-fill{height:100%;background:linear-gradient(to right,var(--rose),var(--gold));border-radius:2px;transition:width .4s ease}
  .q-step{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap}
  .q-who{flex-shrink:0;font-size:11px;font-weight:700;padding:.2rem .8rem;border-radius:50px;margin-bottom:.2rem}
  .q-who.d{background:rgba(240,163,154,.15);color:var(--pink)}.q-who.r{background:rgba(126,179,245,.15);color:var(--blue)}
  .q-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.4rem 1.25rem 1.5rem;width:100%;display:flex;flex-direction:column;align-items:center}
  .q-card{width:100%;max-width:420px;margin-top:.3rem;animation:fadeup .35s ease}
  .q-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);display:block;margin-bottom:.5rem}
  .q-question{font-size:clamp(1.1rem,4.5vw,1.45rem);font-weight:700;color:#fff;line-height:1.35;margin-bottom:.35rem}
  .q-sub{font-size:12px;color:rgba(255,255,255,.4);font-style:italic;margin-bottom:1.1rem;line-height:1.55}
  .grid{display:grid;gap:.55rem;width:100%}
  .grid.col2{grid-template-columns:repeat(2,1fr)}
  .grid.col3{grid-template-columns:repeat(3,1fr)}
  .opt{padding:.8rem .45rem;border-radius:16px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.35rem;transition:border-color .15s,background .15s;text-align:center}
  .opt:active{transform:scale(.94)}
  .opt.selected{border-color:var(--rose);background:rgba(193,122,111,.16)}
  .opt-emoji{font-size:1.8rem;line-height:1}
  .opt-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);line-height:1.3}
  .opt-sub{font-size:9.5px;color:rgba(255,255,255,.38);font-style:italic;line-height:1.3}
  .q-next{flex-shrink:0;padding:.7rem 1.25rem calc(.8rem + env(safe-area-inset-bottom));width:100%;max-width:460px}

  /* GENERATING */
  .gen-mirror{font-size:5rem;display:block;animation:mpulse 1.5s ease-in-out infinite}
  @keyframes mpulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.3)}}
  .gen-text{font-size:14px;color:rgba(255,255,255,.55);font-style:italic;min-height:22px}
  .gen-dots{display:flex;gap:.4rem;justify-content:center}
  .gen-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:gendot .8s ease-in-out infinite}
  .gen-dot:nth-child(2){animation-delay:.2s}.gen-dot:nth-child(3){animation-delay:.4s}
  @keyframes gendot{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1.2);opacity:1}}

  /* PORTRAIT */
  .p-top{flex-shrink:0;width:100%;background:rgba(10,10,20,.9);backdrop-filter:blur(8px);padding:.6rem 1rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
  .p-top span{font-size:12px;font-weight:600;color:rgba(255,255,255,.55)}
  .p-top button{background:none;border:none;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer}
  .p-scroll{width:100%;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.1rem 1.1rem 2rem;display:flex;flex-direction:column;align-items:center;gap:.9rem}
  .card{width:100%;max-width:400px;border-radius:20px;opacity:0;animation:fadeup .5s ease forwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
  .pm{padding:1.5rem 1.25rem;position:relative;text-align:center;overflow:hidden;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
  .pm-shine{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
  .pm > *{position:relative;z-index:1}
  .pm-label{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;display:block;margin-bottom:.4rem}
  .pm-title{font-size:clamp(1.35rem,5.5vw,1.9rem);font-weight:700;color:#fff;line-height:1.2;margin-bottom:.35rem}
  .pm-type{font-size:12px;font-style:italic;margin-bottom:.85rem;line-height:1.5}
  .pm-tags{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-bottom:.85rem}
  .pm-tag{padding:.28rem .8rem;border-radius:50px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
  .pm-divider{height:1px;background:rgba(255,255,255,.14);margin-bottom:1rem}
  .pm-desc{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.75;font-style:italic}
  .pm-sig{font-size:11px;margin-top:.9rem;display:block}
  .box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:1rem 1.15rem;text-align:left}
  .box-title{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);display:block;margin-bottom:.7rem}
  .world{font-size:13px;color:rgba(255,255,255,.8);line-height:1.85}
  .world b{color:var(--gold);font-weight:600}
  .el-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}
  .el-item{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.04);border-radius:10px;padding:.5rem .6rem}
  .el-emoji{font-size:1.2rem;flex-shrink:0}
  .el-cat{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;display:block}
  .el-val{font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
  .poem{background:rgba(193,122,111,.07);border:1px solid rgba(193,122,111,.22);padding:1.25rem 1.4rem;text-align:center}
  .poem .box-title{color:var(--rose);text-align:center}
  .poem-text{font-size:13px;color:rgba(255,255,255,.8);line-height:2;font-style:italic}
  .poem-text span{display:block}

  /* MATCH (mode berdua) */
  .match{padding:1.2rem 1.1rem;text-align:center;background:linear-gradient(135deg,rgba(240,163,154,.12),rgba(126,179,245,.12));border:1px solid rgba(255,255,255,.12)}
  .match-pct{font-size:3rem;font-weight:700;color:#fff;line-height:1}
  .match-lbl{font-size:12px;color:rgba(255,255,255,.65);margin-top:.3rem;line-height:1.6}
  .cmp{width:100%;margin-top:.8rem;text-align:left}
  .cmp-row{display:grid;grid-template-columns:4.2rem 1fr 1fr 1.2rem;gap:.35rem;align-items:center;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11.5px;color:rgba(255,255,255,.8)}
  .cmp-row:last-child{border-bottom:none}
  .cmp-row .k{font-size:9.5px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em}
  .cmp-row .d{color:var(--pink)}.cmp-row .r{color:var(--blue)}
  .cmp-head{font-size:10px;font-weight:700}
  .btns{width:100%;max-width:400px;display:flex;flex-direction:column;gap:.55rem;padding-bottom:1rem}

  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:rgba(20,20,35,.95);border:1px solid rgba(193,122,111,.4);color:#fff;font-size:12px;padding:.45rem 1rem;border-radius:50px;opacity:0;transition:opacity .25s;z-index:500;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- INTRO -->
<div id="s-intro" class="screen center active">
  <div class="inner">
    <span class="mirror-emoji">🪞</span>
    <span class="eyebrow">Hadiah untuk Dara</span>
    <h1 class="title">Mirror<br>of <em>Us</em></h1>
    <p class="intro-q">"Aku penasaran... kalau hubungan kita dijadikan sebuah dunia, bentuknya seperti apa?"</p>
    <div class="modes">
      <div class="mode on" id="m-solo" onclick="setMode('solo')"><span class="mode-ico">✨</span><span class="mode-name">Sendiri</span><span class="mode-sub">Dara jawab, cermin bikin portrait</span></div>
      <div class="mode" id="m-duo" onclick="setMode('duo')"><span class="mode-ico">🪞</span><span class="mode-name">Berdua</span><span class="mode-sub">Dara & Razan jawab terpisah — seberapa mirip?</span></div>
    </div>
    <button class="btn pulse" onclick="startFlow()">Mulai Cermin Kita ✨</button>
    <button class="btn-ghost" id="last-btn" style="display:none" onclick="showLast()">🖼️ Lihat cermin terakhir</button>
  </div>
</div>

<!-- HANDOVER (mode berdua) -->
<div id="s-hand" class="screen center">
  <div class="inner">
    <span class="mirror-emoji" id="hand-ico">🧑</span>
    <h2 class="title" style="font-size:1.35rem" id="hand-title">Giliran Razan</h2>
    <p class="intro-q" id="hand-sub"></p>
    <button class="btn" id="hand-btn" onclick="beginAnswering()">Aku siap</button>
  </div>
</div>

<!-- QUESTIONS -->
<div id="s-questions" class="screen">
  <div class="q-header">
    <button class="q-back" id="q-back" onclick="prevQuestion()">←</button>
    <div class="q-bar"><div class="q-fill" id="q-fill" style="width:0%"></div></div>
    <span class="q-step" id="q-step">1 / 7</span>
  </div>
  <span class="q-who d" id="q-who" style="display:none"></span>
  <div class="q-scroll" id="q-scroll"><div class="q-card" id="q-card"></div></div>
  <div class="q-next"><button class="btn" id="q-next" onclick="nextQuestion()" disabled>Selanjutnya →</button></div>
</div>

<!-- GENERATING -->
<div id="s-gen" class="screen center">
  <div class="inner">
    <span class="gen-mirror">🪞</span>
    <p class="gen-text" id="gen-text"></p>
    <div class="gen-dots"><div class="gen-dot"></div><div class="gen-dot"></div><div class="gen-dot"></div></div>
  </div>
</div>

<!-- PORTRAIT -->
<div id="s-portrait" class="screen">
  <div class="p-top"><span>🪞 Mirror of Us</span><button onclick="showScreen('s-intro')">Kembali</button></div>
  <div class="p-scroll" id="p-scroll"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═════════ PERTANYAAN ═════════
const QUESTIONS = [
  { id:'color', cat:'Warna', q:'Kalau hubungan kita punya warna...', sub:'Pilih warna yang paling merepresentasikan perasaanmu tentang kita', cols:3, options:[
    {emoji:'🔴',label:'Merah',sub:'Passion & intens',value:'red',tags:['Intens','Penuh Gairah']},
    {emoji:'🩷',label:'Pink',sub:'Manis & lembut',value:'pink',tags:['Manis','Mellow']},
    {emoji:'🟠',label:'Oranye',sub:'Hangat & ceria',value:'orange',tags:['Hangat','Energik']},
    {emoji:'🟡',label:'Kuning',sub:'Cerah & bahagia',value:'yellow',tags:['Bahagia','Ceria']},
    {emoji:'🔵',label:'Biru',sub:'Tenang & dalam',value:'blue',tags:['Tenang','Dalam']},
    {emoji:'🟣',label:'Ungu',sub:'Misterius & dalam',value:'purple',tags:['Misterius','Koneksi Jiwa']},
    {emoji:'🟢',label:'Hijau',sub:'Tumbuh & natural',value:'green',tags:['Tumbuh','Natural']},
    {emoji:'⚫',label:'Hitam',sub:'Bold & kuat',value:'black',tags:['Bold','Powerful']},
    {emoji:'🤍',label:'Putih',sub:'Murni & bersih',value:'white',tags:['Murni','Damai']},
  ]},
  { id:'weather', cat:'Cuaca', q:'Cuaca apa yang menggambarkan kita?', sub:'Bukan cuaca favorit — tapi yang paling mirip sama hubungan kita', cols:3, options:[
    {emoji:'☀️',label:'Cerah',sub:'Selalu hangat',value:'sunny',tags:['Hangat','Konsisten']},
    {emoji:'🌤️',label:'Berawan sedikit',sub:'Mostly baik-baik',value:'partlycloudy',tags:['Stabil','Ada Lika-liku']},
    {emoji:'🌧️',label:'Hujan',sub:'Dalam & melankolis',value:'rainy',tags:['Melankolis','Dalam']},
    {emoji:'⛈️',label:'Badai',sub:'Chaos tapi hidup',value:'stormy',tags:['Intens','Chaotic']},
    {emoji:'🌈',label:'Setelah hujan',sub:'Indah setelah susah',value:'rainbow',tags:['Harapan','Kuat']},
    {emoji:'❄️',label:'Dingin',sub:'Quiet & kontemplatif',value:'cold',tags:['Tenang','Intim']},
    {emoji:'🌊',label:'Ombak',sub:'Naik turun tapi indah',value:'wave',tags:['Dinamis','Bebas']},
    {emoji:'🌙',label:'Malam berbintang',sub:'Tenang & romantis',value:'night',tags:['Romantis','Damai']},
    {emoji:'🌫️',label:'Berkabut',sub:'Misterius & intim',value:'foggy',tags:['Misterius','Dekat']},
  ]},
  { id:'place', cat:'Tempat', q:'Kalau kita punya tempat sendiri...', sub:'Di mana dunia kita berada?', cols:3, options:[
    {emoji:'🏠',label:'Rumah kecil',sub:'Hangat & private',value:'home',tags:['Intim','Homey']},
    {emoji:'🏝️',label:'Pulau terpencil',sub:'Hanya berdua',value:'island',tags:['Eksklusif','Romantis']},
    {emoji:'🌲',label:'Hutan',sub:'Natural & tersembunyi',value:'forest',tags:['Natural','Misterius']},
    {emoji:'🏔️',label:'Puncak gunung',sub:'Di atas segalanya',value:'mountain',tags:['Tinggi','Bebas']},
    {emoji:'🌊',label:'Tepi laut',sub:'Tenang & luas',value:'beach',tags:['Bebas','Luas']},
    {emoji:'🌌',label:'Luar angkasa',sub:'Tak terbatas',value:'space',tags:['Tak Terbatas','Epik']},
    {emoji:'☕',label:'Cafe kecil',sub:'Nyaman & hangat',value:'cafe',tags:['Cozy','Nyaman']},
    {emoji:'🌃',label:'Kota malam',sub:'Hidup & bersinar',value:'city',tags:['Hidup','Bersinar']},
    {emoji:'🌸',label:'Taman bunga',sub:'Indah & tenang',value:'garden',tags:['Indah','Lembut']},
  ]},
  { id:'music', cat:'Musik', q:'Musik apa yang terasa seperti kita?', sub:'Genre atau suasana yang merepresentasikan hubungan kita', cols:2, options:[
    {emoji:'🎸',label:'Indie / Alternative',sub:'Unik & ga mainstream',value:'indie',tags:['Unik','Autentik']},
    {emoji:'🎹',label:'Piano / Klasik',sub:'Elegan & timeless',value:'classical',tags:['Elegan','Mendalam']},
    {emoji:'🎵',label:'Pop / OPM',sub:'Catchy & manis',value:'pop',tags:['Manis','Fun']},
    {emoji:'🎶',label:'Jazz / Lo-fi',sub:'Santai & cozy',value:'jazz',tags:['Santai','Cozy']},
    {emoji:'🔥',label:'R&B / Soul',sub:'Dalam & penuh rasa',value:'rnb',tags:['Penuh Rasa','Intim']},
    {emoji:'🌊',label:'Ambient / Instrumental',sub:'Mengalir & tenang',value:'ambient',tags:['Tenang','Mengalir']},
  ]},
  { id:'animal', cat:'Hewan', q:'Hewan apa yang melambangkan kita?', sub:'Kalau hubungan kita adalah seekor hewan...', cols:3, options:[
    {emoji:'🦋',label:'Kupu-kupu',sub:'Indah & berubah',value:'butterfly',tags:['Bertumbuh','Indah']},
    {emoji:'🐺',label:'Serigala',sub:'Loyal & kuat',value:'wolf',tags:['Loyal','Kuat']},
    {emoji:'🦁',label:'Singa',sub:'Berani & protektif',value:'lion',tags:['Berani','Protektif']},
    {emoji:'🐬',label:'Lumba-lumba',sub:'Ceria & bebas',value:'dolphin',tags:['Ceria','Bebas']},
    {emoji:'🦅',label:'Elang',sub:'Tinggi & tajam',value:'eagle',tags:['Tajam','Bebas']},
    {emoji:'🐢',label:'Kura-kura',sub:'Sabar & tahan lama',value:'turtle',tags:['Sabar','Abadi']},
    {emoji:'🦊',label:'Rubah',sub:'Pintar & playful',value:'fox',tags:['Cerdas','Playful']},
    {emoji:'🐧',label:'Penguin',sub:'Setia seumur hidup',value:'penguin',tags:['Setia','Manis']},
    {emoji:'🐱',label:'Kucing',sub:'Manja & misterius',value:'cat',tags:['Manja','Intim']},
  ]},
  { id:'flower', cat:'Bunga', q:'Bunga apa yang paling cocok untuk kita?', sub:'Setiap bunga punya makna berbeda...', cols:3, options:[
    {emoji:'🌹',label:'Mawar Merah',sub:'Cinta & gairah',value:'rose',tags:['Cinta Sejati','Passion']},
    {emoji:'🌸',label:'Sakura',sub:'Indah & berharga',value:'sakura',tags:['Precious','Carpe Diem']},
    {emoji:'🌻',label:'Bunga Matahari',sub:'Bahagia & setia',value:'sunflower',tags:['Setia','Optimis']},
    {emoji:'💜',label:'Lavender',sub:'Tenang & healing',value:'lavender',tags:['Healing','Damai']},
    {emoji:'🌼',label:'Daisy',sub:'Sederhana & tulus',value:'daisy',tags:['Tulus','Sederhana']},
    {emoji:'🌺',label:'Hibiscus',sub:'Eksotis & berani',value:'hibiscus',tags:['Unik','Berani']},
    {emoji:'🌷',label:'Tulip',sub:'Elegan & sempurna',value:'tulip',tags:['Elegan','Indah']},
    {emoji:'🌿',label:'Tanaman Hijau',sub:'Tumbuh & bertahan',value:'plant',tags:['Bertumbuh','Kuat']},
    {emoji:'🍀',label:'Semanggi',sub:'Beruntung & langka',value:'clover',tags:['Beruntung','Langka']},
  ]},
  { id:'vibe', cat:'Suasana', q:'Satu kata untuk suasana kita...', sub:'Kalau harus pilih satu — yang paling terasa', cols:3, options:[
    {emoji:'🔥',label:'Passionate',sub:'Penuh api',value:'passionate',tags:['Intens','Berapi']},
    {emoji:'🌙',label:'Dreamy',sub:'Seperti mimpi',value:'dreamy',tags:['Romantis','Magical']},
    {emoji:'⚡',label:'Electric',sub:'Ada chemistry kuat',value:'electric',tags:['Chemistry','Spontan']},
    {emoji:'🌊',label:'Deep',sub:'Sangat dalam',value:'deep',tags:['Dalam','Bermakna']},
    {emoji:'☀️',label:'Warm',sub:'Selalu hangat',value:'warm',tags:['Nyaman','Hangat']},
    {emoji:'🌀',label:'Chaotic',sub:'Ramai tapi seru',value:'chaotic',tags:['Seru','Tak Terduga']},
    {emoji:'🕊️',label:'Peaceful',sub:'Tenang & damai',value:'peaceful',tags:['Damai','Stabil']},
    {emoji:'✨',label:'Magical',sub:'Selalu bikin kagum',value:'magical',tags:['Ajaib','Unik']},
    {emoji:'🫶',label:'Comforting',sub:'Rumah yang nyaman',value:'comforting',tags:['Rumah','Aman']},
  ]},
];

// ═════════ TIPE HUBUNGAN (dipilih dari skor SEMUA jawaban, bukan yang pertama cocok) ═════════
const REL_TYPES = [
  { key:'chaos', name:'The Comfortable Chaos', desc:'Hubungan kalian penuh kejutan dan keramaian — tapi di dalamnya ada kehangatan yang selalu bisa diandalkan. Kalian saling melengkapi dalam ketidaksempurnaan yang indah.',
    w:{ 'vibe:chaotic':3, 'weather:stormy':2, 'weather:wave':1, 'color:orange':1, 'animal:fox':1, 'animal:dolphin':1, 'music:indie':1, 'place:city':1, 'flower:hibiscus':1 } },
  { key:'quiet', name:'The Quiet Universe', desc:'Seperti dua bintang yang tenang di galaksi yang sama — kalian tidak perlu banyak kata untuk saling mengerti. Kedalaman hubungan kalian lebih terasa daripada terucap.',
    w:{ 'vibe:deep':3, 'weather:night':2, 'weather:foggy':1, 'weather:cold':1, 'weather:rainy':1, 'color:blue':2, 'music:ambient':2, 'place:forest':1, 'animal:wolf':1 } },
  { key:'dreamy', name:'The Dreamy Sanctuary', desc:'Hubungan kalian terasa seperti tempat berlindung — penuh imajinasi, keindahan, dan ketenangan. Bersama kalian, dunia terasa lebih ringan dan lebih indah.',
    w:{ 'vibe:dreamy':3, 'weather:rainbow':2, 'color:pink':2, 'place:garden':1, 'place:island':1, 'flower:sakura':2, 'animal:butterfly':1 } },
  { key:'electric', name:'The Electric Love', desc:'Ada chemistry yang ga bisa dijelaskan antara kalian — seperti percikan listrik yang selalu hidup. Kalian saling menarik satu sama lain dengan cara yang magical.',
    w:{ 'vibe:electric':3, 'color:black':2, 'weather:stormy':1, 'place:city':2, 'music:indie':1, 'animal:eagle':1, 'color:red':1 } },
  { key:'passion', name:'The Passionate Journey', desc:'Cinta kalian bukan yang kalem — tapi yang membara dan penuh warna. Setiap momen terasa hidup, setiap hari jadi petualangan baru bersama.',
    w:{ 'vibe:passionate':3, 'color:red':2, 'flower:rose':2, 'music:rnb':2, 'animal:lion':1, 'place:mountain':1 } },
  { key:'harbor', name:'The Peaceful Harbor', desc:'Di tengah dunia yang ramai, kalian adalah ketenangan satu sama lain. Hubungan kalian adalah pelabuhan — tempat pulang yang selalu hangat dan aman.',
    w:{ 'vibe:peaceful':3, 'vibe:comforting':3, 'place:home':2, 'place:beach':1, 'color:white':2, 'color:green':1, 'flower:lavender':2, 'animal:turtle':1, 'animal:cat':1, 'music:jazz':1, 'weather:partlycloudy':1 } },
  { key:'magic', name:'The Magical Chapter', desc:'Ada sesuatu yang tak biasa dalam hubungan kalian — semesta seperti selalu berpihak. Kebersamaan kalian terasa seperti cerita yang ditulis oleh bintang-bintang.',
    w:{ 'vibe:magical':3, 'place:space':2, 'color:purple':2, 'flower:clover':2, 'music:classical':1, 'animal:butterfly':1 } },
  { key:'warm', name:'The Warm Forever', desc:'Seperti sinar matahari yang tidak pernah pergi — hubungan kalian konsisten, hangat, dan tulus. Kalian adalah rumah satu sama lain.',
    w:{ 'vibe:warm':3, 'weather:sunny':2, 'color:yellow':2, 'flower:sunflower':2, 'flower:daisy':1, 'flower:tulip':1, 'flower:plant':1, 'animal:penguin':2, 'place:cafe':1, 'music:pop':1 } },
];
function scoreTypes(list) { // list = array of answer sets
  const sc = REL_TYPES.map(t => ({ t, s: 0 }));
  list.forEach(ans => QUESTIONS.forEach(q => { const k = q.id + ':' + ans[q.id]; sc.forEach(x => x.s += x.t.w[k] || 0); }));
  const vibe = list[0].vibe;
  sc.sort((a, b) => b.s - a.s || ((b.t.w['vibe:' + vibe] || 0) - (a.t.w['vibe:' + vibe] || 0)));
  return sc[0].t;
}

const PALETTES = {
  red:{bg:'linear-gradient(135deg,#4a0010,#c17a6f)',text:'#ffb5a7'}, pink:{bg:'linear-gradient(135deg,#3d0030,#c17a6f)',text:'#ffb5c8'},
  orange:{bg:'linear-gradient(135deg,#3d1a00,#c9a96e)',text:'#ffd0a0'}, yellow:{bg:'linear-gradient(135deg,#2d2000,#c9a96e)',text:'#ffe680'},
  blue:{bg:'linear-gradient(135deg,#001a3d,#0077b6)',text:'#90e0ef'}, purple:{bg:'linear-gradient(135deg,#1a0040,#7b2d8b)',text:'#d4a8ff'},
  green:{bg:'linear-gradient(135deg,#002010,#2d6a4f)',text:'#95d5b2'}, black:{bg:'linear-gradient(135deg,#0a0a0a,#2d2d2d)',text:'#e0e0e0'},
  white:{bg:'linear-gradient(135deg,#1a1a2e,#4a4a6a)',text:'#e8e8ff'},
};
const POEMS = {
  passionate:['Dalam api yang tak pernah padam,','kita berdua jadi nyala yang sama.','Bukan karena mudah —','tapi karena memang begini adanya.'],
  dreamy:['Seperti mimpi yang tak mau berakhir,','kita hidup di antara bintang-bintang.','Di sini, waktu melambat —','dan semua terasa cukup.'],
  electric:['Ada percikan yang tidak bisa dijelaskan','setiap kali matamu bertemu mataku.','Mungkin ini bukan kebetulan —','mungkin memang semesta yang mengatur.'],
  deep:['Kita bukan cinta yang terlihat —','kita cinta yang dirasakan.','Di bawah permukaan yang tenang,','ada lautan yang tak bertepi.'],
  warm:['Kamu adalah satu-satunya tempat','yang selalu terasa seperti rumah.','Tidak perlu kata yang indah —','kehadiranmu sudah cukup.'],
  chaotic:['Kita berantakan dengan cara yang indah,','penuh kejutan yang tidak terduga.','Di tengah semua kekacauan itu —','aku selalu tahu kamu ada.'],
  peaceful:['Bersamamu, dunia tidak terlalu berisik.','Bersamamu, aku bisa bernafas.','Kita bukan yang paling dramatis —','tapi kita yang paling nyata.'],
  magical:['Ada sesuatu yang tidak bisa kujelaskan','tentang caramu membuatku percaya.','Mungkin ini sihir —','atau mungkin memang begini bentuk cinta.'],
  comforting:['Kamu bukan pelarian —','kamu adalah tempat pulang.','Di pelukanmu, aku tidak perlu','menjadi siapapun selain diriku sendiri.'],
};
// baris penutup puisi dari bunga yang dipilih
const FLOWER_LINE = {
  rose:'Seperti mawar — merah, berani, dan tetap merekah.', sakura:'Seperti sakura — setiap detik bersamamu terlalu berharga untuk dilewatkan.',
  sunflower:'Seperti bunga matahari — aku selalu menghadap ke arahmu.', lavender:'Seperti lavender — kamu yang menenangkan hariku.',
  daisy:'Seperti daisy — sederhana, tapi tulusnya nggak pernah pudar.', hibiscus:'Seperti hibiscus — kita berani jadi berbeda.',
  tulip:'Seperti tulip — rapi, indah, dan pas di tempatnya.', plant:'Seperti tanaman hijau — kita terus tumbuh, pelan tapi pasti.',
  clover:'Seperti semanggi — kamu keberuntungan yang langka.',
};

// ═════════ STATE ═════════
const $ = id => document.getElementById(id);
const STORE = 'mirror-of-us-last';
let mode = 'solo', who = 'd', answers = { d:{}, r:{} }, qi = 0;
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
function setMode(m) { mode = m; $('m-solo').classList.toggle('on', m === 'solo'); $('m-duo').classList.toggle('on', m === 'duo'); }
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000); }
function optOf(qid, val) { return QUESTIONS.find(q => q.id === qid).options.find(o => o.value === val); }

// ═════════ ALUR ═════════
function startFlow() {
  answers = { d:{}, r:{} }; who = 'd';
  if (mode === 'duo') handover('d'); else beginAnswering();
}
function handover(p) {
  who = p;
  $('hand-ico').textContent = p === 'd' ? '👧' : '🧑';
  $('hand-title').textContent = p === 'd' ? 'Dara duluan ya 🌸' : 'Sekarang giliran Razan 🤍';
  $('hand-sub').textContent = p === 'd' ? 'Jawab sesuai perasaanmu. Razan jangan ngintip! 🙈' : 'Dara udah selesai — kasih HP ke Razan. Jawabannya dirahasiain sampai akhir 🤫';
  $('hand-btn').textContent = p === 'd' ? '👧 Aku siap' : '🧑 Razan siap';
  showScreen('s-hand');
}
function beginAnswering() { qi = 0; showScreen('s-questions'); renderQ(); }

function renderQ() {
  const q = QUESTIONS[qi], cur = answers[who][q.id];
  $('q-fill').style.width = (qi / QUESTIONS.length * 100) + '%';
  $('q-step').textContent = `${qi + 1} / ${QUESTIONS.length}`;
  $('q-back').disabled = qi === 0;
  const w = $('q-who');
  if (mode === 'duo') { w.style.display = ''; w.className = 'q-who ' + who; w.textContent = who === 'd' ? '👧 Jawaban Dara' : '🧑 Jawaban Razan'; } else w.style.display = 'none';
  $('q-card').innerHTML = `<span class="q-eyebrow">Pertanyaan ${qi + 1} dari ${QUESTIONS.length}</span><h2 class="q-question">${q.q}</h2><p class="q-sub">${q.sub}</p><div class="grid col${q.cols}" id="grid"></div>`;
  const c = $('q-card'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
  const grid = $('grid');
  q.options.forEach(o => {
    const b = document.createElement('div');
    b.className = 'opt' + (cur === o.value ? ' selected' : '');
    b.innerHTML = `<span class="opt-emoji">${o.emoji}</span><span class="opt-label">${o.label}</span><span class="opt-sub">${o.sub}</span>`;
    b.onclick = () => { answers[who][q.id] = o.value; grid.querySelectorAll('.opt').forEach(x => x.classList.remove('selected')); b.classList.add('selected'); $('q-next').disabled = false; vib(20); };
    grid.appendChild(b);
  });
  $('q-next').disabled = !cur;
  $('q-next').textContent = qi === QUESTIONS.length - 1 ? (mode === 'duo' && who === 'd' ? 'Selesai → oper ke Razan' : 'Lihat Cermin ✨') : 'Selanjutnya →';
  $('q-scroll').scrollTop = 0;
}
function prevQuestion() { if (qi > 0) { qi--; renderQ(); } }
function nextQuestion() {
  if (!answers[who][QUESTIONS[qi].id]) return;
  qi++;
  if (qi < QUESTIONS.length) { renderQ(); return; }
  if (mode === 'duo' && who === 'd') { handover('r'); return; }
  generate();
}

function generate() {
  showScreen('s-gen');
  const texts = mode === 'duo'
    ? ['Cermin lagi membandingkan dua hati...', 'Mencari yang sama dan yang beda...', 'Menyusun warna dunia kalian...', 'Hampir selesai...']
    : ['Cermin sedang membaca perasaanmu...', 'Menyusun warna-warna hubungan kalian...', 'Merajut kata-kata yang tepat...', 'Hampir selesai...'];
  let ti = 0; $('gen-text').textContent = texts[0];
  const iv = setInterval(() => { ti++; if (ti < texts.length) $('gen-text').textContent = texts[ti]; }, 700);
  setTimeout(() => {
    clearInterval(iv);
    const data = { mode, d: { ...answers.d }, r: mode === 'duo' ? { ...answers.r } : null, at: Date.now() };
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {}
    buildPortrait(data); confetti(60);
  }, 2800);
}

// ═════════ PORTRAIT ═════════
function buildPortrait(data) {
  const A = data.d, B = data.r, duo = !!B;
  const type = scoreTypes(duo ? [A, B] : [A]);
  const o = k => optOf(k, A[k]);
  const pal = PALETTES[A.color] || PALETTES.purple;
  const tags = [...new Set([...QUESTIONS.flatMap(q => o(q.id).tags), ...(duo ? QUESTIONS.flatMap(q => optOf(q.id, B[q.id]).tags) : [])])];
  const topTags = tags.slice(0, 6);
  const poem = [...(POEMS[A.vibe] || POEMS.warm), FLOWER_LINE[A.flower] || ''];
  const lc = s => s.toLowerCase();
  const world = `Kalau hubungan kita adalah sebuah dunia, dia ada di <b>${o('place').emoji} ${lc(o('place').label)}</b>, saat <b>${o('weather').emoji} ${lc(o('weather').label)}</b>. Diiringi <b>${o('music').emoji} ${o('music').label}</b>, dijaga seekor <b>${o('animal').emoji} ${lc(o('animal').label)}</b>, dan dihiasi <b>${o('flower').emoji} ${o('flower').label}</b>. Warnanya <b>${o('color').emoji} ${lc(o('color').label)}</b>, suasananya <b>${o('vibe').emoji} ${o('vibe').label}</b>.`;

  let matchHTML = '';
  if (duo) {
    const same = QUESTIONS.filter(q => A[q.id] === B[q.id]).length;
    const pct = Math.round(same / QUESTIONS.length * 100);
    const typeB = scoreTypes([B]), typeA = scoreTypes([A]);
    const msg = pct >= 85 ? 'Cerminnya nyaris identik — kalian beneran satu frekuensi! 🫶'
      : pct >= 57 ? 'Banyak yang sama, sisanya saling melengkapi. Pas banget 🤍'
      : pct >= 29 ? 'Beda-beda tipis — justru itu yang bikin seru saling kenal lagi 😊'
      : 'Beda banget! Tapi dua cermin yang beda bikin bayangan yang lebih lengkap ✨';
    matchHTML = `<div class="card match d1"><span class="box-title" style="text-align:center">🪞 Seberapa Mirip Cermin Kalian</span>
      <div class="match-pct">${pct}%</div><p class="match-lbl">${same} dari ${QUESTIONS.length} jawaban sama<br>${msg}</p>
      <p class="match-lbl" style="font-size:11px">Versi Dara: <b style="color:#f0a39a">${typeA.name}</b> · Versi Razan: <b style="color:#7eb3f5">${typeB.name}</b></p>
      <div class="cmp"><div class="cmp-row cmp-head"><span class="k"></span><span class="d">👧 Dara</span><span class="r">🧑 Razan</span><span></span></div>
      ${QUESTIONS.map(q => { const a = optOf(q.id, A[q.id]), b = optOf(q.id, B[q.id]); return `<div class="cmp-row"><span class="k">${q.cat}</span><span>${a.emoji} ${a.label}</span><span>${b.emoji} ${b.label}</span><span>${a.value === b.value ? '💞' : ''}</span></div>`; }).join('')}</div></div>`;
  }

  $('p-scroll').innerHTML = `
    <div class="card pm" style="background:${pal.bg}">
      <div class="pm-shine"></div>
      <span class="pm-label" style="color:${pal.text}aa">🪞 Relationship Portrait — Razan & Dara</span>
      <h2 class="pm-title">"${type.name}"</h2>
      <p class="pm-type" style="color:${pal.text}cc">${o('weather').emoji} ${o('vibe').label} · ${o('flower').emoji} ${o('flower').label} · ${o('place').emoji} ${o('place').label}</p>
      <div class="pm-tags">${topTags.map(t => `<span class="pm-tag" style="border-color:${pal.text}44">${t}</span>`).join('')}</div>
      <div class="pm-divider"></div>
      <p class="pm-desc">${type.desc}</p>
      <span class="pm-sig" style="color:${pal.text}88">— Ditulis oleh cermin kita ✨${duo ? ' · dari 2 hati' : ''}</span>
    </div>
    ${matchHTML}
    <div class="card box ${duo ? 'd2' : 'd1'}"><span class="box-title">🌍 Dunia Kita</span><p class="world">${world}</p></div>
    <div class="card box ${duo ? 'd3' : 'd2'}"><span class="box-title">Elemen Hubungan${duo ? ' (versi Dara)' : ''}</span>
      <div class="el-grid">${QUESTIONS.map(q => { const x = o(q.id); return `<div class="el-item"><span class="el-emoji">${x.emoji}</span><div><span class="el-cat">${q.cat}</span><span class="el-val">${x.label}</span></div></div>`; }).join('')}</div></div>
    <div class="card box poem ${duo ? 'd4' : 'd3'}"><span class="box-title">✍️ Untuk Kamu, dari Cermin Kita</span><p class="poem-text">${poem.filter(Boolean).map(l => `<span>${l}</span>`).join('')}</p></div>
    <div class="btns card ${duo ? 'd5' : 'd4'}">
      <button class="btn" onclick="shareWA()">💬 Kirim hasilnya ke WhatsApp</button>
      <button class="btn-ghost" onclick="startFlow()">🔄 Coba Lagi</button>
      <button class="btn-ghost" onclick="setMode('${duo ? 'solo' : 'duo'}');startFlow()">${duo ? '✨ Coba mode Sendiri' : '🪞 Coba mode Berdua'}</button>
    </div>`;
  window._last = { data, type };
  showScreen('s-portrait');
  $('p-scroll').scrollTop = 0;
  $('last-btn').style.display = '';
}

function shareWA() {
  const L = window._last; if (!L) return;
  const A = L.data.d, B = L.data.r;
  let t = `🪞 Mirror of Us — Razan & Dara\n\n✨ "${L.type.name}"\n${L.type.desc}\n\n`;
  t += QUESTIONS.map(q => { const a = optOf(q.id, A[q.id]); const b = B ? optOf(q.id, B[q.id]) : null; return `${q.cat}: ${a.emoji} ${a.label}${b ? ` | Razan: ${b.emoji} ${b.label}${a.value === b.value ? ' 💞' : ''}` : ''}`; }).join('\n');
  if (B) { const same = QUESTIONS.filter(q => A[q.id] === B[q.id]).length; t += `\n\n💞 Kecocokan: ${Math.round(same / QUESTIONS.length * 100)}%`; }
  t += `\n\n${(POEMS[A.vibe] || POEMS.warm).join('\n')}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

function showLast() {
  try { const d = JSON.parse(localStorage.getItem(STORE) || 'null'); if (d && d.d && d.d.vibe) { buildPortrait(d); return; } } catch {}
  toast('Belum ada cermin yang tersimpan');
}

function confetti(n) {
  const colors = ['#c17a6f','#c9a96e','#e8c4b0','#b5c4b1','#fff','#d4a8ff'];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const el = document.createElement('div'); el.className = 'cp';
    el.style.cssText = `left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);
  }, i * 20);
}

// tombol "lihat terakhir" muncul kalau ada data
try { if (localStorage.getItem(STORE)) $('last-btn').style.display = ''; } catch {}
</script>
