const hm = t => t ? `${pad(t.getHours())}:${pad(t.getMinutes())}` : '–';
function loc() {
  const own = (((lsGet('lokasi-' + ME, {}) || {})['2000-01-01']) || {}), sv = lsGet('bulan-loc', null);
  if (sv && sv.lat != null) return sv;
  if (own.lat != null && own.lng != null) return { lat: +own.lat, lng: +own.lng, n: 'lokasimu' };
  return { lat: -6.2, lng: 106.82, n: 'Jakarta' };
}
function findNext(target, from) {   // fase berikutnya (0.5 purnama, 0/1 bulan baru), dicari per jam
  let t = from.valueOf(), prev = illum(new Date(t)).p;
  for (let i = 1; i < 24 * 32; i++) { const x = t + i * 36e5, p = illum(new Date(x)).p; if (target === .5 ? (prev < .5 && p >= .5) : (prev > .9 && p < .1)) return new Date(x); prev = p; }
  return null;
}
const FACTS = ['Cahaya bulan itu sebenernya cahaya matahari yang mantul — butuh ±1,3 detik buat nyampe ke mata kita.', 'Bulan selalu nunjukin sisi yang sama ke bumi, jadi muka bulan yang kamu liat sama persis kayak yang dia liat.', 'Jarak bumi–bulan ±384 ribu km. Masih lebih deket dari jarak kangen kita kok 🤭', 'Di deket khatulistiwa kayak Indonesia, bulan sabit keliatan kayak lagi senyum 🙂', 'Siklus bulan dari purnama ke purnama itu ±29,5 hari — kurang lebih sebulan sekali kita dapet malam terang.', 'Bulan pelan-pelan ngejauh dari bumi ±3,8 cm tiap tahun. Kita jangan ya 🤍'];
function render() {
  const now = new Date(), I = illum(now), P = phOf(I.p), L = loc(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  $('moon').innerHTML = moonSvg(I.p, I.f, 230, 1);
  $('ph').innerHTML = `<b>${P[1]} ${P[2]}</b><small>${Math.round(I.f * 100)}% terang · ${P[3]}</small>`;
  const mt = moonTimes(d0, L.lat, L.lng), st = sunTimes(new Date(d0.valueOf() + 12 * 36e5), L.lat, L.lng);
  $('times').innerHTML = `<div><span>🌇</span><b>${hm(st.set)}</b><small>matahari terbenam</small></div><div><span>🌙</span><b>${mt.rise ? hm(mt.rise) : 'ga terbit'}</b><small>bulan terbit${mt.set ? ` · tenggelam ${hm(mt.set)}` : ''}</small></div>`;
  // seminggu
  $('wk').innerHTML = [...Array(7)].map((_, i) => { const t = new Date(d0.valueOf() + i * DAY + 20 * 36e5), x = illum(t); return `<div class="${i === 0 ? 'on' : ''}">${i === 0 ? 'Mlm ini' : HARI[t.getDay()].slice(0, 3)}${moonSvg(x.p, x.f, 34, 0)}${Math.round(x.f * 100)}%</div>`; }).join('');
  const nf = findNext(.5, now), nn = findNext(0, now), dd = t => Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - d0) / DAY);
  const when = t => { const n = dd(t); return n === 0 ? 'malam ini' : n === 1 ? 'besok' : `${n} hari lagi`; };
  $('nx').innerHTML = (nf ? `<div><span>🌕</span><em>Purnama berikutnya<br><small>${HARI[nf.getDay()]}, ${fmtD(nf)}</small></em><small>${when(nf)}</small></div>` : '') + (nn ? `<div><span>🌑</span><em>Bulan baru berikutnya<br><small>${HARI[nn.getDay()]}, ${fmtD(nn)} · bagus buat liat bintang</small></em><small>${when(nn)}</small></div>` : '');
  $('fact').textContent = '✨ ' + FACTS[Math.floor(Date.now() / DAY) % FACTS.length];
  $('loc').textContent = `📍 Jam dihitung buat ${L.n} · ganti pakai lokasiku`;
  paintOt();
  try { $('bd-st').textContent = BD.status ? BD.status() : ''; } catch (e) {}
}
// ═════ liat bulan bareng ═════
const looks = w => Object.entries(lsGet('bulan-' + w, {}) || {}).filter(([d]) => /^\d{4}-/.test(d)).map(([d, r]) => r && r.at).filter(Boolean);
function bareng() { const a = looks('Razan'), b = looks('Dara'); let n = 0; a.forEach(x => { if (b.some(y => Math.abs(x - y) < 45 * 6e4)) n++; }); return n; }
function paintOt() {
  const o = looks(OT).sort().pop(), m = looks(ME).sort().pop(), now = Date.now(), n = bareng();
  let h = '';
  if (o && now - o < 45 * 6e4 && m && Math.abs(o - m) < 45 * 6e4) h = `<div class="ot both">🌙 Kalian liat bulan barengan malam ini 🥹<br><small>Udah ${n}× liat bulan bareng</small></div>`;
  else if (o && now - o < 45 * 6e4) h = `<div class="ot">🌙 <b>${OT} lagi liat bulan</b> sejak ${new Date(o).getHours()}:${pad(new Date(o).getMinutes())} — liat ke langit juga yuk, terus tap tombolnya</div>`;
  else if (m && now - m < 45 * 6e4) h = `<div class="ot">Kamu lagi liat bulan 🌙 — ${OT} udah dikabarin</div>`;
  else if (n) h = `<div class="ot">🌙 Kalian udah ${n}× liat bulan bareng</div>`;
  $('ot').innerHTML = h;
}
$('look').onclick = () => {
  const now = Date.now(), last = (lsGet('bulan-' + ME, {}) || {})[TD()];
  if (last && now - last.at < 10 * 6e4) return toast('Udah dikabarin barusan 🌙');
  BD.put('bulan', ME, TD(), { at: now });
  const o = looks(OT).sort().pop(), both = o && now - o < 45 * 6e4;
  vib([20, 40, 20]); confetti(30, ['#fff3c4', '#f3d58c', '#ffffff', '#c6bcd8']);
  toast(both ? '🥹 Kalian liat bulan barengan!' : `🌙 ${OT} dikabarin`, 3000);
  try { window.Push && Push.notify({ title: both ? `🌙 ${ME} juga lagi liat bulan` : `🌙 ${ME} lagi liat bulan`, body: both ? 'Kalian liat bulan barengan sekarang 🥹🤍' : 'Liat ke langit juga yuk — kita liat bulan yang sama 🤍', url: 'bulan-malam-ini.html', tag: 'diary-bulan' }); } catch (e) {}
  render();
};
const TD = () => ymd(new Date());
$('loc').onclick = () => {
  if (!navigator.geolocation) return toast('HP ini ga bisa ambil lokasi');
  toast('📍 Lagi ambil lokasi…');
  navigator.geolocation.getCurrentPosition(p => { lsSet('bulan-loc', { lat: +p.coords.latitude.toFixed(2), lng: +p.coords.longitude.toFixed(2), n: 'lokasimu' }); toast('📍 Sip, jamnya udah pakai lokasimu'); render(); }, () => toast('Izin lokasinya ditolak — tetep pakai Jakarta ya'), { timeout: 15000, maximumAge: 36e5 });
};
BD.on(ev => { if (!ev.apps || !ev.apps.length || ev.apps.includes('bulan')) render(); });
setInterval(() => { if (!document.hidden) render(); }, 6e4);
render();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
