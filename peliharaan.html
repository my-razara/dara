<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Peliharaan Kita — Razan & Dara 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="pet.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:.1rem 0 .5rem}
  .room{position:relative;border-radius:28px;height:min(68vw,290px);margin-bottom:.7rem;overflow:hidden;background:linear-gradient(180deg,var(--warm) 0 62%,#e9d6c1 62% 100%);box-shadow:inset 0 -10px 30px rgba(0,0,0,.05);touch-action:none;user-select:none;-webkit-user-select:none}
  .room.dark{background:linear-gradient(180deg,#2b2540 0 62%,#3a3149 62% 100%)}
  .room .win{position:absolute;top:14%;left:9%;width:22%;aspect-ratio:1;border-radius:10px;background:linear-gradient(#bfe3f7,#e7f5fd);border:5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .room.dark .win{background:linear-gradient(#1b2246,#3b3f73)}
  .room .rug{position:absolute;left:50%;bottom:7%;width:58%;height:15%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(193,122,111,.35),rgba(193,122,111,.12) 70%,transparent 72%)}
  .room .shelf{position:absolute;top:16%;right:8%;font-size:20px;letter-spacing:.1em;border-bottom:4px solid #c9a27c;padding:0 .2rem}
  .pet{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);text-align:center;cursor:grab}
  .pet .pe{display:block;line-height:1;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
  .pet .pa{position:absolute;line-height:1;pointer-events:none}
  .pet .pa.top{top:-14%;left:50%;transform:translateX(-50%) rotate(-8deg)}.pet .pa.side{top:2%;right:-4%}.pet .pa.eye{top:30%;left:50%;transform:translateX(-50%)}.pet .pa.neck{bottom:-2%;left:50%;transform:translateX(-50%)}
  .f-tidur .pe{animation:breath 3.5s ease-in-out infinite;filter:saturate(.7) brightness(.85)}
  .f-sedih .pe,.f-ngambek .pe{animation:sad 3s ease-in-out infinite;filter:saturate(.75)}
  .f-senang .pe{animation:hop 1.6s ease-in-out infinite}
  .pet.jump .pe{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}
  @keyframes breath{50%{transform:scale(1.04,.96)}}
  @keyframes sad{50%{transform:rotate(-6deg) translateY(3px)}}
  @keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
  @keyframes jump{40%{transform:translateY(-26px) scale(1.12)}}
  .bub{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:.4rem .75rem;font-size:12px;color:var(--ink);max-width:78%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1);line-height:1.35}
  .zz{position:absolute;right:-18%;top:-10%;font-size:22px;animation:zz 2s ease-in-out infinite}
  @keyframes zz{50%{transform:translate(6px,-8px);opacity:.4}}
  .fx{position:absolute;pointer-events:none;font-size:20px;animation:fx 1s ease-out forwards;z-index:3}
  @keyframes fx{to{transform:translateY(-50px) scale(1.4);opacity:0}}
  .food-fly{position:absolute;font-size:30px;z-index:4;transition:all .55s cubic-bezier(.4,0,.6,1);pointer-events:none}
  .ball{position:absolute;font-size:34px;cursor:pointer;z-index:5;transition:none;padding:6px}
  .mode{position:absolute;left:0;right:0;bottom:.5rem;text-align:center;z-index:6}
  .mode span{display:inline-block;background:rgba(45,31,26,.85);color:#fff;font-size:11.5px;border-radius:50px;padding:.35rem .8rem}
  .mbar{height:6px;width:60%;margin:.35rem auto 0;border-radius:6px;background:rgba(255,255,255,.5);overflow:hidden}
  .mbar b{display:block;height:100%;width:0;background:var(--rose);transition:width .1s}
  .nm{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.15rem}
  .nm h2{font-size:1.25rem;color:var(--ink)}
  .lv{text-align:center;font-size:11px;color:var(--muted);margin-bottom:.4rem}
  .xp{height:6px;border-radius:6px;background:rgba(193,122,111,.15);overflow:hidden;max-width:220px;margin:0 auto .8rem}
  .xp b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose))}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:.45rem .8rem;margin-bottom:.8rem}
  .stat{font-size:11.5px}
  .stat div{display:flex;justify-content:space-between;margin-bottom:.2rem;color:var(--muted)}
  .stat i{display:block;height:9px;border-radius:9px;background:rgba(193,122,111,.13);overflow:hidden}
  .stat i b{display:block;height:100%;border-radius:9px;transition:width .5s}
  .acts{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-bottom:.9rem}
  .acts button{border:1.5px solid var(--blush);background:#fff;border-radius:16px;padding:.55rem 0 .45rem;font-size:10.5px;color:var(--deep);cursor:pointer;line-height:1.2}
  .acts button span{display:block;font-size:1.4rem;margin-bottom:.1rem}
  .acts button:active{transform:scale(.93)}
  .tabs{display:flex;gap:.25rem;margin-bottom:.8rem;background:var(--warm);border-radius:50px;padding:.25rem}
  .tabs button{flex:1;border:none;background:none;padding:.5rem .2rem;border-radius:50px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:#fff;color:var(--deep);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
  .opt{border:1.5px solid var(--blush);background:#fff;border-radius:16px;padding:.55rem .2rem .45rem;text-align:center;font-size:10.5px;color:var(--deep);cursor:pointer;line-height:1.25;position:relative}
  .opt span{display:block;font-size:1.7rem;margin-bottom:.1rem}
  .opt.on{border-color:var(--rose);background:var(--warm);box-shadow:0 3px 10px rgba(193,122,111,.2)}
  .opt.lock{opacity:.45;cursor:default}
  .opt small{display:block;font-size:9px;color:var(--muted)}
  .lg{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:14px;padding:.55rem .7rem;margin-bottom:.35rem;font-size:12px;border:1px solid rgba(193,122,111,.1)}
  .lg span{font-size:1.2rem}.lg small{margin-left:auto;color:var(--muted);font-size:10.5px;white-space:nowrap}
  .info{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.8rem}
  .info div{background:var(--warm);border-radius:14px;padding:.5rem .2rem;text-align:center}
  .info b{display:block;font-size:1.05rem;color:var(--deep)}.info small{font-size:9.5px;color:var(--muted)}
  .setup h3{text-align:center;font-size:15px;margin:.4rem 0 .6rem}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><span class="pill" id="me-pill" style="cursor:default"></span></div>
  <p class="bd-st" id="bd-st"></p>
  <div id="app"></div>
</div>
<div class="ov" id="food-ov"><div class="sheet"><div class="drag"></div><h3 style="text-align:center;font-size:15px;margin-bottom:.6rem">Mau kasih makan apa?</h3><div class="grid" id="foods"></div><p class="sub" style="text-align:center;font-size:11px;margin-top:.6rem" id="fav-tip"></p></div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const POS = { pita: 'side', bunga: 'side', topi: 'top', kacamata: 'eye', syal: 'neck', mahkota: 'top', toga: 'top' };
const COL = { k: '#e8a25a', s: '#e87a95', b: '#6fb3e0', e: '#e8c94a' };
let tab = lsGet('pet-tab', 'kamar'), busy = false, setupSel = { a: 'kucing', n: '' };
const BDx = window.Berdua;
function bdStatus() { const el = $('bd-st'); if (!BDx) return; el.textContent = BDx.status(); }
function meName() { return Pet.me(); }
$('me-pill').textContent = `🙋 ${meName()}`;
function closeOv(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));

function render() {
  bdStatus();
  const st = Pet.state();
  if (!st) return renderSetup(true);
  if (tab === 'ganti') return renderSetup(false, st);
  const A = Pet.animal(st.a), v = Pet.now(st), L = Pet.lvl(st.xp), S = Pet.stage(L), md = Pet.mood(st), acc = Pet.accOf(st.acc);
  const x0 = Pet.lvlXp(L), x1 = Pet.lvlXp(L + 1), sz = Math.round(96 * S.sc), night = Pet.asleep(st);
  const days = Math.max(1, Math.floor((Date.now() - st.born) / 864e5) + 1);
  $('app').innerHTML = `
    <div class="nm"><h2>${esc(st.n || A.n)}</h2></div>
    <p class="lv">${A.e} ${A.n} · Lv ${L} ${S.n} · ${st.xp - x0}/${x1 - x0} XP</p>
    <div class="xp"><b style="width:${Math.round((st.xp - x0) / (x1 - x0) * 100)}%"></b></div>
    <div class="room ${night ? 'dark' : ''}" id="room"><div class="win"></div><div class="shelf">🪴📚🧸</div><div class="rug"></div>
      <div class="bub" id="bub">${md.t}</div>
      <div class="pet f-${md.f}" id="pet"><span class="pe" style="font-size:${sz}px">${A.e}</span>${acc.e ? `<span class="pa ${POS[acc.k] || 'side'}" style="font-size:${Math.round(sz * .42)}px">${acc.e}</span>` : ''}${night ? '<span class="zz">💤</span>' : ''}</div>
      <div class="mode" id="mode"></div></div>
    <div class="stats">${Pet.STATS.map(([k, ic, n]) => `<div class="stat"><div><span>${ic} ${n}</span><b>${Math.round(v[k])}%</b></div><i><b style="width:${Math.round(v[k])}%;background:${v[k] < 30 ? '#e05a5a' : COL[k]}"></b></i></div>`).join('')}</div>
    <div class="acts">${Object.entries(Pet.ACTS).map(([k, ic]) => `<button data-a="${k}"><span>${ic}</span>${{ makan: 'Makan', elus: 'Elus', mandi: 'Mandi', main: 'Main', tidur: 'Tidur' }[k]}</button>`).join('')}</div>
    <div class="tabs" id="tabs"><button data-t="kamar">📒 Riwayat</button><button data-t="lemari">👗 Lemari</button><button data-t="ganti">⚙️ Ganti</button></div>
    <div id="sub"></div>`;
  $('app').querySelectorAll('.acts button').forEach(b => b.onclick = () => start(b.dataset.a));
  $('tabs').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.t === (tab === 'ganti' ? 'ganti' : tab)); b.onclick = () => { tab = b.dataset.t; lsSet('pet-tab', tab === 'ganti' ? 'kamar' : tab); render(); }; });
  if (tab === 'lemari') {
    $('sub').innerHTML = `<div class="grid">${Pet.ACC.map(a => { const lock = L < a.lv; return `<button class="opt ${a.k === (st.acc || '') ? 'on' : ''} ${lock ? 'lock' : ''}" data-k="${a.k}" ${lock ? 'disabled' : ''}><span>${a.e || '✖️'}</span>${a.n}${lock ? `<small>🔒 Lv ${a.lv}</small>` : ''}</button>`; }).join('')}</div><p class="sub" style="text-align:center;font-size:11px;margin-top:.6rem">Naik level buat buka aksesoris baru — tiap ngurus dapet XP ✨</p>`;
    $('sub').querySelectorAll('.opt:not(.lock)').forEach(b => b.onclick = () => { Pet.setup({ acc: b.dataset.k }); vib(10); render(); });
  } else {
    $('sub').innerHTML = `<div class="info"><div><b>${days}</b><small>hari bareng</small></div><div><b>🔥 ${Pet.streak(st)}</b><small>hari dirawat</small></div><div><b>${st.xp}</b><small>total XP</small></div></div>` +
      (st.log.map(l => `<div class="lg"><span>${Pet.ACTS[l.a] || '🐾'}</span><span style="font-size:12px"><b style="color:var(--${l.w === 'Razan' ? 'rz' : 'dr'})">${l.w}</b> ${Pet.ACTN[l.a] || l.a}</span><small>${Pet.ago(l.t)}</small></div>`).join('') || '<p class="empty">Belum ada yang ngurus. Mulai yuk!</p>');
  }
  bindRub();
}

// ── adopsi / ganti ──
function renderSetup(first, st) {
  if (st) setupSel = { a: st.a, n: st.n || '' };
  $('app').innerHTML = `<div class="setup">${first ? '<div class="head"><span class="ico">🐾</span><p class="lbl">Peliharaan berdua</p><h1 class="title">Adopsi <span>Yuk</span></h1><p class="sub">Satu peliharaan buat kalian berdua. Yang ngasih makan di HP satu, keliatan di HP satunya 💕</p></div>' : '<div class="tabs" id="tabs"><button data-t="kamar">← Balik ke kamar</button></div>'}
    <h3>Pilih hewannya</h3><div class="grid" id="ans">${Pet.ANIMALS.map(a => `<button class="opt ${a.k === setupSel.a ? 'on' : ''}" data-k="${a.k}"><span>${a.e}</span>${a.n}</button>`).join('')}</div>
    <h3>Kasih nama</h3><input class="inp" id="pn" maxlength="14" placeholder="Mochi, Boba, Kiko…" value="${esc(setupSel.n)}">
    <button class="btn" id="go" style="margin-top:.8rem">${first ? '🐾 Adopsi sekarang' : '💾 Simpan'}</button>
    ${first ? '' : '<p class="sub" style="text-align:center;font-size:11px;margin-top:.6rem">Level, XP & aksesoris tetep kebawa walaupun ganti hewan.</p>'}</div>`;
  $('ans').querySelectorAll('.opt').forEach(b => b.onclick = () => { setupSel.a = b.dataset.k; setupSel.n = $('pn').value; renderSetup(first, null); });
  if (!first) $('tabs').querySelector('button').onclick = () => { tab = 'kamar'; render(); };
  $('go').onclick = () => {
    const n = $('pn').value.trim(); if (!n) { toast('Kasih nama dulu ya 🥰'); $('pn').focus(); return; }
    Pet.setup({ a: setupSel.a, n }); tab = 'kamar'; confetti(50); vib([20, 30, 20]);
    toast(first ? `🎉 Selamat datang, ${n}!` : '💾 Kesimpen'); render();
  };
}

// ── efek ──
function fx(ch, x, y) { const r = $('room'); if (!r) return; const e = document.createElement('span'); e.className = 'fx'; e.textContent = ch; e.style.left = x + 'px'; e.style.top = y + 'px'; r.appendChild(e); setTimeout(() => e.remove(), 1100); }
function petBox() { const p = $('pet'), r = $('room'); if (!p || !r) return null; const a = p.getBoundingClientRect(), b = r.getBoundingClientRect(); return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2, w: a.width, h: a.height }; }
function done(r) {
  busy = false; $('mode') && ($('mode').innerHTML = '');
  if (r.up) { toast(`🎉 ${Pet.state().n} naik ke level ${r.up}!`); confetti(60); try { window.SFX && SFX.play('win'); } catch (e) {} }
  else toast(r.msg);
  vib(r.ok ? 15 : [30, 30, 30]);
  render();
  if (r.ok) { const p = $('pet'); if (p) { p.classList.add('jump'); const b = petBox(); for (let i = 0; i < 5; i++) setTimeout(() => fx(['💕', '✨', '💗', '⭐', '🫶'][i], b.x - 40 + i * 18, b.y - 30), i * 80); } try { window.SFX && SFX.play('pop'); } catch (e) {} }
}
function start(a) {
  if (busy) return; const st = Pet.state(); if (!st) return;
  if (a === 'makan') return openFood();
  if (a === 'mandi') return modeRub('mandi');
  if (a === 'elus') return modeRub('elus');
  if (a === 'main') return play();
  if (a === 'tidur') return done(Pet.act('tidur'));
}
// makan: pilih makanan, terbang ke mulut
function openFood() {
  const st = Pet.state(), A = Pet.animal(st.a), fav = Pet.FOODS.find(f => f.k === A.fav);
  $('foods').innerHTML = Pet.FOODS.map(f => `<button class="opt" data-k="${f.k}"><span>${f.e}</span>${f.n}${f.k === A.fav ? '<small>⭐ favorit</small>' : ''}</button>`).join('');
  $('fav-tip').textContent = `Makanan favorit ${st.n}: ${fav.e} ${fav.n} — kenyangnya lebih banyak!`;
  $('foods').querySelectorAll('.opt').forEach(b => b.onclick = () => { closeOv('food-ov'); feed(b.dataset.k); });
  $('food-ov').classList.add('show');
}
function feed(k) {
  const f = Pet.FOODS.find(x => x.k === k), room = $('room'), b = petBox(); if (!room || !b) return;
  busy = true; const e = document.createElement('span'); e.className = 'food-fly'; e.textContent = f.e; e.style.left = '12px'; e.style.top = (room.clientHeight - 60) + 'px'; room.appendChild(e);
  requestAnimationFrame(() => requestAnimationFrame(() => { e.style.left = (b.x - 15) + 'px'; e.style.top = (b.y - 10) + 'px'; e.style.transform = 'scale(.4)'; e.style.opacity = '.3'; }));
  setTimeout(() => { e.remove(); done(Pet.act('makan', { food: k })); }, 600);
}
// elus / mandi: usap-usap hewannya
let rub = null;
function modeRub(kind) {
  const st = Pet.state(); if (kind === 'mandi' && Pet.now(st).b >= 92) { toast(`${st.n} masih wangi kok ✨`); return; }
  if (kind === 'mandi' && Pet.asleep(st)) { toast(`${st.n} lagi bobo 💤`); return; }
  busy = true; rub = { kind, n: 0, need: kind === 'mandi' ? 60 : 30 };
  $('mode').innerHTML = `<span>${kind === 'mandi' ? '🧽 Gosok-gosok hewannya sampai berbusa!' : '🤲 Usap-usap hewannya pakai jari'}</span><div class="mbar"><b id="rb"></b></div>`;
  setTimeout(() => { if (rub && rub.n === 0) { rub = null; busy = false; $('mode').innerHTML = ''; } }, 9000);
}
function bindRub() {
  const room = $('room'); if (!room) return; let last = null;
  room.onpointerdown = e => { if (!rub) return; last = [e.clientX, e.clientY]; room.setPointerCapture(e.pointerId); };
  room.onpointermove = e => {
    if (!rub || !last) return; const d = Math.hypot(e.clientX - last[0], e.clientY - last[1]); if (d < 12) return; last = [e.clientX, e.clientY];
    const r = room.getBoundingClientRect(), b = petBox(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.abs(x - b.x) > b.w * .8 || Math.abs(y - b.y) > b.h * .8) return;
    rub.n++; if (rub.n % 3 === 0) fx(rub.kind === 'mandi' ? '🫧' : ['💕', '✨', '💗'][rub.n % 3], x - 10, y - 10);
    if (rub.n % 6 === 0) vib(5);
    const rb = $('rb'); if (rb) rb.style.width = Math.min(100, rub.n / rub.need * 100) + '%';
    if (rub.n >= rub.need) { const k = rub.kind; rub = null; last = null; done(Pet.act(k)); }
  };
  room.onpointerup = room.onpointercancel = () => { last = null; };
}
// main: tangkep bola 10 detik
function play() {
  const st = Pet.state(), v = Pet.now(st);
  if (Pet.asleep(st)) { toast(`${st.n} lagi bobo 💤`); return; }
  if (v.e < 15) { toast(`${st.n} capek 😪 tidurin dulu`); return; }
  const room = $('room'); busy = true; let score = 0, left = 10;
  const ball = document.createElement('span'); ball.className = 'ball'; ball.textContent = ['🎾', '🧶', '🦴', '🪀'][Math.floor(Math.random() * 4)]; room.appendChild(ball);
  const move = () => { ball.style.left = (10 + Math.random() * (room.clientWidth - 70)) + 'px'; ball.style.top = (40 + Math.random() * (room.clientHeight - 110)) + 'px'; };
  move(); const iv = setInterval(move, 900);
  ball.onpointerdown = e => { e.stopPropagation(); score++; vib(8); const r = room.getBoundingClientRect(); fx('⭐', e.clientX - r.left - 10, e.clientY - r.top - 10); move(); clearInterval(ball._t); };
  $('mode').innerHTML = `<span id="pm">🎾 Tangkep mainannya! 10 detik · 0</span>`;
  const t = setInterval(() => { left--; const pm = $('pm'); if (pm) pm.textContent = `🎾 Tangkep mainannya! ${left} detik · ${score}`; if (left <= 0) { clearInterval(t); clearInterval(iv); ball.remove(); const r = Pet.act('main', { score }); if (r.ok && !r.up) r.msg = `🎾 Ketangkep ${score}x! ${st.n} seneng banget`; done(r); } }, 1000);
}
try { BDx && BDx.on(ev => { if (ev.apps && ev.apps.includes('pet') && !busy && !document.querySelector('.ov.show') && document.activeElement !== $('pn')) render(); else if (!ev.apps || !ev.apps.length) bdStatus(); }); } catch (e) {}
setInterval(() => { if (!document.hidden && !busy && document.activeElement !== $('pn')) render(); }, 60000);
render();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
