<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');

    <h3>Pilih hewannya</h3><div class="grid" id="ans">${Pet.ANIMALS.map(a => `<button class="opt ${a.k === setupSel.a ? 'on' : ''}" data-k="${a.k}"><span class="th big" data-th="animal:${a.k}">${a.e}</span><span class="nm2">${a.n}</span></button>`).join('')}</div>
    <h3>Kasih nama</h3><input class="inp" id="pn" maxlength="14" placeholder="Mochi, Boba, Kiko…" value="${esc(setupSel.n)}">
    <button class="btn" id="go" style="margin-top:.8rem">${first ? '🐾 Adopsi sekarang' : '💾 Simpan'}</button>
    ${first ? '' : '<p class="sub" style="text-align:center;font-size:11px;margin-top:.6rem">Level, XP, koin & baju tetep kebawa walaupun ganti hewan.</p>'}</div>`;
  fillThumbs(); if (first && v3state === 'load' && !window.__p3l) { window.__p3l = 1; load3D(); }
  $('ans').querySelectorAll('.opt').forEach(b => b.onclick = () => { setupSel.a = b.dataset.k; setupSel.n = $('pn').value; keepSel = true; renderSetup(first, st); keepSel = false; });
  $('go').onclick = () => {
    const n = $('pn').value.trim(); if (!n) { toast('Kasih nama dulu ya 🥰'); $('pn').focus(); return; }
    Pet.setup({ a: setupSel.a, n }); panel = 'room'; confetti(50); vib([20, 30, 20]);
    toast(first ? `🎉 Selamat datang, ${n}!` : '💾 Kesimpen'); render();
  };
}

// ── efek ──
function fx(ch, x, y) { const r = $('room'); if (!r) return; const e = document.createElement('span'); e.className = 'fx'; e.textContent = ch; e.style.left = x + 'px'; e.style.top = y + 'px'; r.appendChild(e); setTimeout(() => e.remove(), 1100); }
function petBox() {
  const r = $('room'); if (!r) return null; const b = r.getBoundingClientRect();
  if (V) { const h = V.screenPos('head'); return { x: h.x, y: h.y + b.height * .12, w: b.width * .34, h: b.height * .62, mx: V.screenPos('mouth') }; }
  const p = $('pet2d'); if (!p) return null; const a = p.getBoundingClientRect(); return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2, w: a.width, h: a.height, mx: { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height * .55 } };
}
function done(r) {
  busy = false; $('mode') && ($('mode').innerHTML = '');
  if (r.up) { toast(`🎉 ${Pet.state().n} naik ke level ${r.up}! +${r.coin || 0} 🪙`); confetti(60); try { window.SFX && SFX.play('win'); } catch (e) {} }
  else toast(r.msg + (r.ok && r.coin ? ` · +${r.coin} 🪙` : ''));
  vib(r.ok ? 15 : [30, 30, 30]);
  paint();
  if (r.ok) { if (r.coin) coinPop(); if (V) V.react('jump'); const b = petBox(); if (b) for (let i = 0; i < 5; i++) setTimeout(() => fx(['💕', '✨', '💗', '⭐', '🫶'][i], b.x - 40 + i * 18, b.y - 30), i * 80); try { window.SFX && SFX.play('pop'); } catch (e) {} }
}
let tapT = 0;
function tapPet() {
  if (busy || rub || Pet.away(Pet.state())) return; const now = Date.now(); if (now - tapT < 450) return; tapT = now;
  if (V) V.react('giggle'); const b = petBox(); if (b) fx(['😆', '💗', '✨', '🤭'][Math.floor(Math.random() * 4)], b.x - 10, b.y - 40); vib(8);
}
function start(a) {
  if (busy) return; const st = Pet.state(); if (!st) return;
  if (a === 'mandi') return modeRub('mandi');
  if (a === 'elus') return modeRub('elus');
  if (a === 'tidur') return done(Pet.act('tidur'));
  if (a === 'bangun') return done(Pet.act('bangun'));
}
// makan: makanan terbang ke mulut, terus dikunyah
function feed(k) {
  if (busy) return; const st = Pet.state(), v = Pet.now(st), f = Pet.FOODS.find(x => x.k === k);
  if (Pet.asleep(st)) { toast(`${st.n} lagi bobo 💤 bangunin dulu di Kamar ☀️`); return; }
  if (v.k >= 95 && !f.treat) { toast(`${st.n} masih kenyang 😋`); if (V) V.react('nod'); return; }
  const room = $('room'), b = petBox(); if (!room || !b) return;
  busy = true; const e = document.createElement('span'); e.className = 'food-fly'; e.textContent = f.e; e.style.left = '12px'; e.style.top = (room.clientHeight - 60) + 'px'; room.appendChild(e);
  requestAnimationFrame(() => requestAnimationFrame(() => { e.style.left = (b.mx.x - 15) + 'px'; e.style.top = (b.mx.y - 15) + 'px'; e.style.transform = 'scale(.45)'; e.style.opacity = '.4'; }));
  setTimeout(() => { e.remove(); if (V) V.eat(1300); }, 560);
  setTimeout(() => done(Pet.act('makan', { food: k })), V ? 1500 : 650);
}
// elus / mandi: usap-usap hewannya
let rub = null;
function modeRub(kind) {
  const st = Pet.state(); if (kind === 'mandi' && Pet.now(st).b >= 92) { toast(`${st.n} masih wangi kok ✨`); return; }
  if (kind === 'mandi' && Pet.asleep(st)) { toast(`${st.n} lagi bobo 💤 bangunin dulu di Kamar ☀️`); return; }
  busy = true; rub = { kind, n: 0, need: kind === 'mandi' ? 55 : 28 };
  $('mode').innerHTML = `<span>${kind === 'mandi' ? '🧽 Gosok-gosok badannya sampai berbusa!' : '🤲 Usap-usap pakai jari'}</span><div class="mbar"><b id="rb"></b></div>`;
  setTimeout(() => { if (rub && rub.n === 0) { rub = null; busy = false; $('mode').innerHTML = ''; } }, 9000);
}
function bindRub() {
  const room = $('room'); if (!room) return; let last = null;
  room.addEventListener('pointerdown', e => { if (!rub) return; last = [e.clientX, e.clientY]; try { room.setPointerCapture(e.pointerId); } catch (er) {} }, true);
  room.addEventListener('pointermove', e => {
    if (!rub || !last) return; const d = Math.hypot(e.clientX - last[0], e.clientY - last[1]); if (d < 12) return; last = [e.clientX, e.clientY];
    const r = room.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (V) { if (!V.hit(e.clientX, e.clientY)) return; } else { const b = petBox(); if (Math.abs(x - b.x) > b.w * .8 || Math.abs(y - b.y) > b.h * .8) return; }
    rub.n++;
    if (rub.kind === 'mandi') { if (V && rub.n % 2 === 0) V.foam(1); if (rub.n % 3 === 0) fx('🫧', x - 10, y - 10); }
    else if (rub.n % 3 === 0) fx(['💕', '✨', '💗'][rub.n % 3], x - 10, y - 10);
    if (rub.n % 6 === 0) { vib(5); if (V && rub.kind === 'elus') V.react('giggle'); }
    const rb = $('rb'); if (rb) rb.style.width = Math.min(100, rub.n / rub.need * 100) + '%';
    if (rub.n >= rub.need) { const k = rub.kind; rub = null; last = null; if (k === 'mandi' && V) { fx('🚿', r.width / 2 - 14, 20); setTimeout(() => V.rinse(), 300); } done(Pet.act(k)); }
  });
  room.addEventListener('pointerup', () => { last = null; }); room.addEventListener('pointercancel', () => { last = null; });
}
// main: tangkap bola / pop balon → koin
function play(kind) {
  if (busy) return; const st = Pet.state(), v = Pet.now(st);
  if (Pet.asleep(st)) { toast(`${st.n} lagi bobo 💤 bangunin dulu di Kamar ☀️`); return; }
  if (Pet.sick(st)) { toast(`${st.n} lagi sakit 🤒 belum kuat main`); return; }
  if (v.e < 15) { toast(`${st.n} capek 😪 tidurin dulu`); return; }
  if (v.k < 10) { toast(`${st.n} kelaperan, kasih makan dulu 🥺`); return; }
  const room = $('room'); busy = true; let score = 0, left = kind === 'bola' ? 10 : 12; const els = [];
  const label = () => `${kind === 'bola' ? '🎾 Tangkep mainannya!' : '🎈 Pecahin balonnya!'} ${left} detik · ${score}`;
  $('mode').innerHTML = `<span id="pm">${label()}</span>`;
  let iv;
  if (kind === 'bola') {
    const ball = document.createElement('span'); ball.className = 'ball'; ball.textContent = ['🎾', '🧶', '🦴', '🪀'][Math.floor(Math.random() * 4)]; room.appendChild(ball); els.push(ball);
    const move = () => { ball.style.left = (10 + Math.random() * (room.clientWidth - 70)) + 'px'; ball.style.top = (40 + Math.random() * (room.clientHeight - 120)) + 'px'; };
    move(); iv = setInterval(move, 900);
    ball.onpointerdown = e => { e.stopPropagation(); score++; vib(8); const r = room.getBoundingClientRect(); fx('⭐', e.clientX - r.left - 10, e.clientY - r.top - 10); move(); if (V && score % 3 === 0) V.react('jump'); $('pm').textContent = label(); };
  } else {
    const spawn = () => {
      const b = document.createElement('span'); b.className = 'balloon'; b.textContent = ['🎈', '🎈', '🎈', '💗'][Math.floor(Math.random() * 4)]; const dur = 2600 + Math.random() * 1600;
      b.style.left = (8 + Math.random() * (room.clientWidth - 60)) + 'px'; b.style.top = room.clientHeight + 'px'; b.style.transitionDuration = dur + 'ms'; room.appendChild(b); els.push(b);
      requestAnimationFrame(() => requestAnimationFrame(() => b.style.top = '-60px'));
      b.onpointerdown = e => { e.stopPropagation(); score++; vib(8); const r = room.getBoundingClientRect(); fx('💥', e.clientX - r.left - 12, e.clientY - r.top - 12); b.remove(); if (V && score % 3 === 0) V.react('jump'); $('pm').textContent = label(); };
      setTimeout(() => b.remove(), dur + 100);
    };
    spawn(); iv = setInterval(spawn, 520);
  }
  const t = setInterval(() => {
    left--; const pm = $('pm'); if (pm) pm.textContent = label();
    if (left <= 0) { clearInterval(t); clearInterval(iv); els.forEach(x => x.remove()); const r = Pet.act('main', { score: kind === 'bola' ? score : Math.round(score * .7) }); if (r.ok && !r.up) r.msg = `${kind === 'bola' ? '🎾 Ketangkep' : '🎈 Pecah'} ${score}x! ${st.n} seneng banget`; done(r); }
  }, 1000);
}
try { BDx && BDx.on(ev => { if (ev.apps && ev.apps.includes('pet') && !busy && document.activeElement !== $('pn')) render(); else if (!ev.apps || !ev.apps.length) bdStatus(); }); } catch (e) {}
setInterval(() => { if (!document.hidden && !busy && !preview && document.activeElement !== $('pn')) render(); }, 60000);
render(); if (!window.__p3l) { window.__p3l = 1; load3D(); }

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
