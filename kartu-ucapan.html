<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kartu Ucapan — Razan & Dara 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--rz:#4a7fc1;--dr:#d9776b;--c1:#f7d9cf;--c2:#c17a6f;--c3:#7a3f35}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .screen{display:none}.screen.on{display:block;animation:fi .35s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .head{text-align:center;margin:1rem 0 .9rem}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .2rem}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6}

  .occ{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.9rem}
  .occ button{border:1.5px solid var(--blush);background:#fff;border-radius:16px;padding:.7rem .3rem .6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:11.5px;color:var(--muted)}
  .occ button span{font-size:1.5rem}
  .occ button.on{border-color:var(--rose);background:var(--warm);color:var(--deep);font-weight:600;box-shadow:0 4px 12px rgba(193,122,111,.15)}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--deep);margin-bottom:.4rem}
  .card label small{font-weight:400;color:var(--muted)}
  .ta{width:100%;font-size:14px;padding:.75rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;resize:none;color:var(--ink);line-height:1.5}
  .ta:focus{border-color:var(--rose);background:#fff}
  .who{display:flex;gap:.45rem}
  .who button{flex:1;padding:.6rem .3rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;font-size:12.5px;color:var(--muted);cursor:pointer}
  .who button.on.Razan{background:var(--rz);border-color:var(--rz);color:#fff;font-weight:600}
  .who button.on.Dara{background:var(--dr);border-color:var(--dr);color:#fff;font-weight:600}
  .themes{display:flex;gap:.5rem;flex-wrap:wrap}
  .themes button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--blush);cursor:pointer}
  .themes button.on{box-shadow:0 0 0 2.5px var(--ink)}
  .idea{background:none;border:none;color:var(--rose);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:.4rem}
  .btn{display:block;width:100%;padding:.95rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.25)}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.3)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .row{display:flex;gap:.5rem;margin-top:.6rem}.row>*{flex:1}

  /* ── kartu ── */
  .stage{perspective:1400px;margin:1.2rem auto 0;width:min(320px,86vw);aspect-ratio:3/4;position:relative}
  .inner{position:absolute;inset:0;border-radius:14px;background:#fffdf8;box-shadow:0 18px 40px rgba(90,50,30,.22);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.4rem 1.2rem}
  .inner::before{content:'';position:absolute;inset:9px;border:1.5px dashed color-mix(in srgb,var(--c2) 45%,transparent);border-radius:10px;pointer-events:none}
  .pops{position:absolute;inset:0;pointer-events:none}
  .pops span{position:absolute;font-size:1.6rem;transform:scale(0) rotate(-20deg);transition:transform .6s cubic-bezier(.3,1.7,.5,1)}
  .stage.open .pops span{transform:scale(1) rotate(var(--r,0deg))}
  .in-to{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--c2);opacity:0;transition:opacity .6s .5s}
  .in-big{font-size:clamp(1.25rem,6vw,1.5rem);font-weight:700;color:var(--c3);line-height:1.2;margin:.2rem 0 .5rem;opacity:0;transition:opacity .6s .7s}
  .in-msg{font-family:'Caveat',cursive;font-size:clamp(1.15rem,5.4vw,1.4rem);line-height:1.3;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:52%;overflow-y:auto;opacity:0;transition:opacity .6s .9s}
  .in-from{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--c2);margin-top:.6rem;opacity:0;transition:opacity .6s 1.1s}
  .stage.open .in-to,.stage.open .in-big,.stage.open .in-msg,.stage.open .in-from{opacity:1}
  .cover{position:absolute;inset:0;border-radius:14px;transform-origin:left center;transition:transform 1.2s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d;cursor:pointer;z-index:3}
  .stage.open .cover{transform:rotateY(-165deg)}
  .cover .f,.cover .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .cover .f{background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:1.4rem;box-shadow:0 18px 40px rgba(90,50,30,.25)}
  .cover .f::after{content:'';position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.55);border-radius:10px}
  .cover .f .ic{font-size:4rem;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .cover .f h2{font-family:'Caveat',cursive;font-size:2.1rem;line-height:1.05;margin-top:.7rem;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  .cover .f small{font-size:11px;margin-top:.6rem;opacity:.9;letter-spacing:.06em}
  .cover .b{background:linear-gradient(150deg,#fffdf8,var(--c1));transform:rotateY(180deg)}
  .tap{text-align:center;font-size:12px;color:var(--muted);margin-top:1rem;min-height:1.4em}

  .hist{margin-top:1.4rem}
  .h-it{display:flex;align-items:center;gap:.7rem;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.13);border-radius:14px;padding:.6rem .8rem;margin-bottom:.45rem;cursor:pointer}
  .h-it .e{font-size:1.4rem}
  .h-it span{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.45}
  .h-it b{color:var(--ink);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.occ button{font-size:10.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="mk-btn" style="display:none" onclick="toCreate()">✍️ Bikin kartu</button></div>

  <!-- BIKIN -->
  <div class="screen on" id="s-create">
    <div class="head"><p class="lbl">Kartu ucapan digital</p><h1 class="title">Bikin <span>Kartu</span> 💌</h1><p class="sub">Pilih momennya, tulis pesannya, terus kirim link-nya lewat WA. Kartunya kebuka di HP dia ✨</p></div>
    <div class="occ" id="occ"></div>
    <div class="card"><label>Dari</label><div class="who" id="from"></div></div>
    <div class="card">
      <label for="msg">Pesan <small id="cnt"></small></label>
      <textarea class="ta" id="msg" rows="5" maxlength="400"></textarea>
      <button class="idea" onclick="idea()">💡 Ganti contoh pesan</button>
    </div>
    <div class="card"><label>Warna kartu</label><div class="themes" id="themes"></div></div>
    <button class="btn ghost" onclick="preview()">👀 Liat kartunya dulu</button>
    <a class="btn wa" id="send" style="margin-top:.6rem" target="_blank" rel="noopener">💬 Kirim ke <span id="to-name"></span></a>
    <div class="hist" id="hist"></div>
  </div>

  <!-- LIAT -->
  <div class="screen" id="s-view">
    <div class="stage" id="stage">
      <div class="inner" id="inner"></div>
      <div class="cover" id="cover"><div class="f" id="front"></div><div class="b"></div></div>
    </div>
    <p class="tap" id="tap">Tap kartunya buat buka 💌</p>
    <div id="view-act" style="margin-top:.8rem"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const OCC = {
  ultah: { e: '🎂', n: 'Ulang tahun', big: 'Selamat ulang tahun!', pops: ['🎈', '🎉', '🎁', '✨', '🎂', '🎊'], msgs: ['Selamat ulang tahun, sayangku. Semoga tahun ini isinya ketawa, sehat, dan semua yang kamu doain kejadian. Aku bakal ada di setiap harinya 🤍', 'Hari ini dunia ngerayain hari lahirnya orang paling aku sayang. Makasih udah lahir ya 🥹🎂'] },
  anniv: { e: '💍', n: 'Anniv / Mensive', big: 'Happy anniversary!', pops: ['💍', '💞', '🌹', '✨', '🥂', '💗'], msgs: ['Satu lagi bulan yang aku lewatin sama kamu, dan aku masih jatuh cinta sama orang yang sama. Happy mensive, sayang 💞', 'Makasih udah milih aku lagi dan lagi. Ke bulan-bulan berikutnya, bareng ya 🥂'] },
  semangat: { e: '🌻', n: 'Semangat', big: 'Semangat ya!', pops: ['🌻', '💪', '⭐', '☀️', '🍀', '✨'], msgs: ['Aku tau hari ini berat. Tapi kamu jauh lebih kuat dari yang kamu kira. Aku di sini, dan aku bangga sama kamu 🌻', 'Satu langkah aja dulu. Sisanya kita hadapin bareng. Semangat, sayangku 💪'] },
  kangen: { e: '🥺', n: 'Kangen', big: 'Aku kangen kamu', pops: ['🥺', '💭', '💗', '🫂', '🌙', '💌'], msgs: ['Kangen kamu. Kangen ketawa kamu, kangen cerita-cerita random kamu, kangen semuanya 🥺', 'Jarak boleh jauh, tapi kamu selalu paling deket di pikiran aku 💭'] },
  maaf: { e: '🙏', n: 'Maaf', big: 'Maafin aku ya…', pops: ['🙏', '🤍', '🕊️', '🌷', '🥺', '💐'], msgs: ['Maaf ya udah bikin kamu kesel. Aku dengerin, aku perbaiki. Kamu terlalu berharga buat aku sia-siain 🤍', 'Aku salah, dan aku minta maaf dengan tulus. Boleh peluk? 🥺'] },
  makasih: { e: '🤍', n: 'Makasih', big: 'Makasih ya, sayang', pops: ['🤍', '🌸', '✨', '💐', '🫶', '🍀'], msgs: ['Makasih udah sabar, udah perhatian, udah jadi rumah buat aku. Aku beruntung banget punya kamu 🤍', 'Hal kecil yang kamu lakuin hari ini berarti besar buat aku. Makasih 🫶'] },
  selamat: { e: '🎉', n: 'Selamat', big: 'Selamat yaa!', pops: ['🎉', '🏆', '🎊', '⭐', '👏', '✨'], msgs: ['Selamat! Aku tau kamu kerja keras banget buat ini, dan kamu pantes dapetinnya. Bangga banget sama kamu 🏆', 'Ini baru permulaan. Aku ga sabar liat kamu dapetin hal-hal hebat lainnya 🎉'] },
  malam: { e: '🌙', n: 'Selamat malam', big: 'Selamat tidur', pops: ['🌙', '⭐', '💤', '☁️', '✨', '🧸'], msgs: ['Udah malem, waktunya istirahat. Mimpiin yang indah-indah ya (aku boleh muncul) 🌙', 'Tidur yang nyenyak, sayang. Besok kita mulai lagi bareng 💤'] },
  sayang: { e: '💗', n: 'Sayang aja', big: 'Aku sayang kamu', pops: ['💗', '💕', '🌹', '✨', '🫶', '💞'], msgs: ['Ga ada alasan khusus. Cuma pengen bilang aku sayang kamu, banyak banget 💗', 'Kamu tuh alasan aku senyum tanpa sadar. Itu aja 🫶'] },
};
const THEMES = [['#f7d9cf', '#c17a6f', '#7a3f35'], ['#dbe7f7', '#4a7fc1', '#2f5378'], ['#efdcf7', '#9a6bc0', '#5b3a7d'], ['#d6e8d3', '#6f9a6a', '#3f6040'], ['#f6e3b8', '#c9a96e', '#6b4f28'], ['#ffd6e0', '#e06c8f', '#7d2f47']];
const POS = [[8, 8, -18], [78, 6, 15], [4, 78, 12], [80, 80, -12], [44, 3, 0], [86, 44, 20]];
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = '0', 2600); }
const other = w => w === 'Razan' ? 'Dara' : 'Razan';
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

// isi kartu dikemas ke dalam link (#k=...) → bisa dibuka di HP mana aja tanpa server
function pack(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unpack(s) { try { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const o = JSON.parse(decodeURIComponent(escape(atob(s)))); return o && OCC[o.o] && typeof o.m === 'string' ? o : null; } catch (e) { return null; } }
function linkOf(o) { return location.href.split('#')[0] + '#k=' + pack(o); }

let st = Object.assign({ o: 'sayang', f: 'Razan', t: 0, m: '' }, lsGet('kartu-draft', {}));
let ideaIdx = 0;
function save() { lsSet('kartu-draft', st); }
function paintCreate() {
  $('occ').innerHTML = Object.entries(OCC).map(([k, o]) => `<button data-k="${k}" class="${k === st.o ? 'on' : ''}"><span>${o.e}</span>${o.n}</button>`).join('');
  $('occ').querySelectorAll('button').forEach(b => b.onclick = () => { const keep = st.m && !Object.values(OCC).some(o => o.msgs.includes(st.m)); st.o = b.dataset.k; if (!keep) { ideaIdx = 0; st.m = OCC[st.o].msgs[0]; $('msg').value = st.m; } save(); paintCreate(); });
  $('from').innerHTML = ['Razan', 'Dara'].map(w => `<button data-w="${w}" class="${w} ${w === st.f ? 'on' : ''}">${w === 'Razan' ? '🙋‍♂️' : '🙋‍♀️'} ${w}</button>`).join('');
  $('from').querySelectorAll('button').forEach(b => b.onclick = () => { st.f = b.dataset.w; save(); paintCreate(); });
  $('themes').innerHTML = THEMES.map((t, i) => `<button data-i="${i}" class="${i === st.t ? 'on' : ''}" style="background:linear-gradient(135deg,${t[0]},${t[1]})" aria-label="warna ${i + 1}"></button>`).join('');
  $('themes').querySelectorAll('button').forEach(b => b.onclick = () => { st.t = +b.dataset.i; save(); paintCreate(); });
  if (!st.m) { st.m = OCC[st.o].msgs[0]; }
  if ($('msg').value !== st.m) $('msg').value = st.m;
  $('cnt').textContent = `${st.m.length}/400`;
  $('to-name').textContent = other(st.f);
  const card = cardObj();
  $('send').href = `https://wa.me/${WA[other(st.f)]}?text=${encodeURIComponent(`${OCC[st.o].e} Ada kartu ucapan buat kamu dari ${st.f}! Buka di sini:\n${linkOf(card)}`)}`;
  paintHist();
}
function cardObj() { return { o: st.o, f: st.f, m: st.m.trim() || OCC[st.o].msgs[0], t: st.t, d: Date.now() }; }
$('msg').addEventListener('input', () => { st.m = $('msg').value; save(); $('cnt').textContent = `${st.m.length}/400`; const card = cardObj(); $('send').href = `https://wa.me/${WA[other(st.f)]}?text=${encodeURIComponent(`${OCC[st.o].e} Ada kartu ucapan buat kamu dari ${st.f}! Buka di sini:\n${linkOf(card)}`)}`; });
function idea() { const ms = OCC[st.o].msgs; ideaIdx = (ideaIdx + 1) % ms.length; st.m = ms[ideaIdx]; $('msg').value = st.m; save(); paintCreate(); vib(8); }
function recordSent() { const sent = lsGet('kartu-sent', []); const c = cardObj(); sent.unshift(c); lsSet('kartu-sent', sent.slice(0, 30)); setTimeout(paintHist, 300); }
$('send').addEventListener('click', recordSent);
function paintHist() {
  const sent = lsGet('kartu-sent', []).map(c => ({ ...c, dir: 'kirim' })), got = lsGet('kartu-got', []).map(c => ({ ...c, dir: 'terima' }));
  const all = sent.concat(got).sort((a, b) => (b.d || 0) - (a.d || 0)).slice(0, 12);
  $('hist').innerHTML = all.length ? `<p class="lbl" style="text-align:center;margin-bottom:.5rem">📬 Kartu-kartu kita</p>` + all.map((c, i) => { const d = new Date(c.d || 0); return `<div class="h-it" data-i="${i}"><span class="e">${OCC[c.o].e}</span><span><b>${esc(c.m)}</b>${c.dir === 'kirim' ? `Dikirim ke ${other(c.f)}` : `Dari ${c.f}`} · ${d.getDate()} ${BULAN[d.getMonth()]}</span>›</div>`; }).join('') : '';
  $('hist').querySelectorAll('.h-it').forEach(el => el.onclick = () => showCard(all[+el.dataset.i], 'hist'));
}

/* ── tampilin kartu ── */
function showCard(c, mode) {
  const th = THEMES[c.t] || THEMES[0], O = OCC[c.o];
  const stg = $('stage'); stg.classList.remove('open');
  stg.style.setProperty('--c1', th[0]); stg.style.setProperty('--c2', th[1]); stg.style.setProperty('--c3', th[2]);
  $('front').innerHTML = `<span class="ic">${O.e}</span><h2>${O.big}</h2><small>untuk ${other(c.f)} · dari ${c.f}</small>`;
  $('inner').innerHTML = `<div class="pops">${O.pops.map((p, i) => `<span style="left:${POS[i][0]}%;top:${POS[i][1]}%;--r:${POS[i][2]}deg;transition-delay:${.6 + i * .08}s">${p}</span>`).join('')}</div>
    <p class="in-to">Buat ${other(c.f)},</p><p class="in-big">${O.big}</p><p class="in-msg">${esc(c.m)}</p><p class="in-from">— ${c.f} 🤍</p>`;
  $('tap').textContent = 'Tap kartunya buat buka 💌';
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-view'));
  $('mk-btn').style.display = '';
  const back = other(c.f);
  $('view-act').innerHTML = mode === 'got'
    ? `<button class="btn" onclick="replyTo('${c.f}')">✍️ Bales kartu buat ${c.f}</button>`
    : mode === 'preview' ? `<a class="btn wa" target="_blank" rel="noopener" href="${$('send').href}" onclick="recordSent()">💬 Kirim ke ${back}</a><button class="btn ghost" style="margin-top:.5rem" onclick="toCreate()">✏️ Ubah lagi</button>`
    : `<button class="btn ghost" onclick="toCreate()">← Balik</button>`;
  window.scrollTo(0, 0);
}
$('stage').addEventListener('click', () => {
  const s = $('stage'); if (s.classList.contains('open')) { s.classList.remove('open'); $('tap').textContent = 'Tap lagi buat buka 💌'; return; }
  s.classList.add('open'); $('tap').textContent = 'Tap buat nutup';
  vib([20, 40, 30]); setTimeout(() => confetti(50), 700);
});
function replyTo(w) { st.f = other(w); st.m = ''; save(); history.replaceState(null, '', location.pathname); toCreate(); }
function toCreate() { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-create')); $('mk-btn').style.display = 'none'; paintCreate(); window.scrollTo(0, 0); }
function preview() { if (!st.m.trim()) { st.m = OCC[st.o].msgs[0]; } showCard(cardObj(), 'preview'); }
function confetti(n) {
  const th = THEMES[0]; const colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#fff', '#7eb3f5'];
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}

// buka dari link?
function route() {
  const m = /#k=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) {
    const c = unpack(m[1]);
    if (c) {
      const got = lsGet('kartu-got', []); if (!got.some(x => x.d === c.d && x.m === c.m)) { got.unshift(c); lsSet('kartu-got', got.slice(0, 30)); }
      showCard(c, 'got'); return;
    }
    toast('Link kartunya rusak 😢');
  }
  toCreate();
}
window.addEventListener('hashchange', route);
route();

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
