<!DOCTYPE html>
<html lang="id">
<head>

<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:normal;line-height:1.3}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .mh{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:0 0 .7rem}
  .mh b{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:700;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mh button{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--blush);background:#fff;color:var(--rose);font-size:1rem;cursor:pointer}
  .mh .td{width:auto;border-radius:50px;padding:0 .7rem;font-size:11px;font-weight:600;height:30px}
  .sum{background:linear-gradient(135deg,#fff,#fdf0ec);border:1px solid rgba(193,122,111,.18);border-radius:20px;padding:.9rem 1rem;margin-bottom:.9rem}
  .sum .t{font-size:13px;color:var(--ink);line-height:1.5}
  .sum .t b{color:var(--deep)}
  .sum .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin:.65rem 0 .2rem}
  .sum .nums div{background:#fff;border-radius:14px;padding:.5rem .3rem;text-align:center;font-size:10px;color:var(--muted);line-height:1.3;min-width:0}
  .sum .nums b{display:block;font-size:13px;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum .home{font-size:11.5px;margin-top:.55rem;line-height:1.5;color:var(--muted)}
  .sum .home.ok{color:#2e7d4f}
  .sum .mix{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
  .sum .mix span{font-size:11px;background:#fff;border-radius:50px;padding:.2rem .55rem;color:var(--ink)}
  .wk{display:flex;gap:.7rem;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid rgba(193,122,111,.13);border-left:5px solid var(--c,#e8c4b0);border-radius:18px;padding:.8rem .85rem;margin-bottom:.6rem;cursor:pointer;box-shadow:0 4px 16px rgba(193,122,111,.05);position:relative}
  .wk.now{box-shadow:0 0 0 2px var(--c,#c17a6f),0 6px 18px rgba(193,122,111,.15)}
  .wk.past{opacity:.78}
  .wk .no{flex-shrink:0;width:2.6rem;text-align:center}
  .wk .no b{display:block;font-size:1.7rem;line-height:1}
  .wk .no small{display:block;font-size:9.5px;color:var(--muted);margin-top:.25rem;line-height:1.25}
  .wk .m{flex:1;min-width:0}
  .wk .dt{font-size:10.5px;color:var(--muted);font-weight:500}
  .wk .k{font-size:14px;font-weight:700;margin:.1rem 0 .15rem;line-height:1.3;overflow-wrap:anywhere}
  .wk .tj{font-size:12px;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  .wk ul{list-style:none;margin:.3rem 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
  .wk li{overflow-wrap:anywhere}
  .wk li::before{content:'• ';color:var(--c,#c17a6f)}
  .wk .bt{display:inline-block;margin-top:.4rem;font-size:11px;font-weight:600;color:var(--deep);background:#fdf3ea;border-radius:50px;padding:.18rem .6rem}
  .wk .empty{font-size:12.5px;color:var(--muted);line-height:1.5;padding:.35rem 0}
  .wk .tag{position:absolute;top:.55rem;right:.6rem;font-size:9.5px;font-weight:700;border-radius:50px;padding:.12rem .5rem;background:var(--c,#c17a6f);color:#fff}
  .wk .tag.done{background:#2e7d4f}
  .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
  .opts button{border:1.5px solid var(--blush);background:#fff;border-radius:16px;padding:.55rem .25rem;font-size:11px;color:var(--muted);cursor:pointer;line-height:1.25;min-width:0;overflow-wrap:anywhere}
  .opts button span{display:block;font-size:1.4rem;margin-bottom:.1rem}
  .opts button small{display:block;font-size:9.5px;opacity:.8}
  .opts button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);font-weight:600}
  .opts .add{border-style:dashed;color:var(--rose)}
  .qb{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
  .qb button{font-size:11px;border:1px solid var(--blush);background:#fff;border-radius:50px;padding:.3rem .6rem;color:var(--muted);cursor:pointer}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:.35rem}
  .tog{display:flex;align-items:center;gap:.6rem;margin-top:.8rem;font-size:13px;cursor:pointer;background:#fff;border-radius:14px;padding:.65rem .8rem;border:1.5px solid var(--blush)}
  .tog.on{border-color:#2e7d4f;background:#eefaf2}
  .tog i{font-style:normal;font-size:1.2rem}
  .cu{display:flex;align-items:center;gap:.5rem;background:#fff;border-radius:14px;padding:.5rem .7rem;margin-top:.4rem;font-size:13px}
  .cu span{flex:1;min-width:0;overflow-wrap:anywhere}
  .cu button{border:none;background:#fff1ee;color:#b4554a;border-radius:50px;font-size:11px;padding:.3rem .65rem;cursor:pointer;flex-shrink:0}
  .h4{font-size:14px;font-weight:700;color:var(--deep);text-align:center;margin-bottom:.2rem}
  .h4s{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:.4rem}
  .lk{display:block;text-align:center;font-size:12px;color:var(--rose);margin:.4rem 0 0;text-decoration:none}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a class="pill" href="index.html">← Beranda</a><a class="pill" href="jadwal-kita.html">📅 Jadwal Kita</a></div>
  <div class="head"><span class="ico">🗓️</span><div class="lbl">Rencana Weekend Berdua</div><h1 class="title">Jadwal <span>Mingguan</span></h1>
    <p class="sub">Tiap minggu mau ke mana, ngapain aja, budget berapa — kalian yang pilih sendiri biar terstruktur.</p></div>
  <div class="bd-st" id="bd-st"></div>
  <div class="mh"><button id="m-prev" aria-label="Bulan sebelumnya">‹</button><b id="m-name"></b><button id="m-next" aria-label="Bulan berikutnya">›</button></div>
  <div class="sum" id="sum"></div>

  <div class="row"><button class="btn ghost" id="b-opsi">⚙️ Atur opsi</button><button class="btn ghost" id="b-copy">📋 Salin jadwal</button></div>
  <a class="lk" href="ketemuan.html">💑 Mau atur ketemuan detail? Buka Ketemuan →</a>
</div>

<div class="ov" id="ov-ed"><div class="sheet" id="ed"></div></div>
<div class="ov" id="ov-op"><div class="sheet" id="op"></div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), status: () => '', on() {}, enabled: false };
const me = (window.Who && Who.me()) || BD.me();
const BASE = [
  { id: 'taman', e: '🌳', n: 'Ke Taman', c: '#5e9e63', ph: 'Taman mana?' },
  { id: 'nobi', e: '🎬', n: 'Nobi', c: '#7a6ac9', ph: 'Di mana / film apa?' },
  { id: 'larpag', e: '🏃', n: 'Larpag', s: 'CFD', c: '#e08a3c', ph: 'CFD di mana?' },
  { id: 'jauh', e: '🗺️', n: 'Pergi Jauh', s: 'tempat baru', c: '#3f8fb5', ph: 'Mau ke tempat baru mana?' },
  { id: 'rumah', e: '🏠', n: 'Istirahat', s: 'full di rumah', c: '#a9845a', ph: 'Di rumah aja' },
  { id: 'cafe', e: '☕', n: 'Makan ke Cafe', c: '#c17a6f', ph: 'Cafe apa?' }
];
const PAL = ['#d4728f', '#4a9a8c', '#8a6fc2', '#d39a3b', '#5b86c9', '#b76a52'];
const rp = n => 'Rp' + Math.round(+n || 0).toLocaleString('id-ID');
const rpS = n => { n = +n || 0; return n >= 1e6 ? 'Rp' + (n / 1e6).toFixed(n % 1e6 ? 1 : 0).replace('.', ',') + 'jt' : n >= 1e3 ? 'Rp' + Math.round(n / 1e3) + 'rb' : rp(n); };
const num = s => +String(s || '').replace(/[^\d]/g, '') || 0;

// ── data (dua-duanya bisa ngedit; yang paling baru yang dipakai) ──
const rowsOf = w => lsGet('mingguan-' + w, {}) || {};
function plan(date) { let best = null; ['Razan', 'Dara'].forEach(w => { const r = rowsOf(w)[date]; if (r && r.at && (!best || r.at > best.at)) best = r; }); return best && !best.del ? best : null; }
function savePlan(date, data) { BD.put('mingguan', me, date, Object.assign({}, data, { at: Date.now(), by: me })); }
function customs() {
  const m = {};
  ['Razan', 'Dara'].forEach(w => (((lsGet('mingguanopsi-' + w, {}) || {})['2000-01-01'] || {}).list || []).forEach(o => { if (o && o.id && (!m[o.id] || o.at > m[o.id].at)) m[o.id] = o; }));
  return Object.values(m).filter(o => !o.del).sort((a, b) => a.at0 - b.at0);
}
function saveCustom(o) {
  const cur = ((lsGet('mingguanopsi-' + me, {}) || {})['2000-01-01'] || {}).list || [];
  const list = cur.filter(x => x.id !== o.id).concat([Object.assign({}, o, { at: Date.now() })]).slice(-40);
  BD.put('mingguanopsi', me, '2000-01-01', { list });
}
function allOpts() { return BASE.concat(customs().map((o, i) => Object.assign({ c: PAL[i % PAL.length], ph: 'Ke mana?' }, o))); }
const optOf = k => allOpts().find(o => o.id === k) || null;

// ── minggu = weekend (Sabtu–Minggu). Jumlahnya ngikutin ada berapa Sabtu di bulan itu ──
function weeksOf(y, m) {
  const out = []; const d = new Date(y, m, 1);
  while (d.getDay() !== 6) d.setDate(d.getDate() + 1);
  while (d.getMonth() === m) { const sat = new Date(d), sun = new Date(d); sun.setDate(sun.getDate() + 1); out.push({ sat, sun, key: ymd(sat) }); d.setDate(d.getDate() + 7); }
  return out;
}
const rangeLbl = w => w.sat.getMonth() === w.sun.getMonth() ? `Sab ${w.sat.getDate()} – Min ${w.sun.getDate()} ${BLN[w.sun.getMonth()]}` : `Sab ${w.sat.getDate()} ${BLN[w.sat.getMonth()]} – Min ${w.sun.getDate()} ${BLN[w.sun.getMonth()]}`;
function stateOf(w) { const t = today0(), mon = new Date(w.sat); mon.setDate(mon.getDate() - 5); return t > w.sun ? 'past' : t >= mon ? 'now' : 'next'; }

let view = (() => { const t = today0(); return new Date(t.getFullYear(), t.getMonth(), 1); })();

function render() {
  const y = view.getFullYear(), m = view.getMonth(), W = weeksOf(y, m);
  $('m-name').textContent = `${BULAN[m]} ${y}`;
  const P = W.map(w => plan(w.key));
  const filled = P.filter(Boolean), total = filled.reduce((a, p) => a + (+p.b || 0), 0);
  const spent = filled.filter(p => p.ok && p.kp != null && p.kp !== '').reduce((a, p) => a + (+p.kp || 0), 0);
  const done = filled.filter(p => p.ok).length, homeI = P.findIndex(p => p && p.k === 'rumah');
  const mix = {}; filled.forEach(p => { const o = optOf(p.k); if (o) mix[o.id] = (mix[o.id] || 0) + 1; });
  $('sum').innerHTML = `<div class="t">Bulan ini ada <b>${W.length} minggu</b> (${W.length} weekend) · udah direncanain <b>${filled.length}/${W.length}</b></div>
    <div class="nums"><div><b>${rpS(total)}</b>budget rencana</div><div><b>${spent ? rpS(spent) : '–'}</b>kepake beneran</div><div><b>${done}/${W.length}</b>udah jalan</div></div>
    ${Object.keys(mix).length ? `<div class="mix">${Object.entries(mix).map(([k, n]) => { const o = optOf(k); return `<span>${o.e} ${esc(o.n)} ×${n}</span>`; }).join('')}</div>` : ''}
    <div class="home ${homeI >= 0 ? 'ok' : ''}">${homeI >= 0 ? `🏠 Minggu ke-${homeI + 1} full istirahat di rumah ✓` : '🏠 Belum ada minggu full di rumah — pilih sendiri salah satu minggu buat istirahat ya'}</div>`;
  $('weeks').innerHTML = W.map((w, i) => {
    const p = P[i], o = p ? optOf(p.k) : null, s = stateOf(w);
    const ng = p && p.ng ? String(p.ng).split('\n').map(x => x.trim()).filter(Boolean) : [];
    return `<button class="wk ${s === 'now' ? 'now' : s === 'past' ? 'past' : ''}" data-i="${i}" style="--c:${o ? o.c : '#e8c4b0'}">
      ${p && p.ok ? '<span class="tag done">✓ udah</span>' : s === 'now' ? '<span class="tag">minggu ini</span>' : ''}
      <span class="no"><b>${o ? o.e : '❔'}</b><small>Minggu<br>ke-${i + 1}</small></span>
      <span class="m"><span class="dt">${rangeLbl(w)}</span>
      ${o ? `<div class="k">${esc(o.n)}${o.s ? ` <small style="font-weight:400;color:var(--muted)">(${esc(o.s)})</small>` : ''}</div>
        ${p.tj ? `<div class="tj">📍 ${esc(p.tj)}</div>` : ''}
        ${ng.length ? `<ul>${ng.slice(0, 4).map(x => `<li>${esc(x)}</li>`).join('')}${ng.length > 4 ? `<li>+${ng.length - 4} lagi</li>` : ''}</ul>` : ''}
        <span class="bt">💰 ${p.b ? rp(p.b) : 'Rp0'}${p.ok && p.kp != null && p.kp !== '' ? ` · kepake ${rp(p.kp)}` : ''}</span>`
      : `<div class="empty">${s === 'past' ? 'Nggak ada rencana' : 'Belum direncanain — tap buat pilih ✍️'}</div>`}
      </span></button>`;
  }).join('');
  document.querySelectorAll('.wk').forEach(b => b.onclick = () => edit(W[+b.dataset.i], +b.dataset.i));
  try { const st = BD.status ? BD.status() : ''; $('bd-st').textContent = st; } catch (e) {}
}

// ── editor 1 minggu ──
function edit(w, i) {
  const p = plan(w.key) || {}, past = stateOf(w) === 'past' || stateOf(w) === 'now';
  let f = { k: p.k || '', tj: p.tj || '', ng: p.ng || '', b: p.b || 0, ok: !!p.ok, kp: p.kp != null ? p.kp : '', ct: p.ct || '' };
  const paint = () => {
    const o = optOf(f.k);
    $('ed').innerHTML = `<div class="drag"></div><div class="h4">Minggu ke-${i + 1}</div><div class="h4s">${rangeLbl(w)}</div>
      <label class="lab">Mau ngapain minggu ini?</label>
      <div class="opts">${allOpts().map(x => `<button type="button" data-k="${esc(x.id)}" class="${f.k === x.id ? 'on' : ''}" style="--c:${x.c}"><span>${x.e}</span>${esc(x.n)}${x.s ? `<small>${esc(x.s)}</small>` : ''}</button>`).join('')}<button type="button" class="add" id="e-add"><span>＋</span>Opsi baru</button></div>
      ${f.k === 'rumah' ? '<p class="hint">🛋️ Full di rumah: rebahan, masak bareng, nonton, beres-beres — budget bisa Rp0.</p>' : ''}
      <label class="lab">Tujuannya ke mana?</label><input class="inp" id="e-tj" maxlength="80" placeholder="${esc(o ? o.ph : 'Ke mana?')}" value="${esc(f.tj)}">
      <label class="lab">Ngapain aja? <span style="font-weight:400;color:var(--muted)">(1 baris 1 kegiatan)</span></label><textarea class="ta" id="e-ng" rows="3" maxlength="400" placeholder="jalan pagi&#10;foto-foto&#10;makan siang">${esc(f.ng)}</textarea>
      <label class="lab">Budget</label><input class="inp" id="e-b" inputmode="numeric" placeholder="Rp0" value="${f.b ? rp(f.b) : ''}">
      <div class="qb">${[25e3, 50e3, 100e3, 200e3, 500e3].map(v => `<button type="button" data-q="${v}">+${rpS(v).replace('Rp', '')}</button>`).join('')}<button type="button" data-q="0">reset</button></div>
      <label class="lab">Catatan</label><input class="inp" id="e-ct" maxlength="120" placeholder="mis. bawa tikar, berangkat jam 6" value="${esc(f.ct)}">
      ${past ? `<div class="tog ${f.ok ? 'on' : ''}" id="e-ok"><i>${f.ok ? '✅' : '⬜'}</i><span>Udah kejadian minggu ini</span></div>
        ${f.ok ? `<label class="lab">Kepake beneran berapa?</label><input class="inp" id="e-kp" inputmode="numeric" placeholder="Rp0" value="${f.kp !== '' ? rp(f.kp) : ''}">` : ''}` : ''}
      <div class="row"><button class="btn" id="e-save">Simpan</button></div>
      <div class="row">${plan(w.key) ? '<button class="btn ghost" id="e-del">🗑 Hapus rencana</button>' : ''}<button class="btn ghost" id="e-x">Batal</button></div>`;
    const grab = () => { f.tj = $('e-tj').value; f.ng = $('e-ng').value; f.b = num($('e-b').value); f.ct = $('e-ct').value; if ($('e-kp')) f.kp = $('e-kp').value === '' ? '' : num($('e-kp').value); };
    $('ed').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { grab(); const was = f.k; f.k = b.dataset.k; if (f.k === 'rumah' && !f.tj) f.tj = 'Di rumah aja'; if (was === 'rumah' && f.tj === 'Di rumah aja' && f.k !== 'rumah') f.tj = ''; paint(); });
    $('ed').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { grab(); f.b = +b.dataset.q ? f.b + +b.dataset.q : 0; $('e-b').value = f.b ? rp(f.b) : ''; });
    $('e-b').oninput = () => { const v = num($('e-b').value); $('e-b').value = v ? rp(v) : ''; };
    if ($('e-kp')) $('e-kp').oninput = () => { const v = num($('e-kp').value); $('e-kp').value = $('e-kp').value.trim() === '' ? '' : rp(v); };
    $('e-add').onclick = () => { grab(); addOpt(id => { f.k = id; paint(); }); };
    if ($('e-ok')) $('e-ok').onclick = () => { grab(); f.ok = !f.ok; if (f.ok && f.kp === '') f.kp = f.b || ''; paint(); };
    $('e-save').onclick = () => {
      grab(); if (!f.k) return toast('Pilih dulu mau ngapain minggu ini 😊');
      savePlan(w.key, { k: f.k, tj: f.tj.trim(), ng: f.ng.trim(), b: f.b, ok: f.ok, kp: f.ok && f.kp !== '' ? f.kp : null, ct: f.ct.trim() });
      $('ov-ed').classList.remove('show'); render(); vib(20); toast(`${optOf(f.k).e} Minggu ke-${i + 1} disimpen`);
    };
    if ($('e-del')) $('e-del').onclick = () => { if (!confirm('Hapus rencana minggu ini?')) return; savePlan(w.key, { del: 1 }); $('ov-ed').classList.remove('show'); render(); };
    $('e-x').onclick = () => $('ov-ed').classList.remove('show');
  };
  paint(); $('ov-ed').classList.add('show'); $('ed').scrollTop = 0;
}

// ── opsi custom ──
function addOpt(done) {
  $('op').innerHTML = `<div class="drag"></div><div class="h4">Opsi baru</div><div class="h4s">Nanti muncul di semua minggu, buat berdua</div>
    <label class="lab">Emoji</label><input class="inp" id="o-e" maxlength="4" placeholder="🎳" style="width:5rem;text-align:center;font-size:1.3rem">
    <label class="lab">Nama kegiatan</label><input class="inp" id="o-n" maxlength="24" placeholder="mis. Main bowling">
    <div class="row"><button class="btn" id="o-ok">Tambah</button><button class="btn ghost" id="o-x">Batal</button></div>`;
  $('ov-op').classList.add('show'); setTimeout(() => $('o-n').focus(), 200);
  $('o-x').onclick = () => $('ov-op').classList.remove('show');
  $('o-ok').onclick = () => {
    const n = $('o-n').value.trim(); if (!n) return toast('Isi nama kegiatannya dulu');
    const e = ($('o-e').value.trim() || '⭐').slice(0, 4), id = 'c' + Date.now().toString(36);
    saveCustom({ id, e, n, at0: Date.now() }); $('ov-op').classList.remove('show'); toast(`${e} ${esc(n)} ditambahin`); render(); done && done(id);
  };
}
function manageOpts() {
  const C = customs();
  $('op').innerHTML = `<div class="drag"></div><div class="h4">Atur opsi</div><div class="h4s">6 opsi bawaan tetep ada · opsi buatan kalian bisa ditambah & dihapus</div>
    ${BASE.map(o => `<div class="cu"><span>${o.e} ${esc(o.n)}${o.s ? ` (${esc(o.s)})` : ''}</span></div>`).join('')}
    ${C.map(o => `<div class="cu"><span>${esc(o.e)} ${esc(o.n)}</span><button data-d="${esc(o.id)}">Hapus</button></div>`).join('')}
    <div class="row"><button class="btn" id="o-new">＋ Opsi baru</button><button class="btn ghost" id="o-x">Tutup</button></div>`;
  $('ov-op').classList.add('show');
  $('op').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const o = C.find(x => x.id === b.dataset.d); if (!o || !confirm(`Hapus opsi "${o.n}"? Minggu yang udah pakai opsi ini jadi kosong.`)) return; saveCustom(Object.assign({}, o, { del: 1 })); manageOpts(); render(); });
  $('o-new').onclick = () => addOpt(() => {});
  $('o-x').onclick = () => $('ov-op').classList.remove('show');
}

function copyText() {
  const y = view.getFullYear(), m = view.getMonth(), W = weeksOf(y, m);
  let t = `🗓️ Jadwal Mingguan ${BULAN[m]} ${y} — Razan & Dara\n`, tot = 0;
  W.forEach((w, i) => {
    const p = plan(w.key), o = p ? optOf(p.k) : null;
    t += `\nMinggu ke-${i + 1} (${rangeLbl(w)}): ${o ? `${o.e} ${o.n}` : '— belum direncanain'}`;
    if (p && o) { if (p.tj) t += `\n  📍 ${p.tj}`; String(p.ng || '').split('\n').map(x => x.trim()).filter(Boolean).forEach(x => t += `\n  • ${x}`); t += `\n  💰 ${rp(p.b)}`; tot += +p.b || 0; }
  });
  t += `\n\nTotal budget: ${rp(tot)}`;
  const ok = () => toast('📋 Jadwal disalin — tinggal tempel di chat');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok).catch(() => fb()); else fb();
  function fb() { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Gagal nyalin 😢'); } a.remove(); }
}

$('m-prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
$('m-next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
$('b-opsi').onclick = manageOpts;
$('b-copy').onclick = copyText;
['ov-ed', 'ov-op'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id) $(id).classList.remove('show'); }));
BD.on(ev => { if (!ev.apps || !ev.apps.length || ev.apps.some(a => /^mingguan/.test(a))) { if (!$('ov-ed').classList.contains('show')) render(); else try { $('bd-st').textContent = BD.status(); } catch (e) {} } });
render();

</script>
<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
