<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buku Cek Cinta 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--paper:#fdf8f0;--paper2:#f9f3e8}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif;touch-action:manipulation}
  html,body{height:100%;overflow:hidden;background:var(--cream)}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 20% 10%,rgba(232,196,176,.4),transparent 60%),radial-gradient(ellipse 60% 60% at 80% 90%,rgba(193,122,111,.15),transparent 60%);pointer-events:none;z-index:0}
  input,textarea{font-family:'Poppins',sans-serif}

  .screen{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;overflow:hidden}
  .screen.active{display:flex}

  /* INTRO */
  #s-intro{padding:1.5rem;text-align:center;justify-content:center;overflow-y:auto}
  .intro-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:380px;width:100%;margin:auto 0}
  .intro-icon{font-size:4rem;display:block;margin-bottom:.85rem;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .intro-eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.4rem}
  .intro-title{font-size:clamp(1.5rem,6vw,2rem);font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:.5rem}
  .intro-title em{font-style:normal;color:var(--rose)}
  .intro-sub{font-size:13px;color:var(--muted);line-height:1.85;max-width:300px;margin-bottom:1.25rem;font-style:italic}
  .intro-info{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;width:100%;margin-bottom:1.5rem}
  .ii{background:#fff;border:1px solid rgba(193,122,111,.12);border-radius:12px;padding:.65rem .4rem;text-align:center;box-shadow:0 2px 8px rgba(193,122,111,.06)}
  .ii-val{font-size:1.2rem;font-weight:700;color:var(--rose);display:block}
  .ii-label{font-size:9px;color:var(--muted);display:block;margin-top:.1rem}
  .intro-btn{width:100%;padding:1rem;border-radius:50px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--rose);color:#fff;box-shadow:0 6px 24px rgba(193,122,111,.4)}
  .intro-btn:active{transform:scale(.97);background:var(--deep)}

  /* BOOK */
  .book-header{flex-shrink:0;width:100%;background:rgba(250,246,240,.97);backdrop-filter:blur(10px);border-bottom:1px solid rgba(193,122,111,.1);padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem;position:relative;z-index:2}
  .bh-back{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;flex-shrink:0}
  .bh-title{font-size:13px;font-weight:700;color:var(--ink);flex:1}
  .bh-count{font-size:11px;color:var(--muted)}
  .tabs{flex-shrink:0;width:100%;display:flex;gap:.35rem;padding:.55rem 1rem;background:rgba(250,246,240,.9);position:relative;z-index:2;overflow-x:auto;scrollbar-width:none}
  .tab{flex-shrink:0;padding:.35rem .8rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;font-size:11.5px;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
  .tab b{font-weight:700}
  .book-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.6rem 1rem 2rem;width:100%;display:flex;flex-direction:column;align-items:center;gap:.75rem;position:relative;z-index:1}
  .empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.75;padding:2.5rem 1rem}
  .empty b{color:var(--rose)}
  .refill{width:100%;max-width:420px;background:linear-gradient(135deg,#fff,rgba(232,196,176,.25));border:1.5px dashed var(--rose);border-radius:14px;padding:1rem;text-align:center}
  .refill p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:.7rem}

  .check-item{width:100%;max-width:420px;position:relative;cursor:pointer;transition:transform .15s}
  .check-item:active{transform:scale(.98)}
  .check-item.used .check-paper{opacity:.78}
  .check-paper{background:var(--paper);border-radius:4px;box-shadow:0 3px 16px rgba(45,31,26,.12),0 1px 4px rgba(45,31,26,.08);position:relative;overflow:hidden}
  .check-paper::before{content:'';position:absolute;left:52px;top:0;bottom:0;width:1px;background:repeating-linear-gradient(to bottom,rgba(193,122,111,.3) 0,rgba(193,122,111,.3) 4px,transparent 4px,transparent 8px)}
  .check-paper::after{content:'CINTA';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:3rem;font-weight:700;color:rgba(193,122,111,.04);pointer-events:none;letter-spacing:.3em}
  .check-item.blank .check-paper{background:repeating-linear-gradient(135deg,var(--paper) 0 14px,#fbf1e6 14px 15px)}
  .check-stub{position:absolute;left:0;top:0;bottom:0;width:52px;background:rgba(193,122,111,.06);display:flex;align-items:center;justify-content:center}
  .stub-num{font-size:10px;font-weight:700;color:var(--rose);transform:rotate(-90deg);white-space:nowrap;letter-spacing:.08em}
  .check-body{padding:.9rem .9rem .9rem 68px}
  .check-bank{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;padding-bottom:.5rem;border-bottom:1px solid rgba(45,31,26,.08);gap:.5rem}
  .bank-name{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--rose)}
  .bank-date{font-size:9px;color:var(--muted);font-style:italic;white-space:nowrap}
  .check-payto{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.4rem}
  .payto-label{font-size:9px;color:var(--muted);white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em}
  .payto-name{font-size:13px;font-weight:700;color:var(--ink);border-bottom:1px solid rgba(45,31,26,.15);flex:1}
  .check-amount-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
  .amount-text{font-weight:600;color:var(--ink);font-family:'Caveat',cursive;font-size:15px;flex:1;border-bottom:1px solid rgba(45,31,26,.12);padding-bottom:.1rem}
  .amount-box{border:2px solid var(--rose);border-radius:6px;padding:.2rem .6rem;font-size:13px;font-weight:700;color:var(--rose);white-space:nowrap}
  .check-desc{font-size:14px;font-family:'Caveat',cursive;color:var(--ink);line-height:1.4;margin-bottom:.6rem;padding:.35rem .5rem;background:rgba(201,169,110,.06);border-radius:6px;border-left:2px solid var(--gold);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .check-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem}
  .check-memo{font-size:9px;color:var(--muted);font-style:italic}
  .check-sig{font-family:'Caveat',cursive;font-size:1.15rem;font-weight:700;color:var(--rose);text-align:right;display:block}
  .check-sig-label{font-size:8px;color:var(--muted);text-align:right;border-top:1px solid rgba(45,31,26,.12);padding-top:.15rem;margin-top:.15rem;display:block}
  .check-micr{background:var(--paper2);padding:.3rem .6rem .3rem 68px;font-size:8px;color:rgba(45,31,26,.25);font-family:monospace;letter-spacing:.15em;border-top:1px solid rgba(45,31,26,.05)}
  .used-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-size:1.15rem;font-weight:900;border:3px solid;border-radius:6px;padding:.2rem .8rem;opacity:.6;pointer-events:none;letter-spacing:.08em;white-space:nowrap;background:rgba(250,246,240,.75);text-align:center;line-height:1.2}
  .used-stamp small{display:block;font-size:9px;font-weight:600;letter-spacing:.05em}
  .used-stamp.wait{color:#ef6c00;border-color:#ef6c00}
  .used-stamp.done{color:#2e7d32;border-color:#2e7d32}
  .check-tear{height:8px;background:linear-gradient(to right,transparent 0%,var(--blush) 5%,var(--blush) 95%,transparent 100%);position:relative;overflow:hidden}
  .check-tear::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent 6px,var(--paper) 6px,var(--paper) 8px)}

  /* SHEETS */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(45,31,26,.5);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:.75rem}
  .overlay.show{display:flex}
  .overlay.center{align-items:center;padding:1.5rem}
  .detail-sheet{background:var(--cream);border-radius:24px 24px 20px 20px;padding:1.4rem 1.4rem 1.6rem;width:100%;max-width:440px;box-shadow:0 -4px 40px rgba(45,31,26,.2);animation:slideup .3s cubic-bezier(.34,1.3,.64,1);max-height:88vh;overflow-y:auto}
  @keyframes slideup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  .ds-drag{width:36px;height:4px;background:var(--blush);border-radius:2px;margin:0 auto .9rem}
  .ds-check-preview{background:var(--paper);border-radius:12px;padding:1.2rem;margin-bottom:.9rem;border:1px solid rgba(193,122,111,.12);position:relative;overflow:hidden;text-align:center}
  .ds-emoji{font-size:2.5rem;display:block;margin-bottom:.5rem}
  .ds-title{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.25rem}
  .ds-value{font-weight:700;color:var(--rose);margin-bottom:.6rem;font-family:'Caveat',cursive;font-size:1.25rem}
  .ds-desc{font-size:13px;color:var(--muted);line-height:1.75;font-style:italic}
  .ds-status{border-radius:12px;padding:.7rem .9rem;margin-bottom:.9rem;font-size:12px;line-height:1.6}
  .ds-status.wait{background:#fff3e0;color:#b45309;border:1px solid #ffe0b2}
  .ds-status.done{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
  .ds-status b{font-weight:700}
  .ds-terms{background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.15);border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem}
  .ds-terms-title{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.45rem}
  .ds-term{font-size:11.5px;color:var(--muted);line-height:1.6;display:flex;gap:.5rem;margin-bottom:.3rem}
  .ds-btns{display:flex;flex-direction:column;gap:.5rem}
  .ds-row{display:flex;gap:.5rem}
  .btn{flex:1;padding:.85rem;border-radius:50px;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:transform .15s;text-align:center;text-decoration:none;display:block}
  .btn:active{transform:scale(.97)}
  .btn-p{background:var(--rose);color:#fff;box-shadow:0 4px 14px rgba(193,122,111,.3)}
  .btn-o{background:transparent;color:var(--muted);border:1.5px solid var(--blush)}
  .btn-wa{background:#25D366;color:#fff}
  .btn-ok{background:#e8f5e9;color:#2e7d32;border:1.5px solid #a5d6a7}
  .btn-link{background:none;border:none;color:var(--muted);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:.3rem}

  .field-lbl{font-size:11px;font-weight:600;color:var(--ink);display:block;margin:.1rem 0 .35rem;text-align:left}
  .field{width:100%;border:1.5px solid var(--blush);border-radius:12px;padding:.65rem .8rem;font-size:13px;color:var(--ink);background:#fff;outline:none;resize:none;margin-bottom:.7rem}
  .field:focus{border-color:var(--rose)}
  .quick-when{display:flex;gap:.35rem;flex-wrap:wrap;margin:-.3rem 0 .8rem}
  .quick-when button{padding:.3rem .65rem;border-radius:50px;border:1px solid var(--blush);background:#fff;font-size:11px;color:var(--muted);cursor:pointer}

  .confirm-sheet{background:var(--cream);border-radius:24px;padding:1.6rem 1.4rem;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 40px rgba(45,31,26,.2);animation:popin .4s cubic-bezier(.34,1.5,.64,1)}
  @keyframes popin{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
  .cf-icon{font-size:3rem;display:block;margin-bottom:.6rem}
  .cf-title{font-size:1.05rem;font-weight:700;color:var(--ink);margin-bottom:.3rem}
  .cf-sub{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:1rem;font-style:italic}

  #success-flash{position:fixed;inset:0;z-index:70;background:var(--rose);display:none;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;padding:1.5rem;text-align:center}
  #success-flash.show{display:flex;animation:flashin .5s ease}
  @keyframes flashin{from{opacity:0}to{opacity:1}}
  .sf-icon{font-size:4rem}
  .sf-text{font-weight:700;color:#fff;font-family:'Caveat',cursive;font-size:1.8rem}

  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:50px;padding:.5rem 1.2rem;font-size:12px;z-index:999;white-space:nowrap;pointer-events:none;animation:tin .25s ease}
  @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- INTRO -->
<div id="s-intro" class="screen active">
  <div class="intro-wrap">
    <span class="intro-icon">📒</span>
    <span class="intro-eyebrow">Hadiah dari Razan</span>
    <h1 class="intro-title">Buku Cek <em>Cinta</em></h1>
    <p class="intro-sub">12 lembar cek spesial + 1 cek kosong yang bisa dicairkan kapanpun Dara mau — satu lembar, satu pengalaman yang dijamin Razan. 🤍</p>
    <div class="intro-info">
      <div class="ii"><span class="ii-val" id="ii-left">13</span><span class="ii-label">Cek Tersisa</span></div>
      <div class="ii"><span class="ii-val" id="ii-wait">0</span><span class="ii-label">Nunggu Ditepati</span></div>
      <div class="ii"><span class="ii-val" id="ii-done">0</span><span class="ii-label">Udah Ditepati</span></div>
    </div>
    <button class="intro-btn" onclick="openBook()">Buka Buku Cek 📒</button>
  </div>
</div>

<!-- BOOK -->
<div id="s-book" class="screen">
  <div class="book-header">
    <button class="bh-back" onclick="showScreen('s-intro')">←</button>
    <span class="bh-title">📒 Buku Cek Cinta — Dara</span>
    <span class="bh-count" id="bh-count"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="book-body" id="book-body"></div>
</div>

<!-- DETAIL -->
<div class="overlay" id="detail-overlay" onclick="if(event.target===this)closeOv('detail-overlay')">
  <div class="detail-sheet" id="detail-sheet"></div>
</div>

<!-- CAIRKAN (konfirmasi + catatan) -->
<div class="overlay center" id="confirm-overlay" onclick="if(event.target===this)closeOv('confirm-overlay')">
  <div class="confirm-sheet" id="confirm-sheet"></div>
</div>

<!-- SUCCESS -->
<div id="success-flash"><span class="sf-icon">✅</span><span class="sf-text" id="sf-text">Cek dicairkan!</span></div>

  { id:'nulis', emoji:'💌', title:'Surat Cinta Khusus', value:'SATU (1) SURAT CINTA', payto:'Dara Syifa Aulia', amount:'1x Handwritten Letter',
    desc:'Razan akan nulis surat tangan — dengan perasaan, tentang apa yang Razan rasain saat itu. Bukan copy-paste, bukan ketik — tangan.',
    terms:['Razan nulis dengan tangan sendiri','Isi surat jujur dan dari hati','Dara boleh minta tema/topik tertentu','Dikirim langsung atau via post kalau mau nostalgic'], memo:'Kata-kata yang tidak bisa diketik', cat:'Kenangan' },
  { id:'pelukan', emoji:'🤗', title:'Pelukan Kapanpun', value:'SATU (1) PELUKAN EKSTRA PANJANG', payto:'Dara Syifa Aulia', amount:'1x Hug On Demand',
    desc:'Cairkan kapanpun Dara butuh — Razan akan berhenti dari apapun yang lagi dikerjain dan memeluk Dara selama yang Dara butuhkan.',
    terms:['Bisa dicairkan kapanpun — tengah malam sekalipun','Razan berhenti apapun aktivitasnya','Durasi pelukan sesuai kebutuhan Dara','Tidak ada penolakan, tidak ada syarat'], memo:'Karena kamu selalu butuh pelukan 🤍', cat:'Cinta' },
  { id:'kosong', blank:true, emoji:'✍️', title:'Cek Kosong', value:'NILAI DITULIS DARA SENDIRI', payto:'Dara Syifa Aulia', amount:'Isi sesuka hati',
    desc:'Cek spesial yang belum ada isinya — Dara tulis sendiri mau apa. Razan udah tanda tangan duluan, jadi wajib ditepati 😌',
    terms:['Isinya bebas, ditulis Dara sendiri','Wajar & bisa diwujudkan ya 😆','Razan udah tanda tangan — nggak bisa ditolak','Cuma ada 1 lembar, pakai dengan bijak'], memo:'Tanda tangan duluan, isinya belakangan', cat:'Spesial' },
];

// ═════════ STATE ═════════
// used[id] = { at, status:'wait'|'done', when, note, doneAt, custom:{title,desc} }
const KEY = 'buku-cek-v2', OLD = 'buku-cek-used';
let S = { used: {} };
try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (d) S = d;
  else { const old = JSON.parse(localStorage.getItem(OLD) || '[]'); old.forEach(id => S.used[id] = { at: null, status: 'done' }); } // cek lama dianggap udah ditepati
} catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let tab = 'left', currentId = null, busy = false, justCashed = null;
const $ = id => document.getElementById(id);
const byId = id => CHECKS.find(c => c.id === id);
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtD(t) { return t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
function titleOf(c) { const u = S.used[c.id]; return c.blank && u && u.custom ? u.custom.title : c.title; }
function descOf(c) { const u = S.used[c.id]; return c.blank && u && u.custom ? u.custom.desc : c.desc; }
function counts() { const left = CHECKS.filter(c => !S.used[c.id]).length, wait = Object.values(S.used).filter(u => u.status === 'wait').length, done = Object.values(S.used).filter(u => u.status === 'done').length; return { left, wait, done }; }
function toast(m) { document.querySelectorAll('.toast').forEach(e => e.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); if (id === 's-intro') renderIntro(); }
function renderIntro() { const c = counts(); $('ii-left').textContent = c.left; $('ii-wait').textContent = c.wait; $('ii-done').textContent = c.done; }
function openBook() { const c = counts(); if (!c.left && tab === 'left') tab = c.wait ? 'wait' : 'all'; showScreen('s-book'); renderBook(); }

// ═════════ BUKU ═════════
function renderBook() {
  const c = counts();
  $('bh-count').textContent = `${c.left}/${CHECKS.length} tersisa`;
  const TABS = [['left', '📒 Tersisa', c.left], ['wait', '⏳ Nunggu', c.wait], ['done', '✅ Ditepati', c.done], ['all', 'Semua', CHECKS.length]];
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button class="tab ${tab === k ? 'on' : ''}" onclick="tab='${k}';renderBook()">${l} <b>${n}</b></button>`).join('');
  const list = CHECKS.map((ch, i) => ({ ch, i })).filter(({ ch }) => { const u = S.used[ch.id]; return tab === 'all' || (tab === 'left' && !u) || (u && u.status === tab); });
  const body = $('book-body');
  if (!list.length) {
    const msg = { left: 'Semua cek udah dicairkan! 🥹<br>Buku ini habis — tapi sayangnya Razan nggak ada habisnya.', wait: 'Nggak ada cek yang lagi nunggu ditepati.<br>Razan <b>on time</b> semua nih 😎', done: 'Belum ada cek yang ditepati.<br>Cairkan satu dulu yuk 💸' }[tab];
    body.innerHTML = `<div class="empty">${msg}</div>${tab === 'left' ? refillHTML() : ''}`;
    return;
  }
  body.innerHTML = list.map(({ ch, i }) => checkHTML(ch, i)).join('') + (tab === 'all' && !c.left ? refillHTML() : '');
  body.querySelectorAll('.check-item').forEach(el => el.onclick = () => openDetail(el.dataset.id));
  body.scrollTop = 0;
}
function refillHTML() {
  if (counts().left) return '';
  const msg = encodeURIComponent('Sayaaang 📒 Buku Cek Cinta aku udah habis semua nih... boleh minta buku cek baru ga? 🥺🤍');
  return `<div class="refill"><p>📒 Semua lembar udah terpakai.<br>Minta Razan bikinin buku cek edisi baru?</p><a class="btn btn-wa" href="https://wa.me/${WA_NUMBER}?text=${msg}" target="_blank">📲 Minta Buku Cek Baru</a></div>`;
}
function checkHTML(ch, idx) {
  const u = S.used[ch.id];
  const stamp = u ? `<div class="used-stamp ${u.status}">${u.status === 'done' ? '✓ DITEPATI' : '⏳ DICAIRKAN'}<small>${u.status === 'done' ? fmtD(u.doneAt || u.at) : fmtD(u.at)}</small></div>` : '';
  return `<div class="check-item ${u ? 'used' : ''} ${ch.blank ? 'blank' : ''}" data-id="${ch.id}">
    <div class="check-paper">
      <div class="check-stub"><span class="stub-num">CEK #${String(idx + 1).padStart(2, '0')}</span></div>
      <div class="check-body">
        <div class="check-bank"><span class="bank-name">🏦 Bank Cinta Razan</span><span class="bank-date">${u && u.at ? 'Cair ' + fmtD(u.at) : 'Berlaku selamanya'}</span></div>
        <div class="check-payto"><span class="payto-label">Bayarkan kepada:</span><span class="payto-name">${ch.payto}</span></div>
        <div class="check-amount-row"><span class="amount-text">${ch.blank && u && u.custom ? esc(u.custom.title) : ch.amount}</span><span class="amount-box">${ch.emoji}</span></div>
        <div class="check-desc">${esc(descOf(ch))}</div>
        <div class="check-footer"><span class="check-memo">${ch.memo}</span><div><span class="check-sig">Razan</span><span class="check-sig-label">Tanda Tangan</span></div></div>
      </div>
      <div class="check-micr">⑆ 0607 ⑆ 1718 ⑆ ${String(idx + 1).padStart(4, '0')} ⑇</div>
      ${stamp}
    </div><div class="check-tear"></div></div>`;
}

// ═════════ DETAIL ═════════
function openDetail(id) {
  const ch = byId(id); if (!ch) return; currentId = id;
  const u = S.used[id];
  let status = '', btns = '';
  if (!u) btns = `<div class="ds-row"><button class="btn btn-p" onclick="openCairkan()">Cairkan Sekarang 💸</button><button class="btn btn-o" onclick="closeOv('detail-overlay')">Simpan Dulu</button></div>`;
  else if (u.status === 'wait') {
    status = `<div class="ds-status wait">⏳ <b>Dicairkan ${fmtD(u.at)}</b> — lagi nunggu Razan menepati.${u.when ? `<br>🗓️ Kapan: <b>${esc(u.when)}</b>` : ''}${u.note ? `<br>📝 ${esc(u.note)}` : ''}</div>`;
    btns = `<a class="btn btn-wa" href="${waLink(ch, u, justCashed !== id)}" target="_blank">${justCashed === id ? '📲 Kabarin Razan sekarang!' : '📲 Tagih ke Razan'}</a>
      <button class="btn btn-ok" onclick="markDone()">✓ Udah Ditepati Razan</button>
      <button class="btn-link" onclick="undoCash()">↩️ Batalin (salah pencet)</button>`;
  } else {
    status = `<div class="ds-status done">✅ <b>Ditepati ${fmtD(u.doneAt || u.at)}</b> — Razan udah menepati janjinya 🤍${u.when ? `<br>🗓️ ${esc(u.when)}` : ''}</div>`;
    btns = `<button class="btn btn-o" onclick="closeOv('detail-overlay')">Tutup</button>`;
  }
  $('detail-sheet').innerHTML = `<div class="ds-drag"></div>
    <div class="ds-check-preview"><span class="ds-emoji">${ch.emoji}</span><p class="ds-title">${esc(titleOf(ch))}</p><p class="ds-value">${ch.value}</p><p class="ds-desc">${esc(descOf(ch))}</p></div>
    ${status}
    <div class="ds-terms"><span class="ds-terms-title">📋 Syarat & Ketentuan</span>${ch.terms.map(t => `<div class="ds-term"><span>✦</span><span>${t}</span></div>`).join('')}</div>
    <div class="ds-btns">${btns}</div>`;
  $('detail-overlay').classList.add('show');
}
function closeOv(id) { $(id).classList.remove('show'); }

// ═════════ CAIRKAN ═════════
function openCairkan() {
  const ch = byId(currentId); if (!ch || S.used[ch.id]) return;
  const blank = ch.blank ? `<label class="field-lbl">✍️ Kamu mau apa?</label><input class="field" id="cf-title" maxlength="40" placeholder="misal: Sarapan di tempat favorit">
    <label class="field-lbl">Ceritain dikit</label><textarea class="field" id="cf-desc" rows="2" maxlength="120" placeholder="misal: kamu yang jemput jam 7 pagi, aku yang pilih menu 😌"></textarea>` : '';
  $('confirm-sheet').innerHTML = `<span class="cf-icon">${ch.emoji}</span>
    <h2 class="cf-title">Cairkan "${esc(ch.title)}"?</h2>
    <p class="cf-sub">Sekali dicairkan, lembar ini dipakai. Razan bakal dikabarin lewat WA 🤍</p>
    ${blank}
    <label class="field-lbl">🗓️ Kapan mau dicairkan? (opsional)</label>
    <input class="field" id="cf-when" maxlength="40" placeholder="misal: Sabtu ini / hari ini juga!">
    <div class="quick-when"><button onclick="$('cf-when').value='Hari ini juga! 🔥'">Hari ini</button><button onclick="$('cf-when').value='Weekend ini'">Weekend ini</button><button onclick="$('cf-when').value='Kapan kamu sempet aja'">Kapan sempet</button></div>
    <label class="field-lbl">📝 Catatan buat Razan (opsional)</label>
    <textarea class="field" id="cf-note" rows="2" maxlength="120" placeholder="misal: filmnya aku yang pilih ya 😆"></textarea>
    <div class="ds-row"><button class="btn btn-p" onclick="confirmCairkan()">Ya, Cairkan! 💸</button><button class="btn btn-o" onclick="closeOv('confirm-overlay')">Batal</button></div>`;
  $('confirm-overlay').classList.add('show');
}
function confirmCairkan() {
  if (busy) return;
  const ch = byId(currentId); if (!ch || S.used[ch.id]) return;   // anti dobel pencet
  let custom = null;
  if (ch.blank) {
    const t = $('cf-title').value.trim();
    if (!t) { $('cf-title').focus(); toast('Tulis dulu mau apa ✍️'); return; }
    custom = { title: t, desc: $('cf-desc').value.trim() || 'Ditulis sendiri sama Dara — wajib ditepati 😌' };
  }
  busy = true;
  const u = { at: Date.now(), status: 'wait', when: $('cf-when').value.trim(), note: $('cf-note').value.trim(), custom };
  S.used[ch.id] = u; save();
  closeOv('confirm-overlay'); closeOv('detail-overlay');
  $('sf-text').textContent = `"${titleOf(ch)}" dicairkan! 💸`;
  $('success-flash').classList.add('show'); vib([100, 50, 200]); confetti(60);
  setTimeout(() => {
    $('success-flash').classList.remove('show'); busy = false;
    tab = 'wait'; renderBook(); justCashed = ch.id; openDetail(ch.id); justCashed = null;   // tombol WA di-tap sendiri (popup otomatis sering diblok HP)
  }, 1700);
}
function waLink(ch, u, reminder) {
  let msg = reminder ? `Sayaaang 🔔 Mau ngingetin nih — cek aku yang ini belum dicairin loh:\n\n` : `Sayaaang!! 💸 Aku baru nyairin cek dari Buku Cek Cinta:\n\n`;
  msg += `${ch.emoji} *${titleOf(ch)}*\n${descOf(ch)}`;
  if (u.when) msg += `\n\n🗓️ Kapan: ${u.when}`;
  if (u.note) msg += `\n📝 ${u.note}`;
  msg += `\n\nDicairkan: ${fmtD(u.at)}\nTanda tangan kamu udah ada di cek ini, jadi wajib ditepati ya 😌🤍`;
  return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
}
function markDone() {
  const u = S.used[currentId]; if (!u) return;
  u.status = 'done'; u.doneAt = Date.now(); save();
  closeOv('detail-overlay'); toast('✅ Janji ditepati! Makasih udah ngingetin 🤍'); confetti(40); vib([40, 20, 80]);
  renderBook();
}
function undoCash() {
  if (!confirm('Batalin pencairan cek ini? Lembarnya bakal balik lagi ke buku.')) return;
  delete S.used[currentId]; save(); closeOv('detail-overlay'); toast('↩️ Cek dikembalikan ke buku'); renderBook();
}

function confetti(n) {
  const colors = ['#c17a6f', '#c9a96e', '#e8c4b0', '#b5c4b1', '#fff'];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const el = document.createElement('div'); el.className = 'cp';
    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);
  }, i * 20);
}
renderIntro();
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
