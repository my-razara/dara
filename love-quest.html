<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Love Quest — Razan & Dara ⚔️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
    --purple:#7c5cbf;--purple-light:#ede8f8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}
  html,body{min-height:100%;background:var(--cream)}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(232,196,176,.3) 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 80%,rgba(193,122,111,.15) 0%,transparent 70%);
    pointer-events:none;z-index:0}
  .page{max-width:440px;margin:0 auto;padding:0 1rem 5rem;position:relative;z-index:1}

  /* ── HERO ── */
  .hero{
    background:linear-gradient(135deg,#2d1f3d,#1a0f2e);
    border-radius:0 0 28px 28px;
    padding:1.5rem 1.25rem 1.75rem;
    margin:0 -1rem 1.25rem;
    position:relative;overflow:hidden;
  }
  .hero::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at top,rgba(124,92,191,.25),transparent 60%);pointer-events:none}

  /* Stars in hero */
  .hero-star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite;pointer-events:none}
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.7}}

  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;position:relative;z-index:1}
  .hero-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,169,110,.7)}
  .hero-title{font-size:1.3rem;font-weight:700;color:#fff}
  .hero-title span{color:#c9a96e}

  .level-badge{
    background:rgba(201,169,110,.15);border:1px solid rgba(201,169,110,.3);
    border-radius:50px;padding:.25rem .85rem;
    font-size:11px;font-weight:700;color:#c9a96e;
    white-space:nowrap;
  }

  /* Characters */
  .chars{display:flex;justify-content:center;gap:1.5rem;margin-bottom:1.25rem;position:relative;z-index:1}
  .char{text-align:center}
  .char-sprite{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;margin:0 auto .3rem;
    border:2px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    animation:charbob 2s ease-in-out infinite;
  }
  .char:last-child .char-sprite{animation-delay:.5s}
  @keyframes charbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .char-name{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em}

  .hearts-between{font-size:1.2rem;align-self:center;animation:heartbeat 1.5s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

  /* XP Bar */
  .xp-section{position:relative;z-index:1}
  .xp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
  .xp-level-name{font-size:11px;font-weight:600;color:#fff}
  .xp-numbers{font-size:10px;color:rgba(255,255,255,.4)}
  .xp-bar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-bottom:.3rem}
  .xp-fill{height:100%;border-radius:5px;background:linear-gradient(to right,#c9a96e,#e8c4b0);transition:width .8s cubic-bezier(.34,1.3,.64,1)}
  .xp-next{font-size:10px;color:rgba(255,255,255,.3);text-align:right}

  /* ── STATS ── */
  .stats-row{display:flex;gap:.5rem;margin-bottom:1.25rem}
  .stat-card{
    flex:1;background:#fff;border:1px solid rgba(193,122,111,.12);
    border-radius:14px;padding:.7rem .6rem;text-align:center;
    box-shadow:0 2px 8px rgba(193,122,111,.06);
  }
  .stat-num{font-size:1.4rem;font-weight:700;color:var(--rose);display:block;line-height:1}
  .stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin-top:.15rem}

  /* ── SECTION ── */
  .section-label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);margin-bottom:.65rem;
    display:flex;align-items:center;gap:.5rem;
  }
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--blush),transparent)}

  /* ── QUEST CARD ── */
  .quest-card{
    background:#fff;border:1.5px solid rgba(193,122,111,.12);
    border-radius:16px;padding:.85rem 1rem;
    margin-bottom:.5rem;
    display:flex;align-items:center;gap:.85rem;
    cursor:pointer;transition:all .15s;
    box-shadow:0 2px 8px rgba(193,122,111,.05);
    position:relative;overflow:hidden;
  }
  .quest-card:active{transform:scale(.97)}
  .quest-card.done{background:rgba(193,122,111,.04);border-color:rgba(193,122,111,.2)}
  .quest-card.done .quest-title{text-decoration:line-through;color:var(--muted);opacity:.6}
  .quest-card.done .quest-xp{opacity:.4}

  .quest-check{
    width:28px;height:28px;border-radius:50%;
    border:2px solid var(--blush);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;flex-shrink:0;transition:all .2s;
  }
  .quest-card.done .quest-check{background:var(--rose);border-color:var(--rose);color:#fff}

  .quest-icon{font-size:1.2rem;flex-shrink:0}
  .quest-info{flex:1}
  .quest-title{font-size:12.5px;font-weight:500;color:var(--ink);display:block}
  .quest-desc{font-size:10px;color:var(--muted);display:block;margin-top:.1rem}
  .quest-xp{
    font-size:10px;font-weight:700;
    padding:.15rem .5rem;border-radius:50px;
    flex-shrink:0;
  }
  .xp-daily{background:rgba(181,196,177,.2);color:#3a6040}
  .xp-side{background:rgba(201,169,110,.15);color:#8a6a20}
  .xp-epic{background:rgba(193,122,111,.12);color:var(--rose)}

  /* ── LEVEL UP OVERLAY ── */
  #levelup{
    display:none;position:fixed;inset:0;z-index:99;
    background:rgba(26,15,46,.9);backdrop-filter:blur(8px);
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:1.5rem;
  }
  #levelup.show{display:flex;animation:lushow .4s ease}
  @keyframes lushow{from{opacity:0}to{opacity:1}}
  .lu-icon{font-size:4rem;display:block;margin-bottom:.75rem;animation:luicon .6s cubic-bezier(.34,1.5,.64,1)}
  @keyframes luicon{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .lu-badge{
    background:rgba(201,169,110,.2);border:1px solid rgba(201,169,110,.4);
    border-radius:50px;padding:.25rem 1rem;
    font-size:11px;font-weight:700;color:#c9a96e;
    margin-bottom:.75rem;display:inline-block;
  }
  .lu-title{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.35rem}
  .lu-name{font-size:1.1rem;font-weight:600;color:#c9a96e;margin-bottom:.75rem}
  .lu-msg{
    font-size:13px;color:rgba(255,255,255,.7);line-height:1.75;
    max-width:280px;margin:.25rem auto 1.5rem;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:1rem;
  }
  .lu-btn{
    padding:.9rem 2.5rem;border-radius:50px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;
    background:linear-gradient(135deg,#c9a96e,#8B6914);color:#fff;
    box-shadow:0 4px 18px rgba(201,169,110,.4);transition:all .2s;
  }
  .lu-btn:active{transform:scale(.97)}

  /* ── RESET ── */
  .reset-btn{
    width:100%;padding:.75rem;border-radius:50px;
    border:1.5px solid var(--blush);background:transparent;
    color:var(--muted);font-size:12px;cursor:pointer;
    margin-top:.5rem;transition:all .15s;
  }
  .reset-btn:active{background:var(--warm)}

  /* Confetti */
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  /* Toast */
  .toast{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;border-radius:50px;padding:.5rem 1.25rem;
    font-size:12px;font-weight:500;z-index:999;white-space:nowrap;pointer-events:none;
    animation:tin .25s ease}
  @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <div class="hero" id="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">Love Quest</div>
        <div class="hero-title">Razan <span>&</span> Dara</div>
      </div>
      <div class="level-badge" id="level-badge">⭐ Level 1</div>
    </div>

    <div class="chars">
      <div class="char">
        <div class="char-sprite">🧑</div>
        <div class="char-name">Razan</div>
      </div>
      <div class="hearts-between">💕</div>
      <div class="char">
        <div class="char-sprite">👧</div>
        <div class="char-name">Dara</div>
      </div>
    </div>

    <div class="xp-section">
      <div class="xp-top">
        <span class="xp-level-name" id="xp-level-name">Couple Pemula</span>
        <span class="xp-numbers" id="xp-numbers">0 / 100 XP</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      <div class="xp-next" id="xp-next">100 XP lagi ke level berikutnya</div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-num" id="stat-xp">0</span>
      <span class="stat-label">Total XP</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="stat-done">0</span>
      <span class="stat-label">Misi Selesai</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="stat-left">0</span>
      <span class="stat-label">Misi Tersisa</span>
    </div>
  </div>

  <!-- QUESTS -->
  <div id="quest-list"></div>

  <button class="reset-btn" onclick="confirmReset()">Reset Progress 🔄</button>

</div>

<!-- LEVEL UP -->
<div id="levelup">
  <span class="lu-icon" id="lu-icon">⭐</span>
  <div class="lu-badge" id="lu-badge">LEVEL UP!</div>
  <p class="lu-title" id="lu-title">Level 2!</p>
  <p class="lu-name" id="lu-name">Couple Solid</p>
  <p class="lu-msg" id="lu-msg">...</p>
  <button class="lu-btn" onclick="closeLevelUp()">Lanjutkan Quest! ⚔️</button>
</div>

<script>
// ── DATA ──
const QUESTS = [
  // Daily +10 XP
  {id:'d1',cat:'daily',icon:'🫂',title:'Peluk',desc:'Peluk satu sama lain hari ini',xp:10},
  {id:'d2',cat:'daily',icon:'😂',title:'Ketawa bareng',desc:'Tertawa sampai perut sakit',xp:10},
  {id:'d3',cat:'daily',icon:'🍜',title:'Makan bareng',desc:'Makan satu meja, tanpa HP',xp:10},
  {id:'d4',cat:'daily',icon:'🌙',title:'Say goodnight',desc:'Bilang selamat malam duluan',xp:10},
  {id:'d5',cat:'daily',icon:'💌',title:'Kirim pesan manis',desc:'Kirim sesuatu yang bikin senyum',xp:10},
  {id:'d6',cat:'daily',icon:'👀',title:'Tatap mata',desc:'Tatap mata tanpa ngomong 30 detik',xp:10},
  {id:'d7',cat:'daily',icon:'🎵',title:'Dengerin lagu bareng',desc:'Satu earphone satu-satu',xp:10},
  {id:'d8',cat:'daily',icon:'☕',title:'Ngobrol santai',desc:'Ngobrol tanpa topik khusus',xp:10},

  // Side +25 XP
  {id:'s1',cat:'side',icon:'🌅',title:'Jalan sore',desc:'Jalan-jalan sore bareng ke mana aja',xp:25},
  {id:'s2',cat:'side',icon:'📸',title:'Foto bareng',desc:'Foto selfie dan simpen sebagai kenangan',xp:25},
  {id:'s3',cat:'side',icon:'🍽️',title:'Makan di tempat baru',desc:'Coba restoran atau tempat yang belum pernah didatangi',xp:25},
  {id:'s4',cat:'side',icon:'🎬',title:'Nonton bareng',desc:'Nonton film atau series bareng sampai habis',xp:25},
  {id:'s5',cat:'side',icon:'🛒',title:'Pergi bareng',desc:'Pergi ke mana aja bareng — mall, pasar, apapun',xp:25},
  {id:'s6',cat:'side',icon:'🌃',title:'Keluar malam',desc:'Keluar malam bareng, ngobrol di bawah langit',xp:25},
  {id:'s7',cat:'side',icon:'🎂',title:'Rayain sesuatu',desc:'Rayain hal kecil apapun bareng',xp:25},
  {id:'s8',cat:'side',icon:'🤝',title:'Selesaiin masalah bareng',desc:'Ngobrol tuntas sampai beres',xp:25},

  // Epic +50 XP
  {id:'e1',cat:'epic',icon:'✈️',title:'Pergi trip bareng',desc:'Jalan-jalan ke kota atau tempat baru',xp:50},
  {id:'e2',cat:'epic',icon:'🎁',title:'Kasih surprise',desc:'Kasih kejutan tanpa alasan apapun',xp:50},
  {id:'e3',cat:'epic',icon:'🌟',title:'Buat kenangan baru',desc:'Lakuin sesuatu yang belum pernah kalian lakuin',xp:50},
  {id:'e4',cat:'epic',icon:'💍',title:'Rencanain masa depan',desc:'Ngobrol serius soal masa depan kalian',xp:50},
  {id:'e5',cat:'epic',icon:'🏕️',title:'Habiskan seharian bareng',desc:'Full day dari pagi sampai malam, cuma berdua',xp:50},
];

const LEVELS = [
  {level:1,name:'Couple Pemula',   minXP:0,   maxXP:100, icon:'🌱', msg:'Perjalanan dimulai dari sini. Setiap hal kecil yang kalian lakuin bareng itu berarti — bahkan yang paling sederhana sekalipun. 🤍'},
  {level:2,name:'Couple Solid',    minXP:100, maxXP:250, icon:'💪', msg:'Kalian udah buktiin bahwa hal-hal kecil itu nyata. Terusin — yang konsisten itu yang paling kuat. 🤍'},
  {level:3,name:'Couple Goals',    minXP:250, maxXP:450, icon:'🌟', msg:'Orang-orang ngeliat kalian dan bilang "itu tuh couple goals". Dan mereka bener. Kalian emang goals. 🤍'},
  {level:4,name:'Couple Legendaris',minXP:450,maxXP:700,icon:'🏆', msg:'Ga banyak couple yang sampai di sini. Yang kalian bangun bareng itu sesuatu yang langka dan berharga. 🤍'},
  {level:5,name:'Soulmate',        minXP:700, maxXP:999, icon:'💫', msg:'Kalian bukan cuma couple. Kalian soulmate — dua orang yang nemuin satu sama lain dan milih untuk tetap ada. Aku bangga sama kita. 🤍'},
];

// ── STORAGE ──
function load(){return JSON.parse(localStorage.getItem('lq-done')||'[]')}
function save(done){localStorage.setItem('lq-done',JSON.stringify(done))}

let done=load();
let currentLevel=1;

// ── INIT ──
function getXP(){return QUESTS.filter(q=>done.includes(q.id)).reduce((a,q)=>a+q.xp,0)}

function getLevelData(xp){
  for(let i=LEVELS.length-1;i>=0;i--){
    if(xp>=LEVELS[i].minXP)return LEVELS[i];
  }
  return LEVELS[0];
}

function buildHeroStars(){
  const hero=document.getElementById('hero');
  for(let i=0;i<25;i++){
    const s=document.createElement('div');s.className='hero-star';
    const sz=Math.random()*1.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:.3`;
    hero.appendChild(s);
  }
}

function render(){
  const xp=getXP();
  const lv=getLevelData(xp);
  const nextLv=LEVELS.find(l=>l.level===lv.level+1);
  const lvXP=xp-lv.minXP;
  const lvMax=(nextLv?nextLv.minXP:lv.maxXP)-lv.minXP;
  const pct=nextLv?Math.min(lvXP/lvMax*100,100):100;

  document.getElementById('level-badge').textContent=`${lv.icon} Level ${lv.level}`;
  document.getElementById('xp-level-name').textContent=lv.name;
  document.getElementById('xp-numbers').textContent=`${xp} XP`;
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-next').textContent=nextLv?`${nextLv.minXP-xp} XP lagi ke level ${nextLv.level}`:'Level Maksimal! 🎉';

  document.getElementById('stat-xp').textContent=xp;
  document.getElementById('stat-done').textContent=done.length;
  document.getElementById('stat-left').textContent=QUESTS.length-done.length;

  buildQuestList();
}

function buildQuestList(){
  const el=document.getElementById('quest-list');
  el.innerHTML='';

  const cats=[
    {key:'daily',label:'Daily Quest',sub:'+10 XP tiap misi'},
    {key:'side', label:'Side Quest', sub:'+25 XP tiap misi'},
    {key:'epic', label:'Epic Quest', sub:'+50 XP tiap misi'},
  ];

  cats.forEach(cat=>{
    const quests=QUESTS.filter(q=>q.cat===cat.key);
    const p=document.createElement('p');
    p.className='section-label';
    p.innerHTML=`${cat.label} <span style="font-size:9px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:300">${cat.sub}</span>`;
    el.appendChild(p);

    quests.forEach(q=>{
      const isDone=done.includes(q.id);
      const card=document.createElement('div');
      card.className='quest-card'+(isDone?' done':'');
      card.innerHTML=`
        <div class="quest-check">${isDone?'✓':''}</div>
        <span class="quest-icon">${q.icon}</span>
        <div class="quest-info">
          <span class="quest-title">${q.title}</span>
          <span class="quest-desc">${q.desc}</span>
        </div>
        <span class="quest-xp xp-${q.cat}">+${q.xp} XP</span>
      `;
      card.addEventListener('click',()=>toggleQuest(q.id));
      el.appendChild(card);
    });

    // Spacer
    const sp=document.createElement('div');sp.style.height='.5rem';el.appendChild(sp);
  });
}

function toggleQuest(id){
  const prevXP=getXP();
  const prevLv=getLevelData(prevXP).level;

  if(done.includes(id)){
    done=done.filter(d=>d!==id);
    showToast('Quest di-uncheck');
  } else {
    done.push(id);
    const q=QUESTS.find(q=>q.id===id);
    showToast(`+${q.xp} XP! ${q.icon}`);
    confetti(15);
  }
  save(done);
  render();

  const newXP=getXP();
  const newLv=getLevelData(newXP).level;
  if(newLv>prevLv){
    setTimeout(()=>showLevelUp(newLv),600);
  }
}

function showLevelUp(lv){
  const data=LEVELS.find(l=>l.level===lv);
  if(!data)return;
  document.getElementById('lu-icon').textContent=data.icon;
  document.getElementById('lu-badge').textContent=`LEVEL UP! ⭐`;
  document.getElementById('lu-title').textContent=`Level ${lv}!`;
  document.getElementById('lu-name').textContent=data.name;
  document.getElementById('lu-msg').textContent=data.msg;
  document.getElementById('levelup').classList.add('show');
  confetti(60);
}

function closeLevelUp(){
  document.getElementById('levelup').classList.remove('show');
}

function confirmReset(){
  if(confirm('Reset semua progress? Ini ga bisa di-undo.')){
    done=[];save(done);render();showToast('Progress direset');
  }
}

function showToast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2000);
}

function confetti(n=30){
  const colors=['#c17a6f','#e8c4b0','#c9a96e','#b5c4b1','#faf6f0'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
  },i*20);
}

buildHeroStars();
render();
</script>
</body>
</html>
