<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mystery Box — Dari Razan 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at top,#1a0f2e,#0d0820);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(150,100,255,.12),transparent 60%);
    pointer-events:none}

  /* Stars */
  .star{position:fixed;border-radius:50%;background:#fff;animation:twinkle linear infinite;pointer-events:none}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}

  .wrap{
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;
    padding:1.5rem;width:100%;max-width:380px;
    position:relative;z-index:1;
  }

  /* Label top */
  .top-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(180,150,255,.6);display:block;margin-bottom:.5rem}
  .top-title{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:700;color:#fff;margin-bottom:.35rem}
  .top-title span{color:#c9a96e}
  .top-sub{font-size:12px;color:rgba(255,255,255,.4);line-height:1.7;margin-bottom:2rem;max-width:260px}

  /* Box */
  .box-wrap{
    position:relative;width:180px;height:180px;
    margin:0 auto 1.75rem;cursor:pointer;
    user-select:none;-webkit-user-select:none;
  }

  .box{
    width:100%;height:100%;
    position:relative;transition:transform .08s ease;
    transform-style:preserve-3d;
  }
  .box.shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
  .box.pop{animation:boxpop .5s cubic-bezier(.34,1.5,.64,1)}
  @keyframes boxpop{0%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1)}}

  /* Box SVG drawn with CSS */
  .box-body{
    position:absolute;bottom:0;left:0;right:0;height:75%;
    background:linear-gradient(135deg,#c9a96e,#8B6914);
    border-radius:8px 8px 12px 12px;
    box-shadow:0 8px 30px rgba(201,169,110,.25),inset 0 1px 0 rgba(255,255,255,.15);
    overflow:hidden;
  }
  .box-body::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0,rgba(0,0,0,.08) 1px,transparent 1px,transparent 20%);
  }
  .box-body::after{
    content:'';position:absolute;left:50%;top:0;bottom:0;
    width:16px;transform:translateX(-50%);
    background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.2),rgba(0,0,0,.2));
  }
  .box-ribbon-h{
    position:absolute;left:0;right:0;top:50%;height:16px;
    transform:translateY(-50%);
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.15));
    z-index:2;
  }

  .box-lid{
    position:absolute;top:0;left:-6px;right:-6px;height:28%;
    background:linear-gradient(135deg,#e2c07a,#a07820);
    border-radius:10px 10px 6px 6px;
    box-shadow:0 4px 20px rgba(201,169,110,.3),inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .5s cubic-bezier(.34,1.3,.64,1),opacity .4s;
    transform-origin:center bottom;
    z-index:3;
  }
  .box-lid::after{
    content:'';position:absolute;left:50%;top:0;bottom:0;
    width:16px;transform:translateX(-50%);
    background:linear-gradient(90deg,rgba(0,0,0,.15),rgba(255,255,255,.2),rgba(0,0,0,.15));
  }
  .box-bow{
    position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    width:50px;height:30px;z-index:4;
    transition:transform .5s cubic-bezier(.34,1.3,.64,1),opacity .4s;
  }
  .bow-left,.bow-right{
    position:absolute;top:0;width:22px;height:22px;
    border-radius:50%;border:5px solid #f0d080;
  }
  .bow-left{right:50%;transform:rotate(-30deg);transform-origin:right center}
  .bow-right{left:50%;transform:rotate(30deg);transform-origin:left center}
  .bow-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:12px;height:12px;border-radius:50%;
    background:#f0d080;z-index:1;
  }

  /* Lid open animation */
  .box-lid.open{transform:translateY(-60px) rotate(-25deg);opacity:0}
  .box-bow.open{transform:translateX(-50%) translateY(-60px) rotate(-25deg);opacity:0}

  /* Glow ring */
  .box-glow{
    position:absolute;inset:-20px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,169,110,.0),transparent 70%);
    pointer-events:none;transition:background .3s;
  }
  .box-wrap.active .box-glow{
    background:radial-gradient(circle,rgba(201,169,110,.25),transparent 70%);
    animation:glowpulse 1s ease-in-out infinite;
  }
  @keyframes glowpulse{0%,100%{opacity:.6}50%{opacity:1}}

  /* Question marks floating */
  .qmark{
    position:absolute;font-size:1.2rem;color:rgba(201,169,110,.6);
    animation:qfloat linear infinite;pointer-events:none;
    font-weight:700;
  }
  @keyframes qfloat{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-80px) rotate(20deg);opacity:0}}

  /* Click counter */
  .click-counter{
    font-size:13px;color:rgba(255,255,255,.4);
    margin-bottom:1.25rem;min-height:20px;transition:color .2s;
  }
  .click-counter.hot{color:var(--gold);animation:counterpulse .3s ease}
  @keyframes counterpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  /* Progress dots */
  .progress-dots{
    display:flex;gap:.35rem;margin-bottom:1.5rem;justify-content:center;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.15);
    transition:all .3s cubic-bezier(.34,1.5,.64,1);
  }
  .dot.filled{background:var(--gold);transform:scale(1.2);box-shadow:0 0 8px rgba(201,169,110,.5)}

  /* Tap button */
  .tap-btn{
    padding:.9rem 2.5rem;border-radius:50px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;
    background:linear-gradient(135deg,#c9a96e,#8B6914);color:#fff;
    box-shadow:0 4px 20px rgba(201,169,110,.35);
    transition:all .15s;
  }
  .tap-btn:active{transform:scale(.95)}
  .tap-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  /* Reveal overlay */
  #reveal{
    position:fixed;inset:0;z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;text-align:center;
    background:radial-gradient(ellipse at center,#1a0f2e,#050210);
  }
  #reveal.show{display:flex;animation:revealin .6s ease}
  @keyframes revealin{from{opacity:0}to{opacity:1}}

  .reveal-particles{position:fixed;inset:0;pointer-events:none;z-index:51}

  .reveal-icon{font-size:4rem;display:block;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .reveal-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,169,110,.7);display:block;margin-bottom:.5rem}
  .reveal-main{
    font-size:clamp(1.3rem,5vw,1.7rem);font-weight:700;color:#fff;
    line-height:1.45;margin-bottom:.75rem;max-width:300px;
  }
  .reveal-main span{color:#c9a96e}
  .reveal-sub{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7;max-width:280px;margin-bottom:2rem}
  .reveal-btn{
    padding:.9rem 2.5rem;border-radius:50px;border:none;cursor:pointer;
    font-size:14px;font-weight:700;
    background:linear-gradient(135deg,#c9a96e,#8B6914);color:#fff;
    box-shadow:0 4px 20px rgba(201,169,110,.4);transition:all .2s;
  }
  .reveal-btn:active{transform:scale(.97)}

  :root{--gold:#c9a96e}

  /* Confetti */
  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}
  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- Stars -->
<script>
for(let i=0;i<50;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2+.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
  document.body.appendChild(s);
}
</script>

<div class="wrap">
  <span class="top-label">Dari Razan, buat kamu</span>
  <h1 class="top-title">Mystery <span>Box</span></h1>
  <p class="top-sub">Ada sesuatu di dalam kotak ini. Tapi dia keras kepala — perlu diklik berkali-kali sebelum mau buka 😏</p>

  <div class="box-wrap" id="box-wrap" onclick="onBoxClick()">
    <div class="box-glow"></div>
    <div class="box" id="box">
      <!-- Lid -->
      <div class="box-lid" id="box-lid"></div>
      <div class="box-bow" id="box-bow">
        <div class="bow-left"></div>
        <div class="bow-right"></div>
        <div class="bow-center"></div>
      </div>
      <!-- Body -->
      <div class="box-body">
        <div class="box-ribbon-h"></div>
      </div>
    </div>
  </div>

  <div class="progress-dots" id="progress-dots"></div>
  <div class="click-counter" id="click-counter">Klik kotak untuk mulai...</div>
  <button class="tap-btn" id="tap-btn" onclick="onBoxClick()">Buka! 🎁</button>
</div>

<!-- Reveal -->
<div id="reveal">
  <span class="reveal-icon">🎁</span>
  <span class="reveal-label">Isi Mystery Box</span>
  <p class="reveal-main">"Hadiahnya sebenarnya<br>bukan ini.<br><span>Hadiahnya kamu."</span></p>
  <p class="reveal-sub">— Dari Razan, yang bersyukur setiap hari punya kamu 🤍</p>
  <button class="reveal-btn" onclick="resetBox()">Buka Lagi 🔄</button>
</div>

<script>
const MAX_CLICKS = 10;
const MESSAGES = [
  'Coba lagi...',
  'Masih terkunci nih 🔒',
  'Hmm, belum mau buka',
  'Diklik lagi dong...',
  'Sabar ya... bentar lagi',
  'Sedikit lagi! 👀',
  'Hampir! Hampir!',
  'Eh tunggu sebentar...',
  'Okeee... siap-siap ya',
  '...',
];

let clicks = 0;
let isOpening = false;
let lastClick = 0;

// Build progress dots
function buildDots(){
  const el=document.getElementById('progress-dots');
  el.innerHTML='';
  for(let i=0;i<MAX_CLICKS;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<clicks?' filled':'');
    d.id=`dot-${i}`;
    el.appendChild(d);
  }
}
buildDots();

function onBoxClick(){
  const now=Date.now();
  if(now-lastClick<250)return; // debounce
  lastClick=now;
  if(isOpening||clicks>=MAX_CLICKS)return;

  clicks++;
  buildDots();

  const box=document.getElementById('box');
  const counter=document.getElementById('click-counter');
  const wrap=document.getElementById('box-wrap');

  // Shake
  box.classList.remove('shake');
  void box.offsetWidth;
  box.classList.add('shake');
  setTimeout(()=>box.classList.remove('shake'),300);

  // Glow on
  wrap.classList.add('active');

  // Float question mark
  spawnQmark();

  // Update message
  if(clicks<MAX_CLICKS){
    counter.textContent=MESSAGES[clicks-1];
    counter.classList.remove('hot');
    void counter.offsetWidth;
    counter.classList.add('hot');
    setTimeout(()=>counter.classList.remove('hot'),300);
  }

  // Open!
  if(clicks>=MAX_CLICKS){
    isOpening=true;
    counter.textContent='...';
    document.getElementById('tap-btn').disabled=true;

    setTimeout(()=>{
      // Lid flies off
      document.getElementById('box-lid').classList.add('open');
      document.getElementById('box-bow').classList.add('open');

      // Box pop
      box.classList.remove('pop');
      void box.offsetWidth;
      box.classList.add('pop');

      // Particles burst
      for(let i=0;i<20;i++) setTimeout(()=>spawnQmark(true),i*60);

      setTimeout(()=>{
        confetti(100);
        setTimeout(()=>{
          document.getElementById('reveal').classList.add('show');
        },400);
      },500);
    },300);
  }
}

function spawnQmark(gold=false){
  const wrap=document.getElementById('box-wrap');
  const rect=wrap.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='qmark';
  el.textContent=gold?'✨':'?';
  el.style.cssText=`
    left:${rect.left+Math.random()*rect.width}px;
    top:${rect.top+Math.random()*rect.height*0.5}px;
    animation-duration:${.6+Math.random()*.8}s;
    animation-delay:${Math.random()*.2}s;
    font-size:${gold?'1.5rem':'1rem'};
    color:${gold?'#c9a96e':'rgba(201,169,110,.6)'};
  `;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function resetBox(){
  clicks=0;isOpening=false;
  document.getElementById('reveal').classList.remove('show');
  document.getElementById('box-lid').classList.remove('open');
  document.getElementById('box-bow').classList.remove('open');
  document.getElementById('box-wrap').classList.remove('active');
  document.getElementById('click-counter').textContent='Klik kotak untuk mulai...';
  document.getElementById('tap-btn').disabled=false;
  const box=document.getElementById('box');
  box.classList.remove('shake','pop');
  buildDots();
}

function confetti(n=60){
  const colors=['#c9a96e','#fff','#f0d080','#ffb3c6','#b8d4f0'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
  },i*20);
}
</script>
</body>
</html>
