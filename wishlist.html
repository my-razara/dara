<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wishlist Berdua — Razan & Dara 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="sync.js"></script>
<script src="sfx.js" defer></script>
<style>
  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;--rz:#4a7fc1;--rz2:#7eb3f5;--dr:#d9776b;--dr2:#f0a39a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font-family:'Poppins',sans-serif}
  html,body{background:var(--cream)}
  body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 15% 8%,rgba(232,196,176,.4),transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,rgba(201,169,110,.2),transparent 70%)}
  .hand{font-family:'Caveat',cursive}
  .wrap{max-width:480px;margin:0 auto;padding:calc(.9rem + env(safe-area-inset-top)) 1rem calc(2.5rem + env(safe-area-inset-bottom));position:relative;z-index:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .pill{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;cursor:pointer;white-space:nowrap}
  .pill.Razan{color:var(--rz)}.pill.Dara{color:var(--dr)}
  .head{text-align:center;margin:1rem 0 .9rem}
  .head .ico{font-size:2.6rem;display:block;line-height:1.1}
  .lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .title{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;margin:.15rem 0 .25rem;line-height:1.15}
  .title span{color:var(--rose)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}
  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}
  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}
  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}
  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}
  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}
  .chips{display:flex;gap:.35rem;flex-wrap:wrap}
  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}
  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}
  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .ov.center{align-items:center;padding:1.2rem}
  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}
  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}
  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}
  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
  .toast a{color:#ffd9c9}
  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}
  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}

  .bd-st{font-size:11px;color:var(--muted);text-align:center;min-height:1.1em;margin:-.4rem 0 .6rem}
  .bd-st.err{color:#b4554a}
  .seg{display:flex;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.15);border-radius:50px;padding:3px;margin-bottom:.8rem}
  .seg button{flex:1;min-width:0;border:none;background:none;border-radius:50px;padding:.55rem .3rem;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:var(--rose);color:#fff;font-weight:600}
  .info{border-radius:18px;padding:.8rem .95rem;margin-bottom:.8rem;font-size:12px;line-height:1.55;color:var(--deep);background:linear-gradient(135deg,#fff,#fdeee8);border:1px solid rgba(193,122,111,.2)}
  .info b{font-weight:600}
  .cnt{display:flex;gap:.45rem;margin-bottom:.8rem}
  .cnt div{flex:1;background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:16px;padding:.55rem .3rem;text-align:center}
  .cnt b{display:block;font-size:1.05rem;color:var(--deep)}
  .cnt small{font-size:10px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:.55rem}
  .wi{background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:18px;padding:.75rem .8rem;box-shadow:0 4px 14px rgba(193,122,111,.06)}
  .wi .r1{display:flex;gap:.7rem;align-items:flex-start}
  .wi .e{flex:0 0 44px;height:44px;border-radius:14px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .wi .tx{flex:1;min-width:0}
  .wi b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .wi .m{font-size:11px;color:var(--muted);margin-top:.15rem;line-height:1.45}
  .wi .m .pr{color:var(--deep);font-weight:600}
  .wi .note{font-size:11.5px;color:var(--ink);background:#fff8ec;border-radius:10px;padding:.4rem .6rem;margin-top:.45rem;overflow-wrap:anywhere}
  .wi .stars{color:#e0a43a;font-size:11px;letter-spacing:.05em}
  .wi .acts{display:flex;gap:.35rem;margin-top:.55rem;flex-wrap:wrap}
  .wi .acts a,.wi .acts button{font-size:11.5px;padding:.4rem .7rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--deep);cursor:pointer;text-decoration:none;white-space:nowrap}
  .wi .acts .claim{background:linear-gradient(135deg,#6f9ad6,#3f6aa8);border-color:transparent;color:#fff;font-weight:600}
  .wi .acts .mine{background:#e6f4ea;border-color:#bcd7b5;color:#2f7a4f;font-weight:600}
  .wi.got{opacity:.7}
  .wi.got b{text-decoration:line-through}
  .wi .taken{display:inline-block;margin-top:.45rem;font-size:11px;font-weight:600;color:#8a6fc4;background:#f1ecfb;border-radius:50px;padding:.25rem .65rem}
  .occ{display:inline-block;font-size:10px;font-weight:600;padding:.1rem .45rem;border-radius:20px;background:#fdf3e1;color:#a8782a;margin-right:.25rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.two>div{min-width:0}
  .emo{display:flex;gap:.3rem;flex-wrap:wrap}
  .emo button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--blush);background:#fff;font-size:1.1rem;cursor:pointer;padding:0}
  .emo button.on{border-color:var(--rose);background:#fdeee8}
  .starpick{display:flex;gap:.35rem}
  .starpick button{flex:1;padding:.5rem .2rem;border-radius:12px;border:1.5px solid var(--blush);background:#fff;font-size:11.5px;color:var(--muted);cursor:pointer}
  .starpick button.on{border-color:#e0a43a;background:#fff6e3;color:#8a5a12;font-weight:600}
  details.done summary{list-style:none;cursor:pointer;text-align:center;font-size:12px;color:var(--muted);margin:1.1rem 0 .6rem}
  details.done summary::-webkit-details-marker{display:none}

</style>
</head>
<body>

<div class="wrap">
  <div class="top"><a href="index.html" class="pill">← Menu utama</a><button class="pill" id="who-btn"></button></div>
  <div class="head"><span class="ico">🎁</span><p class="lbl">Berdua</p><h1 class="title">Wishlist <span>Berdua</span></h1><p class="sub">Catat barang yang lagi diincer — pasangan bisa diem-diem ngeklaim mau beliin 🤫</p></div>
  <p class="bd-st" id="bd-st"></p>
  <div class="seg" id="seg"></div>
  <div id="main"></div>
</div>

<div class="ov" id="ed-ov" onclick="if(event.target===this)closeOv('ed-ov')"><div class="sheet">
  <div class="drag"></div>
  <h3 style="font-size:15px;font-weight:700;text-align:center" id="ed-h">🎁 Tambah wishlist</h3>
  <label class="lab">Barang apa?</label><input class="inp" id="ed-t" maxlength="70" placeholder="mis. Tumbler Stanley warna pink">
  <div class="two"><div><label class="lab">Kira-kira harganya</label><input class="inp" id="ed-p" inputmode="numeric" placeholder="Rp 0"></div><div><label class="lab">Buat kapan?</label><select class="inp" id="ed-o"></select></div></div>
  <label class="lab">Link toko <span style="font-weight:400;color:var(--muted)">(opsional)</span></label><input class="inp" id="ed-l" maxlength="400" placeholder="Tempel link Shopee / Tokopedia / dll">
  <label class="lab">Catatan <span style="font-weight:400;color:var(--muted)">(ukuran, warna, varian…)</span></label><input class="inp" id="ed-n" maxlength="140" placeholder="mis. size M, warna sage">
  <label class="lab">Seberapa pengen?</label><div class="starpick" id="ed-s"></div>
  <label class="lab">Stiker</label><div class="emo" id="ed-e"></div>
  <div class="row"><button class="btn ghost" onclick="closeOv('ed-ov')">Batal</button><button class="btn" onclick="saveEd()">Simpan</button></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const WA = { Razan: '6285692740607', Dara: '6287703706518' };
const JADIAN = '2025-05-10';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function parseYMD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
const otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';
const waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;
let __toastT;
function toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }
function confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {
  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);
}
async function shareCanvas(cv, name, title) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇️ Gambar disimpan');
}
function wrapText(ctx, text, maxW) { const out = []; String(text).split('\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }
async function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }
// siapa yang lagi pakai HP ini (Razan / Dara)
function whoBtn(key, onChange) {
  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');
  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };
  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };
  paint(); return lsGet(key, 'Dara');
}

const BD = window.Berdua || { put(app, who, date, data) { const k = app + '-' + who, m = lsGet(k, {}); if (data == null) delete m[date]; else m[date] = data; lsSet(k, m); }, me: () => lsGet('berdua-me', 'Dara'), setMe(w) { lsSet('berdua-me', w); }, status: () => '', on() {}, enabled: false };
const EMO = ['🎁', '👗', '👟', '👜', '💄', '📚', '🎧', '📱', '🧸', '💍', '🌸', '☕', '🍰', '🎮', '✈️', '✨'];
const OCC = [['', '✨ Kapan aja'], ['ultah', '🎂 Ultah'], ['anniv', '💍 Anniv'], ['mensive', '💗 Mensive'], ['tahun', '🎄 Akhir tahun']];
const STAR = [[1, '🙂 Lumayan'], [2, '😍 Pengen'], [3, '🥺 Pengen banget']];
if (lsGet('wish-me', null) == null) lsSet('wish-me', BD.me());
let me = whoBtn('wish-me', () => { me = lsGet('wish-me', 'Dara'); BD.setMe(me); tab = 'me'; render(); });
BD.setMe(me);
let tab = lsGet('wish-tab', 'me');
const uid = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const rp = n => n ? 'Rp ' + Number(n).toLocaleString('id-ID') : '';
const occName = k => (OCC.find(o => o[0] === k) || OCC[0])[1];
function items(owner) {
  const out = [];
  Object.entries(lsGet('wish-' + owner, {}) || {}).forEach(([date, row]) => (row && row.items || []).forEach(it => out.push(Object.assign({}, it, { owner, date }))));
  return out;
}
function rowItems(owner, date) { return ((lsGet('wish-' + owner, {}) || {})[date] || {}).items || []; }
function strip(it) { const x = Object.assign({}, it); delete x.owner; delete x.date; return x; }
function saveItem(it) { const arr = rowItems(it.owner, it.date).filter(x => x.id !== it.id); arr.push(strip(it)); BD.put('wish', it.owner, it.date, { items: arr }); }
function delItem(it) { const arr = rowItems(it.owner, it.date).filter(x => x.id !== it.id); BD.put('wish', it.owner, it.date, arr.length ? { items: arr } : null); }
function find(id) { return items('Razan').concat(items('Dara')).find(x => x.id === id); }
function nextDay(m, d) { const t = today0(); let x = new Date(t.getFullYear(), m - 1, d); if (x < t) x = new Date(t.getFullYear() + 1, m - 1, d); return Math.round((x - t) / 864e5); }

function bdStatus() { const el = $('bd-st'), t = BD.status(); el.textContent = t; el.className = 'bd-st' + (/⚠️/.test(t) ? ' err' : ''); }
function render() {
  bdStatus(); lsSet('wish-tab', tab);
  const o = otherOf(me);
  $('seg').innerHTML = `<button class="${tab === 'me' ? 'on' : ''}" data-t="me">🎁 Wishlist aku</button><button class="${tab === 'ot' ? 'on' : ''}" data-t="ot">👀 Wishlist ${o}</button>`;
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  tab === 'me' ? renderMine() : renderOther();
}
const sortW = (a, b) => (a.got - b.got) || ((b.s || 1) - (a.s || 1)) || ((b.at || 0) - (a.at || 0));
function renderMine() {
  const L = items(me).sort(sortW), act = L.filter(x => !x.got), got = L.filter(x => x.got), o = otherOf(me);
  const total = act.reduce((a, x) => a + (+x.p || 0), 0);
  $('main').innerHTML = `<div class="info">🤫 <b>${o}</b> bisa liat wishlist kamu & diem-diem ngeklaim mau beliin yang mana. Kamu <b>ga bakal tau</b> barang mana yang udah diklaim — biar tetep jadi kejutan!</div>
    <div class="cnt"><div><b>${act.length}</b><small>lagi diincer</small></div><div><b>${got.length}</b><small>udah kesampaian</small></div><div><b>${total ? rp(total).replace('Rp ', '') : '–'}</b><small>total (Rp)</small></div></div>
    <button class="btn" onclick="openEd()" style="margin-bottom:.8rem">＋ Tambah wishlist</button>
    <div class="list">${act.map(x => cardMine(x)).join('') || '<p class="empty">Belum ada. Ayo tulis barang yang lagi kamu pengenin 🛍️</p>'}</div>
    ${got.length ? `<details class="done"><summary>🎉 Udah kesampaian (${got.length}) ▾</summary><div class="list">${got.map(x => cardMine(x)).join('')}</div></details>` : ''}`;
}
function meta(x) { return `${x.o ? `<span class="occ">${occName(x.o)}</span>` : ''}${x.p ? `<span class="pr">${rp(x.p)}</span> · ` : ''}<span class="stars">${'★'.repeat(x.s || 1)}${'☆'.repeat(3 - (x.s || 1))}</span>`; }
function linkBtn(x) { return x.l ? `<a href="${esc(/^https?:\/\//.test(x.l) ? x.l : 'https://' + x.l)}" target="_blank" rel="noopener">🔗 Liat barangnya</a>` : ''; }
function cardMine(x) {
  return `<div class="wi ${x.got ? 'got' : ''}"><div class="r1"><span class="e">${esc(x.e || '🎁')}</span><span class="tx"><b>${esc(x.t)}</b><div class="m">${meta(x)}</div></span></div>
    ${x.n ? `<div class="note">📝 ${esc(x.n)}</div>` : ''}
    <div class="acts">${linkBtn(x)}${x.got ? `<button onclick="gotIt('${x.id}',false)">↩️ Balikin</button>` : `<button onclick="gotIt('${x.id}',true)">✅ Udah punya</button>`}<button onclick="openEd('${x.id}')">✏️</button><button onclick="del('${x.id}')">🗑</button></div></div>`;
}
function renderOther() {
  const o = otherOf(me), L = items(o).sort(sortW), act = L.filter(x => !x.got), got = L.filter(x => x.got);
  const mine = act.filter(x => x.c && x.c.by === me);
  const ul = o === 'Dara' ? nextDay(8, 18) : null, an = nextDay(5, 10);
  $('main').innerHTML = `<div class="info">${o === 'Dara' ? `🎂 Ultah Dara <b>${ul === 0 ? 'hari ini!' : ul + ' hari lagi'}</b> · ` : ''}💍 Anniv <b>${an === 0 ? 'hari ini!' : an + ' hari lagi'}</b><br>Tap <b>🤫 Aku yang beliin</b> buat ngeklaim — ${o} ga bakal tau 😏</div>
    <div class="cnt"><div><b>${act.length}</b><small>diincer ${o}</small></div><div><b>${mine.length}</b><small>kamu klaim</small></div><div><b>${mine.length ? rp(mine.reduce((a, x) => a + (+x.p || 0), 0)).replace('Rp ', '') || '–' : '–'}</b><small>budget (Rp)</small></div></div>
    <div class="list">${act.map(x => cardOther(x)).join('') || `<p class="empty">${o} belum nulis wishlist. Coba kode-kodein dia buat nulis 😆</p>`}</div>
    ${got.length ? `<details class="done"><summary>🎉 Udah kesampaian (${got.length}) ▾</summary><div class="list">${got.map(x => cardOther(x)).join('')}</div></details>` : ''}`;
}
function cardOther(x) {
  const c = x.c, byMe = c && c.by === me;
  return `<div class="wi ${x.got ? 'got' : ''}"><div class="r1"><span class="e">${esc(x.e || '🎁')}</span><span class="tx"><b>${esc(x.t)}</b><div class="m">${meta(x)}</div></span></div>
    ${x.n ? `<div class="note">📝 ${esc(x.n)}</div>` : ''}
    ${!x.got ? `<div class="acts">${linkBtn(x)}${byMe ? `<button class="mine" onclick="claim('${x.id}',false)">✓ Kamu yang beliin · batalin</button>` : `<button class="claim" onclick="claim('${x.id}',true)">🤫 Aku yang beliin</button>`}</div>` : ''}
    ${byMe && c.at ? `<span class="taken">🤫 Diklaim ${fmtD(new Date(c.at))} — rahasia ya!</span>` : ''}</div>`;
}
function claim(id, on) {
  const x = find(id); if (!x) return;
  if (on) { x.c = { by: me, at: Date.now() }; confetti(20); vib([10, 30, 10]); toast(`🤫 Diklaim! ${x.owner} ga bakal tau`); }
  else { delete x.c; toast('Klaim dibatalin'); }
  saveItem(x); render();
}
function gotIt(id, v) { const x = find(id); if (!x) return; x.got = v; if (v) { delete x.c; confetti(30); toast('🎉 Yeay, kesampaian!'); } saveItem(x); render(); }
function del(id) { const x = find(id); if (!x || !confirm(`Hapus “${x.t}” dari wishlist?`)) return; delItem(x); render(); }

/* ── tambah / ubah ── */
let ed = null;
function openEd(id) {
  const src = id ? find(id) : null;
  ed = src ? Object.assign({}, src) : { id: uid(), owner: me, date: ymd(today0()), t: '', p: '', l: '', n: '', o: '', s: 2, e: '🎁', at: Date.now() };
  $('ed-h').textContent = src ? '✏️ Ubah wishlist' : '🎁 Tambah wishlist';
  $('ed-t').value = ed.t; $('ed-p').value = ed.p ? Number(ed.p).toLocaleString('id-ID') : ''; $('ed-l').value = ed.l || ''; $('ed-n').value = ed.n || '';
  $('ed-o').innerHTML = OCC.map(([k, n]) => `<option value="${k}" ${ed.o === k ? 'selected' : ''}>${n}</option>`).join('');
  paintEd(); $('ed-ov').classList.add('show'); setTimeout(() => !src && $('ed-t').focus(), 250);
}
function paintEd() {
  $('ed-s').innerHTML = STAR.map(([v, n]) => `<button class="${ed.s === v ? 'on' : ''}" data-v="${v}">${n}</button>`).join('');
  $('ed-s').querySelectorAll('button').forEach(b => b.onclick = () => { ed.s = +b.dataset.v; paintEd(); });
  $('ed-e').innerHTML = EMO.map(e => `<button class="${ed.e === e ? 'on' : ''}">${e}</button>`).join('');
  $('ed-e').querySelectorAll('button').forEach(b => b.onclick = () => { ed.e = b.textContent; paintEd(); });
}
$('ed-p').addEventListener('input', () => { const n = $('ed-p').value.replace(/\D/g, '').slice(0, 10); $('ed-p').value = n ? Number(n).toLocaleString('id-ID') : ''; });
function saveEd() {
  const t = $('ed-t').value.trim(); if (!t) { toast('Isi nama barangnya dulu 🙈'); $('ed-t').focus(); return; }
  Object.assign(ed, { t, p: +$('ed-p').value.replace(/\D/g, '') || 0, l: $('ed-l').value.trim(), n: $('ed-n').value.trim(), o: $('ed-o').value });
  saveItem(ed); closeOv('ed-ov'); tab = 'me'; render(); vib(15); toast(`🎁 Kesimpen${BD.enabled ? ` · ${otherOf(me)} bisa liat` : ''}`);
}
function closeOv(id) { $(id).classList.remove('show'); }
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if (ev.apps.includes('wish')) render(); });
render();

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
