dua\" id=\"result-who\">👫 Berdua<\/div><div class=\"pips\" id=\"result-pip\"><\/div><\/div>\n      <p class=\"result-dare\" id=\"result-dare\">...<\/p>\n      <p class=\"result-note\" id=\"result-note\"><\/p>\n      <div class=\"timer-box\" id=\"timer-box\"><span class=\"timer-num\" id=\"timer-num\">1:00<\/span><div class=\"timer-bar\"><i id=\"timer-bar\"><\/i><\/div><button class=\"timer-btn\" id=\"timer-btn\" onclick=\"toggleTimer()\">▶ Mulai<\/button><\/div>\n      <div class=\"rc-actions\">\n        <button class=\"act done\" id=\"act-done\" onclick=\"finishDare()\">✓ Misi Selesai<\/button>\n        <button class=\"act skip\" id=\"act-skip\" onclick=\"skipDare()\">🙈 Skip<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"done-card\" id=\"done-card\">\n      <span class=\"done-emoji\">🎉<\/span>\n      <h2 class=\"done-title\" id=\"done-title\">Semua misi selesai!<\/h2>\n      <p class=\"done-msg\" id=\"done-msg\"><\/p>\n      <div class=\"stats\"><div class=\"stat\"><b id=\"st-done\">0<\/b><span>Dilakuin<\/span><\/div><div class=\"stat\"><b id=\"st-skip\">0<\/b><span>Di-skip<\/span><\/div><div class=\"stat\"><b id=\"st-spin\">0<\/b><span>Putaran<\/span><\/div><\/div>\n      <button class=\"btn btn-primary\" onclick=\"startGame()\">Main Lagi 🔄<\/button>\n      <button class=\"btn btn-outline\" onclick=\"openHistory()\">📜 Lihat Riwayat Misi<\/button>\n      <button class=\"btn btn-outline\" onclick=\"showScreen('screen-intro')\">Ganti Level<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- RIWAYAT -->\n<div class=\"sheet-bg\" id=\"hist-sheet\" onclick=\"if(event.target===this)this.classList.remove('show')\">\n  <div class=\"sheet\"><h3>📜 Riwayat Misi<\/h3><div id=\"hist-list\"><\/div><\/div>\n<\/div>\n\n<\script>\n// ── DARE DATA — 3 levels, 10 misi masing-masing (timer = detik, buat misi yang ada durasinya) ──\nconst DARES_L1 = [\n  {who:'berdua',text:'Saling kasih pujian — masing-masing sebut 1 hal yang paling mereka suka dari penampilan satu sama lain hari ini. Harus spesifik, bukan generik!',note:'Bukan \"kamu cantik/ganteng\" doang. Harus detail.',color:'#c17a6f'},\n  {who:'berdua',text:'Tukar HP sebentar — masing-masing cari 1 foto favorit dari galeri yang satunya dan tunjukin ke orangnya. Jelaskan kenapa foto itu favorit.',note:'Jujur aja — ga ada yang boleh protes.',color:'#c4a0a8'},\n  {who:'berdua',text:'Masing-masing ceritain 1 hal lucu atau random yang terjadi hari ini — yang lain dengerin dan boleh ketawa sepuasnya.',note:'Sekecil apapun ceritanya, tetap harus diceritain.',color:'#b5c4b1'},\n  {who:'berdua',text:'Kalian harus bikin playlist bareng sekarang — masing-masing tambahin 3 lagu yang mengingatkan ke satu sama lain. Putar salah satunya sekarang.',note:'Harus didengarkan sekarang, bukan nanti.',color:'#c9a96e'},\n  {who:'berdua',text:'Gambar wajah satu sama lain di HP dalam 30 detik — tanpa boleh ngintip ke orangnya. Tunjukkan hasilnya dan nilai 1-10.',note:'Makin jelek makin lucu. Harus disimpan!',color:'#b5a090',timer:30},\n  {who:'razan',text:'Razan: kirimkan voice note ke Dara sekarang — isi dengan 3 hal yang bikin kamu senang hari ini karena dia ada.',note:'Harus pakai suara. Bukan chat biasa.',color:'#c17a6f'},\n  {who:'razan',text:'Razan: traktir Dara minuman favoritnya sekarang atau saat ketemu berikutnya — Dara yang pesan, Razan yang bayar tanpa komplain.',note:'Dara yang pilih. Razan yang bayar. Titik.',color:'#c9a96e'},\n  {who:'razan',text:'Razan: sebutkan 3 kebiasaan kecil Dara yang tanpa sadar sering kamu perhatiin — hal yang mungkin Dara sendiri ga sadar.',note:'Yang kecil-kecil yang manis itu.',color:'#b5a090'},\n  {who:'dara',text:'Dara: pilih satu lagu yang menurutmu paling menggambarkan perasaanmu ke Razan sekarang — putar dan ceritain kenapa.',note:'Harus langsung diputar sekarang.',color:'#c4a0a8'},\n  {who:'dara',text:'Dara: kirim pesan panjang ke Razan sekarang di chat — isi hal-hal kecil yang kamu syukuri dari dia belakangan ini.',note:'Minimal 5 kalimat. Bukan cuma emoji.',color:'#b5c4b1'},\n];\nconst DARES_L2 = [\n  {who:'berdua',text:'Masing-masing jawab jujur: \"Momen apa yang paling bikin kamu ngerasa paling dekat sama aku?\" — cerita bergantian, yang lain dengerin tanpa motong.',note:'Dengerin sampai selesai dulu baru boleh respons.',color:'#c17a6f'},\n  {who:'berdua',text:'Tatap mata satu sama lain 1 menit penuh — boleh senyum tapi ga boleh ngomong. Setelah selesai, masing-masing bilang 1 kata yang menggambarkan apa yang dirasain.',note:'Timer 1 menit. Ga boleh buang muka.',color:'#c4a0a8',timer:60},\n  {who:'berdua',text:'Masing-masing tulis di HP: \"Hal yang aku paling takutkan dari kehilangan kamu adalah...\" — tukar HP dan baca bareng.',note:'Jujur. Ini bukan buat dihakimi, tapi buat dipahami.',color:'#a09080'},\n  {who:'berdua',text:'Challenge: siapa yang bisa tahan ga ketawa lebih lama saat saling bikin muka paling konyol? Yang kalah harus dengerin cerita yang satunya tanpa protes selama 5 menit.',note:'Harus serius main ini. Ga boleh langsung nyerah.',color:'#b5c4b1',timer:300},\n  {who:'berdua',text:'Masing-masing sebut 1 hal yang ingin kamu ubah dari kebiasaanmu sendiri supaya hubungan ini lebih baik — bukan nyalahin yang satunya.',note:'Tentang diri sendiri, bukan pasangan.',color:'#c9a96e'},\n  {who:'razan',text:'Razan: ceritakan ke Dara momen pertama kamu mulai beneran suka sama dia — sedetail mungkin, kapan, di mana, sedang ngapain.',note:'Harus serius nyeritainnya. Bukan bercanda.',color:'#c17a6f'},\n  {who:'razan',text:'Razan: jawab jujur — satu hal apa yang paling bikin kamu bangga dari Dara yang mungkin jarang kamu ucapin ke dia langsung.',note:'Harus tatap mata saat ngomongnya.',color:'#b5a090'},\n  {who:'razan',text:'Razan: pijitin tangan Dara 2 menit — Dara yang nilai hasilnya 1-10. Kalau di bawah 7, harus ngulang.',note:'Dara yang jadi juri mutlak.',color:'#c4a0a8',timer:120},\n  {who:'dara',text:'Dara: jawab jujur ke Razan — satu momen apa yang bikin kamu paling ngerasa disayang sama dia? Ceritain dengan detail.',note:'Harus cerita lengkap, bukan jawaban singkat.',color:'#b5a090'},\n  {who:'dara',text:'Dara: bilang ke Razan satu hal yang kamu pengen dia lakuin lebih sering — bukan nyalahin, tapi harapan yang tulus.',note:'Razan hanya boleh dengerin dan bilang \"iya, aku usahain\".',color:'#c9a96e'},\n];\nconst DARES_L3 = [\n  {who:'berdua',text:'Peluk erat selama 2 menit penuh — tangan harus melingkar kuat, kepala senderan. Ga boleh ada yang ngomong. Nikmatin aja momennya.',note:'2 menit. Timer harus dipasang. Harus beneran dipeluk.',color:'#c17a6f',special:true,timer:120},\n  {who:'berdua',text:'Masing-masing tulis surat pendek di HP — \"Kalau aku bisa ngomong satu hal yang selama ini aku pendam ke kamu, aku mau bilang...\" — tukar dan baca diam-diam dulu.',note:'Jangan baca keras-keras. Resapi dulu sendiri.',color:'#a09080',special:true},\n  {who:'berdua',text:'Genggam tangan satu sama lain, tutup mata, dan diam 2 menit. Bayangkan hal yang paling kamu syukuri dari hubungan ini. Setelah selesai, ceritakan satu hal yang tadi kamu bayangkan.',note:'Ga boleh skip. Harus beneran tutup mata dan diam.',color:'#c9a96e',special:true,timer:120,noSkip:true},\n  {who:'berdua',text:'Masing-masing jawab: \"Satu hal dari kamu yang bikin aku yakin kita bisa jalan jauh adalah...\" — jawab bareng-bareng, kasih ke satu sama lain.',note:'Jujur. Bukan yang kedengarannya bagus, tapi yang beneran dirasain.',color:'#b5a090',special:true},\n  {who:'razan',text:'Razan: bisikkan ke Dara — ceritain satu hal yang selama ini kamu rasain tapi belum pernah kamu bilang langsung. Apapun itu.',note:'Pelan. Di dekat telinga. Serius.',color:'#c17a6f',special:true},\n  {who:'razan',text:'Razan: usap rambut Dara pelan-pelan selama 1 menit tanpa ngomong apapun — cukup hadir, cukup lembut.',note:'Tanpa diminta. Tanpa ekspektasi. Cukup hadir.',color:'#c9a96e',special:true,timer:60},\n  {who:'razan',text:'Razan: tatap mata Dara dan jawab — \"Hal yang paling aku takutkan dari kehilanganmu adalah...\" Harus dijawab dengan serius, bukan bercanda.',note:'Tatap mata sampai selesai ngomong.',color:'#b5a090',special:true},\n  {who:'dara',text:'Dara: bilang ke Razan dengan tatap mata langsung — kenapa kamu milih dia. Bukan yang kedengarannya bagus, tapi satu alasan yang paling jujur dari hati.',note:'Harus tatap mata. Harus jujur. Bukan jawaban template.',color:'#c4a0a8',special:true},\n  {who:'dara',text:'Dara: ceritain ke Razan — satu momen ketika kamu paling ngerasa beruntung punya dia. Sekecil apapun momennya.',note:'Razan hanya boleh dengerin. Ga boleh potong. Ga boleh ngomong dulu.',color:'#a09080',special:true},\n  {who:'dara',text:'Dara: pegang tangan Razan, tatap matanya, dan bilang satu janji kecil yang bisa kamu tepati minggu ini — bukan janji besar, tapi yang beneran.',note:'Razan harus ingat dan boleh tagih minggu depan.',color:'#c17a6f',special:true},\n];\nconst tag = (arr, lv) => arr.map(d => ({ ...d, lv }));\nconst LEVELS = {\n  1: { label: '🌸 Bucin Biasa', cls: 'l1', dares: () => tag(DARES_L1, 1) },\n  2: { label: '💌 Bucin Normal', cls: 'l2', dares: () => tag(DARES_L2, 2) },\n  3: { label: '🔥 Bucin Banget', cls: 'l3', dares: () => tag(DARES_L3, 3) },\n  4: { label: '🎲 Campur Semua', cls: 'l4', dares: () => [...tag(DARES_L1, 1), ...tag(DARES_L2, 2), ...tag(DARES_L3, 3)] },\n};\nconst MAX_SKIP = 2;\n\n// ── STATE ──\nlet selectedLevel = 1, remaining = [], currentAngle = 0, isSpinning = false, current = null, history = [], skipsLeft = MAX_SKIP, spins = 0;\nlet timer = null;\nconst $ = id => document.getElementById(id);\nconst canvas = $('wheel-canvas'), ctx = canvas.getContext('2d');\nlet SIZE = 300, CX = 150, CY = 150, R = 146;\n\nfunction setupCanvas() {\n  const dpr = Math.min(window.devicePixelRatio || 1, 3);\n  SIZE = canvas.clientWidth || 300;\n  canvas.width = Math.round(SIZE * dpr); canvas.height = Math.round(SIZE * dpr);\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  CX = CY = SIZE / 2; R = SIZE / 2 - 4;\n}\nwindow.addEventListener('resize', () => { if ($('screen-game').classList.contains('active')) { setupCanvas(); drawWheel(currentAngle); } });\n\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0, 0); stopTimer(); }\nfunction selLevel(n) { selectedLevel = n; [1, 2, 3, 4].forEach(x => $('lc-' + x).classList.toggle('sel', x === n)); }\nfunction shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\n\n// ── START ──\nfunction startGame() {\n  remaining = shuffle(LEVELS[selectedLevel].dares());\n  currentAngle = 0; isSpinning = false; current = null; history = []; skipsLeft = MAX_SKIP; spins = 0;\n  const lv = LEVELS[selectedLevel]; $('gh-level').textContent = lv.label; $('gh-level').className = 'gh-level ' + lv.cls;\n  $('result-card').classList.remove('show'); $('done-card').classList.remove('show');\n  const sb = $('spin-btn'); sb.style.display = 'block'; sb.disabled = false; sb.textContent = 'Putar Roda Sayang!';\n  showScreen('screen-game');\n  requestAnimationFrame(() => { setupCanvas(); drawWheel(currentAngle); });\n  updateCounter();\n}\nfunction updateCounter() { $('remaining-count').textContent = remaining.length; $('hist-count').textContent = history.filter(h => h.done).length; }\n\n// ── DRAW ──\nfunction drawWheel(angle) {\n  ctx.clearRect(0, 0, SIZE, SIZE);\n  const total = remaining.length;\n  if (!total) {\n    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 2 * Math.PI); ctx.fillStyle = '#f5ede0'; ctx.fill();\n    ctx.fillStyle = '#9a8070'; ctx.font = '14px Poppins,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Semua selesai! 🤍', CX, CY + 45); return;\n  }\n  const arc = 2 * Math.PI / total;\n  remaining.forEach((d, i) => {\n    const s = angle + i * arc;\n    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, R, s, s + arc); ctx.closePath();\n    ctx.fillStyle = remaining[(i + 1) % total].color === d.color && i % 2 ? shade(d.color) : d.color; ctx.fill();   // warna kembar sebelahan dibedain dikit\n    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.5; ctx.stroke();\n    ctx.save(); ctx.translate(CX, CY); ctx.rotate(s + arc / 2);\n    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n    ctx.font = `${Math.max(10, Math.min(16, 200 / total))}px serif`;\n    ctx.fillText(d.who === 'berdua' ? '👫' : d.who === 'razan' ? '🧑' : '👧', R - 10, 0);\n    if (selectedLevel === 4 && total <= 16) { ctx.font = `${Math.max(8, Math.min(11, 150 / total))}px serif`; ctx.fillText(d.lv === 3 ? '🔥' : d.lv === 2 ? '💌' : '🌸', R - 34, 0); }\n    ctx.restore();\n  });\n  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(45,31,26,.15)'; ctx.lineWidth = 3; ctx.stroke();\n}\nfunction shade(hex) { const c = parseInt(hex.slice(1), 16), f = v => Math.max(0, v - 18); return '#' + ((1 << 24) + (f(c >> 16) << 16) + (f((c >> 8) & 255) << 8) + f(c & 255)).toString(16).slice(1); }\n\n// ── SPIN ──\nfunction spinWheel() {\n  if (isSpinning || !remaining.length || current) return;\n  isSpinning = true; spins++; $('spin-btn').disabled = true; $('result-card').classList.remove('show');\n  const total = (5 + Math.random() * 4) * 2 * Math.PI + Math.random() * 2 * Math.PI, dur = 3500 + Math.random() * 1000, t0 = performance.now(), a0 = currentAngle;\n  let lastTick = -1;\n  const ease = t => 1 - Math.pow(1 - t, 4);\n  const anim = now => {\n    const p = Math.min((now - t0) / dur, 1);\n    currentAngle = a0 + total * ease(p); drawWheel(currentAngle);\n    const seg = Math.floor(((3 * Math.PI / 2 - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) / (2 * Math.PI / remaining.length));\n    if (seg !== lastTick) { lastTick = seg; if (p < .95) vib(4); }\n    if (p < 1) requestAnimationFrame(anim); else { currentAngle %= 2 * Math.PI; isSpinning = false; pickResult(); }\n  };\n  requestAnimationFrame(anim);\n}\n\nfunction pickResult() {\n  const total = remaining.length, arc = 2 * Math.PI / total;\n  const norm = ((3 * Math.PI / 2 - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);\n  const idx = Math.floor(norm / arc) % total;\n  current = remaining[idx];\n  const pipColors = ['#b5c4b1', '#c17a6f', '#7a3f35'];\n  $('result-pip').innerHTML = [1, 2, 3].map(i => `<div class=\"pip-dot\" style=\"background:${i <= current.lv ? pipColors[i - 1] : 'rgba(0,0,0,.1)'}\"><\/div>`).join('');\n  const W = { berdua: ['👫 Berdua', 'berdua'], razan: ['🧑 Misi Razan', 'razan'], dara: ['👧 Misi Dara', 'dara'] }[current.who];\n  $('result-who').textContent = W[0]; $('result-who').className = 'result-who ' + W[1];\n  $('result-dare').textContent = current.text; $('result-note').textContent = current.note || '';\n  // timer\n  stopTimer();\n  if (current.timer) { $('timer-box').classList.add('show'); resetTimerUI(current.timer); } else $('timer-box').classList.remove('show');\n  const skip = $('act-skip');\n  skip.disabled = !skipsLeft || current.noSkip;\n  skip.textContent = current.noSkip ? '🚫 Ga boleh skip' : skipsLeft ? `🙈 Skip (${skipsLeft})` : '🙈 Skip habis';\n  const card = $('result-card'); card.classList.add('show'); card.style.borderColor = (current.color || '#c17a6f') + '66';\n  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);\n  vib([30, 20, 60]);\n  if (current.special) launchConfetti();\n  $('spin-btn').textContent = 'Selesaikan misinya dulu 🤍';\n}\n\n// ── TIMER ──\nfunction resetTimerUI(sec) { $('timer-num').textContent = fmt(sec); $('timer-bar').style.width = '100%'; $('timer-btn').textContent = '▶ Mulai'; timer = { total: sec, left: sec, iv: null }; }\nfunction fmt(s) { const t = Math.ceil(s); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }\nfunction toggleTimer() {\n  if (!timer) return;\n  if (timer.iv) { clearInterval(timer.iv); timer.iv = null; $('timer-btn').textContent = '▶ Lanjut'; return; }\n  if (timer.left <= 0) resetTimerUI(timer.total);\n  let last = performance.now();\n  $('timer-btn').textContent = '⏸ Jeda';\n  timer.iv = setInterval(() => {\n    const now = performance.now(); timer.left = Math.max(0, timer.left - (now - last) / 1000); last = now;\n    $('timer-num').textContent = fmt(timer.left); $('timer-bar').style.width = (timer.left / timer.total * 100) + '%';\n    if (timer.left <= 0) { clearInterval(timer.iv); timer.iv = null; $('timer-num').textContent = '0:00'; $('timer-btn').textContent = '↺ Ulang'; vib([200, 100, 200]); beep(); }\n  }, 200);\n}\nfunction stopTimer() { if (timer && timer.iv) clearInterval(timer.iv); timer = null; }\nfunction beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .35); } catch {} }\n\n// ── SELESAI / SKIP ──\nfunction finishDare() {\n  if (!current) return;\n  stopTimer();\n  history.push({ ...current, done: true });\n  remaining = remaining.filter(d => d !== current);\n  current = null; vib(40);\n  $('result-card').classList.remove('show');\n  afterResolve();\n}\nfunction skipDare() {\n  if (!current || !skipsLeft || current.noSkip) return;\n  stopTimer(); skipsLeft--;\n  history.push({ ...current, done: false });\n  current = null;   // misi balik ke roda, bisa kena lagi nanti 😏\n  $('result-card').classList.remove('show');\n  afterResolve();\n}\nfunction afterResolve() {\n  updateCounter(); drawWheel(currentAngle);\n  const sb = $('spin-btn');\n  if (!remaining.length) { sb.style.display = 'none'; showDone(); return; }\n  sb.disabled = false; sb.textContent = 'Putar Lagi! 🎡';\n}\nfunction showDone() {\n  const done = history.filter(h => h.done).length, skip = history.filter(h => !h.done).length;\n  const msgs = {\n    1: 'Kalian udah lakuin semua 10 misi Bucin Biasa — manis banget! Berani naik ke level Normal? 💌',\n    2: 'Kalian udah selesaiin 10 misi Bucin Normal — udah cukup berani! Berani coba Bucin Banget? 🔥',\n    3: 'Kalian udah lakuin semua 10 misi Bucin Banget — dari pelukan panjang sampai janji kecil. Makin bucin kan? 🤍',\n    4: 'Kalian udah lakuin semua 30 misi — dari yang manis sampai yang bikin baper abis. Level bucin: MAX 🔥🤍',\n  };\n  $('done-title').textContent = selectedLevel >= 3 ? 'Bucin level maxed out! 🔥' : 'Semua misi selesai! 🎉';\n  $('done-msg').textContent = msgs[selectedLevel];\n  $('st-done').textContent = done; $('st-skip').textContent = skip; $('st-spin').textContent = spins;\n  $('done-card').classList.add('show');\n  setTimeout(() => $('done-card').scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);\n  launchConfetti();\n}\n\n// ── RIWAYAT ──\nfunction openHistory() {\n  const L = $('hist-list');\n  L.innerHTML = history.length ? history.map((h, i) => `<div class=\"h-item ${h.done ? '' : 'skip'}\"><span>${h.done ? '✅' : '🙈'}<\/span><div><small>${i + 1}. ${h.who === 'berdua' ? '👫 Berdua' : h.who === 'razan' ? '🧑 Razan' : '👧 Dara'} · ${['', '🌸', '💌', '🔥'][h.lv]}${h.done ? '' : ' · di-skip'}<\/small>${h.text}<\/div><\/div>`).join('') : '<div class=\"empty\">Belum ada misi yang dilakuin. Putar dulu rodanya! 🎡<\/div>';\n  $('hist-sheet').classList.add('show');\n}\n\n// ── CONFETTI ──\nfunction launchConfetti() {\n  const colors = ['#c17a6f', '#e8c4b0', '#c9a96e', '#b5c4b1', '#faf6f0', '#7a3f35'];\n  for (let i = 0; i < 70; i++) setTimeout(() => {\n    const el = document.createElement('div'); el.className = 'confetti-piece';\n    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;\n    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);\n  }, i * 30);\n}\n<\/script>\n<\script>/* di dalam Kartu Ngobrol / Misi Acak: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>\n",

<\/span>\n  <\/div>\n  <div class=\"progress-wrap\"><div class=\"progress-bar\" id=\"progress-bar\" style=\"width:0%\"><\/div><\/div>\n  <div class=\"streak-badge\" id=\"streak-badge\"><div class=\"streak-inner\" id=\"streak-inner\">🔥 HOT STREAK!<\/div><\/div>\n  <div class=\"machine\">\n    <div class=\"score-row\">\n      <div class=\"score-item\"><span class=\"score-num\" id=\"score-jackpot\">0<\/span><span class=\"score-label\">Jackpot 🏆<\/span><\/div>\n      <div class=\"score-divider\"><\/div>\n      <div class=\"score-item\"><span class=\"score-num\" id=\"score-win\">0<\/span><span class=\"score-label\">Menang ✨<\/span><\/div>\n      <div class=\"score-divider\"><\/div>\n      <div class=\"score-item\"><span class=\"score-num\" id=\"score-zonk\">0<\/span><span class=\"score-label\">Zonk 😅<\/span><\/div>\n    <\/div>\n    <div class=\"grand-hint\" id=\"grand-hint\"><\/div>\n    <div class=\"slot-window\" id=\"slot-window\">\n      <div class=\"slot-center-line\"><\/div>\n      <div class=\"reel\" id=\"reel-0\"><div class=\"reel-inner\" id=\"inner-0\"><\/div><\/div>\n      <div class=\"reel\" id=\"reel-1\"><div class=\"reel-inner\" id=\"inner-1\"><\/div><\/div>\n      <div class=\"reel\" id=\"reel-2\"><div class=\"reel-inner\" id=\"inner-2\"><\/div><\/div>\n    <\/div>\n    <div class=\"wild-hint\" id=\"wild-hint\"><\/div>\n    <div class=\"lever-wrap\"><button class=\"lever-btn\" id=\"lever-btn\" onclick=\"spin()\"><div class=\"lever-body\">🎰<\/div><span class=\"lever-text\">Tarik!<\/span><\/button><\/div>\n    <p class=\"lever-note\" id=\"lever-note\"><\/p>\n  <\/div>\n  <div class=\"result-card\" id=\"result-card\">\n    <div class=\"res-type\" id=\"res-type\">Jackpot!<\/div>\n    <span class=\"res-source\" id=\"res-source\"><\/span>\n    <span class=\"res-emoji\" id=\"res-emoji\">🌸<\/span>\n    <p class=\"res-title\" id=\"res-title\">Judul<\/p>\n    <p class=\"res-text\" id=\"res-text\">...<\/p>\n    <div class=\"timer-box\" id=\"timer-box\"><span class=\"timer-num\" id=\"timer-num\">0:00<\/span><div class=\"timer-bar\"><i id=\"timer-bar\"><\/i><\/div><button class=\"timer-btn\" id=\"timer-btn\" onclick=\"toggleTimer()\">▶ Mulai<\/button><\/div>\n    <div class=\"rc-actions\"><button class=\"act done\" id=\"act-done\" onclick=\"missionDone()\">✓ Misi Selesai<\/button><button class=\"act swap\" id=\"act-swap\" onclick=\"swapMission()\">🔄 Ganti (1x)<\/button><\/div>\n  <\/div>\n  <div class=\"history-wrap\" id=\"history-wrap\" style=\"display:none\"><span class=\"history-title\">📜 Riwayat Spin<\/span><div class=\"history-list\" id=\"history-list\"><\/div><\/div>\n  <div class=\"done-card\" id=\"done-card\">\n    <span class=\"done-emoji\" id=\"done-emoji\">🎉<\/span>\n    <h2 class=\"done-title\" id=\"done-title\">Sesi Selesai!<\/h2>\n    <p class=\"done-msg\" id=\"done-msg\"><\/p>\n    <div class=\"done-stats\">\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-jackpot\">0<\/span><span class=\"ds-label\">Jackpot<\/span><\/div>\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-win\">0<\/span><span class=\"ds-label\">Menang<\/span><\/div>\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-zonk\">0<\/span><span class=\"ds-label\">Zonk<\/span><\/div>\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-done\">0<\/span><span class=\"ds-label\">Misi ✓<\/span><\/div>\n    <\/div>\n    <div class=\"done-btns\"><button class=\"btn btn-primary\" onclick=\"initGame()\">Main Lagi 🔄<\/button><button class=\"btn btn-outline\" onclick=\"showScreen('s-intro')\">Menu<\/button><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<\script>\n// ── SYMBOLS ──\nconst SYMBOLS  = ['🌸','⭐','💌','🎲','🍀','🔮'];\nconst WILD     = '💝';\nconst REEL_H   = 80; // px, sama dengan CSS\nconst WILD_CHANCE = 0.18;   // [FIX] dulu 12% → rata-rata cuma 1 jackpot per sesi & Grand hampir mustahil (±1%)\n\n// ── MISSIONS — diambil dari riset Gottman, Aron, Perel (teks tetap) — `timer` = detik, buat misi yang ada durasinya ──\nconst JACKPOT_MISSIONS = {\n  '🌸':{emoji:'🌸',title:'Love Map — Dunia Dalam',source:'Adaptasi dari Gottman Love Maps',\n    text:'Duduk berhadapan. Masing-masing jawab: \"Satu hal yang lagi aku khawatirkan belakangan ini adalah...\" dan \"Satu hal yang aku rindukan dari kita adalah...\" — saling dengerin tanpa solusi, cukup hadir.'},\n  '⭐':{emoji:'⭐',title:'Tatap Mata 4 Menit',source:'Teknik dari Arthur Aron (1997)',timer:240,\n    text:'Tatap mata satu sama lain selama 4 menit penuh tanpa ngomong apapun — persis seperti yang dilakukan di eksperimen Aron. Penelitian menunjukkan ini melepaskan oksitosin dan menciptakan kedekatan yang kuat. Timer harus dipasang.'},\n  '💌':{emoji:'💌',title:'Surat Apresiasi',source:'Gottman — Fondness & Admiration',timer:180,\n    text:'Masing-masing punya 3 menit untuk menulis di HP: 3 hal spesifik yang mereka kagumi dan syukuri dari yang satunya — bukan generik, harus ada cerita atau contoh nyatanya. Tukar HP, baca diam-diam, lalu ceritakan yang paling berkesan.'},\n  '🎲':{emoji:'🎲',title:'Vulnerability Sharing',source:'Adaptasi dari Aron — Escalating Disclosure',\n    text:'Masing-masing jawab jujur bergantian: \"Hal yang paling aku takutkan dalam hidup ini adalah...\" dan \"Hal yang membuat aku merasa paling rentan adalah...\" — dengerin tanpa menghakimi. Kerentanan bersama membangun kepercayaan.'},\n  '🍀':{emoji:'🍀',title:'Turning Towards',source:'Gottman — Bids for Connection',timer:600,\n    text:'Selama 10 menit ke depan, setiap kali yang satunya ngomong apapun — sekecil apapun — yang lain harus merespons dengan tatap mata, anggukan, atau pertanyaan lanjutan. Tidak boleh diabaikan satu kalipun. Ini latihan \"turning towards\" dari Gottman.'},\n  '🔮':{emoji:'🔮',title:'Shared Dreams',source:'Gottman — Creating Shared Meaning',\n    text:'Masing-masing ceritakan satu mimpi atau harapan besar yang belum pernah diucapkan ke satu sama lain — bisa soal masa depan, keluarga, karier, atau hal kecil yang ingin dirasakan. Yang lain hanya mendengar dan bertanya \"Ceritain lebih banyak tentang itu.\"'},\n};\nconst SMALL_WIN_POOL = [\n  {emoji:'🤝',title:'Six-Second Kiss',source:'Gottman — Six-Second Kiss',timer:6,\n    text:'Gottman menyebut ciuman 6 detik sebagai \"a kiss with potential\" — cukup panjang untuk benar-benar merasakan, cukup singkat untuk dilakukan kapanpun. Coba sekarang: ciuman penuh 6 detik, tanpa terburu-buru, tanpa pikiran lain.'},\n  {emoji:'💬',title:'High-Low-Buffalo',source:'Gottman — Daily Check-in',\n    text:'Ceritakan bergantian: satu hal terbaik hari ini (High), satu hal terburuk (Low), dan satu hal random/lucu yang terjadi (Buffalo). Yang lain hanya mendengar dan bertanya satu pertanyaan lanjutan. Gottman merekomendasikan ritual ini setiap hari.'},\n  {emoji:'🌙',title:'Appreciation Check-in',source:'Gottman — Fondness & Admiration',\n    text:'Masing-masing sebut satu hal spesifik yang dia apresiasi dari yang satunya hari ini — bukan \"kamu baik\" tapi \"tadi waktu kamu... itu bikin aku ngerasa...\". Spesifisitas adalah kuncinya.'},\n  {emoji:'😄',title:'Stress-Reducing Conversation',source:'Gottman — Stress-Reducing Conversation',\n    text:'Satu orang cerita tentang satu hal yang bikin stres hari ini — bukan masalah hubungan, tapi tekanan dari luar. Yang lain tugasnya cuma mendengar, berempati, dan bilang \"Aku dengar kamu.\" Bukan memberi solusi.'},\n  {emoji:'💫',title:'I Notice You',source:'Esther Perel — Gaze & Attention',\n    text:'Masing-masing bilang: \"Satu hal yang aku perhatikan dari kamu belakangan ini adalah...\" — sesuatu yang kecil, yang mungkin jarang diucapkan. Perel menyebut ini sebagai cara mempertahankan rasa \"asing yang familiar\" dalam hubungan.'},\n  {emoji:'🫶',title:'Physical Presence',source:'Gottman — Physical Affection',timer:120,\n    text:'Duduk berdampingan, saling berpegangan tangan, dan diam selama 2 menit. Tidak perlu ngomong. Riset Gottman menunjukkan sentuhan fisik yang konsisten — bahkan yang sederhana — meningkatkan kepuasan hubungan secara signifikan.'},\n  {emoji:'🌸',title:'Positive Perspective',source:'Gottman — Positive Sentiment Override',\n    text:'Ingat dan ceritakan satu momen ketika kamu melihat yang terbaik dari pasanganmu — saat dia menghadapi sesuatu yang sulit dan kamu bangga. Gottman menyebut kebiasaan mengingat hal positif ini sebagai \"fondasi cinta yang tahan lama.\"'},\n  {emoji:'🔆',title:'Dreams & Aspirations',source:'Aron — Self-Expansion Theory',\n    text:'Jawab bergantian: \"Satu hal yang ingin aku pelajari atau coba dalam 1 tahun ke depan adalah...\" Aron menemukan bahwa pasangan yang saling mendukung pertumbuhan satu sama lain (self-expansion) memiliki kepuasan hubungan yang jauh lebih tinggi.'},\n];\nconst ZONK_POOL = [\n  {emoji:'😅',title:'Zonk! The Speaker-Listener',source:'Gottman — Speaker-Listener Technique',timer:120,\n    text:'Sebelum spin lagi: satu orang pegang \"lantai\" (boleh pegang benda apapun sebagai simbolnya). Dia cerita 2 menit tentang perasaannya hari ini. Yang lain hanya mendengar. Setelah selesai, yang mendengar parafrase: \"Jadi yang kamu rasakan adalah...\" Lalu tukar peran.'},\n  {emoji:'🙈',title:'Zonk! Repair Attempt',source:'Gottman — Repair Attempts',\n    text:'Sebelum spin lagi: masing-masing harus bilang satu hal yang dia minta maaf — bukan tentang hal besar, tapi tentang kebiasaan kecil yang mungkin bikin yang satunya ga nyaman. Gottman menyebut \"repair attempts\" sebagai kunci hubungan yang sehat.'},\n  {emoji:'😬',title:'Zonk! Love Map Quiz',source:'Gottman — Love Maps',\n    text:'Sebelum spin lagi: tebak-tebakan Love Map. Satu orang tanya: \"Apa makanan favoritku saat ini?\", \"Siapa yang aku kagumi belakangan ini?\", \"Apa yang paling bikin aku stres minggu ini?\" Yang lain jawab. Gottman bilang Love Maps yang kaya = hubungan yang kuat.'},\n  {emoji:'🤭',title:'Zonk! Bids for Connection',source:'Gottman — Turning Towards',\n    text:'Sebelum spin lagi: masing-masing buat satu \"bid\" (tawaran koneksi) — bisa pertanyaan, cerita, atau permintaan kecil. Yang satunya harus \"turn towards\" — merespons dengan antusias, bukan mengabaikan. Ini latihan kebiasaan yang Gottman sebut paling prediktif stabilitas hubungan.'},\n  {emoji:'😆',title:'Zonk! Gratitude Jar',source:'Gottman — Gratitude Practice',\n    text:'Sebelum spin lagi: masing-masing sebutkan 3 hal yang mereka syukuri dari hubungan ini — bukan dari pasangannya, tapi dari hubungannya sendiri. Riset Gottman menunjukkan pasangan yang aktif bersyukur memiliki konflik yang lebih sedikit.'},\n  {emoji:'🫣',title:'Zonk! Open-Ended Questions',source:'Aron — Escalating Intimacy',\n    text:'Sebelum spin lagi: masing-masing tanya satu pertanyaan terbuka yang belum pernah ditanya sebelumnya — sesuatu yang benar-benar ingin diketahui tentang yang satunya. Aron menemukan bahwa pertanyaan yang semakin dalam menciptakan kedekatan yang nyata.'},\n];\nconst GRAND_MISSION = {\n  emoji:'👑',title:'Grand Jackpot — Misi Paling Dalam',source:'Aron + Gottman + Perel',\n  text:'Ini misi terakhir dan terdalam. Masing-masing jawab bergantian, jujur, tanpa bercanda:\\n1. \"Momen ketika aku paling ngerasa dicintai olehmu adalah...\"\\n2. \"Hal yang aku harapkan kamu lebih sering lakukan adalah...\"\\n3. \"Hal yang aku ingin kamu tahu tentang aku yang belum pernah aku bilang adalah...\"\\nDengerin sampai selesai sebelum merespons.'\n};\n// [BARU] Hot Streak dulu cuma janji \"misi bonus muncul\" tapi misinya nggak pernah ada\nconst BONUS_POOL = [\n  {emoji:'🔥',title:'Bonus: Pelukan 20 Detik',source:'Riset oksitosin — pelukan ≥20 detik',timer:20,\n    text:'Pelukan erat 20 detik penuh. Pelukan yang cukup lama terbukti nurunin hormon stres dan naikin oksitosin. Jangan dilepas sebelum timer selesai!'},\n  {emoji:'🔥',title:'Bonus: Voice Note Kejutan',source:'Gottman — Fondness & Admiration',\n    text:'Masing-masing rekam voice note 30 detik buat pasangannya — isinya alasan kenapa kamu bersyukur punya dia. Kirim sekarang, tapi baru boleh didengerin nanti malam sebelum tidur 🤍'},\n  {emoji:'🔥',title:'Bonus: Rencanain Date Kecil',source:'Aron — Novel & Exciting Activities',\n    text:'Dalam 3 menit, rencanain satu date kecil yang belum pernah kalian lakuin — tempat baru, makanan baru, atau aktivitas baru. Aron nemuin bahwa hal baru yang dilakuin bareng bikin hubungan terasa segar lagi.',timer:180},\n  {emoji:'🔥',title:'Bonus: Tiga Kata',source:'Gottman — Love Maps',\n    text:'Masing-masing pilih 3 kata yang paling menggambarkan pasangannya — terus jelasin kenapa milih kata itu, satu-satu.'},\n];\n\n// ── STATE ──\nconst MAX_SPIN = 10;\nlet S = null, isSpinning = false, timer = null;\nconst $ = id => document.getElementById(id);\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\nfunction shuffle(a0) { const a = [...a0]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0, 0); }\nfunction sleep(ms) { return new Promise(r => setTimeout(r, ms)); }\n\nfunction initGame() {\n  S = { spin: 0, jackpot: 0, win: 0, zonk: 0, done: 0, consJ: 0, consZ: 0, grandUsed: false, guaranteed: false, swapLeft: 1, history: [],\n        smallDeck: shuffle(SMALL_WIN_POOL), zonkDeck: shuffle(ZONK_POOL), bonusDeck: shuffle(BONUS_POOL), jackDeck: [], pending: null, queue: [] };\n  stopTimer(); updateStats(); updateProgress(); updateGrandHint();\n  $('result-card').classList.remove('show', 'bonus'); $('done-card').classList.remove('show');\n  $('history-wrap').style.display = 'none'; $('history-list').innerHTML = '';\n  $('streak-badge').classList.remove('show'); $('wild-hint').textContent = ''; $('lever-note').textContent = '';\n  setLever(true, 'Tarik!'); initReels();\n}\nfunction setLever(on, text) { const lb = $('lever-btn'); lb.disabled = !on; if (text) lb.querySelector('.lever-text').textContent = text; }\nfunction initReels() {\n  for (let r = 0; r < 3; r++) {\n    const inner = $(`inner-${r}`); inner.innerHTML = ''; inner.style.transition = 'none'; inner.style.transform = 'translateY(0)';\n    shuffle(SYMBOLS).forEach(sym => { const el = document.createElement('div'); el.className = 'reel-item'; el.textContent = sym; inner.appendChild(el); });\n    $(`reel-${r}`).classList.remove('match', 'jackpot-match');\n  }\n}\n\n// ── SPIN ──\nasync function spin() {\n  if (isSpinning || !S || S.spin >= MAX_SPIN || S.pending) return;\n  isSpinning = true; setLever(false);\n  $('result-card').classList.remove('show', 'bonus'); $('slot-window').classList.remove('jackpot', 'small-win');\n  $('streak-badge').classList.remove('show'); $('wild-hint').textContent = ''; $('lever-note').textContent = '';\n  for (let r = 0; r < 3; r++) $(`reel-${r}`).classList.remove('match', 'jackpot-match');\n  S.spin++; updateStats(); updateProgress(); vib(30);\n  const results = pickOutcome();\n  await Promise.all([0, 1, 2].map(r => animateReel(r, results[r], r * 300)));\n  await sleep(300);\n  processResult(results);\n}\nfunction pickOutcome() {\n  // [BARU] spin terakhir & udah 2 jackpot → dijamin jackpot (biar Grand bisa kebuka)\n  if (S.spin === MAX_SPIN && S.jackpot === 2 && !S.grandUsed) { const s = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]; S.finalBoost = true; return [s, s, s]; }\n  if (S.guaranteed) {\n    S.guaranteed = false;\n    const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)], others = SYMBOLS.filter(s => s !== sym);\n    return shuffle([sym, sym, others[Math.floor(Math.random() * others.length)]]);\n  }\n  const draw = () => Math.random() < WILD_CHANCE ? WILD : SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];\n  return [draw(), draw(), draw()];\n}\n// reel muter pakai transform (lebih mulus di HP) — selalu berhenti pas di simbol hasilnya\nfunction animateReel(r, finalSym, delay) {\n  return new Promise(resolve => setTimeout(() => {\n    const inner = $(`inner-${r}` p class=\"sub\" id=\"book-sub\"><\/p><div id=\"book-list\"><\/div><\/div>\n<\/div>\n\n<\script>\nconst WA_NUMBER = '6285692740607';\n// ── FATES — 8 per sisi = 48 (isi tetap) ──\nconst FATES = {\n  1:{label:'Romantis 🌸',cls:'f1',items:[\n    {emoji:'🌸',cat:'Romantis',text:'Hari ini Razan harus bilang ke Dara — langsung, bukan via chat — satu hal yang paling dia syukuri dari Dara.',note:'Harus face to face. Ga boleh dikirim via WA.'},\n    {emoji:'💌',cat:'Romantis',text:'Hari ini kalian harus foto bareng — momen apapun, kualitas ga penting. Yang penting ada kenangan hari ini.',note:'Harus disimpan. Ga boleh langsung dihapus.'},\n    {emoji:'🤍',cat:'Romantis',text:'Hari ini Razan harus kasih Dara satu gesture kecil yang ga diminta — bisa pijitin, ambilkan sesuatu, atau hal kecil lainnya.',note:'Harus tulus dan ga diminta duluan.'},\n    {emoji:'🌹',cat:'Romantis',text:'Hari ini kalian harus duduk bareng minimal 15 menit tanpa main HP — ngobrol, diam bareng, atau apapun. Asal beneran bareng.',note:'HP boleh ada tapi ga boleh dipegang siapapun.'},\n    {emoji:'💞',cat:'Romantis',text:'Hari ini Dara boleh minta satu hal ke Razan — apapun yang wajar — dan Razan harus iyain tanpa nego.',note:'Dara yang tentukan. Razan yang eksekusi. Sekarang.'},\n    {emoji:'🫶',cat:'Romantis',text:'Hari ini Razan harus nulis pesan panjang ke Dara — minimal 5 kalimat, bukan yang biasa dia kirim.',note:'Isinya hal-hal yang jarang diucapin. Harus dikirim hari ini.'},\n    {emoji:'🎀',cat:'Romantis',text:'Hari ini Dara harus ceritain ke Razan momen favoritnya bersama Razan — yang mungkin Razan ga sadar berkesan.',note:'Cerita lengkap dengan detail. Razan hanya dengerin dulu.'},\n    {emoji:'🫂',cat:'Romantis',text:'Hari ini kalian harus pelukan beneran minimal 30 detik — bukan pelukan basa-basi. Timer harus dipasang.',note:'30 detik penuh. Siapa yang lepas duluan harus minta maaf 😄'},\n  ]},\n  2:{label:'Lucu 😂',cls:'f2',items:[\n    {emoji:'😂',cat:'Lucu',text:'Hari ini siapapun yang duluan bilang n    {emoji:'💪',cat:'Tantangan',text:'Hari ini kalian berdua olahraga bareng — minimal 15 menit. Jalan kaki juga hitungan.',note:'Harus barengan dari awal sampai selesai.'},\n    {emoji:'🔥',cat:'Tantangan',text:'Hari ini Dara kasih Razan \"tantangan harian\" — satu hal yang harus Razan lakuin sebelum hari selesai.',note:'Dara tentukan tantangannya sekarang. Razan ga boleh nolak.'},\n    {emoji:'📚',cat:'Tantangan',text:'Hari ini kalian masing-masing harus rekomendasikan satu hal ke satu sama lain — lagu, film, buku, atau apapun — dan yang lain harus coba.',note:'Harus dicoba hari ini, bukan besok.'},\n    {emoji:'🍳',cat:'Tantangan',text:'Hari ini kalian harus masak atau bikin sesuatu buat dimakan berdua — meski cuma bikin mie atau telor.',note:'Harus dari nol, bukan beli jadi. Prosesnya harus bareng.'},\n    {emoji:'🎨',cat:'Tantangan',text:'Hari ini kalian berdua harus bikin sesuatu yang kreatif bareng — gambar, nulis, atau apapun. Hasilnya disimpan.',note:'Ga perlu bagus. Yang penting prosesnya bareng dan ada hasilnya.'},\n  ]},\n  5:{label:'Absurd 🤪',cls:'f5',items:[\n    {emoji:'🤪',cat:'Absurd',text:'Hari ini tiap kali ketemu atau chat, harus dimulai dengan \"izin pak\" atau \"izin bu\" — yang lupa kena denda.',note:'Denda: nyanyi chorus satu lagu pilihan yang satunya.'},\n    {emoji:'🦆',cat:'Absurd',text:'Hari ini kalian harus jalan ke satu tempat yang belum pernah kalian datengin bareng — boleh sesederhana gang sebelah.',note:'Harus foto di sana sebagai bukti.'},\n    {emoji:'🎨',cat:'Absurd',text:'Hari ini kalian berdua harus gambar potret satu sama lain dalam 60 detik — pakai apapun yang ada. Hasilnya ditunjukin.',note:'Ga boleh protes soal hasilnya. Jelek atau bagus, itu versi resmi.'},\n    {emoji:'🔮',cat:'Absurd',text:'Hari ini kalian berdua bergantian \"meramalkan\" apa yang akan terjadi besok untuk satu sama lain — minimal 3 ramalan.',note:'Besok harus dicek: berapa yang beneran terjadi.'},\n    {emoji:'📜',cat:'Absurd',text:'Hari ini Razan harus nulis \"surat resmi\" buat Dara — format surat sungguhan, ada pembuka, isi, dan penutup.',note:'Harus ditunjukin hari ini. Boleh digital atau tulis tangan.'},\n    {emoji:'🌀',cat:'Absurd',text:'Hari ini kalian harus ganti kontak satu sama lain dengan nama absurd yang dipilih masing-masing — selama 24 jam.',note:'Ga boleh diganti balik sebelum 24 jam. Harus screenshot buktinya.'},\n    {emoji:'🎯',cat:'Absurd',text:'Hari ini Dara harus kasih Razan \"review bintang\" dari 1-5 untuk 3 hal random tentang Razan — dan Razan ga boleh protes.',note:'Review harus jujur. Bisa hal baik atau hal yang perlu diperbaiki.'},\n    {emoji:'🏳️',cat:'Absurd',text:'Hari ini masing-masing harus akui satu hal memalukan tentang diri sendiri yang belum pernah diceritain ke pasangan.',note:'Harus beneran memalukan. Yang biasa-biasa ga dihitung.'},\n  ]},\n  6:{label:'Wild Card 🔥',cls:'f6',items:[\n    {emoji:'🎰',cat:'Wild Card 🔥',text:'JACKPOT! Hari ini Dara bebas minta apapun ke Razan — satu permintaan yang wajar — dan Razan harus lakuin tanpa debat.',note:'Dara punya 5 menit untuk memutuskan. Setelah itu Razan eksekusi.'},\n    {emoji:'🌟',cat:'Wild Card 🔥',text:'NASIB GANDA! Hasil dadu ini double — dua nasib hari ini yang harus dijalani. Lemparan kedua otomatis setelah ini.',note:'Tunggu 2 detik — lemparan kedua akan otomatis keluar!',isDouble:true},\n    {emoji:'🎭',cat:'Wild Card 🔥',text:'ROLE SWAP! Hari ini Razan jadi \"Dara\" dan Dara jadi \"Razan\" — lakuin sesuatu yang biasanya dilakukan pasangannya.',note:'Masing-masing tentukan \"sesuatu\" itu apa untuk yang lain. Harus nyata.'},\n    {emoji:'⚡',cat:'Wild Card 🔥',text:'MISI MENDADAK! Kalian punya 30 menit dari sekarang untuk pergi ke suatu tempat bareng — ga boleh direncanakan.',note:'Destinasi: tutup mata dan tunjuk peta, atau tanya orang pertama yang kalian temui.'},\n    {emoji:'🏆',cat:'Wild Card 🔥',text:'GOLDEN DAY! Hari ini Razan harus lakuin 3 hal manis buat Dara sepanjang hari — kecil boleh, tapi harus 3 hal berbeda dan tulus.',note:'Dara yang jadi juri. Kurang dari 3 = ada utang besok.'},\n    {emoji:'🃏',cat:'Wild Card 🔥',text:'KARTU MISTERIUS! Kalian berdua masing-masing nulis satu \"misi rahasia\" untuk satu sama lain — tukar dan lakuin hari ini.',note:'Misi harus ditulis sekarang sebelum lihat punya yang lain. Harus dilakuin hari ini.'},\n    {emoji:'💫',cat:'Wild Card 🔥',text:'PILIH SENDIRI! Kalian bebas pilih satu nasib dari kategori manapun — tapi harus disepakati berdua dalam 2 menit.',note:'Tap tombol \"📖 Pilih dari Buku Nasib\" di bawah, lalu pilih satu. Timer 2 menit.',pickOwn:true},\n    {emoji:'🌈',cat:'Wild Card 🔥',text:'HARI SPESIAL! Hari ini apapun yang diminta Dara dari Razan — asal wajar — harus dipenuhi. Tapi Dara juga harus lakuin satu hal manis balik.',note:'Keduanya harus. Bukan cuma satu arah.'},\n  ]},\n};\n// rotasi kubus buat nampilin sisi n (1..6) ke depan\nconst FACE_ROT = { 1: [0, 0], 2: [0, 180], 3: [0, -90], 4: [0, 90], 5: [-90, 0], 6: [90, 0] };\n\n// ── STATE ──\nconst $ = id => document.getElementById(id);\nconst todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };\nlet S = { used: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }, history: [], active: [1, 2, 3, 4, 5, 6], today: { date: todayKey(), items: [], swapUsed: false }, doneTotal: 0 };\ntry {\n  const d = JSON.parse(localStorage.getItem('dadu-v2') || 'null');\n  if (d) S = { ...S, ...d };\n  else { const u = localStorage.getItem('dadu_used'), h = localStorage.getItem('dadu_history'); if (u) S.used = JSON.parse(u); if (h) S.history = JSON.parse(h); } // data lama\n} catch {}\nif (S.today.date !== todayKey()) S.today = { date: todayKey(), items: [], swapUsed: false };   // ganti hari = daftar baru\nfunction save() { try { localStorage.setItem('dadu-v2', JSON.stringify(S)); } catch {} }\nlet rolling = false, current = null, rotX = 0, rotY = 0, doubleLeft = 0, firstOfDouble = null;\n\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0, 0); }\nfunction toast(m) { document.querySelectorAll('.toast-el').forEach(e => e.remove()); const el = document.createElement('div'); el.className = 'toast-el'; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\n\n// ── INTRO ──\nconst PILL_COL = { 1: '#c17a6f', 2: '#c9a96e', 3: '#b5c4b1', 4: '#6a8ac0', 5: '#a050a0', 6: '#a01010' };\nfunction renderPills() {\n  const NM = { 1: 'Romantis', 2: 'Lucu', 3: 'Quality Time', 4: 'Tantangan', 5: 'Absurd', 6: 'Wild Card 🔥' };\n  $('face-pills').innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<div class=\"fp f${n} ${S.active.includes(n) ? 'sel' : ''}\" onclick=\"toggleFace(${n})\"><div class=\"fp-dot\" style=\"background:${PILL_COL[n]}\"><\/div>${NM[n]}<\/div>`).join('');\n}\nfunction toggleFace(n) {\n  if (S.active.includes(n)) { if (S.active.length <= 1) return toast('Minimal 1 sisi aktif ya'); S.active = S.active.filter(x => x !== n); }\n  else S.active.push(n);\n  save(); renderPills();\n}\nfunction goGame() { showScreen('s-game'); updateProgress(); renderToday(); renderHistory(); }\n\n// ── PROGRESS ──\nconst left = f => FATES[f].items.length - (S.used[f] || []).length;\nfunction updateProgress() {\n  const total = S.active.reduce((a, f) => a + FATES[f].items.length, 0), used = S.active.reduce((a, f) => a + (S.used[f] || []).length, 0);\n  $('prog-fill').style.width = (total ? used / total * 100 : 0) + '%'; $('prog-txt').textContent = `${used}/${total}`;\n}\n\n// ── LEMPAR ──\nfunction rollDice(fromDouble) {\n  if (rolling) return;\n  if (current && !fromDouble) { toast('Pilih dulu: jalanin atau tuker 😄'); $('action-row').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }\n  const eligible = S.active.filter(f => left(f) > 0);\n  if (!eligible.length) return allDone();\n  rolling = true; $('roll-btn').disabled = true; $('roll-hint').style.display = 'none';\n  $('result-card').classList.remove('show'); $('action-row').classList.remove('show');\n  if (!fromDouble) $('first-card').classList.remove('show');\n  const face = eligible[Math.floor(Math.random() * eligible.length)];\n  // selalu muter MAJU dari posisi sekarang (nggak loncat balik)\n  const [tx, ty] = FACE_ROT[face], spinX = 2 + Math.floor(Math.random() * 2), spinY = 2 + Math.floor(Math.random() * 2);\n  const nx = Math.ceil((rotX + 1) / 360) * 360 + spinX * 360 + tx, ny = Math.ceil((rotY + 1) / 360) * 360 + spinY * 360 + ty;\n  rotX = nx; rotY = ny;\n  $('dice').style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;\n  vib([10, 40, 10, 40, 10]);\n  setTimeout(() => { rolling = false; $('roll-btn').disabled = false; showResult(face); }, 1150);\n}\n\nfunction showResult(face) {\n  const items = FATES[face].items, avail = items.map((_, i) => i).filter(i => !S.used[face].includes(i));\n  const idx = avail[Math.floor(Math.random() * avail.length)], item = items[idx];\n  S.used[face].push(idx);\n  current = { face, idx, ...item };\n  S.history.unshift({ face, emoji: item.emoji, text: item.text }); S.history = S.history.slice(0, 8);\n  save(); updateProgress(); renderHistory();\n  renderCard($('result-card'), current, avail.length - 1);\n  $('result-card').classList.add('show');\n  $('btn-swap').disabled = S.today.swapUsed || item.isDouble;\n  $('btn-swap').textContent = S.today.swapUsed ? '🙈 Tuker habis' : '🙈 Tuker (1x)';\n  $('btn-take').textContent = item.pickOwn ? '📖 Pilih dari Buku Nasib' : item.isDouble ? '🎲 Lempar Nasib Kedua' : '📌 Jalanin Hari Ini';\n  $('action-row').classList.add('show');\n  if (face === 6) confetti();\n  vib(face === 6 ? [30, 20, 60] : 25);\n  setTimeout(() => $('result-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);\n  if (item.isDouble) { firstOfDouble = current; setTimeout(() => { if (current === firstOfDouble) takeFate(); }, 2200); }\n}\nfunction renderCard(el, it, sisa) {\n  el.innerHTML = `<span class=\"result-face ${FATES[it.face].cls}\">Sisi ${it.face} · ${FATES[it.face].label}${sisa != null ? ` (sisa ${sisa})` : ''}<\/span>\n    <span class=\"result-emoji\">${it.emoji}<\/span><p class=\"result-text\">${it.text}<\/p><p class=\"result-note\">${it.note || ''}<\/p>`;\n}\n\n// ── JALANIN / TUKER ──\nfunction takeFate() {\n  if (!current) return;\n  if (current.isDouble) {\n    // nasib ganda: kartu pertama tetap kelihatan kecil di atas, lalu lempar lagi\n    renderCard($('first-card'), current); $('first-card').insertAdjacentHTML('afterbegin', '<p style=\"font-size:10px;color:var(--rose);font-weight:700;text-align:center;margin-bottom:.3rem\">🌟 NASIB GANDA — 2 nasib buat hari ini:<\/p>');\n    $('first-card').classList.add('show'); current = null; doubleLeft = 2; toast('🎲 Nasib pertama...'); rollDice(true); return;\n  }\n  if (current.pickOwn) { current = null; $('action-row').classList.remove('show'); openBook(true); return; }\n  addToday(current); current = null;\n  $('action-row').classList.remove('show'); vib(20);\n  if (doubleLeft > 0) { doubleLeft--; if (doubleLeft > 0) { toast('🎲 Nasib kedua...'); setTimeout(() => rollDice(true), 700); return; } $('first-card').classList.remove('show'); }\n  toast('📌 Masuk ke Nasib Hari Ini!');\n}\nfunction swapFate() {\n  if (!current || S.today.swapUsed || current.isDouble) return;\n  S.used[current.face] = S.used[current.face].filter(i => i !== current.idx);  // balik ke dadu\n  S.history.shift(); S.today.swapUsed = true; current = null; save(); updateProgress(); renderHistory();\n  $('result-card').classList.remove('show'); $('action-row').classList.remove('show');\n  toast('🙈 Ditukar! Lempar lagi...'); setTimeout(() => rollDice(doubleLeft > 0), 500);\n}\nfunction addToday(it) { S.today.items.push({ face: it.face, emoji: it.emoji, text: it.text, done: false }); save(); renderToday(); }\n\n// ── NASIB HARI INI ──\nfunction renderToday() {\n  const L = S.today.items;\n  $('today-list').innerHTML = L.length ? L.map((t, i) => `<div class=\"today-item ${t.done ? 'done' : ''}\"><div class=\"chk\" onclick=\"toggleDone(${i})\">✓<\/div><div class=\"ti-text\"><small>${t.emoji} ${FATES[t.face].label}<\/small>${t.text}<\/div><button class=\"ti-del\" onclick=\"delToday(${i})\">✕<\/button><\/div>`).join('')\n    + `<button class=\"wa-btn\" onclick=\"shareWA()\">💬 Kirim nasib hari ini ke Razan<\/button><p class=\"empty\">✅ ${L.filter(t => t.done).length}/${L.length} dijalanin hari ini · total ${S.doneTotal} nasib udah kalian jalanin 🤍<\/p>`\n    : '<p class=\"empty\">Belum ada. Lempar dadu, terus tap <b>📌 Jalanin Hari Ini<\/b>.<br>Daftar ini otomatis kosong lagi besok.<\/p>';\n}\nfunction toggleDone(i) { const t = S.today.items[i]; t.done = !t.done; S.doneTotal = Math.max(0, S.doneTotal + (t.done ? 1 : -1)); save(); renderToday(); if (t.done) { vib([20, 10, 40]); toast('✅ Nasib dijalanin!'); if (S.today.items.every(x => x.done)) confetti(); } }\nfunction delToday(i) { const t = S.today.items[i]; if (t.done) S.doneTotal = Math.max(0, S.doneTotal - 1); S.today.items.splice(i, 1); save(); renderToday(); }\nfunction shareWA() { const msg = '🎲 Nasib kita hari ini dari Dadu Nasib:\\n\\n' + S.today.items.map((t, i) => `${t.done ? '✅' : '⬜'} ${t.emoji} ${t.text}`).join('\\n\\n') + '\\n\\nNggak ada yang bisa kabur ya 😄🤍'; window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank'); }\n\nfunction renderHistory() {\n  $('history-wrap').style.display = S.history.length ? 'block' : 'none';\n  $('history-list').innerHTML = S.history.slice(0, 6).map(h => `<div class=\"history-item\"><span class=\"h-tag\">${h.emoji} Sisi ${h.face}<\/span><span>${h.text.slice(0, 65)}${h.text.length > 65 ? '...' : ''}<\/span><\/div>`).join('');\n}\n\n// ── BUKU NASIB ──\nfunction openBook(picking) {\n  $('book-title').textContent = picking ? '💫 Pilih Sendiri' : '📖 Semua Nasib';\n  $('book-sub').textContent = picking ? 'Sepakati berdua dalam 2 menit — tap satu nasib buat dijalanin hari ini' : 'Yang pudar = udah pernah keluar';\n  $('book-list').innerHTML = [1, 2, 3, 4, 5, 6].map(f => `<span class=\"bk-cat ${FATES[f].cls}\">${FATES[f].label}<\/span>` + FATES[f].items.map((it, i) => (picking && (it.isDouble || it.pickOwn)) ? '' :\n    `<div class=\"bk-item ${S.used[f].includes(i) ? 'used' : ''}\" ${picking ? `onclick=\"pickOwn(${f},${i})\"` : ''}><span>${it.emoji}<\/span><span>${it.text}<\/span><\/div>`).join('')).join('');\n  $('book').classList.add('show'); $('book').querySelector('.sheet').scrollTop = 0;\n}\nfunction pickOwn(f, i) { const it = FATES[f].items[i]; addToday({ face: f, ...it }); $('book').classList.remove('show'); toast('💫 Nasib pilihan kalian masuk daftar!'); confetti(); if (doubleLeft > 0) { doubleLeft--; if (doubleLeft > 0) setTimeout(() => rollDice(true), 700); else $('first-card').classList.remove('show'); } }\n\nfunction allDone() {\n  if (!confirm('Semua nasib dari sisi yang aktif udah keluar! 🎲\\n\\nReset dadu biar semua nasib bisa keluar lagi?')) return;\n  S.used = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }; S.history = []; save(); updateProgress(); renderHistory(); toast('Reset! Semua nasib siap lagi 🎲'); confetti();\n}\nfunction confetti() {\n  const colors = ['#c17a6f', '#e8c4b0', '#c9a96e', '#b5c4b1', '#faf6f0'];\n  for (let i = 0; i < 70; i++) setTimeout(() => {\n    const el = document.createElement('div'); el.className = 'cp';\n    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .5}s;width:${6 + Math.random() * 8}px;height:${6 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;\n    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);\n  }, i * 22);\n}\nrenderPills();\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam Kartu Ngobrol / Misi Acak: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>\n"];

        // layar penuh (fixed/absolute) yang isinya lebih panjang dari layar HP → bikin bisa discroll

}

go(q ? Math.min(TABS.length - 1, +q[1]) : Math.min(TABS.length - 1, lsGet(K, 0)));
