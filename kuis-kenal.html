  if (mine && mine.g && (!seen || Date.now() - seen < 10 * 60e3)) {
    const v = verdict(mine.g.score);
    h += `<button class="big-card res" onclick="showReview('${me}')"><span class="e">${v[0]}</span><b>${o()} nebak ${mine.g.score}/${mine.qs.length} jawaban kamu!</b><p>${v[1]} · tap buat liat detailnya</p></button>`;
    if (!seen) lsSet('kk-seen-' + mine.id, Date.now());
  }
  if (mine && !mine.g) h += `<div class="big-card wait"><span class="e">⏳</span><b>Nunggu ${o()} nebak jawaban kamu</b><p>Kamu jawab ${ago(mine.at)}</p></div>`;
  else h += `<button class="btn" onclick="startAnswer()" style="margin-bottom:.9rem">✍️ Jawab tentang diri aku</button>`;
  $('home-main').innerHTML = h;
  const H = histAll();
  const by = w => H.filter(x => x.guesser === w);
  const avg = w => { const a = by(w); return a.length ? (a.reduce((s, x) => s + x.score / x.n, 0) / a.length * 100).toFixed(0) + '%' : '–'; };
  $('stats').innerHTML = ['Razan', 'Dara'].map(w => `<div class="${w}"><small>${w} nebak</small><b>${avg(w)}</b><span>${by(w).length} kuis · terbaik ${by(w).length ? Math.max(...by(w).map(x => x.score)) + '/10' : '–'}</span></div>`).join('');
  $('hist').innerHTML = H.slice(0, 10).map(x => `<div><b><span class="by ${x.guesser}">${x.guesser}</span> nebak tentang <span class="by ${x.subj}">${x.subj}</span>: ${x.score}/${x.n} ${verdict(x.score)[0]}</b>${fmtD(new Date(x.at))}</div>`).join('') || '<p class="empty">Belum ada kuis. Siapa duluan yang jawab? 😆</p>';
}
function histAll() { return ['Razan', 'Dara'].flatMap(w => ((row('kuish', w) || {}).list || []).map(x => Object.assign({ guesser: w }, x))).sort((a, b) => b.at - a.at); }

/* ── jawab tentang diri sendiri ── */
let mode = null, qs = [], ix = 0, ans = [];
function startAnswer() {
  const recent = new Set(((row('kuisj', me) || {}).qs || []).map(x => x.q));
  const pool = shuffle(Q.filter(q => !recent.has(q[0]))).concat(shuffle(Q.filter(q => recent.has(q[0]))));
  qs = pool.slice(0, N).map(([q, opts]) => ({ q, o: opts.slice(), a: null }));
  mode = 'ans'; ix = 0; paintQ(); show('s-q');
}
/* ── nebak ── */
let T = null;
function startGuess() {
  T = row('kuisj', o()); if (!T || T.g) { renderHome(); return; }
  qs = T.qs.map(x => ({ q: x.q.replace(/\baku\b/gi, o()), o: x.o, a: null })); mode = 'guess'; ix = 0; paintQ(); show('s-q');
}
function paintQ() {
  const q = qs[ix];
  $('prog').innerHTML = qs.map((x, i) => `<i class="${i <= ix ? 'on' : ''}"></i>`).join('');
  $('qn').textContent = `${mode === 'ans' ? 'Tentang kamu' : 'Tentang ' + o()} · ${ix + 1}/${qs.length}`;
  $('qt').textContent = q.q;
  $('opts').innerHTML = q.o.map((t, i) => `<button class="${q.a === i ? 'on' : ''}" data-i="${i}">${esc(t)}</button>`).join('');
  $('opts').querySelectorAll('button').forEach(b => b.onclick = () => { q.a = +b.dataset.i; vib(8); paintQ(); if (ix < qs.length - 1) setTimeout(() => { if (qs[ix] === q) qNext(); }, 260); });
  $('own').innerHTML = mode === 'ans' ? `<input class="inp" id="own-in" maxlength="40" placeholder="…atau tulis jawaban sendiri"><button class="btn" style="width:auto;padding:0 1rem" onclick="ownAns()">OK</button>` : '';
  $('q-back').style.visibility = ix ? '' : 'hidden';
  $('q-next').textContent = ix === qs.length - 1 ? (mode === 'ans' ? '✈️ Kirim' : '✅ Selesai') : 'Lanjut →';
}
function ownAns() { const v = $('own-in').value.trim(); if (!v) return; const q = qs[ix]; q.o = q.o.slice(0, 3).concat(v); q.o = shuffle(q.o); q.a = q.o.indexOf(v); paintQ(); }
function qBack() { if (ix) { ix--; paintQ(); } }
function qNext() {
  if (qs[ix].a == null) { toast('Pilih salah satu dulu ya'); return; }
  if (ix < qs.length - 1) { ix++; paintQ(); return; }
  mode === 'ans' ? sendAnswers() : sendGuess();
}
function sendAnswers() {
  const id = 'k' + Date.now().toString(36);
  BD.put('kuisj', me, D0, { id, qs: qs.map(x => ({ q: x.q, o: x.o, a: x.a })), at: Date.now(), g: null });
  confetti(30); vib([20, 40, 20]); toast(`✈️ Kekirim! Sekarang ${o()} tinggal nebak`);
  show('s-home'); renderHome();
}
function sendGuess() {
  const score = qs.reduce((s, x, i) => s + (x.a === T.qs[i].a ? 1 : 0), 0);
  const g = { ans: qs.map(x => x.a), score, at: Date.now(), by: me };
  BD.put('kuisj', o(), D0, Object.assign({}, T, { g }));
  const H = Object.assign({ list: [] }, row('kuish', me) || {});
  H.list = [{ subj: o(), score, n: qs.length, at: Date.now() }].concat(H.list || []).slice(0, 20);
  BD.put('kuish', me, D0, H);
  T = Object.assign({}, T, { g });
  showReview(o(), T);
  if (score >= 7) confetti(80); try { window.SFX && SFX.play(score >= 5 ? 'win' : 'lose'); } catch (e) {}
}
function showReview(subj, data) {
  const K = data || row('kuisj', subj); if (!K || !K.g) return;
  const v = verdict(K.g.score), guesser = subj === me ? o() : me;
  $('res').innerHTML = `<div class="big">${K.g.score}<small>/${K.qs.length}</small></div><h2>${v[0]} ${v[1]}</h2><p>${guesser === me ? 'Kamu' : guesser} nebak jawaban ${subj === me ? 'kamu' : subj}. ${v[2]}</p>
    <div class="rv">${K.qs.map((q, i) => { const ok = K.g.ans[i] === q.a; return `<div class="${ok ? 'ok' : 'no'}"><b>${ok ? '✅' : '❌'} ${esc(q.q.replace(/\baku\b/gi, subj === me ? 'kamu' : subj))}</b>Jawaban ${subj === me ? 'kamu' : subj}: <b style="display:inline">${esc(q.o[q.a])}</b>${ok ? '' : `<br>Tebakan ${guesser === me ? 'kamu' : guesser}: ${esc(q.o[K.g.ans[i]] || '–')}`}</div>`; }).join('')}</div>
    <a class="btn wa" style="margin-top:1rem" target="_blank" rel="noopener" href="${waLink(o(), `🧠 Seberapa Kenal Aku: ${guesser === me ? 'aku' : 'kamu'} nebak ${K.g.score}/${K.qs.length} ${v[0]} ${v[1]}`)}">💬 Pamerin ke ${o()}</a>
    ${!row('kuisj', me) || row('kuisj', me).g ? `<button class="btn" style="margin-top:.5rem" onclick="startAnswer()">✍️ Gantian: aku yang jawab</button>` : ''}
    <button class="btn ghost" style="margin-top:.5rem" onclick="show('s-home');renderHome()">Ke halaman awal</button>`;
  show('s-res');
}
BD.on(ev => { if (!ev.apps || !ev.apps.length) { bdStatus(); return; } if ($('s-home').classList.contains('on') && ev.apps.some(a => /^kuis/.test(a))) renderHome(); });
renderHome();

</script>
</script>

<!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->
<script>
(function () {
  if (window.__cfPatched) return; window.__cfPatched = true;
  const native = window.confirm.bind(window);
  let lastTap = null, lastTapAt = 0, bypass = null;
  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)
  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);
  const css = document.createElement('style');
  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}
  @keyframes cfFade{from{opacity:0}to{opacity:1}}
  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}
  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}
  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}
  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}
  .cf .cf-yes{background:#c17a6f;color:#fff}
  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}
  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;
  document.head.appendChild(css);
  function panel(msg, onYes) {
    const isExit = /keluar|tutup restoran/i.test(msg);
    const ov = document.createElement('div'); ov.className = 'cf-ov';
    ov.innerHTML = `<div class="cf"><p></p><button class="cf-yes">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}</button>${isExit ? '<button class="cf-home">🏠 Keluar ke menu</button>' : ''}<button class="cf-no">Batal</button></div>`;
    ov.querySelector('p').textContent = msg;
    const close = () => ov.remove();
    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };
    ov.querySelector('.cf-no').onclick = close;
    if (isExit) ov.querySelector('.cf-home').onclick = () => { location.href = 'index.html'; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  window.confirm = function (msg) {
    msg = String(msg == null ? '' : msg);
    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah "Ya"
    const target = lastTap;
    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama
    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });
    return false;
  };
})();
</script>
