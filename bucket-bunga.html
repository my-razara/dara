<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bucket Bunga 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;
    --rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;
    --gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}
  html,body{min-height:100%;background:var(--cream);overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(232,196,176,.35) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 90%,rgba(193,122,111,.12) 0%,transparent 60%);
    pointer-events:none;z-index:0}

  .page{max-width:480px;margin:0 auto;padding:1rem 1rem 3rem;position:relative;z-index:1}

  /* HEADER */
  .header{text-align:center;margin-bottom:1.25rem}
  .header-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.25rem}
  .header-title{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:700;color:var(--ink)}
  .header-title span{color:var(--rose)}
  .header-sub{font-size:12px;color:var(--muted);line-height:1.65;margin-top:.25rem}

  /* CANVAS AREA */
  .canvas-wrap{
    position:relative;border-radius:20px;overflow:hidden;
    margin-bottom:1rem;
    box-shadow:0 8px 32px rgba(193,122,111,.15);
    cursor:crosshair;
    touch-action:none;
    user-select:none;
  }
  #flower-canvas{display:block;width:100%;height:auto}

  /* CONTROLS */
  .section-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--blush),transparent)}

  /* FLOWERS */
  .flower-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin-bottom:1rem}
  .flower-btn{
    aspect-ratio:1;border-radius:12px;border:2px solid transparent;
    background:var(--warm);display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.2rem,5vw,1.6rem);cursor:pointer;transition:all .15s;
  }
  .flower-btn:active{transform:scale(.88)}
  .flower-btn.selected{border-color:var(--rose);background:rgba(193,122,111,.12);transform:scale(1.08)}

  /* SIZE SLIDER */
  .slider-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
  .slider-label{font-size:12px;color:var(--muted);white-space:nowrap;min-width:80px}
  input[type=range]{flex:1;accent-color:var(--rose);height:4px}
  .slider-val{font-size:12px;font-weight:600;color:var(--rose);min-width:30px;text-align:right}

  /* BG COLORS */
  .color-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .color-dot{
    width:32px;height:32px;border-radius:50%;cursor:pointer;
    border:2.5px solid transparent;transition:all .15s;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
  }
  .color-dot:active{transform:scale(.88)}
  .color-dot.selected{border-color:var(--ink);transform:scale(1.15)}

  /* RIBBON */
  .ribbon-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .ribbon-btn{
    padding:.4rem .85rem;border-radius:50px;border:1.5px solid var(--blush);
    background:var(--warm);font-size:12px;cursor:pointer;color:var(--muted);
    transition:all .15s;
  }
  .ribbon-btn:active{transform:scale(.95)}
  .ribbon-btn.selected{border-color:var(--rose);background:rgba(193,122,111,.1);color:var(--rose);font-weight:600}

  /* MESSAGE */
  .msg-inputs{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
  .msg-input{
    width:100%;padding:.75rem 1rem;border:1.5px solid var(--blush);border-radius:12px;
    font-family:'Poppins',sans-serif;font-size:13px;color:var(--ink);background:#fff;
    outline:none;transition:border-color .2s;resize:none;
  }
  .msg-input:focus{border-color:var(--rose)}

  /* ACTIONS */
  .action-row{display:flex;gap:.6rem;margin-bottom:1rem}
  .btn{flex:1;padding:.875rem;border-radius:50px;border:none;cursor:pointer;font-size:13.5px;font-weight:700;transition:all .15s;font-family:'Poppins',sans-serif}
  .btn-primary{background:var(--rose);color:#fff;box-shadow:0 4px 14px rgba(193,122,111,.35)}
  .btn-primary:active{background:var(--deep);transform:scale(.97)}
  .btn-outline{background:transparent;color:var(--muted);border:1.5px solid var(--blush)}
  .btn-outline:active{background:var(--warm);transform:scale(.97)}

  /* CLEAR */
  .clear-btn{
    width:100%;padding:.7rem;border-radius:12px;border:1.5px solid var(--blush);
    background:transparent;color:var(--muted);font-size:12px;cursor:pointer;
    font-family:'Poppins',sans-serif;transition:all .15s;
  }
  .clear-btn:active{background:var(--warm)}

  /* HINT */
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:.75rem;line-height:1.6}

  /* TOAST */
  .toast{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;border-radius:50px;padding:.5rem 1.25rem;
    font-size:12px;font-weight:500;z-index:999;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <span class="header-label">Buat Sendiri</span>
    <h1 class="header-title">Bucket <span>Bunga</span> 🌸</h1>
    <p class="header-sub">Tap canvas untuk taruh bunga — susun sesuka hati!</p>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="flower-canvas"></canvas>
  </div>

  <p class="hint">Tap canvas untuk naruh bunga · Tap bunga di canvas untuk hapus</p>

  <!-- FLOWERS -->
  <p class="section-label">Pilih Bunga</p>
  <div class="flower-grid" id="flower-grid"></div>

  <!-- SIZE -->
  <p class="section-label">Ukuran Bunga</p>
  <div class="slider-row">
    <span class="slider-label">Kecil → Besar</span>
    <input type="range" id="size-slider" min="20" max="80" value="40">
    <span class="slider-val" id="size-val">40</span>
  </div>

  <!-- BG COLOR -->
  <p class="section-label">Warna Kertas</p>
  <div class="color-row" id="bg-colors"></div>

  <!-- RIBBON -->
  <p class="section-label">Warna Pita</p>
  <div class="ribbon-row" id="ribbon-row"></div>

  <!-- MESSAGE -->
  <p class="section-label">Pesan & Nama</p>
  <div class="msg-inputs">
    <input type="text" class="msg-input" id="msg-to" placeholder="Untuk: Dara Syifa Aulia 🌸" maxlength="40">
    <textarea class="msg-input" id="msg-text" placeholder="Tulis pesan di sini..." rows="2" maxlength="80"></textarea>
    <input type="text" class="msg-input" id="msg-from" placeholder="Dari: Razan 🤍" maxlength="30">
  </div>

  <!-- ACTIONS -->
  <div class="action-row">
    <button class="btn btn-outline" onclick="undoLast()">↩ Undo</button>
    <button class="btn btn-primary" onclick="downloadImage()">⬇ Download</button>
  </div>
  <button class="clear-btn" onclick="clearAll()">🗑 Bersihkan Canvas</button>

</div>

<div class="toast" id="toast"></div>

<script>
// ── FLOWERS ──
const FLOWERS = ['🌸','🌹','🌺','🌻','🌷','💐','🪷','🌼','🥀','🌿','🍀','🌱'];

// ── BG COLORS ──
const BG_COLORS = [
  {label:'Cream',   val:'#fdf6ee'},
  {label:'Pink',    val:'#fce4ec'},
  {label:'Lavender',val:'#ede7f6'},
  {label:'Mint',    val:'#e8f5e9'},
  {label:'Sky',     val:'#e3f2fd'},
  {label:'Peach',   val:'#fbe9e7'},
  {label:'White',   val:'#ffffff'},
  {label:'Gelap',   val:'#2d1f1a'},
];

// ── RIBBONS ──
const RIBBONS = [
  {label:'Rose',    val:'#c17a6f'},
  {label:'Gold',    val:'#c9a96e'},
  {label:'Sage',    val:'#7a9e8a'},
  {label:'Lavender',val:'#9b7ec8'},
  {label:'Pink',    val:'#f48fb1'},
  {label:'Putih',   val:'#ffffff'},
];

// ── STATE ──
let flowers = [];
let selectedFlower = FLOWERS[0];
let flowerSize = 40;
let bgColor = BG_COLORS[0].val;
let ribbonColor = RIBBONS[0].val;
let canvas, ctx, W, H, dpr;

// ── INIT ──
function init() {
  canvas = document.getElementById('flower-canvas');
  ctx = canvas.getContext('2d');
  setupCanvas();
  buildFlowerGrid();
  buildBgColors();
  buildRibbons();
  setupInput();
  draw();

  // Size slider
  const slider = document.getElementById('size-slider');
  slider.addEventListener('input', () => {
    flowerSize = parseInt(slider.value);
    document.getElementById('size-val').textContent = flowerSize;
  });

  // Message inputs trigger redraw
  ['msg-to','msg-text','msg-from'].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
  });

  window.addEventListener('resize', () => { setupCanvas(); draw(); });
}

function setupCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth;
  H = Math.round(W * 1.35); // portrait ratio
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}

// ── FLOWER GRID ──
function buildFlowerGrid() {
  const grid = document.getElementById('flower-grid');
  grid.innerHTML = '';
  FLOWERS.forEach(f => {
    const btn = document.createElement('div');
    btn.className = 'flower-btn' + (f === selectedFlower ? ' selected' : '');
    btn.textContent = f;
    btn.addEventListener('click', () => {
      selectedFlower = f;
      document.querySelectorAll('.flower-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    grid.appendChild(btn);
  });
}

// ── BG COLORS ──
function buildBgColors() {
  const row = document.getElementById('bg-colors');
  row.innerHTML = '';
  BG_COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c.val === bgColor ? ' selected' : '');
    dot.style.background = c.val;
    if (c.val === '#ffffff') dot.style.border = '2.5px solid #ddd';
    dot.title = c.label;
    dot.addEventListener('click', () => {
      bgColor = c.val;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      draw();
    });
    row.appendChild(dot);
  });
}

// ── RIBBONS ──
function buildRibbons() {
  const row = document.getElementById('ribbon-row');
  row.innerHTML = '';
  RIBBONS.forEach(r => {
    const btn = document.createElement('div');
    btn.className = 'ribbon-btn' + (r.val === ribbonColor ? ' selected' : '');
    btn.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${r.val};border:1px solid rgba(0,0,0,.1);margin-right:4px;vertical-align:middle"></span>${r.label}`;
    btn.addEventListener('click', () => {
      ribbonColor = r.val;
      document.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      draw();
    });
    row.appendChild(btn);
  });
}

// ── INPUT ──
let lastTap = 0;
function setupInput() {
  canvas.addEventListener('click', onTap);
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < 300) return;
    lastTap = now;
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    onTap({ clientX: t.clientX, clientY: t.clientY, _rect: rect });
  }, { passive: false });
}

function onTap(e) {
  const rect = e._rect || canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left);
  const y = (e.clientY - rect.top);

  // Check if tapping existing flower to delete
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    const dx = x - f.x, dy = y - f.y;
    if (Math.sqrt(dx*dx+dy*dy) < f.size * 0.6) {
      flowers.splice(i, 1);
      draw();
      return;
    }
  }

  // Add flower
  flowers.push({ emoji: selectedFlower, x, y, size: flowerSize, rot: (Math.random()-0.5)*0.4 });
  draw();
}

// ── DRAW ──
function draw() {
  ctx.clearRect(0, 0, W, H);

  // BG
  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 16);
  ctx.fill();

  // Wrapping paper texture (subtle lines)
  const isDark = bgColor === '#2d1f1a';
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,.04)' : 'rgba(193,122,111,.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 20) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
  }
  for (let i = 0; i < H; i += 20) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
  }

  // Flowers
  flowers.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.font = f.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();
  });

  // Ribbon at bottom
  const ribbonY = H * 0.72;
  const ribbonH = H * 0.055;
  ctx.fillStyle = ribbonColor;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(0, ribbonY, W, ribbonH);
  // Ribbon shine
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.fillRect(0, ribbonY, W, ribbonH * 0.35);
  ctx.globalAlpha = 1;

  // Bow
  drawBow(W/2, ribbonY + ribbonH/2, ribbonColor);

  // Card area at bottom
  const cardY = ribbonY + ribbonH;
  const cardH = H - cardY;
  ctx.fillStyle = isDark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.7)';
  ctx.fillRect(0, cardY, W, cardH);

  // Message
  const to   = document.getElementById('msg-to').value   || 'Untuk: Dara Syifa Aulia 🌸';
  const msg  = document.getElementById('msg-text').value || '';
  const from = document.getElementById('msg-from').value || 'Dari: Razan 🤍';

  const textColor = isDark ? '#fff' : '#2d1f1a';
  const mutedColor = isDark ? 'rgba(255,255,255,.5)' : '#9a8070';

  ctx.textAlign = 'center';
  // To
  ctx.font = 'bold ' + Math.round(W*0.038) + 'px Poppins, sans-serif';
  ctx.fillStyle = ribbonColor;
  ctx.fillText(to, W/2, cardY + cardH*0.22);
  // Message
  if (msg) {
    ctx.font = Math.round(W*0.032) + 'px Poppins, sans-serif';
    ctx.fillStyle = textColor;
    wrapText(ctx, msg, W/2, cardY + cardH*0.48, W*0.85, Math.round(W*0.038));
  }
  // From
  ctx.font = Math.round(W*0.03) + 'px Poppins, sans-serif';
  ctx.fillStyle = mutedColor;
  ctx.fillText(from, W/2, cardY + cardH*0.82);
}

function drawBow(x, y, color) {
  const r = W * 0.045;
  ctx.save();
  ctx.translate(x, y);
  // Left loop
  ctx.beginPath();
  ctx.ellipse(-r*0.9, -r*0.3, r*0.85, r*0.55, -0.5, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.9;
  ctx.fill();
  // Right loop
  ctx.beginPath();
  ctx.ellipse(r*0.9, -r*0.3, r*0.85, r*0.55, 0.5, 0, Math.PI*2);
  ctx.fill();
  // Center
  ctx.beginPath();
  ctx.arc(0, 0, r*0.38, 0, Math.PI*2);
  ctx.fillStyle = shadeColor(color, -20);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  let lines = [];
  words.forEach(w => {
    const test = line + (line ? ' ' : '') + w;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = w;
    } else line = test;
  });
  if (line) lines.push(line);
  const startY = y - (lines.length-1)*lineH/2;
  lines.forEach((l,i) => ctx.fillText(l, x, startY + i*lineH));
}

function shadeColor(color, amt) {
  let c = parseInt(color.slice(1), 16);
  let r = Math.min(255, Math.max(0, (c>>16)+amt));
  let g = Math.min(255, Math.max(0, ((c>>8)&0xff)+amt));
  let b = Math.min(255, Math.max(0, (c&0xff)+amt));
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// ── ACTIONS ──
function undoLast() {
  if (flowers.length) { flowers.pop(); draw(); }
  else toast('Tidak ada bunga untuk di-undo');
}

function clearAll() {
  if (flowers.length === 0) return;
  flowers = []; draw();
  toast('Canvas dibersihkan');
}

function downloadImage() {
  draw();
  // Create temp canvas with dpr for high-res
  const link = document.createElement('a');
  link.download = 'bucket-bunga-dara.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('✓ Gambar tersimpan!');
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2000);
}

init();
</script>
</body>
</html>
