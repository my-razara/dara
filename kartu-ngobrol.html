"star-btn\" onclick=\"toggleStar()\">☆<\/button>\n        <span class=\"new-tag\" id=\"new-tag\">BARU<\/span>\n        <div class=\"card-cat cc-dalam\" id=\"card-cat\">🌊 Dalam<\/div>\n        <p class=\"card-q\" id=\"card-q\">...<\/p>\n        <div class=\"card-foot\"><span class=\"card-hint\" id=\"card-hint\"><\/span><span class=\"card-num-label\" id=\"card-num-label\">01<\/span><\/div>\n      <\/div>\n    <\/div>\n    <p class=\"swipe-hint\">geser kartu: ← skip · lanjut →<\/p>\n    <div class=\"actions\">\n      <button class=\"btn btn-back\" id=\"btn-back\" onclick=\"prevCard()\">← Balik<\/button>\n      <button class=\"btn btn-skip\" onclick=\"skipCard()\">Skip<\/button>\n      <button class=\"btn btn-next\" onclick=\"nextCard()\">Lanjut →<\/button>\n    <\/div>\n    <div class=\"btn-row-sm\">\n      <button class=\"btn-sm\" onclick=\"toMenu()\">← Menu<\/button>\n      <button class=\"btn-sm\" onclick=\"showStarred()\" id=\"show-starred-btn\">⭐ Favorit (0)<\/button>\n      <button class=\"btn-sm\" onclick=\"goStart()\">Ulangi 🔄<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- STARRED -->\n<div id=\"s-starred\" class=\"screen\">\n  <div class=\"wrap\">\n    <span style=\"font-size:2.5rem;display:block;margin-bottom:.75rem;text-align:center\">⭐<\/span>\n    <h2 style=\"font-size:1.3rem;font-weight:700;color:var(--ink);margin-bottom:.25rem;text-align:center\">Kartu Favorit<\/h2>\n    <p style=\"font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin-bottom:.5rem\">Pertanyaan yang kalian tandai untuk dibahas lebih dalam — tersimpan di HP ini<\/p>\n    <div class=\"starred-list\" id=\"starred-list\"><\/div>\n    <div class=\"done-btns\">\n      <button class=\"btn-full btn-wa\" id=\"fav-wa\" onclick=\"sendFavWA()\">💬 Kirim daftar favorit ke WA<\/button>\n      <button class=\"btn-full btn-primary\" id=\"fav-back\" onclick=\"backFromStarred()\">Kembali<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- DONE -->\n<div id=\"s-done\" class=\"screen\">\n  <div class=\"wrap\">\n    <span class=\"done-emoji\">🤍<\/span>\n    <h2 class=\"done-title\">Deep Talk <span>selesai!<\/span><\/h2>\n    <p class=\"done-msg\" id=\"done-msg\"><\/p>\n    <div class=\"done-stats\">\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-answered\">0<\/span><span class=\"ds-label\">Dijawab<\/span><\/div>\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-skipped\">0<\/span><span class=\"ds-label\">Di-skip<\/span><\/div>\n      <div class=\"ds-item\"><span class=\"ds-num\" id=\"ds-starred\">0<\/span><span class=\"ds-label\">Favorit ⭐<\/span><\/div>\n    <\/div>\n    <div class=\"done-btns\">\n      <button class=\"btn-full btn-primary\" id=\"done-starred-btn\" onclick=\"showStarred()\" style=\"display:none\">Lihat Favorit ⭐<\/button>\n      <button class=\"btn-full btn-primary\" onclick=\"goStart()\">Main Lagi 🔄<\/button>\n      <button class=\"btn-full btn-outline\" onclick=\"toMenu(true)\">Ganti Topik<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<\script>\n// ── ALL CARDS (isi tetap) ──\nconst ALL_CARDS = [\n  // 🌸 RINGAN (10)\n  {cat:'ringan',q:'Hal kecil apa yang sering bikin kamu senyum sendiri gara-gara aku — yang mungkin belum pernah kamu ceritain?',hint:'Yang kecil-kecil itu yang paling berkesan.'},\n  {cat:'ringan',q:'Kalau kita bisa pergi ke satu tempat sekarang tanpa rencana apapun, kamu mau ke mana dan ngapain di sana?',hint:'Bukan yang ideal — yang beneran kamu pengen.'},\n  {cat:'ringan',q:'Apa hal paling random yang pernah kamu pikirin soal kita berdua — yang lucu atau aneh tapi nyata?',hint:'Boleh receh, boleh konyol.'},\n  {cat:'ringan',q:'Lagu apa yang paling menggambarkan hubungan kita sekarang — dan kenapa lagu itu?',hint:'Satu lagu spesifik, bukan \"banyak\".'},\n  {cat:'ringan',q:'Kalau kita bisa bikin tradisi kecil berdua — sesuatu yang cuma milik kita — kamu mau bikin tradisi apa?',hint:'Bisa sesederhana setiap hari Minggu pagi ngapain bareng.'},\n  {cat:'ringan',q:'Apa makanan atau minuman yang selalu mengingatkanmu ke aku — dan kenapa?',hint:'Bisa dari momen tertentu atau perasaan tertentu.'},\n  {cat:'ringan',q:'Kalau kamu bisa minta satu hal kecil dari aku untuk minggu ini — yang beneran kamu mau — apa itu?',hint:'Satu hal yang konkret dan bisa langsung dilakukan.'},\n  {cat:'ringan',q:'Hal apa dari kebiasaan harianku yang diam-diam kamu suka tapi belum pernah kamu bilang?',hint:'Yang kecil-kecil yang mungkin aku sendiri ga sadar.'},\n  {cat:'ringan',q:'Kalau kita bisa nonton satu film bareng malam ini — film apa dan kenapa film itu?',hint:'Jujur, bukan yang kedengarannya bagus.'},\n  {cat:'ringan',q:'Apa momen paling lucu atau awkward yang pernah terjadi waktu kita bareng — yang bikin kamu masih ketawa kalau ingat?',hint:'Ceritain detail — siapa yang lebih malu.'},\n\n  // 🌊 DALAM (15)\n  {cat:'dalam',q:'Kalau hubungan kita bertahan seumur hidup — 10 tahun dari sekarang, kamu bayangin kita lagi ngapain?',hint:'Sedetail mungkin — tinggal di mana, ngapain, sama siapa.'},\n  {cat:'dalam',q:'Apa satu hal tentang dirimu sendiri yang kamu khawatirkan akan mempengaruhi hubungan kita — yang belum pernah kamu omongin?',hint:'Jujur lebih berharga dari jawaban yang terdengar baik.'},\n  {cat:'dalam',q:'Momen apa dalam hubungan kita yang paling bikin kamu sadar — ini orang yang beneran aku mau pertahanin?',hint:'Bisa momen besar atau momen kecil yang mungkin keliatan sepele.'},\n  {cat:'dalam',q:'Apa yang paling kamu butuhkan dari aku di saat kamu lagi di titik terendah — yang mungkin belum pernah kamu minta?',hint:'Kadang kita tau apa yang kita butuh, tapi ga berani minta.'},\n  {cat:'dalam',q:'Kalau kamu bisa jujur sepenuhnya — apa satu hal yang kamu mau dari hubungan ini yang belum kamu dapatkan?',hint:'Bukan untuk menyalahkan, tapi untuk saling memahami.'},\n  {cat:'dalam',q:'Apa definisi \"bahagia bersama\" menurut kamu — bukan yang terlihat dari luar, tapi yang kamu rasain dari dalam?',hint:'Definisi yang beneran kamu percaya, bukan yang terdengar bagus.'},\n  {cat:'dalam',q:'Ada ga satu hal yang kamu belum pernah ceritain ke aku tapi kamu rasa aku perlu tau — tentang kamu, atau tentang kita?',hint:'Ini momen yang aman buat ngomong.'},\n  {cat:'dalam',q:'Apa satu hal yang kamu harap aku selalu ingat tentang kamu, bahkan di momen paling susah sekalipun?',hint:'Sesuatu yang kamu mau jadi pegangan waktu hal-hal terasa berat.'},\n  {cat:'dalam',q:'Hal apa tentang cara aku mencintai kamu yang paling bikin kamu ngerasa aman — dan hal apa yang kadang bikin kamu kurang yakin?',hint:'Jujur soal keduanya — yang positif dan yang kurang.'},\n  {cat:'dalam',q:'Kalau kamu harus pilih satu kata yang menggambarkan hubungan kita sekarang — satu kata yang jujur, bukan yang ideal — apa itu?',hint:'Boleh satu kata dan penjelasannya.'},\n  {cat:'dalam',q:'Seberapa sering kamu ngerasa beneran \"terlihat\" oleh aku — dipahami, bukan cuma didengar?',hint:'Jujur soal kapan terasa kurang dan kapan terasa cukup.'},\n  {cat:'dalam',q:'Apa ketakutan terbesarmu soal mencintai seseorang — yang masih kamu bawa sampai sekarang?',hint:'Mungkin dari pengalaman lama, mungkin dari sesuatu yang lebih dalam.'},\n  {cat:'dalam',q:'Hal apa yang membuat kamu merasa paling \"kamu banget\" — yang kamu harap aku selalu lihat dan hargai?',hint:'Sesuatu yang core dari siapa kamu.'},\n  {cat:'dalam',q:'Kapan terakhir kali kamu ngerasa paling dekat sama aku — dan apa yang terjadi saat itu?',hint:'Bisa momen besar atau momen kecil yang mungkin aku ga sadar.'},\n  {cat:'dalam',q:'Apa satu hal tentang diri aku yang kadang bikin kamu kesulitan — tapi kamu tetap pilih untuk ada?',hint:'Jujur soal imperfection. Kita semua punya.'},\n\n  // 🌅 MASA DEPAN (12)\n  {cat:'depan',q:'Kalau kamu bisa jamin satu hal tentang diri kamu untuk hubungan ini jangka panjang, kamu mau jamin apa?',hint:'Bukan janji kosong — yang beneran kamu yakin bisa pegang.'},\n  {cat:'depan',q:'Gimana cara kamu membayangkan kita berdua menghadapi perbedaan pendapat besar di masa depan?',hint:'Soal karir, tempat tinggal, keluarga — hal-hal yang nyata.'},\n  {cat:'depan',q:'Kalau kita kelak punya keluarga, nilai apa yang paling kamu mau kita pegang dan wariskan?',hint:'Boleh dari pengalaman keluarga kamu sendiri.'},\n  {cat:'depan',q:'Apa mimpi yang kamu punya yang belum pernah kamu ceritain ke siapapun — yang kamu mau aku tau?',hint:'Boleh besar, boleh kecil. Yang penting jujur.'},\n  {cat:'depan',q:'Kalau salah satu dari kita harus berkorban besar untuk mimpi yang satunya — seberapa jauh kamu bersedia berkorban?',hint:'Ga ada jawaban yang sempurna, yang penting jujur.'},\n  {cat:'depan',q:'Di mana kamu bayangin kita tinggal 5 tahun dari sekarang — dan seperti apa kehidupan sehari-harinya?',hint:'Detail kecil yang konkret, bukan gambaran besar yang abstrak.'},\n  {cat:'depan',q:'Apa satu hal yang kamu mau kita perbaiki atau kembangkan bareng dalam setahun ke depan?',hint:'Bisa soal cara komunikasi, waktu bersama, atau apapun yang nyata.'},\n  {cat:'depan',q:'Kalau kita bisa bikin satu keputusan besar bersama sekarang untuk masa depan kita — keputusan apa itu?',hint:'Hal yang selama ini mungkin belum dibicarakan tapi harusnya.'},\n  {cat:'depan',q:'Bagaimana caramu membayangkan kita menjaga hubungan ini tetap hidup 10 tahun dari sekarang?',hint:'Bukan tentang komitmen formal — tentang kebiasaan nyata.'},\n  {cat:'depan',q:'Apa hal yang kamu paling takutkan soal masa depan — bukan soal kita, tapi soal hidupmu — dan bagaimana aku bisa ada untuk itu?',hint:'Soal karir, keluarga, kesehatan — apapun yang nyata di pikiranmu.'},\n  {cat:'depan',q:'Kalau kamu bisa kirim surat ke diri kamu sendiri 10 tahun dari sekarang — tentang kita — apa yang akan kamu tulis?',hint:'Harapan, ketakutan, atau pesan untuk dirimu di masa depan.'},\n  {cat:'depan',q:'Apa satu janji yang bukan soal pernikahan atau hal formal — yang paling berarti buat kamu untuk kita pegang?',hint:'Sesuatu yang sederhana tapi beneran kamu pegang.'},\n\n  // ⚡ KONFLIK & TUMBUH (10)\n  {cat:'konflik',q:'Menurutmu, hal apa yang paling bisa merusak hubungan kita kalau kita ga aware — dan gimana cara kamu mencegahnya?',hint:'Jujur soal kelemahan diri sendiri juga termasuk.'},\n  {cat:'konflik',q:'Kalau kita berantem hebat sampai saling diam — apa yang biasanya paling susah buat kamu lakuin pertama kali?',hint:'Jujur soal ego sendiri itu perlu keberanian.'},\n  {cat:'konflik',q:'Apa pola komunikasi kita yang kamu rasa perlu diperbaiki — sesuatu yang kamu notice tapi mungkin belum pernah kamu bilang?',hint:'Bukan nyalahin, tapi soal tumbuh bareng.'},\n  {cat:'konflik',q:'Kapan terakhir kali kamu ngerasa tidak didengar atau tidak dipahami olehku — dan apa yang terjadi saat itu?',hint:'Jujur soal momen spesifik, bukan generalisasi.'},\n  {cat:'konflik',q:'Apa yang biasanya kamu lakuin saat kamu lagi kesal sama aku — yang mungkin malah bikin situasinya lebih susah?',hint:'Ini soal pattern diri sendiri, bukan menyalahkan.'},\n  {cat:'konflik',q:'Hal apa yang paling bikin kamu ngerasa aman untuk jujur ke aku — dan hal apa yang kadang bikin kamu ragu?',hint:'Jujur soal keduanya — ini penting.'},\n  {cat:'konflik',q:'Ada ga sesuatu yang pernah aku bilang atau lakukan yang masih ada di hatimu — yang belum pernah benar-benar selesai?',hint:'Ini momen yang aman. Tidak ada yang akan dihakimi.'},\n  {cat:'konflik',q:'Apa satu hal yang kamu mau aku lakuin berbeda dalam cara aku merespons kamu saat kamu lagi tidak baik-baik saja?',hint:'Spesifik — bukan \"lebih perhatian\" tapi apa yang konkret.'},\n  {cat:'konflik',q:'Kalau kamu harus jujur — seberapa sering kamu menelan perasaanmu sendiri daripada mengungkapkannya ke aku?',hint:'Dan kenapa kamu melakukannya?'},\n  {cat:'konflik',q:'Apa yang paling kamu pelajari tentang dirimu sendiri dari hubungan kita — sesuatu yang mungkin belum kamu sadari sebelumnya?',hint:'Pertumbuhan itu sering terasa tidak nyaman tapi nyata.'},\n];\nconst CAT_META = {\n  ringan:{label:'🌸 Ringan',cls:'cc-ringan'},\n  dalam:{label:'🌊 Dalam',cls:'cc-dalam'},\n  depan:{label:'🌅 Masa Depan',cls:'cc-depan'},\n  konflik:{label:'⚡ Konflik & Tumbuh',cls:'cc-konflik'},\n};\nconst WA = '6285692740607';\n\n// ── SIMPANAN (favorit & kartu yang pernah dibahas tersimpan permanen, pakai teks pertanyaannya) ──\nconst LS = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };\nlet favs = LS.get('deeptalk-favs', []);          // [{q, cat, at}]\nlet seen = LS.get('deeptalk-seen', []);          // teks pertanyaan yang udah pernah dijawab\nconst isFav = q => favs.some(f => f.q === q);\n\n// ── STATE ──\nconst $ = id => document.getElementById(id);\nlet selectedMoods = new Set(['ringan', 'dalam', 'depan', 'konflik']), howMany = 10;\nlet deck = [], idx = 0, log = [], animating = false, firstWho = 'Razan', starredBack = 's-intro';\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\nfunction toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0, 0); }\nfunction shuffle(a0) { const a = [...a0]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }\n\nfunction renderIntro() {\n  Object.keys(CAT_META).forEach(c => {\n    const all = ALL_CARDS.filter(x => x.cat === c), fresh = all.filter(x => !seen.includes(x.q)).length;\n    $('cnt-' + c).textContent = `${all.length} kartu${fresh < all.length ? ` · ${fresh} belum` : ''}`;\n  });\n  const pool = ALL_CARDS.filter(c => selectedMoods.has(c.cat)), fresh = pool.filter(c => !seen.includes(c.q)).length;\n  $('all-n').textContent = pool.length;\n  $('fresh-note').innerHTML = seen.length ? (fresh ? `✨ Kartu yang <b>belum pernah dibahas (${fresh})<\/b> keluar duluan` : '✅ Semua kartu di topik ini udah pernah kalian bahas — sekarang diacak ulang semua') : '';\n  $('intro-fav').textContent = `⭐ Kartu favorit kalian (${favs.length})`;\n  $('intro-fav').style.display = favs.length ? '' : 'none';\n}\nfunction toggleMood(m) {\n  if (selectedMoods.has(m)) { if (selectedMoods.size <= 1) return; selectedMoods.delete(m); } else selectedMoods.add(m);\n  $('mo-' + m).classList.toggle('sel', selectedMoods.has(m)); renderIntro();\n}\n$('opt-n').querySelectorAll('.pill').forEach(p => p.onclick = () => { $('opt-n').querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === p)); howMany = +p.dataset.v; });\n\n// ── MULAI ──\nfunction goStart() {\n  const pool = ALL_CARDS.filter(c => selectedMoods.has(c.cat));\n  // kartu yang belum pernah dibahas duluan, baru yang lama — masing-masing diacak\n  const fresh = shuffle(pool.filter(c => !seen.includes(c.q))), old = shuffle(pool.filter(c => seen.includes(c.q)));\n  deck = [...fresh, ...old].slice(0, howMany || pool.length).map(c => ({ ...c, isNew: !seen.includes(c.q) }));\n  idx = 0; log = []; animating = false; firstWho = Math.random() < .5 ? 'Razan' : 'Dara';\n  const card = $('card'); card.style.display = ''; card.classList.remove('swipe-left', 'swipe-right');   // [FIX] dulu kartu ketinggalan disembunyiin → \"Main Lagi\" nampilin kosong\n  updateStarCount(); renderCard(); showScreen('s-game');\n}\nfunction renderCard(dir) {\n  if (idx >= deck.length) return showDone();\n  const c = deck[idx], total = deck.length;\n  $('prog-txt').textContent = `${idx + 1}/${total}`; $('prog-fill').style.width = (idx / total * 100) + '%';\n  const meta = CAT_META[c.cat] || CAT_META.dalam; $('card-cat').textContent = meta.label; $('card-cat').className = 'card-cat ' + meta.cls;\n  $('card-q').textContent = c.q; $('card-hint').textContent = c.hint ? `💡 ${c.hint}` : ''; $('card-num-label').textContent = String(idx + 1).padStart(2, '0');\n  $('star-btn').textContent = isFav(c.q) ? '⭐' : '☆';\n  $('new-tag').classList.toggle('show', !!c.isNew && seen.length > 0);\n  $('btn-back').disabled = idx === 0;\n  const who = idx % 2 === 0 ? firstWho : (firstWho === 'Razan' ? 'Dara' : 'Razan');\n  $('who-first').innerHTML = `${who === 'Razan' ? '🧑' : '👧'} <b>${who}<\/b> jawab duluan, abis itu gantian`;\n  const card = $('card'); card.classList.remove('swipe-left', 'swipe-right', 'slide-in', 'slide-back'); void card.offsetWidth;\n  if (dir) card.classList.add(dir === 'back' ? 'slide-back' : 'slide-in');\n  const remaining = total - idx - 1;\n  document.querySelector('.ghost-1').style.opacity = remaining >= 1 ? '.65' : '0';\n  document.querySelector('.ghost-2').style.opacity = remaining >= 2 ? '.45' : '0';\n}\nfunction go(action) {\n  if (animating || idx >= deck.length) return;\n  animating = true; log.push(action);\n  if (action === 'answer') { const q = deck[idx].q; if (!seen.includes(q)) { seen.push(q); LS.set('deeptalk-seen', seen); } }\n  $('card').classList.add(action === 'answer' ? 'swipe-right' : 'swipe-left'); vib(action === 'answer' ? 15 : 8);\n  setTimeout(() => { idx++; animating = false; renderCard('next'); }, 260);\n}\nfunction nextCard() { go('answer'); }\nfunction skipCard() { go('skip'); }\n// [FIX] dulu \"Balik\" selalu ngurangin jumlah dijawab, padahal yang terakhir bisa aja di-skip\nfunction prevCard() {\n  if (animating || idx <= 0) return;\n  log.pop(); idx--; renderCard('back'); vib(8);\n}\nfunction toggleStar() {\n  const c = deck[idx]; if (!c) return;\n  if (isFav(c.q)) favs = favs.filter(f => f.q !== c.q); else favs.unshift({ q: c.q, cat: c.cat, at: Date.now() });\n  LS.set('deeptalk-favs', favs); $('star-btn').textContent = isFav(c.q) ? '⭐' : '☆'; updateStarCount(); vib(20);\n  toast(isFav(c.q) ? '⭐ Disimpan ke favorit' : 'Dihapus dari favorit');\n}\nfunction updateStarCount() {\n  const inDeck = deck.filter(c => isFav(c.q)).length;\n  $('star-count').textContent = `⭐ ${inDeck}`; $('show-starred-btn').textContent = `⭐ Favorit (${favs.length})`;\n}\nfunction toMenu(force) { renderIntro(); showScreen('s-intro'); }\n\n// ── SWIPE ──\n(function () {\n  const card = $('card'); let x0 = null, y0 = 0, dx = 0;\n  card.addEventListener('touchstart', e => { if (e.target.closest('.star-btn')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; card.style.transition = 'none'; }, { passive: true });\n  card.addEventListener('touchmove', e => { if (x0 == null) return; dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0; if (Math.abs(dy) > Math.abs(dx)) return; card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; }, { passive: true });\n  card.addEventListener('touchend', () => {\n    if (x0 == null) return; x0 = null; card.style.transition = ''; card.style.transform = '';\n    if (dx > 80) nextCard(); else if (dx < -80) skipCard();\n  });\n})();\n\n// ── FAVORIT ──\nfunction showStarred() {\n  starredBack = $('s-game').classList.contains('active') ? 's-game' : $('s-done').classList.contains('active') ? 's-done' : 's-intro';\n  const list = $('starred-list');\n  if (!favs.length) list.innerHTML = '<p style=\"color:var(--muted);font-size:13px;text-align:center;padding:1rem\">Belum ada yang di-bintangi. Tap ☆ di pojok kartu buat nyimpen.<\/p>';\n  else list.innerHTML = favs.map((f, i) => { const m = CAT_META[f.cat] || CAT_META.dalam; return `<div class=\"starred-item\"><span class=\"si-cat\">${m.label}<\/span><p class=\"si-q\">${f.q}<\/p><button class=\"si-del\" onclick=\"delFav(${i})\" title=\"Hapus\">✕<\/button><\/div>`; }).join('');\n  $('fav-wa').style.display = favs.length ? '' : 'none';\n  $('fav-back').textContent = starredBack === 's-game' ? 'Kembali Main' : 'Kembali';\n  showScreen('s-starred');\n}\nfunction delFav(i) { favs.splice(i, 1); LS.set('deeptalk-favs', favs); updateStarCount(); showStarred(); }\nfunction backFromStarred() { if (starredBack === 's-intro') re t.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n<div id=\"stars\"><\/div>\n\n<\!-- INTRO -->\n<div id=\"s-intro\" class=\"screen active\">\n  <div class=\"intro-wrap\">\n    <span class=\"intro-icon\">💌<\/span>\n    <span class=\"intro-eyebrow\">Untuk Dara, dari Razan<\/span>\n    <h1 class=\"intro-title\">36 Pertanyaan<br>untuk <em>Semakin Dekat<\/em><\/h1>\n    <p class=\"intro-quote\">\"Kedekatan yang nyata tidak tumbuh dari waktu yang dihabiskan bersama — tapi dari keberanian untuk benar-benar dikenal.\"<\/p>\n    <span class=\"intro-source\">— diadaptasi dari studi Dr. Arthur Aron, 1997<\/span>\n    <div class=\"levels-preview\">\n      <button class=\"lp on\" data-lv=\"1\" onclick=\"pickLevel(1)\"><span class=\"lp-icon\">🌱<\/span><span class=\"lp-name\">Level I<\/span><span class=\"lp-count\">12 pertanyaan<\/span><\/button>\n      <button class=\"lp\" data-lv=\"2\" onclick=\"pickLevel(2)\"><span class=\"lp-icon\">🌿<\/span><span class=\"lp-name\">Level II<\/span><span class=\"lp-count\">12 pertanyaan<\/span><\/button>\n      <button class=\"lp\" data-lv=\"3\" onclick=\"pickLevel(3)\"><span class=\"lp-icon\">🌹<\/span><span class=\"lp-name\">Level III<\/span><span class=\"lp-count\">12 pertanyaan<\/span><\/button>\n    <\/div>\n    <p class=\"lp-hint\">Tap level buat mulai dari situ — idealnya dari Level I<\/p>\n    <button class=\"resume-btn\" id=\"resume-btn\" onclick=\"resume()\">▶ Lanjutkan<\/button>\n    <button class=\"intro-btn\" id=\"intro-btn\" onclick=\"startLevel(startLv, true)\">Mulai Perjalanan 💌<\/button>\n  <\/div>\n<\/div>\n\n<\!-- LEVEL -->\n<div id=\"s-level\" class=\"screen\">\n  <div class=\"level-wrap\">\n    <span class=\"level-badge\" id=\"lv-badge\">🌱<\/span>\n    <span class=\"level-eyebrow\" id=\"lv-eyebrow\">Level I dari III<\/span>\n    <h2 class=\"level-title\" id=\"lv-title\">Membangun Jembatan<\/h2>\n    <p class=\"level-desc\" id=\"lv-desc\"><\/p>\n    <div class=\"level-tip\"><span class=\"level-tip-title\">💡 Cara main<\/span><span id=\"lv-tip\"><\/span><\/div>\n    <button class=\"level-start-btn\" id=\"lv-btn\" onclick=\"beginQuestions()\">Mulai Level I →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- QUESTION -->\n<div id=\"s-question\" class=\"screen\">\n  <div class=\"q-header\">\n    <button class=\"q-exit\" onclick=\"exitGame()\">✕<\/button>\n    <span class=\"q-level-badge\" id=\"q-level-badge\">🌱 Level I<\/span>\n    <span class=\"q-progress-text\" id=\"q-progress-text\">1 / 12<\/span>\n  <\/div>\n  <div class=\"q-prog-bar\"><div class=\"q-prog-fill\" id=\"q-prog-fill\" style=\"width:0%\"><\/div><\/div>\n  <div class=\"q-body\">\n    <span class=\"q-number-display\" id=\"q-number-display\">Pertanyaan 1<\/span>\n    <div class=\"q-card\"><span class=\"q-card-eyebrow\">Untuk kalian berdua<\/span><p class=\"q-text\" id=\"q-text\">...<\/p><\/div>\n    <div class=\"timer-row\">\n      <div class=\"timer-ring-wrap\"><svg class=\"timer-svg\" viewBox=\"0 0 56 56\"><circle class=\"timer-track\" cx=\"28\" cy=\"28\" r=\"24\"/><circle class=\"timer-ring-fill\" id=\"timer-ring\" cx=\"28\" cy=\"28\" r=\"24\"/><\/svg><div class=\"timer-num\" id=\"timer-num\">3:00<\/div><\/div>\n      <button class=\"t-btn\" id=\"t-btn\" onclick=\"toggleTimer()\">⏸ Jeda<\/button>\n      <button class=\"t-btn\" onclick=\"restartTimer()\">↺ Ulang<\/button>\n    <\/div>\n    <p class=\"q-prompt\" id=\"q-prompt\"><\/p>\n    <div class=\"q-actions\">\n      <div class=\"q-row\"><button class=\"q-back-btn\" id=\"q-back-btn\" onclick=\"prevQuestion()\">←<\/button><button class=\"q-next-btn\" id=\"q-next-btn\" onclick=\"nextQuestion()\">Pertanyaan Berikutnya →<\/button><\/div>\n      <button class=\"q-skip-btn\" onclick=\"skipQuestion()\">Lewati pertanyaan ini<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- STARE -->\n<div id=\"s-stare\" class=\"screen\">\n  <div class=\"stare-wrap\">\n    <span class=\"stare-icon\">👁️<\/span>\n    <h2 class=\"stare-title\">Tatap Mata Selama 4 Menit<\/h2>\n    <p class=\"stare-sub\">Ini bagian terakhir dari eksperimen Aron. Tatap mata satu sama lain tanpa bicara — selama 4 menit penuh.<\/p>\n    <span class=\"stare-timer\" id=\"stare-timer\">4:00<\/span>\n    <p class=\"stare-sub2\" id=\"stare-sub2\">Taruh HP-nya di samping, terus tap Mulai 🤍<\/p>\n    <div class=\"stare-btns\">\n      <button class=\"s-main\" id=\"stare-main\" onclick=\"toggleStare()\">▶ Mulai 4 Menit<\/button>\n      <button class=\"s-ghost\" onclick=\"finishStare()\">Udah selesai / lewati →<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- FINAL -->\n<div id=\"s-final\" class=\"screen\">\n  <div class=\"final-wrap\">\n    <span class=\"final-icon\">🤍<\/span>\n    <h2 class=\"final-title\">Kalian Sudah Menyelesaikannya<\/h2>\n    <p class=\"final-sub\" id=\"final-sub\">36 pertanyaan, satu sama lain yang lebih dikenal.<\/p>\n    <div class=\"final-stats\">\n      <div class=\"fstat\"><span class=\"fstat-val\" id=\"stat-q\">36<\/span><span class=\"fstat-label\">Pertanyaan dijawab<\/span><\/div>\n      <div class=\"fstat\"><span class=\"fstat-val\" id=\"stat-skipped\">0<\/span><span class=\"fstat-label\">Pertanyaan dilewat<\/span><\/div>\n      <div class=\"fstat\"><span class=\"fstat-val\" id=\"stat-stare\">🤍<\/span><span class=\"fstat-label\" id=\"stat-stare-l\">Tatap mata<\/span><\/div>\n    <\/div>\n    <div class=\"final-message\" id=\"final-message\">...<\/div>\n    <div class=\"skipped-list\" id=\"skipped-list\"><\/div>\n    <div class=\"final-aron\">\n      <span class=\"aron-title\">📖 Tentang Studi Ini<\/span>\n      Pada 1997, psikolog Arthur Aron merancang eksperimen di mana dua orang asing duduk bersama dan menjawab 36 pertanyaan yang semakin personal. Hasilnya — banyak dari mereka merasa sangat dekat. Beberapa bahkan jatuh cinta. Bukan karena pertanyaannya ajaib, tapi karena mereka berani untuk benar-benar terlihat oleh satu sama lain.\n    <\/div>\n    <div class=\"final-btns\">\n      <button class=\"final-btn final-btn-p\" onclick=\"startLevel(1, true)\">Ulangi dari Awal 🔄<\/button>\n      <button class=\"final-btn final-btn-o\" onclick=\"toIntro()\">Menu<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\script>\n// ── QUESTIONS (isi tetap) ──\nconst LEVELS = [\n  {\n    num: 1, icon: '🌱', name: 'Membangun Jembatan',\n    desc: 'Pertanyaan-pertanyaan ringan untuk mulai membuka diri. Tidak ada jawaban yang salah — yang penting jujur.',\n    color: '#7ec850', gradient: 'linear-gradient(135deg,#2d6a2d,#7ec850)',\n    tip: 'Jawab bergantian — Razan dulu, lalu Dara. Jangan buru-buru. Dengarkan satu sama lain.',\n    questions: [\n      'Kalau bisa mengundang siapapun di dunia untuk makan malam, siapa yang kamu pilih dan kenapa?',\n      'Apakah kamu punya impian rahasia tentang bagaimana hidupmu 10 tahun dari sekarang?',\n      'Sebelum menelepon, apakah kamu pernah berlatih apa yang akan kamu katakan? Kenapa?',\n      'Apa artinya \"hari yang sempurna\" buatmu — dari pagi sampai malam?',\n      'Kapan terakhir kali kamu bernyanyi sendirian? Dan untuk siapakah kamu bernyanyi?',\n      'Kalau kamu bisa hidup sampai 90 tahun, mana yang kamu pilih — pikiran 30 tahun atau tubuh 30 tahun untuk sisa hidupmu?',\n      'Apakah kamu punya firasat tentang bagaimana kamu akan meninggal?',\n      'Sebutkan tiga hal yang menurutmu kamu dan pasanganmu punya kesamaan.',\n      'Apa yang paling kamu syukuri dalam hidupmu?',\n      'Kalau kamu bisa mengubah satu hal dari cara kamu dibesarkan, apa itu?',\n      'Ceritakan kisah hidup kamu dalam empat menit, dengan detail sebanyak mungkin.',\n      'Kalau kamu bisa bangun besok dengan satu kemampuan atau kualitas baru, apa yang kamu pilih?',\n    ]\n  },\n  {\n    num: 2, icon: '🌿', name: 'Masuk Lebih Dalam',\n    desc: 'Pertanyaan yang mulai menyentuh nilai, mimpi, dan ketakutan. Ini adalah bagian yang mulai terasa lebih nyata.',\n    color: '#c9a96e', gradient: 'linear-gradient(135deg,#7a5a2a,#c9a96e)',\n    tip: 'Kalau ada pertanyaan yang terasa berat — bagus. Itulah tanda kamu sedang membuka sesuatu yang nyata.',\n    questions: [\n      'Apakah ada sesuatu yang sudah lama ingin kamu lakukan tapi selalu kamu tunda? Kenapa?',\n      'Apa pencapaian terbesar dalam hidupmu?',\n      'Apa yang paling kamu hargai dalam sebuah persahabatan?',\n      'Apa kenangan paling berharga dalam hidupmu?',\n      'Apakah ada sesuatu yang sudah lama ingin kamu ceritakan tapi belum pernah bisa?',\n      'Kalau kamu tahu kamu akan meninggal tiba-tiba setahun dari sekarang, apa yang akan kamu ubah dari hidupmu sekarang?',\n      'Artinya persahabatan buatmu adalah... apa?',\n      'Apa peran cinta dan kasih sayang dalam hidupmu?',\n      'Bergantian sebutkan satu hal yang positif tentang pasanganmu — 5 hal masing-masing.',\n      'Seberapa dekat dan hangat keluargamu? Apakah kamu merasa masa kecilmu lebih bahagia dari kebanyakan orang?',\n      'Bagaimana kamu merasakan hubunganmu dengan ibumu?',\n      'Buat tiga pernyataan \"kita\" yang benar tentang kalian berdua. Misalnya: \"Kita sama-sama suka...\"',\n    ]\n  },\n  {\n    num: 3, icon: '🌹', name: 'Saling Terlihat',\n    desc: 'Pertanyaan-pertanyaan paling personal dan rentan. Di sinilah kedekatan yang sesungguhnya tumbuh — ketika kamu berani terlihat sepenuhnya.',\n    color: '#c17a6f', gradient: 'linear-gradient(135deg,var(--deep),var(--rose))',\n    tip: 'Tidak apa-apa kalau terasa tidak nyaman. Kerentanan adalah tempat kepercayaan tumbuh. Tetap jujur.',\n    questions: [\n      'Lengkapi kalimat ini: \"Aku berharap ada seseorang yang bisa aku ajak untuk membicarakan ____.\"',\n      'Kalau kamu akan menjadi teman dekat dengan pasanganmu, bagikan sesuatu yang penting buat mereka untuk diketahui.',\n      'Ceritakan satu hal yang kamu sukai dari pasanganmu — sesuatu yang tidak akan kamu katakan pada orang baru.',\n      'Bagikan momen yang paling memalukan dalam hidupmu.',\n      'Kapan terakhir kali kamu menangis di depan orang lain? Sendirian? Apa yang membuatmu menangis?',\n      'Adakah sesuatu yang sudah terlalu serius untuk dijadikan lelucon bagimu?',\n      'Kalau kamu akan meninggal malam ini tanpa kesempatan berkomunikasi dengan siapapun, apa yang paling kamu sesali tidak pernah kamu katakan? Kenapa kamu belum mengatakannya?',\n      'Rumahmu terbakar beserta semua isinya. Setelah menyelamatkan orang dan hewan peliharaan, kamu punya waktu untuk kembali dan menyelamatkan satu benda. Apa itu dan kenapa?',\n      'Di antara semua orang dalam keluargamu, kematian siapa yang akan paling menghancurkanmu?',\n      'Bagikan masalah pribadi dan minta pendapat pasanganmu tentang bagaimana seharusnya kamu mengatasinya.',\n      'Apa satu hal yang kamu ingin pasanganmu tahu tentang dirimu yang belum pernah kamu katakan?',\n      'Tatap mata pasanganmu selama empat menit tanpa bicara. Apa yang kamu rasakan?',\n    ]\n  }\n];\n\n// ── STATE (tersimpan di HP, bisa dilanjut kapan aja) ──\nconst KEY = 'q36-progress';\nconst $ = id => document.getElementById(id);\nlet S = null, startLv = 1, qTimer = null, stare = null, wakeLock = null;\nfunction load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\nfunction beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 660; g.gain.value = .12; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .4); } catch {} }\nconst isStareQ = (lv, i) => lv === 3 && i === 11;\nfunction qTime(lv, i) { return lv === 1 && i === 10 ? 240 : 180; }   // [FIX] \"kisah hidup dalam empat menit\" dulu timernya cuma 3 menit\n\n(function () {\n  const s = $('stars');\n  for (let i = 0; i < 70; i++) { const el = document.createElement('div'); el.className = 'star'; const z = 1 + Math.random() * 2; el.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-duration:${2 + Math.random() * 4}s;animation-delay:-${Math.random() * 4}s`; s.appendChild(el); }\n})();\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); $(id).scrollTop = 0; }\n\nfunction renderIntro() {\n  const p = load();\n  const btn = $('resume-btn');\n  if (p && !p.done && (p.lv > 1 || p.i > 0)) { btn.textContent = `▶ Lanjutkan — Level ${p.lv}, pertanyaan ${(p.lv - 1) * 12 + p.i + 1} dari 36`; btn.classList.add('show'); $('intro-btn').textContent = 'Mulai dari Awal 💌'; }\n  else { btn.classList.remove('show'); $('intro-btn').textContent = 'Mulai Perjalanan 💌'; }\n}\nfunction pickLevel(n) { startLv = n; document.querySelectorAll('.lp').forEach(b => b.classList.toggle('on', +b.dataset.lv === n)); $('intro-btn').textContent = n === 1 ? (load() && !load().done ? 'Mulai dari Awal 💌' : 'Mulai Perjalanan 💌') : `Mulai dari Level ${['', 'I', 'II', 'III'][n]} 💌`; }\nfunction toIntro() { stopQ(); renderIntro(); showScreen('s-intro'); }\nfunction resume() { S = load(); if (!S) return startLevel(1, true); showLevel(); }\n\n// [FIX] dulu jumlah \"dilewat\" ke-reset tiap ganti level → statistik akhir salah\nfunction startLevel(lv, fresh) {\n  if (fresh || !S) S = { lv, i: 0, skipped: [], first: Math.random() < .5 ? 'Razan' : 'Dara', stare: false, done: false, from: lv };\n  else { S.lv = lv; S.i = 0; }\n  save(); showLevel();\n}\nfunction showLevel() {\n  stopQ();\n  const lv = LEVELS[S.lv - 1];\n  $('lv-badge').textContent = lv.icon; $('lv-eyebrow').textContent = `Level ${lv.num} dari 3`;\n  $('lv-title').textContent = lv.name; $('lv-desc').textContent = lv.desc; $('lv-tip').textContent = lv.tip;\n  $('lv-btn').textContent = S.i > 0 ? `Lanjut Level ${lv.num} →` : `Mulai Level ${lv.num} →`; $('lv-btn').style.background = lv.gradient;\n  showScreen('s-level');\n}\nfunction beginQuestions() { showScreen('s-question'); renderQuestion(); }\n\nfunction renderQuestion() {\n  const lv = LEVELS[S.lv - 1], q = lv.questions[S.i], total = lv.questions.length, g = (S.lv - 1) * 12 + S.i + 1;\n  const b = $('q-level-badge'); b.textContent = `${lv.icon} Level ${lv.num}`; b.style.background = lv.gradient;\n  $('q-progress-text').textContent = `${S.i + 1} / ${total}`;\n  $('q-prog-fill').style.width = (S.i / total * 100) + '%'; $('q-prog-fill').style.background = lv.color;\n  $('q-number-display').textContent = `Pertanyaan ${g} dari 36`;\n  const el = $('q-text'); el.classList.remove('animate'); void el.offsetWidth; el.classList.add('animate'); el.textContent = q;\n  // giliran jawab duluan gantian tiap pertanyaan\n  const first = g % 2 === 1 ? S.first : (S.first === 'Razan' ? 'Dara' : 'Razan'), second = first === 'Razan' ? 'Dara' : 'Razan';\n  $('q-prompt').innerHTML = isStareQ(S.lv, S.i) ? 'Pertanyaan terakhir — tatap mata dulu 4 menit, baru ceritain apa yang kalian rasain 🤍'\n    : `Jawab bergantian — <b>${first}<\/b> dulu, lalu <b>${second}<\/b>${S.lv === 1 && S.i === 10 ? ' · masing-masing 4 menit (tap ↺ buat orang kedua)' : ''}`;\n  $('q-back-btn').disabled = g === 1;\n  $('q-next-btn').style.background = lv.gradient;\n  const lastQ = S.i >= total - 1;\n  $('q-next-btn').textContent = isStareQ(S.lv, S.i) ? 'Mulai Tatap Mata 👁️' : lastQ ? `Lanjut ke Level ${S.lv + 1} →` : 'Pertanyaan Berikutnya →';\n  document.querySelector('.timer-row').style.display = isStareQ(S.lv, S.i) ? 'none' : 'flex';\n  startQ(qTime(S.lv, S.i));\n  save();\n}\n\n// ── TIMER PERTANYAAN (bisa dijeda & diulang buat orang kedua, getar pas habis) ──\nfunction startQ(sec) {\n  stopQ(); qTimer = { total: sec, left: sec, last: performance.now(), paused: false };\n  drawQ(); $('t-btn').textContent = '⏸ Jeda';\n  qTimer.iv = setInterval(() => {\n    if (qTimer.paused) return;\n    const now = performance.now(); qTimer.left = Math.max(0, qTimer.left - (now - qTimer.last) / 1000); qTimer.last = now; drawQ();\n    if (qTimer.left <= 0) { clearInterval(qTimer.iv); vib([150, 80, 150]); beep(); $('t-btn').textContent = '⏰ Habis'; }\n  }, 250);\n}\nfunction stopQ() { if (qTimer && qTimer.iv) clearInterval(qTimer.iv); }\nfunction toggleTimer() { if (!qTimer || qTimer.left <= 0) return; qTimer.paused = !qTimer.paused; qTimer.last = performance.now(); $('t-btn').textContent = qTimer.paused ? '▶ Lanjut' : '⏸ Jeda'; }\nfunction restartTimer() { startQ(qTime(S.lv, S.i)); }\nfunction drawQ() {\n  const t = Math.ceil(qTimer.left), pct = qTimer.left / qTimer.total;\n  $('timer-num').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;\n  const ring = $('timer-ring'); ring.style.strokeDashoffset = 150.8 * (1 - pct); ring.style.stroke = pct < .3 ? '#e57373' : pct < .6 ? '#ffb300' : 'var(--rose)';\n}\n\nfunction nextQuestion() {\n  if (isStareQ(S.lv, S.i)) return startStare();   // [FIX] dulu pertanyaan 36 & layar tatap mata dobel\n  S.i++;\n  if (S.i >= 12) { if (S.lv < 3) { startLevel(S.lv + 1); } } else renderQuestion();\n}\nfunction skipQuestion() {\n  const id = `${S.lv}-${S.i}`; if (!S.skipped.includes(id)) S.skipped.push(id);\n  if (isStareQ(S.lv, S.i)) { S.stare = false; return showFinal(); }\n  nextQuestion();\n}\nfunction prevQuestion() {\n  if (S.i > 0) S.i--; else if (S.lv > 1) { S.lv--; S.i = 11; } else return;\n  S.skipped = S.skipped.filter(x => x !== `${S.lv}-${S.i}`);   // kalau dibalikin, dianggap belum dilewat\n  renderQuestion();\n}\nfunction exitGame() { if (!confirm('Keluar dulu? Progres kalian tersimpan, bisa dilanjut nanti.')) return; toIntro(); }\n\n// ── TATAP MATA (sekarang ada tombol mulai, jeda & selesai — dan layar dijaga biar nggak mati) ──\nfunction startStare() { stopQ(); stare = { left: 240, iv: null }; $('stare-timer').textContent = '4:00'; $('stare-timer').classList.remove('run'); $('stare-main').textContent = '▶ Mulai 4 Menit'; $('stare-sub2').textContent = 'Taruh HP-nya di samping, terus tap Mulai 🤍'; showScreen('s-stare'); }\nasync function keepAwake(on) ackground:linear-gradient(135deg,#7a5a2a,var(--gold));color:var(--ink)}\n  .paper-btn-p:active{transform:scale(.97)}\n  .paper-btn-o{background:rgba(255,255,255,.07);color:rgba(255,255,255,.5)}\n  .swap-btn{margin-top:.6rem;background:none;border:none;color:rgba(255,255,255,.35);font-size:11.5px;cursor:pointer;text-decoration:underline}\n  .swap-btn:disabled{opacity:.4;text-decoration:none}\n\n  /* FINAL */\n  #s-final{padding:1rem;justify-content:flex-start}\n  .final-wrap{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:.85rem;padding:1.5rem 0 3rem;margin:0 auto}\n  .final-icon{font-size:3.5rem;display:block;animation:float 3s ease-in-out infinite}\n  .final-title{font-size:1.2rem;font-weight:700;color:#fff;text-align:center}\n  .final-sub{font-size:13px;color:rgba(255,255,255,.45);line-height:1.75;text-align:center;max-width:300px;font-style:italic}\n  .final-score{background:rgba(255,255,255,.04);border:1px solid rgba(201,169,110,.15);border-radius:20px;padding:1.1rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;text-align:center;width:100%}\n  .fs-av{font-size:1.5rem;display:block;margin-bottom:.15rem}\n  .fs-nm{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;display:block}\n  .fs-sc{font-size:2.2rem;font-weight:700;display:block;line-height:1}\n  .fs-sc.razan{color:#7eb3f5}.fs-sc.dara{color:#e8a090}\n  .fs-lb{font-size:9px;color:rgba(255,255,255,.3);display:block;margin-top:.2rem}\n  .fs-vs{color:rgba(255,255,255,.2)}\n  .recap{width:100%;display:flex;flex-direction:column;gap:.4rem}\n  .recap-title{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.1rem}\n  .cr-item{background:rgba(255,255,255,.04);border-radius:12px;padding:.65rem .9rem;display:flex;align-items:center;gap:.6rem;font-size:12px;color:rgba(255,255,255,.6)}\n  .q-item{background:rgba(255,25 t-filter\"><\/div>\n  <div class=\"jar-body\">\n    <div class=\"jar-container\" onclick=\"drawQuestion()\">\n      <svg class=\"jar-svg\" viewBox=\"0 0 200 260\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect x=\"55\" y=\"18\" width=\"90\" height=\"22\" rx=\"8\" fill=\"rgba(201,169,110,.3)\" stroke=\"rgba(201,169,110,.5)\" stroke-width=\"2\"/>\n        <rect x=\"70\" y=\"12\" width=\"60\" height=\"14\" rx=\"6\" fill=\"rgba(201,169,110,.25)\" stroke=\"rgba(201,169,110,.4)\" stroke-width=\"1.5\"/>\n        <path d=\"M55 38 Q45 50 42 80 L42 210 Q42 230 60 235 L140 235 Q158 230 158 210 L158 80 Q155 50 145 38 Z\" fill=\"rgba(255,255,255,.06)\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"2\"/>\n        <path d=\"M60 50 Q58 80 58 120\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n        <g id=\"papers-group\">\n          <rect x=\"68\" y=\"170\" width=\"35\" height=\"48\" rx=\"3\" fill=\"rgba(232,196,176,.7)\" transform=\"rotate(-8 68 170)\" opacity=\"0.9\"/>\n          <rect x=\"85\" y=\"165\" width=\"38\" height=\"52\" rx=\"3\" fill=\"rgba(245,237,224,.8)\" transform=\"rotate(4 85 165)\" opacity=\"0.9\"/>\n          <rect x=\"100\" y=\"168\" width=\"33\" height=\"50\" rx=\"3\" fill=\"rgba(201,169,110,.6)\" transform=\"rotate(-3 100 168)\" opacity=\"0.85\"/>\n          <rect x=\"72\" y=\"155\" width=\"30\" height=\"45\" rx=\"3\" fill=\"rgba(255,255,255,.5)\" transform=\"rotate(6 72 155)\" opacity=\"0.8\"/>\n          <rect x=\"90\" y=\"152\" width=\"35\" height=\"48\" rx=\"3\" fill=\"rgba(193,122,111,.4)\" transform=\"rotate(-5 90 152)\" opacity=\"0.75\"/>\n          <rect x=\"78\" y=\"145\" width=\"32\" height=\"44\" rx=\"3\" fill=\"rgba(181,196,177,.5)\" transform=\"rotate(9 78 145)\" opacity=\"0.7\"/>\n          <rect x=\"95\" y=\"142\" width=\"30\" height=\"46\" rx=\"3\" fill=\"rgba(232,196,176,.45)\" transform=\"rotate(-7 95 142)\" opacity=\"0.65\"/>\n        <\/g>\n        <path d=\"M58 50 Q55 100 55 150\" stroke=\"rgba(255,255,255,.08)\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n      <\/svg>\n      <p class=\"jar-tap-hint\" id=\"jar-tap-hint\">✨ Tap toples untuk ambil pertanyaan<\/p>\n      <p class=\"jar-remaining\" id=\"jar-remaining\"><\/p>\n    <\/div>\n    <div class=\"score-row\">\n      <div class=\"sr-item\"><span class=\"sr-name\">🧑 Razan<\/span><span class=\"sr-score razan\" id=\"score-r\">0<\/span><\/div>\n      <span class=\"sr-vs\">🫙<\/span>\n      <div class=\"sr-item\"><span class=\"sr-name\">Dara 👧<\/span><span class=\"sr-score dara\" id=\"score-d\">0<\/span><\/div>\n    <\/div>\n    <button class=\"done-btn\" id=\"done-btn\" onclick=\"showFinal()\">✓ Udahan, lihat rekap<\/button>\n  <\/div>\n<\/div>\n\n<\!-- KOCOK -->\n<div id=\"shake-overlay\" onclick=\"doShake()\">\n  <svg id=\"shake-jar-svg\" viewBox=\"0 0 200 260\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect x=\"55\" y=\"18\" width=\"90\" height=\"22\" rx=\"8\" fill=\"rgba(201,169,110,.3)\" stroke=\"rgba(201,169,110,.5)\" stroke-width=\"2\"/>\n    <rect x=\"70\" y=\"12\" width=\"60\" height=\"14\" rx=\"6\" fill=\"rgba(201,169,110,.25)\" stroke=\"rgba(201,169,110,.4)\" stroke-width=\"1.5\"/>\n    <path d=\"M55 38 Q45 50 42 80 L42 210 Q42 230 60 235 L140 235 Q158 230 158 210 L158 80 Q155 50 145 38 Z\" fill=\"rgba(255,255,255,.06)\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"2\"/>\n    <path d=\"M60 50 Q58 80 58 120\" stroke=\"rgba(255,255,255,.15)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <g id=\"shake-papers\">\n      <rect x=\"68\" y=\"170\" width=\"35\" height=\"48\" rx=\"3\" fill=\"rgba(232,196,176,.7)\"/>\n      <rect x=\"85\" y=\"165\" width=\"38\" height=\"52\" rx=\"3\" fill=\"rgba(245,237,224,.8)\"/>\n      <rect x=\"100\" y=\"168\" width=\"33\" height=\"50\" rx=\"3\" fill=\"rgba(201,169,110,.6)\"/>\n      <rect x=\"72\" y=\"155\" width=\"30\" height=\"45\" rx=\"3\" fill=\"rgba(255,255,255,.5)\"/>\n      <rect x=\"90\" y=\"152\" width=\"35\" height=\"48\" rx=\"3\" fill=\"rgba(193,122,111,.4)\"/>\n    <\/g>\n    <path d=\"M58 50 Q55 100 55 150\" stroke=\"rgba(255,255,255,.08)\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n  <\/svg>\n  <p class=\"sh-ins\" id=\"sh-ins\">Kocok toplesnya! 🫙<\/p>\n  <p class=\"sh-sub\" id=\"sh-sub\">Tap berkali-kali sampai keluar pertanyaannya<\/p>\n  <div class=\"sh-dots\" id=\"sh-dots\"><\/div>\n<\/div>\n\n<\!-- PAPER -->\n<div id=\"s-paper\" class=\"screen\">\n  <div class=\"paper-wrap\">\n    <div class=\"paper-card\" id=\"paper-card\">\n      <div class=\"paper-tape\" id=\"paper-tape\"><\/div>\n      <div class=\"paper-cat-badge\" id=\"paper-cat-badge\">💎 Value<\/div>\n      <span class=\"paper-q-num\" id=\"paper-q-num\">Pertanyaan #1<\/span>\n      <p class=\"paper-question\" id=\"paper-question\">...<\/p>\n      <div class=\"paper-lines\"><\/div>\n    <\/div>\n    <div class=\"who-answers\">\n      <div class=\"wa-item razan-side\" id=\"wa-razan\"><span class=\"wa-avatar\">🧑<\/span><span class=\"wa-name\">Razan<\/span><span class=\"wa-status\" id=\"wa-r-status\"><\/span><\/div>\n      <div class=\"wa-item dara-side\" id=\"wa-dara\"><span class=\"wa-avatar\">👧<\/span><span class=\"wa-name\">Dara<\/span><span class=\"wa-status\" id=\"wa-d-status\"><\/span><\/div>\n    <\/div>\n    <div class=\"paper-timer\"><div class=\"pt-bar\"><div class=\"pt-fill\" id=\"pt-fill\" style=\"width:100%\"><\/div><\/div><span class=\"pt-label\" id=\"pt-label\">2:00<\/span><\/div>\n    <div class=\"paper-btns\">\n      <button class=\"paper-btn paper-btn-p\" id=\"paper-next-btn\" onclick=\"nextAnswer()\">Selesai Jawab ✓<\/button>\n      <button class=\"paper-btn paper-btn-o\" onclick=\"skipAnswer()\">Lewati<\/button>\n    <\/div>\n    <button class=\"swap-btn\" id=\"swap-btn\" onclick=\"swapQuestion()\">🔄 Ganti pertanyaan (1x per sesi)<\/button>\n  <\/div>\n<\/div>\n\n<\!-- FINAL -->\n<div id=\"s-final\" class=\"screen\">\n  <div class=\"final-wrap\">\n    <span class=\"final-icon\">🫙<\/span>\n    <h2 class=\"final-title\">Toples Selesai!<\/h2>\n    <p class=\"final-sub\">Sekian pertanyaan dijawab — kalian makin saling kenal.<\/p>\n    <div class=\"final-score\">\n      <div><span class=\"fs-av\">🧑<\/span><span class=\"fs-nm\">Razan<\/span><span class=\"fs-sc razan\" id=\"end-r\">0<\/span><span class=\"fs-lb\">jawaban<\/span><\/div>\n      <span class=\"fs-vs\">🫙<\/span>\n      <div><span class=\"fs-av\">👧<\/span><span class=\"fs-nm\">Dara<\/span><span class=\"fs-sc dara\" id=\"end-d\">0<\/span><span class=\"fs-lb\">jawaban<\/span><\/div>\n    <\/div>\n    <div class=\"recap\"><span class=\"recap-title\">Kategori yang dijelajahi<\/span><div id=\"cat-recap-list\" style=\"display:flex;flex-direction:column;gap:.4rem\"><\/div><\/div>\n    <div class=\"recap\" id=\"q-recap-wrap\"><span class=\"recap-title\">Pertanyaan yang dibahas<\/span><div id=\"q-recap\" style=\"display:flex;flex-direction:column;gap:.4rem\"><\/div><\/div>\n    <div class=\"final-msg\" id=\"final-msg\">...<\/div>\n    <div class=\"final-btns\">\n      <button class=\"final-btn final-btn-p\" onclick=\"showScreen('s-pick')\">Main Lagi 🔄<\/button>\n      <button class=\"final-btn final-btn-o\" onclick=\"toIntro()\">Menu<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<\script>\n// ── QUESTIONS (isi tetap) ──\nconst CATEGORIES = [\n  {id:'all',label:'🫙 Semua',color:'var(--gold)',bg:'rgba(201,169,110,.12)'},\n  {id:'value',label:'💎 Value',color:'#ffd54f',bg:'rgba(255,213,79,.1)',tape:'rgba(255,213,79,.3)'},\n  {id:'mimpi',label:'🌙 Mimpi',color:'#7eb3f5',bg:'rgba(126,179,245,.1)',tape:'rgba(126,179,245,.25)'},\n  {id:'takut',label:'😰 Ketakutan',color:'#e57373',bg:'rgba(229,115,115,.1)',tape:'rgba(229,115,115,.25)'},\n  {id:'masalalu',label:'📖 Masa Lalu',color:'#c9a96e',bg:'rgba(201,169,110,.1)',tape:'rgba(201,169,110,.3)'},\n  {id:'hubungan',label:'💕 Hubungan',color:'#f48fb1',bg:'rgba(244,143,177,.1)',tape:'rgba(244,143,177,.25)'},\n  {id:'absurd',label:'🎭 Absurd',color:'#81c784',bg:'rgba(129,199,132,.1)',tape:'rgba(129,199,132,.25)'},\n];\nconst QUESTIONS = [\n  // VALUE\n  {cat:'value',q:'Apa satu nilai dalam hidup yang tidak bisa kamu kompromikan dengan siapapun?'},\n  {cat:'value',q:'Kalau harus memilih antara kaya tapi kesepian atau sederhana tapi penuh cinta — kamu pilih apa dan kenapa?'},\n  {cat:'value',q:'Prinsip hidup apa yang kamu pegang dari orang tuamu yang sampai sekarang masih relevan?'},\n  {cat:'value',q:'Apa yang menurutmu lebih penting — jujur atau baik? Kalau harus pilih salah satu.'},\n  {cat:'value',q:'Kalau hidupmu dikenang karena satu hal, kamu mau dikenang sebagai apa?'},\n  {cat:'value',q:'Apa definisi \"sukses\" buatmu — bukan karier, bukan materi, tapi sesuatu yang lebih dalam?'},\n  {cat:'value',q:'Ada ga hal yang orang lain anggap penting banget, tapi menurutmu tidak begitu?'},\n  // MIMPI\n  {cat:'mimpi',q:'Kalau tidak ada hambatan apapun — uang, waktu, kemampuan — kamu mau jadi apa atau ngelakuin apa?'},\n  {cat:'mimpi',q:'Apa satu tempat di dunia yang pengen banget kamu kunjungi dan kenapa tempat itu?'},\n  {cat:'mimpi',q:'Versi terbaik dirimu di masa depan — dia hidup seperti apa?'},\n  {cat:'mimpi',q:'Ada mimpi yang pernah kamu buang karena takut atau ga percaya diri? Ceritain.'},\n  {cat:'mimpi',q:'Kalau bisa hidup di era berbeda — kapan dan di mana kamu mau hidup?'},\n  {cat:'mimpi',q:'Apa satu skill atau kemampuan yang paling ingin kamu kuasai dalam hidup?'},\n  {cat:'mimpi',q:'Lima tahun dari sekarang — kamu bayangin hidupmu seperti apa?'},\n  // KETAKUTAN\n  {cat:'takut',q:'Apa ketakutan terbesar dalam hidupmu yang jarang kamu akui ke orang lain?'},\n  {cat:'takut',q:'Apa yang paling kamu takutin kehilangan — orang, hal, atau kondisi?'},\n  {cat:'takut',q:'Apakah ada keputusan dalam hidup yang kamu hindari karena takut salah? Ceritain.'},\n  {cat:'takut',q:'Apa yang bikin kamu tidak bisa tidur malam kalau lagi overthinking?'},\n  {cat:'takut',q:'Sesuatu tentang masa depan yang paling bikin kamu cemas — apa itu?'},\n  {cat:'takut',q:'Pernah ga kamu ngelakuin sesuatu meskipun sangat takut? Cerita momennya.'},\n  {cat:'takut',q:'Ketakutan apa dari masa kecil yang masih muncul sampai sekarang?'},\n  // MASA LALU\n  {cat:'masalalu',q:'Satu keputusan di masa lalu yang paling kamu syukuri — meskipun waktu itu terasa berat.'},\n  {cat:'masalalu',q:'Apa momen dalam hidupmu yang paling membentuk siapa kamu sekarang?'},\n  {cat:'masalalu',q:'Ada ga hal yang pernah kamu lakuin yang sampai sekarang masih bikin kamu menyesal?'},\n  {cat:'masalalu',q:'Cerita tentang versi kamu 5 tahun yang lalu — dia seperti apa?'},\n  {cat:'masalalu',q:'Siapa orang yang paling berpengaruh dalam membentuk karaktermu — dan bagaimana caranya?'},\n  {cat:'masalalu',q:'Apa pelajaran paling berharga yang pernah kamu dapat dari sebuah kegagalan?'},\n  {cat:'masalalu',q:'Kalau bisa kirim pesan ke dirimu sendiri 10 tahun lalu — kamu mau bilang apa?'},\n  // HUBUNGAN\n  {cat:'hubungan',q:'Apa yang paling kamu hargai dalam sebuah hubungan — lebih dari apapun?'},\n  {cat:'hubungan',q:'Gimana cara kamu tahu seseorang bisa dipercaya sepenuhnya?'},\n  {cat:'hubungan',q:'Apa hal kecil yang dilakukan orang lain yang paling bikin kamu merasa dicintai?'},\n  {cat:'hubungan',q:'Apa yang biasanya kamu lakukan ketika sedang marah atau kecewa pada seseorang?'},\n  {cat:'hubungan',q:'Sebutkan satu hal tentang aku yang bikin kamu merasa aman dan nyaman.'},\n  {cat:'hubungan',q:'Apa yang paling kamu harapkan dari hubungan kita 5 tahun ke depan?'},\n  {cat:'hubungan',q:'Kalau ada satu hal yang pengen kamu ubah dari cara kamu berhubungan dengan orang lain, apa itu?'},\n  // ABSURD & SERU\n  {cat:'absurd',q:'Kalau kamu harus pilih satu superpower untuk dipakai seumur hidup — apa dan kenapa?'},\n  {cat:'absurd',q:'Kamu dikasih Rp 10 miliar tapi harus dihabiskan dalam 24 jam — kamu lakuin apa?'},\n  {cat:'absurd',q:'Kalau hidupmu dijadikan film, genre apa dan siapa yang main jadi kamu?'},\n  {cat:'absurd',q:'Satu makanan yang kalau hilang dari dunia bakal bikin kamu sangat sedih?'},\n  {cat:'absurd',q:'Kalau harus tinggal di satu kota seumur hidup, di mana dan kenapa?'},\n  {cat:'absurd',q:'Kamu dikasih mesin waktu sekali pakai — kamu mau ke masa depan atau masa lalu, ke kapan?'},\n  {cat:'absurd',q:'Kalau bisa swap hidup sama satu orang (siapapun, hidup atau sudah meninggal) — siapa dan kenapa?'},\n];\nconst ANSWER_TIME = 2 * 60;\nconst NAME = { razan: 'Razan', dara: 'Dara' }, AV = { razan: '🧑', dara: '👧' };\nconst other = p => p === 'razan' ? 'dara' : 'razan';\n\n// pertanyaan yang pernah keluar di sesi-sesi sebelumnya (biar yang baru keluar duluan)\nconst SEEN_KEY = 'jar-seen';\nlet seen = []; try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch {}\nconst markSeen = q => { if (!seen.includes(q)) { seen.push(q); try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch {} } };\n\n// ── STATE ──\nconst $ = id => document.getElementById(id);\nlet G = null, timer = null, shake = null;\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }\nfunction toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }\nfunction beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 700; g.gain.value = .12; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .35); } catch {} }\n\n(function () {\n  const s = $('stars');\n  for (let i = 0; i < 60; i++) { const el = document.createElement('div'); el.className = 'star'; const z = 1 + Math.random() * 2; el.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-duration:${2 + Math.random() * 5}s;animation-delay:-${Math.random() * 5}s`; s.appendChild(el); }\n})();\nfunction showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); $(id).scrollTop = 0; }\nfunction renderIntro() { const fresh = QUESTIONS.filter(q => !seen.includes(q.q)).length; $('fresh-note').textContent = seen.length ? (fresh ? `✨ ${fresh} pertanyaan belum pernah keluar — itu yang keluar duluan` : '✅ Semua pertanyaan udah pernah keluar — sekarang diacak ulang') : `${QUESTIONS.length} pertanyaan di dalam toples`; }\nfunction toIntro() { stopTimer(); renderIntro(); showScreen('s-intro'); }\n\nfunction initGame(first) {\n  G = { first, turnFirst: first, alt: $('alt').checked, step: 0, cur: null, n: 0, scores: { razan: 0, dara: 0 }, used: [], cat: 'all', catCounts: {}, answered: [], swapLeft: 1 };\n  setupCatFilter(); updateJar(); showScreen('s-jar');\n}\nfunction setupCatFilter() {\n  const bar = $('cat-filter'); bar.innerHTML = '';\n  CATEGORIES.forEach(cat => {\n    const b = document.createElement('button'); b.className = 'cf-btn' + (cat.id === 'all' ? ' active' : ''); b.dataset.id = cat.id; b.textContent = cat.label;\n    b.onclick = () => { G.cat = cat.id; bar.querySelectorAll('.cf-btn').forEach(x => x.classList.toggle('active', x === b)); updateJar(); };\n    bar.appendChild(b);\n  });\n}\nconst avail = cat => (cat === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.cat === cat)).filter(q => !G.used.includes(q.q));\nfunction updateJar() {\n  const a = avail(G.cat).length, all = avail('all').length;\n  $('jar-remaining').textContent = `${a} pertanyaan tersisa${G.cat !== 'all' ? ' di kategori ini' : ''}`;\n  $('jh-count').textContent = `${all} tersisa`;\n  // [FIX] kategori habis dulu langsung dianggap game selesai, padahal kategori lain masih ada\n  $('jar-tap-hint').textContent = all === 0 ? 'Toples udah kosong! 🫙 Tap buat lihat rekap' : a === 0 ? 'Kategori ini habis — pilih kategori lain ☝️' : '✨ Tap toples untuk ambil pertanyaan';\n  document.querySelectorAll('.cf-btn').forEach(b => b.classList.toggle('empty', b.dataset.id !== 'all' && avail(b.dataset.id).length === 0));\n  const el = $('jh-turn'); el.textContent = `${AV[G.turnFirst]} ${NAME[G.turnFirst]} jawab duluan`; el.className = 'jh-turn ' + G.turnFirst;\n  $('score-r').textContent = G.scores.razan; $('score-d').textContent = G.scores.dara;\n  $('done-btn').classList.toggle('show', G.n > 0);   // [BARU] dulu nggak ada cara udahan selain ngabisin toples\n}\nfunction pickFrom(pool) {\n  const fresh = pool.filter(q => !seen.includes(q.q)), src = fresh.length ? fresh : pool;\n  return src[Math.floor(Math.random() * src.length)];\n}\n\n// ── AMBIL PERTANYAAN ──\nfunction drawQuestion() {\n  if (shake) return;\n  const all = avail('all').length, pool = avail(G.cat);\n  if (all === 0) return showFinal();\n  if (!pool.length) { toast('Kategori ini udah habis — pilih kategori lain ☝️'); vib(40); return; }\n  const need = 5 + Math.floor(Math.random() * 3);\n  shake = { count: 0, need, done: false };\n  $('sh-dots').innerHTML = '<i><\/i>'.repeat(need); $('sh-ins').textContent = 'Kocok toplesnya! 🫙'; $('sh-sub').textContent = 'Tap berkali-kali sampai keluar pertanyaannya';\n  $('shake-overlay').classList.add('show');\n}\nconst SHAKE_MESSAGES = ['Kocok lebih keras! 💪', 'Yaa kocok! 🫙', 'Hampir... terus!', 'Makin seru!', 'Satu lagi!', 'Siap keluar nih...', 'KOCOK! 🎉'];\nfunction doShake() {\n  if (!shake || shake.done) return;   // [FIX] dulu tap kelebihan setelah keluar bisa ngambil pertanyaan dobel\n  const c = ++shake.count, svg = $('shake-jar-svg');\n  svg.style.transform = `rotate(${c % 2 ? -16 : 14}deg) scale(1.05)`; setTimeout(() => svg.style.transform = 'rotate(0) scale(1)', 110);\n  vib([30, 20, 30]);\n  [...$('sh-dots').children].forEach((d, i) => d.classList.toggle('on', i < c));\n  document.querySelectorAll('#shake-papers rect').forEach(p => p.style.transform = `rotate(${-12 + Math.random() * 24}deg) translateY(${-6 + Math.random() * 12}px)`);\n  $('sh-ins').textContent = SHAKE_MESSAGES[Math.min(c - 1, SHAKE_MESSAGES.length - 1)];\n  if (c >= shake.need) {\n    shake.done = true; $('sh-ins').textContent = '✨ Keluar!'; $('sh-sub').textContent = ''; vib([50, 30, 100, 30, 150]);\n    setTimeout(() => { $('shake-overlay').classList.remove('show'); document.querySelectorAll('#shake-papers rect').forEach(p => p.style.transform = ''); shake = null; reveal(pickFrom(avail(G.cat))); }, 550);\n  }\n}\nfunction reveal(q) {\n  G.cur = q; G.used.push(q.q); G.n++; G.catCounts[q.cat] = (G.catCounts[q.cat] || 0) + 1; G.step = 0; G.answeredBy = [];\n  markSeen(q.q); renderPaper(); showScreen('s-paper'); startTimer();\n}\nfunction renderPaper() {\n  const q = G.cur, cat = CATEGORIES.find(c => c.id === q.cat) || CATEGORIES[1];\n  $('paper-tape').style.background = cat.tape || 'rgba(201,169,110,.3)';\n  const b = $('paper-cat-badge'); b.textContent = cat.label; b.style.background = cat.bg; b.style.color = cat.color; b.style.border = `1px solid ${cat.color}40`;\n  $('paper-q-num').textContent = `Pertanyaan #${G.n}`; $('paper-question').textContent = q.q;\n  const card = $('paper-card'); card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';\n  updateAnswerUI();\n  $('swap-btn').disabled = G.swapLeft <= 0 || G.step > 0;\n  $('swap-btn').textContent = G.swapLeft > 0 ? '🔄 Ganti pertanyaan (1x per sesi)' : '🔄 Jatah ganti udah dipakai';\n}\nfunction current() { return G.step === 0 ? G.turnFirst : other(G.turnFirst); }\nfunction updateAnswerUI() {\n  const cur = current();\n  ['razan', 'dara'].forEach(p => {\n    $(p === 'razan' ? 'wa-razan' : 'wa-dara').classList.toggle('active', p === cur);\n    $(p === 'razan' ? 'wa-r-status' : 'wa-d-status').textContent = p === cur ? 'Jawab sekarang 🎤' : G.answeredBy.includes(p) ? '✓ Sudah jawab' : G.step === 1 ? '—' : 'Menunggu giliran...';\n  });\n  $('paper-next-btn').textContent = G.step === 1 ? 'Selesai Jawab — Ambil Lagi! →' : 'Selesai Jawab ✓';\n}\n\n// ── TIMER (getar & bunyi pas habis) ──\nfunction startTimer() {\n  stopTimer(); timer = { left: ANSWER_TIME, last: performance.now() }; draw();\n  timer.iv = setInterval(() => {\n    const now = performance.now(); timer.left = Math.max(0, timer.left - (now - timer.last) / 1000); timer.last = now; draw();\n    if (timer.left <= 0) { clearInterval(timer.iv); vib([150, 80, 150]); beep(); }\n  }, 250);\n}\nfunction stopTimer() { if (timer && timer.iv) clearInterval(timer.iv); }\nfunction draw() {\n  const t = Math.ceil(timer.left), pct = timer.left / ANSWER_TIME * 100;\n  $('pt-label').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;\n  $('pt-fill').style.width = pct + '%'; $('pt-fill').style.background = pct < 20 ? '#e57373' : pct < 50 ? '#ffb300' : 'var(--gold)';\n}\n\nfunction advance(answered) {\n  const who = current();\n  if (answered) { G.scores[who]++; G.answeredBy.push(who); }\n  G.step++;\n  if (G.step >= 2) {\n    stopTimer();\n    if (G.answeredBy.length) G.answered.push(G.cur.q);\n    if (G.alt) G.turnFirst = other(G.turnFirst);   // [BARU] yang jawab duluan gantian tiap pertanyaan\n    updateJar(); showScreen('s-jar');\n    if (!avail('all').length) setTimeout(showFinal, 400);\n    return;\n  }\n  updateAnswerUI(); $('swap-btn').disabled = true; startTimer();\n}\nfunction nextAnswer() { vib(20); advance(true); }\nfunction skipAnswer() { advance(false); }\nfunction swapQuestion() {\n  if (G.swapLeft <= 0 || G.step > 0) return;\n  const pool = avail(G.cat).length ? avail(G.cat) : avail('all');\n  if (!pool.length) return toast('Nggak ada pertanyaan lain di toples');\n  G.swapLeft--; G.used = G.used.filter(x => x !== G.cur.q); G.n--; G.catCounts[G.cur.cat]--;\n  reveal(pickFrom(pool.filter(q => q.q !== G.cur.q).length ? pool.filter(q => q.q !== G.cur.q) : pool)); toast('🔄 Pertanyaan diganti');\n}\nfunction exitGame() {\n  if (G && G.n > 0) { if (!confirm('Udahan main? Kamu bisa lihat rekapnya dulu.')) return; return showFinal(); }\n  toIntro();\n}\n\n// ── AKHIR ──\nfunction showFinal() {\n  stopTimer();\n  $('end-r').textContent = G.scores.razan; $('end-d').textContent = G.scores.dara;\n  $('cat-recap-list').innerHTML = Object.entries(G.catCounts).filter(([, c]) => c > 0).sort((a, b) => b[1] - a[1]).map(([id, c]) => { const cat = CATEGORIES.find(x => x.id === id); return cat ? `<div class=\"cr-item\"><span>${cat.label}<\/span><span style=\"margin-left:auto;font-weight:700;color:var(--gold)\">${c}x<\/span><\/div>` : ''; }).join('') || '<div class=\"cr-item\">Belum ada<\/div>';\n  $('q-recap').innerHTML = G.answered.map((q, i) => `<div class=\"q-item\">${i + 1}. ${q}<\/div>`).join('');\n  $('q-recap-wrap').style.display = G.answered.length ? '' : 'none';\n  const total = G.answered.length;\n  $('final-msg').innerHTML = total >= 10 ? `<strong>${total} pertanyaan<\/strong> dijawab bersama — itu bukan percakapan biasa. Kalian baru saja saling membuka diri dengan cara yang jarang dilakukan orang. 🤍`\n    : total >= 5 ? `<strong>${total} pertanyaan<\/strong> sudah dijelajahi — setiap jawaban adalah kepercayaan yang kamu berikan. 🤍`\n    : `Baru mulai, tapi sudah mulai — itu yang terpenting. Toples masih penuh, kapanpun mau lanjut! 🫙`;\n  showScreen('s-final'); if (total) confetti(70);\n}\nfunction confetti(n) {\n  const colors = ['#c9a96e', '#c17a6f', '#b5c4b1', '#7eb3f5', '#fff'];\n  for (let i = 0; i < n; i++) setTimeout(() => {\n    const el = document.createElement('div'); el.className = 'cp';\n    el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[Math.floor(Math.random() * colors.length)]};animation-duration:${1.5 + Math.random() * 3}s;animation-delay:${Math.random() * .8}s;width:${5 + Math.random() * 8}px;height:${5 + Math.random() * 8}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;\n    document.body.appendChild(el); setTimeout(() => el.remove(), 6000);\n  }, i * 25);\n}\nrenderIntro();\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.
