<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tenangin Diri — Razan & Dara 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--rose:#c17a6f;--deep:#7a3f35;--muted:#9a8070;--blush:#e8c4b0}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--cream);font-family:'Poppins',sans-serif;color:#2d1f1a;overflow:hidden}
  .hub{display:flex;flex-direction:column;height:100vh;height:100dvh}
  /*hub-ringkas*/
  .bar{padding:calc(.45rem + env(safe-area-inset-top)) .6rem .45rem;background:var(--cream);border-bottom:1px solid rgba(193,122,111,.15);box-shadow:0 4px 14px rgba(193,122,111,.06);position:relative;z-index:2;display:flex;align-items:center;gap:.45rem;flex:0 0 auto}
  .back{flex:0 0 auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--deep);text-decoration:none;background:#fff;border:1px solid rgba(193,122,111,.18);border-radius:50%}
  .tabs{flex:1;min-width:0;display:flex;gap:2px;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:50px;padding:3px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;border:none;background:none;border-radius:50px;padding:.5rem .7rem;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--rose);color:#fff;font-weight:600}
  .frame{flex:1;position:relative}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
  .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;animation:p 1s ease-in-out infinite}
  @keyframes p{50%{opacity:.4;transform:scale(.9)}}
</style>
</head>
<body>
<div class="hub">
  <div class="bar">
    <a href="index.html" class="back" aria-label="Menu utama" title="Menu utama">←</a>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="frame" id="frame"><div class="load" id="load">🌙</div></div>
</div>

ight:700;margin:.15rem 0 .25rem;line-height:1.15}\n  .title span{color:var(--rose)}\n  .sub{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:330px;margin:0 auto}\n  .card{background:#fff;border:1px solid rgba(193,122,111,.13);border-radius:20px;padding:1rem;margin-bottom:.8rem;box-shadow:0 4px 18px rgba(193,122,111,.06)}\n  .card h3{font-size:13px;font-weight:600;margin-bottom:.5rem}\n  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center;margin:1.4rem 0 .6rem}\n  .inp,.ta{width:100%;font-size:14px;padding:.7rem .85rem;border-radius:14px;border:1.5px solid var(--blush);background:var(--cream);outline:none;color:var(--ink);resize:none}\n  .inp:focus,.ta:focus{border-color:var(--rose);background:#fff}\n  .lab{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin:.7rem 0 .35rem}\n  .chips{display:flex;gap:.35rem;flex-wrap:wrap}\n  .chips button{font-size:12px;padding:.42rem .78rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap}\n  .chips button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:500}\n  .btn{display:block;width:100%;padding:.9rem .5rem;border-radius:50px;border:none;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#d48c80,#a8584c);cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(168,88,76,.22);white-space:nowrap}\n  .btn:active{transform:scale(.98)}\n  .btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--blush);box-shadow:none}\n  .btn.wa{background:#25a35a;box-shadow:0 6px 18px rgba(37,163,90,.25)}\n  .btn:disabled{opacity:.45}\n  .row{display:flex;gap:.5rem;margin-top:.7rem}.row>*{flex:1;min-width:0}\n  .ov{position:fixed;inset:0;z-index:40;background:rgba(45,31,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}\n  .ov.show{display:flex}\n  .ov.center{align-items:center;padding:1.2rem}\n  .sheet{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:1rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:gUp .3s ease}\n  .ov.center .sheet{border-radius:24px;max-width:360px;animation:gPop .4s cubic-bezier(.3,1.5,.5,1);text-align:center}\n  @keyframes gUp{from{transform:translateY(100%)}to{transform:none}}\n  @keyframes gPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}\n  .drag{width:38px;height:4px;border-radius:2px;background:var(--blush);margin:0 auto .9rem}\n  .empty{text-align:center;font-size:12.5px;color:var(--muted);padding:1rem;line-height:1.7}\n  .toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d1f1a;color:#fff;font-size:12.5px;padding:.65rem 1.1rem;border-radius:50px;z-index:60;max-width:calc(100% - 2rem);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}\n  .toast a{color:#ffd9c9}\n  .cp{position:fixed;border-radius:2px;animation:gCf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes gCf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n  @media (max-width:350px){.wrap{padding-left:.75rem;padding-right:.75rem}.btn{font-size:13px}}\n\n  html,body{background:#12142a}\n  body{color:#e7e6f7}\n  body::before{background:radial-gradient(ellipse 70% 45% at 50% 20%,rgba(120,110,200,.25),transparent 70%)}\n  .pill{color:#cfcde8;background:rgba(255,255,255,.08);border-color:rgba(210,205,255,.2)}\n  .title span{color:#f3e2b5}\n  .sub{color:#a9a6cb}\n  .moon{width:120px;height:120px;margin:.6rem auto 1rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#efdca8 60%,#d9be7a);box-shadow:0 0 60px rgba(255,236,180,.35);position:relative;animation:breath 6s ease-in-out infinite}\n  .moon.on{box-shadow:0 0 90px rgba(255,236,180,.55)}\n  @keyframes breath{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}\n  .moon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 30%,rgba(0,0,0,.06) 0 10%,transparent 11%),radial-gradient(circle at 40% 70%,rgba(0,0,0,.05) 0 7%,transparent 8%)}\n  .snd{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}\n  .snd button{padding:.8rem .2rem .7rem;border-radius:16px;border:1.5px solid rgba(210,205,255,.2);background:rgba(255,255,255,.05);color:#d8d6f0;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:.2rem}\n  .snd button span{font-size:1.5rem}\n  .snd button.on{background:rgba(243,226,181,.16);border-color:#f3e2b5;color:#fff;font-weight:600}\n  .card{background:rgba(255,255,255,.05);border-color:rgba(210,205,255,.16);box-shadow:none}\n  .lab{color:#e3dcff}\n  .chips button{background:transparent;border-color:rgba(210,205,255,.25);color:#cfcde8}\n  .chips button.on{background:#f3e2b5;border-color:#f3e2b5;color:#20223f}\n  input[type=range]{width:100%;accent-color:#f3e2b5}\n  .play{width:76px;height:76px;margin:1rem auto .4rem;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:linear-gradient(135deg,#f3e2b5,#d6b77c);color:#20223f;font-size:1.8rem;cursor:pointer;box-shadow:0 8px 24px rgba(214,183,124,.35)}\n  .left{text-align:center;font-size:12.5px;color:#cfcde8;min-height:1.4em}\n  .note{font-family:'Caveat',cursive;font-size:1.5rem;line-height:1.3;color:#f3e2b5;text-align:center;margin:1rem 0 .4rem;min-height:2.6em;transition:opacity .8s}\n  .btn{background:linear-gradient(135deg,#f3e2b5,#d6b77c);color:#20223f;box-shadow:none}\n  .btn.ghost{background:transparent;color:#f3e2b5;border-color:rgba(243,226,181,.35)}\n  .dim{position:fixed;inset:0;z-index:50;background:#05060f;display:none;flex-direction:column;align-items:center;justify-content:center;color:#6d6a92;font-size:12px;text-align:center;padding:2rem}\n  .dim.show{display:flex}\n  .dim .m{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b6650,#3d3a2e);margin-bottom:1rem;animation:breath 6s ease-in-out infinite}\n\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <div class=\"top\"><a href=\"index.html\" class=\"pill\">← Menu utama<\/a><button class=\"pill\" onclick=\"dim()\">🌑 Gelapin layar<\/button><\/div>\n  <div class=\"head\" style=\"margin-bottom:.2rem\"><p class=\"lbl\">Pengantar Tidur<\/p><h1 class=\"title\">Bobo <span>yang nyenyak<\/span> 🌙<\/h1><p class=\"sub\">Pilih suara, atur timer, terus taruh HP-nya. Suaranya pelan-pelan ilang sendiri.<\/p><\/div>\n  <div class=\"moon\" id=\"moon\"><\/div>\n  <div class=\"snd\" id=\"snd\"><\/div>\n  <button class=\"play\" id=\"play\" onclick=\"toggle()\" aria-label=\"Putar\">▶<\/button>\n  <p class=\"left\" id=\"left\"><\/p>\n  <p class=\"note\" id=\"note\"><\/p>\n  <div class=\"card\">\n    <label class=\"lab\">⏲️ Matiin otomatis<\/label><div class=\"chips\" id=\"timer\"><\/div>\n    <label class=\"lab\" for=\"vol\">🔉 Volume<\/label><input type=\"range\" id=\"vol\" min=\"0\" max=\"1\" step=\".01\">\n  <\/div>\n  <a class=\"btn ghost\" id=\"wa\" target=\"_blank\" rel=\"noopener\">💬 Bilang “aku tidur dulu ya” ke Razan<\/a>\n<\/div>\n<div class=\"dim\" id=\"dim\" onclick=\"this.classList.remove('show')\"><div class=\"m\"><\/div>Tap di mana aja buat balik<br><span id=\"dim-left\"><\/span><\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n<\script>\nconst WA = { Razan: '6285692740607', Dara: '6287703706518' };\nconst JADIAN = '2025-05-10';\nconst $ = id => document.getElementById(id);\nfunction lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nfunction vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }\nconst pad = n => String(n).padStart(2, '0');\nconst ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nfunction parseYMD(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }\nconst today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\nconst BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];\nconst fmtD = d => `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;\nconst otherOf = w => w === 'Razan' ? 'Dara' : 'Razan';\nconst waLink = (to, text) => `https://wa.me/${WA[to] || ''}?text=${encodeURIComponent(text)}`;\nlet __toastT;\nfunction toast(m, ms = 2600) { const t = $('toast'); if (!t) return; t.innerHTML = m; t.style.opacity = '1'; clearTimeout(__toastT); __toastT = setTimeout(() => t.style.opacity = '0', ms); }\nfunction confetti(n = 60, colors = ['#c17a6f', '#f0a39a', '#c9a96e', '#b5c4b1', '#7eb3f5', '#fff']) {\n  for (let i = 0; i < n; i++) setTimeout(() => { const el = document.createElement('div'); el.className = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);\n}\nasync function shareCanvas(cv, name, title) {\n  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));\n  if (!blob) return;\n  const file = new File([blob], name, { type: 'image/png' });\n  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  toast('⬇️ Gambar disimpan');\n}\nfunction wrapText(ctx, text, maxW) { const out = []; String(text).split('\\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }\nasync function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }\n// siapa yang lagi pakai HP ini (Razan / Dara)\nfunction whoBtn(key, onChange) {\n  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');\n  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };\n  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };\n  paint(); return lsGet(key, 'Dara');\n}\n\nconst SOUNDS = { hujan: ['🌧️', 'Hujan'], ombak: ['🌊', 'Ombak'], kipas: ['🌀', 'Kipas'], api: ['🔥', 'Api unggun'], jangkrik: ['🦗', 'Malam desa'], hati: ['💓', 'Detak jantung'] };\nconst TIMERS = [[15, '15 mnt'], [30, '30 mnt'], [60, '1 jam'], [0, 'Terus']];\nconst NOTES = ['Tidur yang nyenyak ya, sayang. Besok aku masih sayang kamu, kayak hari ini.', 'Lepasin capeknya hari ini. Kamu udah hebat banget.', 'Kalau mimpiin aku, tolong mimpin i] = w * .5; } }\n  return b;\n}\nfunction src(buf) { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); nodes.push(s); return s; }\nfunction filt(type, f, q = .7) { const x = ac.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }\nfunction gain(v) { const g = ac.createGain(); g.gain.value = v; return g; }\nfunction lfo(target, rate, depth, base) { const o = ac.createOscillator(), g = gain(depth); o.frequency.value = rate; o.connect(g); g.connect(target); target.value = base; o.start(); nodes.push(o); }\nlet timers = [];\nfunction startNodes() {\n  const s = st.s;\n  if (s === 'hujan') { const n = src(noiseBuf('pink')); const f = filt('lowpass', 2600); const g = gain(.9); n.connect(f); f.connect(g); g.connect(master); const h = src(noiseBuf('white', 2)); const hf = filt('highpass', 5000); const hg = gain(.06); h.connect(hf); hf.connect(hg); hg.connect(master); }\n  if (s === 'ombak') { const n = src(noiseBuf('pink')); const f = filt('lowpass', 900); const g = gain(.5); n.connect(f); f.connect(g); g.connect(master); lfo(g.gain, .09, .45, .55); lfo(f.frequency, .09, 500, 900); }\n  if (s === 'kipas') { const n = src(noiseBuf('brown')); const f = filt('lowpass', 500); const g = gain(.9); n.connect(f); f.connect(g); g.connect(master); const o = ac.createOscillator(); o.frequency.value = 58; const og = gain(.02); o.connect(og); og.connect(master); o.start(); nodes.push(o); }\n  if (s === 'api') { const n = src(noiseBuf('brown')); const f = filt('lowpass', 700); const g = gain(.7); n.connect(f); f.connect(g); g.connect(master); const crack = () => { if (!playing || st.s !== 'api') return; const b = ac.createBuffer(1, ac.sampleRate * .03, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); const x = ac.createBufferSource(); x.buffer = b; const cg = gain(.15 + Math.random() * .35); const hp = filt('highpass', 1500); x.connect(h ssName = 'cp'; el.style.cssText = `left:${Math.random() * 100}vw;top:-10px;background:${colors[i % colors.length]};animation-duration:${1.6 + Math.random() * 2}s;width:${6 + Math.random() * 7}px;height:${6 + Math.random() * 7}px;border-radius:${Math.random() > .5 ? '50%' : '2px'}`; document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }, i * 18);\n}\nasync function shareCanvas(cv, name, title) {\n  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));\n  if (!blob) return;\n  const file = new File([blob], name, { type: 'image/png' });\n  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: title || name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  toast('⬇️ Gambar disimpan');\n}\nfunction wrapText(ctx, text, maxW) { const out = []; String(text).split('\\n').forEach(par => { const w = par.split(' '); let l = ''; for (const s of w) { const t = l ? l + ' ' + s : s; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = s; } else l = t; } out.push(l); }); return out; }\nasync function fontsReady() { try { await document.fonts.load('40px Caveat'); await document.fonts.load('600 26px Poppins'); } catch (e) {} }\n// siapa yang lagi pakai HP ini (Razan / Dara)\nfunction whoBtn(key, onChange) {\n  const b = $('who-btn'); if (!b) return lsGet(key, 'Dara');\n  const paint = () => { const w = lsGet(key, 'Dara'); b.textContent = `🙋 ${w} ▾`; b.className = 'pill ' + w; };\n  b.onclick = () => { lsSet(key, otherOf(lsGet(key, 'Dara'))); paint(); onChange && onChange(); };\n  paint(); return lsGet(key, 'Dara');\n}\n\n// [nama, [tarik, tahan, buang, tahan], keterangan]\nconst TECH = { tenang: ['Tenang', [4, 0, 6, 0], 'Tarik 4 · buang 6 — paling gampang buat nenangin diri'], kotak: ['Kotak', [4, 4, 4, 4], 'Tarik 4 · tahan 4 · buang 4 · tahan 4 — biar fokus lagi'], tidur: ['4-7-8', [4, 7, 8, 0], 'Tarik 4 · tahan 7 · buang 8 — enak sebelum tidur'] };\nconst DUR = [[1, '1 menit'], [3, '3 menit'], [5, '5 menit']];\nconst CALM = ['Kamu aman. Aku di sini.', 'Ga apa-apa ngerasa gini. Nanti juga lewat.', 'Pelan-pelan aja, ga ada yang buru-buru.', 'Kamu udah ngelakuin yang terbaik hari ini.', 'Bahunya diturunin… rahangnya dilemesin…', 'Satu napas lagi. Kamu hebat.', 'Apa pun yang lagi berat, kita hadapin bareng.', 'Rasain kakimu nempel di lantai. Kamu di sini, sekarang.'];\nlet st = Object.assign({ t: 'tenang', d: 3 }, lsGet('napas-set', {})), running = false, timer = 0, endAt = 0, cycles = 0, ci = 0;\nfunction paint() {\n  $('tech').innerHTML = Object.entries(TECH).map(([k, [n]]) => `<button data-k=\"${k}\" class=\"${k === st.t ? 'on' : ''}\">${n}<\/button>`).join('');\n  $('tech').querySelectorAll('button').forEach(b => b.onclick = () => { if (running) return; st.t = b.dataset.k; lsSet('napas-set', st); paint(); });\n  $('dur').innerHTML = DUR.map(([m, n]) => `<button data-m=\"${m}\" class=\"${m === st.d ? 'on' : ''}\">${n}<\/button>`).join('');\n  $('dur').querySelectorAll('button').forEach(b => b.onclick = () => { if (running) return; st.d = +b.dataset.m; lsSet('napas-set', st); paint(); });\n  $('desc').textContent = TECH[st.t][2];\n  const n = lsGet('napas-n', 0); $('cnt').textContent = n ? `🌿 ${n} sesi` : '🌿 sesi pertama';\n}\nconst ball = $('ball');\nfunction setBall(sizePct, secs) { ball.style.transitionDuration = secs + 's'; ball.style.width = sizePct + '%'; }\nfunction phase(i) {\n  if (!running) return;\n  const pat = TECH[st.t][1], labels = ['Tarik napas…', 'Tahan…', 'Buang pelan…', 'Tahan…'];\n  let k = i % 4; while (pat[k] === 0) k = (k + 1) % 4;\n  if (k === 0 && cycles > 0 && Date.now() >= endAt) return finish();\n  const secs = pat[k];\n  if (k === 0) { cycles++; if (cycles > 1 && cycles % 2 === 0) { const m = $('msg'); m.style.opacity = 0; setTimeout(() => { m.textContent = CALM[ci++ % CALM.length]; m.style.opacity = 1; }, 600); } }\n  setBall(k === 0 ? 95 : k === 2 ? 45 : (k === 1 ? 95 : 45), k === 1 || k === 3 ? .2 : secs);\n  vib(k === 0 ? 30 : k === 2 ? [15, 60, 15] : 8);\n  let left = secs; const lab = labels[k];\n  const tickF = () => { if (!running) return; $('ph').innerHTML = `${lab}<small>${left}<\/small>`; if (left-- <= 0) { phase(k + 1); return; } timer = setTimeout(tickF, 1000); };\n  tickF();\n}\nfunction toggle() {\n  if (running) { running = false; clearTimeout(timer); setBall(45, 1); $('ph').textContent = 'Siap?'; $('go').textContent = 'Mulai napas 🌿'; return; }\n  running = true; cycles = 0; endAt = Date.now() + st.d * 6e4; $('go').textContent = 'Udahan dulu'; ci = Math.floor(Math.random() * CALM.length);\n  $('msg').textContent = 'Duduk yang nyaman, terus ikutin bolanya ya 🤍'; phase(0);\n}\nfunction finish() {\n  running = false; clearTimeout(timer); setBall(60, 2); $('ph').innerHTML = 'Selesai 🌿';\n  $('msg').textContent = 'Gimana, udah lebih enakan? Aku bangga kamu mau nyempetin buat diri sendiri 🤍';\n  $('go').textContent = 'Napas lagi 🌿'; lsSet('napas-n', lsGet('napas-n', 0) + 1); paint(); vib([20, 40, 20]); confetti(25, ['#b5c4b1', '#8fb58a', '#fff', '#f5ede0']);\n}\ndocument.addEventListener('visibilitychange', () => { if (document.hidden && running) toggle(); });\npaint();\n\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam game/hadiah gabungan: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>\n"];
const K = 'hub-tenang';

}
function go(i) {

  const f = document.getElementById('frame');

        if (de.scrollHeight > de.clientHeight + 4 && (W.getComputedStyle(bd).overflowY === 'hidden' || W.getComputedStyle(de).overflowY === 'hidden')) { de.style.overflowY = 'auto'; bd.style.overflowY = 'auto'; bd.style.height = 'auto'; bd.style.minHeight = '100%'; }
        // layar penuh (fixed/absolute) yang isinya lebih panjang dari layar HP → bikin bisa discroll

}
const q = location.search.match(/[?&]m=(\d)/);
go(q ? Math.min(TABS.length - 1, +q[1]) : Math.min(TABS.length - 1, lsGet(K, 0)));
