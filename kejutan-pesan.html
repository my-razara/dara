<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="who.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kejutan Pesan — Razan & Dara 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#faf6f0;--rose:#c17a6f;--deep:#7a3f35;--muted:#9a8070;--blush:#e8c4b0}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--cream);font-family:'Poppins',sans-serif;color:#2d1f1a;overflow:hidden}
  .hub{display:flex;flex-direction:column;position:fixed;inset:0}   /* pas sama layar yang beneran keliatan (bukan 100dvh yang di beberapa HP ngelewatin tombol navigasi) */
  /*hub-ringkas*/
  .bar{padding:calc(.45rem + env(safe-area-inset-top)) .6rem .45rem;background:var(--cream);border-bottom:1px solid rgba(193,122,111,.15);box-shadow:0 4px 14px rgba(193,122,111,.06);position:relative;z-index:2;display:flex;align-items:center;gap:.45rem;flex:0 0 auto}
  .back{flex:0 0 auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--deep);text-decoration:none;background:#fff;border:1px solid rgba(193,122,111,.18);border-radius:50%}
  .tabs{flex:1;min-width:0;display:flex;gap:2px;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:50px;padding:3px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;border:none;background:none;border-radius:50px;padding:.5rem .7rem;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--rose);color:#fff;font-weight:600}
  .frame{flex:1;position:relative}
  .frame iframe{height:calc(100% - env(safe-area-inset-bottom))!important}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
  .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;animation:p 1s ease-in-out infinite}
  @keyframes p{50%{opacity:.4;transform:scale(.9)}}
</style>
</head>
<body>
<div class="hub">
  <div class="bar">
    <a href="index.html" class="back" aria-label="Menu utama" title="Menu utama">←</a>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="frame" id="frame"><div class="load" id="load">💌</div></div>
</div>
<script>
const TABS = [["☁️", "Awan"], ["🌠", "Bintang"], ["🫙", "Memory Jar"], ["📦", "Lucky Dip"]];
// isi lengkap tiap game ada di sini (satu file aja)
const PAGES = ["<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<title>Cloud Wishes — Dari Razan ☁️<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif}\n  html,body{height:100%;overflow:hidden}\n  body{background:linear-gradient(180deg,#b8d4f0 0%,#daeafa 40%,#f0f7ff 100%)}\n\n  /* Sky layers */\n  #sky{position:fixed;inset:0;z-index:0;overflow:hidden}\n  .sky-sun{\n    position:absolute;top:10%;left:50%;transform:translateX(-50%);\n    width:80px;height:80px;border-radius:50%;\n    background:radial-gradient(circle,#fff9c4,#ffe082);\n    box-shadow:0 0 60px rgba(255,224,130,.6),0 0 120px rgba(255,224,130,.3);\n    animation:sunpulse 4s ease-in-out infinite;\n  }\n  @keyframes sunpulse{0%,100%{box-shadow:0 0 60px rgba(255,224,130,.6),0 0 120px rgba(255,224,130,.3)}50%{box-shadow:0 0 80px rgba(255,224,130,.8),0 0 160px rgba(255,224,130,.4)}}\n\n  .sky-ray{position:absolute;top:10%;left:50%;transform-origin:0 40px;width:200px;height:2px;background:linear-gradient(to right,rgba(255,235,150,.4),transparent);border-radius:1px}\n\n  /* Ground */\n  .ground{position:fixed;bottom:0;left:0;right:0;height:22%;background:linear-gradient(to bottom,#a8d5a2,#7ab87a);z-index:1}\n  .ground::before{content:'';position:absolute;top:-20px;left:0;right:0;height:40px;background:radial-gradient(ellipse 55% 100% at 50% 100%,#a8d5a2,transparent)}\n\n  /* Canvas for clouds */\n  #canvas{position:fixed;inset:0;z-index:2;cursor:pointer}\n\n  /* Wish popup */\n  #wish-popup{\n    position:fixed;inset:0;z-index:20;\n    display:none;align-items:center;justify-content:center;\n    pointer-events:none;\n  }\n  #wish-popup.show{display:flex}\n  .wish-bubble{\n    background:rgba(255,255,255,.95);\n    border-radius:24px;\n    padding:1.5rem 1.75rem;\n    max-width:300px;\n    text-align:center;\n    box-shadow:0 8px 40px rgba(100,150,200,.25);\n    animation:bubblepop .4s cubic-bezier(.34,1.5,.64,1);\n    pointer-events:all;\n    position:relative;\n  }\n  @keyframes bubblepop{from{transform:scale(.4) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}\n  .wish-icon{font-size:2.5rem;display:block;margin-bottom:.6rem}\n  .wish-num{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#90aec0;display:block;margin-bottom:.35rem}\n  .wish-text{font-size:15px;font-weight:600;color:#2d4a6b;line-height:1.55;margin-bottom:1rem}\n  .wish-close{\n    padding:.6rem 1.75rem;border-radius:50px;border:none;cursor:pointer;\n    font-size:13px;font-weight:600;\n    background:linear-gradient(135deg,#7bb8e8,#5a9fd4);color:#fff;\n    box-shadow:0 3px 12px rgba(90,159,212,.35);transition:all .15s;\n  }\n  .wish-close:active{transform:scale(.95)}\n\n  /* Counter */\n  #counter{\n    position:fixed;top:calc(1.1rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);\n    z-index:10;\n    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);\n    border-radius:50px;padding:.35rem 1.1rem;\n    font-size:12px;font-weight:600;color:#4a7a9b;\n    box-shadow:0 2px 12px rgba(100,150,200,.15);\n    white-space:nowrap;\n  }\n\n  /* Intro hint */\n  #hint{\n    position:fixed;bottom:28%;left:50%;transform:translateX(-50%);\n    z-index:10;text-align:center;\n    animation:hintfloat 3s ease-in-out infinite;\n  }\n  @keyframes hintfloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}\n  .hint-icon{font-size:1.6rem;display:block;margin-bottom:.25rem}\n  .hint-text{font-size:12px;color:#5a8aaa;font-weight:500;background:rgba(255,255,255,.6);border-radius:50px;padding:.25rem .85rem}\n\n  /* All done overlay */\n  #done-overlay{\n    position:fixed;inset:0;z-index:30;\n    display:none;flex-direction:column;align-items:center;justify-content:center;\n    background:rgba(184,212,240,.92);backdrop-filter:blur(12px);\n    padding:1.5rem;text-align:center;\n  }\n  #done-overlay.show{display:flex}\n  .done-icon{font-size:4rem;display:block;margin-bottom:1rem;animation:float 3s ease-in-out infinite}\n  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n  .done-title{font-size:1.4rem;font-weight:700;color:#2d4a6b;margin-bottom:.35rem}\n  .done-sub{font-size:13px;color:#5a7a9b;line-height:1.75;max-width:280px;margin:.35rem auto 1.5rem}\n  .done-wishes{\n    display:flex;flex-direction:column;gap:.4rem;\n    width:100%;max-width:360px;\n    max-height:300px;overflow-y:auto;\n    margin-bottom:1.25rem;\n  }\n  .dw-item{\n    background:rgba(255,255,255,.8);border-radius:12px;\n    padding:.6rem .9rem;font-size:12px;color:#2d4a6b;\n    text-align:left;display:flex;align-items:center;gap:.5rem;\n  }\n  .dw-icon{flex-shrink:0;font-size:1rem}\n  .done-btn{\n    padding:.9rem 2.5rem;border-radius:50px;border:none;cursor:pointer;\n    font-size:14px;font-weight:700;\n    background:linear-gradient(135deg,#7bb8e8,#5a9fd4);color:#fff;\n    box-shadow:0 4px 18px rgba(90,159,212,.4);transition:all .2s;\n  }\n  .done-btn:active{transform:scale(.97)}\n\n  /* ═════ [BARU] ═════ */\n  #wish-popup.show{pointer-events:all;background:rgba(45,74,107,.18)}\n  .wish-bubble{margin:0 1.25rem}\n  .wish-btns{display:flex;flex-direction:column;gap:.45rem;align-items:center}\n  .wish-amin{font-size:11.5px;color:#5a8aaa;text-decoration:none;border-bottom:1px dashed rgba(90,138,170,.5);padding-bottom:1px}\n  .top-btn{position:fixed;top:calc(1.1rem + env(safe-area-inset-top));z-index:10;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:none;border-radius:50px;padding:.38rem .75rem;font-size:12px;font-weight:600;color:#4a7a9b;box-shadow:0 2px 12px rgba(100,150,200,.15);cursor:pointer;text-decoration:none}\n  .top-btn.l{left:.75rem} .top-btn.r{right:.75rem}\n  #counter{font-size:11.5px;padding:.35rem .9rem}\n  .bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom));z-index:10;display:flex;gap:.5rem}\n  .bb-btn{border:none;border-radius:50px;padding:.6rem 1.1rem;font-size:12.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.85);color:#4a7a9b;box-shadow:0 3px 12px rgba(80,140,80,.18);white-space:nowrap}\n  .done-wishes{max-height:46vh}\n  .done-actions{display:flex;flex-direction:column;gap:.5rem;align-items:center}\n  .done-ghost{background:none;border:none;color:#4a7a9b;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:.3rem}\n  .dw-item.locked{opacity:.55;font-style:italic}\n\n  /* Confetti */\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<div id=\"sky\">\n  <div class=\"sky-sun\"><\/div>\n  <\!-- Sun rays -->\n  <div class=\"sky-ray\" style=\"transform:rotate(0deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(30deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(60deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(90deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(120deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(150deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(180deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(210deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(240deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(270deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(300deg)\"><\/div>\n  <div class=\"sky-ray\" style=\"transform:rotate(330deg)\"><\/div>\n<\/div>\n\n<div class=\"ground\"><\/div>\n\n<canvas id=\"canvas\"><\/canvas>\n\n<a class=\"top-btn l\" href=\"index.html\">←<\/a>\n<div id=\"counter\">☁️ <span id=\"counter-text\">Tap awan untuk buka harapan<\/span><\/div>\n<div class=\"bottom-bar\"><button class=\"bb-btn\" onclick=\"showCollection()\">📜 Harapan yang udah kebuka<\/button><\/div>\n\n<div id=\"hint\">\n  <span class=\"hint-icon\">👆<\/span>\n  <span class=\"hint-text\">Tap awan!<\/span>\n<\/div>\n\n<\!-- Wish popup -->\n<div id=\"wish-popup\">\n  <div class=\"wish-bubble\">\n    <span class=\"wish-icon\" id=\"wish-icon\">✨<\/span>\n    <span class=\"wish-num\" id=\"wish-num\">Harapan #1<\/span>\n    <p class=\"wish-text\" id=\"wish-text\">...<\/p>\n    <div class=\"wish-btns\">\n      <button class=\"wish-close\" onclick=\"closeWish()\">Makasih Razan 🤍<\/button>\n      <a class=\"wish-amin\" id=\"wish-amin\" href=\"#\" target=\"_blank\" rel=\"noopener\">💬 Bilang \"aamiin\" ke Razan<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- All done -->\n<div id=\"done-overlay\">\n  <span class=\"done-icon\">☁️<\/span>\n  <p class=\"done-title\" id=\"done-title\">Semua harapan terbuka! 🤍<\/p>\n  <p class=\"done-sub\" id=\"done-sub\">Ini semua yang Razan harapkan buat kalian berdua — dari yang paling sederhana sampai yang paling dalam.<\/p>\n  <div class=\"done-wishes\" id=\"done-wishes\"><\/div>\n  <div class=\"done-actions\" id=\"done-actions\"><\/div>\n<\/div>\n\n<\script>\nconst WISHES = [\n  {icon:'🌟', text:'Aku pengen lihat kamu sukses'},\n  {icon:'👴👵', text:'Aku pengen tua bareng kamu'},\n  {icon:'📸', text:'Aku pengen bikin banyak kenangan'},\n  {icon:'😂', text:'Aku pengen ketawa bareng kamu selamanya'},\n  {icon:'🏠', text:'Aku pengen punya rumah yang penuh sama kamu'},\n  {icon:'✈️', text:'Aku pengen jalan-jalan ke mana aja sama kamu'},\n  {icon:'🌅', text:'Aku pengen bangun pagi dan kamu ada di sana'},\n  {icon:'💪', text:'Aku pengen jadi orang yang kamu banggain'},\n  {icon:'🎂', text:'Aku pengen rayain ulang tahun kamu selamanya'},\n  {icon:'🤝', text:'Aku pengen kita tumbuh bareng'},\n  {icon:'🍜', text:'Aku pengen makan bareng kamu tiap hari'},\n  {icon:'💌', text:'Aku pengen kamu selalu ngerasa disayangi'},\n  {icon:'🌸', text:'Aku pengen lihat kamu bahagia'},\n  {icon:'🔒', text:'Aku pengen kamu selalu ngerasa aman sama aku'},\n  {icon:'🌙', text:'Aku pengen ada di sisi kamu di malam yang berat'},\n  {icon:'🎓', text:'Aku pengen support semua mimpi kamu'},\n  {icon:'💑', text:'Aku pengen kita masih kayak gini bertahun-tahun lagi'},\n  {icon:'🫶', text:'Aku pengen kamu tau betapa berharganya kamu'},\n  {icon:'🌈', text:'Aku pengen hari-hari kamu selalu lebih baik'},\n  {icon:'💍', text:'Aku pengen masa depan yang sama kamu'},\n];\n\nconst WA='6285692740607';\nconst canvas=document.getElementById('canvas');\nconst ctx=canvas.getContext('2d');\nlet W,H,dpr;\nlet clouds=[];\nlet raf=null;\nlet frame=0;\nlet popupOpen=false;\n// [FIX] harapan yang udah kebuka disimpan (pakai urutan di daftar WISHES)\nconst SAVE='cloud-wishes-opened';\nlet openedIdx=[];\ntry{openedIdx=JSON.parse(localStorage.getItem(SAVE)||'[]').filter(n=>n>=0&&n<WISHES.length);}catch(e){}\nfunction persist(){try{localStorage.setItem(SAVE,JSON.stringify(openedIdx));}catch(e){}}\n\nfunction sizeCanvas(){\n  dpr=Math.min(window.devicePixelRatio||1,2);\n  const oW=W,oH=H;\n  W=window.innerWidth;H=window.innerHeight;\n  canvas.width=W*dpr;canvas.height=H*dpr;\n  canvas.style.width=W+'px';canvas.style.height=H+'px';\n  ctx.setTransform(dpr,0,0,dpr,0,0);   // [FIX] dulu pakai scale() → tiap resize gambarnya makin besar\n  return {oW,oH};\n}\nfunction init(){ sizeCanvas(); buildClouds(); updateCounter(); }\n\nfunction buildClouds(){\n  clouds=[];\n  const order=WISHES.map((w,i)=>i).sort(()=>Math.random()-.5);\n  const cols=4, rows=5;\n  const startY=H*0.15, skyH=H*0.62;\n  const base=Math.min(W/cols*0.6, 54);\n  order.forEach((wi,i)=>{\n    const col=i%cols, row=Math.floor(i/cols);\n    const x=(col+.5)*(W/cols)+(Math.random()-.5)*W*0.04;\n    const y=startY+row*(skyH/rows)+(Math.random()-.5)*(skyH/rows)*0.2;\n    const size=base*(.82+Math.random()*.25);\n    clouds.push({id:wi,x,y,size,vx:(Math.random()-.5)*0.2,floatOffset:Math.random()*Math.PI*2,floatSpd:0.008+Math.random()*0.006,\n      wish:WISHES[wi],opened:openedIdx.includes(wi),scale:1,scaleDir:0,opacity:1});\n  });\n}\n\n// [RINGAN] awan digambar sekali jadi gambar kecil (sprite), tiap frame tinggal ditempel — bayangan blur ga dihitung ulang terus\nconst SPR={};\nfunction cloudSprite(c){\n  const s=Math.round(c.size), key=(c.opened?'o'+c.wish.icon:'c')+'|'+s+'|'+dpr;\n  if(SPR[key]) return SPR[key];\n  const pad=s*1.25, w=Math.ceil(pad*2), cv=document.createElement('canvas'); cv.width=cv.height=Math.ceil(w*dpr);\n  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); const x=pad,y=pad;\n  if(c.opened){\n    g.globalAlpha=0.35; g.fillStyle='rgba(200,220,240,.6)'; drawCloudShapePath(x,y,s,g); g.fill();\n    g.globalAlpha=.8; g.font=`${s*0.42}px serif`; g.textAlign='center';g.textBaseline='middle'; g.fillText(c.wish.icon.slice(0,2),x,y+2);\n  } else {\n    g.shadowColor='rgba(100,150,200,.2)';g.shadowBlur=12; g.fillStyle='rgba(255,255,255,.92)'; drawCloudShapePath(x,y,s,g); g.fill(); g.shadowBlur=0;\n    const grad=g.createRadialGradient(x-s*.2,y-s*.2,0,x,y,s); grad.addColorStop(0,'rgba(255,255,255,.4)'); grad.addColorStop(1,'rgba(200,230,255,.0)');\n    g.fillStyle=grad; drawCloudShapePath(x,y,s,g); g.fill();\n    g.fillStyle='rgba(90,159,212,.6)'; g.font=`${s*0.28}px serif`; g.textAlign='center';g.textBaseline='middle'; g.fillText('✨',x,y);\n  }\n  return SPR[key]={cv,w,pad};\n}\nfunction drawCloud(c){\n  const sp=cloudSprite(c), sc=c.scale, x=c.x, y=c.y+Math.sin(frame*c.floatSpd+c.floatOffset)*4;\n  ctx.globalAlpha=c.opacity;\n  ctx.drawImage(sp.cv, x-sp.pad*sc, y-sp.pad*sc, sp.w*sc, sp.w*sc);\n  ctx.globalAlpha=1;\n}\nfunction drawCloudShape(x,y,s,color){ ctx.fillStyle=color; drawCloudShapePath(x,y,s); ctx.fill(); }\nfunction drawCloudShapePath(x,y,s,g=ctx){\n  // [FIX] tiap gelembung awan digambar terpisah (dulu ada \"ekor\" segitiga aneh di sisi kanan awan)\n  g.beginPath();\n  [[0,0,.5],[-.38,.1,.35],[.38,.1,.35],[-.18,-.22,.3],[.2,-.18,.28]].forEach(([dx,dy,r])=>{ g.moveTo(x+dx*s+r*s,y+dy*s); g.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2); });\n}\n\nlet last=performance.now();\nfunction loop(now){\n  if(document.hidden||now-last<30){ raf=requestAnimationFrame(loop); if(document.hidden) last=now; return; }   // [RINGAN] ~30fps\n  const k=Math.min(3,(now-last)/16.67)||1; last=now;   // [FIX] kecepatan sama di HP 60Hz & 120Hz\n  ctx.clearRect(0,0,W,H);\n  frame+=k;\n  clouds.forEach(c=>{\n    c.x+=c.vx*k;\n    if(c.x<c.size*.9) c.vx=Math.abs(c.vx);\n    if(c.x>W-c.size*.9) c.vx=-Math.abs(c.vx);\n    if(c.scaleDir!==0){\n      c.scale+=c.scaleDir*0.06*k;\n      if(c.scale>=1.18){c.scaleDir=-1}\n      if(c.scale<=1){c.scale=1;c.scaleDir=0}\n    }\n    drawCloud(c);\n  });\n  raf=requestAnimationFrame(loop);\n}\n\nfunction getTapCloud(tx,ty){\n  let best=null,bd=1e9;\n  for(const c of clouds){\n    if(c.opened)continue;\n    const cy=c.y+Math.sin(frame*c.floatSpd+c.floatOffset)*4;\n    const dist=Math.hypot(tx-c.x,ty-cy);\n    if(dist<c.size*.8&&dist<bd){best=c;bd=dist;}   // ambil awan yang paling deket jarinya\n  }\n  return best;\n}\n\nfunction onTap(e){\n  if(popupOpen)return;   // [FIX] dulu awan di belakang popup masih bisa kepencet\n  const rect=canvas.getBoundingClientRect();\n  const tx=e.clientX-rect.left, ty=e.clientY-rect.top;\n  const c=getTapCloud(tx,ty);\n  if(!c)return;\n  document.getElementById('hint').style.display='none';\n  c.scaleDir=1; c.opened=true;\n  if(!openedIdx.includes(c.id)){openedIdx.push(c.id);persist();}\n  document.getElementById('wish-icon').textContent=c.wish.icon;\n  document an class=\"dw-icon\">☁️<\/span><span>Masih di awan…<\/span>'; list.appendChild(el); }\n  document.getElementById('done-actions').innerHTML=all\n    ?`<button class=\"done-btn\" onclick=\"closeDone()\">Tutup ☁️<\/button><button class=\"done-ghost\" onclick=\"resetGame()\">Main lagi dari awal<\/button>`\n    :`<button class=\"done-btn\" onclick=\"closeDone()\">Lanjut buka awan ☁️<\/button>`;\n  document.getElementById('done-overlay').classList.add('show');\n  if(finished)confetti(80);\n}\nfunction showCollection(){ showDone(false); }\nfunction closeDone(){ document.getElementById('done-overlay').classList.remove('show'); }\n\nfunction resetGame(){\n  if(!confirm('Mulai lagi dari awal? Semua awan bakal ketutup lagi.'))return;\n  document.getElementById('done-overlay').classList.remove('show');\n  openedIdx=[];persist();buildClouds();updateCounter();\n}\n\nfunction spawnParticles(x,y){\n  const colors=['#fff','#b8d4f0','#7bb8e8','#ffe082','#ffb3c6'];\n  for(let i=0;i<12;i++) setTimeout(()=>{\n    const el=document.createElement('div');el.className='cp';\n    el.style.cssText=`left:${x}px;top:${y}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${.8+Math.random()*1.2}s;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'}`;\n    document.body.appendChild(el);setTimeout(()=>el.remove(),2500);\n  },i*25);\n}\nfunction confetti(n=50){\n  const colors=['#7bb8e8','#b8d4f0','#ffe082','#ffb3c6','#fff'];\n  for(let i=0;i<n;i++) setTimeout(()=>{\n    const el=document.createElement('div');el.className='cp';\n    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;\n    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);\n  },i*20);\n} -sub { text-align: center; color: rgba(255,255,255,.4); font-size: 11px; margin-bottom: 1rem; }\n  .coll-item { display: flex; gap: .65rem; padding: .7rem .2rem; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; }\n  .coll-item:last-of-type { border-bottom: none; }\n  .ci-ic { font-size: 1.1rem; flex-shrink: 0; }\n  .ci-n { font-size: 9px; letter-spacing: .15em; color: #c9a96e; text-transform: uppercase; display: block; }\n  .ci-t { font-size: 12.5px; color: rgba(255,255,255,.85); line-height: 1.6; font-weight: 300; display: block; }\n  .coll-close { width: 100%; margin-top: .9rem; }\n\n  /* ── ALL DONE ── */\n  #done-overlay {\n    display: none; position: fixed; inset: 0; z-index: 30;\n    background: rgba(10,5,21,.9); backdrop-filter: blur(8px);\n    align-items: center; justify-content: center;\n    flex-direction: column; text-align: center; padding: 2rem;\n  }\n  #done-overlay.show { display: flex; }\n  .done-emoji { font-size: 4rem; margin-bottom: 1rem; display: block; animation: float 3s ease-in-out infinite; }\n  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }\n  .done-title { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: .5rem; }\n  .done-title span { color: #c9a96e; }\n  .done-sub { font-size: 13px; color: rgba(255,255,255,.5); line-height: 1.75; max-width: 300px; margin: 0 auto 2rem; }\n  .done-btn {\n    padding: .9rem 2.5rem; border-radius: 50px; border: none; cursor: pointer;\n    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;\n    background: linear-gradient(135deg,#c17a6f,#c9a96e); color: #fff;\n    box-shadow: 0 4px 20px rgba(193,122,111,.4);\n  }\n  .done-btn:active { opacity: .85; transform: scale(.97); }\n  .done-link { margin-top: .9rem; background: none; border: none; color: rgba(255,255,255,.55); font-size: 12px; text-decoration: underline; cursor: pointer; }\n\n  .sky-note {\n    position: fixed; left: 50%; bottom: calc(4rem + env(safe-area-inset-bottom)); transform: translateX(-50%);\n    font-size: 11px; color: rgba(255,255,255,.4); z-index: 6; pointer-events: none; text-align: center; white-space: nowrap;\n    transition: opacity .4s;\n  }\n\n  @media (max-width: 360px) {\n    .sky-title { font-size: 1.15rem; }\n    .msg-row > * { font-size: 11px; }\n  }\n\n  /* ── TAP RIPPLE ── */\n  .tap-ripple {\n    position: fixed; border-radius: 50%;\n    width: 60px; height: 60px;\n    border: 1.5px solid rgba(255,255,255,.3);\n    transform: translate(-50%,-50%) scale(0);\n    animation: ripple .6s ease forwards;\n    pointer-events: none; z-index: 5;\n  }\n  @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(0);opacity:.8} 100%{transform:translate(-50%,-50%) scale(2.5);opacity:0} }\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<canvas id=\"sky\" aria-label=\"Langit malam, tap buat manggil bintang\"><\/canvas>\n<a href=\"index.html\" class=\"top-btn back-link\">← Menu utama<\/a>\n\n<div class=\"sky-header\">\n  <span class=\"sky-label\">Khusus untuk Dara<\/span>\n  <h1 class=\"sky-title\">Bintang <span>Jatuh<\/span> 🌠<\/h1>\n  <p class=\"sky-hint\">✨ Tap langit untuk memanggil bintang<\/p>\n<\/div>\n\n<div class=\"star-counter\" aria-live=\"polite\">\n  <span id=\"star-count\">0<\/span> / 25 bintang\n<\/div>\n\n<\!-- Message card -->\n<div id=\"msg-card\">\n  <div class=\"msg-inner\">\n    <div class=\"msg-drag\"><\/div>\n    <span class=\"msg-star-icon\" id=\"msg-icon\">🌟<\/span>\n    <span class=\"msg-num\" id=\"msg-num\">Bintang #1<\/span>\n    <p class=\"msg-text\" id=\"msg-text\">...<\/p>\n    <span class=\"msg-sign\">— Razan 🤍<\/span>\n    <button class=\"msg-close\" id=\"msg-close\" onclick=\"closeMsg()\">Tutup & Cari Bintang Lagi ✨<\/button>\n    <div class=\"msg-row\">\n      <a class=\"wa\" id=\"msg-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">💬 Bales ke Razan<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<button class=\"top-btn coll-btn\" id=\"coll-btn\" onclick=\"openColl()\">📜 Koleksi bintang<\/button>\n<p class=\"sky-note\" id=\"sky-note\"><\/p>\n\n<div id=\"coll\" onclick=\"if(event.target===this)closeColl()\">\n  <div class=\"coll-sheet\">\n    <p class=\"coll-title\">🌌 Rasi bintang kamu<\/p>\n    <p class=\"coll-sub\" id=\"coll-sub\"><\/p>\n    <div id=\"coll-list\"><\/div>\n    <button class=\"msg-close coll-close\" onclick=\"closeColl()\">Tutup<\/button>\n  <\/div>\n<\/div>\n\n<\!-- Done -->\n<div id=\"done-overlay\">\n  <span class=\"done-emoji\">🌌<\/span>\n  <h2 class=\"done-title\">Semua bintang <span>sudah jatuh<\/span><\/h2>\n  <p class=\"done-sub\">25 bintang, 25 pesan — semua sudah kamu tangkap. Makasih udah ada di langit aku, Dara. 🤍<\/p>\n  <button class=\"done-btn\" onclick=\"resetSky()\">Hidupkan Lagi Langitnya 🌠<\/button>\n  <button class=\"done-link\" onclick=\"document.getElementById('done-overlay').classList.remove('show');openColl()\">📜 Baca ulang semua bintang<\/button>\n  <button class=\"done-link\" style=\"margin-top:.3rem\" onclick=\"document.getElementById('done-overlay').classList.remove('show')\">Liat rasi bintangnya<\/button>\n<\/div>\n\n<\script>\nconst MESSAGES = [\n  { icon: \"🌟\", text: \"Kamu itu hal yang aku syukuri setiap hari — bahkan di hari yang berat sekalipun.\" },\n  { icon: \"💫\", text: \"Ada banyak hal di dunia ini yang ga bisa aku kontrol. Tapi rasa sayang aku ke kamu, itu aku jaga.\" },\n  { icon: \"✨\", text: \"Kamu ga harus jadi sempurna. Kamu sudah lebih dari cukup — persis seperti kamu sekarang.\" },\n  { icon: \"🌠\", text: \"Hal yang aku suka dari kamu bukan satu hal besar — tapi ribuan hal kecil yang terus-terusan bikin aku pilih kamu.\" },\n  { icon: \"⭐\", text: \"Kalau langit malam ini punya bintang sebanyak hal yang aku suka dari kamu, langitnya ga akan pernah gelap.\" },\n  { icon: \"🌟\", text: \"Kamu adalah jenis orang yang bikin ruangan terasa lebih hangat cuma dengan hadir di sana.\" },\n  { icon: \"💫\", text: \"Aku ga tau banyak hal di dunia ini. Tapi aku tau aku mau kamu ada di setiap versi hidup aku.\" },\n  { icon: \"✨\", text: \"Waktu aku capek dan ngerasa ga cukup — aku inget ada kamu. Dan entah kenapa itu selalu cukup buat aku lanjut.\" },\n  { icon: \"🌠\", text: \"Matamu itu. Aku ga pernah bisa sepenuhnya jelasin kenapa — tapi selalu bikin aku ngerasa aman.\" },\n  { icon: \"⭐\", text: \"Kalau bisa milih ulang, aku tetap pilih kamu. Di semua kemungkinan yang ada, jawabannya tetap kamu.\" },\n  { icon: \"🌟\", text: \"Kamu yang pertama aku mau kabarin waktu sesuatu yang baik terjadi. Dan kamu yang pertama aku cari waktu sesuatu yang buruk terjadi.\" },\n  { icon: \"💫\", text: \"Ada sesuatu dari cara kamu ketawa yang bikin aku lupa semua hal yang lagi aku khawatirkan.\" },\n  { icon: \"✨\", text: \"Kamu punya ketenangan yang jarang aku temuin di tempat lain. Dan itu salah satu hal yang paling aku syukuri dari kamu.\" },\n  { icon: \"🌠\", text: \"Aku perhatiin banyak hal kecil dari kamu. Dan semakin aku perhatiin, semakin aku sadar — kamu luar biasa.\" },\n  { icon: \"⭐\", text: \"Semua hal yang aku lakuin punya rasa yang lebih ringan karena ada kamu. Bukan karena kamu yang bantu — tapi karena kamu ada.\" },\n  { icon: \"🌟\", text: \"Kamu adalah orang yang bikin aku percaya bahwa hal-hal baik memang ada dan memang bisa bertahan.\" },\n  { icon: \"💫\", text: \"Setiap momen sama kamu aku simpan baik-baik. Karena aku tau — momen itu ga akan datang dua kali.\" },\n  { icon: \"✨\", text: \"Kamu ga sadar betapa banyak yang kamu kasih ke aku — ketenangan, semangat, dan alasan untuk jadi lebih baik.\" },\n  { icon: \"🌠\", text: \"Aku selalu berharap kamu bisa lihat diri kamu dari sudut pandang aku. Karena yang aku lihat itu indah banget.\" },\n  { icon: \"⭐\", text: \"Di antara semua hal yang datang dan pergi — kamu yang aku mau tetap ada. Selamanya kalau bisa.\" },\n  { icon: \"🌟\", text: \"Cara kamu hadir itu beda. Ga banyak orang yang bisa bikin orang lain ngerasa se-dihargai itu.\" },\n  { icon: \"💫\", text: \"Kamu itu bukan Plan B. Kamu itu satu-satunya yang aku rencanakan.\" },\n  { icon: \"✨\", text: \"Makasih udah ada. Makasih udah mau. Makasih udah jadi kamu yang sekarang.\" },\n  { icon: \"🌠\", text: \"Langit malam ini cantik. Tapi ga lebih cantik dari kamu waktu kamu senyum beneran.\" },\n  { icon: \"⭐\", text: \"Dari sekian banyak hal yang aku harapin di hidup aku — kamu adalah salah satu yang sudah terjawab. 🤍\" },\n];\n\n// ── STATE (kesimpen) ──\n// caught = urutan bintang yang udah ketangkep: {i: index pesan, x, y (0..1 posisi di langit)}\nconst KEY = 'bintang-jatuh';\nconst WA = '6285692740607';\nlet caught = [];\ntry {\n  const d = JSON.parse(localStorage.getItem(KEY));\n  if (Array.isArray(d)) caught = d.filter(c => c && MESSAGES[c.i] && isFinite(c.x) && isFinite(c.y));\n} catch (e) {}\nconst seenIdx = new Set(caught.map(c => c.i));\nlet remaining = [...Array(MESSAGES.length).keys()].filter(i => !seenIdx.has(i)).sort(() => Math.random() - .5);\nlet revealed = caught.length;\nlet msgOpen = false;\nlet flying = false;        // [FIX] satu bintang lagi terbang → tap lain diabaikan (dulu pesan bisa kelewat)\nlet current = null;        // posisi di caught yang lagi dibuka\nlet currentFresh = false;\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(caught)); } catch (e) {} }\n\n// Canvas setup\nconst canvas = document.getElementById('sky');\nconst ctx = canvas.getContext('2d');\nlet W, H, DPR = 1;\n\nfunction resize() {\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  W = window.innerWidth; H = window.innerHeight;\n  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);\n  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  bgCache = null;\n}\n\n// Static background stars\nconst bgStars = [];\nfunction initBgStars() {\n  bgStars.length = 0;\n  for (let i = 0; i < 180; i++) {\n    bgStars.push({\n      x: Math.random(),\n      y: Math.random(),\n      r: Math.random() * 1.2 + .2,\n      alpha: Math.random() * .6 + .2,\n      twinkleSpeed: Math.random() * .02 + .005,\n      twinkleOffset: Math.random() * Math.PI * 2,\n    });\n  }\n}\n\nconst shooters = [];\nconst particles = [];\nlet frame = 0, lastT = 0, raf = 0;\nlet bgCache = null;\n\nfunction drawStaticStars() {\n  // langit + nebula digambar sekali ke kanvas cadangan (lebih hemat baterai)\n  if (!bgCache) {\n    bgCache = document.createElement('canvas');\n    bgCache.width = canvas.width; bgCache.height = canvas.height;\n    const b = bgCache.getContext('2d');\n    b.setTransform(DPR, 0, 0, DPR, 0, 0);\n    const grad = b.createLinearGradient(0, 0, 0, H);\n    grad.addColorStop(0, '#04011a'); grad.addColorStop(.5, '#080220'); grad.addColorStop(1, '#0d0525');\n    b.fillStyle = grad; b.fillRect(0, 0, W, H);\n    const neb1 = b.createRadialGradient(W * .25, H * .3, 0, W * .25, H * .3, W * .35);\n    neb1.addColorStop(0, 'rgba(80,40,120,.12)'); neb1.addColorStop(1, 'transparent');\n    b.fillStyle = neb1; b.fillRect(0, 0, W, H);\n    const neb2 = b.createRadialGradient(W * .75, H * .6, 0, W * .75, H * .6, W * .3);\n    neb2.addColorStop(0, 'rgba(40,80,120,.1)'); neb2.addColorStop(1, 'transparent');\n    b.fillStyle = neb2; b.fillRect(0, 0, W, H);\n  }\n  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0); ctx.restore();\n}\n\nfunction drawCaught(t) {\n  if (!caught.length) return;\n  // garis rasi bintang (urut ketangkep)\n  ctx.lineWidth = 1;\n  ctx.strokeStyle = 'rgba(201,169,110,.16)';\n  ctx.setLineDash([3, 5]);\n  ctx.beginPath();\n  caught.forEach((c, k) => { const x = c.x * W, y = c.y * H; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });\n  ctx.stroke();\n  ctx.setLineDash([]);\n  caught.forEach((c, k) => {\n    const x = c.x * W, y = c.y * H;\n    const pulse = .75 + .25 * Math.sin(t / 700 + k);\n    const hl = current === k && msgOpen;\n    const R = (hl ? 16 : 11) * pulse;\n    const g = ctx.createRadialGradient(x, y, 0, x, y, R);\n    g.addColorStop(0, `rgba(255,236,190,${hl ? 1 : .95})`);\n    g.addColorStop(.35, `rgba(201,169,110,${hl ? .6 : .4})`);\n    g.addColorStop(1, 'rgba(201,169,110,0)');\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();\n    // kilau 4 arah\n    ctx.strokeStyle = `rgba(255,240,200,${.5 * pulse})`; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x - R * .9, y); ctx.lineTo(x + R * .9, y); ctx.moveTo(x, y - R * .9); ctx.lineTo(x, y + R * .9); ctx.stroke();\n  });\n}\n\nfunction animate(t) {\n  raf = requestAnimationFrame(animate);\n  const dt = lastT ? Math.min(3, (t - lastT) / 16.667) : 1;   // 1 = satu frame 60fps → kecepatan sama di semua layar\n  lastT = t;\n  frame += dt;\n\n  drawStaticStars();\n\n  bgStars.forEach(s => {\n    const alpha = s.alpha + Math.sin(frame * s.twinkleSpeed + s.twinkleOffset) * .15;\n    ctx.beginPath();\n    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);\n    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, alpha))})`;\n    ctx.fill();\n  });\n\n  drawCaught(t);\n\n  // Shooting stars\n  for (let i = shooters.length - 1; i >= 0; i--) {\n    const s = shooters[i];\n    s.x += s.vx * dt;\n    s.y += s.vy * dt;\n    s.life -= s.decay * dt;\n    s.trail.push({ x: s.x, y: s.y });\n    if (s.trail.length > 22) s.trail.shift();\n\n    if (s.life <= 0) {\n      if (!s.burst) {\n        s.burst = true;\n        spawnBurst(s.x, s.y, s.color);\n        if (s.onEnd) s.onEnd(s.x, s.y);\n      }\n      shooters.splice(i, 1);\n      continue;\n    }\n\n    for (let j = 1; j < s.trail.length; j++) {\n      const prog = j / s.trail.length;\n      ctx.beginPath();\n      ctx.moveTo(s.trail[j - 1].x, s.trail[j - 1].y);\n      ctx.lineTo(s.trail[j].x, s.trail[j].y);\n      ctx.strokeStyle = `rgba(${s.color},${prog * s.life * .9})`;\n      ctx.lineWidth = prog * 2.5;\n      ctx.lineCap = 'round';\n      ctx.stroke();\n    }\n\n    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 6);\n    grd.addColorStop(0, `rgba(${s.color},${s.life})`);\n    grd.addColorStop(1, 'transparent');\n    ctx.fillStyle = grd;\n    ctx.beginPath();\n    ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);\n    ctx.fill();\n  }\n\n  for (let i = particles.length - 1; i >= 0; i--) {\n    const p = particles[i];\n    p.x += p.vx * dt;\n    p.y += p.vy * dt;\n    p.vy += .04 * dt;\n    p.life -= .025 * dt;\n    if (p.life <= 0) { particles.splice(i, 1); continue; }\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);\n    ctx.fillStyle = `rgba(${p.color},${p.life})`;\n    ctx.fill();\n  }\n}\n\nfunction spawnBurst(x, y, color) {\n  for (let i = 0; i < 12; i++) {\n    const angle = (i / 12) * Math.PI * 2;\n    const speed = Math.random() * 2.5 + .5;\n    particles.push({\n      x, y,\n      vx: Math.cos(angle) * speed,\n      vy: Math.sin(angle) * speed - 1,\n      r: Math.random() * 2 + 1,\n      life: Math.random() * .5 + .5,\n      color,\n    });\n  }\n}\n\nfunction launchShooter(fromX, fromY, onEnd) {\n  const speed = Math.random() * 3 + 4;\n  const startX = fromX + (Math.random() - .5) * 120;\n  const startY = fromY - Math.random() * 200 - 100;\n  const dx = fromX - startX;\n  const dy = fromY - startY;\n  const dist = Math.sqrt(dx * dx + dy * dy);\n  const nx = dx / dist, ny = dy / dist;\n  const colors = ['255,255,255', '255,240,180', '200,180,255', '180,220,255', '255,200,180'];\n  const color = colors[Math.floor(Math.random() * colors.length)];\n  shooters.push({ x: startX, y: startY, vx: nx * speed, vy: ny * speed, life: 1, decay: .018, trail: [], color, burst: false, onEnd });\n}\n\nfunction ripple(x, y) {\n  const r = document.createElement('div');\n  r.className = 'tap-ripple';\n  r.style.left = x + 'px'; r.style.top = y + 'px';\n  document.body.appendChild(r);\n  setTimeout(() => r.remove(), 700);\n}\n\n// Tap handler\ncanvas.addEventListener('click', e => {\n  if (msgOpen) return;\n  const x = e.clientX, y = e.clientY;\n\n  // tap bintang emas yang udah ketangkep → baca lagi pesannya\n  let best = -1, bd = 26 * 26;\n  caught.forEach((c, k) => { const d = (c.x * W - x) ** 2 + (c.y * H - y) ** 2; if (d < bd) { bd = d; best = k; } });\n  if (best >= 0) { ripple(x, y); openCaught(best, false); return; }\n\n  if (remaining.length === 0) {\n    document.getElementById('done-overlay').classList.add('show');\n    return;\n  }\n  if (flying) return;\n  flying = true;\n  ripple(x, y);\n  try { navigator.vibrate && navigator.vibrate(10); } catch (_) {}\n\n  const count = Math.floor(Math.random() * 2) + 1;\n  for (let i = 0; i < count; i++) {\n    const isLast = i === count - 1;\n    launchShooter(x, y, isLast ? () => { flying = false; showMessage(x, y); } : null);\n  }\n  // jaga-jaga kalau tab ketutup pas bintang lagi terbang\n  setTimeout(() => { if (flying) { flying = false; showMessage(x, y); } }, 2500);\n});\n\nfunction showMessage(x, y) {\n  if (!remaining.length) return;\n  const idx = remaining.pop();\n  // posisi bintang emas: jangan ketutup header / kartu pesan\n  const px = Math.min(.94, Math.max(.06, x / W));\n  const py = Math.min(.86, Math.max(.2, y / H));\n  caught.push({ i: idx, x: px, y: py });\n  revealed = caught.length;\n  save();\n  try { navigator.vibrate && navigator.vibrate([15, 40, 25]); } catch (_) {}\n  openCaught(caught.length - 1, true);\n}\n\nfunction openCaught(k, fresh) {\n  const c = caught[k];\n  if (!c) return;\n  msgOpen = true;\n  current = k; currentFresh = fresh;\n  const msg = MESSAGES[c.i];\n  document.getElementById('msg-icon').textContent = msg.icon;\n  document.getElementById('msg-num').textContent = `Bintang #${k + 1}`;\n  document.getElementById('msg-text').textContent = msg.text;\n  document.getElementById('msg-close').textContent
