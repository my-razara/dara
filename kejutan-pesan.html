  .empty-msg{font-size:13px;color:var(--muted);margin-top:.25rem}\n\n  /* ── KOLEKSI ── */\n  #screen-coll{gap:.85rem;text-align:left}\n  .coll-head{width:100%;text-align:center}\n  .coll-title{font-size:1.35rem;font-weight:700;color:var(--ink)}\n  .coll-sub{font-size:12px;color:var(--muted);margin-top:.15rem}\n  .tabs{display:flex;gap:.4rem;width:100%;background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:50px;padding:.25rem}\n  .tab{flex:1;border:none;background:none;border-radius:50px;padding:.5rem .4rem;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}\n  .tab.on{background:var(--rose);color:#fff}\n  .coll-list{width:100%;display:flex;flex-direction:column;gap:.5rem}\n  .coll-item{\n    display:flex;align-items:flex-start;gap:.7rem;width:100%;text-align:left;\n    background:#fff;border:1px solid rgba(193,122,111,.15);border-radius:14px;\n    padding:.75rem .85rem;cursor:pointer;font-family:inherit;\n    box-shadow:0 2px 10px rgba(193,122,111,.06);\n  }\n  .coll-item:active{background:var(--warm)}\n  .ci-icon{font-size:1.35rem;line-height:1.3;flex-shrink:0}\n  .ci-body{flex:1;min-width:0}\n  .ci-num{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}\n  .ci-text{font-size:12.5px;color:var(--ink);line-height:1.6;overflow-wrap:anywhere;\n    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n  .ci-star{font-size:13px;flex-shrink:0;line-height:1.6}\n  .coll-empty{font-size:13px;color:var(--muted);text-align:center;padding:1.5rem 1rem;background:#fff;border-radius:14px;border:1px dashed var(--blush);width:100%}\n  .locked-note{font-size:11.5px;color:var(--muted);text-align:center;width:100%}\n\n  /* ── FINISH ── */\n  #screen-finish{gap:1rem}\n  .finish-emoji{font-size:4.5rem;display:block;animation:jarfloat 3s ease-in-out infinite}\n  .finish-title{font-size:1.6rem;font-weight:700;color:var(--ink);line-height:1.2}\n  .finish-sub{font-size:13px;color:var(--muted);line-height:1.8;max-width:320px;margin:.25rem auto}\n  .finish-quote{\n    background:#fff;border:1px solid rgba(193,122,111,.18);\n    border-radius:16px;padding:1.25rem 1.35rem;\n    font-size:13px;color:var(--ink);line-height:1.85;\n    font-style:italic;\n    margin:.25rem 0;\n    box-shadow:0 2px 12px rgba(193,122,111,.08);\n  }\n  .finish-actions{width:100%;display:flex;flex-direction:column;gap:.5rem}\n\n  /* Toast */\n  .toast{\n    position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);\n    background:var(--ink);color:#fff;font-size:12.5px;padding:.6rem 1.1rem;border-radius:50px;\n    opacity:0;pointer-events:none;transition:all .3s;z-index:2000;max-width:calc(100vw - 2rem);text-align:center;\n  }\n  .toast.show{opacity:1;transform:translate(-50%,0)}\n\n  /* Confetti */\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n\n  @media (max-width:360px){\n    body{padding-left:1rem;padding-right:1rem}\n    .intro-jar{font-size:4.6rem;margin-bottom:1rem}\n    .result-text{font-size:14px}\n    .btn{padding:.8rem 1.25rem}\n  }\n  @media (prefers-reduced-motion:reduce){\n    .jar-note.drift,.intro-jar,.finish-emoji,.tap-hint{animation:none}\n  }\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n\n<a href=\"index.html\" class=\"back-link\">← Menu utama<\/a>\n\n<\!-- INTRO -->\n<div id=\"screen-intro\" class=\"screen active\">\n  <span class=\"intro-jar\">🫙<\/span>\n  <span class=\"intro-label\">Khusus untuk Dara<\/span>\n  <h1 class=\"intro-title\">Memory <span>Jar<\/span><\/h1>\n  <p class=\"intro-sub\">Kocok toples — dan satu gulungan akan keluar. Kayak arisan, tapi isinya alasan kenapa kamu berarti 🤍<\/p>\n  <div class=\"intro-badge\" id=\"intro-badge\">Ada <span>34<\/span> gulungan yang menunggumu<\/div>\n  <div class=\"intro-prog prog-wrap\" id=\"intro-prog\"><div class=\"prog-bar\"><div class=\"prog-fill\" id=\"intro-fill\" style=\"width:0%\"><\/div><\/div><\/div>\n  <div class=\"intro-actions\">\n    <button class=\"btn btn-rose btn-full\" id=\"btn-start\" onclick=\"startGame()\">Kocok Sekarang! 🫙<\/button>\n    <button class=\"btn btn-ghost btn-full\" id=\"btn-coll-intro\" onclick=\"openColl()\" style=\"display:none\">📜 Lihat Gulungan yang Udah Keluar<\/button>\n  <\/div>\n<\/div>\n\n<\!-- GAME -->\n<div id=\"screen-game\" class=\"screen\">\n\n  <div class=\"game-top\">\n    <span class=\"game-label\">Memory Jar<\/span>\n    <span class=\"game-count\"><span id=\"g-count\">0<\/span> / 34 keluar<\/span>\n  <\/div>\n\n  <div class=\"prog-wrap\">\n    <div class=\"prog-bar\"><div class=\"prog-fill\" id=\"prog-fill\" style=\"width:0%\"><\/div><\/div>\n  <\/div>\n\n  <button class=\"jar-wrap\" id=\"jar-wrap\" onclick=\"shakeJar()\" aria-label=\"Kocok toples\">\n    <\!-- SVG Jar -->\n    <svg class=\"jar-svg\" viewBox=\"0 0 220 290\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n      <\!-- Lid -->\n      <rect x=\"55\" y=\"14\" width=\"110\" height=\"26\" rx=\"7\" fill=\"url(#lG)\"/>\n      <rect x=\"64\" y=\"8\" width=\"92\" height=\"14\" rx=\"7\" fill=\"url(#lT)\"/>\n      <rect x=\"74\" y=\"17\" width=\"36\" height=\"3\" rx=\"1.5\" fill=\"rgba(255,255,255,.3)\"/>\n      <\!-- Jar body -->\n      <path d=\"M36 48 Q30 68 28 105 L28 235 Q28 262 52 267 L168 267 Q192 262 192 235 L192 105 Q190 68 184 48 Z\"\n        fill=\"url(#jG)\" opacity=\".85\"/>\n      <\!-- Shine left -->\n      <path d=\"M44 60 Q38 85 38 115 L38 230 Q38 255 50 258 L58 258 Q46 255 46 230 L46 115 Q46 85 52 60 Z\"\n        fill=\"rgba(255,255,255,.4)\"/>\n      <\!-- Shine top right -->\n      <ellipse cx=\"155\" cy=\"72\" rx=\"14\" ry=\"8\" fill=\"rgba(255,255,255,.1)\" transform=\"rotate(-20 155 72)\"/>\n      <\!-- Bottom glow -->\n      <ellipse cx=\"110\" cy=\"260\" rx=\"52\" ry=\"7\" fill=\"rgba(255,255,255,.1)\"/>\n      <\!-- Outline -->\n      <path d=\"M36 48 Q30 68 28 105 L28 235 Q28 262 52 267 L168 267 Q192 262 192 235 L192 105 Q190 68 184 48 Z\"\n        stroke=\"rgba(193,122,111,.35)\" stroke-width=\"1.5\" fill=\"none\"/>\n      <\!-- Shoulder line -->\n      <path d=\"M36 48 Q110 38 184 48\" stroke=\"rgba(193,122,111,.3)\" stroke-width=\"1.5\" fill=\"none\"/>\n      <defs>\n        <linearGradient id=\"jG\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n          <stop offset=\"0%\" stop-color=\"#e8c4b0\" stop-opacity=\".8\"/>\n          <stop offset=\"35%\" stop-color=\"#fdf8f4\" stop-opacity=\".7\"/>\n          <stop offset=\"70%\" stop-color=\"#f5ede0\" stop-opacity=\".65\"/>\n          <stop offset=\"100%\" stop-color=\"#c17a6f\" stop-opacity=\".6\"/>\n        <\/linearGradient>\n        <linearGradient id=\"lG\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n          <stop offset=\"0%\" stop-color=\"#c9a96e\"/>\n          <stop offset=\"100%\" stop-color=\"#a07840\"/>\n        <\/linearGradient>\n        <linearGradient id=\"lT\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n          <stop offset=\"0%\" stop-color=\"#e8cc80\"/>\n          <stop offset=\"100%\" stop-color=\"#c9a96e\"/>\n        <\/linearGradient>\n      <\/defs>\n    <\/svg>\n    <\!-- Notes inside -->\n    <div class=\"jar-inside\" id=\"jar-inside\"><\/div>\n  <\/button>\n\n  <p class=\"tap-hint\" id=\"tap-hint\">👆 Tap toples buat kocok!<\/p>\n  <p class=\"empty-msg\" id=\"empty-msg\" style=\"display:none\">Toples udah kosong! 🎉<\/p>\n\n  <div class=\"game-actions\">\n    <button class=\"chip-btn\" onclick=\"openColl()\">📜 Koleksi <b id=\"g-coll\">0<\/b><\/button>\n    <button class=\"chip-btn\" onclick=\"showIntro()\">🏠 Awal<\/button>\n  <\/div>\n<\/div>\n\n<\!-- KOLEKSI -->\n<div id=\"screen-coll\" class=\"screen\">\n  <div class=\"coll-head\">\n    <h2 class=\"coll-title\">📜 Gulungan Kamu<\/h2>\n    <p class=\"coll-sub\" id=\"coll-sub\">0 dari 34 udah keluar<\/p>\n  <\/div>\n  <div class=\"tabs\">\n    <button class=\"tab on\" id=\"tab-all\" onclick=\"setTab('all')\">Semua<\/button>\n    <button class=\"tab\" id=\"tab-fav\" onclick=\"setTab('fav')\">⭐ Favorit<\/button>\n  <\/div>\n  <div class=\"coll-list\" id=\"coll-list\"><\/div>\n  <p class=\"locked-note\" id=\"locked-note\"><\/p>\n  <button class=\"btn btn-rose btn-full\" id=\"coll-go\" onclick=\"backFromColl()\">Kocok Lagi 🫙<\/button>\n<\/div>\n\n<\!-- RESULT OVERLAY -->\n<div id=\"result-overlay\" onclick=\"handleOverlay(event)\">\n  <div class=\"result-sheet\" role=\"dialog\" aria-modal=\"true\">\n    <button class=\"result-fav\" id=\"r-fav\" onclick=\"toggleFav()\" aria-label=\"Favorit\">⭐<\/button>\n    <div class=\"result-drag\"><\/div>\n    <span class=\"result-scroll\">📜<\/span>\n    <span class=\"result-num\" id=\"r-num\">Alasan #1<\/span>\n    <span class=\"result-icon\" id=\"r-icon\">🤍<\/span>\n    <p class=\"result-text\" id=\"r-text\">...<\/p>\n    <span class=\"result-sign\">— Razan 🤍<\/span>\n    <button class=\"result-close\" id=\"r-close\" onclick=\"closeResult()\">Simpan di Hati 🤍<\/button>\n    <div class=\"result-row\">\n      <a class=\"mini-btn wa\" id=\"r-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">💬 Bales ke Razan<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- FINISH -->\n<div id=\"screen-finish\" class=\"screen\">\n  <span class=\"finish-emoji\">🫙<\/span>\n  <h2 class=\"finish-title\">Toplesnya<br>udah kosong! ✨<\/h2>\n  <p class=\"finish-sub\">Kamu udah baca semua 34 alasannya. Masih ada banyak lagi yang belum sempat aku tulis.<\/p>\n  <div class=\"finish-quote\">\n    Kalau aku harus jelasin satu per satu alasan kenapa aku sayang kamu, mungkin aku bakal kehabisan kata-kata duluan sebelum kehabisan alasan. 🤍\n  <\/div>\n  <div class=\"finish-actions\">\n    <button class=\"btn btn-rose btn-full\" onclick=\"openColl()\">📜 Baca Ulang Semua Gulungan<\/button>\n    <button class=\"btn btn-ghost btn-full\" onclick=\"restartGame()\">Isi Ulang Toples 🔄<\/button>\n    <button class=\"btn-link\" onclick=\"showIntro()\">Kembali ke Awal<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<\script>\nconst reasons = [\n  {icon:\"🌸\",text:\"Kamu selalu inget hal kecil yang aku ceritain — bahkan hal yang aku sendiri kadang udah lupa.\"},\n  {icon:\"📱\",text:\"Kamu yang pertama aku mau kabarin kalau ada sesuatu, apapun itu.\"},\n  {icon:\"🤝\",text:\"Kamu selalu hadir saat aku butuh teman cerita — tanpa harus diminta.\"},\n  {icon:\"😊\",text:\"Senyuman kamu bisa bikin hari aku yang buruk jadi lebih baik, seketika.\"},\n  {icon:\"🫂\",text:\"Kamu menerima aku apa adanya — kelebihan dan kekurangan sekaligus.\"},\n  {icon:\"✨\",text:\"Kamu bisa bikin hal yang paling biasa jadi terasa spesial.\"},\n  {icon:\"💭\",text:\"Kamu selalu berusaha memahami aku, bahkan waktu aku sendiri susah jelasinnya.\"},\n  {icon:\"🕊️\",text:\"Kamu sabar banget ngadepin sifat aku yang kadang ga gampang.\"},\n  {icon:\"💎\",text:\"Kamu bikin aku ngerasa dihargai — dan itu bukan hal kecil.\"},\n  {icon:\"⚡\",text:\"Kamu selalu kasih semangat waktu aku lagi down, tanpa nunggu aku minta.\"},\n  {icon:\"🌱\",text:\"Kamu bikin aku jadi pribadi yang lebih baik — pelan-pelan tapi pasti.\"},\n  {icon:\"🏡\",text:\"Bersama kamu, aku bisa jadi diri sendiri sepenuhnya.\"},\n  {icon:\"🎁\",text:\"Perhatian kecil yang kamu kasih selalu berasa besar buat aku.\"},\n  {icon:\"🔍\",text:\"Kamu selalu notice hal-hal yang sering dilupakan orang lain.\"},\n  {icon:\"😄\",text:\"Kamu punya cara unik buat bikin aku ketawa — yang ga bisa ditiru siapapun.\"},\n  {icon:\"❤️\",text:\"Kamu selalu peduli sama keadaan aku, bahkan waktu aku bilang 'ga apa-apa'.\"},\n  {icon:\"👂\",text:\"Kamu ga cuma dengerin — kamu beneran memahami.\"},\n  {icon:\"🛡️\",text:\"Kamu bikin aku ngerasa aman. Itu yang paling aku syukuri.\"},\n  {icon:\"🚀\",text:\"Kamu selalu dukung impian dan tujuan aku, bahkan yang terdengar jauh sekalipun.\"},\n  {icon:\"🌈\",text:\"Kamu bikin aku percaya bahwa hubungan yang sehat dan indah itu beneran ada.\"},\n  {icon:\"🤍\",text:\"Kamu ngajarin aku arti ketulusan — bukan dari kata-kata, tapi dari tindakan.\"},\n  {icon:\"⭐\",text:\"Kamu bikin aku ngerasa penting dan berarti — tanpa harus ngomong banyak.\"},\n  {icon:\"🗣️\",text:\"Kamu selalu menghargai pendapat aku, bahkan saat kita ga setuju.\"},\n  {icon:\"😁\",text:\"Kamu bisa bikin aku senyum tanpa alasan jelas — dan itu ajaib.\"},\n  {icon:\"💪\",text:\"Kamu tetap bertahan di saat keadaan ga mudah. Itu bukan hal yang semua orang bisa lakuin.\"},\n  {icon:\"🪞\",text:\"Kamu ga cuma lihat kelebihan aku — kamu juga terima kekurangan aku.\"},\n  {icon:\"🔮\",text:\"Kamu bikin masa depan terasa lebih menarik buat dibayangkan bareng.\"},\n  {icon:\"☀️\",text:\"Kamu adalah salah satu alasan aku semangat jalanin hari.\"},\n  {icon:\"📸\",text:\"Setiap kenangan sama kamu selalu punya tempat tersendiri buat aku.\"},\n  {icon:\"🌙\",text:\"Kehadiran kamu bawa ketenangan yang susah aku temuin di tempat lain.\"},\n  {icon:\"🎗️\",text:\"Kamu ngajarin aku arti kesetiaan — dengan cara yang sederhana tapi konsisten.\"},\n  {icon:\"💘\",text:\"Dari sekian banyak orang, hati aku tetap milih kamu. Selalu.\"},\n  {icon:\"🌺\",text:\"Ada ketenangan yang kamu bawa waktu kamu hadir — yang bikin semua orang di sekitar kamu ngerasa nyaman.\"},\n  {icon:\"💍\",text:\"Dari semua yang aku rasain — hal yang paling aku syukuri adalah: kamu jadi dirimu sendiri di depan aku. Dan itu lebih dari cukup. Selalu.\"},\n];\n\nconst COLORS=[\n  {bg:'rgba(193,122,111,.28)',b:'rgba(193,122,111,.55)'},\n  {bg:'rgba(201,169,110,.22)',b:'rgba(201,169,110,.55)'},\n  {bg:'rgba(181,196,177,.22)',b:'rgba(181,196,177,.55)'},\n  {bg:'rgba(196,160,168,.22)',b:'rgba(196,160,168,.55)'},\n  {bg:'rgba(160,180,196,.22)',b:'rgba(160,180,196,.55)'},\n];\n\nconst KEY='memory-jar-dara';\nconst WA='6285692740607';\nconst TOTAL=reasons.length;\n\n/* state: drawn = urutan index alasan yang udah keluar, fav = index favorit */\nlet S={drawn:[],fav:[],done:false};\nlet isShaking=false;\nlet current=null;      // index alasan yg lagi dibuka\nlet currentFresh=false; // baru keluar dari toples (bukan buka ulang)\nlet collTab='all';\nlet collFrom='screen-game';\n\nfunction load(){\n  try{\n    const d=JSON.parse(localStorage.getItem(KEY)||'null');\n    if(d&&Array.isArray(d.drawn)){\n      const seen=new Set();\n      S.drawn=d.drawn.filter(i=>Number.isInteger(i)&&i>=0&&i<TOTAL&&!seen.has(i)&&seen.add(i));\n      S.fav=Array.isArray(d.fav)?d.fav.filter(i=>Number.isInteger(i)&&i>=0&&i<TOTAL):[];\n      S.done=!!d.done;\n    }\n  }catch(e){}\n}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nfunction remainingIdx(){const s=new Set(S.drawn);const r=[];for(let i=0;i<TOTAL;i++)if(!s.has(i))r.push(i);return r}\n\nfunction showScreen(id){\n  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  window.scrollTo(0,0);\n}\n\nfunction showIntro(){\n  const n=S.drawn.length;\n  const badge=document.getElementById('intro-badge');\n  const btn=document.getElementById('btn-start');\n  const coll=document.getElementById('btn-coll-intro');\n  if(n===0){\n    badge.innerHTML='Ada <span>34<\/span> gulungan yang menunggumu';\n    btn.textContent='Kocok Sekarang! 🫙';\n    document.getElementById('intro-prog').classList.remove('show');\n    coll.style.display='none';\n  }else{\n    const left=TOTAL-n;\n    badge.innerHTML=left>0\n      ?`<span>${n}<\/span> udah keluar · tinggal <span>${left}<\/span> lagi`\n      :`Semua <span>34<\/span> gulungan udah keluar ✨`;\n    btn.textContent=left>0?'Lanjut Kocok 🫙':'Lihat Toples 🫙';\n    document.getElementById('intro-prog').classList.add('show');\n    document.getElementById('intro-fill').style.width=(n/TOTAL*100)+'%';\n    coll.style.display='block';\n  }\n  showScreen('screen-intro');\n}\n\nfunction startGame(){\n  if(S.drawn.length>=TOTAL){showScreen('screen-finish');return}\n  enterGame();\n}\nfunction enterGame(){\n  renderInsideNotes();\n  updateProgress();\n  showScreen('screen-game');\n}\n\nfunction restartGame(){\n  if(!confirm('Isi ulang toplesnya? Semua 34 gulungan balik ke dalam toples (favorit kamu tetep kesimpen kok).')) return;\n  S.drawn=[];S.done=false;save();\n  enterGame();\n}\n\n/* Render floating notes inside jar */\nfunction renderInsideNotes(){\n  const inside=document.getElementById('jar-inside');\n  inside.innerHTML='';\n  const left=TOTAL-S.drawn.length;\n  // Show up to 20 notes visually; makin sedikit sisa, makin numpuk di bawah\n  const toShow=Math.min(left,20);\n  const aW=184, aH=216;\n  const fillTop=aH*(1-Math.max(.28,Math.min(1,left/TOTAL+.15)));\n  for(let i=0;i<toShow;i++){\n    const c=COLORS[i%COLORS.length];\n    const nW=28+Math.random()*14;\n    const nH=22+Math.random()*12;\n    const x=6+Math.random()*(aW-nW-12);\n    const y=fillTop+Math.random()*Math.max(4,(aH-fillTop-nH-6));\n    const r=(Math.random()-.5)*35;\n    const dur=2.2+Math.random()*2.5;\n    const delay=Math.random()*2;\n    const drift=-(3+Math.random()*7);\n    const note=document.createElement('div');\n    note.className='jar-note drift';\n    note.style.cssText=`\n      left:${x}px;top:${y}px;width:${nW}px;height:${nH}px;\n      background:${c.bg};border:1px solid ${c.b};\n      --r:${r}deg;--dur:${dur}s;--delay:${delay}s;--d:${drift}px;\n      transform:rotate(${r}deg);\n    `;\n    inside.appendChild(note);\n  }\n}\n\n/* SHAKE & DRAW */\nfunction shakeJar(){\n  if(isShaking) return;\n  if(S.drawn.length>=TOTAL) return;\n  isShaking=true;\n  const jar=document.getElementById('jar-wrap');\n  jar.classList.remove('shaking');void jar.offsetWidth;\n  jar.classList.add('shaking');\n  try{navigator.vibrate&&navigator.vibrate([30,40,30,40,50])}catch(e){}\n  // satu gulungan \"terbang\" keluar\n  const notes=document.querySelectorAll('#jar-inside .jar-note');\n  if(notes.length){const n=notes[Math.floor(Math.random()*notes.length)];n.classList.remove('drift');n.classList.add('pop')}\n\n  setTimeout(()=>{\n    jar.classList.remove('shaking');\n    isShaking=false;\n    drawOne();\n  },520);\n}\n\nfunction drawOne(){\n  const rem=remainingIdx();\n  if(!rem.length) return;\n  const idx=rem[Math.floor(Math.random()*rem.length)];\n  S.drawn.push(idx);save();\n\n  renderInsideNotes();\n  updateProgress();\n  openResult(idx,true);\n}\n\nfunction openResult(idx,fresh){\n  current=idx;currentFresh=fresh;\n  const r=reasons[idx];\n  const order=S.drawn.indexOf(idx)+1;\n  document.getElementById('r-num').textContent=`Alasan #${order}`;\n  document.getElementById('r-icon').textContent=r.icon;\n  document.getElementById('r-text').textContent=r.text;\n  document.getElementById('r-close').textContent=fresh?'Simpan di Hati 🤍':'Tutup 🤍';\n  document.getElementById('r-wa').href='https://wa.me/'+WA+'?text='+encodeURIComponent(\n    `Razan, aku dapet gulungan #${order} dari Memory Jar 🫙\\n\\n\"${r.text}\"\\n\\n`);\n  renderFav();\n  const ov=document.getElementById('result-overlay');\n  ov.classList.remove('active');void ov.offsetWidth;\n  ov.classList.add('active');\n  document.getElementById('r-close').focus({preventScroll:true});\n}\n\nfunction renderFav(){\n  const on=S.fav.includes(current);\n  const b=document.getElementById('r-fav');\n  b.classList.toggle('on',on);\n  b.setAttribute('aria-pressed',on);\n}\nfunction toggleFav(){\n  if(current==null) return;\n  const i=S.fav.indexOf(current);\n  if(i>=0){S.fav.splice(i,1);toast('Dihapus dari favorit')}\n  else{S.fav.push(current);toast('⭐ Masuk favorit')}\n  save();renderFav();\n  if(document.getElementById('screen-coll').classList.contains('active')) renderColl();\n}\n\nfunction closeResult(){\n  const ov=document.getElementById('result-overlay');\n  if(!ov.classList.contains('active')) return;\n  ov.classList.remove('active');\n  if(currentFresh&&S.drawn.length>=TOTAL&&!S.done){\n    S.done=true;save();\n    document.getElementById('tap-hint').style.display='none';\n    document.getElementById('empty-msg').style.display='block';\n    setTimeout(()=>{\n      showScreen('screen-finish');\n      confetti();\n    },600);\n  }\n  currentFresh=false;\n}\n\nfunction handleOverlay(e){\n  if(e.target===document.getElementById('result-overlay')) closeResult();\n}\ndocument.addEventListener('keydown',e=>{\n  if(e.key==='Escape') closeResult();\n  else if((e.key===' '||e.key==='Enter')&&document.getElementById('screen-game').classList.contains('active')\n    &&!document.getElementById('result-overlay').classList.contains('active')&&e.target===document.body){\n    e.preventDefault();shakeJar();\n  }\n});\n\nfunction updateProgress(){\n  const opened=S.drawn.length;\n  const empty=opened>=TOTAL;\n  document.getElementById('g-count').textContent=opened;\n  document.getElementById('g-coll').textContent=opened;\n  document.getElementById('prog-fill').style.width=(opened/TOTAL*100)+'%';\n  document.getElementById('tap-hint').style.display=empty?'none':'block';\n  document.getElementById('empty-msg').style.display=empty?'block':'none';\n  document.getElementById('jar-wrap').classList.toggle('empty',empty);\n}\n\n/* KOLEKSI */\nfunction openColl(){\n  const act=document.querySelector('.screen.active');\n  collFrom=act?act.id:'screen-intro';\n  if(collFrom==='screen-coll') collFrom='screen-intro';\n  renderColl();\n  showScreen('screen-coll');\n}\nfunction setTab(t){\n  collTab=t;\n  document.getElementById('tab-all').classList.toggle('on',t==='all');\n  document.getElementById('tab-fav').classList.toggle('on',t==='fav');\n  renderColl();\n}\nfunction esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction renderColl(){\n  const n=S.drawn.length;\n  document.getElementById('coll-sub').textContent=`${n} dari ${TOTAL} udah keluar · ${S.fav.filter(i=>S.drawn.includes(i)).length} favorit`;\n  let list=S.drawn.map((idx,k)=>({idx,order:k+1}));\n  if(collTab==='fav') list=list.filter(o=>S.fav.includes(o.idx));\n  list.reverse(); // terbaru di atas\n  const box=document.getElementById('coll-list');\n  if(!list.length){\n    box.innerHTML=`<div class=\"coll-empty\">${collTab==='fav'\n      ?'Belum ada favorit. Tap ⭐ di gulungan yang paling kamu suka 🤍'\n      :'Belum ada gulungan yang keluar. Kocok toplesnya dulu yuk 🫙'}<\/div>`;\n  }else{\n    box.innerHTML=list.map(o=>{\n      const r=reasons[o.idx];\n      return `<button class=\"coll-item\" onclick=\"openResult(${o.idx},false)\">\n        <span class=\"ci-icon\">${esc(r.icon)}<\/span>\n        <span class=\"ci-body\"><span class=\"ci-num\">Alasan #${o.order}<\/span><span class=\"ci-text\">${esc(r.text)}<\/span><\/span>\n        ${S.fav.includes(o.idx)?'<span class=\"ci-star\">⭐<\/span>':''}\n      <\/button>`;\n    }).join('');\n  }\n  const left=TOTAL-n;\n  document.getElementById('locked-note').textContent=left>0?`🔒 ${left} gulungan lagi masih di dalam toples`:'✨ Semua gulungan udah kamu baca';\n  document.getElementById('coll-go').textContent=left>0?'Kocok Lagi 🫙':'Kembali';\n}\nfunction backFromColl(){\n  if(S.drawn.length<TOTAL) enterGame();\n  else if(collFrom==='screen-finish') showScreen('screen-finish');\n  else showIntro();\n}\n\nlet toastT;\nfunction toast(m){\n  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');\n  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);\n}\n\nfunction confetti(){\n  const colors=['#c17a6f','#e8c4b0','#c9a96e','#b5c4b1','#faf6f0'];\n  for(let i=0;i<80;i++) setTimeout(()=>{\n    const el=document.createElement('div');el.className='cp';\n    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;\n    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);\n  },i*30);\n}\n\nload();\nshowIntro();\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam game/hadiah gabungan: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>\n",
"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n<title>Lucky Dip — Untuk Dara 🎁<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--cream:#faf6f0;--warm:#f5ede0;--blush:#e8c4b0;--rose:#c17a6f;--deep:#7a3f35;--ink:#2d1f1a;--gold:#c9a96e;--muted:#9a8070;--sage:#b5c4b1;}\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Poppins',sans-serif;user-select:none}\n  html,body{min-height:100%;background:var(--cream);overflow-x:hidden}\n  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(232,196,176,.3),transparent 70%),radial-gradient(ellipse 50% 60% at 80% 80%,rgba(193,122,111,.15),transparent 70%);pointer-events:none;z-index:0}\n  .page{max-width:480px;margin:0 auto;padding:0 1.1rem calc(5rem + env(safe-area-inset-bottom));position:relative;z-index:1}\n\n  /* ── HEADER ── */\n  .back-link{position:absolute;top:calc(.9rem + env(safe-area-inset-top));left:1.1rem;z-index:5;font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.75);border:1px solid rgba(193,122,111,.18);padding:.4rem .85rem;border-radius:50px;backdrop-filter:blur(6px)}\n  .back-link:active{background:var(--warm)}\n  .header{text-align:center;padding:3.4rem 0 1.25rem}\n  .header-icon{font-size:3rem;display:block;margin-bottom:.75rem;animation:float 3s ease-in-out infinite}\n  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n  .header-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.35rem}\n  .header-title{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:700;color:var(--ink);margin-bottom:.25rem}\n  .header-title span{color:var(--rose)}\n  .header-sub{font-size:12px;color:var(--muted);line-height:1.65;max-width:280px;margin:0 auto}\n\n  /* ── FILTER ── */\n  .filter-row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.85rem 0 .6rem}\n  .filter-btn{white-space:nowrap;padding:.3rem .8rem;border-radius:50px;border:1.5px solid var(--blush);background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);transition:all .15s}\n  .filter-btn.active{color:#fff;border-color:transparent}\n  .filter-btn.active.f-all{background:var(--rose)}\n  .filter-btn.active.f-pesan{background:var(--rose)}\n  .filter-btn.active.f-kenangan{background:#a070c0}\n  .filter-btn.active.f-fakta{background:var(--gold)}\n  .filter-btn.active.f-tantangan{background:var(--sage);color:var(--ink)}\n  .filter-btn:active{transform:scale(.93)}\n  .filter-btn .fc{font-weight:500;opacity:.75;margin-left:.15rem;font-size:10px}\n\n  /* ── ACAK ── */\n  .dip-row{display:flex;justify-content:center;margin:0 0 .9rem}\n  .dip-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.4rem;border-radius:50px;border:none;cursor:pointer;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--rose),var(--gold));box-shadow:0 4px 16px rgba(193,122,111,.3);transition:transform .15s}\n  .dip-btn:active{transform:scale(.95)}\n  .dip-btn:disabled{opacity:.45;box-shadow:none;cursor:default}\n\n  /* ── PROGRESS ── */\n  .progress-bar-wrap{margin-bottom:.55rem}\n  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}\n  .progress-label{font-size:10px;color:var(--muted)}\n  .progress-count{font-size:11px;font-weight:700;color:var(--rose)}\n  .progress-bar{height:5px;background:var(--blush);border-radius:3px;overflow:hidden}\n  .progress-fill{height:100%;background:linear-gradient(to right,var(--rose),var(--gold));border-radius:3px;transition:width .5s ease}\n\n  /* ── LEGEND ── */\n  .legend{display:flex;justify-content:center;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap}\n  .legend-item{display:flex;align-items:center;gap:.3rem;font-size:10px;color:var(--muted)}\n  .legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}\n\n  /* ── GRID ── */\n  .box-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1.25rem}\n\n  /* ── BOX ── */\n  .box{aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;transition:transform .15s}\n  .box:not(.opened):active{transform:scale(.88)}\n  .box.opened{cursor:pointer}\n\n  .box-front{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;border:1.5px solid rgba(255,255,255,.25);transition:transform .32s cubic-bezier(.4,.2,.2,1),opacity .3s;backface-visibility:hidden;box-shadow:0 3px 10px rgba(45,31,26,.1)}\n  .box-back{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding:.3rem .2rem;background:#fff;border:1.5px solid rgba(193,122,111,.18);box-shadow:0 2px 10px rgba(193,122,111,.1);transform:scale(0) rotateY(90deg);transition:transform .35s cubic-bezier(.34,1.3,.64,1) .12s,opacity .2s .12s;opacity:0}\n  .box-back-icon{font-size:1.25rem;line-height:1}\n  .box-back-type{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.1rem}\n\n  .box.opened .box-front{transform:scale(0) rotateY(-90deg);opacity:0}\n  .box.opened .box-back{transform:scale(1) rotateY(0);opacity:1}\n\n  .box.chdone .box-back::after{content:'✓';position:absolute;top:3px;right:5px;font-size:10px;font-weight:700;color:#5a8a5a}\n  .box.pick{animation:pick .5s ease 2}\n  @keyframes pick{50%{transform:scale(1.12);box-shadow:0 0 0 4px rgba(201,169,110,.5);border-radius:14px}}\n  .box.shake{animation:shake .4s ease}\n  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}\n\n  /* Hidden by filter */\n  .box.hidden-filter{opacity:.2;pointer-events:none;filter:grayscale(.6)}\n\n  /* ── DETAIL SHEET ── */\n  #detail-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(45,31,26,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;padding:.85rem;padding-bottom:calc(.85rem + env(safe-area-inset-bottom))}\n  #detail-overlay.active{display:flex}\n  .detail-sheet{background:var(--cream);border-radius:26px 26px 22px 22px;padding:1.4rem 1.35rem 1.4rem;width:100%;max-width:420px;max-height:calc(100dvh - 1.7rem);overflow-y:auto;text-align:center;box-shadow:0 -6px 50px rgba(45,31,26,.18);animation:su .35s cubic-bezier(.34,1.3,.64,1)}\n  @keyframes su{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}\n  .ds-drag{width:34px;height:3.5px;background:var(--blush);border-radius:2px;margin:0 auto 1rem}\n  .ds-badge{display:inline-flex;align-items:center;gap:.35rem;border-radius:50px;padding:.28rem .85rem;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.85rem}\n  .db-pesan{background:rgba(193,122,111,.1);color:var(--rose);border:1px solid rgba(193,122,111,.2)}\n  .db-kenangan{background:rgba(160,112,192,.1);color:#7a40a0;border:1px solid rgba(160,112,192,.2)}\n  .db-fakta{background:rgba(201,169,110,.12);color:#8a6a20;border:1px solid rgba(201,169,110,.25)}\n  .db-tantangan{background:rgba(181,196,177,.2);color:#3a6040;border:1px solid rgba(181,196,177,.4)}\n  .ds-icon{font-size:2.75rem;display:block;text-align:center;margin-bottom:.65rem}\n  .ds-title{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:.55rem}\n  .ds-text{font-size:13px;color:var(--ink);line-height:1.85;text-align:center;margin-bottom:1.1rem;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}\n  .ds-num{display:block;font-size:10px;color:var(--muted);margin:-.4rem 0 .6rem}\n  .ds-actions{display:flex;gap:.5rem;margin-bottom:.6rem}\n  .ds-actions:empty{display:none}\n  .ds-act{flex:1;display:flex;align-items:center;justify-content:center;gap:.3rem;padding:.65rem .5rem;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;border:1.5px solid var(--blush);background:#fff;color:var(--deep);white-space:nowrap}\n  .ds-act.wa{border-color:rgba(37,211,102,.45);color:#1f8f4e}\n  .ds-act.done{background:rgba(181,196,177,.3);border-color:#9ab894;color:#3a6040}\n  .ds-act:active{transform:scale(.97)}\n  .ds-nav{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem}\n  .ds-nav button{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:.35rem .2rem}\n  .ds-nav button:disabled{opacity:.3;cursor:default}\n  .ds-nav span{font-size:10px;color:var(--muted)}\n  .ds-close{width:100%;padding:.875rem;border-radius:50px;border:none;cursor:pointer;font-size:14px;font-weight:600;background:var(--rose);color:#fff;box-shadow:0 4px 16px rgba(193,122,111,.32);transition:all .15s}\n  .ds-close:active{background:var(--deep);transform:scale(.97)}\n\n  /* ── DONE CARD ── */\n  #done-card{display:none;background:linear-gradient(135deg,var(--rose),var(--deep));border-radius:20px;padding:1.75rem 1.5rem;text-align:center;color:#fff;box-shadow:0 8px 30px rgba(193,122,111,.35);animation:popin .5s cubic-bezier(.34,1.3,.64,1);margin-bottom:1rem}\n  #done-card.show{display:block}\n  @keyframes popin{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}\n  .done-icon{font-size:3rem;display:block;margin-bottom:.65rem}\n  .done-title{font-size:1.2rem;font-weight:700;margin-bottom:.35rem}\n  .done-sub{font-size:12px;opacity:.85;line-height:1.7;margin-bottom:1.25rem}\n  .done-reset{padding:.8rem 2rem;border-radius:50px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}\n  .done-reset:active{background:rgba(255,255,255,.15)}\n\n  @media (max-width:360px){\n    .page{padding-left:.9rem;padding-right:.9rem}\n    .back-link{left:.9rem}\n    .box-grid{gap:.4rem}\n    .filter-btn{padding:.3rem .65rem}\n  }\n  .cp{position:fixed;border-radius:2px;animation:cf linear forwards;pointer-events:none;z-index:9999}\n  @keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}\n<\/style>\n<\script src=\"sfx.js\" defer><\/script>\n<style>html.in-hub a[href='index.html']{visibility:hidden!important}<\/style><\script>if(window.top!==window.self)document.documentElement.classList.add('in-hub')<\/script>\n<\/head>\n<body>\n<a href=\"index.html\" class=\"back-link\">← Menu utama<\/a>\n<div class=\"page\">\n\n<div class=\"header\">\n  <span class=\"header-icon\">📦<\/span>\n  <span class=\"header-label\">Untuk Dara dari Razan 🤍<\/span>\n  <h1 class=\"header-title\">Lucky <span>Dip<\/span><\/h1>\n  <p class=\"header-sub\">Klik kotak-kotak di bawah — tiap kotak isi surprise dari Razan. Pesan, kenangan, fakta lucu, atau tantangan kecil 🤍<\/p>\n<\/div>\n\n<div class=\"filter-row\">\n  <button class=\"filter-btn f-all active\" onclick=\"setFilter('all')\">Semua<span class=\"fc\" id=\"fc-all\"><\/span><\/button>\n  <button class=\"filter-btn f-pesan\" onclick=\"setFilter('pesan')\">💌 Pesan<span class=\"fc\" id=\"fc-pesan\"><\/span><\/button>\n  <button class=\"filter-btn f-kenangan\" onclick=\"setFilter('kenangan')\">📸 Kenangan<span class=\"fc\" id=\"fc-kenangan\"><\/span><\/button>\n  <button class=\"filter-btn f-fakta\" onclick=\"setFilter('fakta')\">😄 Fakta<span class=\"fc\" id=\"fc-fakta\"><\/span><\/button>\n  <button class=\"filter-btn f-tantangan\" onclick=\"setFilter('tantangan')\">🎯 Tantangan<span class=\"fc\" id=\"fc-tantangan\"><\/span><\/button>\n<\/div>\n\n<div class=\"progress-bar-wrap\">\n  <div class=\"progress-top\">\n    <span class=\"progress-label\">Kotak terbuka<\/span>\n    <span class=\"progress-count\"><span id=\"opened-count\">0<\/span> / 32<\/span>\n  <\/div>\n  <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"progress-fill\" style=\"width:0%\"><\/div><\/div>\n<\/div>\n\n<div class=\"legend\">\n  <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:var(--rose)\"><\/div>Pesan<\/div>\n  <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:#a070c0\"><\/div>Kenangan<\/div>\n  <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:var(--gold)\"><\/div>Fakta Lucu<\/div>\n  <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:var(--sage)\"><\/div>Tantangan<\/div>\n<\/div>\n\n<div class=\"dip-row\"><button class=\"dip-btn\" id=\"dip-btn\" onclick=\"randomOpen()\">🎲 Ambil Acak<\/button><\/div>\n\n<div class=\"box-grid\" id=\"box-grid\"><\/div>\n\n<div id=\"done-card\">\n  <span class=\"done-icon\">🎊<\/span>\n  <p class=\"done-title\">Semua kotak udah dibuka!<\/p>\n  <p class=\"done-sub\">Kamu udah dapet semua 32 surprise dari Razan. Makasih udah mau buka satu per satu 🤍<\/p>\n  <button class=\"done-reset\" onclick=\"resetGame()\">🔄 Reset & Buka Lagi<\/button>\n<\/div>\n\n<\/div>\n\n<\!-- DETAIL SHEET -->\n<div id=\"detail-overlay\" onclick=\"handleOverlayClick(event)\">\n  <div class=\"detail-sheet\">\n    <div class=\"ds-drag\"><\/div>\n    <div class=\"ds-badge\" id=\"ds-badge\"><\/div>\n    <span class=\"ds-icon\" id=\"ds-icon\">🎁<\/span>\n    <p class=\"ds-title\" id=\"ds-title\"><\/p>\n    <span class=\"ds-num\" id=\"ds-num\"><\/span>\n    <p class=\"ds-text\" id=\"ds-text\"><\/p>\n    <div class=\"ds-actions\" id=\"ds-actions\"><\/div>\n    <button class=\"ds-close\" onclick=\"closeDetail()\">Tutup ✓<\/button>\n    <div class=\"ds-nav\">\n      <button id=\"ds-prev\" onclick=\"navDetail(-1)\">‹ Sebelumnya<\/button>\n      <span id=\"ds-pos\"><\/span>\n      <button id=\"ds-next\" onclick=\"navDetail(1)\">Berikutnya ›<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\script>\n// ── ALL SURPRISES — 32 total (8 per category) ──\nconst SURPRISES = [\n  // 💌 PESAN (8)\n  {type:'pesan',icon:'🤍',title:'Pesan dari Razan',\n   text:'Kamu adalah orang yang tanpa sadar selalu bikin hari aku lebih berwarna — bahkan di hari yang paling biasa sekalipun.'},\n  {type:'pesan',icon:'💌',title:'Untuk Dara',\n   text:'Ada banyak hal di dunia ini yang aku ga bisa kontrol. Tapi rasa sayang aku ke kamu — itu aku jaga sepenuhnya.'},\n  {type:'pesan',icon:'🌸',title:'Satu Hal yang Kamu Perlu Tau',\n   text:'Waktu kamu lagi ngerasa ga cukup — inget bahwa di mata aku, kamu selalu lebih dari cukup. Selalu.'},\n  {type:'pesan',icon:'✨',title:'Dari Razan',\n   text:'Kalau aku harus pilih satu hal yang paling aku syukuri, jawabannya selalu sama — kamu ada di hidup aku.'},\n  {type:'pesan',icon:'🌙',title:'Pesan Malam',\n   text:'Setiap kali aku lagi capek dan ga tau harus ngapain, ngebayangin kamu aja udah cukup buat bikin semuanya terasa lebih ringan.'},\n  {type:'pesan',icon:'💞',title:'Untuk Kamu',\n   text:'Kamu bukan pilihan yang aku buat sekali. Kamu adalah pilihan yang aku buat ulang setiap harinya — dan aku ga pernah menyesal.'},\n  {type:'pesan',icon:'🫶',title:'Hal yang Jarang Aku Bilang',\n   text:'Aku notice banyak hal kecil dari kamu — cara kamu ketawa, cara kamu cerita, cara kamu ada. Dan semuanya bikin aku makin yakin.'},\n  {type:'pesan',icon:'⭐',title:'Dari Hati',\n   text:'Ga ada versi masa depan yang aku bayangkan tanpa kamu ada di dalamnya. Itu bukan lebay — itu yang aku percaya beneran.'},\n\n  // 📸 KENANGAN (8)\n  {type:'kenangan',icon:'📸',title:'Momen yang Selalu Aku Inget',\n   text:'Aku masih inget waktu pertama kali kamu ketawa beneran di depan aku — keras, genuine, tanpa ditahan. Waktu itu aku sadar kamu nyaman sama aku. Itu salah satu momen terbaik.'},\n  {type:'kenangan',icon:'🌅',title:'Kenangan Favorit',\n   text:'Ada momen-momen kecil yang buat aku sadar betapa beruntungnya aku — dan kebanyakan dari momen itu ada kamu di dalamnya.'},\n  {type:'kenangan',icon:'🍜',title:'Hal Kecil yang Aku Syukuri',\n   text:'Makan bareng sama kamu, sekecil apapun tempatnya dan sesimple apapun makanannya, selalu berasa lebih enak dari biasanya. Entah kenapa itu penting buat aku.'},\n  {type:'kenangan',icon:'🎵',title:'Lagu yang Ingetin ke Kamu',\n   text:'Ada lagu-lagu yang sekarang ga bisa aku dengerin tanpa inget kamu. Bukan karena lagunya spesial — tapi karena kamu yang bikin lagunya jadi spesial.'},\n  {type:'kenangan',icon:'🌙',title:'Momen Malam',\n   text:'Chat-chat tengah malam yang panjang dan random — tentang apapun, tentang ga ada apa-apa — itu salah satu hal yang bikin aku ngerasa paling deket sama kamu.'},\n  {type:'kenangan',icon:'😂',title:'Yang Bikin Aku Ketawa Ingetnya',\n   text:'Ada hal-hal konyol yang kamu lakuin atau bilang yang sampai sekarang masih aku inget dan masih bikin aku senyum sendiri kalau lagi ingat. Kamu ga tau betapa banyaknya itu.'},\n  {type:'kenangan',icon:'🤍',title:'Waktu Pertama Kali',\n   text:'Aku masih inget pertama kali aku sadar aku beneran sayang sama kamu. Bukan di momen dramatis — di momen yang sangat biasa. Dan itu yang bikin aku yakin itu nyata.'},\n  {type:'kenangan',icon:'🌸',title:'Hal yang Cuma Kita Tau',\n   text:'Ada jokes, reference, dan hal-hal kecil yang cuma kita yang ngerti — dan setiap kali itu muncul, aku ngerasa kita punya dunia kecil sendiri. Itu salah satu hal favorit aku dari kita.'},\n\n  // 😄 FAKTA LUCU (8)\n  {type:'fakta',icon:'😂',title:'Fakta Ilmiah tentang Kalian',\n   text:'Penelitian internal Razan (n=1, responden=dirinya sendiri) membuktikan bahwa senyum Dara memiliki efek setara dengan 3 cangkir kopi — bikin semangat dan ga mau berhenti.'},\n  {type:'fakta',icon:'🔬',title:'Penemuan Terbaru',\n   text:'Ilmuwan terkemuka bernama Razan menemukan bahwa waktu yang dihabiskan bareng Dara terasa 3x lebih cepat dari waktu biasa. Penelitian masih berlanjut dan hasilnya konsisten.'},\n  {type:'fakta',icon:'📊',title:'Data Resmi',\n   text:'Menurut survei yang diadakan Razan (peserta: hanya Razan), Dara memenangkan kategori \"Orang Paling Enak Diajak Ngobrol\" selama beberapa tahun berturut-turut tanpa saingan.'},\n  {type:'fakta',icon:'🧪',title:'Hasil Lab Perasaan',\n   text:'Kadar \"kangen\" dalam darah Razan terbukti meningkat signifikan setiap kali Dara lama ga kasih kabar. Dokter merekomendasikan dosis Dara minimal sekali sehari.'},\n  {type:'fakta',icon:'🎓',title:'Fakta Terverifikasi',\n   text:'Dara Syifa Aulia secara resmi memegang rekor dunia (versi Razan) sebagai orang yang bisa bikin Razan senyum sendiri hanya dengan satu pesan singkat.'},\n  {type:'fakta',icon:'📰',title:'Breaking News',\n   text:'BREAKING: Razan mengkonfirmasi bahwa alasan utama dia rajin bangun pagi adalah kemungkinan dapat kabar dari Dara. Narasumber menolak dikomentari lebih lanjut.'},\n  {type:'fakta',icon:'🔭',title:'Observasi Jangka Panjang',\n   text:'Setelah observasi bertahun-tahun, Razan menyimpulkan bahwa Dara adalah satu-satunya orang yang bisa bikin dia ngerasa comfortable jadi dirinya sendiri tanpa effort apapun.'},\n  {type:'fakta',icon:'🏆',title:'Rekor Dunia',\n   text:'Dara memegang rekor sebagai satu-satunya orang yang berhasil masuk ke hidup Razan dan bikin semuanya terasa lebih berwarna — tanpa sadar, tanpa usaha keras, dan tanpa bisa digantikan.'},\n\n  // 🎯 TANTANGAN (8)\n  {type:'tantangan',icon:'🎯',title:'Tantangan Kecil!',\n   text:'Kirim satu pesan ke Razan sekarang — bukan yang biasa, tapi satu hal jujur yang lagi kamu pikirin tentang dia. Ga harus panjang. Yang penting tulus.'},\n  {type:'tantangan',icon:'📸',title:'Tantangan Foto!',\n   text:'Foto dirimu sekarang — apapun ekspresinya, apapun kondisinya — dan simpan. Ini snapshot kamu hari ini saat buka kotak ini. Kirimin ke Razan kalau mau 😄'},\n  {type:'tantangan',icon:'🌟',title:'Tantangan 60 Detik!',\n   text:'Dalam 60 detik, sebutkan sebanyak mungkin hal yang kamu suka dari Razan — dalam hati atau diucapin. Hitung sendiri, jujur ya jumlahnya.'},\n  {type:'tantangan',icon:'✍️',title:'Tantangan Nulis!',\n   text:'Tulis satu kalimat tentang hari ini di notes HP kamu —    opened:false,\n    color:BOX_COLORS[s.type][i%3],\n  }));\n  openSeq=[];\n}\n\nfunction renderGrid(){\n  const grid=document.getElementById('box-grid');\n  if(!grid) return;\n  grid.innerHTML='';\n\n  boxes.forEach(box=>{\n    const el=document.createElement('div');\n    el.className='box'+(box.opened?' opened':'')+(chDone.has(box.si)?' chdone':'');\n    if(currentFilter!=='all'&&box.type!==currentFilter) el.classList.add('hidden-filter');\n    el.id='box-'+box.id;\n\n    const typeColor={pesan:'var(--rose)',kenangan:'#a070c0',fakta:'var(--gold)',tantangan:'var(--sage)'}[box.type]||'var(--rose)';\n    const catLabel={pesan:'pesan',kenangan:'kenangan',fakta:'fakta',tantangan:'tantangan'}[box.type];\n\n    el.innerHTML=`\n      <div class=\"box-front\" style=\"background:${box.color}\">\n        <span style=\"font-size:1.4rem\">📦<\/span>\n      <\/div>\n      <div class=\"box-back\">\n        <span class=\"box-back-icon\">${esc(box.icon)}<\/span>\n        <span class=\"box-back-type\" style=\"color:${typeColor}\">${catLabel}<\/span>\n      <\/div>`;\n\n    // Single onclick — checks opened state internally\n    el.addEventListener('click',()=>handleBoxClick(box.id));\n    grid.appendChild(el);\n  });\n}\n\nfunction handleBoxClick(id){\n  const box=boxes.find(b=>b.id===id);\n  if(!box) return;\n  if(box.opened){\n    showDetail(id);\n  } else {\n    openBox(id);\n  }\n}\n\nfunction openBox(id){\n  const box=boxes.find(b=>b.id===id);\n  if(!box||box.opened||box.opening) return;\n  box.opening=true;   // cegah kebuka dua kali kalau di-tap cepet\n\n  // Shake first\n  const el=document.getElementById('box-'+id);\n  if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}\n\n  setTimeout(()=>{\n    box.opened=true;\n    box.opening=false;\n    openedCount++;\n    openSeq.push(id);\n    updateCounts();\n    if(el) el.classList.add('opened');\n\n    // Update progress\n    const oc=document.getElementById('opened-count');if(oc) oc.textContent=openedCount;\n    const pf=document.getElementById('progress-fill');if(pf) pf.style.width=(openedCount/boxes.length*100)+'%';\n\n    saveState();\n    if(navigator.vibrate) navigator.vibrate(20);\n\n    // Show detail after open animation\n    setTimeout(()=>showDetail(id),380);\n\n    // Check all done\n    if(openedCount===boxes.length){\n      setTimeout(()=>{\n        const dc=document.getElementById('done-card');\n        if(dc){dc.classList.add('show');dc.scrollIntoView({behavior:'smooth',block:'nearest'});}\n        confetti();\n      },900);\n    }\n  },150);\n}\n\nfunction showDetail(id){\n  const box=boxes.find(b=>b.id===id);\n  if(!box) return;\n  currentDetailId=id;\n\n  const labelMap={pesan:'💌 Pesan',kenangan:'📸 Kenangan',fakta:'😄 Fakta Lucu',tantangan:'🎯 Tantangan'};\n  const clsMap={pesan:'db-pesan',kenangan:'db-kenangan',fakta:'db-fakta',tantangan:'db-tantangan'};\n\n  const badge=document.getElementById('ds-badge');\n  if(badge){badge.textContent=labelMap[box.type]||box.type;badge.className='ds-badge '+(clsMap[box.type]||'db-pesan');}\n\n  const icon=document.getElementById('ds-icon');if(icon) icon.textContent=box.icon;\n  const title=document.getElementById('ds-title');if(title) title.textContent=box.title;\n  const text=document.getElementById('ds-text');if(text) text.textContent=box.text;\n  renderDetailExtras(box);\n\n  const overlay=document.getElementById('detail-overlay');\n  if(overlay) overlay.classList.add('active');\n}\n\nfunction closeDetail(){\n  const overlay=document.getElementById('detail-overlay');\n  if(overlay) overlay.classList.remove('active');\n  currentDetailId=null;\n}\n\nfunction handleOverlayClick(e){\n  if(e.target===document.getElementById('detail-overlay')) closeDetail();\n}\n\nfunction renderDetailExtras(box){\n  const k=openSeq.indexOf(box.id);\n  document.getElementById('ds-num').textContent=k>=0?`Kotak ke-${k+1} yang kamu buka`:'';\n  const acts=document.getElementById('ds-actions');\n  let h='';\n  if(box.type==='tantangan'){\n    if(WA_CHALLENGE.includes(box.title))\n      h+=`<a class=\"ds-act wa\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/${WA}?text=${encodeURIComponent(`Razan, aku dapet \"${box.title}\" dari Lucky Dip 🎯\\n\\n`)}\">💬 Kerjain ke Razan<\/a>`;\n    const d=chDone.has(box.si);\n    h+=`<button class=\"ds-act${d?' done':''}\" onclick=\"toggleChDone()\">${d?'✓ Udah dikerjain':'☐ Tandai udah'}<\/button>`;\n  }else{\n    h+=`<a class=\"ds-act wa\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/${WA}?text=${encodeURIComponent(`Razan, aku buka kotak \"${box.title}\" di Lucky Dip 📦\\n\\n`)}\">💬 Bales ke Razan<\/a>`;\n  }\n  acts.innerHTML=h;\n  // navigasi antar kotak yang udah kebuka (urut dibuka)\n  const n=openSeq.length;\n  document.getElementById('ds-pos').textContent=k>=0?`${k+1} / ${n}`:'';\n  document.getElementById('ds-prev').disabled=k<=0;\n  document.getElementById('ds-next').disabled=k<0||k>=n-1;\n}\nfunction navDetail(d){\n  const k=openSeq.indexOf(currentDetailId);\n  const j=k+d;\n  if(k<0||j<0||j>=openSeq.length) return;\n  showDetail(openSeq[j]);\n}\nfunction toggleChDone(){\n  const box=boxes.find(b=>b.id===currentDetailId);\n  if(!box) return;\n  if(chDone.has(box.si)) chDone.delete(box.si); else {chDone.add(box.si);if(navigator.vibrate) navigator.vibrate(15);}\n  saveState();\n  const el=document.getElementById('box-'+box.id);\n  if(el) el.classList.toggle('chdone',chDone.has(box.si));\n  renderDetailExtras(box);\n  updateCounts();\n}\n\n// ── ACAK ──\nfunction randomOpen(){\n  const pool=boxes.filter(b=>!b.opened&&!b.opening&&(currentFilter==='all'||b.type===currentFilter));\n  if(!pool.length) return;\n  const box=pool[Math.floor(Math.random()*pool.length)];\n  const el=document.getElementById('box-'+box.id);\n  if(el){\n    el.scrollIntoView({behavior:'smooth',block:'center'});\n    el.classList.remove('pick');void el.offsetWidth;el.classList.add('pick');\n    box.opening=true;\n    setTimeout(()=>{el.classList.remove('pick');box.opening=false;openBox(box.id);},650);\n  } else openBox(box.id);\n}\n\nfunction updateCounts(){\n  const cats=['pesan','kenangan','fakta','tantangan'];\n  const tot=boxes.length, op=boxes.filter(b=>b.opened).length;\n  const fa=document.getElementById('fc-all');if(fa) fa.textContent=` ${op}/${tot}`;\n  cats.forEach(c=>{\n    const all=boxes.filter(b=>b.type===c), o=all.filter(b=>b.opened).length;\n    const el=document.getElementById('fc-'+c);if(el) el.textContent=` ${o}/${all.length}`;\n  });\n  const pool=boxes.filter(b=>!b.opened&&(currentFilter==='all'||b.type===currentFilter)).length;\n  const db=document.getElementById('dip-btn');\n  if(db){db.disabled=pool===0;db.textContent=pool===0?(op===tot?'🎉 Semua udah kebuka':'✓ Kategori ini udah kebuka semua'):'🎲 Ambil Acak';}\n}\n\n// ── FILTER ──\nfunction setFilter(f){\n  currentFilter=f;\n  // Update buttons\n  document.querySelectorAll('.filter-btn').forEach(btn=>{\n    btn.classList.remove('active');\n  });\n  const activeBtn=document.querySelector(`.filter-btn.f-${f}`);\n  if(activeBtn) activeBtn.classList.add('active');\n\n  // Update grid visibility\n  boxes.forEach(box=>{\n    const el=document.getElementById('box-'+box.id);\n    if(!el) return;\n    if(f==='all'||box.type===f) el.classList.remove('hidden-filter');\n    else el.classList.add('hidden-filter');\n  });\n  updateCounts();\n}\n\n// ── PERSIST ──\nfunction saveState(){\n  try{\n    localStorage.setItem('ld_opened',JSON.stringify(boxes.map(b=>b.opened)));\n    localStorage.setItem('ld_order',JSON.stringify(boxes.map(b=>SURPRISES.findIndex(s=>s.text===b.text))));\n    localStorage.setItem('ld_seq',JSON.stringify(openSeq));\n    localStorage.setItem('ld_chdone',JSON.stringify([...chDone]));\n  }catch(e){}\n}\n\nfunction loadState(){\n  try{\n    const opened=JSON.parse(localStorage.getItem('ld_opened'));\n    const order=JSON.parse(localStorage.getItem('ld_order'));\n    if(!opened||!order||order.length!==SURPRISES.length) return false;\n    if(new Set(order).size!==SURPRISES.length||order.some(si=>!SURPRISES[si])) return false;\n\n    // Rebuild boxes in saved order\n    boxes=order.map((si,i)=>{\n      const s=SURPRISES[si]||SURPRISES[0];\n      return {\n        ...s,\n        id:i,\n        si,\n        opened:opened[i]||false,\n        color:BOX_COLORS[s.type][i%3],\n      };\n    });\n    openedCount=boxes.filter(b=>b.opened).length;\n    // urutan buka: pakai yang kesimpen, sisanya (data lama) ditambah di belakang\n    let seq=[];try{seq=JSON.parse(localStorage.getItem('ld_seq'))||[]}catch(e){}\n    seq=seq.filter((id,k)=>boxes[id]&&boxes[id].opened&&seq.indexOf(id)===k);\n    boxes.forEach(b=>{if(b.opened&&!seq.includes(b.id)) seq.push(b.id)});\n    openSeq=seq;\n    return true;\n  }catch(e){return false;}\n}\n\nfunction resetGame(){\n  if(!confirm('Tutup lagi semua 32 kotak dan acak ulang isinya?')) return;\n  try{localStorage.removeItem('ld_opened');localStorage.removeItem('ld_order');localStorage.removeItem('ld_seq');}catch(e){}\n  openedCount=0;\n  const dc=document.getElementById('done-card');if(dc) dc.classList.remove('show');\n  const oc=document.getElementById('opened-count');if(oc) oc.textContent='0';\n  const pf=document.getElementById('progress-fill');if(pf) pf.style.width='0%';\n  buildGame();\n  renderGrid();\n  currentFilter='all';\n  setFilter('all');\n}\n\n// ── CONFETTI ──\nfunction confetti(){\n  const colors=['#c17a6f','#e8c4b0','#c9a96e','#b5c4b1','#a070c0','#faf6f0'];\n  for(let i=0;i<70;i++) setTimeout(()=>{\n    const el=document.createElement('div');el.className='cp';\n    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.5}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'}`;\n    document.body.appendChild(el);setTimeout(()=>el.remove(),5000);\n  },i*25);\n}\n\n// ── START ──\ntry{chDone=new Set((JSON.parse(localStorage.getItem('ld_chdone'))||[]).filter(i=>SURPRISES[i]));}catch(e){}\nif(!loadState()) buildGame();\ndocument.addEventListener('keydown',e=>{\n  if(!document.getElementById('detail-overlay').classList.contains('active')) return;\n  if(e.key==='Escape') closeDetail();\n  else if(e.key==='ArrowRight') navDetail(1);\n  else if(e.key==='ArrowLeft') navDetail(-1);\n});\nconst oc=document.getElementById('opened-count');if(oc) oc.textContent=openedCount;\nconst pf=document.getElementById('progress-fill');if(pf) pf.style.width=(openedCount/SURPRISES.length*100)+'%';\nrenderGrid();\nupdateCounts();\nif(openedCount===SURPRISES.length){\n  const dc=document.getElementById('done-card');if(dc) dc.classList.add('show');\n}\n<\/script>\n\n<\!-- TAMBAHAN: konfirmasi pakai panel sendiri (kotak pop-up bawaan browser suka nggak muncul di mode aplikasi) -->\n<\script>\n(function () {\n  if (window.__cfPatched) return; window.__cfPatched = true;\n  const native = window.confirm.bind(window);\n  let lastTap = null, lastTapAt = 0, bypass = null;\n  // catat tombol yang terakhir di-tap (buat dijalankan ulang setelah dikonfirmasi)\n  document.addEventListener('click', e => { lastTap = e.target; lastTapAt = Date.now(); }, true);\n  const css = document.createElement('style');\n  css.textContent = `.cf-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(45,31,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:cfFade .2s ease}\n  @keyframes cfFade{from{opacity:0}to{opacity:1}}\n  .cf{background:#faf6f0;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:1.3rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));animation:cfUp .25s ease;font-family:'Poppins',system-ui,sans-serif;text-align:center}\n  @keyframes cfUp{from{transform:translateY(100%)}to{transform:none}}\n  .cf p{font-size:14px;color:#2d1f1a;line-height:1.6;margin:0 0 1.1rem;white-space:pre-line;font-weight:500}\n  .cf button{display:block;width:100%;padding:.85rem;border-radius:50px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 .5rem}\n  .cf .cf-yes{background:#c17a6f;color:#fff}\n  .cf .cf-home{background:#fff;color:#c17a6f;border:1.5px solid #c17a6f}\n  .cf .cf-no{background:none;color:#9a8070;font-weight:500;margin:0}`;\n  document.head.appendChild(css);\n  function panel(msg, onYes) {\n    const isExit = /keluar|tutup restoran/i.test(msg);\n    const ov = document.createElement('div'); ov.className = 'cf-ov';\n    ov.innerHTML = `<div class=\"cf\"><p><\/p><button class=\"cf-yes\">${isExit ? '↺ Ya, keluar dari permainan' : 'Ya, lanjutkan'}<\/button>${isExit ? '<button class=\"cf-home\">🏠 Keluar ke menu<\/button>' : ''}<button class=\"cf-no\">Batal<\/button><\/div>`;\n    ov.querySelector('p').textContent = msg;\n    const close = () => ov.remove();\n    ov.querySelector('.cf-yes').onclick = () => { close(); onYes(); };\n    ov.querySelector('.cf-no').onclick = close;\n    if (isExit) ov.querySelector('.cf-home').onclick = () => { (window.top || window).location.href = 'index.html'; };\n    ov.addEventListener('click', e => { if (e.target === ov) close(); });\n    document.body.appendChild(ov);\n  }\n  window.confirm = function (msg) {\n    msg = String(msg == null ? '' : msg);\n    if (bypass === msg) { bypass = null; return true; }               // dijalankan ulang setelah \"Ya\"\n    const target = lastTap;\n    if (!target || Date.now() - lastTapAt > 800 || !document.contains(target)) return native(msg);   // bukan dari tap → pakai cara lama\n    panel(msg, () => { bypass = msg; target.click(); setTimeout(() => { if (bypass === msg) bypass = null; }, 500); });\n    return false;\n  };\n})();\n<\/script>\n<\script>/* di dalam game/hadiah gabungan: link menu utama buka di luar */if(window.top!==window.self){document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href=\"index.html\"]');if(a){e.preventDefault();window.top.location.href='index.html';}},true);}<\/script>\n<\/body>\n<\/html>"];
